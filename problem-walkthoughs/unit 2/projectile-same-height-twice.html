<style>

<script>
'use strict';
const $=s=>document.querySelector(s);
const height=t=>2.07+5.88*t-4.9*t*t;
const pos=t=>({x:90+480*t,y:330-height(t)*(182/3.05)});
let t=0,stage='watch',token=0,busy=false,solved=0,reveal=false,timeChosen=false;
const equations=[];
function draw(){const p=pos(t);$('#ball').setAttribute('cx',p.x);$('#ball').setAttribute('cy',p.y);$('#ballSeam').setAttribute('d',`M${p.x-10},${p.y-5}Q${p.x+4},${p.y+1} ${p.x+6},${p.y+10}M${p.x-7},${p.y+9}Q${p.x-1},${p.y} ${p.x+8},${p.y-8}`);$('#ballGlint').setAttribute('cx',p.x-4);$('#ballGlint').setAttribute('cy',p.y-5);$('#shadow').setAttribute('cx',p.x);$('#shadow').setAttribute('opacity',.15+.4*(p.y/316));let path='M90,316';for(let u=.025;u<t;u+=.025){const q=pos(u);path+='L'+q.x+','+q.y}path+='L'+p.x+','+p.y;$('#trail').setAttribute('d',path);$('#velocity').style.display='none';$('#velocityLabel').textContent='';
 $('#marks').innerHTML=stage==='watch'||stage==='count'?'':[0.2,1].map(v=>{const q=pos(v);return '<circle cx="'+q.x+'" cy="'+q.y+'" r="17" fill="none" stroke="#ffe0a1" stroke-width="2"/>'+(timeChosen?'<text x="'+q.x+'" y="'+(q.y+43)+'" text-anchor="middle" fill="#ffe0a1" font-size="22">'+v.toFixed(2)+' s</text>':'')+(reveal?'<path d="M'+q.x+','+(q.y-3)+'v'+(v===0.2?-50:50)+'" stroke="#78e3d0" stroke-width="4" marker-end="url(#arrow)"/><text x="'+q.x+'" y="'+(v===0.2?q.y-65:q.y+88)+'" text-anchor="middle" fill="#b9fff2" font-size="22">'+(v===0.2?'+3.92':'\u22123.92')+' m/s</text>':'')}).join('');
 $('#readout').textContent=busy?'Flight in progress':t===0?'Ready to shoot':'At the hoop';$('#sceneDesc').textContent=reveal?'At 0.20 seconds vertical velocity is positive, upward. At 1.00 seconds it is negative, downward.':'Basketball flight to a hoop 3.05 metres above the floor.';
}
function text(title,prompt,phase){$('#heading').textContent=title;$('#prompt').textContent=prompt;$('#feedback').textContent='';$('#choices').innerHTML='';$('#next').hidden=true;}
function next(label,fn){$('#next').hidden=false;$('#next').textContent=label;$('#next').onclick=fn}
function choices(labels,fn){labels.forEach((label,i)=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{if(busy)return;$('#choices').querySelectorAll('button').forEach(x=>x.disabled=true);fn(i)};$('#choices').appendChild(b)})}
function launch(){stage='watch';t=0;busy=true;$('#next').hidden=true;text('','','');const id=++token,start=performance.now(),duration=matchMedia('(prefers-reduced-motion: reduce)').matches?1600:4000;function tick(now){if(id!==token)return;t=1*Math.min(1,(now-start)/duration);draw();if(t<1)requestAnimationFrame(tick);else{busy=false;count()}}requestAnimationFrame(tick)}
function count(){stage='count';text('How many crossings?','How many times did the projectile cross the 3.05 m height?','Choose');draw();choices(['Once','Twice','Three times'],()=>{solve()});}
function solve(){document.querySelector('.scene').classList.add('solving');stage='direction';busy=false;solved=equations.length;text('When does it reach the hoop?','','Choose');$('#work').hidden=false;$('#work').innerHTML='<p>3.05 = 2.07 + 5.88t \u2212 4.9t\u00b2</p><p>4.9t\u00b2 \u2212 5.88t + 0.98 = 0</p><p><strong>t = 0.20 s or t = 1.00 s</strong></p>';draw();choices(['0.20 s','1.00 s'],()=>{timeChosen=true;document.querySelector('.scene').classList.remove('solving');reason()})}
function direction(){document.querySelector('.scene').classList.remove('solving');stage='direction';text('How can you tell?','Which quantity tells you whether the ball is rising or falling?','Choose');$('#work').innerHTML='<strong>Same height: t = 0.20 s and t = 1.00 s</strong>';choices(['Its height','The sign of vertical velocity','The sign of gravity'],i=>{$('#feedback').textContent=(i===1?'Correct. ':'')+'Use the sign of vertical velocity, with up defined as positive. Gravity points downward during both the rise and the fall.';next('Check the first crossing',reason)})}
function reason(){stage='reason';reveal=false;text('Rising or falling?','Which quantity tells you whether the ball is rising or falling?','Choose');$('#work').innerHTML='';$('#work').hidden=true;draw();choices(['Horizontal velocity (v\u2093)','Vertical velocity (v\u1d67)','Height (y)'],i=>{stage='done';reveal=true;$('#work').hidden=false;$('#feedback').textContent=(i===1?'Correct. ':'')+'Positive vertical velocity means rising; negative means falling.';$('#work').innerHTML='<p>At <strong>t = 0.20 s</strong>: v\u1d67 = 5.88 \u2212 9.8<strong>(0.20)</strong> = <strong>+3.92 m/s \u2192 rising</strong></p><p>At <strong>t = 1.00 s</strong>: v\u1d67 = 5.88 \u2212 9.8<strong>(1.00)</strong> = <strong>\u22123.92 m/s \u2192 falling</strong></p>';draw();next('Replay',reset);})}
function reset(){document.querySelector('.scene').classList.remove('solving');token++;busy=false;t=0;stage='watch';solved=0;reveal=false;timeChosen=false;$('#work').hidden=true;text('','','');next('Shoot',launch);draw()}
reset();
</script></body></html>
