<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horizontal Launch vs Dropped Ball</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #f1f5f9;
    }
    body {
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: Arial, Helvetica, sans-serif;
    }
    @media (max-width: 760px) {
      body { padding: 10px; }
    }
  </style>
</head>
<body>
<main class="rise-embed" style="display: contents;">
<style>
    main.rise-embed > :not(script):not(style) { border: 5px solid #285f9f !important; }
.rh{--blue:#28609f;--dark:#173f66;--bg:#edf5fb;--line:#d7e2ef;--text:#1f2937;--muted:#64748b;max-width:1260px;margin:auto;padding:10px;border-radius:20px;background:var(--blue);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
.rh,.rh *{box-sizing:border-box}.rh button{font:inherit}.rh .card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 12px 30px #0f172a22}.rh .scene{position:relative;aspect-ratio:2/1;min-height:320px;overflow:hidden;background:linear-gradient(var(--bg) 0 86%,#cbd5e1 86%)}
.rh .scene:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#0f172a12 1px,transparent 1px),linear-gradient(90deg,#0f172a12 1px,transparent 1px);background-size:48px 48px;opacity:.35}.rh .board{position:absolute;left:1%;top:2%;z-index:2;width:38%;min-height:56px;padding:10px 14px;border:2px solid #94a3b8;border-radius:12px;background:#dbeafe;font-weight:800;font-size:clamp(1rem,1.8vw,1.15rem);line-height:1.15}
.rh .ground{position:absolute;left:0;right:0;bottom:13.5%;z-index:1;border-top:2px solid #47556955}.rh .table{position:absolute;left:3.5%;top:55%;z-index:5;width:30%;height:7.5%;border-radius:8px;background:#8b5a2b;box-shadow:inset 0 -5px #0003,0 6px 12px #0f172a26}.rh .leg{position:absolute;top:62.5%;z-index:4;width:2.6%;height:24%;border-radius:0 0 6px 6px;background:#6b4423}.rh .l{left:6.5%}.rh .r{left:27.5%}
.rh svg{position:absolute;inset:0;z-index:7;width:100%;height:100%;overflow:visible;pointer-events:none}.rh .path{fill:none;stroke:#28609fb8;stroke-width:3;stroke-dasharray:9 8;stroke-linecap:round;opacity:0;transition:.2s}
.rh .ball{position:absolute;z-index:9;width:clamp(30px,3.5vw,42px);height:clamp(30px,3.5vw,42px);border-radius:50%;border:2px solid #0f172a55;box-shadow:0 4px 8px #0f172a29;will-change:left,top,transform}.rh .ball:before{content:"";position:absolute;inset:7%;border-radius:50%;background:conic-gradient(from 0deg,#fff8 0 20deg,transparent 20deg 152deg,#fff6 152deg 172deg,transparent 172deg 304deg,#fff5 304deg 324deg,transparent 324deg)}.rh .launch{background:radial-gradient(circle at 34% 30%,#fff6 0 12%,transparent 20%),radial-gradient(circle,#f0b53c,#dd8f18 62%,#9a5b10)}.rh .drop{background:radial-gradient(circle at 34% 30%,#fff6 0 12%,transparent 20%),radial-gradient(circle,#48cc76,#23ae57 62%,#16653a)}.rh .preview{z-index:10;opacity:0;pointer-events:none;box-shadow:0 0 0 3px #fff,0 6px 14px #0f172a2e;transition:opacity .14s}.rh .preview.show{opacity:.82}.rh .preview.short{opacity:.52}
.rh .banner{position:absolute;right:1%;top:3%;z-index:20;width:min(640px,60%);padding:14px;border:2px solid #28609f38;border-radius:18px;background:#fffffff5;box-shadow:0 12px 24px #0f172a1f}.rh h3{margin:0 0 8px;color:var(--dark);font-size:clamp(1.05rem,1.8vw,1.25rem)}.rh p{margin:0;color:var(--muted);line-height:1.4}.rh .choices{display:none;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.rh .choice,.rh .main{border:0;border-radius:14px;padding:12px 14px;font-weight:800;cursor:pointer}.rh .choice{min-height:52px;text-align:left;background:#eff6ff;color:var(--dark);border:1px solid #bfdbfe}.rh .choice.on,.rh .main{background:var(--blue);color:#fff}.rh button:hover,.rh button:focus-visible{transform:translateY(-1px);box-shadow:0 8px 18px #0f172a24;outline:3px solid #28609f40}.rh button:disabled{background:#94a3b8;cursor:not-allowed;transform:none;box-shadow:none;opacity:.8}.rh .bar{position:absolute;left:8%;bottom:2%;z-index:21;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.rh .help{color:var(--muted);font-size:.9rem;font-weight:700}.rh .warn{color:#b45309}.rh .fb{display:none;margin-top:12px;padding:12px;border-left:6px solid var(--blue);border-radius:12px;background:#eff6ff;line-height:1.4}.rh .fb strong{display:block;margin-bottom:4px;color:var(--dark)}.rh .good{border-color:#0f766e;background:#ecfdf5}.rh .bad{border-color:#b45309;background:#fff7ed}
@media(max-width:760px){.rh .scene{aspect-ratio:4/3}.rh .board{top:6%;width:38%;min-height:64px;padding:8px 10px}.rh .banner{top:5%;right:3%;width:min(460px,62%)}.rh .bar{left:4%;right:4%;bottom:4%}}
@media(prefers-reduced-motion:reduce){.rh *{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>

<section class="rh" data-rh aria-label="Dropped versus horizontally launched projectile interaction">
  <div class="card"><div class="scene" data-scene>
    <div class="board">Horizontal Launch Versus Vertical Motion</div><div class="ground"></div><div class="table"></div><div class="leg l"></div><div class="leg r"></div>
    <svg data-svg aria-hidden="true"><path data-fill fill="#8b5a2b"></path><path data-surface fill="none" stroke="#333" stroke-width="4" stroke-linecap="round"></path><path data-roll fill="none" stroke="none"></path><path class="path" data-path></path></svg>
    <div class="ball launch preview" data-pl aria-hidden="true"></div><div class="ball drop preview" data-pd aria-hidden="true"></div><div class="ball launch" data-launch aria-label="Ramp-launched ball"></div><div class="ball drop" data-drop aria-label="Dropped ball"></div>
    <div class="banner"><div data-text aria-live="polite"><h3>Watch the Setup</h3><p>Click start. When the orange ball leaves the edge, the green ball drops.</p></div>
      <div class="choices" data-choices aria-label="Prediction choices"><button class="choice" type="button" data-choice="drop">The dropped ball</button><button class="choice" type="button" data-choice="launch">The launched ball</button><button class="choice" type="button" data-choice="same">The same time</button></div>
      <div class="fb" data-fb aria-live="polite"></div></div>
    <div class="bar"><button class="main" type="button" data-main>Start Setup</button><span class="help" data-help></span></div>
  </div></div>
</section>

<script>
(()=>{
  const root=document.currentScript.previousElementSibling;if(!root?.matches('[data-rh]'))return;
  const $=q=>root.querySelector(q),$$=q=>[...root.querySelectorAll(q)];
  const scene=$('[data-scene]'),svg=$('[data-svg]'),fill=$('[data-fill]'),surface=$('[data-surface]'),roll=$('[data-roll]'),path=$('[data-path]'),launch=$('[data-launch]'),drop=$('[data-drop]'),pl=$('[data-pl]'),pd=$('[data-pd]'),text=$('[data-text]'),choices=$('[data-choices]'),btns=$$('[data-choice]'),main=$('[data-main]'),help=$('[data-help]'),fb=$('[data-fb]'),ground=$('.ground'),table=$('.table');
  let state='setup',picked='',busy=false,raf=0,token=0;
  const T={roll:1650,pause:280,flight:1500};
  const pt=(a,b,c,t)=>{let u=1-t;return{x:u*u*a.x+2*u*t*b.x+t*t*c.x,y:u*u*a.y+2*u*t*b.y+t*t*c.y}};
  const at=(p,len,off)=>{let n=p.getTotalLength(),L=Math.max(0,Math.min(n,len)),d=Math.min(8,n*.01),a=p.getPointAtLength(Math.max(0,L-d)),b=p.getPointAtLength(Math.min(n,L+d)),m=Math.hypot(b.x-a.x,b.y-a.y)||1,q=p.getPointAtLength(L);return{x:q.x+(b.y-a.y)/m*off,y:q.y-(b.x-a.x)/m*off}};
  const put=(el,x,y,r=0)=>{let rad=el.offsetWidth/2;el.style.left=x-rad+'px';el.style.top=y-rad+'px';el.style.transform=`rotate(${r}deg)`};
  const clearPreview=()=>[pl,pd].forEach(e=>e.classList.remove('show','short'));
  const mark=(el,q,short=false)=>{put(el,q.x,q.y);el.classList.add('show');el.classList.toggle('short',short)};
  function preview(choice){if(state!=='question'||busy)return;let L=layout(),t=L.secs*.9,lp=pos(L,t),dp=fall(L,t);clearPreview();if(choice==='drop'){mark(pd,L.dhit);mark(pl,lp,true)}else if(choice==='launch'){mark(pl,L.hit);mark(pd,dp,true)}else{mark(pl,L.hit);mark(pd,L.dhit)}}
  function draw(){
    let sr=scene.getBoundingClientRect(),tr=table.getBoundingClientRect(),r=launch.offsetWidth/2,ty=tr.top-sr.top,tl=tr.left-sr.left,te=tr.right-sr.left;
    let a={x:Math.max(r*1.15,tl+sr.width*.01),y:ty-sr.height*.25},b={x:tl+sr.width*.02,y:ty},c={x:tl+sr.width*.12,y:ty},d=`M ${a.x} ${a.y}`;
    for(let i=1;i<=36;i++){let q=pt(a,b,c,i/36);d+=` L ${q.x} ${q.y}`}
    svg.setAttribute('viewBox',`0 0 ${sr.width} ${sr.height}`);surface.setAttribute('d',d);fill.setAttribute('d',`${d} L ${a.x-r*.2} ${c.y} L ${a.x-r*.2} ${a.y+r*.8} Z`);roll.setAttribute('d',`${d} L ${te-r*.35} ${c.y}`);
  }
  function layout(){
    draw();let sr=scene.getBoundingClientRect(),r=launch.offsetWidth/2,gy=ground.getBoundingClientRect().top-sr.top-r,n=roll.getTotalLength(),start=at(roll,n*.065,r),edge=at(roll,n-1,r),origin={x:edge.x,y:edge.y+1},drop0={x:origin.x-r*.45,y:origin.y},secs=T.flight/1000,hitX=sr.width*.88,ay=2*(gy-origin.y)/(secs*secs),vx=(hitX-origin.x)/secs;
    return{r,start,origin,drop0,gy,secs,vx,ay,hit:{x:hitX,y:gy},dhit:{x:drop0.x,y:gy},rollLen:n,rollStart:n*.065};
  }
  const pos=(L,t)=>({x:L.origin.x+L.vx*t,y:L.origin.y+.5*L.ay*t*t});
  const fall=(L,t)=>({x:L.drop0.x,y:L.drop0.y+.5*L.ay*t*t});
  function guide(L){let d=`M ${L.origin.x} ${L.origin.y}`;for(let i=1;i<=20;i++){let q=pos(L,L.secs*i/20);d+=` L ${q.x} ${q.y}`}path.setAttribute('d',d)}
  function setBusy(v){busy=v;main.disabled=v;btns.forEach(b=>b.disabled=v)}
  function msg(s,w=false){help.textContent=s;help.classList.toggle('warn',w)}
  function feedback(html,ok){fb.style.display=html?'block':'none';fb.className='fb '+(ok?'good':'bad');fb.innerHTML=html||''}
  function reset(){cancelAnimationFrame(raf);token++;picked='';clearPreview();btns.forEach(b=>{b.classList.remove('on');b.setAttribute('aria-pressed','false')});let L=layout();guide(L);path.style.opacity=0;put(launch,L.start.x,L.start.y);put(drop,L.drop0.x,L.drop0.y);feedback('',false);msg('')}
  function screen(next){state=next;if(next==='setup'){text.innerHTML='<h3>Watch the Setup</h3><p>Click start. When the orange ball leaves the edge, the green ball drops.</p>';choices.style.display='none';main.textContent='Start Setup';reset()}if(next==='question'){text.innerHTML='<h3>Stop and Predict</h3><p>The launched ball has just left the table edge. Which ball will hit the ground first?</p>';choices.style.display='grid';main.textContent='Replay';path.style.opacity=1;msg('Choose your prediction.')}if(next==='done'){text.innerHTML='<h3>Result</h3><p>They hit the ground at the same time.</p>';choices.style.display='none';main.textContent='Try Again';path.style.opacity=1;let ok=picked==='same';feedback(ok?'<strong>Correct — they hit at the same time.</strong>The sideways motion changes where the orange ball lands, not how long gravity takes to pull it down.':'<strong>Not quite — they hit at the same time.</strong>Both balls have the same vertical acceleration and the same fall time.',ok);msg('Impact at the same time.')}}
  function animate(ms,fn){let my=++token,t0=performance.now();return new Promise(res=>{function step(now){if(my!==token)return;let p=Math.min(1,(now-t0)/ms);fn(p);p<1?raf=requestAnimationFrame(step):res()}raf=requestAnimationFrame(step)})}
  async function playSetup(){if(busy)return;screen('setup');setBusy(true);main.textContent='Playing setup...';msg('Watch the orange ball roll to the edge.');let L=layout(),circ=2*Math.PI*L.r;await animate(T.roll,p=>{let e=1-Math.cos(p*Math.PI/2),q=at(roll,L.rollStart+(L.rollLen-L.rollStart)*e,L.r);put(launch,q.x,q.y,(L.rollStart+L.rollLen*e)/circ*360)});guide(L);path.style.opacity=1;await animate(T.pause,p=>{let t=L.secs*(T.pause/T.flight)*p;put(launch,pos(L,t).x,pos(L,t).y,420+p*100);put(drop,fall(L,t).x,fall(L,t).y)});setBusy(false);screen('question')}
  async function reveal(){if(busy)return;clearPreview();setBusy(true);choices.style.display='none';main.textContent='Playing...';msg('Now watch the vertical motion.');let L=layout(),t0=L.secs*T.pause/T.flight,remain=T.flight-T.pause;await animate(remain,p=>{let t=t0+(L.secs-t0)*p;put(launch,pos(L,t).x,pos(L,t).y,520+p*420);put(drop,fall(L,t).x,fall(L,t).y)});put(launch,L.hit.x,L.hit.y);put(drop,L.dhit.x,L.dhit.y);setBusy(false);screen('done')}
  btns.forEach(b=>{b.setAttribute('aria-pressed','false');b.addEventListener('mouseenter',()=>preview(b.dataset.choice));b.addEventListener('mouseleave',clearPreview);b.addEventListener('focus',()=>preview(b.dataset.choice));b.addEventListener('blur',clearPreview);b.addEventListener('click',()=>{if(busy)return;clearPreview();picked=b.dataset.choice;btns.forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',x===b?'true':'false')});reveal()})});
  main.addEventListener('click',()=>state==='setup'?playSetup():state==='question'?playSetup():screen('setup'));
  addEventListener('resize',()=>screen('setup'));
  screen('setup');
})();
</script>

  </main>
</body>
</html>
