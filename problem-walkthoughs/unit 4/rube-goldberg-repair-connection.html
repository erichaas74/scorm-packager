  out+='<rect x="45" y="145" width="860" height="224" rx="18" fill="#fffbf2" stroke="#8a98aa" stroke-width="2"/>';

  out+=`<rect x="88" y="${c.alignment-29}" width="310" height="58" rx="3" fill="url(#cardboard)" stroke="${trial&&selected.key==='alignment'?accent:'#78562d'}" stroke-width="3"/><path d="M96 ${c.alignment-18}H385M96 ${c.alignment+18}H385" stroke="#78562d" stroke-width="2"/>`;
  const bx=mix(110,ok?421:540,u),by=c.alignment;
  if(progress>0&&(!trial||progress>.22))out+=`<path d="M110 ${by}H${bx}" stroke="#65768d" stroke-width="2" stroke-dasharray="5 5"/>`;
  if(trial&&selected.key==='height'){out+=text(78,97,'Release height')+`<path d="M235 125V99" stroke="#65768d" stroke-width="3" stroke-dasharray="4 3"/><path d="M260 125V${125-26*c.height}" stroke="${accent}" stroke-width="5"/>`+text(285,114,'Only height changes');}
  if(trial&&selected.key==='count'){for(let i=0;i<Math.round(c.count)-4;i++)out+=`<rect x="${326+i*46}" y="287" width="12" height="46" rx="2" fill="#fff7e9" stroke="${accent}" stroke-width="3"/>`;}
  [440,480,535,590].forEach((x,i)=>{const fall=clamp(chain*3.7-[0,.55,1.15,1.75][i]);out+=Art.topDomino(x-7,310-mix(23,5,fall),mix(14,i===0?42:58,fall),mix(46,10,fall));});
  out+=car(643+80*clamp((chain-.7)/.3),310,true)+ball(bx,by,u*600);

  out+=Art.surface(45,352,867)+'<path d="M100 140L320 330H375Q390 330 400 322L404 330Q390 340 375 339H317L94 147Z" fill="url(#cardboard)" stroke="#78562d" stroke-width="3"/><path d="M104 160V350H155V188" fill="#d8e0e9" stroke="#57677c" stroke-width="2"/>';

  const start=releasePoint(c.release),original=releasePoint(base.release);

  const bp=sidePoint(c.release,u,ok,selected);

function stop(){token++;cancelAnimationFrame(raf);}
function hideActions(){for(const id of ['start','moment','retry','next','replay'])$(id).hidden=true;}
function focus(id){$(id).focus({preventScroll:true});}
function description(){return kind==='original'?challenges[stage].original:selected.success?'The ball contacts the first domino, the domino line falls, and the last domino nudges the toy car across the nearby finish.':stage===0?'The ball passes beside the domino line.':stage===1?'The ball stops short on the rough section.':'The ball passes over the first domino; the scene freezes before further contacts.';}
function choices(){phase='predict';hideActions();$('replay').hidden=false;$('choices').hidden=false;$('choices').replaceChildren();$('feedback').hidden=true;$('reflection').hidden=true;$('prompt').textContent=challenges[stage].question;
 (orders[stage]??=shuffle(challenges[stage].choices)).forEach(option=>{const b=document.createElement('button');b.textContent=option.label;b.addEventListener('click',()=>{if(phase!=='predict')return;selected=option;kind='trial';play();});$('choices').append(b);});
 $('status').textContent='Original run frozen. Choose one change to test.';
}
function finish(){render();$('diagram-desc').textContent=description();if(kind==='original'){choices();focus('prompt');return;}
 phase='result';hideActions();$('replay').hidden=false;$('feedback').textContent=selected.feedback;$('feedback').hidden=false;$('prompt').textContent=selected.success?'Connection repaired in this example':'This trial did not repair the connection';
 if(selected.success){resolved[stage]=true;viewed[stage]=true;$('next').hidden=stage===2;$('status').textContent=stage===2?'All three repairs explored. Choose a connection to test in your device.':'Explanation viewed. Continue when ready.';
  if(stage===2){$('reflection').hidden=false;if(resolved.every(Boolean)&&viewed.every(Boolean)&&!sent){sent=true;window.parent.postMessage({type:'complete'},'*');}}focus(stage===2?'connection':'next');
 }else{$('retry').hidden=false;$('status').textContent='Try another change from the original setup.';focus('retry');}
}
function updateFrame(p){progress=p;render();$('diagram-desc').textContent=p===1?description():kind==='trial'&&p<=.22?'Only '+selected.change.toLowerCase()+' is being adjusted; the other settings stay fixed.':'The ball moves along the ramp toward the first domino.';}
function play(){stop();phase='running';progress=0;frame=0;hideActions();$('choices').hidden=true;$('choices').replaceChildren();$('feedback').hidden=true;$('feedback').textContent='';$('reflection').hidden=true;$('prompt').textContent=kind==='original'?'Watch the original connection':`Testing: ${selected.label.toLowerCase()}`;updateFrame(0);
 if($('reduced').checked){$('moment').hidden=false;$('status').textContent='Advance through four still frames.';focus('moment');return;}
 $('status').textContent=kind==='original'?'Watch where the connection fails.':'Watch the change, then its outcome.';
 const own=token,start=performance.now(),duration=kind==='original'?1800:3100;
 function tick(now){if(own!==token)return;const p=clamp((now-start)/duration);updateFrame(p);if(p===1)finish();else raf=requestAnimationFrame(tick);}raf=requestAnimationFrame(tick);
}
function setup(){stop();phase='ready';kind='original';selected=null;progress=0;hideActions();$('start').hidden=false;$('choices').replaceChildren();$('choices').hidden=true;$('feedback').hidden=true;$('feedback').textContent='';$('reflection').hidden=true;$('step').textContent=`${stage+1} / 3 · ${challenges[stage].title}`;$('prompt').textContent='Watch a short failed run first.';$('status').textContent='Observe the original setup before choosing a repair.';$('diagram-desc').textContent=stage===0?'Top view: a ball on a cardboard ramp beside a domino line leading to a toy car and finish.':'Side view: a raised ball, cardboard ramp, domino line, lightweight toy car, and nearby finish.';render();}
$('start').addEventListener('click',()=>{if(phase==='ready')play();});
$('moment').addEventListener('click',()=>{if(phase!=='running'||!$('reduced').checked)return;frame++;updateFrame([.22,.45,.65,1][frame-1]);$('status').textContent=`Still frame ${frame} of 4. `+$('diagram-desc').textContent;if(frame===4)finish();});
$('replay').addEventListener('click',()=>{if(phase==='predict'||phase==='result')play();});
$('retry').addEventListener('click',()=>{if(phase!=='result'||selected.success)return;kind='original';selected=null;progress=1;render();$('diagram-desc').textContent=challenges[stage].original;choices();focus('prompt');});
$('next').addEventListener('click',()=>{if(phase!=='result'||!resolved[stage]||stage===2)return;stage++;setup();focus('start');});
$('reset').addEventListener('click',()=>{stage=0;resolved.fill(false);viewed.fill(false);orders.length=0;$('connection').value='';$('reduced').checked=media.matches;setup();focus('start');});
$('reduced').addEventListener('change',()=>{if(phase==='running')play();});
media.addEventListener('change',event=>{if(event.matches){$('reduced').checked=true;if(phase==='running')play();}});
setup();
})();

(()=>{const d=document.getElementById('artZoom'),target=document.getElementById('artLarge'),source=document.querySelector('.scene > svg');function sync(){if(!d.open)return;const clone=source.cloneNode(true);clone.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));clone.removeAttribute('id');target.replaceChildren(clone);}d.addEventListener('toggle',sync);new MutationObserver(()=>{if(d.open)sync()}).observe(source,{childList:true,subtree:true,attributes:true,characterData:true});})();
