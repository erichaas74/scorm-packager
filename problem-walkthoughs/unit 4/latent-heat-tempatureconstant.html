<style>
*{box-sizing:border-box}html,body{background:transparent;margin:0}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#183345;line-height:1.5;padding:12px}main{max-width:940px;margin:auto;background:white;border:1px solid #dce5e9;border-radius:18px;overflow:hidden}header{padding:22px 24px 16px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:#356674;text-transform:uppercase}h1{font-size:clamp(23px,4vw,32px);line-height:1.2;margin:6px 0 10px}p{margin:0}.intro,.caption,.foot{color:#526572}.intro{font-size:15px}.visuals{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;padding:0 24px 18px}.panel{border:1px solid #dce5e9;border-radius:12px;padding:16px;min-width:0}h2{font-size:15px;margin:0 0 8px}.reading{display:flex;justify-content:space-between;align-items:center;gap:8px}.reading strong{font-size:26px;color:#176a80}.badge{font-size:12px;font-weight:700;background:#e9f4f7;padding:4px 9px;border-radius:20px}.curve{display:block;width:100%}.curve text{font-family:inherit;font-size:13px;fill:#526572}.particles{display:block;width:100%;background:#102f40;border-radius:10px;margin:10px 0}.caption{font-size:13px;min-height:60px}.foot{font-size:12px}.callout{margin:0 24px 18px;padding:14px 16px;background:#fff6dd;border-left:4px solid #b97800;border-radius:6px;min-height:112px}.callout strong{display:block;margin-bottom:4px}.callout p{font-size:14px}.graph-controls{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px;align-items:stretch}.heat-control{display:flex;flex-direction:column;align-items:center;padding-top:12px;gap:4px}.heat-control label{font-size:12px;font-weight:700;color:#176a80}.heat-control input{writing-mode:vertical-lr;direction:rtl;appearance:auto;width:44px;height:100%;min-height:130px;max-height:210px;margin:0;accent-color:#176a80;cursor:pointer}.heat-control input:focus-visible{outline:3px solid #b97800;outline-offset:2px;border-radius:6px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:600px){body{padding:6px}header{padding:18px 16px 14px}.visuals{grid-template-columns:1fr;padding:0 16px 14px;gap:12px}.callout{margin:0 16px 14px;min-height:0}.particles{max-height:220px}.caption{min-height:0}.reading strong{font-size:24px}}

main{box-shadow:0 8px 30px #18334508}header{padding-bottom:24px}.panel{border-color:#dfe8ec;border-radius:16px;background:linear-gradient(155deg,#fff,#f9fbfc);padding:18px}.visuals{grid-template-columns:1.12fr 1fr;gap:20px}.reading{justify-content:flex-start;align-items:baseline;margin:6px 0 12px}.reading strong{font-size:32px;font-variant-numeric:tabular-nums}.temperature-label{font-size:12px;color:#627985}.particle-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:16px}.particle-heading h2{margin:0}.badge{padding:6px 10px;border:1px solid #b4dce6;color:#1d6178}.badge[data-phase="1"],.badge[data-phase="2"]{background:#fff3d6;border-color:#ebd395;color:#795113}.badge[data-phase="3"],.badge[data-phase="4"]{background:#f1eafa;border-color:#d7c3eb;color:#694890}.particles{margin:0 0 14px;border:1px solid #264c62;box-shadow:inset 0 0 20px #0002;max-height:none!important}.curve text{font-size:16px}.graph-controls{grid-template-columns:36px minmax(0,1fr);gap:0;align-items:center}.heat-control{align-self:stretch;max-height:265px;padding-top:0;padding-bottom:30px}.heat-control input{width:36px;min-height:150px;max-height:240px}.heat-control label{font-size:11px;text-transform:uppercase;letter-spacing:.08em}.caption{min-height:66px;color:#385665}.callout{border-radius:12px;background:#f4f8fa;border-left-color:#147c90;min-height:110px}.callout strong{color:#19576a}.foot{font-size:11px;line-height:1.6}.panel h2{letter-spacing:.01em}@media(max-width:760px){.visuals{grid-template-columns:1fr}.particles{max-height:270px!important}.caption{min-height:0}}@media(max-width:400px){.visuals{padding:0 10px 14px}.panel{padding:12px}.graph-controls{grid-template-columns:28px minmax(0,1fr)}.heat-control input{width:28px}.curve text{font-size:18px}.particle-heading{gap:6px}.reading strong{font-size:28px}}

.heat-control{display:flex;flex-direction:row;align-items:center;align-self:auto;gap:12px;max-height:none;padding:0 4px 4px}
.heat-control label{flex:0 0 auto;font-size:12px}
.heat-control input{writing-mode:horizontal-tb;direction:ltr;width:100%;height:44px;min-height:44px;max-height:none;min-width:0;margin:0;flex:1}

<body><main>
<header><div class="eyebrow">Thermal energy · Explore</div><h1>More heat. Same temperature?</h1></header>
<div class="visuals">
<section class="panel" aria-labelledby="curve-heading"><h2 id="curve-heading">Heating curve</h2><div class="reading"><strong id="temperature">−20 °C</strong></div>
<div class="graph-controls"><svg class="curve" viewBox="-28 0 468 300" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">Temperature versus heat added</title><desc id="chart-desc">Water warms as a solid, melts at zero degrees Celsius, warms as a liquid, boils at 100 degrees, then warms as a gas. Plateau widths are illustrative, not to scale.</desc>
<defs><linearGradient id="chart-area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#16879b" stop-opacity=".18"/><stop offset="1" stop-color="#16879b" stop-opacity=".015"/></linearGradient></defs>
<g aria-hidden="true"><rect x="-21" y="25" width="12" height="223" rx="6" fill="#fff1f0" stroke="#e1abaa" stroke-width="1.5"/><rect id="thermometer-fill" x="-18" y="242" width="6" height="6" rx="3" fill="#d93838"/><circle cx="-15" cy="249" r="10" fill="#fff1f0" stroke="#e1abaa" stroke-width="1.5"/><circle cx="-15" cy="249" r="7" fill="#d93838"/><path id="temperature-guide" d="M-8 242H-2" fill="none" stroke="#d93838" stroke-width="1.5" stroke-dasharray="3 4" opacity=".7"/></g>
<rect x="65" y="20" width="359" height="230" rx="10" fill="#f5f9fb"/>
<rect x="119" y="20" width="72" height="230" fill="#fff1cf"/><rect x="281" y="20" width="90" height="230" fill="#f0eafa"/>
<g stroke="#dce7ec" stroke-dasharray="3 5"><path d="M65 32H425M65 62H425M65 137H425M65 212H425M65 242H425"/></g>
<g text-anchor="end"><text x="55" y="37">120</text><text x="55" y="67">100</text><text x="55" y="142">50</text><text x="55" y="217">0</text><text x="55" y="247">&#8722;20</text></g><text x="14" y="17">&#176;C</text>
<path d="M65 20V250H425" fill="none" stroke="#8ca6b2" stroke-width="1.5"/>
<text x="155" y="172" text-anchor="middle" style="fill:#805608;font-weight:700">Melting</text><text x="326" y="106" text-anchor="middle" style="fill:#6b4e99;font-weight:700">Boiling</text>
<path id="area" d="M65 242V250H65Z" fill="url(#chart-area)"/>
<path d="M65 242L119 212H191L281 62H371L425 32" fill="none" stroke="#c3d5dd" stroke-width="5" stroke-linejoin="round"/>
<path id="curve-progress" d="M65 242" fill="none" stroke="#147c90" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<circle id="point-halo" cx="65" cy="242" r="13" fill="#147c90" opacity=".15"/><circle id="point" cx="65" cy="242" r="7" fill="#147c90" stroke="white" stroke-width="3"/>
<text x="245" y="283" text-anchor="middle" style="font-weight:600">Heat added &#8594;</text></svg><div class="heat-control"><label for="energySlider">Heat</label><input id="energySlider" type="range" min="0" max="100" value="0" step="1" aria-orientation="horizontal" aria-label="Heat added" aria-describedby="slider-direction"></div><p class="slider-direction" id="slider-direction">Move the heat slider to the right to melt the solid, warm the liquid, and form a gas.</p></section>
<section class="panel" aria-labelledby="particle-heading"><div class="particle-heading"><h2 id="particle-heading">Particle view</h2><span class="badge" id="state">Solid ice</span></div><svg class="particles" viewBox="0 0 360 220" role="img" aria-labelledby="particle-title"><title id="particle-title">Particles in an ordered solid arrangement</title><defs><linearGradient id="chamber" x2="0" y2="1"><stop stop-color="#102b41"/><stop offset="1" stop-color="#1c4256"/></linearGradient><linearGradient id="water-fill" x2="0" y2="1"><stop stop-color="#63c9df" stop-opacity=".04"/><stop offset="1" stop-color="#63c9df" stop-opacity=".2"/></linearGradient><radialGradient id="solid-sphere" cx="30%" cy="25%" r="75%"><stop stop-color="#efffff"/><stop offset=".35" stop-color="#94e5f3"/><stop offset="1" stop-color="#3293b5"/></radialGradient><radialGradient id="liquid-sphere" cx="30%" cy="25%" r="75%"><stop stop-color="#fffbe7"/><stop offset=".35" stop-color="#ffdb82"/><stop offset="1" stop-color="#ca8a2d"/></radialGradient><radialGradient id="gas-sphere" cx="30%" cy="25%" r="75%"><stop stop-color="#fffaff"/><stop offset=".35" stop-color="#e4caff"/><stop offset="1" stop-color="#9570c4"/></radialGradient></defs><rect width="360" height="220" rx="12" fill="url(#chamber)"/><path d="M10 14V210H350V14" fill="none" stroke="#7896a6" stroke-opacity=".6" stroke-width="2"/><path id="water" d="M12 148Q96 145 180 148T348 148V208H12Z" fill="url(#water-fill)"/><path id="surface" d="M16 148 Q96 145 180 148 T344 148" fill="none" stroke="#f6c568" stroke-opacity=".4" stroke-dasharray="4 4"/><g id="bonds"></g><g id="particles"></g></svg><p class="caption" id="particle-caption"></p><aside class="callout"><strong id="explanation-title"></strong><p id="explanation"></p></aside></section></div>

<p id="announcement" class="sr-only" role="status"></p>
</main><script>
const $=id=>document.getElementById(id),slider=$('energySlider'),visited=new Set();
const ns='http://www.w3.org/2000/svg',clamp=x=>Math.max(0,Math.min(1,x));
let sent=false,q=0,time=0,last=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
const stages=[
['Solid ice','Warming the solid','Particles vibrate around fixed positions. Added heat raises their average kinetic energy and temperature.','A 5 by 5 lattice holds the vibrating molecules in a compact solid block.'],
['Ice + water','Melting at 0 \u00b0C','Heat loosens the solid structure while temperature stays constant. Intermolecular attractions are disrupted; the water molecules themselves remain intact.','Connections release as the block melts. Liquid molecules spread across the bottom of the container.'],
['Liquid water','Warming the liquid','Molecules slide past one another as short-lived attractions break and reform. Added heat raises the temperature.','Liquid molecules spread across the bottom, staying close together with loose, changing connections.'],
['Water + vapor','Boiling at 100 \u00b0C','Added heat separates molecules into a gas while temperature stays constant. More molecules leave the liquid as heat is added.','Molecules escape the liquid surface and move through the space above it.'],
['Water vapor','Warming the gas','Widely separated molecules move freely throughout the container. Added heat increases their average kinetic energy and temperature.','Unconnected gas molecules drift throughout the container.']
];
const dots=Array.from({length:25},()=>{const el=document.createElementNS(ns,'circle');el.setAttribute('r',7);el.setAttribute('stroke','white');el.setAttribute('stroke-opacity','.28');el.setAttribute('stroke-width','.7');$('particles').appendChild(el);return el;});
const links=[];
for(let i=0;i<25;i++)for(let j=i+1;j<25;j++){const el=document.createElementNS(ns,'line');el.setAttribute('stroke-width','2');$('bonds').appendChild(el);links.push({i,j,el});}
function draw(){
 const melted=clamp((q-15)/20)*25,gas=clamp((q-60)/25)*25;
 const points=dots.map((el,i)=>{
  const col=i%5,row=Math.floor(i/5),v=time*4+i*2.3;
  const type=i<Math.floor(gas)?'gas':i<Math.floor(melted)?'liquid':'solid';
  let x,y;
  if(type==='solid'){x=132+col*24+1.2*Math.sin(v);y=70+row*24+1.2*Math.cos(v*1.1);}
  else if(type==='liquid'){const liquidCol=i%10,liquidRow=Math.floor(i/10);x=30+liquidCol*33+4*Math.sin(time*.75+i*3);y=202-liquidRow*20+2.5*Math.cos(time*.9+i*2)+Math.sin(v);}
  else {x=16+328*(.5+.5*Math.sin(time*(.21+i%4*.035)+i*2.4));y=15+190*(.5+.5*Math.cos(time*(.27+i%3*.045)+i*1.7));x+=Math.sin(v);y+=Math.cos(v);}
  el.setAttribute('cx',x);el.setAttribute('cy',y);el.setAttribute('fill','url(#'+type+'-sphere)');
  return {x,y,type,col,row};
 });
 links.forEach(({i,j,el})=>{const a=points[i],b=points[j],distance=Math.hypot(a.x-b.x,a.y-b.y);let opacity=0;
  if(a.type==='solid'&&b.type==='solid'&&Math.abs(a.col-b.col)+Math.abs(a.row-b.row)===1)opacity=.7;
  else if(a.type!=='gas'&&b.type!=='gas'&&(a.type==='liquid'||b.type==='liquid')&&distance<47)opacity=.38*clamp((47-distance)/15)*(.55+.45*Math.sin(time*1.5+i+j)**2);
  el.setAttribute('opacity',opacity);if(opacity){el.setAttribute('x1',a.x);el.setAttribute('y1',a.y);el.setAttribute('x2',b.x);el.setAttribute('y2',b.y);el.setAttribute('stroke',a.type==='solid'&&b.type==='solid'?'#82d1e5':'#f6c568');el.setAttribute('stroke-dasharray',a.type==='solid'&&b.type==='solid'?'none':'3 3');}
 });
 const waterOpacity=clamp((q-15)/20)*(1-clamp((q-60)/25));
 $('surface').setAttribute('opacity',waterOpacity);$('water').setAttribute('opacity',waterOpacity);
}
function update(interacted=false){
 q=Number(slider.value);const stage=q<15?0:q<35?1:q<60?2:q<85?3:4,s=stages[stage];
 const t=q<15?-20+q*20/15:q<35?0:q<60?(q-35)*4:q<85?100:100+(q-85)*20/15;
 const temp=(Math.round(t*10)/10).toFixed(1).replace('.0','')+' \u00b0C';
 $('temperature').textContent=temp;$('state').textContent=s[0];$('explanation-title').textContent=s[1];$('explanation').textContent=s[2];$('particle-caption').textContent=s[3];$('particle-title').textContent=s[3];
 slider.setAttribute('aria-valuetext',q+' of 100 relative heat units; '+s[0]+'; '+temp);
 const x=65+q*3.6,y=212-t*1.5;
 $('thermometer-fill').setAttribute('y',y);$('thermometer-fill').setAttribute('height',248-y);$('temperature-guide').setAttribute('d','M-8 '+y+'H-2');
 $('point').setAttribute('cx',x);$('point').setAttribute('cy',y);
 $('point-halo').setAttribute('cx',x);$('point-halo').setAttribute('cy',y);
 let d='M65 242';for(const [limit,px,py] of [[15,119,212],[35,191,212],[60,281,62],[85,371,62]])if(q>=limit)d+='L'+px+' '+py;
 $('curve-progress').setAttribute('d',d+'L'+x+' '+y);$('area').setAttribute('d',d+'L'+x+' '+y+'V250H65Z');$('state').dataset.phase=stage;draw();
 if(interacted)visited.add(stage);
 if(visited.size===5&&!sent){window.parent.postMessage({ type: 'complete' }, '*');sent=true;}
}
slider.addEventListener('input',()=>update(true));slider.addEventListener('change',()=>{$('announcement').textContent=$('state').textContent+'. '+$('temperature').textContent+'. '+$('explanation').textContent;});
function frame(now){if(!paused&&!document.hidden){time+=Math.min((now-last)/1000,.05);draw();}last=now;requestAnimationFrame(frame);}
update();requestAnimationFrame(frame);
</script></body></html>
