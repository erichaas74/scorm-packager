<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose Your Thrust</title><style>

</style></head><body><main><header><h1>Choose your thrust</h1><div class="header-right"><span id="status" class="status" role="status">Original orbit</span><button id="play" class="play" aria-label="Pause animation" title="Pause animation">&#10074;&#10074;</button></div></header><nav class="levels" aria-label="Choose level"><button id="level1" aria-pressed="true">Level 1 · Try controls</button><button id="level2" aria-pressed="false">Level 2 · Match transfer</button></nav><div class="flight-layout"><div class="space"><svg viewBox="0 0 500 435" role="img" aria-labelledby="scene-title scene-desc"><title id="scene-title">Spacecraft orbit around Earth</title><desc id="scene-desc">Choose a push forward, backward, inward toward Earth, or outward away from Earth.</desc><defs><radialGradient id="space-glow" cx="48%" cy="48%" r="65%"><stop stop-color="#183f5a"/><stop offset="1" stop-color="#081726"/></radialGradient><radialGradient id="atmosphere"><stop offset=".65" stop-color="#55cfff" stop-opacity="0"/><stop offset=".82" stop-color="#55cfff" stop-opacity=".22"/><stop offset="1" stop-color="#55cfff" stop-opacity="0"/></radialGradient><linearGradient id="solar-panel" x2="1" y2="1"><stop stop-color="#90daf6"/><stop offset="1" stop-color="#3079b8"/></linearGradient><linearGradient id="craft-body" x2="1" y2="1"><stop stop-color="#fff9dc"/><stop offset="1" stop-color="#b9c8d4"/></linearGradient><radialGradient id="earth" cx="30%" cy="25%"><stop stop-color="#68c4d8"/><stop offset=".6" stop-color="#247dba"/><stop offset="1" stop-color="#113f70"/></radialGradient><marker id="arrow-v" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#6be4c9"/></marker><marker id="arrow-g" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#ffac8d"/></marker><marker id="arrow-thrust" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#ffd16f"/></marker></defs><rect width="500" height="435" fill="url(#space-glow)"/><g fill="#d7edff" opacity=".48"><circle cx="145" cy="45" r=".8"/><circle cx="380" cy="42" r="1.1"/><circle cx="460" cy="180" r=".8"/><circle cx="38" cy="245" r="1"/><circle cx="328" cy="389" r=".7"/><circle cx="168" cy="363" r="1.2"/><circle cx="420" cy="278" r=".8"/><circle cx="195" cy="90" r=".7"/><circle cx="58" cy="390" r=".7"/><circle cx="350" cy="112" r=".8"/></g><g stroke="#6c9eb5" stroke-opacity=".09" fill="none"><circle cx="250" cy="220" r="135"/><circle cx="250" cy="220" r="180"/><path d="M20 220H480M250 15V415"/></g><g fill="#fff" opacity=".4"><circle cx="35" cy="60" r="1.5"/><circle cx="440" cy="75" r="1"/><circle cx="410" cy="355" r="1.5"/><circle cx="80" cy="340" r="1"/><circle cx="300" cy="30" r="1.5"/><circle cx="110" cy="115" r="1"/></g><circle cx="250" cy="220" r="100" fill="none" stroke="#678695" stroke-dasharray="4 6"/><circle id="target" cx="250" cy="220" r="200" fill="none" stroke="#ffd16f" stroke-width="2" stroke-dasharray="6 6" visibility="hidden"/><path id="transfer-guide" fill="none" stroke="#ffd16f" stroke-width="2" stroke-dasharray="5 6"/><circle id="burn2-dot" cx="50" cy="220" r="5" fill="#ffd16f" visibility="hidden"/><path id="preview" fill="none" stroke="#71cfe4" stroke-opacity=".23" stroke-width="2"/><path id="thrust-arrow" fill="none" stroke="#ffd16f" stroke-width="4" marker-end="url(#arrow-thrust)"/><g id="burn-points" fill="#ffd16f"><circle cx="350" cy="220" r="4"/><circle cx="250" cy="120" r="4"/><circle cx="150" cy="220" r="4"/><circle cx="250" cy="320" r="4"/></g><circle id="next-burn" cx="250" cy="120" r="10" fill="none" stroke="#ffd16f" stroke-width="2" visibility="hidden"/><path id="trail" fill="none" stroke="#86e2f2" stroke-width="3" stroke-linecap="round"/><circle cx="250" cy="220" r="57" fill="url(#atmosphere)"/><circle cx="250" cy="220" r="40.96" fill="url(#earth)"/><path transform="translate(75 66) scale(.7)" d="M218 183Q248 164 253 189L238 207L252 221L242 239L227 220L210 213ZM266 224L289 217L284 248L266 260L260 244Z" fill="#79c9ab" opacity=".65"/><g stroke="#c2f2ff" fill="none" stroke-opacity=".16" stroke-width=".8"><ellipse cx="250" cy="220" rx="22" ry="40"/><ellipse cx="250" cy="220" rx="40" ry="13"/></g><path d="M225 196Q241 187 255 197M261 235Q273 232 280 222" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/><circle cx="250" cy="220" r="40.96" fill="none" stroke="#8fe4ff" stroke-opacity=".45"/><text x="250" y="280" text-anchor="middle" fill="#b4d2e0" font-size="13">Earth</text><path id="v-arrow" stroke="#6be4c9" stroke-width="2.5" marker-end="url(#arrow-v)"/><path id="g-arrow" stroke="#ffac8d" stroke-width="2.5" marker-end="url(#arrow-g)"/><g id="exhaust" visibility="hidden"><ellipse cx="0" cy="30" rx="18" ry="32" fill="#ff8b2c" opacity=".2"/><path d="M-6 9Q-16 29 0 65Q16 29 6 9Z" fill="#ff6531"/><path d="M-5 9Q-10 25 0 52Q10 25 5 9Z" fill="#ffbc3e"/><path d="M-3 9Q-5 20 0 36Q5 20 3 9Z" fill="#fff5cf"/><path d="M-4 9H4" stroke="#d7e6ee" stroke-width="3"/></g><g id="craft"><path d="M0 -20L-4 -13H4Z" fill="#6be4c9"/><circle r="23" fill="#b9e9ff" opacity=".06"/><path d="M-19 0H19" stroke="#c9d9e6" stroke-width="3"/><rect x="-21" y="-8" width="14" height="16" rx="1.5" fill="url(#solar-panel)" stroke="#b3e5f8" stroke-width=".7"/><rect x="7" y="-8" width="14" height="16" rx="1.5" fill="url(#solar-panel)" stroke="#b3e5f8" stroke-width=".7"/><path d="M-14 -8V8M14 -8V8M-21 0H-7M7 0H21" stroke="#244f7e" stroke-width=".7"/><rect x="-6" y="-9" width="12" height="18" rx="3" fill="url(#craft-body)" stroke="#fff" stroke-width=".7"/><circle cy="-3" r="2.5" fill="#385f7d"/><path d="M0 -9V-14M-4 -14H4" stroke="#dfeaf1" stroke-width="1.2"/></g></svg></div><section class="thruster-panel" aria-label="Thruster direction"><p class="instruction" id="instruction">Choose a push. Each starts at the gold dot.</p><div id="match-panel" hidden><div class="match-heading"><span id="match-label">Direction match</span><strong id="match-value">0%</strong></div><progress id="match-meter" max="100" value="0" aria-label="Direction match to perfect"></progress><p id="match-detail"></p></div><div class="control-frame">Select a thruster on the ship</div><div class="ship-control"><svg viewBox="0 0 300 300" aria-hidden="true"><rect x="34" y="121" width="64" height="62" rx="5" fill="#4b91bb" stroke="#a3dbf2" stroke-width="2"/><rect x="202" y="121" width="64" height="62" rx="5" fill="#4b91bb" stroke="#a3dbf2" stroke-width="2"/><path d="M55 121V183M77 121V183M223 121V183M245 121V183M34 151H98M202 151H266" stroke="#b4ddef" opacity=".5"/><path d="M98 150H202" stroke="#8cabbf" stroke-width="9"/><path d="M150 69Q120 90 117 111V190Q150 216 183 190V111Q180 90 150 69Z" fill="#dce8ef" stroke="#7e9caf" stroke-width="2"/><circle cx="150" cy="116" r="12" fill="#326582"/><path d="M137 155H163M137 166H163" stroke="#93aabb" stroke-width="3"/><path id="diagram-fire" d="M140 202Q130 225 150 246Q170 225 160 202Z" fill="#ff9d3d" visibility="hidden"/><text x="150" y="20" text-anchor="middle" font-size="11" fill="#456575">Nose faces along motion</text></svg><button class="engine nose" data-direction="backward" aria-pressed="false" aria-label="Fire nose thruster">Nose</button><button class="engine rear" data-direction="forward" aria-pressed="false" aria-label="Fire rear thruster">Rear</button><button class="engine earth-side" data-direction="outward" aria-pressed="false" aria-label="Fire Earth-facing thruster">Earth-facing</button><button class="engine outer-side" data-direction="inward" aria-pressed="false" aria-label="Fire outward-facing thruster">Outer side</button></div><button class="ship-reset" data-direction="none" aria-pressed="true">Reset</button><div class="level-actions"><button id="continue" hidden>Level 2 →</button><button id="skip" hidden>Go to second burn →</button></div><p class="key" id="key">Gold arrow = push · Dashed circle = original orbit</p></section></div></main><script>
const $=id=>document.getElementById(id),seen=new Set();let points=[],cursor=0,last=0,sent=false,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
const directions={none:{vx:0,vy:1,dx:0,dy:0,text:'Original orbit'},forward:{vx:0,vy:1.15,dx:0,dy:-50,text:'Forward: reaches farther'},backward:{vx:0,vy:.85,dx:0,dy:50,text:'Backward: dips closer'},inward:{vx:-.15,vy:1,dx:-50,dy:0,text:'Inward: dips inward first'},outward:{vx:.15,vy:1,dx:50,dy:0,text:'Outward: moves outward first'}};
// Equal one-time velocity changes at the same point; normalized GM = r = 1.
function orbit(vx0,vy0){let x=1,y=0,vx=vx0,vy=vy0;const a=1/(2-vx*vx-vy*vy),dt=2*Math.PI*Math.sqrt(a**3)/2400,list=[];for(let i=0;i<=2400;i++){list.push({x,y,vx,vy});const r=Math.hypot(x,y),ax=-x/r**3,ay=-y/r**3;x+=vx*dt+ax*dt*dt/2;y+=vy*dt+ay*dt*dt/2;const rn=Math.hypot(x,y);vx+=(ax-x/rn**3)*dt/2;vy+=(ay-y/rn**3)*dt/2;}return list;}
const xy=p=>[250+p.x*100,220-p.y*100];
const path=list=>list.filter((_,i)=>i%4===0).map((p,i)=>(i?'L':'M')+xy(p).join(' ')).join(' ');
function draw(){const p=points[Math.floor(cursor)],[x,y]=xy(p),r=Math.hypot(p.x,p.y),v=Math.hypot(p.vx,p.vy);$('craft').setAttribute('transform',`translate(${x} ${y}) rotate(${Math.atan2(p.vx,p.vy)*180/Math.PI})`);$('trail').setAttribute('d',path(points.slice(0,Math.floor(cursor)+1)));$('g-arrow').setAttribute('d',`M${x} ${y}l${-p.x/r*28} ${p.y/r*28}`);$('v-arrow').setAttribute('d',`M${x} ${y}l${p.vx/v*32} ${-p.vy/v*32}`);}
let flightPhase='idle',pendingDirection='none',pendingPath=[],burnElapsed=0,nextBurnIndex=600;
function lockDirections(locked){document.querySelectorAll('[data-direction]').forEach(b=>b.disabled=locked&&b.dataset.direction!=='none');}
function explore(name,interacted=true){lightEngine('none');if(level===1&&(flightPhase==='burn'||flightPhase==='depart')&&name!=='none')return;const d=directions[name];pendingDirection=name;pendingPath=orbit(d.vx,d.vy);burnElapsed=0;$('exhaust').setAttribute('visibility','hidden');$('preview').setAttribute('d','');$('preview').setAttribute('stroke-opacity','.5');$('thrust-arrow').setAttribute('d','');
 // Changing the queued direction never restarts the approach lap.
 if(flightPhase!=='approach'||name==='none'){points=orbit(0,1);cursor=0;flightPhase='approach';if(!matchMedia('(prefers-reduced-motion: reduce)').matches){paused=false;label();}}
 nextBurnIndex=(Math.floor(cursor/600)+1)*600;const theta=nextBurnIndex/2400*2*Math.PI;$('next-burn').setAttribute('cx',250+100*Math.cos(theta));$('next-burn').setAttribute('cy',220-100*Math.sin(theta));$('next-burn').setAttribute('visibility',name==='none'?'hidden':'visible');$('status').textContent=name==='none'?'Orbiting ? choose a thrust':'Next: '+engineNames[name]+' thruster';$('instruction').textContent='Select a thruster. It fires at the next gold dot.';$('scene-desc').textContent='The selected direction fires once at the next marked point. Directions follow the ship, wherever it is in the orbit.';document.querySelectorAll('[data-direction]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.direction===name)));lockDirections(false);draw();}
function beginBurn(){lightEngine(pendingDirection);lockDirections(true);const theta=nextBurnIndex/2400*2*Math.PI,c=Math.cos(theta),s=Math.sin(theta),d=directions[pendingDirection];pendingPath=orbit(d.vx,d.vy).map(p=>({x:p.x*c-p.y*s,y:p.x*s+p.y*c,vx:p.vx*c-p.vy*s,vy:p.vx*s+p.vy*c}));$('preview').setAttribute('d',path(pendingPath));flightPhase='burn';burnElapsed=0;points=[{x:c,y:s,vx:-s,vy:c}];cursor=0;draw();const [x,y]=xy(points[0]);const ux=(d.dx/50)*c-(-d.dy/50)*s,uy=(d.dx/50)*s+(-d.dy/50)*c;$('thrust-arrow').setAttribute('d',`M${x} ${y}l${ux*50} ${-uy*50}`);const angle=Math.atan2(ux,uy)*180/Math.PI;$('exhaust').setAttribute('transform',`translate(${x} ${y}) rotate(${angle})`);$('exhaust').setAttribute('visibility','visible');$('status').textContent='Thruster firing';$('instruction').textContent='One short burn. Flame points opposite the push.';}
function endBurn(){lightEngine('none');flightPhase='depart';points=pendingPath;cursor=0;$('exhaust').setAttribute('visibility','hidden');$('thrust-arrow').setAttribute('d','');$('status').textContent=directions[pendingDirection].text;$('instruction').textContent='Engines off. Wait for the ship to return, or Reset.';seen.add(pendingDirection);$('continue').hidden=seen.size!==4;finish();draw();}
function label(){$('play').textContent=paused?'▶':'❚❚';$('play').setAttribute('aria-label',paused?'Play animation':'Pause animation');$('play').title=paused?'Play animation':'Pause animation';}
document.querySelectorAll('[data-direction]').forEach(b=>b.onclick=()=>choose(b.dataset.direction));$('play').onclick=()=>{paused=!paused;label();};
let level=1,stage='ready',transferComplete=false,firstMatches=[null,null];
function showMatch(score,final=false){$('match-panel').hidden=false;$('match-meter').value=score;$('match-value').textContent=score+'%';$('match-label').textContent=final?'First-try match to perfect':'Thruster match';$('match-detail').textContent=final?(score===100?'Perfect on both burns!':'Average of your first push at each burn. Reset to beat it.'):(score===100?'Perfect direction!':score===50?'Halfway: your push is perpendicular to the ideal push.':'Opposite direction. Try turning your push around.');}
function finish(){if(seen.size===4&&transferComplete&&!sent){window.parent.postMessage({ type: 'complete' }, '*');sent=true;}}
function transfer(){const a=1.5,e=1/3;return Array.from({length:1201},(_,i)=>{const M=Math.PI*i/1200;let E=M;for(let n=0;n<8;n++)E-=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));const rate=1/Math.sqrt(a**3)/(1-e*Math.cos(E));return {x:a*(Math.cos(E)-e),y:a*Math.sqrt(1-e*e)*Math.sin(E),vx:-a*Math.sin(E)*rate,vy:a*Math.sqrt(1-e*e)*Math.cos(E)*rate};});}
let engineTimer;
const engineNames={forward:'rear',backward:'nose',inward:'outer-side',outward:'Earth-facing',none:'none'};
function lightEngine(name){clearTimeout(engineTimer);document.querySelectorAll('.engine').forEach(b=>b.classList.toggle('firing',b.dataset.direction===name));const angles={forward:0,backward:180,inward:-90,outward:90};$('diagram-fire').setAttribute('visibility',name==='none'?'hidden':'visible');$('diagram-fire').setAttribute('transform',`rotate(${angles[name]||0} 150 150)`);}
function panel(far=false){document.querySelectorAll('[data-direction]').forEach(b=>{b.disabled=stage==='coast'&&b.dataset.direction!=='none';b.setAttribute('aria-pressed','false');});}
function setLevel(n){lightEngine('none');$('next-burn').setAttribute('visibility','hidden');$('burn-points').setAttribute('visibility',n===1?'visible':'hidden');flightPhase='idle';$('exhaust').setAttribute('visibility','hidden');level=n;stage='ready';firstMatches=[null,null];$('match-panel').hidden=true;$('level1').setAttribute('aria-pressed',String(n===1));$('level2').setAttribute('aria-pressed',String(n===2));$('target').setAttribute('visibility',n===2?'visible':'hidden');$('burn2-dot').setAttribute('visibility',n===2?'visible':'hidden');$('transfer-guide').setAttribute('d',n===2?path(transfer()):'');$('skip').hidden=true;$('continue').hidden=n!==1||seen.size!==4;panel();
 if(n===1){$('instruction').textContent='Try all four pushes. Each starts at the gold dot.';$('key').textContent='Gold arrow = push · Dashed circle = original orbit';explore('none',false);}
 else {points=[{x:1,y:0,vx:0,vy:1}];cursor=0;paused=true;label();$('preview').setAttribute('d','');$('thrust-arrow').setAttribute('d','');$('status').textContent='Burn 1 of 2';$('instruction').textContent='Match the gold path. Which thruster should fire?';$('key').textContent='Hohmann transfer · Choose the direction; burn strength is set.';draw();}
}
function arrival(){cursor=points.length-1;stage='arrival';paused=true;label();$('skip').hidden=true;$('status').textContent='Burn 2 of 2';$('instruction').textContent='At the far side, choose a thruster to join the gold circle.';panel(true);draw();}
function choose(name,interacted=true){if(level===1){explore(name,interacted);return;}if(name==='none'){setLevel(2);return;}if(stage==='coast'||stage==='done')return;
 const burnIndex=stage==='ready'?0:1,score=name==='forward'?100:name==='backward'?0:50;if(firstMatches[burnIndex]===null)firstMatches[burnIndex]=score;showMatch(score);
 if(name!=='forward'){$('instruction').textContent=stage==='ready'?'Not a match. Try pushing along the spacecraft’s motion.':'Not a match. The rear engine adds speed along the motion.';return;}
 if(stage==='ready'){lightEngine('forward');engineTimer=setTimeout(()=>lightEngine('none'),1400);stage='coast';points=transfer();cursor=0;paused=false;label();$('status').textContent='Coasting';$('instruction').textContent='Matched! Coast to the second gold dot.';$('thrust-arrow').setAttribute('d','M350 220l0 -45');$('skip').hidden=false;panel();draw();}
 else {lightEngine('forward');engineTimer=setTimeout(()=>lightEngine('none'),1400);stage='done';points=Array.from({length:2401},(_,i)=>{const a=Math.PI+i*2*Math.PI/2400;return {x:2*Math.cos(a),y:2*Math.sin(a),vx:-Math.sin(a)/Math.sqrt(2),vy:Math.cos(a)/Math.sqrt(2)};});cursor=0;paused=false;label();$('thrust-arrow').setAttribute('d','M50 220l0 45');$('status').textContent='Transfer matched!';$('instruction').textContent='Two rear-engine burns. One higher circular orbit.';transferComplete=true;showMatch(Math.round((firstMatches[0]+firstMatches[1])/2),true);finish();panel(true);document.querySelectorAll('[data-direction]').forEach(b=>b.disabled=b.dataset.direction!=='none');draw();}
}
$('level1').onclick=()=>setLevel(1);$('level2').onclick=$('continue').onclick=()=>setLevel(2);$('skip').onclick=arrival;
function frame(now){if(!paused&&!document.hidden){const elapsed=Math.min(now-last,50),step=elapsed*.24;if(level===1&&flightPhase==='approach'){if(pendingDirection!=='none'){cursor=Math.min(nextBurnIndex,cursor+step);draw();if(cursor>=nextBurnIndex)beginBurn();}else{cursor=(cursor+step)%(points.length-1);draw();}}else if(level===1&&flightPhase==='burn'){burnElapsed+=elapsed;if(burnElapsed>=1400)endBurn();}else if(level===1&&flightPhase==='depart'){cursor=Math.min(points.length-1,cursor+step);draw();if(cursor>=points.length-1){flightPhase='returned';paused=true;label();lockDirections(false);$('status').textContent='Back at the burn point';$('instruction').textContent='Orbit complete. Choose a direction to start another lap.';}}else if(level===2&&stage==='coast'){cursor=Math.min(points.length-1,cursor+step);draw();if(cursor>=points.length-1)arrival();}else if(level===2&&points.length>1){cursor=(cursor+step)%(points.length-1);draw();}}last=now;requestAnimationFrame(frame);}setLevel(1);label();requestAnimationFrame(frame);
</script></body></html>
