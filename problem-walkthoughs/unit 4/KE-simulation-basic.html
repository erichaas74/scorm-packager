<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinetic Energy Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 800px;
            padding: 1rem;
        }
        .simulation-box {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
        }
        .simulation-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        canvas {
            display: block;
            width: 100%;
            height: 90px;
            background-color: #e5e7eb;
        }
        .info-panel {
            padding: 0.5rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #e5e7eb;
            background: #f9fafb;
        }
        .feedback-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 10;
        }
        .feedback-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .energy-bar-container {
            width: 100px;
            height: 12px;
            background: #d1d5db;
            border-radius: 6px;
            overflow: hidden;
            margin-left: 1rem;
        }
        .energy-bar {
            height: 100%;
            background: #3b82f6;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="text-center mb-4">
            <h1 class="text-2xl font-bold text-gray-800 mb-1">Kinetic Energy Comparison</h1>
            <p class="text-gray-600 text-sm">Kinetic Energy (KE) = ½ × mass × velocity²</p>
            <p class="text-gray-600 mt-1 text-sm font-medium">Click on the scenario you think has the <span class="text-blue-600 font-bold">MOST</span> kinetic energy.</p>
        </header>

        <!-- Scenario 1 -->
        <div class="simulation-box" id="scenario-1" onclick="checkAnswer(1)">
            <canvas id="canvas-1"></canvas>
            <div class="info-panel">
                <div>
                    <span class="font-semibold text-gray-700 block text-lg">Velocity: 1 m/s</span>
                </div>
                <div class="flex items-center opacity-0 transition-opacity duration-300" id="indicator-1">
                    <span class="text-xs font-bold text-gray-500 uppercase">KE Indicator</span>
                    <div class="energy-bar-container">
                        <div class="energy-bar" id="bar-1" style="width: 0%;"></div>
                    </div>
                </div>
            </div>
            <div class="feedback-overlay" id="feedback-1">
                <h3 class="text-xl font-bold text-gray-800 mb-1" id="result-title-1">Result</h3>
                <p class="text-gray-600 text-sm text-center px-4 leading-tight" id="result-desc-1">Details here.</p>
                <button class="mt-2 px-3 py-1 text-sm bg-blue-500 text-white rounded hover:bg-blue-600 transition" onclick="resetSim(event)">Try Again</button>
            </div>
        </div>

        <!-- Scenario 2 -->
        <div class="simulation-box" id="scenario-2" onclick="checkAnswer(2)">
            <canvas id="canvas-2"></canvas>
            <div class="info-panel">
                <div>
                    <span class="font-semibold text-gray-700 block text-lg">Velocity: 2 m/s</span>
                </div>
                <div class="flex items-center opacity-0 transition-opacity duration-300" id="indicator-2">
                    <span class="text-xs font-bold text-gray-500 uppercase">KE Indicator</span>
                    <div class="energy-bar-container">
                        <div class="energy-bar" id="bar-2" style="width: 0%;"></div>
                    </div>
                </div>
            </div>
            <div class="feedback-overlay" id="feedback-2">
                <h3 class="text-xl font-bold text-gray-800 mb-1" id="result-title-2">Result</h3>
                <p class="text-gray-600 text-sm text-center px-4 leading-tight" id="result-desc-2">Details here.</p>
                <button class="mt-2 px-3 py-1 text-sm bg-blue-500 text-white rounded hover:bg-blue-600 transition" onclick="resetSim(event)">Try Again</button>
            </div>
        </div>

        <!-- Scenario 3 -->
        <div class="simulation-box" id="scenario-3" onclick="checkAnswer(3)">
            <canvas id="canvas-3"></canvas>
            <div class="info-panel">
                <div>
                    <span class="font-semibold text-gray-700 block text-lg">Velocity: 3 m/s</span>
                </div>
                <div class="flex items-center opacity-0 transition-opacity duration-300" id="indicator-3">
                    <span class="text-xs font-bold text-gray-500 uppercase">KE Indicator</span>
                    <div class="energy-bar-container">
                        <div class="energy-bar" id="bar-3" style="width: 0%;"></div>
                    </div>
                </div>
            </div>
            <div class="feedback-overlay" id="feedback-3">
                <h3 class="text-xl font-bold text-gray-800 mb-1" id="result-title-3">Result</h3>
                <p class="text-gray-600 text-sm text-center px-4 leading-tight" id="result-desc-3">Details here.</p>
                <button class="mt-2 px-3 py-1 text-sm bg-blue-500 text-white rounded hover:bg-blue-600 transition" onclick="resetSim(event)">Try Again</button>
            </div>
        </div>
    </div>

    <script>
        // Configuration for the three scenarios
        // KE = 0.5 * mass * velocity^2
        const scenarios = [
            { id: 1, mass: 60, velocity: 1.5, color: '#ef4444', label: 'A', textMass: 4, textVel: 1 }, // KE: 0.5 * 4 * 1^2 = 2 (relative)
            { id: 2, mass: 30, velocity: 3.0, color: '#f59e0b', label: 'B', textMass: 1, textVel: 2 }, // KE: 0.5 * 1 * 2^2 = 2 (relative)
            { id: 3, mass: 30, velocity: 4.5, color: '#10b981', label: 'C', textMass: 1, textVel: 3 }  // KE: 0.5 * 1 * 3^2 = 4.5 (relative) -> HIGHEST
        ];

        // State variables to hold canvas contexts and animation objects
        let animations = [];
        let isAnimating = true;
        let revealed = false;

        // Correct answer ID
        const correctAnswerId = 3;

        class Block {
            constructor(canvasId, config) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.config = config;
                
                // Adjust size based on mass (visual representation)
                this.size = config.mass; 
                this.x = 0;
                this.y = (this.canvas.height - this.size) / 2;
                this.velocity = config.velocity;
                this.color = config.color;
                
                // Trail effect
                this.trail = [];
                this.maxTrail = 20;

                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());
            }

            resizeCanvas() {
                // Keep the height fixed, but allow width to change
                const rect = this.canvas.parentElement.getBoundingClientRect();
                this.canvas.width = rect.width;
                // Re-center Y position after resize
                this.y = (this.canvas.height - this.size) / 2;
            }

            update() {
                if (!isAnimating) return;

                // Move block
                this.x += this.velocity;

                // Save trail
                this.trail.push({x: this.x, y: this.y});
                if(this.trail.length > this.maxTrail) {
                    this.trail.shift();
                }

                // Wrap around screen
                if (this.x > this.canvas.width) {
                    this.x = -this.size;
                    this.trail = []; // Clear trail on wrap
                }
            }

            draw() {
                // Clear canvas
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                // Draw background grid lines for visual speed reference
                this.ctx.strokeStyle = '#d1d5db';
                this.ctx.lineWidth = 1;
                for (let i = 0; i < this.canvas.width; i += 50) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(i, 0);
                    this.ctx.lineTo(i, this.canvas.height);
                    this.ctx.stroke();
                }

                // Draw trail
                if (this.trail.length > 1) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(this.trail[0].x + this.size/2, this.trail[0].y + this.size/2);
                    for (let i = 1; i < this.trail.length; i++) {
                        this.ctx.lineTo(this.trail[i].x + this.size/2, this.trail[i].y + this.size/2);
                    }
                    this.ctx.strokeStyle = this.color + '66'; // Add transparency
                    this.ctx.lineWidth = this.size * 0.8;
                    this.ctx.lineCap = 'round';
                    this.ctx.lineJoin = 'round';
                    this.ctx.stroke();
                }

                // Draw block
                this.ctx.fillStyle = this.color;
                
                // Add some shadow/depth
                this.ctx.shadowColor = 'rgba(0,0,0,0.3)';
                this.ctx.shadowBlur = 5;
                this.ctx.shadowOffsetX = 2;
                this.ctx.shadowOffsetY = 2;
                
                // Draw rounded rectangle for the block
                this.roundRect(this.ctx, this.x, this.y, this.size, this.size, 4);
                this.ctx.fill();

                // Reset shadow
                this.ctx.shadowColor = 'transparent';

                // Add text label inside block
                this.ctx.fillStyle = 'white';
                this.ctx.font = 'bold 15px Inter';
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';
                this.ctx.fillText(this.config.textMass + 'kg', this.x + this.size/2, this.y + this.size/2);

                // Draw velocity vector arrow
                this.drawVelocityVector();
            }

            drawVelocityVector() {
                const startX = this.x + this.size + 4; // Offset from right edge
                const startY = this.y + this.size / 2;
                const arrowLength = this.config.textVel * 18 + 5; // Base length + scaling based on velocity
                const endX = startX + arrowLength;
                
                // Draw vector line
                this.ctx.beginPath();
                this.ctx.moveTo(startX, startY);
                this.ctx.lineTo(endX, startY);
                this.ctx.strokeStyle = '#1f2937'; // Dark grey
                this.ctx.lineWidth = 3;
                this.ctx.stroke();

                // Draw vector arrowhead
                this.ctx.beginPath();
                this.ctx.moveTo(endX + 2, startY); // Point of the arrow
                this.ctx.lineTo(endX - 7, startY - 5);
                this.ctx.lineTo(endX - 7, startY + 5);
                this.ctx.fillStyle = '#1f2937';
                this.ctx.fill();
            }

            // Helper function for drawing rounded rectangles
            roundRect(ctx, x, y, width, height, radius) {
                ctx.beginPath();
                ctx.moveTo(x + radius, y);
                ctx.lineTo(x + width - radius, y);
                ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
                ctx.lineTo(x + width, y + height - radius);
                ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
                ctx.lineTo(x + radius, y + height);
                ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
                ctx.lineTo(x, y + radius);
                ctx.quadraticCurveTo(x, y, x + radius, y);
                ctx.closePath();
            }
        }

        function init() {
            scenarios.forEach((config, index) => {
                const block = new Block(`canvas-${index + 1}`, config);
                animations.push(block);
            });
            animate();
        }

        function animate() {
            animations.forEach(anim => {
                anim.update();
                anim.draw();
            });
            requestAnimationFrame(animate);
        }

        function checkAnswer(selectedId) {
            if (revealed) return; // Prevent clicking again after revealing
            revealed = true;
            isAnimating = false; // Pause animations

            // Calculate relative KEs for display
            const keVals = scenarios.map(s => 0.5 * s.textMass * Math.pow(s.textVel, 2));
            const maxKe = Math.max(...keVals);

            scenarios.forEach((scenario, index) => {
                const id = scenario.id;
                const feedbackEl = document.getElementById(`feedback-${id}`);
                const titleEl = document.getElementById(`result-title-${id}`);
                const descEl = document.getElementById(`result-desc-${id}`);
                const barEl = document.getElementById(`bar-${id}`);
                
                // Calculate actual KE for text
                const ke = keVals[index];
                
                // Animate bars
                setTimeout(() => {
                    barEl.style.width = `${(ke / maxKe) * 100}%`;
                }, 100); // slight delay for effect

                let feedbackText = `Mass: ${scenario.textMass} | Velocity: ${scenario.textVel}<br>`;
                feedbackText += `KE = ½(${scenario.textMass})(${scenario.textVel})² = <b>${ke}</b>`;

                if (selectedId === id) {
                    // This is the one they clicked
                    if (id === correctAnswerId) {
                        titleEl.innerText = "Correct!";
                        titleEl.className = "text-xl font-bold text-green-600 mb-1";
                        descEl.innerHTML = `Great job! Scenario C has the most kinetic energy because velocity is squared in the equation, having a much larger impact than mass.<br>${feedbackText}`;
                    } else {
                        titleEl.innerText = "Incorrect";
                        titleEl.className = "text-xl font-bold text-red-600 mb-1";
                        if (id === 1) {
                             descEl.innerHTML = `While Scenario A has high mass, velocity is squared in the KE equation. A small increase in velocity matters more.<br>${feedbackText}`;
                        } else {
                             descEl.innerHTML = `Scenario B is the baseline. Let's look at how changing mass or velocity affects the total energy.<br>${feedbackText}`;
                        }
                    }
                } else {
                    // Unclicked boxes
                    if (id === correctAnswerId) {
                         titleEl.innerText = "Highest KE";
                         titleEl.className = "text-xl font-bold text-green-600 mb-1";
                    } else {
                         titleEl.innerText = "Lower KE";
                         titleEl.className = "text-xl font-bold text-gray-500 mb-1";
                    }
                    descEl.innerHTML = feedbackText;
                }
                
                feedbackEl.classList.add('show');
            });
        }

        function resetSim(event) {
            // Stop event bubbling so clicking "Try Again" doesn't trigger the box click
            event.stopPropagation();
            
            revealed = false;
            isAnimating = true;

            scenarios.forEach(scenario => {
                const id = scenario.id;
                const feedbackEl = document.getElementById(`feedback-${id}`);
                const barEl = document.getElementById(`bar-${id}`);
                
                feedbackEl.classList.remove('show');
                barEl.style.width = `0%`;
            });
        }

        // Start everything when the page loads
        window.onload = init;
    </script>
</body>
</html>
