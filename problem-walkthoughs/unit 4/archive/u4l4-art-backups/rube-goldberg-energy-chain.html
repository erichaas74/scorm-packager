<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trace the Energy Chain | Unit 4 Lesson 4</title>
<style>
html,body{margin:0;background:transparent}
.tec{box-sizing:border-box;max-width:1040px;margin:12px auto;border:5px solid #285f9f;border-radius:22px;background:#fff;color:#17233b;font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
.tec *{box-sizing:border-box}.tec header{padding:16px 22px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}.tec h1{font-size:clamp(22px,3vw,29px);margin:0}.tec .eyebrow{font-size:12px;letter-spacing:.12em;font-weight:750;color:#285f9f;text-transform:uppercase;margin:0 0 3px}.tec button{font:inherit;min-height:44px;padding:9px 16px;border:1px solid #65768d;border-radius:10px;color:#17233b;background:#fff;cursor:pointer}.tec button:hover:not(:disabled){background:#eaf2fb}.tec button:disabled{opacity:.55;cursor:default}.tec button:focus-visible,.tec input:focus-visible{outline:3px solid #ac400c;outline-offset:3px}.tec .primary{background:#285f9f;color:white;border-color:#285f9f}.tec .primary:hover:not(:disabled){background:#194570}.tec .intro{margin:0;padding:0 22px 10px;color:#4c5d73;font-size:14px}.tec .scene{background:#f5f8fc;border-top:1px solid #d0dbe8}.tec svg{display:block;width:100%;height:auto;min-height:260px}.tec svg text{font-family:inherit;fill:#273950;font-size:18px}.tec .question{padding:14px 22px 18px;background:#fff;border-top:1px solid #d0dbe8}.tec .step{font-size:13px;font-weight:750;color:#285f9f;margin:0 0 4px}.tec h2{font-size:19px;margin:0 0 12px}.tec .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tec .choices button{text-align:left;font-weight:600}.tec .feedback{margin:0 0 12px;max-width:850px}.tec .actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.tec .mode{display:flex;align-items:center;gap:8px;font-size:13px;margin-left:auto;min-height:44px}.tec input{width:20px;height:20px;accent-color:#285f9f}.tec .status{font-size:14px;color:#4c5d73;margin:8px 0 0;min-height:21px}.tec .summary{padding:12px 22px;background:#eef4fb;border-top:1px solid #cad8e8}.tec .chain{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}.tec .node{border:1px solid #65768d;border-radius:9px;background:white;padding:7px 10px}.tec .branch{font-size:13px;margin:8px 0 0;color:#4c5d73}.tec [hidden]{display:none!important}
@media(max-width:550px){.tec{margin:0;border-radius:16px}.tec header{padding:12px;align-items:flex-start}.tec .intro,.tec .question,.tec .summary{padding-left:12px;padding-right:12px}.tec .choices{grid-template-columns:1fr}.tec .choices button{padding:9px 12px}.tec .mode{margin-left:0;width:100%}.tec svg{min-height:220px}.tec h2{font-size:18px}.tec .chain{gap:5px}.tec .node{padding:5px 7px}}
</style>
</head>
<body><main class="tec" id="activity">
<header><div><p class="eyebrow">Unit 4 · Lesson 4</p><h1>Trace the Energy Chain</h1></div><button id="reset">Reset</button></header>
<p class="intro">Predict, watch, then explain. A conceptual device, not a calibrated prediction.</p>
<section class="scene" aria-label="Device and prediction">
<svg id="scene" viewBox="0 0 1000 460" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">A home-built ball, domino, and toy-car device</title>
<desc id="diagram-desc">A raised ball rests on a cardboard ramp. Four upright dominoes lead to a lightweight toy car beside a nearby finish line.</desc>
<defs><pattern id="cardboard" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="12" height="12" fill="#e0bd89"/><path d="M0 0V12" stroke="#c19c65" stroke-width="2"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#285f9f" stroke-width="1.5"/></marker></defs>
<path d="M50 368H946" stroke="#57677c" stroke-width="4"/>
<rect x="79" y="161" width="64" height="204" rx="3" fill="#d8e0e9" stroke="#57677c" stroke-width="2"/>
<path d="M99 142L386 346L402 360L397 367L381 355L93 150Z" fill="url(#cardboard)" stroke="#78562d" stroke-width="3"/>
<path d="M210 226L204 244M320 305L313 321" stroke="#ad874f" stroke-width="8" opacity=".7"/>
<text x="92" y="413">Cardboard ramp</text><text x="454" y="413">Dominoes</text><text x="698" y="413">Toy car</text>
<g id="dominoes"></g>
<g id="ball"><circle r="18" fill="#fafafa" stroke="#263c53" stroke-width="3"/><path d="M-14 -10Q0 2 14 10M-13 11Q-1 -3 12 -12" fill="none" stroke="#607b91" stroke-width="3"/></g>
<g id="car"><path d="M0 0V-24L20-26L34-42H62L76-26H94V0Z" fill="#adc6dc" stroke="#263c53" stroke-width="3"/><path d="M34-37H59L69-26H25Z" fill="#fff" stroke="#263c53" stroke-width="2"/><circle cx="20" cy="0" r="10" fill="#263c53"/><circle cx="75" cy="0" r="10" fill="#263c53"/><circle cx="20" cy="0" r="4" fill="#fff"/><circle cx="75" cy="0" r="4" fill="#fff"/></g>
<path d="M801 369V274" stroke="#57677c" stroke-width="3"/><path d="M801 274H849V306H801Z" fill="#fff" stroke="#57677c" stroke-width="2"/><path d="M802 275h12v15h-12M826 275h12v15h-12M814 290h12v15h-12M838 290h10v15h-10" fill="#57677c"/>
<text x="784" y="438">Finish</text><g id="evidence"></g>
</svg>
<div class="question">
<p class="step" id="step"></p><h2 id="prompt" tabindex="-1"></h2>
<div id="choices" class="choices"></div>
<p id="feedback" class="feedback" aria-live="polite" aria-atomic="true" hidden></p>
<div class="actions"><button id="frame" class="primary" hidden>Show next moment</button><button id="next" class="primary" hidden>Next prediction</button><button id="replay" hidden>Replay stage</button><label class="mode"><input id="reduced" type="checkbox">Step-through (reduced motion)</label></div>
<p id="status" class="status" role="status" aria-live="polite"></p>
</div></section>
<section id="summary" class="summary" hidden aria-label="Energy chain summary">
<div class="chain"><span class="node">Raised ball + Earth</span><span aria-hidden="true">→</span><span class="node">Rolling ball</span><span aria-hidden="true">→</span><span class="node">Falling dominoes + Earth</span><span aria-hidden="true">→</span><span class="node">Car motion</span></div>
<div class="chain branch"><span class="node">Setup work → stored gravitational energy</span><span class="node">Transfers ↘ sound + thermal energy</span></div>
</section>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), ns='http://www.w3.org/2000/svg';
const stages=[
 {title:'Before the release',ask:'What energy is stored because the ball is raised?',options:['Kinetic energy','Gravitational potential energy','Thermal energy'],correct:1,duration:900,feedback:'The ball–Earth system stores gravitational potential energy. Lifting the ball during setup required work.',moments:['The raised ball remains at rest.','The ball and Earth form the energy-storing system.','Setup work has stored gravitational potential energy.']},
 {title:'Rolling down the ramp',ask:'As the ball rolls down, how do its gravitational and kinetic energies change?',options:['Gravitational ↓; kinetic ↑','Both increase','Gravitational ↑; kinetic ↓'],correct:0,duration:2200,feedback:'Gravitational potential energy decreases as kinetic energy increases. The rolling ball has kinetic energy in both its forward motion and its rotation.',moments:['The ball starts rolling down the ramp.','The ball moves forward and rotates farther down the ramp.','The ball reaches the first domino; its height is lower and it is moving.']},
 {title:'Through the domino line',ask:'Does the ball supply all the energy for the entire domino chain?',options:['Yes, only the ball','No, energy is created','No, dominoes store energy too'],correct:2,duration:2300,feedback:'Contact transfers energy from the ball to the first domino and onward through the line. Each upright domino–Earth system also stores gravitational potential energy from setup work, released as the domino falls.',moments:['The ball tips the first domino through contact.','The first domino contacts the second, which tips into the third.','The third tips the last domino toward the car.']},
 {title:'Across the finish line',ask:'Does all the available mechanical energy become useful car motion?',options:['Yes, all moves the car','No, some becomes sound/thermal','No, friction is energy'],correct:1,duration:1700,feedback:'The last domino transfers energy to the car, while some mechanical energy becomes sound and thermal energy. Energy is not destroyed; friction is a force that can transfer energy into thermal energy.',moments:['The final domino contacts the back of the car.','The car moves across the nearby finish line.','Sound and thermal energy are also part of the energy accounting.']}
];
let stage=0,phase='predict',attempted=[false,false,false,false],viewed=[false,false,false,false],sent=false,raf=0,token=0,frameIndex=0;
const media=matchMedia('(prefers-reduced-motion: reduce)');$('reduced').checked=media.matches;
const dominoes=[442,497,552,607].map(x=>{const g=document.createElementNS(ns,'g');g.innerHTML='<rect x="-14" y="-76" width="14" height="76" rx="3" fill="#fff7e9" stroke="#6a5435" stroke-width="2.5"/><path d="M-12-38H-2" stroke="#6a5435"/><circle cx="-7" cy="-57" r="2.5" fill="#6a5435"/><circle cx="-7" cy="-19" r="2.5" fill="#6a5435"/>';$('dominoes').append(g);return {g,x};});
const clamp=v=>Math.max(0,Math.min(1,v));
function label(x,y,text){const t=document.createElementNS(ns,'text');t.setAttribute('x',x);t.setAttribute('y',y);t.textContent=text;$('evidence').append(t);}
function arrow(x,y,xx,yy,width=3){const p=document.createElementNS(ns,'path');p.setAttribute('d',`M${x} ${y}L${xx} ${yy}`);p.setAttribute('stroke','#285f9f');p.setAttribute('stroke-width',width);p.setAttribute('fill','none');p.setAttribute('marker-end','url(#arrow)');$('evidence').append(p);}
function draw(p=0,reveal=false){
 let ball=stage>1?1:stage===1?p*p:0,angles=[0,0,0,0],car=0;
 if(stage===2)angles=[0,1,2,3].map(i=>Math.min(i===3?40:76,clamp(p*2.8-i*.6)*76));
 if(stage===3){angles=[76,76,76,40+36*clamp(p*2)];car=80*clamp((p-.28)/.72);}
 let x,y,rotation=ball*700;
 if(ball<.93){let v=ball/.93;x=106+290*v;y=124+207*v;}else{x=396+(ball-.93)/.07*14;y=331+(ball-.93)/.07*11;}
 $('ball').setAttribute('transform',`translate(${x} ${y}) rotate(${rotation})`);
 dominoes.forEach((d,i)=>d.g.setAttribute('transform',`translate(${d.x} 366) rotate(${angles[i]})`));
 $('car').setAttribute('transform',`translate(${665+car} 356)`);
 $('evidence').replaceChildren();
 if(!reveal)return;
 if(stage===0){label(160,92,'Ball + Earth');label(160,120,'Gravitational potential energy');arrow(125,158,125,320);label(160,152,'Stored by setup work');}
 if(stage===1&&p>=1){label(390,90,'Gravitational potential ↓');label(390,121,'Kinetic ↑');label(390,152,'Forward motion + rotation');}
 if(stage===2){if(p>.1)arrow(403,285,450,305);if(p>.5)arrow(470,255,556,278);if(p>=1){label(325,85,'Contact → contact → contact');label(325,116,'Upright dominoes store energy too');label(325,147,'Dominoes + Earth');}}
 if(stage===3&&p>=1){label(500,78,'Useful car motion');arrow(660,90,760,126,4);arrow(662,93,646,163,2);arrow(672,94,850,172,2);label(567,190,'Sound');label(789,200,'Thermal');label(553,235,'Transfers and changes of form');}
}
function focus(id){$(id).focus({preventScroll:true});}
function stop(){token++;cancelAnimationFrame(raf);}
function predict(){stop();phase='predict';$('step').textContent=`${stage+1} / 4 · ${stages[stage].title}`;$('prompt').textContent=stages[stage].ask;$('feedback').hidden=true;$('feedback').textContent='';$('choices').replaceChildren();$('next').hidden=true;$('replay').hidden=true;$('frame').hidden=true;$('summary').hidden=true;$('status').textContent='Choose one prediction to unlock the reveal.';$('diagram-desc').textContent=stage===0?'Raised ball on a cardboard ramp, four upright dominoes, and a toy car beside a finish line.':stage===1?'The ball is still raised; predict before it rolls.':stage===2?'The ball has reached the first upright domino. Predict before the contacts.':'The last domino is tipping toward the still car. Predict before it makes contact.';draw();stages[stage].options.forEach((text,i)=>{const b=document.createElement('button');b.textContent=text;b.addEventListener('click',()=>choose(i));$('choices').append(b);});}
function choose(i){if(phase!=='predict')return;attempted[stage]=true;$('status').textContent=`Prediction recorded: ${stages[stage].options[i]}.`;play();}
function finish(){phase='explain';viewed[stage]=true;draw(1,true);$('frame').hidden=true;$('feedback').textContent=stages[stage].feedback;$('feedback').hidden=false;$('replay').hidden=false;$('next').hidden=stage===3;$('status').textContent=stage===3?'Complete: all four predictions and reveals explored.':'Reveal complete. Replay or continue.';$('diagram-desc').textContent=stages[stage].moments[2]+' '+stages[stage].feedback;if(stage===3){$('summary').hidden=false;if(attempted.every(Boolean)&&viewed.every(Boolean)&&!sent){sent=true;window.parent.postMessage({ type: 'complete' }, '*');}}focus(stage===3?'replay':'next');}
function moment(){if(phase!=='reveal')return;frameIndex++;const p=frameIndex/3;draw(p,true);$('status').textContent=stages[stage].moments[frameIndex-1];$('diagram-desc').textContent=$('status').textContent;if(frameIndex===3)finish();}
function play(){stop();phase='reveal';frameIndex=0;$('choices').replaceChildren();$('prompt').textContent=stages[stage].title;$('feedback').hidden=true;$('next').hidden=true;$('replay').hidden=true;$('summary').hidden=true;draw(0,false);if($('reduced').checked){$('frame').hidden=false;$('status').textContent='Step through three still moments.';focus('frame');return;}$('frame').hidden=true;$('status').textContent='Watch the interacting objects.';const own=token,start=performance.now();function tick(now){if(own!==token)return;const p=clamp((now-start)/stages[stage].duration);draw(p,true);if(p===1)finish();else raf=requestAnimationFrame(tick);}raf=requestAnimationFrame(tick);}
$('frame').addEventListener('click',moment);$('replay').addEventListener('click',()=>{if(phase==='explain')play();});$('next').addEventListener('click',()=>{if(phase!=='explain'||stage===3)return;stage++;predict();focus('prompt');});$('reset').addEventListener('click',()=>{stage=0;attempted.fill(false);viewed.fill(false);predict();focus('prompt');});$('reduced').addEventListener('change',()=>{if(phase==='reveal')play();});media.addEventListener('change',event=>{if(event.matches){$('reduced').checked=true;if(phase==='reveal')play();}});predict();
})();
</script></main></body></html>
