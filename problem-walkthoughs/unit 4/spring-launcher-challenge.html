<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spring Launcher Challenge</title>
<style>
    main.rise-embed > :not(script):not(style) { border: 5px solid #285f9f !important; }
    :root {
      --ink: #17233b;
      --muted: #5e6b82;
      --panel: #ffffff;
      --line: #dce4ef;
      --blue: #2563eb;
      --blue-soft: #eef4ff;
      --orange: #ea580c;
      --green: #15803d;
      --gold: #f59e0b;
      --rose: #be185d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      place-items: start center;
      padding: 16px;
      background: #e9eff7;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overscroll-behavior: none;
    }

    button { font: inherit; }

    .walkthrough {
      width: min(100%, 1100px);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: 0 18px 50px rgb(23 35 59 / 14%);
    }

    /* Canvas stage */
    .stage {
      position: relative;
      width: 100%;
      height: clamp(480px, 68vh, 640px);
      overflow: hidden;
      background: #eef4fb;
    }
    #gameCanvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }

    .hint-button {
      position: absolute;
      left: 14px;
      top: 14px;
      z-index: 21;
      padding: 7px 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgb(255 255 255 / 94%);
      box-shadow: 0 4px 14px rgb(23 35 59 / 12%);
      font-size: 11.5px;
      font-weight: 800;
      color: var(--muted);
      cursor: pointer;
    }
    .hint-button:hover { border-color: var(--blue); color: var(--blue); }

    .hint-panel {
      position: absolute;
      left: 14px;
      top: 56px;
      z-index: 20;
      width: min(24rem, calc(100% - 28px));
    }
    .hint-panel.hidden { display: none; }
    .hint-panel section {
      border: 1px solid var(--line);
      border-left: 4px solid var(--blue);
      border-radius: 14px;
      background: rgb(255 255 255 / 97%);
      padding: 14px 16px;
      box-shadow: 0 14px 36px rgb(23 35 59 / 18%);
    }
    .hint-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .hint-kicker {
      margin: 0;
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--blue);
    }
    .hint-head h2 { margin: 2px 0 0; font-size: 15px; font-weight: 800; }
    .hint-close {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
    }
    .hint-close:hover { border-color: var(--blue); color: var(--blue); }
    #hint-body { margin-top: 10px; }
    #hint-body p { margin: 0 0 6px; }
    #hint-body p:last-child { margin-bottom: 0; }
    /* Equation form */
    .eq {
      display: block;
      padding: 7px 11px;
      border-radius: 8px;
      background: var(--blue-soft);
      color: var(--blue);
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
      font-size: 16px;
      font-weight: 700;
    }
    /* Same equation with the values in */
    .sub {
      display: block;
      margin-top: 8px !important;
      padding: 7px 11px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #f7f9fc;
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
      font-size: 16px;
      font-weight: 700;
    }

    /* Action card above the stage */
    .actions {
      padding: 14px 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-bottom: 1px solid var(--line);
    }
    .actions h2 { margin: 0; font-size: 19px; font-weight: 800; }

    .prediction-choice-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }
    .choice {
      padding: 13px 8px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      background: #f7f9fc;
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: border-color .15s, background .15s, transform .15s;
    }
    .choice:hover:not(:disabled) { border-color: var(--blue); background: var(--blue-soft); }
    .choice:disabled { opacity: .55; cursor: not-allowed; }
    .choice.is-selected {
      border-color: var(--blue);
      background: var(--blue);
      color: #fff;
      transform: translateY(-1px);
    }
    .prediction-choice-grid.nudge { animation: nudge .45s ease; }
    @keyframes nudge { 0%,100% { transform: none; } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

    .primary {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 12px;
      background: var(--blue);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: background .15s;
    }
    .primary:hover:not(:disabled) { background: #1d4ed8; }
    .primary:disabled { opacity: .45; cursor: not-allowed; }

    .hidden { display: none; }

    button:focus-visible { outline: 3px solid rgb(37 99 235 / 45%); outline-offset: 2px; }

    @media (max-width: 640px) {
      .prediction-choice-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .hint-panel { left: 10px; top: 52px; width: calc(100% - 20px); }
      .hint-button { left: 10px; top: 10px; }
    }
  </style>
</head>
<body>
<main class="rise-embed" style="display: contents;">
<div class="walkthrough">
    <div class="actions" aria-live="polite">
      <h2 id="prompt-title">Predict launch speed</h2>
      <div id="predict-container">
        <div id="prediction-choices" class="prediction-choice-grid" role="group" aria-label="Speed prediction choices"></div>
      </div>
      <button id="btn-main" class="primary hidden" type="button">Launch</button>
    </div>

    <div class="stage" id="canvas-container">
      <canvas id="gameCanvas"></canvas>
      <button id="btn-hint" type="button" class="hint-button">Show hint</button>
      <div id="hint-overlay" class="hint-panel hidden">
        <section role="dialog" aria-modal="false" aria-labelledby="hint-title">
          <div class="hint-head">
            <div>
              <p class="hint-kicker">Calculation hint</p>
              <h2 id="hint-title">Find the launch speed</h2>
            </div>
            <button id="btn-close-hint" type="button" class="hint-close" aria-label="Close hint">Close</button>
          </div>
          <div id="hint-body"></div>
        </section>
      </div>
    </div>

</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');

    // UI Elements
    // Spring constant is drawn and controlled directly on the canvas.
    const sliderK = { value: '200', disabled: false };
    // Displacement is drawn and controlled directly on the canvas as well.
    const sliderX = { value: '0.30', disabled: false };
    const promptTitle = document.getElementById('prompt-title');
    const predictContainer = document.getElementById('predict-container');
    const predictionChoices = document.getElementById('prediction-choices');
    const btnMain = document.getElementById('btn-main');
    const hintOverlay = document.getElementById('hint-overlay');
    const hintTitle = document.getElementById('hint-title');
    const hintBody = document.getElementById('hint-body');
    const btnHint = document.getElementById('btn-hint');
    const btnCloseHint = document.getElementById('btn-close-hint');

    // Game State
    const rounds = [
      // Level 1: Flat track, Speed prediction
      { level: 1, mass: 2.0, k: 200, x: 0.30, targetSpeed: 3.0, targetHeight: 0 },
      { level: 1, mass: 1.0, k: 400, x: 0.20, targetSpeed: 4.0, targetHeight: 0 },
      // Level 2: Ramp track, Height adjustment (Initial slider settings provided, user must adjust)
      { level: 2, mass: 2.0, k: 250, x: 0.30, targetHeight: 1.0, adjustable: 'k' },
      { level: 2, mass: 1.5, k: 250, x: 0.30, targetHeight: 2.0, adjustable: 'x' },
      { level: 2, mass: 3.0, k: 0, x: 0, targetHeight: 1.5, adjustable: 'both' }
    ];

    let currentRoundIdx = 0;
    let gameState = 'setup'; // 'setup', 'predict', 'launched', 'result', 'gameover'

    // ---------------------------------------------------------------
    // World model: everything below is in METERS. The view layer maps
    // meters to pixels each frame so the track fills the canvas width.
    // ---------------------------------------------------------------
    const G = 9.8;
    const RAMP_R = 1.15;                    // tight entry: the ramp visibly rises right after launch
    const RAMP_MAX = 48 * Math.PI / 180;    // ramp flattens out at this incline
    const BACK_M = 2.15;                    // world space reserved left of the launch point
    const WALL_FACE = -1.55;                // x of the spring anchor plate
    const PAD = { l: 84, r: 26, t: 36, b: 86 };   // left pad leaves room for the constant box

    // Light palette, shared with the other Unit 4 walkthroughs
    const C = {
      ink: '#17233b',
      muted: '#5e6b82',
      line: '#dce4ef',
      panel: '#ffffff',
      blue: '#2563eb',
      blueSoft: '#eef4ff',
      orange: '#ea580c',
      green: '#15803d',
      gold: '#f59e0b',
      rose: '#be185d',
      steel: '#8d9db1',
      steelDark: '#5b6a80'
    };
    const MAX_SCALE = 170;                  // px per meter cap (keeps parts from ballooning)
    const CART = { len: 0.86, high: 0.44, wheelR: 0.13 };
    const TOL = 0.15;                       // height tolerance for full points

    let flatLen = 4;     // length of flat runway (m) before the ramp begins
    let runLen = 6;      // level 1: distance the cart runs before the loop restarts

    let W = 0, H = 0;    // canvas size in CSS pixels
    // groundY is the rail line; the floor sits deckPx below it so the track reads as elevated
    let view = { scale: 100, originX: 100, groundY: 300, deckPx: 34, topM: 2 };

    // Entity
    let cart = { s: 0, v: 0, m: 2.0 };  // s = distance along path (m), v = speed along path (m/s)

    // Visual state
    let particles = [];
    let trail = [];
    let time = 0;
    let lastFrame = 0;
    let released = false;        // spring has pushed the cart free
    let releaseT = -99;          // time of release (drives spring wobble)
    let revealSpeed = false;     // level 1: show the number in the velocity vector
    let l1Step = 'energy';       // level 1 asks for the stored energy, then the speed
    let revealEnergy = false;
    // Level 1 loop: load the spring → pause on the displacement → fly → pause on the question
    let demoPhase = 'load';      // 'load' | 'armed' | 'fly' | 'hold'
    let demoT = 0;
    const LOAD_TIME = 1.15, ARMED_HOLD = 1.6, END_HOLD = 1.9;
    let measured = { speed: 0, height: 0, ok: false, done: false };
    let launchSetup = { k: 200, x: 0.3 };
    let selectedPrediction = null;
    let draggingK = false;
    let draggingX = false;
    let introT = 0;
    let introNextState = 'setup';
    let hintVisible = false;
    const INTRO_DURATION = 1.15;

    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const lerp = (a, b, t) => a + (b - a) * t;

    // ---------------------------------------------------------------
    // Path: maps 1D distance s (m) to 2D world coordinates (m)
    // ---------------------------------------------------------------
    function getPath(s) {
      if (s <= flatLen) return { x: s, y: 0, angle: 0 };
      const rs = s - flatLen;
      const arcLen = RAMP_MAX * RAMP_R;
      if (rs <= arcLen) {
        const a = rs / RAMP_R;
        return { x: flatLen + RAMP_R * Math.sin(a), y: RAMP_R * (1 - Math.cos(a)), angle: a };
      }
      const cx = flatLen + RAMP_R * Math.sin(RAMP_MAX);
      const cy = RAMP_R * (1 - Math.cos(RAMP_MAX));
      const rem = rs - arcLen;
      return {
        x: cx + rem * Math.cos(RAMP_MAX),
        y: cy + rem * Math.sin(RAMP_MAX),
        angle: RAMP_MAX
      };
    }

    // Horizontal run (m) the ramp needs, past the flat, to reach height h
    function rampRun(h) {
      const hArc = RAMP_R * (1 - Math.cos(RAMP_MAX));
      if (h <= hArc) return RAMP_R * Math.sin(Math.acos(clamp(1 - h / RAMP_R, -1, 1)));
      return RAMP_R * Math.sin(RAMP_MAX) + (h - hArc) / Math.tan(RAMP_MAX);
    }

    // ---------------------------------------------------------------
    // View: fit the scene to the canvas so it spans most of the width
    // ---------------------------------------------------------------
    function baseTop() {
      const r = rounds[currentRoundIdx];
      return r.level === 1 ? 1.7 : Math.max(r.targetHeight + 1.05, 2.2);
    }

    function worldWidth(topM) {
      const r = rounds[currentRoundIdx];
      return r.level === 1
        ? BACK_M + runLen + 0.6
        : BACK_M + flatLen + rampRun(topM) + 0.9;
    }

    // Choose the runway length so the action stretches across the canvas
    function planRound() {
      const r = rounds[currentRoundIdx];
      const uw = Math.max(160, W - PAD.l - PAD.r);
      const uh = Math.max(140, H - PAD.t - PAD.b);
      const base = baseTop();
      const s0 = Math.min(uh / base, MAX_SCALE);
      const ahead = uw / s0 - BACK_M;

      if (r.level === 1) {
        // Flat all the way: no ramp may appear in a speed round. The cart
        // recycles at runLen, which is sized to fill the canvas width.
        flatLen = 60;
        // Stops well short of the right edge rather than running off it
        runLen = clamp(ahead - 2.0, 2.2, 10);
      } else {
        // Ramp rounds start almost immediately after the launcher. This keeps
        // the horizontal scene compact without changing the ramp geometry.
        flatLen = 2.50;
      }
      view.topM = base;
      applyView(view.topM);
    }

    function applyView(topM) {
      const uw = Math.max(160, W - PAD.l - PAD.r);
      const uh = Math.max(140, H - PAD.t - PAD.b);
      const ww = worldWidth(topM);
      const scale = Math.min(uh / topM, uw / ww, MAX_SCALE);
      view.scale = scale;
      view.originX = PAD.l + Math.max(0, (uw - ww * scale) / 2) + BACK_M * scale;
      // Take up the vertical slack, biased towards sky rather than floor
      view.groundY = PAD.t + topM * scale + Math.max(0, (uh - topM * scale) * 0.62);
      view.deckPx = clamp(0.3 * scale, 20, 46);
    }

    const deckY = () => view.groundY + view.deckPx;

    function updateView(dt) {
      let want = baseTop();
      if (gameState === 'launched' || gameState === 'result') {
        const p = getPath(Math.max(0, cart.s));
        // Energy tells us how much higher the cart can still climb - zoom out early
        want = Math.max(want, p.y + cart.v * cart.v / (2 * G) + 0.7);
      }
      want = clamp(want, 1.2, 7.4);
      view.topM = lerp(view.topM, want, 1 - Math.exp(-dt * 4.5));
      applyView(view.topM);
    }

    const X = m => view.originX + m * view.scale;
    const Y = m => view.groundY - m * view.scale;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = container.clientWidth;
      H = container.clientHeight;
      canvas.width = Math.max(1, Math.round(W * dpr));
      canvas.height = Math.max(1, Math.round(H * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      // Re-sizing the runway mid-flight would move the track out from under the
      // cart, so the geometry is only re-planned between launches.
      // Intro is the start of a new round too. Re-plan here so a ramp round
      // cannot inherit the long flat runway from the preceding speed round.
      if (gameState === 'setup' || gameState === 'predict' || gameState === 'intro') planRound();
      else applyView(view.topM);
      render();   // resizing clears the bitmap - repaint at once
    }
    window.addEventListener('resize', resize);
    if (window.ResizeObserver) new ResizeObserver(resize).observe(container);

    // ---------------------------------------------------------------
    // Small drawing helpers
    // ---------------------------------------------------------------
    const MONO = 'ui-monospace, SFMono-Regular, Menlo, monospace';
    const SANS = 'Inter, ui-sans-serif, system-ui, sans-serif';

    function chip(text, x, y, color, opts = {}) {
      const size = opts.size || 11;
      ctx.font = `bold ${size}px ${MONO}`;
      const padX = 8, padY = 5;
      const w = ctx.measureText(text).width + padX * 2;
      const h = size + padY * 2;
      let cx = x - (opts.align === 'center' ? w / 2 : opts.align === 'right' ? w : 0);
      cx = clamp(cx, 4, Math.max(4, W - w - 4));
      const cy = clamp(y - h, 4, Math.max(4, H - h - 4));
      ctx.fillStyle = opts.bg || 'rgba(255,255,255,0.94)';
      ctx.beginPath(); ctx.roundRect(cx, cy, w, h, 6);
      ctx.fill();
      ctx.strokeStyle = color; ctx.lineWidth = 1.25; ctx.stroke();
      ctx.fillStyle = opts.text || color;
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(text, cx + padX, cy + h / 2 + 0.5);
      ctx.textBaseline = 'alphabetic';
      return { x: cx, y: cy, w, h };
    }


    function spark(x, y, opts = {}) {
      particles.push({
        x, y,
        vx: (opts.vx || 0) + (Math.random() - 0.5) * (opts.spread || 3),
        vy: (opts.vy || 0) + (Math.random() - 0.5) * (opts.spread || 3),
        life: 0,
        max: opts.max || (0.35 + Math.random() * 0.45),
        size: opts.size || (1.2 + Math.random() * 2.2),
        grav: opts.grav === undefined ? 6 : opts.grav,
        color: opts.color || '#fbbf24'
      });
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life += dt;
        if (p.life >= p.max) { particles.splice(i, 1); continue; }
        p.vy -= p.grav * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        if (p.y < 0.02) { p.y = 0.02; p.vy = Math.abs(p.vy) * 0.35; p.vx *= 0.7; }
      }
      if (particles.length > 260) particles.splice(0, particles.length - 260);
    }

    // ---------------------------------------------------------------
    // Scene layers
    // ---------------------------------------------------------------
    function drawBackground() {
      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, '#e4effb');
      sky.addColorStop(0.55, '#f2f8fe');
      sky.addColorStop(1, '#e8eff8');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);

      // Soft light over the launch pad
      const g = ctx.createRadialGradient(X(0.4), Y(0.5), 0, X(0.4), Y(0.5), Math.max(W, H) * 0.6);
      g.addColorStop(0, 'rgba(255,255,255,0.85)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      // Measurement grid, locked to the world so it reads as graph paper
      const top = view.topM + 1.2;
      ctx.lineWidth = 1;
      for (let m = -2; m * view.scale + view.originX < W + view.scale; m += 0.5) {
        const px = Math.round(X(m)) + 0.5;
        if (px < -2 || px > W + 2) continue;
        ctx.strokeStyle = Math.abs(m % 1) < 0.01 ? 'rgba(93,111,140,0.20)' : 'rgba(93,111,140,0.10)';
        ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, deckY()); ctx.stroke();
      }
      for (let m = 0.5; m <= top; m += 0.5) {
        const py = Math.round(Y(m)) + 0.5;
        if (py < 0) break;
        const whole = Math.abs(m % 1) < 0.01;
        ctx.strokeStyle = whole ? 'rgba(93,111,140,0.20)' : 'rgba(93,111,140,0.10)';
        ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(W, py); ctx.stroke();
        if (whole && view.scale > 42) {
          ctx.fillStyle = 'rgba(94,107,130,0.75)';
          ctx.font = `bold 10px ${MONO}`;
          ctx.textAlign = 'left';
          ctx.fillText(`${m}m`, 6, py - 3);
        }
      }
    }

    function drawGround() {
      const gy = deckY();
      const g = ctx.createLinearGradient(0, gy, 0, H);
      g.addColorStop(0, '#ccd8e5');
      g.addColorStop(1, '#aebbcc');
      ctx.fillStyle = g;
      ctx.fillRect(0, gy, W, H - gy);

      // Hatched floor texture
      ctx.save();
      ctx.beginPath(); ctx.rect(0, gy, W, H - gy); ctx.clip();
      ctx.strokeStyle = 'rgba(91,106,128,0.12)';
      ctx.lineWidth = 1;
      for (let x = -H; x < W + H; x += 16) {
        ctx.beginPath(); ctx.moveTo(x, H); ctx.lineTo(x + (H - gy), gy); ctx.stroke();
      }
      ctx.restore();

      ctx.strokeStyle = '#7f8fa3';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0, gy + 0.5); ctx.lineTo(W, gy + 0.5); ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function trackPoints() {
      const pts = [];
      // Starts at the attachment face so no rail stub pokes out left of the box
      for (let s = WALL_FACE; s < 60; s += 0.06) {
        const p = getPath(s);
        const px = X(p.x), py = Y(p.y);
        pts.push({ s, p, px, py });
        if (px > W + 40 || p.y > view.topM + 1.6) break;
      }
      return pts;
    }

    function drawTrack() {
      const pts = trackPoints();
      if (pts.length < 2) return;

      // Rail: dark base, mid body, glowing top edge
      const stroke = (width, style) => {
        ctx.strokeStyle = style;
        ctx.lineWidth = width;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.beginPath();
        pts.forEach((q, i) => i ? ctx.lineTo(q.px, q.py) : ctx.moveTo(q.px, q.py));
        ctx.stroke();
      };
      const rw = clamp(0.10 * view.scale, 8, 16);
      stroke(rw + 3, '#5b6a80');
      stroke(rw, '#a8b6c8');

      ctx.save();
      ctx.translate(0, -rw * 0.32);
      stroke(Math.max(1.5, rw * 0.18), 'rgba(255,255,255,0.8)');
      ctx.restore();
    }

    // ---------------------------------------------------------------
    // On-canvas controls. The spring constant box IS the launcher wall:
    // the spring anchors to its right edge, so the control the learner
    // drags is physically attached to the spring it stiffens.
    // ---------------------------------------------------------------
    function springConstantGeometry() {
      const gy = deckY();
      const right = X(WALL_FACE);              // spring attachment face
      // Never let the box run off the left edge; it narrows instead
      const boxX = Math.max(8, right - clamp(1.20 * view.scale, 118, 156));
      const boxW = right - boxX;
      const boxTop = Y(1.55);
      const boxBottom = gy - 4;
      return {
        boxX, boxW, boxTop,
        boxH: boxBottom - boxTop,
        right,
        trackX: boxX + boxW * 0.40,
        trackTop: boxTop + 62,
        trackBottom: boxBottom - 56,
        min: 0,
        max: 600
      };
    }

    function drawSpringConstantControl() {
      const g = springConstantGeometry();
      const live = !sliderK.disabled;
      const accent = live ? C.blue : '#a7b3c4';
      const value = clamp(parseFloat(sliderK.value) || 0, g.min, g.max);
      const t = (value - g.min) / (g.max - g.min);
      const y = g.trackBottom - t * (g.trackBottom - g.trackTop);

      ctx.save();

      // --- Box -----------------------------------------------------
      ctx.shadowColor = 'rgba(23,35,59,0.18)';
      ctx.shadowBlur = 12;
      ctx.shadowOffsetY = 3;
      const body = ctx.createLinearGradient(g.boxX, 0, g.boxX + g.boxW, 0);
      body.addColorStop(0, '#ffffff');
      body.addColorStop(0.62, '#f6f9fd');
      body.addColorStop(1, '#e6ecf5');
      ctx.fillStyle = body;
      ctx.beginPath(); ctx.roundRect(g.boxX, g.boxTop, g.boxW, g.boxH, [12, 12, 4, 4]); ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.strokeStyle = live ? C.blue : C.line;
      ctx.lineWidth = live ? 2 : 1.5;
      ctx.beginPath(); ctx.roundRect(g.boxX, g.boxTop, g.boxW, g.boxH, [12, 12, 4, 4]); ctx.stroke();

      // Mounting face + bolts on the edge the spring attaches to
      ctx.fillStyle = C.steelDark;
      ctx.fillRect(g.right - 4, g.boxTop + 10, 4, g.boxH - 14);
      ctx.fillStyle = '#eef2f7';
      [0.28, 0.72].forEach(f => {
        ctx.beginPath();
        ctx.arc(g.right - 9, g.boxTop + 10 + (g.boxH - 14) * f, 2.6, 0, Math.PI * 2);
        ctx.fill();
      });

      // --- Label ---------------------------------------------------
      ctx.textAlign = 'center';
      ctx.fillStyle = C.muted;
      ctx.font = `800 13.5px ${SANS}`;
      ctx.fillText('SPRING', g.boxX + g.boxW / 2, g.boxTop + 25);
      ctx.fillText('CONSTANT', g.boxX + g.boxW / 2, g.boxTop + 41);

      // --- Ticks ---------------------------------------------------
      ctx.font = `700 11.5px ${MONO}`;
      for (let v = 0; v <= 600; v += 100) {
        const ty = g.trackBottom - (v / 600) * (g.trackBottom - g.trackTop);
        const major = v % 200 === 0;
        ctx.strokeStyle = '#c6d0de';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(g.trackX + 10, ty);
        ctx.lineTo(g.trackX + (major ? 17 : 13), ty);
        ctx.stroke();
        if (major) {
          ctx.fillStyle = C.muted;
          ctx.textAlign = 'left';
          ctx.fillText(String(v), g.trackX + 21, ty + 4);
        }
      }

      // --- Track ---------------------------------------------------
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#dbe2ec';
      ctx.lineWidth = 9;
      ctx.beginPath(); ctx.moveTo(g.trackX, g.trackTop); ctx.lineTo(g.trackX, g.trackBottom); ctx.stroke();
      const fill = ctx.createLinearGradient(0, g.trackBottom, 0, g.trackTop);
      fill.addColorStop(0, live ? '#60a5fa' : '#c3ccd9');
      fill.addColorStop(1, accent);
      ctx.strokeStyle = fill;
      ctx.lineWidth = 9;
      ctx.beginPath(); ctx.moveTo(g.trackX, g.trackBottom); ctx.lineTo(g.trackX, y); ctx.stroke();

      // --- Knob ----------------------------------------------------
      ctx.save();
      ctx.shadowColor = 'rgba(23,35,59,0.35)';
      ctx.shadowBlur = 6;
      ctx.shadowOffsetY = 2;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.roundRect(g.trackX - 15, y - 9, 30, 18, 9); ctx.fill();
      ctx.restore();
      ctx.strokeStyle = accent;
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.roundRect(g.trackX - 15, y - 9, 30, 18, 9); ctx.stroke();
      ctx.strokeStyle = accent;
      ctx.lineWidth = 1.5;
      ctx.lineCap = 'round';
      for (const d of [-3.5, 0, 3.5]) {
        ctx.beginPath(); ctx.moveTo(g.trackX - 5, y + d); ctx.lineTo(g.trackX + 5, y + d); ctx.stroke();
      }

      // --- Value readout: solid, so the live number carries the box ---
      ctx.font = `bold 19px ${MONO}`;
      const label = `${value.toFixed(0)}`;
      const unit = ' N/m';
      ctx.font = `bold 12px ${MONO}`;
      const uw = ctx.measureText(unit).width;
      ctx.font = `bold 19px ${MONO}`;
      const pw = Math.min(g.boxW - 12, ctx.measureText(label).width + uw + 22);
      const px = g.boxX + g.boxW / 2 - pw / 2;
      const py = g.trackBottom + 16;
      const ph = 30;

      // Solid in both states: the value is a given the learner has to read
      // even on the rounds where the control itself is locked.
      ctx.save();
      ctx.shadowColor = live ? 'rgba(37,99,235,0.40)' : 'rgba(23,35,59,0.28)';
      ctx.shadowBlur = 8;
      ctx.shadowOffsetY = 2;
      ctx.fillStyle = live ? C.blue : '#44526a';
      ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 8); ctx.fill();
      ctx.restore();

      ctx.textBaseline = 'middle';
      const textW = ctx.measureText(label).width;
      const startX = g.boxX + g.boxW / 2 - (textW + uw) / 2;
      ctx.textAlign = 'left';
      ctx.fillStyle = '#ffffff';
      ctx.font = `bold 19px ${MONO}`;
      ctx.fillText(label, startX, py + ph / 2 + 1);
      ctx.font = `bold 12px ${MONO}`;
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillText(unit, startX + textW, py + ph / 2 + 2);
      ctx.textBaseline = 'alphabetic';
      ctx.restore();
    }

    function setSpringConstantFromPointer(clientY) {
      if (sliderK.disabled || gameState === 'launched') return;
      const rect = canvas.getBoundingClientRect();
      const g = springConstantGeometry();
      const y = clamp(clientY - rect.top, g.trackTop, g.trackBottom);
      const t = (g.trackBottom - y) / (g.trackBottom - g.trackTop);
      sliderK.value = String(Math.round((t * 600) / 10) * 10);
      updateSliders();
    }

    function displacementGeometry() {
      const left = X(-CART.len / 2 - 0.55);
      const right = X(-CART.len / 2);
      const boxTop = Y(0) + 10;
      const boxH = 78;
      // The track keeps its true physical width; the box widens past it when
      // 0.55 m is too few pixels to fit the labels.
      const boxW = Math.max((right - left) + 60, 214);
      // Kept clear of the constant box when the view zooms out
      const k = springConstantGeometry();
      const boxX = Math.max(k.right + 8, (left + right) / 2 - boxW / 2);
      return {
        left, right,
        boxX, boxW, boxTop, boxH,
        y: boxTop + 42,
        min: 0,
        max: 0.55
      };
    }

    function drawDisplacementControl() {
      const g = displacementGeometry();
      const live = !sliderX.disabled;
      const accent = live ? C.orange : '#a7b3c4';
      const targetValue = parseFloat(sliderX.value) || 0;
      // The slider rides the cart while the spring is being loaded, then holds
      // at the value the calculation actually uses.
      const loading = gameState === 'intro'
        || (rounds[currentRoundIdx].level === 1 && demoPhase === 'load');
      const value = loading
        ? clamp(Math.max(0, -cart.s), g.min, g.max)
        : clamp(targetValue, g.min, g.max);
      const t = (value - g.min) / (g.max - g.min);
      // Measured outward from the resting position at the right end
      const markerX = g.right - t * (g.right - g.left);

      ctx.save();

      // --- Box -----------------------------------------------------
      ctx.shadowColor = 'rgba(23,35,59,0.18)';
      ctx.shadowBlur = 12;
      ctx.shadowOffsetY = 3;
      const body = ctx.createLinearGradient(0, g.boxTop, 0, g.boxTop + g.boxH);
      body.addColorStop(0, '#ffffff');
      body.addColorStop(1, '#eef2f8');
      ctx.fillStyle = body;
      ctx.beginPath(); ctx.roundRect(g.boxX, g.boxTop, g.boxW, g.boxH, 12); ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.strokeStyle = live ? C.orange : C.line;
      ctx.lineWidth = live ? 2 : 1.5;
      ctx.beginPath(); ctx.roundRect(g.boxX, g.boxTop, g.boxW, g.boxH, 12); ctx.stroke();

      // --- Label + value -------------------------------------------
      ctx.textAlign = 'left';
      ctx.fillStyle = C.muted;
      ctx.font = `800 10.5px ${SANS}`;
      ctx.fillText('DISPLACEMENT', g.boxX + 14, g.boxTop + 19);
      ctx.textAlign = 'right';
      ctx.fillStyle = live ? C.orange : C.muted;
      ctx.font = `bold 14px ${MONO}`;
      ctx.fillText(`x = ${value.toFixed(2)} m`, g.boxX + g.boxW - 14, g.boxTop + 20);

      // --- Ticks ---------------------------------------------------
      for (let v = 0; v <= 0.5501; v += 0.05) {
        const tx = g.right - (v / 0.55) * (g.right - g.left);
        const major = Math.abs(v * 100 % 10) < 0.5;
        ctx.strokeStyle = '#c6d0de';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(tx, g.y + 9);
        ctx.lineTo(tx, g.y + (major ? 15 : 12));
        ctx.stroke();
      }

      // --- Track ---------------------------------------------------
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#dbe2ec';
      ctx.lineWidth = 9;
      ctx.beginPath(); ctx.moveTo(g.left, g.y); ctx.lineTo(g.right, g.y); ctx.stroke();
      const fill = ctx.createLinearGradient(g.right, 0, g.left, 0);
      fill.addColorStop(0, accent);
      fill.addColorStop(1, live ? '#fb923c' : '#c3ccd9');
      ctx.strokeStyle = fill;
      ctx.lineWidth = 9;
      ctx.beginPath(); ctx.moveTo(g.right, g.y); ctx.lineTo(markerX, g.y); ctx.stroke();

      // Rest datum
      ctx.strokeStyle = C.steelDark;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(g.right, g.y - 12); ctx.lineTo(g.right, g.y + 12); ctx.stroke();

      // --- Knob ----------------------------------------------------
      ctx.save();
      ctx.shadowColor = 'rgba(23,35,59,0.35)';
      ctx.shadowBlur = 6;
      ctx.shadowOffsetY = 2;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.roundRect(markerX - 9, g.y - 15, 18, 30, 9); ctx.fill();
      ctx.restore();
      ctx.strokeStyle = accent;
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.roundRect(markerX - 9, g.y - 15, 18, 30, 9); ctx.stroke();
      ctx.lineWidth = 1.5;
      ctx.lineCap = 'round';
      for (const d of [-3.5, 0, 3.5]) {
        ctx.beginPath(); ctx.moveTo(markerX + d, g.y - 5); ctx.lineTo(markerX + d, g.y + 5); ctx.stroke();
      }

      // --- End labels ----------------------------------------------
      ctx.fillStyle = C.muted;
      ctx.font = `700 9.5px ${MONO}`;
      ctx.textAlign = 'right';
      ctx.fillText('0.00 REST', g.boxX + g.boxW - 14, g.y + 26);
      ctx.textAlign = 'left';
      ctx.fillText('0.55 MAX', g.boxX + 14, g.y + 26);
      ctx.restore();
    }

    function setDisplacementFromPointer(clientX) {
      if (sliderX.disabled || gameState === 'launched') return;
      const rect = canvas.getBoundingClientRect();
      const g = displacementGeometry();
      const x = clamp(clientX - rect.left, g.left, g.right);
      const t = (g.right - x) / (g.right - g.left);
      sliderX.value = (Math.round((t * 0.55) / 0.01) * 0.01).toFixed(2);
      updateSliders();
    }

    function springEndX() {
      const natural = -CART.len / 2;
      if (cart.s < 0) return cart.s - CART.len / 2;
      const t = time - releaseT;
      const wob = released && t < 1.2 ? Math.sin(t * 34) * 0.05 * Math.exp(-t * 4) : 0;
      return natural + wob;
    }

    // Drawn as a real wound helix: every coil is an ellipse, with the far
    // half stroked before the near half so the wire reads as passing behind
    // itself. Coils bunch and the wire thickens as the spring is loaded.
    function drawSpring() {
      const g = springConstantGeometry();
      const ax = g.right;                       // anchored to the control box
      const ex = X(springEndX());
      const axisY = Y(0.20);
      const natural = X(-CART.len / 2);
      const full = natural - ax;
      const comp = clamp((natural - ex) / Math.max(1, full), 0, 1);

      // Stiffer spring = thicker wire, so the control changes what you see
      const kRatio = clamp(launchSetup.k / 600, 0, 1);
      const wire = clamp((0.020 + 0.028 * kRatio) * view.scale, 2.5, 7);
      const ry = (0.11 + 0.05 * comp) * view.scale;    // coils splay as they squash

      const capW = Math.max(4, wire * 1.1);
      const x0 = ax + capW, x1 = Math.max(ax + capW + 6, ex - capW);
      const span = x1 - x0;
      const coils = clamp(Math.round(span / Math.max(10, wire * 2.4)), 4, 14);
      const pitch = span / coils;
      const rx = pitch * 0.62;                          // >half pitch, so coils overlap

      const load = comp;
      const dark = `hsl(${26 - 6 * load}, ${24 + 44 * load}%, ${34 - 4 * load}%)`;
      const mid = `hsl(${28 - 6 * load}, ${26 + 44 * load}%, ${54 - 6 * load}%)`;
      const lite = `hsl(${32 - 6 * load}, ${30 + 40 * load}%, ${76 - 8 * load}%)`;

      ctx.save();
      ctx.lineCap = 'round';

      // Far half of every coil
      ctx.strokeStyle = dark;
      ctx.lineWidth = wire;
      for (let i = 0; i < coils; i++) {
        const cx = x0 + pitch * (i + 0.5);
        ctx.beginPath();
        ctx.ellipse(cx, axisY, rx, ry, 0, Math.PI, Math.PI * 2);
        ctx.stroke();
      }

      // Near half, then its highlight
      for (let i = 0; i < coils; i++) {
        const cx = x0 + pitch * (i + 0.5);
        ctx.strokeStyle = mid;
        ctx.lineWidth = wire;
        ctx.beginPath();
        ctx.ellipse(cx, axisY, rx, ry, 0, 0, Math.PI);
        ctx.stroke();
        ctx.strokeStyle = lite;
        ctx.lineWidth = Math.max(1, wire * 0.34);
        ctx.beginPath();
        ctx.ellipse(cx, axisY - wire * 0.20, rx * 0.97, ry * 0.97, 0, Math.PI * 0.12, Math.PI * 0.88);
        ctx.stroke();
      }

      // Straight leads into each end cap
      ctx.strokeStyle = mid;
      ctx.lineWidth = wire;
      ctx.beginPath(); ctx.moveTo(ax, axisY); ctx.lineTo(x0, axisY);
      ctx.moveTo(x1, axisY); ctx.lineTo(ex, axisY);
      ctx.stroke();

      // End caps
      const capH = ry * 2 + wire;
      ctx.fillStyle = C.steelDark;
      ctx.beginPath(); ctx.roundRect(ax - 1, axisY - capH / 2, 5, capH, 2); ctx.fill();
      ctx.beginPath(); ctx.roundRect(ex - 4, axisY - capH / 2, 5, capH, 2); ctx.fill();
      ctx.restore();

      // Charge sparks while it is held under load
      if (comp > 0.35 && gameState !== 'launched' && Math.random() < comp * 0.35) {
        spark(springEndX() + Math.random() * 0.3 - 0.15, 0.2 + (Math.random() - 0.5) * 0.2,
          { spread: 1.2, max: 0.35, size: 1.4, color: C.gold, grav: 2 });
      }
    }

    function drawTargets() {
      const r = rounds[currentRoundIdx];

      // Level 1 has no marker: with no friction the speed never changes,
      // so there is nothing to measure at any particular point on the track.
      if (r.level === 1) {
        return;
      } else {
        const ty = Y(r.targetHeight);
        const x0 = X(Math.max(0.2, flatLen - 1.0));

        // Tolerance band
        ctx.fillStyle = 'rgba(190,24,93,0.10)';
        ctx.fillRect(x0, Y(r.targetHeight + TOL), W - x0, Y(r.targetHeight - TOL) - Y(r.targetHeight + TOL));

        ctx.strokeStyle = C.rose;
        ctx.lineWidth = 2;
        ctx.setLineDash([10, 8]);
        ctx.lineDashOffset = -time * 18;
        ctx.beginPath(); ctx.moveTo(x0, ty); ctx.lineTo(W, ty); ctx.stroke();
        ctx.setLineDash([]);

        chip(`TARGET  ${r.targetHeight.toFixed(1)} m`, x0 + 4, ty - 7, C.rose);

        // Peak marker once the flight is over
        if (measured.done) {
          const py = Y(measured.height);
          const col = measured.ok ? C.green : C.ink;
          ctx.strokeStyle = col;
          ctx.globalAlpha = 0.85;
          ctx.lineWidth = 1.5;
          ctx.setLineDash([4, 5]);
          ctx.beginPath(); ctx.moveTo(x0, py); ctx.lineTo(W, py); ctx.stroke();
          ctx.setLineDash([]);
          ctx.globalAlpha = 1;
          // Right-aligned so it never collides with the target label
          chip(`${measured.ok ? '✓' : '•'} PEAK  ${measured.height.toFixed(2)} m`, W - 10, py - 7, col, { align: 'right' });
        }
      }
    }

    function drawTrail() {
      const n = trail.length;
      if (n < 3) return;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      // Segment by segment so the tail can fade instead of stopping dead
      for (let i = 1; i < n; i++) {
        const t = i / (n - 1);
        const a = trail[i - 1], b = trail[i];
        ctx.beginPath();
        ctx.moveTo(X(a.x), Y(a.y));
        ctx.lineTo(X(b.x), Y(b.y));
        ctx.strokeStyle = `rgba(37,99,235,${0.03 + 0.12 * t})`;
        ctx.lineWidth = CART.high * view.scale * (0.2 + 0.7 * t);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(X(a.x), Y(a.y));
        ctx.lineTo(X(b.x), Y(b.y));
        ctx.strokeStyle = `rgba(37,99,235,${0.08 + 0.45 * t})`;
        ctx.lineWidth = Math.max(1.2, 0.028 * view.scale) * (0.4 + 0.6 * t);
        ctx.stroke();
      }
    }

    function drawCart() {
      const p = getPath(Math.max(cart.s, -3));
      const px = X(cart.s < 0 ? cart.s : p.x);
      const py = Y(cart.s < 0 ? 0 : p.y);
      const S = view.scale;
      const rw = clamp(0.075 * S, 6, 12);

      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(-p.angle);
      ctx.translate(0, -rw * 0.5);

      const bodyH = CART.high * S;
      const bodyL = CART.len * S;
      const wheelR = CART.wheelR * S;
      const bodyTop = -(CART.wheelR + CART.high) * S;

      // Contact shadow
      ctx.fillStyle = 'rgba(23,35,59,0.22)';
      ctx.beginPath();
      ctx.ellipse(0, 0, bodyL * 0.5, wheelR * 0.35, 0, 0, Math.PI * 2);
      ctx.fill();

      // Wheels
      for (const wx of [-0.19 * S, 0.19 * S]) {
        ctx.save();
        ctx.translate(wx, -wheelR);
        ctx.fillStyle = '#3f4c5e';
        ctx.beginPath(); ctx.arc(0, 0, wheelR, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#1f2a3a'; ctx.lineWidth = Math.max(1, wheelR * 0.16); ctx.stroke();
        ctx.rotate(cart.s / CART.wheelR);
        ctx.strokeStyle = 'rgba(226,232,240,0.75)';
        ctx.lineWidth = Math.max(1, wheelR * 0.12);
        for (let i = 0; i < 4; i++) {
          const a = i * Math.PI / 2;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * wheelR * 0.2, Math.sin(a) * wheelR * 0.2);
          ctx.lineTo(Math.cos(a) * wheelR * 0.68, Math.sin(a) * wheelR * 0.68);
          ctx.stroke();
        }
        ctx.fillStyle = '#e2e8f0';
        ctx.beginPath(); ctx.arc(0, 0, wheelR * 0.22, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      // Body
      const bg = ctx.createLinearGradient(0, bodyTop, 0, bodyTop + bodyH);
      bg.addColorStop(0, '#60a5fa');
      bg.addColorStop(0.55, '#2563eb');
      bg.addColorStop(1, '#1d4ed8');
      ctx.shadowColor = 'rgba(23,35,59,0.28)';
      ctx.shadowBlur = 12;
      ctx.shadowOffsetY = 3;
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.roundRect(-bodyL / 2, bodyTop, bodyL, bodyH, Math.max(3, 0.06 * S));
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;
      ctx.strokeStyle = '#1e3a8a';
      ctx.lineWidth = Math.max(1, 0.014 * S);
      ctx.stroke();

      // Inset panel + mass label
      const padI = bodyH * 0.18;
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.beginPath();
      ctx.roundRect(-bodyL / 2 + padI, bodyTop + padI, bodyL - padI * 2, bodyH - padI * 2, Math.max(2, 0.03 * S));
      ctx.fill();

      if (S > 55) {
        ctx.fillStyle = C.ink;
        ctx.font = `bold ${Math.round(clamp(0.115 * S, 9, 16))}px ${MONO}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${cart.m.toFixed(1)}kg`, 0, bodyTop + bodyH / 2 + 0.5);
        ctx.textBaseline = 'alphabetic';
      }

      // Nose light
      ctx.fillStyle = C.gold;
      ctx.beginPath();
      ctx.roundRect(bodyL / 2 - 0.05 * S, bodyTop + bodyH * 0.3, 0.03 * S, bodyH * 0.4, 2);
      ctx.fill();

      // Thruster glow while the spring is still pushing
      if (cart.s < 0 && cart.v > 0.2) {
        const fl = 0.12 * S * (0.6 + Math.random() * 0.6);
        const fg = ctx.createLinearGradient(-bodyL / 2 - fl, 0, -bodyL / 2, 0);
        fg.addColorStop(0, 'rgba(251,191,36,0)');
        fg.addColorStop(1, 'rgba(251,191,36,0.8)');
        ctx.fillStyle = fg;
        ctx.beginPath();
        ctx.moveTo(-bodyL / 2, bodyTop + bodyH * 0.25);
        ctx.lineTo(-bodyL / 2 - fl, bodyTop + bodyH * 0.55);
        ctx.lineTo(-bodyL / 2, bodyTop + bodyH * 0.85);
        ctx.closePath();
        ctx.fill();
      }

      ctx.restore();
    }

    function drawParticles() {
      particles.forEach(p => {
        const a = 1 - p.life / p.max;
        ctx.globalAlpha = a * a;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(X(p.x), Y(p.y), p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    // Level 1: a velocity arrow rides above the cart. Its magnitude reads
    // "v = ?" until the learner commits to an answer.
    // Called out on the spring itself, so the compression that feeds the
    // calculation is read where it happens. It tracks the cart while the
    // spring loads, then stays pinned at the launch value for the whole run.
    function drawCompressionCallout() {
      const x = demoPhase === 'load' ? Math.max(0, -cart.s) : launchSetup.x;
      if (x < 0.02) return;
      const rest = X(-CART.len / 2);
      const now = X(-CART.len / 2 - x);
      if (rest - now < 4) return;
      // Clear of the cart body, which sits over the compression zone
      const y = Y(0) - (CART.wheelR + CART.high + 0.16) * view.scale;

      ctx.save();
      ctx.strokeStyle = C.orange;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(rest, y + 4); ctx.lineTo(rest, Y(0.20)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(now, y + 4); ctx.lineTo(now, Y(0.20)); ctx.stroke();
      ctx.setLineDash([]);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(now, y); ctx.lineTo(rest, y); ctx.stroke();
      ctx.fillStyle = C.orange;
      [[now, 1], [rest, -1]].forEach(([hx, dir]) => {
        ctx.beginPath();
        ctx.moveTo(hx, y);
        ctx.lineTo(hx + dir * 6, y - 4);
        ctx.lineTo(hx + dir * 6, y + 4);
        ctx.closePath();
        ctx.fill();
      });
      ctx.restore();

      chip(`x = ${x.toFixed(2)} m`, (now + rest) / 2, y - 10, C.orange, { align: 'center', size: 14 });
    }

    function drawVelocityVector() {
      if (cart.s < 0 || cart.v <= 0.05) return;
      const px = X(cart.s);
      const baseY = Y(0) - (CART.high + CART.wheelR) * view.scale - 18;
      const len = clamp(cart.v * 0.22 * view.scale, 34, 150);
      const tip = px + len;

      ctx.save();
      ctx.strokeStyle = C.blue;
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(px, baseY); ctx.lineTo(tip - 8, baseY); ctx.stroke();
      ctx.fillStyle = C.blue;
      ctx.beginPath();
      ctx.moveTo(tip, baseY);
      ctx.lineTo(tip - 13, baseY - 7);
      ctx.lineTo(tip - 13, baseY + 7);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      const label = revealSpeed ? `v = ${cart.v.toFixed(1)} m/s` : 'v = ?';
      chip(label, px + len / 2, baseY - 12, C.blue, { align: 'center', size: 17 });

      // While the cart is held at the end of a run, restate the task
      if (demoPhase === 'hold' && !revealSpeed) {
        chip('Solve for the velocity', px + len / 2, baseY - 48, C.muted, { align: 'center', size: 15 });
      }
    }

    function drawReadout() {
      const r = rounds[currentRoundIdx];
      if (r.level === 1) {
        drawCompressionCallout();          // stays up for the whole cycle
        drawVelocityVector();
        return;
      }

      if (gameState !== 'launched' && gameState !== 'result') return;
      const p = getPath(Math.max(0, cart.s));
      const px = X(cart.s < 0 ? cart.s : p.x);
      const top = Y(cart.s < 0 ? 0 : p.y) - (CART.high + CART.wheelR) * view.scale - 14;
      // Near the top of the frame the labels flip below the cart instead of stacking up
      const below = top < 70;
      const py = below ? top + (CART.high + CART.wheelR) * view.scale + 60 : top;
      const step = below ? 26 : -26;
      chip(`v ${Math.max(0, cart.v).toFixed(2)} m/s`, px, py, C.blue, { align: 'center' });
      chip(`h ${p.y.toFixed(2)} m`, px, py + step, C.rose, { align: 'center' });
    }

    function drawEnergyBar() {
      if (!hintVisible) return;
      if (W < 560) return;
      const k = launchSetup.k, x0 = launchSetup.x;
      const total = 0.5 * k * x0 * x0;
      if (total <= 0) return;

      const comp = Math.max(0, -cart.s);
      const spring = 0.5 * k * comp * comp;
      const kinetic = 0.5 * cart.m * cart.v * cart.v;
      const grav = cart.m * G * Math.max(0, getPath(Math.max(0, cart.s)).y);

      // Top-right: the hint panel it accompanies owns the top-left
      const bw = Math.min(420, Math.max(330, W * 0.28)), bh = 16;
      const bx = W - PAD.r - bw - 4, by = 92;

      ctx.fillStyle = 'rgba(255,255,255,0.96)';
      ctx.strokeStyle = C.line;
      ctx.lineWidth = 1.25;
      ctx.beginPath(); ctx.roundRect(bx - 16, by - 18, bw + 32, bh + 58, 12);
      ctx.fill(); ctx.stroke();

      ctx.fillStyle = C.muted;
      ctx.font = `800 10px ${SANS}`;
      ctx.textAlign = 'left';
      ctx.fillText('ENERGY BUDGET · HINT', bx, by - 2);
      ctx.textAlign = 'right';
      ctx.fillStyle = C.ink;
      ctx.font = `800 11px ${MONO}`;
      ctx.fillText(`${total.toFixed(1)} J`, bx + bw, by - 2);

      const y = by + 7;
      ctx.fillStyle = '#eef1f6';
      ctx.beginPath(); ctx.roundRect(bx, y, bw, bh, 6); ctx.fill();

      ctx.save();
      ctx.beginPath(); ctx.roundRect(bx, y, bw, bh, 4); ctx.clip();
      let cx = bx;
      [[spring, C.orange], [kinetic, C.blue], [grav, C.rose]].forEach(([val, col]) => {
        const w = clamp(val / total, 0, 1) * bw;
        ctx.fillStyle = col;
        ctx.fillRect(cx, y, w, bh);
        cx += w;
      });
      ctx.restore();
      ctx.strokeStyle = C.line;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.roundRect(bx, y, bw, bh, 6); ctx.stroke();

      ctx.font = `700 10.5px ${MONO}`;
      ctx.textAlign = 'left';
      let lx = bx;
      [['SPRING', spring, C.orange], ['KINETIC', kinetic, C.blue], ['HEIGHT', grav, C.rose]].forEach(([label, val, col]) => {
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(lx + 3, y + bh + 12, 3.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = C.ink;
        ctx.fillText(`${label} ${val.toFixed(1)} J`, lx + 11, y + bh + 16);
        lx += Math.min(120, bw / 3);
      });
    }

    function render() {
      drawBackground();
      drawTrack();
      drawGround();
      drawTargets();
      // Boxes first: the spring anchors to the constant box and overlaps its edge
      drawSpringConstantControl();
      drawDisplacementControl();
      drawSpring();
      drawTrail();
      drawParticles();
      drawCart();
      drawReadout();
      drawEnergyBar();
    }

    // ---------------------------------------------------------------
    // Physics
    // ---------------------------------------------------------------
    function integrate(dt) {
      const k = launchSetup.k;
      let force = 0;
      if (cart.s < 0) force += k * (-cart.s);                 // Hooke's law
      const p = getPath(Math.max(0, cart.s));
      force -= cart.m * G * Math.sin(p.angle);                // gravity along the ramp

      cart.v += (force / cart.m) * dt;
      cart.s += cart.v * dt;

      const limit = -launchSetup.x;
      if (cart.s < limit) { cart.s = limit; if (cart.v < 0) cart.v = 0; }

      if (!released && cart.s >= 0) {
        released = true;
        releaseT = time;
        for (let i = 0; i < 18; i++) {
          spark(0.02, 0.18, { vx: -1.5 - Math.random() * 2, spread: 3.2, color: i % 3 ? '#fbbf24' : '#fde68a' });
        }
      }
    }

    function stepPhysics(dt) {
      const sub = 1 / 600;
      let remain = dt;
      while (remain > 0 && gameState === 'launched') {
        const h = Math.min(sub, remain);
        remain -= h;
        integrate(h);
        checkFinish();
      }

      const r = rounds[currentRoundIdx];
      if (gameState === 'launched') {
        const p = getPath(Math.max(0, cart.s));
        trail.push({ x: cart.s < 0 ? cart.s : p.x, y: p.y + CART.wheelR + CART.high / 2 });
        if (trail.length > 90) trail.shift();

        // Dust kicked up while the wheels are driving hard
        if (cart.s > -0.05 && cart.v > 1 && Math.random() < 0.4) {
          spark(cart.s - 0.2, 0.03, { vx: -cart.v * 0.15, vy: 0.6, spread: 0.8, max: 0.5, size: 1.6, grav: 1.5, color: 'rgba(148,163,184,0.8)' });
        }
        if (r.level === 2 && cart.v > 0.4 && Math.random() < 0.25) {
          spark(p.x - Math.cos(p.angle) * 0.3, p.y + 0.1, { spread: 0.8, max: 0.4, size: 1.3, grav: 1, color: '#38bdf8' });
        }
      }
    }

    function checkFinish() {
      if (cart.v <= 0 && cart.s > 0) handleResult(0, getPath(cart.s).y);
    }

    // Level 1 runs the launch on a loop while the question is on screen, so
    // the learner watches the motion they are being asked about. At the end
    // of each run the cart holds still, with the question left on screen,
    // before it resets and launches again.
    function stepDemo(dt) {
      const x = launchSetup.x;
      demoT += dt;

      // Cart rolls back into the spring; the displacement slider tracks it live
      if (demoPhase === 'load') {
        const p = Math.min(1, demoT / LOAD_TIME);
        cart.s = -x * (1 - Math.pow(1 - p, 3));
        cart.v = 0;
        released = false;
        if (p >= 1) { cart.s = -x; demoPhase = 'armed'; demoT = 0; }
        return;
      }

      // Held loaded, so the compression can be read off before the launch.
      // The energy question freezes it here until the learner answers.
      if (demoPhase === 'armed') {
        cart.s = -x;
        cart.v = 0;
        if (l1Step === 'energy') return;
        if (demoT >= ARMED_HOLD) { demoPhase = 'fly'; demoT = 0; }
        return;
      }

      if (demoPhase === 'fly') {
        const sub = 1 / 600;
        let remain = dt;
        while (remain > 0) {
          const h = Math.min(sub, remain);
          remain -= h;
          integrate(h);
          if (cart.s > runLen) {        // reached the end - pause on the question
            cart.s = runLen;
            demoPhase = 'hold';
            demoT = 0;
            break;
          }
        }
        return;
      }

      // 'hold' - question stays up, then the whole cycle repeats
      if (demoT >= END_HOLD) {
        cart.s = 0;
        cart.v = 0;
        released = false;
        demoPhase = 'load';
        demoT = 0;
      }
    }

    // ---------------------------------------------------------------
    // Round flow
    // ---------------------------------------------------------------
    function updateSliders() {
      if (gameState === 'launched') return;
      const kVal = parseFloat(sliderK.value);
      const xVal = parseFloat(sliderX.value);

      if (gameState === 'setup' || gameState === 'predict') {
        launchSetup.k = kVal;
        launchSetup.x = xVal;
        cart.s = -xVal;
        cart.v = 0;
      }
    }

    // Equations, then the same equations with the numbers in. No prose.
    function updateHint() {
      const r = rounds[currentRoundIdx];
      const m = r.mass.toFixed(1);
      const h = (r.targetHeight || 0).toFixed(1);

      if (r.level === 1) {
        hintTitle.textContent = 'Solve for v';
        hintBody.innerHTML = `
          <p class="eq">½kx² = ½mv²</p>
          <p class="eq">v = x √(k / m)</p>
          <p class="sub">v = ${r.x.toFixed(2)} √(${r.k} / ${m})</p>`;
      } else if (r.adjustable === 'k') {
        hintTitle.textContent = 'Solve for k';
        hintBody.innerHTML = `
          <p class="eq">½kx² = mgh</p>
          <p class="eq">k = 2mgh / x²</p>
          <p class="sub">k = 2(${m})(9.8)(${h}) / ${r.x.toFixed(2)}²</p>`;
      } else if (r.adjustable === 'x') {
        hintTitle.textContent = 'Solve for x';
        hintBody.innerHTML = `
          <p class="eq">½kx² = mgh</p>
          <p class="eq">x = √(2mgh / k)</p>
          <p class="sub">x = √(2(${m})(9.8)(${h}) / ${r.k})</p>`;
      } else {
        hintTitle.textContent = 'Solve for k and x';
        hintBody.innerHTML = `
          <p class="eq">½kx² = mgh</p>
          <p class="sub">½kx² = (${m})(9.8)(${h})</p>`;
      }
    }

    function setPredictionChoice(value, button) {
      if (gameState === 'intro') return;
      selectedPrediction = value;
      predictionChoices.querySelectorAll('button').forEach(choice => {
        choice.classList.remove('is-selected');
        choice.setAttribute('aria-pressed', 'false');
      });
      button.classList.add('is-selected');
      button.setAttribute('aria-pressed', 'true');
      if (gameState === 'predict') {
        // The cart is already running; committing just reveals the magnitude.
        predictionChoices.querySelectorAll('button').forEach(b => b.disabled = true);
        setTimeout(() => handleResult(cart.v, 0), 250);
      }
    }

    function renderPredictionChoices() {
      const r = rounds[currentRoundIdx];
      const actual = r.x * Math.sqrt(r.k / r.mass);
      // The v-squared option is the classic slip: solving 0.5kx^2 = 0.5mv^2 for
      // v^2 and stopping there. Half and double cover under/over estimates.
      const options = [actual, actual * actual, actual / 2, actual * 2]
        .map(v => Math.round(v * 10) / 10)
        .filter((v, i, all) => all.indexOf(v) === i)
        .sort((a, b) => a - b);

      selectedPrediction = null;
      predictionChoices.innerHTML = options.map(value => `
        <button type="button" class="choice" data-speed="${value}" aria-pressed="false">${value.toFixed(1)} m/s</button>`).join('');
      predictionChoices.querySelectorAll('button').forEach(button => {
        button.addEventListener('click', () => setPredictionChoice(parseFloat(button.dataset.speed), button));
      });
    }

    function initRound() {
      const r = rounds[currentRoundIdx];
      cart.m = r.mass;
      cart.v = 0;
      released = false;
      releaseT = -99;
      revealSpeed = false;
      demoPhase = 'load';
      demoT = 0;
      trail = [];
      particles = [];
      measured = { speed: 0, height: 0, ok: false, done: false };

      btnMain.disabled = true;
      introT = 0;

      if (r.level === 1) {
        introNextState = 'predict';

        sliderK.value = r.k;
        sliderX.value = r.x;
        sliderK.disabled = true;
        sliderX.disabled = true;

        predictContainer.classList.remove('hidden');
        renderPredictionChoices();

        promptTitle.textContent = "Solve for the velocity";
        // Level 1 launches on the choice itself - no separate launch button
        btnMain.classList.add('hidden');
      } else {
        introNextState = 'setup';

        sliderK.value = r.k;
        sliderX.value = r.x;
        sliderK.disabled = r.adjustable === 'x';
        sliderX.disabled = r.adjustable === 'k';

        predictContainer.classList.add('hidden');

        promptTitle.textContent = r.adjustable === 'both'
          ? `Reach ${r.targetHeight.toFixed(1)} m using both controls`
          : `Reach ${r.targetHeight.toFixed(1)} m using the ${r.adjustable === 'k' ? 'spring constant' : 'displacement'}`;
        btnMain.classList.remove('hidden');
        btnMain.textContent = "Launch";
      }

      gameState = introNextState;
      updateSliders();
      // Begin each problem from the cart's resting position. The frame loop
      // then draws the cart moving backward as the spring is compressed.
      gameState = 'intro';
      cart.s = 0;
      cart.v = 0;
      if (r.level === 1) predictionChoices.querySelectorAll('button').forEach(button => button.disabled = true);
      updateHint();
      hintVisible = false;
      hintOverlay.classList.add('hidden');
      resize();
    }

    function handleResult(speed, height) {
      gameState = 'result';
      const r = rounds[currentRoundIdx];

      if (r.level === 1) {
        const actualSpeed = r.x * Math.sqrt(r.k / r.mass);
        const predictedSpeed = selectedPrediction || 0;
        const squared = Math.round(actualSpeed * actualSpeed * 10) / 10;

        revealSpeed = true;
        measured = { speed: speed || actualSpeed, height: 0, ok: false, done: true };

        if (Math.abs(predictedSpeed - actualSpeed) < 0.05) {
          promptTitle.textContent = `Correct — v = ${actualSpeed.toFixed(1)} m/s.`;
        } else if (Math.abs(predictedSpeed - squared) < 0.05) {
          // The square-root slip: name it explicitly rather than just marking it wrong
          promptTitle.textContent =
            `${squared.toFixed(1)} is v², not v. Energy gives you v² — take the square root: v = ${actualSpeed.toFixed(1)} m/s.`;
        } else {
          promptTitle.textContent = `v = ${actualSpeed.toFixed(1)} m/s, not ${predictedSpeed.toFixed(1)} m/s.`;
        }
      } else {
        const error = Math.abs(height - r.targetHeight);

        measured = { speed: 0, height, ok: error <= TOL, done: true };
        if (measured.ok) {
          const p = getPath(cart.s);
          for (let i = 0; i < 22; i++) {
            spark(p.x, p.y + 0.3, { spread: 2.6, color: '#4ade80', max: 0.8, grav: 3 });
          }
        }
        promptTitle.textContent = `Peak ${height.toFixed(2)} m · target ${r.targetHeight.toFixed(1)} m`;
      }

      // The launch button is hidden during level 1, but advancing still needs it
      btnMain.classList.remove('hidden');
      btnMain.disabled = false;
      btnMain.textContent = "Next round";
    }

    // ---------------------------------------------------------------
    // Main loop (always running so idle scenes stay alive)
    // ---------------------------------------------------------------
    function frame(t) {
      const dt = lastFrame ? Math.min((t - lastFrame) / 1000, 0.05) : 0;
      lastFrame = t;
      time += dt;

      if (gameState === 'intro') {
        introT = Math.min(INTRO_DURATION, introT + dt);
        const p = Math.min(1, introT / INTRO_DURATION);
        const eased = 1 - Math.pow(1 - p, 3);
        cart.s = -parseFloat(sliderX.value) * eased;
        cart.v = 0;
        if (p >= 1) {
          cart.s = -parseFloat(sliderX.value);
          gameState = introNextState;
          btnMain.disabled = false;
          if (introNextState === 'predict') {
            // The intro just finished loading the spring - hold on it, don't reload
            demoPhase = 'armed';
            demoT = 0;
            predictionChoices.querySelectorAll('button').forEach(button => button.disabled = false);
          }
        }
      } else if (gameState === 'launched') {
        stepPhysics(dt);
      } else if (rounds[currentRoundIdx].level === 1 && (gameState === 'predict' || gameState === 'result')) {
        stepDemo(dt);
      }
      updateParticles(dt);
      updateView(dt);
      render();

      requestAnimationFrame(frame);
    }

    // Input Listeners
    canvas.addEventListener('pointerdown', event => {
      const rect = canvas.getBoundingClientRect();
      const g = springConstantGeometry();
      const dx = displacementGeometry();
      const px = event.clientX - rect.left;
      const py = event.clientY - rect.top;
      if (!sliderK.disabled && px >= g.trackX - 28 && px <= g.trackX + 28 && py >= g.trackTop - 28 && py <= g.trackBottom + 28) {
        draggingK = true;
        canvas.setPointerCapture(event.pointerId);
        setSpringConstantFromPointer(event.clientY);
      } else if (!sliderX.disabled && px >= dx.left - 24 && px <= dx.right + 24 && py >= dx.y - 24 && py <= dx.y + 24) {
        draggingX = true;
        canvas.setPointerCapture(event.pointerId);
        setDisplacementFromPointer(event.clientX);
      }
    });
    canvas.addEventListener('pointermove', event => {
      if (draggingK) setSpringConstantFromPointer(event.clientY);
      if (draggingX) setDisplacementFromPointer(event.clientX);
    });
    canvas.addEventListener('pointerup', event => {
      draggingK = false;
      draggingX = false;
      if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
    });
    canvas.addEventListener('pointercancel', () => { draggingK = false; draggingX = false; });
    btnHint.addEventListener('click', () => {
      hintVisible = true;
      hintOverlay.classList.remove('hidden');
    });
    btnCloseHint.addEventListener('click', () => {
      hintVisible = false;
      hintOverlay.classList.add('hidden');
    });

    btnMain.addEventListener('click', () => {
      const r = rounds[currentRoundIdx];

      if (gameState === 'predict' || gameState === 'setup') {
        if (gameState === 'predict' && selectedPrediction === null) {
          predictionChoices.classList.add('nudge');
          setTimeout(() => predictionChoices.classList.remove('nudge'), 460);
          return;
        }

        launchSetup.k = parseFloat(sliderK.value);
        launchSetup.x = parseFloat(sliderX.value);

        gameState = 'launched';
        predictContainer.classList.add('hidden');
        if (r.level === 1) predictionChoices.querySelectorAll('button').forEach(button => button.disabled = true);
        sliderK.disabled = true;
        sliderX.disabled = true;
        btnMain.disabled = true;
        btnMain.textContent = "Simulating...";

        cart.s = -launchSetup.x;
        cart.v = 0;
        released = false;
        trail = [];

      } else if (gameState === 'result') {
        currentRoundIdx++;
        if (currentRoundIdx >= rounds.length) {
          gameState = 'gameover';
          promptTitle.textContent = "Challenge complete";
          btnMain.textContent = "Play again";
        } else {
          initRound();
        }
      } else if (gameState === 'gameover') {
        currentRoundIdx = 0;
        initRound();
      }
    });

    // Boot
    resize();
    initRound();
    requestAnimationFrame(frame);

  </script>
  </main>
</body>
</html>
