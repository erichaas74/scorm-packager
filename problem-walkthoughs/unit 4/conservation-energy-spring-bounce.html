<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ball, Spring, and Energy</title>
<style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f1f5f9;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      color: #0f172a;
      padding: 18px;
    }
    .app {
      width: min(980px, 100%);
      background: #ffffff;
      border: 5px solid #285f9f;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgb(15 23 42 / 14%);
      padding: 16px;
    }
    h1 {
      margin: 0 0 10px;
      text-align: center;
      font-size: clamp(1.25rem, 3vw, 2rem);
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      background: #bfdbfe;
      box-shadow: inset 0 0 0 1px rgb(255 255 255 / 16%);
    }
  </style>

  <style id="rise-compliance-styles">
    :root {
      --rise-brand: #285f9f;
      --rise-surface: #ffffff;
      --rise-text: #0f172a;
      --rise-muted: #64748b;
      --rise-line: #cbd5e1;
      --rise-success: #15803d;
      --rise-warning: #b45309;
      --rise-danger: #b91c1c;
    }
    html, body { background: transparent !important; max-width: 100%; }
    
    button, input, select, textarea, [role="button"] { min-height: 24px; }
    :focus-visible { outline: 3px solid #285f9f !important; outline-offset: 3px !important; }
    .rise-sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }
    html.rise-paused *, html.rise-paused *::before, html.rise-paused *::after { animation-play-state: paused !important; }
    @media (max-width: 480px) {
      body { overflow-x: hidden; }
      button, input, select, textarea { font-size: max(16px, 1em); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
  <script id="rise-walkthrough-runtime">
  (() => {
    'use strict';
    let completionSent = false;
    const nativeRequestAnimationFrame = window.requestAnimationFrame.bind(window);
    const nativeCancelAnimationFrame = window.cancelAnimationFrame.bind(window);
    let frameSequence = 0;
    const pendingFrames = new Map();

    function scheduleFrame(id) {
      const record = pendingFrames.get(id);
      if (!record || document.hidden) return;
      record.nativeId = nativeRequestAnimationFrame((time) => {
        if (!pendingFrames.has(id)) return;
        if (document.hidden) {
          record.nativeId = null;
          return;
        }
        pendingFrames.delete(id);
        record.callback(time);
      });
    }

    window.requestAnimationFrame = (callback) => {
      const id = ++frameSequence;
      pendingFrames.set(id, { callback, nativeId: null });
      scheduleFrame(id);
      return id;
    };

    window.cancelAnimationFrame = (id) => {
      const record = pendingFrames.get(id);
      if (record && record.nativeId !== null) nativeCancelAnimationFrame(record.nativeId);
      pendingFrames.delete(id);
    };

    window.RiseWalkthrough = Object.freeze({
      complete() {
        if (completionSent) return;
        completionSent = true;
        document.documentElement.dataset.riseComplete = 'true';
        window.parent.postMessage({ type: 'complete' }, '*');
      },
      get completed() { return completionSent; },
      reduceMotion: window.matchMedia('(prefers-reduced-motion: reduce)').matches
    });

    function normalizeControls(root = document) {
      root.querySelectorAll('button:not([type])').forEach((button) => { button.type = 'button'; });
      root.querySelectorAll('[role="button"]').forEach((control) => {
        if (!control.hasAttribute('tabindex')) control.tabIndex = 0;
      });
    }

    document.addEventListener('keydown', (event) => {
      const control = event.target.closest?.('[role="button"]');
      if (!control || (event.key !== 'Enter' && event.key !== ' ')) return;
      event.preventDefault();
      control.click();
    });

    document.addEventListener('DOMContentLoaded', () => {
      normalizeControls();
      const status = document.createElement('p');
      status.className = 'rise-sr-only';
      status.id = 'rise-completion-status';
      status.setAttribute('role', 'status');
      status.setAttribute('aria-live', 'polite');
      status.textContent = 'Interactive walkthrough ready.';
      document.querySelector('main')?.append(status);
      new MutationObserver((records) => records.forEach((record) => {
        record.addedNodes.forEach((node) => { if (node.nodeType === 1) normalizeControls(node); });
      })).observe(document.querySelector('main') || document.body, { childList: true, subtree: true });
    });

    document.addEventListener('visibilitychange', () => {
      document.documentElement.classList.toggle('rise-paused', document.hidden);
      if (!document.hidden) [...pendingFrames.keys()].forEach(scheduleFrame);
    });
  })();
  </script>
    <h1>Energy Transfer: Falling Ball and Spring</h1>
    <canvas id="sim" width="940" height="620" tabindex="0" role="group" aria-label="Energy transfer simulation. Choose PE gravity with 1, kinetic energy with 2, or spring potential energy with 3. Press H for a hint." aria-keyshortcuts="1 2 3 H"></canvas>
<script>
const canvas = document.getElementById('sim');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const floorY = 555, ballX = 300, ballRadius = 23;
const springTop = 445, springBottom = floorY, maxCompression = 72, topY = 90;
const contactY = springTop-ballRadius;
const fallDistance = contactY-topY;
const fallDuration = 2;
const gravity = 2*fallDistance/(fallDuration*fallDuration);
const impactSpeed = gravity*fallDuration;
const springOmega = Math.sqrt((impactSpeed*impactSpeed+2*gravity*maxCompression)/(maxCompression*maxCompression));
const contactDuration = (2*Math.PI-2*Math.atan(impactSpeed*springOmega/gravity))/springOmega;
const cycleDuration = 2*fallDuration+contactDuration;
const checkpoints = [0, 1.95, 2.40, 3.85];
const answers = ['peg', 'ke', 'pes', 'ke'];
const labels = { peg: 'PE gravity', ke: 'KE', pes: 'PE spring' };
let questionIndex = 0;
let phaseTime = checkpoints[0];
let targetTime = cycleDuration + checkpoints[0];
let moving = true;
let revealed = false;
let selected = null;
let lastTime = 0;
let animationTime = 0;
let resultMessage = '';
let advanceTimer = 0;
let hintActive = false;
let completed = false;
const riseAnsweredQuestions = new Set();
const barHitboxes = [
  {x:625,y:225,w:74,h:280,key:'peg'},
  {x:720,y:225,w:74,h:280,key:'ke'},
  {x:815,y:225,w:74,h:280,key:'pes'}
];
const hintHitbox = {x:684,y:548,w:142,h:28};

function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
function getState(t){
  const cycleTime=t%cycleDuration;
  const risingStart=fallDuration+contactDuration;
  let y,velocity,compression=0;
  if(cycleTime<fallDuration){
    y=topY+.5*gravity*cycleTime*cycleTime;
    velocity=gravity*cycleTime;
  }else if(cycleTime<risingStart){
    const contactTime=cycleTime-fallDuration;
    compression=(impactSpeed/springOmega)*Math.sin(springOmega*contactTime)+(gravity/(springOmega*springOmega))*(1-Math.cos(springOmega*contactTime));
    velocity=impactSpeed*Math.cos(springOmega*contactTime)+(gravity/springOmega)*Math.sin(springOmega*contactTime);
    y=contactY+compression;
  }else{
    const riseTime=cycleTime-risingStart;
    y=contactY-impactSpeed*riseTime+.5*gravity*riseTime*riseTime;
    velocity=-impactSpeed+gravity*riseTime;
  }
  const gravitationalEnergy=gravity*(contactY-y);
  const kineticEnergy=.5*velocity*velocity;
  const springEnergy=.5*springOmega*springOmega*compression*compression;
  const total=gravitationalEnergy+kineticEnergy+springEnergy||1;
  return {y,compression,peG:clamp(gravitationalEnergy/total,0,1),ke:clamp(kineticEnergy/total,0,1),peS:clamp(springEnergy/total,0,1)};
}
function drawBackground(){
  ctx.clearRect(0,0,W,H); const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#e1e8eb'); g.addColorStop(.62,'#c9d6da'); g.addColorStop(1,'#aebfc5'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(71,100,112,.16)'; ctx.lineWidth=1;
  for(let y=40;y<floorY;y+=40){ctx.beginPath();ctx.moveTo(30,y);ctx.lineTo(570,y);ctx.stroke();}
  const floorGlow=ctx.createLinearGradient(0,floorY,0,floorY+44);floorGlow.addColorStop(0,'#64748b');floorGlow.addColorStop(.12,'#cbd5e1');floorGlow.addColorStop(1,'#e2e8f0');ctx.fillStyle=floorGlow;ctx.fillRect(25,floorY,545,44);ctx.fillStyle='rgba(255,255,255,.58)';ctx.fillRect(25,floorY,545,2);
}
function drawSpring(compression){
  const top=springTop+compression,x=ballX,width=54,coils=9;
  const metal=ctx.createLinearGradient(x-width,0,x+width,0);metal.addColorStop(0,'#1f2937');metal.addColorStop(.28,'#9ca3af');metal.addColorStop(.5,'#374151');metal.addColorStop(.72,'#d1d5db');metal.addColorStop(1,'#111827');
  ctx.save();ctx.shadowColor='rgba(15,23,42,.45)';ctx.shadowBlur=7;ctx.strokeStyle=metal;ctx.lineWidth=4;ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(x,springBottom);
  const usable=springBottom-top;
  for(let i=1;i<=coils*2;i++){const yy=springBottom-usable*i/(coils*2);const xx=x+(i%2===0?-width/2:width/2);ctx.lineTo(xx,yy);}ctx.lineTo(x,top);ctx.stroke();
  const base=ctx.createLinearGradient(x-45,0,x+45,0);base.addColorStop(0,'#111827');base.addColorStop(.5,'#9ca3af');base.addColorStop(1,'#1f2937');ctx.fillStyle=base;ctx.fillRect(x-45,springBottom-3,90,6);ctx.restore();
}
function drawBall(y){
  const grad=ctx.createRadialGradient(ballX-9,y-10,4,ballX,y,ballRadius);grad.addColorStop(0,'#f2e5b5');grad.addColorStop(.35,'#c99d4c');grad.addColorStop(1,'#9b5d34');
  ctx.save();ctx.shadowColor='rgba(155,93,52,.42)';ctx.shadowBlur=15;ctx.fillStyle=grad;ctx.beginPath();ctx.arc(ballX,y,ballRadius,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#dfc58c';ctx.lineWidth=2;ctx.stroke();ctx.restore();
}
function drawFormulaCard(x,y,w,h,text,color){
  ctx.fillStyle='rgba(255,255,255,.92)';ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(x,y,w,h,9);ctx.fill();ctx.stroke();ctx.fillStyle='#0f172a';ctx.font='bold 15px Arial';ctx.textAlign='center';ctx.fillText(text,x+w/2,y+22);
}
function drawDimensionArrow(x,y1,y2,label,valueText,color){
  if(Math.abs(y2-y1)<3)return;const top=Math.min(y1,y2),bottom=Math.max(y1,y2);ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=3;ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,bottom);ctx.stroke();ctx.setLineDash([]);
  for(const [yy,dir] of [[top,1],[bottom,-1]]){ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x-7,yy+11*dir);ctx.lineTo(x+7,yy+11*dir);ctx.closePath();ctx.fill();}
  const mid=(top+bottom)/2;ctx.fillStyle='#fff';ctx.strokeStyle='#cbd5e1';ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(x-58,mid-25,116,50,8);ctx.fill();ctx.stroke();ctx.fillStyle=color;ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.fillText(label,x,mid-5);ctx.fillStyle='#0f172a';ctx.font='bold 15px Arial';ctx.fillText(valueText,x,mid+15);
}
function drawEnergyBox(x,label,value,color,key){
  const y=225,w=74,h=280,showValues=revealed||hintActive||completed,pulse=(!moving&&!revealed&&!hintActive)?(0.5+0.5*Math.sin(animationTime*4.2)):0;
  ctx.save();ctx.shadowColor=color;ctx.shadowBlur=selected===key?20:(!moving&&!revealed?8+10*pulse:0);
  ctx.fillStyle=selected===key?'rgba(219,234,254,.96)':'rgba(248,250,252,.94)';ctx.fillRect(x,y,w,h);ctx.strokeStyle=selected===key?'#1d4ed8':(pulse>.5?color:'#94a3b8');ctx.lineWidth=selected===key?4:2;ctx.strokeRect(x,y,w,h);
  if(showValues){const fillH=h*value,fill=ctx.createLinearGradient(0,y+h-fillH,0,y+h);fill.addColorStop(0,color);fill.addColorStop(1,'rgba(255,255,255,.58)');ctx.fillStyle=fill;ctx.fillRect(x,y+h-fillH,w,fillH);ctx.fillStyle='#0f172a';ctx.font='bold 16px Arial';ctx.textAlign='center';ctx.fillText(Math.round(value*100)+'%',x+w/2,y+h+28);}
  else{ctx.fillStyle='#475569';ctx.font='bold 36px Arial';ctx.textAlign='center';ctx.fillText('?',x+w/2,y+h/2+12);}
  ctx.fillStyle='#0f172a';ctx.font='bold 16px Arial';ctx.textAlign='center';ctx.fillText(label,x+w/2,y-18);ctx.restore();
}
function drawHeightScale(ballY){
  const x=78,top=topY,bottom=floorY;
  ctx.strokeStyle='#475569';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,bottom);ctx.stroke();
  ctx.fillStyle='#334155';ctx.font='bold 12px Arial';ctx.textAlign='right';ctx.fillText('height',x-10,top-12);
  for(let i=0;i<=4;i++){
    const y=bottom-(bottom-top)*i/4;
    ctx.strokeStyle='#64748b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-7,y);ctx.lineTo(x+7,y);ctx.stroke();
    ctx.fillStyle='#475569';ctx.font='12px Arial';ctx.fillText(`${i} m`,x-12,y+4);
  }
  const markerX=ballX-ballRadius-8;
  ctx.strokeStyle='#2563eb';ctx.fillStyle='#2563eb';ctx.lineWidth=2;ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(x+10,ballY);ctx.lineTo(markerX,ballY);ctx.stroke();ctx.setLineDash([]);
  ctx.beginPath();ctx.arc(x+10,ballY,4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.moveTo(markerX,ballY);ctx.lineTo(markerX-9,ballY-5);ctx.lineTo(markerX-9,ballY+5);ctx.closePath();ctx.fill();
}
function drawScene(state){
  drawBackground();ctx.textAlign='left';ctx.fillStyle='#0f172a';ctx.font='bold 20px Arial';ctx.fillText('Ball and Spring',38,34);ctx.font='15px Arial';ctx.fillStyle='#475569';ctx.fillText(completed?'Completed. Watch the energy transfer through each cycle.':hintActive?'Hint: watch the colored energy values for two cycles.':moving?'Watch the full cycle, then choose an energy box.':revealed?'Answer recorded. The next question is coming.':'Choose the flashing box with the greatest energy.',38,58);
  drawSpring(state.compression);drawBall(state.y);
  drawFormulaCard(112,78,132,36,'PEg = mgh','#4d7594');
  drawFormulaCard(390,78,142,36,'KE = ½mv²','#a97832');
  drawFormulaCard(ballX-92,575,184,36,'PE spring = ½kx²','#776886');
  drawHeightScale(state.y);
  const ppm=70;
  drawDimensionArrow(455,springTop,springTop+state.compression,'compression x',(state.compression/ppm).toFixed(2)+' m','#7c3aed');
  if (revealed) { ctx.font='bold 14px Arial'; ctx.fillStyle=selected===answers[questionIndex]?'#166534':'#9f1239'; ctx.textAlign='center'; ctx.fillText(resultMessage,755,170); }
  drawEnergyBox(625,'PE gravity',state.peG,'#4d7594','peg');drawEnergyBox(720,'KE',state.ke,'#a97832','ke');drawEnergyBox(815,'PE spring',state.peS,'#776886','pes');
  ctx.fillStyle=hintActive?'#e2e8f0':'#ffffff';ctx.strokeStyle='#1e293b';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(hintHitbox.x,hintHitbox.y,hintHitbox.w,hintHitbox.h,14);ctx.fill();ctx.stroke();ctx.fillStyle='#000000';ctx.font='bold 13px Arial';ctx.textAlign='center';ctx.fillText(hintActive?'HINT ACTIVE':'SHOW HINT',hintHitbox.x+hintHitbox.w/2,hintHitbox.y+19);
}
canvas.addEventListener('click',e=>{
  const r=canvas.getBoundingClientRect();const x=(e.clientX-r.left)*canvas.width/r.width;const y=(e.clientY-r.top)*canvas.height/r.height;
  if(completed)return;
  if(x>=hintHitbox.x&&x<=hintHitbox.x+hintHitbox.w&&y>=hintHitbox.y&&y<=hintHitbox.y+hintHitbox.h){requestHint();return;}
  if(hintActive||moving||revealed)return;
  const hit=barHitboxes.find(b=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h);if(!hit)return;
  selected=hit.key;revealed=true;const correct=answers[questionIndex];
  resultMessage=selected===correct?`Correct — ${labels[correct]} is greatest.`:`Review — ${labels[correct]} is greatest.`;
  riseAnsweredQuestions.add(questionIndex);
  if(riseAnsweredQuestions.size===checkpoints.length)window.RiseWalkthrough.complete();
  advanceTimer=2.2;
});
canvas.addEventListener('keydown',e=>{
  const key=e.key.toLowerCase();
  if(completed)return;
  if(key==='h'){requestHint();return;}
  const answerKeys={1:'peg',2:'ke',3:'pes'};
  if(!answerKeys[key]||hintActive||moving||revealed)return;
  selected=answerKeys[key];revealed=true;const correct=answers[questionIndex];
  resultMessage=selected===correct?`Correct — ${labels[correct]} is greatest.`:`Review — ${labels[correct]} is greatest.`;
  riseAnsweredQuestions.add(questionIndex);
  if(riseAnsweredQuestions.size===checkpoints.length)window.RiseWalkthrough.complete();
  advanceTimer=2.2;
});
function requestHint(){
  if(hintActive)return;
  hintActive=true;revealed=false;selected=null;resultMessage='';advanceTimer=0;
  phaseTime=0;targetTime=2*cycleDuration;moving=true;
}
function runFullCycleThenStop(index){
  const currentPhase=((phaseTime%cycleDuration)+cycleDuration)%cycleDuration;
  const desiredPhase=checkpoints[index];
  const offset=(desiredPhase-currentPhase+cycleDuration)%cycleDuration;
  targetTime=phaseTime+cycleDuration+offset;
  moving=true;
  revealed=false;
  selected=null;
  resultMessage='';
  advanceTimer=0;
}
function animate(time){
  if(!lastTime)lastTime=time;const dt=Math.min((time-lastTime)/1000,.05);lastTime=time;
  animationTime+=dt;
  if(moving){
    phaseTime+=dt;
    if(phaseTime>=targetTime){
      phaseTime=targetTime;
      moving=false;
      if(hintActive){
        hintActive=false;
        questionIndex=0;
        phaseTime=0;
        runFullCycleThenStop(questionIndex);
      }
    }
  } else if(revealed){
    advanceTimer-=dt;
    if(advanceTimer<=0){
      if(riseAnsweredQuestions.size===checkpoints.length){
        completed=true;
        revealed=false;
        selected=null;
        resultMessage='';
        moving=true;
        targetTime=Infinity;
      }else{
        questionIndex=(questionIndex+1)%checkpoints.length;
        runFullCycleThenStop(questionIndex);
      }
    }
  }
  drawScene(getState(phaseTime));requestAnimationFrame(animate);
}
runFullCycleThenStop(questionIndex);requestAnimationFrame(animate);
</script>
  </main>
</body>
</html>
