<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faster or Slower?</title><style>
*{box-sizing:border-box}html,body{background:transparent;margin:0}body{font:15px/1.5 system-ui,sans-serif;color:#193b50;padding:10px}main{max-width:760px;margin:auto;background:#fff;border:1px solid #dce5eb;border-radius:18px;overflow:hidden}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px}h1{font-size:clamp(22px,4vw,28px);margin:0}.status{font-size:13px;font-weight:650;color:#236c7f}.space{background:#0b2035}.space svg{display:block;width:100%;max-height:490px}.controls{display:flex;gap:10px;padding:18px 22px}button{flex:1;font:650 15px system-ui;min-height:48px;padding:10px;border:1px solid #b5ccd6;border-radius:10px;background:#fff;color:#193b50;cursor:pointer}button[aria-pressed=true]{background:#176b80;border-color:#176b80;color:#fff}button:hover{box-shadow:0 0 0 2px #176b8020}button:focus-visible{outline:3px solid #b87517;outline-offset:3px}.play{flex:0 0 44px;min-height:38px;padding:4px;font-size:17px;border:0;background:#eff5f7}.header-right{display:flex;align-items:center;gap:10px}@media(max-width:420px){body{padding:6px}header{padding:14px;flex-wrap:wrap;gap:6px}.controls{padding:14px;gap:7px}button{font-size:13px}.status{font-size:12px}}
main{box-shadow:0 10px 30px #163e510a}header{background:linear-gradient(120deg,#fff,#f0f7fa)}.space{border-top:1px solid #dce8ec;border-bottom:1px solid #dce8ec}.status{background:#e7f2f6;padding:6px 10px;border-radius:20px}.controls,.thruster-panel{background:linear-gradient(#fff,#f4f8fa)}button{box-shadow:0 2px 4px #193b5008;transition:background .15s,box-shadow .15s}button[aria-pressed=true]{box-shadow:0 3px 10px #176b8026}.direction-pad .reset{border-style:dashed}.key{color:#45697c}
.instruction{font-size:13px;text-align:center;color:#466575;margin:0;padding:0 18px 16px}button:disabled{opacity:.5;cursor:default}.quiz{padding:18px 22px}.quiz h2{font-size:18px;margin:0 0 14px}.answers{display:flex;gap:10px}.answers button{min-width:0}.orbit-choices svg{display:block;width:100%;max-height:110px}.orbit-choices svg circle,.orbit-choices svg ellipse{fill:none;stroke:#218297;stroke-width:2}.orbit-choices svg .reference{stroke:#a9bdc5;stroke-dasharray:4 4;stroke-width:1}.orbit-choices svg .earth{fill:#347db2;stroke:none}.orbit-choices svg .dot{fill:#d19a2b;stroke:none}#feedback{font-size:14px;color:#355c6d;margin:12px 0 0}#next-round,#again{margin-top:12px;background:#176b80;color:white}.selected{border:2px solid #176b80;background:#edf7f8}button.wrong{border-color:#b57934;background:#fff5e6}[hidden]{display:none!important}@media(max-width:420px){.quiz{padding:14px}.answers{gap:6px}.answers button{font-size:12px;padding:8px}.quiz h2{font-size:16px}}
.orbit-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}</style></head><body><main><header><h1>Faster or slower?</h1><div class="header-right"><span id="status" class="status" role="status">Same circular path</span><button id="play" class="play" aria-label="Pause animation" title="Pause animation">&#10074;&#10074;</button></div></header><div class="space"><svg viewBox="0 0 500 435" role="img" aria-labelledby="scene-title scene-desc"><title id="scene-title">Spacecraft orbit around Earth</title><desc id="scene-desc">A spacecraft circles Earth. Choose a slower or faster sideways speed to compare its path.</desc><defs><radialGradient id="space-glow" cx="48%" cy="48%" r="65%"><stop stop-color="#183f5a"/><stop offset="1" stop-color="#081726"/></radialGradient><radialGradient id="atmosphere"><stop offset=".65" stop-color="#55cfff" stop-opacity="0"/><stop offset=".82" stop-color="#55cfff" stop-opacity=".22"/><stop offset="1" stop-color="#55cfff" stop-opacity="0"/></radialGradient><linearGradient id="solar-panel" x2="1" y2="1"><stop stop-color="#90daf6"/><stop offset="1" stop-color="#3079b8"/></linearGradient><linearGradient id="craft-body" x2="1" y2="1"><stop stop-color="#fff9dc"/><stop offset="1" stop-color="#b9c8d4"/></linearGradient><radialGradient id="earth" cx="30%" cy="25%"><stop stop-color="#68c4d8"/><stop offset=".6" stop-color="#247dba"/><stop offset="1" stop-color="#113f70"/></radialGradient><marker id="arrow-v" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#6be4c9"/></marker><marker id="arrow-g" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#ffac8d"/></marker></defs><rect width="500" height="435" fill="url(#space-glow)"/><g fill="#d7edff" opacity=".48"><circle cx="145" cy="45" r=".8"/><circle cx="380" cy="42" r="1.1"/><circle cx="460" cy="180" r=".8"/><circle cx="38" cy="245" r="1"/><circle cx="328" cy="389" r=".7"/><circle cx="168" cy="363" r="1.2"/><circle cx="420" cy="278" r=".8"/><circle cx="195" cy="90" r=".7"/><circle cx="58" cy="390" r=".7"/><circle cx="350" cy="112" r=".8"/></g><g stroke="#6c9eb5" stroke-opacity=".09" fill="none"><circle cx="250" cy="220" r="135"/><circle cx="250" cy="220" r="180"/><path d="M20 220H480M250 15V415"/></g><g fill="#fff" opacity=".4"><circle cx="35" cy="60" r="1.5"/><circle cx="440" cy="75" r="1"/><circle cx="410" cy="355" r="1.5"/><circle cx="80" cy="340" r="1"/><circle cx="300" cy="30" r="1.5"/><circle cx="110" cy="115" r="1"/></g><circle cx="250" cy="220" r="115" fill="none" stroke="#678695" stroke-dasharray="4 6"/><g fill="#ffd16f"><circle cx="365" cy="220" r="4"/><circle cx="250" cy="105" r="4"/><circle cx="135" cy="220" r="4"/><circle cx="250" cy="335" r="4"/></g><circle id="next-burn" cx="250" cy="105" r="10" fill="none" stroke="#ffd16f" stroke-width="2" visibility="hidden"/><path id="preview" fill="none" stroke="#86e2f2" stroke-opacity=".4" stroke-width="2"/><path id="trail" fill="none" stroke="#86e2f2" stroke-width="3" stroke-linecap="round"/><circle cx="250" cy="220" r="57" fill="url(#atmosphere)"/><circle cx="250" cy="220" r="40.96" fill="url(#earth)"/><path transform="translate(75 66) scale(.7)" d="M218 183Q248 164 253 189L238 207L252 221L242 239L227 220L210 213ZM266 224L289 217L284 248L266 260L260 244Z" fill="#79c9ab" opacity=".65"/><g stroke="#c2f2ff" fill="none" stroke-opacity=".16" stroke-width=".8"><ellipse cx="250" cy="220" rx="22" ry="40"/><ellipse cx="250" cy="220" rx="40" ry="13"/></g><path d="M225 196Q241 187 255 197M261 235Q273 232 280 222" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/><circle cx="250" cy="220" r="40.96" fill="none" stroke="#8fe4ff" stroke-opacity=".45"/><text x="250" y="280" text-anchor="middle" fill="#b4d2e0" font-size="13">Earth</text><path id="v-arrow" stroke="#6be4c9" stroke-width="2.5" marker-end="url(#arrow-v)"/><path id="g-arrow" stroke="#ffac8d" stroke-width="2.5" marker-end="url(#arrow-g)"/><g id="exhaust" visibility="hidden"><ellipse cy="25" rx="15" ry="25" fill="#ff8b2c" opacity=".2"/><path d="M-6 9Q-13 25 0 50Q13 25 6 9Z" fill="#ff6531"/><path d="M-4 9Q-7 23 0 40Q7 23 4 9Z" fill="#ffbc3e"/><path d="M-2 9Q-4 18 0 28Q4 18 2 9Z" fill="#fff5cf"/></g><g id="craft"><circle r="23" fill="#b9e9ff" opacity=".06"/><path d="M-19 0H19" stroke="#c9d9e6" stroke-width="3"/><rect x="-21" y="-8" width="14" height="16" rx="1.5" fill="url(#solar-panel)" stroke="#b3e5f8" stroke-width=".7"/><rect x="7" y="-8" width="14" height="16" rx="1.5" fill="url(#solar-panel)" stroke="#b3e5f8" stroke-width=".7"/><path d="M-14 -8V8M14 -8V8M-21 0H-7M7 0H21" stroke="#244f7e" stroke-width=".7"/><rect x="-6" y="-9" width="12" height="18" rx="3" fill="url(#craft-body)" stroke="#fff" stroke-width=".7"/><circle cy="-3" r="2.5" fill="#385f7d"/><path d="M0 -9V-14M-4 -14H4" stroke="#dfeaf1" stroke-width="1.2"/></g></svg></div><section class="quiz"><h2 id="question">1 ? How would you slow the shuttle?</h2><div id="engine-choices" class="answers"><button data-engine="nose">Fire the nose thruster</button><button data-engine="rear">Fire the rear thruster</button></div><div id="orbit-choices" class="answers orbit-choices" hidden><button data-orbit="closer"><svg viewBox="0 0 160 110" aria-hidden="true"><circle cx="80" cy="55" r="40" class="reference"/><ellipse cx="94" cy="55" rx="26" ry="33"/><circle cx="80" cy="55" r="10" class="earth"/><circle cx="120" cy="55" r="3" class="dot"/></svg>Dips closer</button><button data-orbit="smaller-circle"><svg viewBox="0 0 160 110" aria-hidden="true"><circle cx="80" cy="55" r="40" class="reference"/><circle cx="80" cy="55" r="26"/><circle cx="80" cy="55" r="10" class="earth"/><circle cx="120" cy="55" r="3" class="dot"/></svg>Smaller circle</button><button data-orbit="same"><svg viewBox="0 0 160 110" aria-hidden="true"><circle cx="80" cy="55" r="40"/><circle cx="80" cy="55" r="10" class="earth"/><circle cx="120" cy="55" r="3" class="dot"/></svg>Stays circular</button><button data-orbit="farther"><svg viewBox="0 0 160 110" aria-hidden="true"><circle cx="80" cy="55" r="40" class="reference"/><ellipse cx="65" cy="55" rx="55" ry="49"/><circle cx="80" cy="55" r="10" class="earth"/><circle cx="120" cy="55" r="3" class="dot"/></svg>Reaches farther</button></div><p id="feedback" role="status"></p><button id="next-round" hidden>Next: make it faster ?</button><button id="again" hidden>Try again</button></section><p id="instruction" class="instruction">Predict first. Then watch the burn and the new orbit.</p></main><script>
const $=id=>document.getElementById(id),seen=new Set();let points=[],cursor=0,last=0,sent=false,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
// All choices begin at the same location. Only the tangential velocity changes.
function orbit(k){const a=1/(2-k*k),e=Math.abs(1-k*k),sign=k>=1?1:-1;return Array.from({length:1201},(_,i)=>{const M=(k>=1?0:Math.PI)+2*Math.PI*i/1200;let E=M;for(let n=0;n<10;n++)E-=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));const rate=1/Math.sqrt(a**3)/(1-e*Math.cos(E));return {x:sign*a*(Math.cos(E)-e),y:sign*a*Math.sqrt(1-e*e)*Math.sin(E),vx:-sign*a*Math.sin(E)*rate,vy:sign*a*Math.sqrt(1-e*e)*Math.cos(E)*rate};});}
const xy=p=>[250+p.x*115,220-p.y*115];
function draw(){const p=points[Math.floor(cursor)],[x,y]=xy(p),r=Math.hypot(p.x,p.y),v=Math.hypot(p.vx,p.vy);$('craft').setAttribute('transform',`translate(${x} ${y}) rotate(${Math.atan2(p.vx,p.vy)*180/Math.PI})`);$('trail').setAttribute('d',points.slice(0,Math.floor(cursor)+1).filter((_,i)=>i%3===0).map((p,i)=>(i?'L':'M')+xy(p).join(' ')).join(' '));$('g-arrow').setAttribute('d',`M${x} ${y}l${-p.x/r*28} ${p.y/r*28}`);$('v-arrow').setAttribute('d',`M${x} ${y}l${p.vx/v*32} ${-p.vy/v*32}`);}
let phase='approach',selected=1,nextIndex=300,pending=[],burnElapsed=0;
const path=list=>list.filter((_,i)=>i%3===0).map((p,i)=>(i?'L':'M')+xy(p).join(' ')).join(' ');
function lock(value){document.querySelectorAll('[data-speed]').forEach(b=>b.disabled=value&&Number(b.dataset.speed)!==1);}
function choose(k,interacted=true){if((phase==='burn'||phase==='depart')&&k!==1)return;selected=k;
 if(phase!=='approach'||k===1||!points.length){points=orbit(1);cursor=0;phase='approach';}
 nextIndex=(Math.floor(cursor/300)+1)*300;const a=nextIndex/1200*2*Math.PI;$('next-burn').setAttribute('cx',250+115*Math.cos(a));$('next-burn').setAttribute('cy',220-115*Math.sin(a));$('next-burn').setAttribute('visibility',k===1?'hidden':'visible');$('preview').setAttribute('d','');$('exhaust').setAttribute('visibility','hidden');$('status').textContent=k===1?'Original orbit':k<1?'Slower at next point':'Faster at next point';$('instruction').textContent='Choose a speed. It changes at the next gold dot.';document.querySelectorAll('[data-speed]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.speed)===k)));lock(false);if(interacted){paused=false;label();}draw();}
function burn(){const a=nextIndex/1200*2*Math.PI,c=Math.cos(a),s=Math.sin(a);pending=orbit(selected).map(p=>({x:p.x*c-p.y*s,y:p.x*s+p.y*c,vx:p.vx*c-p.vy*s,vy:p.vx*s+p.vy*c}));points=[{x:c,y:s,vx:-s,vy:c}];cursor=0;phase='burn';burnElapsed=0;lock(true);draw();const [x,y]=xy(points[0]),angle=-a*180/Math.PI+(selected<1?180:0);$('exhaust').setAttribute('transform',`translate(${x} ${y}) rotate(${angle})`);$('exhaust').setAttribute('visibility','visible');$('preview').setAttribute('d',path(pending));$('status').textContent='Thruster firing';$('instruction').textContent='One short push changes the speed.';}
function depart(){phase='depart';points=pending;cursor=0;$('exhaust').setAttribute('visibility','hidden');$('status').textContent=selected<1?'Path dips closer':'Path reaches farther';$('scene-desc').textContent=$('status').textContent;$('instruction').textContent='Engines off. Watch the new orbit.';draw();}
function label(){$('play').textContent=paused?'▶':'❚❚';$('play').setAttribute('aria-label',paused?'Play animation':'Pause animation');$('play').title=paused?'Play animation':'Pause animation';}
let round=0,quizStep=1;
function startRound(n){round=n;quizStep=1;choose(1,false);$('question').textContent=n===0?'1 ? How would you slow the shuttle?':'1 ? How would you speed up the shuttle?';$('engine-choices').hidden=false;$('orbit-choices').hidden=true;$('feedback').textContent='';$('next-round').hidden=true;$('again').hidden=true;document.querySelectorAll('.answers button').forEach(b=>{b.disabled=false;b.className='';});$('instruction').textContent='Predict first. Then watch the burn and the new orbit.';paused=matchMedia('(prefers-reduced-motion: reduce)').matches;label();}
document.querySelectorAll('[data-engine]').forEach(b=>b.onclick=()=>{if(quizStep!==1)return;const right=b.dataset.engine===(round===0?'nose':'rear');if(!right){b.classList.add('wrong');$('feedback').textContent=round===0?'That speeds it up. Try the thruster that pushes against the motion.':'That slows it down. Try the thruster that pushes along the motion.';return;}quizStep=2;$('engine-choices').hidden=true;$('orbit-choices').hidden=false;$('question').textContent='2 ? What will the new orbit look like?';$('feedback').textContent=round===0?'Nose thruster: flame forward, push backward.':'Rear thruster: flame backward, push forward.';});
document.querySelectorAll('[data-orbit]').forEach(b=>b.onclick=()=>{if(quizStep!==2)return;const right=b.dataset.orbit===(round===0?'closer':'farther');if(!right){b.classList.add('wrong');$('feedback').textContent=b.dataset.orbit==='smaller-circle'?'A single brief burn makes an ellipse. A smaller circular orbit needs a second burn.':'Not quite. '+(round===0?'Less sideways speed lets the path bend closer to Earth.':'More sideways speed raises the opposite side of the orbit.');return;}quizStep=3;b.classList.add('selected');document.querySelectorAll('[data-orbit]').forEach(x=>x.disabled=true);$('question').textContent='Watch your prediction';$('feedback').textContent='Correct! Watch the thruster fire at the next gold point.';choose(round===0?.85:1.12);});
$('next-round').onclick=()=>startRound(1);$('again').onclick=()=>startRound(0);
function roundFinished(){$('question').textContent=round===0?'Slower: the orbit dips closer.':'Faster: the orbit reaches farther.';$('feedback').textContent='One brief burn makes an ellipse, not a new circular orbit.';$('instruction').textContent='';if(round===0)$('next-round').hidden=false;else{$('again').hidden=false;if(!sent){window.parent.postMessage({ type: 'complete' }, '*');sent=true;}}}

$('play').onclick=()=>{paused=!paused;label();};
function frame(now){if(!paused&&!document.hidden){const elapsed=Math.min(now-last,50),step=elapsed*.28;if(phase==='approach'){if(selected===1){cursor=(cursor+step)%1200;draw();}else{cursor=Math.min(nextIndex,cursor+step);draw();if(cursor>=nextIndex)burn();}}else if(phase==='burn'){burnElapsed+=elapsed;if(burnElapsed>=1400)depart();}else if(phase==='depart'){cursor=Math.min(1200,cursor+step);draw();if(cursor>=1200){phase='returned';paused=true;lock(false);label();$('status').textContent='Back at the burn point';roundFinished();}}}last=now;requestAnimationFrame(frame);}startRound(0);label();requestAnimationFrame(frame);
</script></body></html>
