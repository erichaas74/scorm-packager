<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Positive, Negative, or Zero Work?</title>
<style>
:root {
      --ink: #0f172a;
      --muted: #64748b;
      --line: #cbd5e1;
      --blue: #2563eb;
      --blue-hover: #1d4ed8;
      --orange: #f97316;
      --green: #10b981;
      --red: #ef4444;
      --gray: #64748b;
      --bg: #f1f5f9;
      --panel-bg: rgba(255, 255, 255, 0.95);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button { font: inherit; transition: all 0.2s ease; cursor: pointer; }

    .app-container {
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      padding: 20px 32px;
      border-radius: 24px;
      border: 1px solid var(--line);
      background: #fff;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    }

    h1 { margin: 0; font-size: clamp(1.25rem, 3vw, 1.75rem); font-weight: 800; letter-spacing: -0.025em; }

    .level-switch { display: flex; gap: 8px; }

    .level-btn {
      padding: 8px 18px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: 0.03em;
    }

    .level-btn:hover { border-color: var(--blue); color: var(--blue); }

    .level-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }
    p.subtitle { margin: 4px 0 0; color: var(--muted); font-size: 0.95rem; min-height: 2.8em; }

    .drag-bank {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 16px;
      border: 2px dashed #94a3b8;
      min-height: 76px;
      min-width: 220px;
    }

    .drag-bank[data-empty="true"] {
      border-style: solid;
      border-color: var(--line);
      background: transparent;
    }

    .drag-item {
      padding: 12px 24px;
      color: #fff;
      border-radius: 12px;
      font-weight: 800;
      font-size: 1.05rem;
      cursor: grab;
      user-select: none;
      transition: transform 0.1s;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .drag-item[data-answer="positive"] { background: var(--green); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35); }
    .drag-item[data-answer="negative"] { background: var(--red); box-shadow: 0 4px 12px rgba(239, 68, 68, 0.35); }
    .drag-item[data-answer="zero"] { background: var(--gray); box-shadow: 0 4px 12px rgba(100, 116, 139, 0.35); }

    .drag-item:active { cursor: grabbing; transform: scale(0.95); }
    .drag-item.dragging { opacity: 0.5; }

    .scenarios-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
    }

    .scenario-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.15);
    }

    .scenario-header {
      padding: 16px;
      text-align: center;
      background: #f8fafc;
      border-bottom: 1px solid var(--line);
    }

    .scenario-header h2 { margin: 0; font-size: 1.15rem; font-weight: 800; }

    .canvas-container {
      position: relative;
      background: #e0f2fe;
      border-bottom: 1px solid var(--line);
      aspect-ratio: 4 / 5;
    }

    canvas { display: block; width: 100%; height: 100%; object-fit: cover; }

    .canvas-container.hover::after {
      content: '';
      position: absolute;
      inset: 0;
      border: 4px dashed #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      pointer-events: none;
      z-index: 3;
    }

    .canvas-container .drag-item {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
    }

    .canvas-container .drag-item:active { transform: translateX(-50%) scale(0.95); }

    .drop-zone-container {
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
      background: var(--panel-bg);
    }

    .feedback {
      min-height: 1.5em;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
    }

    @media (max-width: 900px) {
      .scenarios-grid { grid-template-columns: 1fr; }
    }
  </style>

  <style id="rise-compliance-styles">
    :root {
      --rise-brand: #285f9f;
      --rise-surface: #ffffff;
      --rise-text: #0f172a;
      --rise-muted: #64748b;
      --rise-line: #cbd5e1;
      --rise-success: #15803d;
      --rise-warning: #b45309;
      --rise-danger: #b91c1c;
    }
    html, body { background: transparent !important; max-width: 100%; }
    main.rise-embed > .app-container { border: 5px solid #285f9f !important; border-radius: 18px; box-sizing: border-box; }
    button, input, select, textarea, [role="button"] { min-height: 24px; }
    :focus-visible { outline: 3px solid #285f9f !important; outline-offset: 3px !important; }
    .rise-sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }
    html.rise-paused *, html.rise-paused *::before, html.rise-paused *::after { animation-play-state: paused !important; }
    @media (max-width: 480px) {
      body { overflow-x: hidden; }
      button, input, select, textarea { font-size: max(16px, 1em); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
<main class="rise-embed" style="display: contents;">
  <script id="rise-walkthrough-runtime">
  (() => {
    'use strict';
    let completionSent = false;
    const nativeRequestAnimationFrame = window.requestAnimationFrame.bind(window);
    const nativeCancelAnimationFrame = window.cancelAnimationFrame.bind(window);
    let frameSequence = 0;
    const pendingFrames = new Map();

    function scheduleFrame(id) {
      const record = pendingFrames.get(id);
      if (!record || document.hidden) return;
      record.nativeId = nativeRequestAnimationFrame((time) => {
        if (!pendingFrames.has(id)) return;
        if (document.hidden) {
          record.nativeId = null;
          return;
        }
        pendingFrames.delete(id);
        record.callback(time);
      });
    }

    window.requestAnimationFrame = (callback) => {
      const id = ++frameSequence;
      pendingFrames.set(id, { callback, nativeId: null });
      scheduleFrame(id);
      return id;
    };

    window.cancelAnimationFrame = (id) => {
      const record = pendingFrames.get(id);
      if (record && record.nativeId !== null) nativeCancelAnimationFrame(record.nativeId);
      pendingFrames.delete(id);
    };

    window.RiseWalkthrough = Object.freeze({
      complete() {
        if (completionSent) return;
        completionSent = true;
        document.documentElement.dataset.riseComplete = 'true';
        window.parent.postMessage({ type: 'complete' }, '*');
      },
      get completed() { return completionSent; },
      reduceMotion: window.matchMedia('(prefers-reduced-motion: reduce)').matches
    });

    function normalizeControls(root = document) {
      root.querySelectorAll('button:not([type])').forEach((button) => { button.type = 'button'; });
      root.querySelectorAll('[role="button"]').forEach((control) => {
        if (!control.hasAttribute('tabindex')) control.tabIndex = 0;
      });
    }

    document.addEventListener('keydown', (event) => {
      const control = event.target.closest?.('[role="button"]');
      if (!control || (event.key !== 'Enter' && event.key !== ' ')) return;
      event.preventDefault();
      control.click();
    });

    document.addEventListener('DOMContentLoaded', () => {
      normalizeControls();
      const status = document.createElement('p');
      status.className = 'rise-sr-only';
      status.id = 'rise-completion-status';
      status.setAttribute('role', 'status');
      status.setAttribute('aria-live', 'polite');
      status.textContent = 'Interactive walkthrough ready.';
      document.querySelector('main')?.append(status);
      new MutationObserver((records) => records.forEach((record) => {
        record.addedNodes.forEach((node) => { if (node.nodeType === 1) normalizeControls(node); });
      })).observe(document.querySelector('main') || document.body, { childList: true, subtree: true });
    });

    document.addEventListener('visibilitychange', () => {
      document.documentElement.classList.toggle('rise-paused', document.hidden);
      if (!document.hidden) [...pendingFrames.keys()].forEach(scheduleFrame);
    });
  })();
  </script>
<div class="app-container" data-app>
    <header>
      <div>
        <h1>Work Sign Challenge</h1>
        <p class="subtitle" data-subtitle>Drag the correct work sign to each scenario.</p>
      </div>
      <div class="level-switch">
        <button class="level-btn active" type="button" data-level-btn="0">Level 1</button>
        <button class="level-btn" type="button" data-level-btn="1">Level 2</button>
      </div>
      <!-- Drag Source Bank -->
      <div class="drag-bank" data-bank>
        <button type="button" class="drag-item" draggable="true" data-answer="positive" id="ans-pos">Positive Work</button>
        <button type="button" class="drag-item" draggable="true" data-answer="negative" id="ans-neg">Negative Work</button>
        <button type="button" class="drag-item" draggable="true" data-answer="zero" id="ans-zero">Zero Work</button>
      </div>
    </header>

    <!-- Grid of Scenarios -->
    <div class="scenarios-grid">
      
      <!-- Scenario 1: Positive -->
      <div class="scenario-card" data-scenario="0">
        <div class="scenario-header"><h2>Lifting a payload</h2></div>
        <div class="canvas-container drop-zone" data-drop="0" role="button" tabindex="0" aria-label="Place the selected work sign on situation 1">
          <canvas width="400" height="500" data-canvas="0" role="img" aria-label="Positive, Negative, or Zero Work?: Simulation visual"></canvas>
        </div>
        <div class="drop-zone-container">
          <div class="feedback" data-feedback="0"></div>
        </div>
      </div>

      <!-- Scenario 2: Negative -->
      <div class="scenario-card" data-scenario="1">
        <div class="scenario-header"><h2>Lowering at steady speed</h2></div>
        <div class="canvas-container drop-zone" data-drop="1" role="button" tabindex="0" aria-label="Place the selected work sign on situation 2">
          <canvas width="400" height="500" data-canvas="1" role="img" aria-label="Positive, Negative, or Zero Work?: Simulation visual"></canvas>
        </div>
        <div class="drop-zone-container">
          <div class="feedback" data-feedback="1"></div>
        </div>
      </div>

      <!-- Scenario 3: Zero -->
      <div class="scenario-card" data-scenario="2">
        <div class="scenario-header"><h2>Transporting horizontally</h2></div>
        <div class="canvas-container drop-zone" data-drop="2" role="button" tabindex="0" aria-label="Place the selected work sign on situation 3">
          <canvas width="400" height="500" data-canvas="2" role="img" aria-label="Positive, Negative, or Zero Work?: Simulation visual"></canvas>
        </div>
        <div class="drop-zone-container">
          <div class="feedback" data-feedback="2"></div>
        </div>
      </div>

    </div>
</div>

<script>
    (() => {
      const root = document.querySelector('[data-app]');
      const canvases = [
        root.querySelector('[data-canvas="0"]'),
        root.querySelector('[data-canvas="1"]'),
        root.querySelector('[data-canvas="2"]')
      ];
      const contexts = canvases.map(c => c.getContext('2d'));
      const dropZones = root.querySelectorAll('.drop-zone');
      const bank = root.querySelector('[data-bank]');
      const feedbacks = root.querySelectorAll('[data-feedback]');

      let progress = 0;
      let animationFrame = null;
      let resetTimer = null;
      let state = 'setup'; // 'setup', 'animating', 'result'
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

      const levels = [
        {
          prompt: 'Drag the correct work sign to each scenario.',
          situations: [
            {
              title: 'Lifting a payload',
              answer: 'positive',
              overlay: 'θ = 0°',
              motion: 'up', force: 'up', forceLabel: 'LIFT',
              reason: 'Force and displacement point same way.'
            },
            {
              title: 'Lowering at steady speed',
              answer: 'negative',
              overlay: 'θ = 180°',
              motion: 'down', force: 'up', forceLabel: 'SUPPORT',
              reason: 'Force is opposite to displacement.'
            },
            {
              title: 'Transporting horizontally',
              answer: 'zero',
              overlay: 'θ = 90°',
              motion: 'right', force: 'up', forceLabel: 'CARRY',
              reason: 'Force is perpendicular to motion.'
            }
          ]
        },
        {
          prompt: 'The person pushes the truck to the right (red arrow). What is the sign of the work done by the PERSON’S force in each scene?',
          situations: [
            {
              title: 'Truck shoves him backward',
              answer: 'negative',
              overlay: 'θ = 180°',
              type: 'truck', motion: 'left',
              reason: 'The person’s force points right, but he is pushed left — the person’s force is opposite the displacement.'
            },
            {
              title: 'Balanced standoff',
              answer: 'zero',
              overlay: 'd = 0',
              type: 'truck', motion: 'none',
              reason: 'The person pushes, but nothing moves — with no displacement the person’s force does no work.'
            },
            {
              title: 'He pushes the truck away',
              answer: 'positive',
              overlay: 'θ = 0°',
              type: 'truck', motion: 'right',
              reason: 'The person’s force points right and the truck moves right — force and displacement match.'
            }
          ]
        }
      ];

      let level = 0;
      const riseCompletedLevels = new Set();
      let situations = levels[0].situations;
      const titles = root.querySelectorAll('.scenario-header h2');
      const levelBtns = root.querySelectorAll('[data-level-btn]');
      const subtitle = root.querySelector('[data-subtitle]');

      function loadLevel(i) {
        level = i;
        situations = levels[i].situations;
        subtitle.textContent = levels[i].prompt;
        titles.forEach((t, idx) => t.textContent = situations[idx].title);
        levelBtns.forEach(b => b.classList.toggle('active', Number(b.dataset.levelBtn) === i));
      }

      function drawBackground(ctx) {
        const grad = ctx.createLinearGradient(0, 0, 0, 500);
        grad.addColorStop(0, '#bae6fd');
        grad.addColorStop(1, '#e0f2fe');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 400, 500);

        ctx.strokeStyle = 'rgba(2, 132, 199, 0.08)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = 0; x < 400; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, 500); }
        for (let y = 0; y < 500; y += 40) { ctx.moveTo(0, y); ctx.lineTo(400, y); }
        ctx.stroke();

        // Green ground
        const groundGrad = ctx.createLinearGradient(0, 430, 0, 500);
        groundGrad.addColorStop(0, '#4ade80');
        groundGrad.addColorStop(1, '#16a34a');
        ctx.fillStyle = groundGrad;
        ctx.fillRect(0, 430, 400, 70);
      }

      function arrow(ctx, x1, y1, x2, y2, color, label) {
        const angle = Math.atan2(y2 - y1, x2 - x1);
        ctx.save();
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x2, y2);
        ctx.lineTo(x2 - 15 * Math.cos(angle - 0.4), y2 - 15 * Math.sin(angle - 0.4));
        ctx.lineTo(x2 - 15 * Math.cos(angle + 0.4), y2 - 15 * Math.sin(angle + 0.4));
        ctx.closePath();
        ctx.fill();

        ctx.font = '800 12px system-ui';
        ctx.textAlign = 'center';
        ctx.letterSpacing = '1px';
        const labelY = Math.abs(y2 - y1) > Math.abs(x2 - x1) ? (y1 + y2) / 2 : y1 - 15;
        ctx.fillText(label, (x1 + x2) / 2, labelY);
        ctx.restore();
      }

      function measure(ctx, x1, y1, x2, y2, color, label) {
        const vertical = Math.abs(y2 - y1) > Math.abs(x2 - x1);
        ctx.save();
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';

        // Main line plus perpendicular end ticks at start and end of the path
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        if (vertical) {
          ctx.moveTo(x1 - 12, y1); ctx.lineTo(x1 + 12, y1);
          ctx.moveTo(x2 - 12, y2); ctx.lineTo(x2 + 12, y2);
        } else {
          ctx.moveTo(x1, y1 - 12); ctx.lineTo(x1, y1 + 12);
          ctx.moveTo(x2, y2 - 12); ctx.lineTo(x2, y2 + 12);
        }
        ctx.stroke();

        // Arrowhead marking the direction of motion
        const angle = Math.atan2(y2 - y1, x2 - x1);
        ctx.beginPath();
        ctx.moveTo(x2, y2);
        ctx.lineTo(x2 - 14 * Math.cos(angle - 0.4), y2 - 14 * Math.sin(angle - 0.4));
        ctx.lineTo(x2 - 14 * Math.cos(angle + 0.4), y2 - 14 * Math.sin(angle + 0.4));
        ctx.closePath();
        ctx.fill();

        ctx.font = '800 12px system-ui';
        ctx.textAlign = 'center';
        ctx.letterSpacing = '1px';
        if (vertical) {
          ctx.translate(x1 - 18, (y1 + y2) / 2);
          ctx.rotate(-Math.PI / 2);
          ctx.fillText(label, 0, 0);
        } else {
          ctx.fillText(label, (x1 + x2) / 2, y1 - 18);
        }
        ctx.restore();
      }

      function drawPerson(ctx, x, y, targetX, targetY) {
        ctx.save();

        // Stylized figure (metallic gradient)
        const bodyGrad = ctx.createLinearGradient(x - 25, y - 136, x + 25, y + 39);
        bodyGrad.addColorStop(0, '#94a3b8');
        bodyGrad.addColorStop(1, '#475569');

        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 17.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        
        // Torso & Legs
        ctx.beginPath();
        ctx.moveTo(x, y - 86);
        ctx.lineTo(x, y - 24);
        ctx.moveTo(x, y - 24);
        ctx.lineTo(x - 31, y + 39);
        ctx.moveTo(x, y - 24);
        ctx.lineTo(x + 31, y + 39);
        ctx.stroke();

        ctx.strokeStyle = bodyGrad;
        ctx.lineWidth = 12.5;
        ctx.stroke();

        // Arms (anchored at shoulder, tracking exact center of crate)
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 15;
        ctx.beginPath();
        ctx.moveTo(x, y - 74); // Shoulder joint
        ctx.lineTo(targetX - 10, targetY); // Hands reaching middle of crate
        ctx.stroke();
        
        ctx.strokeStyle = bodyGrad;
        ctx.lineWidth = 10;
        ctx.stroke();

        // Head (helmet style)
        ctx.fillStyle = '#cbd5e1';
        ctx.beginPath();
        ctx.arc(x, y - 118, 25, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 5;
        ctx.strokeStyle = '#0f172a';
        ctx.stroke();

        // Visor
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.roundRect(x + 6, y - 127, 15, 18, 5);
        ctx.fill();
        
        ctx.restore();
      }

      function drawBox(ctx, x, y, label = 'CRATE') {
        const w = 90, h = 70;
        const left = x - w/2, top = y - h/2;
        
        ctx.save();
        const boxGrad = ctx.createLinearGradient(left, top, left, top + h);
        boxGrad.addColorStop(0, '#64748b');
        boxGrad.addColorStop(0.5, '#475569');
        boxGrad.addColorStop(1, '#334155');
        
        ctx.fillStyle = boxGrad;
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(left, top, w, h, 6);
        ctx.fill();
        ctx.stroke();

        const innerGrad = ctx.createLinearGradient(left, top, left, top + h);
        innerGrad.addColorStop(0, '#334155');
        innerGrad.addColorStop(1, '#64748b');
        
        ctx.fillStyle = innerGrad;
        ctx.beginPath();
        ctx.roundRect(left + 8, top + 8, w - 16, h - 16, 3);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#fbbf24';
        ctx.font = '800 12px system-ui';
        ctx.textAlign = 'center';
        ctx.letterSpacing = '1px';
        ctx.fillText(label, x, y + 4);
        ctx.restore();
      }

      function drawTruck(ctx, fx, groundY) {
        // fx = front bumper (left edge); the truck faces left, toward the person
        ctx.save();
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 3;

        // Cargo box
        const cargoGrad = ctx.createLinearGradient(0, groundY - 125, 0, groundY - 25);
        cargoGrad.addColorStop(0, '#64748b');
        cargoGrad.addColorStop(1, '#334155');
        ctx.fillStyle = cargoGrad;
        ctx.beginPath();
        ctx.roundRect(fx + 70, groundY - 125, 125, 100, 6);
        ctx.fill();
        ctx.stroke();

        // Cab
        ctx.fillStyle = '#2563eb';
        ctx.beginPath();
        ctx.roundRect(fx, groundY - 95, 78, 70, 8);
        ctx.fill();
        ctx.stroke();

        // Windshield facing the person
        ctx.fillStyle = '#bae6fd';
        ctx.beginPath();
        ctx.roundRect(fx + 8, groundY - 87, 26, 28, 4);
        ctx.fill();
        ctx.stroke();

        // Wheels
        for (const wx of [fx + 42, fx + 150]) {
          ctx.fillStyle = '#1e293b';
          ctx.beginPath();
          ctx.arc(wx, groundY - 15, 17, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#94a3b8';
          ctx.beginPath();
          ctx.arc(wx, groundY - 15, 7, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = '#fbbf24';
        ctx.font = '800 12px system-ui';
        ctx.textAlign = 'center';
        ctx.letterSpacing = '1px';
        ctx.fillText('TRUCK', fx + 132, groundY - 70);
        ctx.restore();
      }

      function drawTruckScene(ctx, situation) {
        let baseX;
        if (situation.motion === 'left') baseX = 140 - 120 * progress;
        else if (situation.motion === 'right') baseX = 40 + 100 * progress;
        else baseX = 120;

        const groundY = 430;
        const contactX = baseX + 55;

        drawTruck(ctx, contactX, groundY);
        drawPerson(ctx, baseX, 390, contactX + 4, 350);

        if (state === 'result') {
          // The person's push force on the truck — red, always pointing right
          arrow(ctx, contactX + 5, 290, contactX + 85, 290, '#ef4444', "PERSON'S PUSH");

          // Full-span displacement measurement from start to end of the path
          if (situation.motion === 'left') measure(ctx, 195, 240, 75, 240, '#10b981', 'DISPLACEMENT');
          else if (situation.motion === 'right') measure(ctx, 95, 240, 195, 240, '#10b981', 'DISPLACEMENT');
        }
      }

      function getPositions(index) {
        const situation = situations[index];
        // Coordinates mapped for 400x500 canvas
        if (situation.motion === 'up') return { x: 260, y: 390 - 180 * progress };
        if (situation.motion === 'down') return { x: 260, y: 210 + 180 * progress };
        // horizontal motion
        return { x: 170 + 160 * progress, y: 390 };
      }

      function drawScene(index) {
        const ctx = contexts[index];
        const situation = situations[index];

        ctx.clearRect(0, 0, 400, 500);
        drawBackground(ctx);

        if (situation.type === 'truck') {
          drawTruckScene(ctx, situation);
        } else {
          const pos = getPositions(index);

          // Person anchor points
          const personX = situation.motion === 'right' ? pos.x - 110 : 130;
          const personY = 390;

          drawPerson(ctx, personX, personY, pos.x, pos.y);
          drawBox(ctx, pos.x, pos.y);

          // Force arrow and displacement measurement are hidden until answers are checked
          if (state === 'result') {
            if (situation.force === 'up') arrow(ctx, pos.x, pos.y - 45, pos.x, pos.y - 120, '#f97316', situation.forceLabel);

            // Full-span displacement measurement from start to end of the path
            if (situation.motion === 'up') measure(ctx, 350, 390, 350, 210, '#10b981', 'DISPLACEMENT');
            else if (situation.motion === 'down') measure(ctx, 350, 210, 350, 390, '#10b981', 'DISPLACEMENT');
            else measure(ctx, 170, 240, 330, 240, '#10b981', 'DISPLACEMENT');
          }
        }

        // Draw Result Overlay (angle / displacement readout)
        if (state === 'result') {
          ctx.fillStyle = '#fff';
          ctx.font = '900 20px system-ui';
          ctx.textAlign = 'center';
          ctx.fillText(situation.overlay, 200, 460);
        }
      }

      function renderAll() {
        for (let i = 0; i < 3; i++) drawScene(i);
      }

      let draggedItem = null;
      let selectedItem = null; // Added for tap-to-move fallback

      document.querySelectorAll('.drag-item').forEach(item => {
        item.addEventListener('dragstart', (e) => {
          if (state !== 'setup') { e.preventDefault(); return; }
          draggedItem = item;
          
          // CRITICAL FIX: Required for drag-and-drop to work inside iframes and Firefox
          if (e.dataTransfer) {
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', item.id);
          }
          
          setTimeout(() => item.classList.add('dragging'), 0);
        });
        
        item.addEventListener('dragend', () => {
          draggedItem = null;
          item.classList.remove('dragging');
          checkRunState();
        });

        // MOBILE FIX: Tap-to-move fallback for touch devices
        item.addEventListener('click', (e) => {
          if (state !== 'setup') return;
          e.stopPropagation();
          
          // Clear any existing outlines
          document.querySelectorAll('.drag-item').forEach(el => el.style.outline = 'none');
          
          if (selectedItem === item) {
            selectedItem = null; // Toggle off if clicked again
          } else {
            selectedItem = item;
            item.style.outline = '4px solid var(--orange)';
            item.style.outlineOffset = '2px';
          }
        });
      });

      // Setup drop zones and the bank (so items can be returned)
      const allDropTargets = [...dropZones, bank];
      
      allDropTargets.forEach(zone => {
        
        // Tap-to-drop fallback for mobile/touch
        zone.addEventListener('click', () => {
          if (state !== 'setup' || !selectedItem) return;
          
          if (zone.classList.contains('drop-zone')) {
              const existingItem = zone.querySelector('.drag-item');
              if (existingItem) bank.appendChild(existingItem);
          }

          zone.appendChild(selectedItem);
          selectedItem.style.outline = 'none';
          selectedItem = null;

          checkRunState();
        });

        zone.addEventListener('dragover', e => {
          if (state !== 'setup') return;
          e.preventDefault();
        });
        
        zone.addEventListener('dragenter', e => {
          if (state !== 'setup') return;
          e.preventDefault();
          if(zone.classList.contains('drop-zone')) zone.classList.add('hover');
        });
        
        zone.addEventListener('dragleave', e => {
          if(zone.classList.contains('drop-zone') && !zone.contains(e.relatedTarget)) zone.classList.remove('hover');
        });

        zone.addEventListener('drop', e => {
          if (state !== 'setup') return;
          e.preventDefault();
          zone.classList.remove('hover');

          if(draggedItem) {
            // If dropping into a specific scenario zone that already has an item, swap it to bank
            if (zone.classList.contains('drop-zone')) {
                const existingItem = zone.querySelector('.drag-item');
                if (existingItem) bank.appendChild(existingItem);
            }

            zone.appendChild(draggedItem);
          }
        });
      });

      function checkRunState() {
        // Update bank styling based on if it's empty
        bank.dataset.empty = bank.querySelectorAll('.drag-item').length === 0;

        // Reveal answers automatically once all three zones are filled
        const allFilled = [...dropZones].every(dz => dz.querySelector('.drag-item'));
        if (allFilled && state === 'setup') showResults();
      }

      let animStart = 0;
      const activeDuration = reduceMotion ? 80 : 1500;
      const pauseDuration = reduceMotion ? 20 : 800; // Pause at the end before looping
      const totalDuration = activeDuration + pauseDuration;

      function animationLoop(time) {
        if (!animStart) animStart = time;
        let elapsed = time - animStart;
        let cycleTime = elapsed % totalDuration;
        
        // Animate up to 1, then hold at 1 during the pause duration
        progress = Math.min(1, cycleTime / activeDuration);
        
        renderAll();
        
        animationFrame = requestAnimationFrame(animationLoop);
      }

      function showResults() {
        state = 'result';
        riseCompletedLevels.add(level);
        if (riseCompletedLevels.size === 2) window.RiseWalkthrough.complete();
        document.querySelectorAll('.drag-item').forEach(el => el.style.cursor = 'default');
        
        // Evaluate each zone
        dropZones.forEach((dz, index) => {
          const item = dz.querySelector('.drag-item');
          const guessed = item.dataset.answer;
          const correct = situations[index].answer;
          const fb = feedbacks[index];
          
          if (guessed === correct) {
            item.style.outline = '4px solid var(--green)';
            item.style.outlineOffset = '2px';
            fb.innerHTML = `<span style="color: var(--green);">&#10003; Correct!</span> ${situations[index].reason}`;
          } else {
            item.style.outline = '4px solid var(--red)';
            item.style.outlineOffset = '2px';
            fb.innerHTML = `<span style="color: var(--red);">&#10007; Incorrect.</span> ${situations[index].reason}`;
          }
        });

        // Auto reset for the next round (same level)
        resetTimer = setTimeout(() => resetApp(), 10000);
      }

      function resetApp(targetLevel) {
        clearTimeout(resetTimer);
        resetTimer = null;
        state = 'setup';
        selectedItem = null;

        loadLevel(targetLevel === undefined ? level : targetLevel);
        
        // Reset Draggables
        const items = document.querySelectorAll('.drag-item');
        items.forEach(item => {
            item.style.cursor = 'grab';
            item.style.outline = 'none';
            bank.appendChild(item); // Move back to bank
        });

        feedbacks.forEach(fb => fb.innerHTML = '');

        checkRunState();
      }

      // Level buttons switch levels directly (and reset the round)
      levelBtns.forEach(btn => {
        btn.addEventListener('click', () => resetApp(Number(btn.dataset.levelBtn)));
      });

      // Start on level 1 and run the continuous animation immediately
      loadLevel(0);
      animationFrame = requestAnimationFrame(animationLoop);
    })();
  </script>
  </main>
</body>
</html>
