<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elevator Scale Simulator</title>
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#0d1320}

  .stage{position:relative;width:100vw;height:100vh}

  canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block}

  /* ── top bar ── */
  .top-bar{
    position:absolute;top:0;left:0;right:0;
    display:flex;align-items:center;gap:12px;
    padding:12px 18px;
    pointer-events:none;
  }
  .top-bar>*{pointer-events:auto}

  .btn-group{display:flex;gap:8px}

  button{
    border:0;border-radius:10px;padding:11px 22px;
    cursor:pointer;font-weight:800;font-size:17px;
    background:rgba(40,96,200,0.95);color:white;
    backdrop-filter:blur(8px);white-space:nowrap;
    box-shadow:0 2px 12px rgba(0,0,0,0.5);
  }
  button.ghost{
    background:rgba(255,255,255,0.14);color:white;
    border:1.5px solid rgba(255,255,255,0.38);
  }

  .title-center{flex:1;text-align:center}
  h1{font-size:25px;color:white;font-weight:800;text-shadow:0 1px 10px rgba(0,0,0,.8)}

  .scenario-badge{
    position:absolute;
    transform:translateY(-50%);
    background:rgba(8,16,36,0.92);
    border:2px solid rgba(100,170,255,0.5);
    border-radius:12px;padding:12px 20px;
    color:white;font-size:16px;line-height:1.65;
    backdrop-filter:blur(10px);pointer-events:none;
    box-shadow:0 3px 18px rgba(0,0,0,0.6);
  }
  .scenario-badge .sname{font-size:19px;font-weight:800;color:#7dd3fc;margin-bottom:2px}

  /* ── bottom guess bar ── */
  .bottom-bar{
    position:absolute;bottom:0;left:0;right:0;
    display:flex;flex-direction:column;align-items:center;gap:9px;
    padding:12px 18px 18px;
    pointer-events:none;
  }
  .bottom-bar>*{pointer-events:auto}

  #guessLabel{color:rgba(255,255,255,0.7);font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-top:4px}

  .guess-row{display:flex;gap:10px}

  button.choice{
    background:rgba(255,255,255,0.12);color:white;
    border:2px solid rgba(255,255,255,0.3);
    backdrop-filter:blur(8px);font-size:21px;padding:15px 27px;
    box-shadow:0 2px 12px rgba(0,0,0,0.45);
  }
  button.choice.selected{background:rgba(40,96,200,0.88);border-color:#60a5fa}
  button.choice.correct{background:rgba(22,163,74,0.9);border-color:#4ade80}
  button.choice.wrong{background:rgba(185,28,28,0.9);border-color:#f87171}

  .person-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
  button.person-btn{font-size:13px;padding:7px 13px;background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.7);border:1.5px solid rgba(255,255,255,0.25)}
  button.person-btn.active-person{background:rgba(40,96,200,0.92);color:white;border-color:#60a5fa}

  /* ── overlays ── */
  .overlay{
    position:absolute;left:50%;transform:translateX(-50%);
    background:rgba(8,14,30,0.94);
    border:1px solid rgba(255,255,255,0.22);
    border-radius:14px;padding:14px 26px;
    color:white;font-size:18px;line-height:1.5;
    backdrop-filter:blur(14px);text-align:center;
    opacity:0;pointer-events:none;
    transition:opacity .3s ease;
    max-width:760px;width:calc(100% - 60px);
    box-shadow:0 4px 28px rgba(0,0,0,0.7);
  }
  .overlay.show{opacity:1}

  #feedback{bottom:130px}
  #equation{
    bottom:220px;
    font-family:Consolas,monospace;font-size:17px;
    border-left:4px solid #3a80df;color:#93c5fd;
    padding:11px 24px;white-space:nowrap;width:auto;
  }
</style>
</head>
<body>
<div class="stage">
  <canvas id="sim" width="1280" height="720"></canvas>

  <div class="top-bar">
    <div class="btn-group">
      <button class="ghost" id="resetBtn">↺ Reset</button>
    </div>
    <div class="title-center">
      <h1>Elevator Scale Simulator</h1>
      <div id="guessLabel">Guess the scale reading during acceleration</div>
    </div>
    <button class="ghost" id="nextBtn">Next →</button>
  </div>

  <div class="scenario-badge" id="scenarioBadge">
    <div class="sname" id="scenarioTitle">Elevator at Rest</div>
    <div id="accelRow">a = <b id="accelLabel">0 m/s²</b></div>
  </div>

  <div class="bottom-bar">
    <div class="person-row">
      <button class="ghost person-btn active-person" data-person="0">Adult · 70 kg</button>
      <button class="ghost person-btn" data-person="1">Student · 55 kg</button>
      <button class="ghost person-btn" data-person="2">Kid · 30 kg</button>
      <button class="ghost person-btn" data-person="3">Athlete · 65 kg</button>
    </div>
    <div class="guess-row">
      <button class="choice" data-choice="70">70 N</button>
      <button class="choice" data-choice="0">0 N</button>
      <button class="choice" data-choice="686">686 N</button>
    </div>
  </div>

  <div class="overlay" id="feedback"></div>
  <div class="overlay" id="equation"></div>
</div>

<script>
'use strict';
const canvas = document.getElementById('sim');
const ctx = canvas.getContext('2d');

const scenarios = [
  {
    name: 'Elevator at Rest',
    a: 0.0, dir: 'constant', type: 'static',
    get answer(){ return String(Math.round(persons[personIndex].mass * g)); },
    note: 'The scale supports your full weight. At rest, acceleration is zero so normal force equals gravity.',
  },
  {name:'Accelerating Up',   a:  2.0, answer:'more', note:'The scale pushes harder than gravity because the net force must be upward.',  dir:'up',       type:'motion'},
  {name:'Constant Speed',    a:  0.0, answer:'same', note:'Constant speed means zero acceleration, so the normal force equals weight.',   dir:'constant', type:'motion'},
  {name:'Accelerating Down', a: -2.0, answer:'less', note:'The scale pushes less than gravity because the net force is downward.',        dir:'down',     type:'motion'}
];

const g = 9.8, moveDuration = 2600;
const persons = [
  { label:'Business Woman', mass:70, labelY:126, fbdY:132 },
  { label:'HS Student',     mass:55, labelY:120, fbdY:118 },
  { label:'Kid',            mass:30, labelY:88,  fbdY:95  },
  { label:'Soccer Player',  mass:65, labelY:120, fbdY:125 }
];
let personIndex = 0;
function person(){ return persons[personIndex]; }
let index = 0, selected = null, state = 'quiz', startTime = performance.now();
let accelerationVisualFactor = 0;
let velocityVisualFactor = 0;

function s(){ return scenarios[index]; }
function finalReading(){ return person().mass * (g + s().a); }
function displayNumber(){
  if(state === 'quiz')    return '?';
  if(state === 'preview') return '----';
  return Math.round(finalReading()) + ' N';
}

function showOverlay(id, text){ const el=document.getElementById(id); el.textContent=text; el.classList.add('show'); }
function hideOverlay(id){ const el=document.getElementById(id); el.classList.remove('show'); }

const badge = document.getElementById('scenarioBadge');
function updateBadge(cabY){
  const sx = canvas.clientWidth  / canvas.width;
  const sy = canvas.clientHeight / canvas.height;
  badge.style.left = (895 * sx + 16) + 'px';
  badge.style.top  = ((cabY + 195) * sy) + 'px';
}

function roundRect(x,y,w,h,r,fill,stroke){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
  if(fill) ctx.fill();
  if(stroke) ctx.stroke();
}

function drawVectorLabel(text, x, y, color){
  ctx.save();
  ctx.font = 'bold 20px Arial';
  const padX = 12, padY = 7;
  const w = ctx.measureText(text).width + padX*2;
  const h = 32;
  ctx.fillStyle = 'rgba(4,10,24,0.82)';
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  roundRect(x, y-h/2, w, h, 16, true, true);
  ctx.fillStyle = color;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x+padX, y+1);
  ctx.restore();
}

function arrow(x1,y1,x2,y2,label,color){
  const ang = Math.atan2(y2-y1, x2-x1);
  const ux = Math.cos(ang), uy = Math.sin(ang);
  const shaftEndX = x2 - 26*ux, shaftEndY = y2 - 26*uy;

  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = 16;
  ctx.strokeStyle = color;
  ctx.lineWidth = 12;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(shaftEndX,shaftEndY);
  ctx.stroke();

  ctx.shadowBlur = 20;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2-35*Math.cos(ang-Math.PI/7), y2-35*Math.sin(ang-Math.PI/7));
  ctx.lineTo(x2-18*ux, y2-18*uy);
  ctx.lineTo(x2-35*Math.cos(ang+Math.PI/7), y2-35*Math.sin(ang+Math.PI/7));
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1+3, y1);
  ctx.lineTo(shaftEndX+3, shaftEndY);
  ctx.stroke();
  ctx.restore();

  if(label){
    drawVectorLabel(label, x2+18, (y1+y2)/2, color);
  }
}

function drawSpeedLines(cabY){
  if(velocityVisualFactor <= 0.05) return;
  ctx.save();
  ctx.globalAlpha = Math.min(0.45, velocityVisualFactor * 0.42);
  ctx.strokeStyle = 'rgba(180,220,255,0.9)';
  ctx.lineWidth = 3;
  const dir = s().dir === 'down' ? -1 : 1;
  for(let i=0;i<16;i++){
    const x = 145 + (i*67)%990;
    const y = 55 + ((i*83 + performance.now()/8) % 620);
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x, y + dir*(26 + velocityVisualFactor*38));
    ctx.stroke();
  }
  ctx.restore();
}

function drawAccelerationDashboard(x,y,w,h,currentN){
  ctx.save();
  ctx.fillStyle='rgba(5,14,34,0.72)';
  ctx.strokeStyle='rgba(125,211,252,0.75)';
  ctx.lineWidth=2;
  roundRect(x,y,w,h,12,true,true);
  ctx.fillStyle='#e0f2fe';
  ctx.font='bold 14px Arial';
  ctx.textAlign='left';
  ctx.fillText('LIVE MOTION', x+14, y+20);
  ctx.font='bold 19px Arial';
  const aText = s().type === 'static' ? 'a = 0.0 m/s²' : `a = ${(s().a*accelerationVisualFactor).toFixed(1)} m/s²`;
  ctx.fillText(aText, x+14, y+47);
  ctx.font='13px Arial';
  ctx.fillStyle='rgba(224,242,254,0.72)';
  ctx.fillText('Velocity streaks show motion.', x+14, y+68);
  ctx.fillText('Force arrows show acceleration.', x+14, y+86);
  const barX=x+14, barY=y+104, barW=w-28;
  ctx.fillStyle='rgba(255,255,255,0.16)';
  roundRect(barX,barY,barW,8,4,true,false);
  ctx.fillStyle=s().a<0?'#ef4444':'#22c55e';
  roundRect(barX,barY,barW*Math.abs(accelerationVisualFactor),8,4,true,false);
  ctx.restore();
}

function centerDot(x,y){
  ctx.fillStyle='#1a50a0';
  ctx.beginPath(); ctx.arc(x,y,20,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#4a80d0'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(x,y,20,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(x-15,y); ctx.lineTo(x-7,y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+7,y);  ctx.lineTo(x+15,y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x,y-15); ctx.lineTo(x,y-7);  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x,y+7);  ctx.lineTo(x,y+15); ctx.stroke();
  ctx.fillStyle='white';
  ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2); ctx.fill();
}

function drawScale(cx,y){
  const hidden = state === 'quiz' || state === 'preview';

  const pg = ctx.createLinearGradient(cx-110, y-28, cx+110, y-20);
  pg.addColorStop(0,'#506a8a'); pg.addColorStop(0.35,'#bcd4ee');
  pg.addColorStop(0.65,'#9ab8d8'); pg.addColorStop(1,'#506a8a');
  ctx.fillStyle=pg; ctx.strokeStyle='#3a5878'; ctx.lineWidth=2;
  roundRect(cx-110, y-28, 220, 9, 5, true, true);

  const bg = ctx.createLinearGradient(cx, y-19, cx, y+14);
  bg.addColorStop(0,'#30404e'); bg.addColorStop(1,'#18222e');
  ctx.fillStyle=bg; ctx.strokeStyle='#3c5060'; ctx.lineWidth=1.5;
  roundRect(cx-106, y-19, 212, 35, 8, true, true);

  ctx.fillStyle='#b8d8b4';
  roundRect(cx-76, y-15, 152, 26, 4, true, false);
  ctx.strokeStyle='#a8c8a4'; ctx.lineWidth=0.5;
  for(let i=1;i<7;i++){
    const lx = cx-76+i*(152/7);
    ctx.beginPath(); ctx.moveTo(lx,y-15); ctx.lineTo(lx,y+11); ctx.stroke();
  }

  ctx.fillStyle = hidden ? '#6e9070' : '#091508';
  ctx.font='bold 22px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(displayNumber(), cx, y-2);
  ctx.textBaseline='alphabetic'; ctx.textAlign='left';

  ctx.fillStyle = hidden ? '#1e3020' : '#16a34a';
  ctx.beginPath(); ctx.arc(cx+68, y-3, 5, 0, Math.PI*2); ctx.fill();
  if(!hidden){
    ctx.fillStyle='rgba(134,239,172,0.55)';
    ctx.beginPath(); ctx.arc(cx+66, y-5, 2, 0, Math.PI*2); ctx.fill();
  }

  ctx.fillStyle='#0a0f16';
  [cx-94, cx+94].forEach(fx => roundRect(fx-11, y+13, 22, 6, 3, true, false));
}


function drawFancyHat(){
  ctx.save();
  ctx.fillStyle='#2b1238';
  ctx.strokeStyle='#f6c453';
  ctx.lineWidth=3;
  roundRect(-42,-218,84,13,7,true,true);
  const grad=ctx.createLinearGradient(0,-248,0,-206);
  grad.addColorStop(0,'#5b2677'); grad.addColorStop(1,'#2b1238');
  ctx.fillStyle=grad;
  roundRect(-27,-250,54,44,12,true,true);
  ctx.fillStyle='#f6c453';
  roundRect(-29,-214,58,8,4,true,false);
  ctx.fillStyle='#ffffff';
  ctx.beginPath(); ctx.ellipse(30,-220,10,18,-0.55,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(40,-225,7,13,-0.85,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function redrawMouth(kind){
  ctx.save();
  if(kind==='woman'){
    ctx.fillStyle='#e8c49a'; roundRect(-15,-165,30,12,6,true,false);
    ctx.fillStyle='#d97a93';
    ctx.beginPath();
    ctx.ellipse(0,-159,8.5,2.7,0,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='#b35a73'; ctx.lineWidth=1.6; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-8,-159); ctx.lineTo(8,-159); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,-161); ctx.lineTo(0,-157); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.45)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(-5.5,-160.5); ctx.quadraticCurveTo(0,-162,5.5,-160.5); ctx.stroke();
  } else if(kind==='student'){
    ctx.fillStyle='#e8c49a'; roundRect(-14,-150,28,10,5,true,false);
    ctx.strokeStyle='#8f4f45'; ctx.lineWidth=2.5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-8,-145); ctx.quadraticCurveTo(1,-141,10,-146); ctx.stroke();
    ctx.fillStyle='rgba(160,80,70,0.35)'; ctx.beginPath(); ctx.arc(14,-145,2,0,Math.PI*2); ctx.fill();
  } else if(kind==='kid'){
    ctx.fillStyle='#f0cfa0'; roundRect(-15,-108,30,12,6,true,false);
    ctx.fillStyle='#8b1e2d'; ctx.beginPath(); ctx.ellipse(0,-103,10,6,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='white'; roundRect(-8,-107,16,4,2,true,false);
    ctx.strokeStyle='#5c111d'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(0,-103,10,0,Math.PI); ctx.stroke();
  } else if(kind==='soccer'){
    ctx.fillStyle='#d2a679'; roundRect(-12,-148,24,10,5,true,false);
    ctx.strokeStyle='#4b1f16'; ctx.lineWidth=2.5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-8,-143); ctx.quadraticCurveTo(0,-138,9,-143); ctx.stroke();
    ctx.fillStyle='white'; ctx.beginPath(); ctx.ellipse(1,-143,7,2,0,0,Math.PI); ctx.fill();
  }
  ctx.restore();
}

function drawBusinessWoman(cx, floorY){
  const squash = accelerationVisualFactor * (s().a > 0 ? 1 : s().a < 0 ? -1 : 0);
  ctx.save();
  ctx.translate(cx, floorY);
  ctx.scale(1+squash*0.035, 1-squash*0.03);

  const skin='#e8c49a', hairBase='#2a1408', hairLight='#422414';

  ctx.fillStyle='#1a1828';
  roundRect(-34,-12,26,12,6,true,false);   
  roundRect(8,-12,26,12,6,true,false);     
  roundRect(-32,-22,8,22,2,true,false);    
  roundRect(24,-22,8,22,2,true,false);     
  ctx.fillStyle='rgba(255,255,255,0.2)';
  ctx.beginPath(); ctx.ellipse(-23,-7,7,3,0.2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(19,-7,7,3,0.2,0,Math.PI*2);  ctx.fill();

  ctx.fillStyle='#d4b08c';
  roundRect(-20,-34,14,22,4,true,false);
  roundRect(6,-34,14,22,4,true,false);

  const sk = ctx.createLinearGradient(-30,-76,30,-32);
  sk.addColorStop(0,'#1e2848'); sk.addColorStop(1,'#16203a');
  ctx.fillStyle=sk;
  roundRect(-30,-76,60,44,5,true,false);
  ctx.strokeStyle='#28345a'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(-20,-74); ctx.lineTo(-20,-34); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(20,-74);  ctx.lineTo(20,-34);  ctx.stroke();
  ctx.strokeStyle='#2a3460'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(-29,-33); ctx.lineTo(29,-33); ctx.stroke();

  const bj = ctx.createLinearGradient(-34,-148,34,-76);
  bj.addColorStop(0,'#223878'); bj.addColorStop(1,'#162858');
  ctx.fillStyle=bj;
  roundRect(-34,-148,68,76,10,true,false);

  ctx.fillStyle='#f0ece4';
  ctx.beginPath();
  ctx.moveTo(-10,-148); ctx.lineTo(0,-126); ctx.lineTo(10,-148);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle='#1c3272';
  ctx.beginPath();
  ctx.moveTo(-34,-148); ctx.lineTo(-10,-148); ctx.lineTo(0,-126); ctx.lineTo(-34,-110);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#102040'; ctx.lineWidth=1;
  ctx.stroke();
  ctx.fillStyle='#1c3272';
  ctx.beginPath();
  ctx.moveTo(34,-148); ctx.lineTo(10,-148); ctx.lineTo(0,-126); ctx.lineTo(34,-110);
  ctx.closePath(); ctx.fill();
  ctx.stroke();

  ctx.fillStyle='#c8a040';
  ctx.beginPath(); ctx.arc(0,-113,3.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(0,-97,3.5,0,Math.PI*2);  ctx.fill();

  ctx.strokeStyle='#1e3370'; ctx.lineWidth=16; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-31,-140); ctx.lineTo(-62,-94); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(31,-140);  ctx.lineTo(62,-94);  ctx.stroke();
  ctx.strokeStyle='#162858'; ctx.lineWidth=14;
  ctx.beginPath(); ctx.moveTo(-50,-118); ctx.lineTo(-62,-94); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(50,-118);  ctx.lineTo(62,-94);  ctx.stroke();
  ctx.strokeStyle='#e8e4dc'; ctx.lineWidth=5; ctx.lineCap='butt';
  ctx.beginPath(); ctx.moveTo(-60,-92); ctx.lineTo(-65,-87); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(60,-92);  ctx.lineTo(65,-87);  ctx.stroke();

  ctx.lineCap='round';
  ctx.fillStyle=skin;
  ctx.beginPath(); ctx.ellipse(-66,-86,9,7,-0.4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(66,-86,9,7,0.4,0,Math.PI*2);   ctx.fill();

  ctx.fillStyle=skin;
  roundRect(-8,-162,16,20,5,true,false);

  ctx.fillStyle = hairBase;
  ctx.beginPath();
  ctx.arc(0, -187, 27, Math.PI, 0); 
  ctx.bezierCurveTo(30, -160, 39, -118, 33, -82);
  ctx.bezierCurveTo(22, -76, 20, -92, 23, -116);
  ctx.bezierCurveTo(19, -130, 15, -142, 11, -158);
  ctx.bezierCurveTo(-15, -142, -19, -130, -23, -116);
  ctx.bezierCurveTo(-20, -92, -22, -76, -33, -82);
  ctx.bezierCurveTo(-39, -118, -30, -160, -27, -187);
  ctx.fill();

  ctx.strokeStyle = hairLight; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-10, -210); ctx.quadraticCurveTo(-21, -160, -28, -92); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(10, -210);  ctx.quadraticCurveTo(21, -160, 28, -92);  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-2, -212);  ctx.quadraticCurveTo(-6, -160, -18, -102); ctx.stroke();

  ctx.beginPath(); ctx.moveTo(-26,-115); ctx.lineTo(-38,-95); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(26,-115); ctx.lineTo(38,-95); ctx.stroke();

  ctx.fillStyle=skin;
  roundRect(-7,-140,14,18,4,true,false); 
  ctx.beginPath(); ctx.ellipse(0,-155,20,24,0,0,Math.PI*2); ctx.fill(); 

  ctx.fillStyle=hair;
  ctx.beginPath(); ctx.ellipse(0,-169,21,17,0,Math.PI,0); ctx.fill();

  ctx.fillStyle='white';
  ctx.beginPath(); ctx.ellipse(-8,-157,6,5,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(8,-157,6,5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#333';
  ctx.beginPath(); ctx.arc(-8,-157,2.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(8,-157,2.5,0,Math.PI*2); ctx.fill();

  ctx.fillStyle='#111';
  ctx.beginPath();
  ctx.moveTo(-21,-174);
  ctx.quadraticCurveTo(-12,-188,0,-186);
  ctx.quadraticCurveTo(13,-188,21,-174);
  ctx.lineTo(18,-167);
  ctx.quadraticCurveTo(5,-172,-18,-167);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle='#333'; ctx.fillRect(-21,-168,5,8); ctx.fillRect(16,-168,5,8);
  redrawMouth('soccer');
  ctx.restore();
}

function drawPerson(cx, floorY){
  if(personIndex === 0) drawBusinessWoman(cx, floorY);
  else if(personIndex === 1) drawStudent(cx, floorY);
  else if(personIndex === 2) drawKid(cx, floorY);
  else drawSoccerPlayer(cx, floorY);
}

function motionOffset(now){
  if(state === 'quiz') return 245;

  const elapsed = now - startTime;

  if(state === 'preview'){
    const HOLD = 500;
    const CYCLE = moveDuration + HOLD;
    const phase = elapsed % CYCLE;
    const t = Math.min(1, phase / moveDuration);
    const frac = t * t; 
    if(s().dir === 'up')   return 245 - 150 * frac; 
    if(s().dir === 'down') return 95  + 150 * frac;  
    return 245 - 150 * frac;
  }

  if(state === 'moving'){
    const t = Math.min(1, elapsed / moveDuration);
    const eased = t * t;
    if(t >= 1) finishReveal();
    if(s().dir === 'up')   return 245 - 150 * eased;
    if(s().dir === 'down') return 95  + 150 * eased;
    return 245 - 150 * t;
  }

  if(s().dir === 'up')   return 95;
  if(s().dir === 'down') return 245;
  return 95;
}

function finishReveal(){
  state = 'revealed';
  const correct = selected === s().answer;
  setChoiceStyles(true);
  const reading = Math.round(finalReading());
  showOverlay('feedback',
    (selected ? (correct ? '✓ Correct!  ' : '✗ Not quite.  ') : '') +
    s().note + '  Scale reads ' + reading + ' N.'
  );
  if(s().type === 'static'){
    showOverlay('equation', `N = mg = ${person().mass} × 9.8 = ${reading} N`);
  } else {
    showOverlay('equation',
      `N = m(g + a) = ${person().mass} × (9.8 ${s().a < 0 ? '−' : '+'} ${Math.abs(s().a).toFixed(1)}) = ${reading} N`
    );
  }
}

function draw(now){
  const cabY = motionOffset(now);
  updateBadge(cabY);

  const elapsed = now - startTime;
  if(state === 'moving'){
    const t = Math.min(1, elapsed / moveDuration);
    accelerationVisualFactor = s().type === 'static' ? 0 : (t < 0.72 ? Math.sin((t/0.72)*Math.PI) : 0);
    velocityVisualFactor = Math.min(1, t*1.5);
  } else if(state === 'revealed'){
    accelerationVisualFactor = 0;
    velocityVisualFactor = 0;
  } else if(state === 'preview'){
    const phase = (elapsed % (moveDuration + 500)) / moveDuration;
    const t = Math.min(1, phase);
    accelerationVisualFactor = s().type === 'static' ? 0 : Math.max(0, Math.sin(t*Math.PI)) * 0.55;
    velocityVisualFactor = Math.min(0.65, t*1.3);
  } else {
    accelerationVisualFactor = 0;
    velocityVisualFactor = 0;
  }

  const activeN = person().mass * (g + s().a * accelerationVisualFactor);
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const shaftGrad = ctx.createLinearGradient(110,30,1170,690);
  shaftGrad.addColorStop(0,'#07111f');
  shaftGrad.addColorStop(0.35,'#15263a');
  shaftGrad.addColorStop(0.65,'#102238');
  shaftGrad.addColorStop(1,'#050b14');
  ctx.fillStyle=shaftGrad; ctx.fillRect(110,30,1060,660);
  ctx.strokeStyle='#020617'; ctx.lineWidth=8; ctx.strokeRect(110,30,1060,660);

  // recessed wall panels for depth
  for(let x=145; x<=1015; x+=145){
    const panelGrad = ctx.createLinearGradient(x,45,x+112,675);
    panelGrad.addColorStop(0,'rgba(255,255,255,0.055)');
    panelGrad.addColorStop(0.5,'rgba(15,23,42,0.16)');
    panelGrad.addColorStop(1,'rgba(255,255,255,0.035)');
    ctx.fillStyle=panelGrad;
    roundRect(x,50,112,620,8,true,false);
    ctx.strokeStyle='rgba(148,163,184,0.11)'; ctx.lineWidth=1.5;
    roundRect(x,50,112,620,8,false,true);
  }

  // floor seams and small bolt plates
  ctx.strokeStyle='rgba(148,163,184,0.18)'; ctx.lineWidth=2;
  for(let y=70; y<675; y+=70){
    ctx.beginPath(); ctx.moveTo(125,y); ctx.lineTo(1155,y); ctx.stroke();
    ctx.fillStyle='rgba(203,213,225,0.20)';
    for(let x=150; x<1145; x+=170){
      ctx.beginPath(); ctx.arc(x,y,2.2,0,Math.PI*2); ctx.fill();
    }
  }

  // main guide rails with brackets
  const railXs = [305, 975];
  railXs.forEach(rx => {
    ctx.strokeStyle='rgba(203,213,225,0.58)'; ctx.lineWidth=12;
    ctx.beginPath(); ctx.moveTo(rx,35); ctx.lineTo(rx,685); ctx.stroke();
    ctx.strokeStyle='rgba(15,23,42,0.95)'; ctx.lineWidth=5;
    ctx.beginPath(); ctx.moveTo(rx,35); ctx.lineTo(rx,685); ctx.stroke();
    ctx.strokeStyle='rgba(226,232,240,0.55)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(rx-7,35); ctx.lineTo(rx-7,685); ctx.stroke();
    for(let y=80; y<660; y+=95){
      ctx.fillStyle='rgba(30,41,59,0.88)';
      roundRect(rx-42,y-8,84,16,4,true,false);
      ctx.strokeStyle='rgba(148,163,184,0.36)'; ctx.lineWidth=1.5;
      roundRect(rx-42,y-8,84,16,4,false,true);
    }
  });

  // diagonal steel bracing behind the cab
  ctx.strokeStyle='rgba(96,165,250,0.12)'; ctx.lineWidth=5;
  for(let y=-35; y<710; y+=145){
    ctx.beginPath(); ctx.moveTo(120,y); ctx.lineTo(1160,y+190); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(1160,y); ctx.lineTo(120,y+190); ctx.stroke();
  }

  // soft shaft lights along the sides
  [128,1152].forEach(lx => {
    const lightGrad = ctx.createLinearGradient(lx-18,30,lx+18,30);
    lightGrad.addColorStop(0,'rgba(56,189,248,0)');
    lightGrad.addColorStop(0.5,'rgba(125,211,252,0.20)');
    lightGrad.addColorStop(1,'rgba(56,189,248,0)');
    ctx.fillStyle=lightGrad;
    ctx.fillRect(lx-18,30,36,660);
  });

  drawSpeedLines(cabY);

  const cabX=385, cabW=510, cabCenter=cabX+cabW/2;
  ctx.strokeStyle='#6b7280'; ctx.lineWidth=6;
  ctx.beginPath(); ctx.moveTo(cabCenter-75,0); ctx.lineTo(cabCenter-75,cabY+8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cabCenter+75,0); ctx.lineTo(cabCenter+75,cabY+8); ctx.stroke();

  const cabGrad = ctx.createLinearGradient(cabX,cabY,cabX+cabW,cabY+390);
  cabGrad.addColorStop(0,'rgba(235,245,255,0.96)');
  cabGrad.addColorStop(0.45,'rgba(188,213,238,0.86)');
  cabGrad.addColorStop(1,'rgba(90,118,150,0.96)');
  ctx.fillStyle=cabGrad; ctx.strokeStyle='#1e3a5f'; ctx.lineWidth=7;
  roundRect(cabX,cabY,cabW,390,20,true,true);

  ctx.fillStyle='rgba(15,23,42,0.13)';
  roundRect(cabX+28,cabY+30,cabW-56,300,16,true,false);
  const glass = ctx.createLinearGradient(cabX+35,cabY+40,cabX+cabW-40,cabY+300);
  glass.addColorStop(0,'rgba(255,255,255,0.36)');
  glass.addColorStop(0.52,'rgba(125,211,252,0.14)');
  glass.addColorStop(1,'rgba(15,23,42,0.08)');
  ctx.fillStyle=glass;
  roundRect(cabX+38,cabY+38,cabW-76,292,14,true,false);
  ctx.strokeStyle='rgba(255,255,255,0.45)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(cabCenter,cabY+28); ctx.lineTo(cabCenter,cabY+335); ctx.stroke();

  ctx.strokeStyle='rgba(71,85,105,0.85)'; ctx.lineWidth=8; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(cabX+70,cabY+235); ctx.lineTo(cabX+cabW-70,cabY+235); ctx.stroke();
  ctx.strokeStyle='rgba(226,232,240,0.75)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(cabX+70,cabY+232); ctx.lineTo(cabX+cabW-70,cabY+232); ctx.stroke();

  const floorY = cabY + 340;
  drawAccelerationDashboard(cabX+24,cabY+46,178,122,activeN);
  drawScale(cabCenter, floorY);
  drawPerson(cabCenter, floorY-28);

  ctx.fillStyle='white'; ctx.font='bold 24px Arial';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(person().mass + ' kg', cabCenter, floorY - person().labelY);
  ctx.textBaseline='alphabetic'; ctx.textAlign='left';

  const arrowX = cabCenter + 130, midY = floorY - person().fbdY;
  const nLen = Math.max(55, Math.min(175, activeN/5.25));
  const wLen = Math.max(55, Math.min(175, person().mass*g/5.25));
  arrow(arrowX, midY, arrowX, midY-nLen, 'Normal force', '#22c55e');
  arrow(arrowX, midY, arrowX, midY+wLen, 'Weight mg',    '#ef4444');
  centerDot(arrowX, midY);

  if(state === 'preview' || state === 'moving'){
    let ay1,ay2,color,label;
    if(s().dir==='up'){        ay1=cabY+300; ay2=cabY+142; color='#22c55e'; label='Acceleration'; }
    else if(s().dir==='down'){ ay1=cabY+118; ay2=cabY+285; color='#ef4444'; label='Acceleration'; }
    else{                      ay1=cabY+300; ay2=cabY+142; color='#94a3b8'; label='Velocity only'; }
    arrow(185, ay1, 185, ay2, label, color);
  }

  requestAnimationFrame(draw);
}

function setChoiceStyles(revealed=false){
  document.querySelectorAll('.choice').forEach(btn => {
    const ch = btn.dataset.choice;
    btn.classList.toggle('selected', ch===selected && !revealed);
    btn.classList.toggle('correct',  revealed && ch===s().answer);
    btn.classList.toggle('wrong',    revealed && selected===ch && selected!==s().answer);
  });
}

function updateChoiceButtons(){
  const btns = [...document.querySelectorAll('.choice')];
  let defs;
  if(s().type === 'static'){
    const w = Math.round(person().mass * g);
    defs = [
      { value: String(person().mass), label: person().mass + ' N' },
      { value: '0',                   label: '0 N' },
      { value: String(w),             label: w + ' N' }
    ];
  } else {
    defs = [
      { value:'less', label:'Less than weight' },
      { value:'same', label:'Same as weight'   },
      { value:'more', label:'More than weight' }
    ];
  }
  defs.forEach((ch, i) => {
    if(btns[i]){ btns[i].dataset.choice = ch.value; btns[i].textContent = ch.label; }
  });
}

function positionOverlays(){
  const atBottom = s().dir !== 'down';
  const fb  = document.getElementById('feedback');
  const eq  = document.getElementById('equation');
  if(atBottom){
    fb.style.top = 'auto'; fb.style.bottom = '130px';
    eq.style.top = 'auto'; eq.style.bottom = '220px';
  } else {
    fb.style.bottom = 'auto'; fb.style.top = '160px';
    eq.style.bottom = 'auto'; eq.style.top  = '65px';
  }
}

function updateScenarioUI(){
  const sc = s();
  document.getElementById('scenarioTitle').textContent = sc.name;
  const accelRow = document.getElementById('accelRow');
  if(sc.type === 'static'){
    accelRow.style.display = 'none';
  } else {
    accelRow.style.display = '';
    document.getElementById('accelLabel').textContent = (sc.a > 0 ? '+' : '') + sc.a.toFixed(1) + ' m/s²';
  }
  document.getElementById('guessLabel').textContent = sc.type === 'static'
    ? 'What does the scale read when the elevator is at rest?'
    : 'Watch the motion cues — then predict the scale reading';
  updateChoiceButtons();
  positionOverlays();
}

function choose(choice){
  if(state === 'moving' || state === 'revealed') return;
  selected = choice;
  if(s().type === 'static'){
    finishReveal();
  } else {
    setChoiceStyles(false);
    state = 'moving';
    startTime = performance.now();
  }
}

function resetScenario(resetIndex=false){
  if(resetIndex) index = 0;
  selected = null;
  if(s().type === 'static'){
    state = 'quiz';
  } else {
    state = 'preview';
    startTime = performance.now();
  }
  setChoiceStyles(false);
  hideOverlay('feedback');
  hideOverlay('equation');
  updateScenarioUI();
}

function nextScenario(){ index = (index+1) % scenarios.length; resetScenario(false); }

function selectPerson(idx){
  personIndex = idx;
  document.querySelectorAll('.person-btn').forEach((b,i) => b.classList.toggle('active-person', i===idx));
  resetScenario(true);
}

document.querySelectorAll('.choice').forEach(btn => btn.addEventListener('click', () => choose(btn.dataset.choice)));
document.querySelectorAll('.person-btn').forEach(btn => btn.addEventListener('click', () => selectPerson(+btn.dataset.person)));
document.getElementById('nextBtn').addEventListener('click', nextScenario);
document.getElementById('resetBtn').addEventListener('click', () => resetScenario(true));

resetScenario(true);
requestAnimationFrame(draw);
</script>
</body>
</html>
