<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Critical Mass: How Much Uranium Is Too Much?</title>
<link rel="stylesheet" href="simple-walkthrough.css">
<style>
.stage svg .caption { font-size: 22px; font-weight: 700; text-anchor: middle; }
.stage svg .sub { font-size: 18px; text-anchor: middle; fill: #284358; }
.stage svg .key { font-size: 15px; }
.stage svg .tlab { font-size: 14px; font-weight: 700; text-anchor: end; }
.stage svg .zhead { font-size: 21px; font-weight: 700; text-anchor: middle; }
.stage svg .zlab { font-size: 17px; font-weight: 700; text-anchor: middle; }
.lesson { border: 5px solid #285f9f; }
.spacing { flex: 1 1 100%; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 12px 16px; border: 2px solid #376a92; border-radius: 10px; background: #eef5fa; color: #173e5c; }
.spacing label { font-size: 1.25rem; font-weight: 800; }
.spacing .end { font-size: 1rem; font-weight: 650; }
.spacing input { -webkit-appearance: none; appearance: none; background: transparent; flex: 1 1 240px; min-width: 160px; height: 44px; margin: 0; cursor: pointer; accent-color: #d6561c; }
.spacing input:disabled { cursor: not-allowed; opacity: .5; }
.spacing input::-webkit-slider-runnable-track { height: 16px; border-radius: 8px; background: linear-gradient(90deg, #8fb8d8, #f2c230 55%, #d6261c); }
.spacing input::-webkit-slider-thumb { -webkit-appearance: none; width: 36px; height: 36px; margin-top: -10px; border-radius: 50%; background: #fff; border: 5px solid #d6561c; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
.spacing input::-moz-range-track { height: 16px; border-radius: 8px; background: linear-gradient(90deg, #8fb8d8, #f2c230 55%, #d6261c); }
.spacing input::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 5px solid #d6561c; }
</style>
</head>
<body>
<main class="lesson rise-walkthrough">
<h1>Critical Mass: How Much Uranium Is Too Much?</h1>
<div class="content">
<div class="stage">
<svg id="scene" viewBox="0 0 840 490" role="img" aria-label="Animation of stray neutrons splitting uranium-235 nuclei; with enough uranium the chain reaction explodes"></svg>
</div>
<div class="buttons" role="group" aria-label="Playback">
<div class="spacing"><label for="spacing">Uranium density</label><span class="end">Spread out</span><input type="range" id="spacing" min="0" max="100" step="1" value="0"><span class="end">Packed tight</span></div>
<button class="utility" type="button" id="reset">Reset</button>
</div>
</div>
<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var W = 840, H = 490, R = 17, NR = 7, SPEED = 170, RANGE = 110, CAP = .42, SPONT = .02, TMAX = 6, DECAY = .6;
  var scene = document.getElementById('scene');
  var spacingEl = document.getElementById('spacing'), resetBtn = document.getElementById('reset');

  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    (parent || scene).appendChild(e);
    return e;
  }
  function text(x, y, str, cls, parent) { var t = el('text', { x: x, y: y, 'class': cls }, parent); t.textContent = str; return t; }
  function rm(e) { if (e && e.parentNode) e.parentNode.removeChild(e); }

  // Seeded random so every run plays the same way
  var seed;
  function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }

  var nuclei, neutrons, frags, flashes, fissions, running, paused, last, raf, done, cu;
  var laneY, capEl, subEl, countEl, layer, top;

  function defs() {
    var d = el('defs', {});
    function rg(id, c0, c1, c2) {
      var g = el('radialGradient', { id: id, cx: '35%', cy: '30%', r: '75%' }, d);
      el('stop', { offset: '0', 'stop-color': c0 }, g); el('stop', { offset: '.55', 'stop-color': c1 }, g); el('stop', { offset: '1', 'stop-color': c2 }, g);
    }
    rg('gP', '#ff9d8f', '#e0412f', '#8f1a10');      // proton
    rg('gN', '#d7e3ee', '#7f97ad', '#3c5368');      // neutron
    rg('gBa', '#ffd9a0', '#f0963a', '#9a5314');     // barium fragment
    rg('gKr', '#e3c9ff', '#a36ae0', '#5a2f94');     // krypton fragment
    var h = el('radialGradient', { id: 'gHalo', cx: '50%', cy: '50%', r: '50%' }, d);
    el('stop', { offset: '0', 'stop-color': '#bcd8ee' }, h); el('stop', { offset: '.8', 'stop-color': '#7fb0d6' }, h); el('stop', { offset: '1', 'stop-color': '#4a85b3' }, h);
    var f = el('radialGradient', { id: 'gFlash', cx: '50%', cy: '50%', r: '50%' }, d);
    el('stop', { offset: '0', 'stop-color': '#fff7c2', 'stop-opacity': '1' }, f); el('stop', { offset: '.5', 'stop-color': '#ffd54a', 'stop-opacity': '.7' }, f); el('stop', { offset: '1', 'stop-color': '#ff9f1c', 'stop-opacity': '0' }, f);
    var c = el('clipPath', { id: 'zclip' }, d);
    el('rect', { x: 150, y: 80, width: 540, height: 340, rx: 10 }, c);
  }

  function nucGroup(x, y, parent) {
    var g = el('g', { transform: 'translate(' + x + ' ' + y + ')' }, parent);
    el('circle', { cx: 0, cy: 0, r: R, fill: 'url(#gHalo)', stroke: '#2c6592', 'stroke-width': 1.5 }, g);
    var pts = [[0, 0]];
    for (var i = 0; i < 6; i++) pts.push([Math.cos(i * Math.PI / 3 + .3) * 8.4, Math.sin(i * Math.PI / 3 + .3) * 8.4]);
    for (var k = 0; k < pts.length; k++) el('circle', { cx: pts[k][0], cy: pts[k][1], r: 4.6, fill: k % 2 ? 'url(#gP)' : 'url(#gN)', stroke: '#222', 'stroke-width': .5 }, g);
    return g;
  }

  var DMAX = 100, DMIN = 40;
  var X0 = 28, X1 = W - 135, Y0 = 100, Y1 = 428, CLX = (X0 + X1) / 2, CLY = 270;
  var intro, introT, cells, dCur, dTarget, simT, exploded, seenCloseup = false, lastInduced, mid, heat, tDisp, mercury, bulb;

  function dFromSlider() { return DMAX - (DMAX - DMIN) * (+spacingEl.value) / 100; }

  function place(c) {
    c.x = CLX + (c.i + (c.j & 1 ? .5 : 0)) * dCur + c.jx;
    c.y = CLY + c.j * dCur * .866 + c.jy;
    var act = c.x > X0 && c.x < X1 && c.y > Y0 && c.y < Y1;
    if (act && !c.g && c.state === 0) c.g = nucGroup(0, 0, layer);
    c.active = act;
    if (c.g) {
      if (!act) { c.g.setAttribute('display', 'none'); return; }
      c.g.removeAttribute('display');
      var k = c.state === 1 && c.t > 0 ? Math.min(1, c.t / .45) : 0;
      c.g.setAttribute('transform', 'translate(' + c.x + ' ' + c.y + ')' + (k ? ' scale(' + (1 + .5 * k) + ' ' + (1 - .25 * k) + ')' : ''));
    }
  }

  function drawThermometer() {
    var tx = W - 46, tw = 26, ty = 108, th = 310;
    var d = el('defs', {});
    var g = el('linearGradient', { id: 'gTemp', x1: 0, y1: 1, x2: 0, y2: 0 }, d);
    el('stop', { offset: '0', 'stop-color': '#3b82c4' }, g); el('stop', { offset: '.45', 'stop-color': '#f2c230' }, g);
    el('stop', { offset: '.75', 'stop-color': '#f07b1f' }, g); el('stop', { offset: '1', 'stop-color': '#d6261c' }, g);
    var cp = el('clipPath', { id: 'tclip' }, d);
    el('rect', { x: tx, y: ty, width: tw, height: th }, cp);
    el('rect', { x: tx - 1, y: ty - 1, width: tw + 2, height: th + 2, rx: 13, fill: '#eef3f7', stroke: '#52606c', 'stroke-width': 2 });
    var m = el('g', { 'clip-path': 'url(#tclip)' });
    mercury = el('rect', { x: tx, y: ty + th, width: tw, height: 0, fill: 'url(#gTemp)' }, m);
    mercury.setAttribute('data-top', ty); mercury.setAttribute('data-h', th);
    for (var i = 0; i <= 4; i++) el('line', { x1: tx - 8, y1: ty + th - th * i / 4, x2: tx, y2: ty + th - th * i / 4, stroke: '#52606c', 'stroke-width': 1.5 });
    text(tx - 12, ty + 6, 'EXPLOSION!', 'tlab');
    text(tx - 12, ty + th / 2 + 5, 'Hot', 'tlab');
    text(tx - 12, ty + th + 4, 'Cool', 'tlab');
    text(tx + tw / 2, ty - 10, 'Energy', 'zlab');
    bulb = el('circle', { cx: tx + tw / 2, cy: ty + th + 14, r: 15, fill: '#3b82c4', stroke: '#52606c', 'stroke-width': 2 });
  }

  function setThermometer(v) {
    var f = Math.max(0, Math.min(1, v / TMAX)), th = +mercury.getAttribute('data-h'), ty = +mercury.getAttribute('data-top');
    mercury.setAttribute('y', ty + th * (1 - f)); mercury.setAttribute('height', th * f + 2);
    bulb.setAttribute('fill', f > .75 ? '#d6261c' : f > .4 ? '#f07b1f' : '#3b82c4');
  }

  function build(skipIntro) {
    cancelAnimationFrame(raf);
    scene.innerHTML = '';
    seed = 7;
    defs();
    drawThermometer();
    layer = el('g', {});
    mid = el('g', {});
    dCur = dTarget = dFromSlider();
    cells = [];
    for (var j = -9; j <= 9; j++) for (var i = -14; i <= 14; i++)
      cells.push({ i: i, j: j, jx: (rnd() - .5) * 6, jy: (rnd() - .5) * 6, state: 0, t: 0, g: null, active: false, induced: false, x: 0, y: 0 });   // state: 0 uranium, 1 absorbing, 2 split into two new atoms
    cells.forEach(place);
    top = el('g', {});
    neutrons = []; frags = []; flashes = []; cu = null;
    fissions = 0; simT = 0; heat = 0; tDisp = 0; exploded = false; last = null; lastInduced = { x: CLX, y: CLY };
    setThermometer(0);
    intro = skipIntro ? 3 : 0; introT = 0; seenCloseup = !!skipIntro; spacingEl.disabled = intro < 3;
    capEl = text((X0 + X1) / 2 + 60, 32, 'Uranium-235 fuel: what is critical mass?', 'caption');
    subEl = text((X0 + X1) / 2 + 60, 60, 'First, watch one neutron split a single uranium-235 atom.', 'sub');
    neutronEl(W - 380, H - 26, NR);
    text(W - 368, H - 21, 'neutron', 'key');
    nucGroup(W - 282, H - 26, scene);
    text(W - 260, H - 21, 'U-235 nucleus', 'key');
    el('circle', { cx: W - 138, cy: H - 26, r: 7, fill: 'url(#gBa)' }); el('circle', { cx: W - 122, cy: H - 26, r: 6, fill: 'url(#gKr)' });
    text(W - 112, H - 21, 'new atoms', 'key');
    running = true;
    raf = requestAnimationFrame(loop);
  }

  function neutronEl(x, y, r, parent) { return el('circle', { cx: x, cy: y, r: r, fill: 'url(#gN)', stroke: '#222', 'stroke-width': .8 }, parent); }

  function spawnNeutron(x, y, ang, life) {
    var e = neutronEl(x, y, NR, top);
    neutrons.push({ life: life || RANGE / SPEED, x: x, y: y, vx: Math.cos(ang) * SPEED, vy: Math.sin(ang) * SPEED, e: e });
  }

  var completed = false;
  function explode() {
    exploded = true;
    if (!completed) { completed = true; window.parent.postMessage({ type: 'complete' }, '*'); }
    capEl.textContent = 'BOOM! Critical mass reached';
    subEl.textContent = 'The energy meter maxed out. Every uranium atom became barium and krypton.';
    flashes.push({ e: el('circle', { cx: lastInduced.x, cy: lastInduced.y, r: 20, fill: 'url(#gFlash)' }, top), t: 0, big: true });
    cells.forEach(function (z) {
      if (z.active && z.state === 0) { z.state = 1; z.t = -Math.hypot(z.x - lastInduced.x, z.y - lastInduced.y) / 330; }
    });
  }

  // ---- zoomed-in view of the very first split ----
  var NN = 36, NL = 22, BIG = 70, CX = 420, CY = 255;

  function layoutGroup(list, M, side) {
    var cxm = 0, cym = 0;
    list.forEach(function (p) { cxm += p.x; cym += p.y; });
    cxm /= M; cym /= M;
    list.sort(function (p, q) { return Math.hypot(p.x - cxm, p.y - cym) - Math.hypot(q.x - cxm, q.y - cym); });
    list.forEach(function (p, j) {
      var r2 = Math.sqrt((j + .5) / M) * BIG * Math.sqrt(M / NN), a2 = j * 2.39996;
      p.fx = r2 * Math.cos(a2); p.fy = r2 * Math.sin(a2); p.side = side;
    });
  }

  function startCloseup(nu) {
    var g = el('g', {}, top);
    el('rect', { x: 150, y: 80, width: 540, height: 340, rx: 10, fill: '#fff', 'fill-opacity': 1, stroke: '#527797', 'stroke-width': 2 }, g);
    var clip = el('g', { 'clip-path': 'url(#zclip)' }, g);
    var o = { t: 0, nu: nu, g: g, pts: [] };
    for (var i = 0; i < NN; i++) {
      var rr = Math.sqrt((i + .5) / NN), a = i * 2.39996;
      o.pts.push({ x: rr * Math.cos(a), y: rr * Math.sin(a), i: i });
    }
    var sorted = o.pts.slice().sort(function (p, q) { return p.x - q.x; });
    layoutGroup(sorted.slice(0, NL), NL, -1);
    layoutGroup(sorted.slice(NL), NN - NL, 1);
    o.haloL = el('circle', { cx: CX, cy: CY, r: 10, fill: 'url(#gBa)', 'fill-opacity': .35, stroke: '#9a5314', 'stroke-width': 2, opacity: 0 }, clip);
    o.haloR = el('circle', { cx: CX, cy: CY, r: 10, fill: 'url(#gKr)', 'fill-opacity': .35, stroke: '#5a2f94', 'stroke-width': 2, opacity: 0 }, clip);
    o.flash = el('circle', { cx: CX, cy: CY, r: 10, fill: 'url(#gFlash)', opacity: 0 }, clip);
    o.pts.forEach(function (p) {
      p.e = el('circle', { cx: CX, cy: CY, r: 10, fill: p.i % 5 < 2 ? 'url(#gP)' : 'url(#gN)', stroke: '#222', 'stroke-width': .7 }, clip);
    });
    o.in = neutronEl(170, CY, 10, clip);
    o.head = text(CX, 110, '', 'zhead', g);
    o.labL = text(CX, 0, 'Barium-141', 'zlab', clip);
    o.labR = text(CX, 0, 'Krypton-92', 'zlab', clip);
    o.labL.setAttribute('opacity', 0); o.labR.setAttribute('opacity', 0);
    o.foot = text(CX, 405, '', 'zlab', g);
    o.out = [-2.5, -.7, 1.3].map(function (a) { var e = neutronEl(CX, CY, 10, clip); e.setAttribute('opacity', 0); return { a: a, e: e }; });
    o.labN = text(CX, 0, '', 'zlab', g);
    cu = o;
    capEl.textContent = 'Zooming in on the first split';
    subEl.textContent = 'This is what happens inside one uranium-235 nucleus.';
    nu.g.setAttribute('opacity', .25);
  }

  function ease(x) { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }

  function stepCloseup(dt) {
    var o = cu; o.t += dt; var t = o.t;
    var sA = ease((t - 1.3) / 1.4), u = ease((t - 2.7) / .5), sep = Math.min(130, Math.max(0, t - 2.7) * 80);
    o.head.textContent = t < 1.0 ? 'A neutron approaches a uranium-235 nucleus'
      : t < 1.3 ? 'The nucleus absorbs the neutron'
      : t < 2.7 ? 'The unstable nucleus wobbles and stretches'
      : 'It splits in two and releases 3 neutrons!';
    if (t < 1.0) o.in.setAttribute('cx', 170 + (CX - BIG - 12 - 170) * ease(t / 1.0));
    else o.in.setAttribute('opacity', 0);
    o.pts.forEach(function (p) {
      var pinch = 1 - .42 * sA * (1 - Math.min(1, Math.abs(p.x) * 1.7));
      var wob = (t > 1.0 && u < 1) ? (1.2 + 3 * sA) : .6;
      var bx = CX + p.x * BIG * (1 + .75 * sA) + Math.sin(t * 17 + p.i * 1.7) * wob;
      var by = CY + p.y * BIG * (1 - .2 * sA) * pinch + Math.cos(t * 15 + p.i * 2.3) * wob;
      var fx = CX + (p.fx || 0) + (p.side || 0) * sep, fy = CY + (p.fy || 0);
      p.e.setAttribute('cx', bx + (fx - bx) * u); p.e.setAttribute('cy', by + (fy - by) * u);
    });
    var rl = BIG * Math.sqrt(NL / NN) + 14, rr2 = BIG * Math.sqrt((NN - NL) / NN) + 14;
    o.haloL.setAttribute('cx', CX - sep); o.haloL.setAttribute('r', rl); o.haloL.setAttribute('opacity', u);
    o.haloR.setAttribute('cx', CX + sep); o.haloR.setAttribute('r', rr2); o.haloR.setAttribute('opacity', u);
    var lo = Math.max(0, Math.min(1, (t - 3.0) / .6));
    o.labL.setAttribute('x', CX - sep); o.labL.setAttribute('y', CY + rl + 22); o.labL.setAttribute('opacity', lo);
    o.labR.setAttribute('x', CX + sep); o.labR.setAttribute('y', CY + rr2 + 22); o.labR.setAttribute('opacity', lo);
    if (t > 2.7) {
      var fl = t - 2.7;
      o.flash.setAttribute('r', 20 + fl * 220); o.flash.setAttribute('opacity', Math.max(0, 1 - fl * 1.6));
      o.out.forEach(function (n) {
        var d = Math.min(fl, 4) * 75 + 30;
        n.e.setAttribute('cx', CX + Math.cos(n.a) * d); n.e.setAttribute('cy', CY + Math.sin(n.a) * d); n.e.setAttribute('opacity', 1);
      });
      o.labN.textContent = fl > .6 ? '3 neutrons' : '';
      o.labN.setAttribute('x', CX + 70); o.labN.setAttribute('y', 150);
    }
    o.foot.textContent = t > 3.6 ? 'Energy is released too. The new neutrons can split other nuclei.' : '';
    if (t > 6.4) { rm(o.g); cu = null; capEl.textContent = 'Uranium-235 fuel: what is critical mass?'; fission(o.nu); }
  }

  function fission(nu) {
    nu.state = 2; nu.t = 0; fissions++;
    heat += exploded ? .6 : 1;
    if (nu.induced) lastInduced = { x: nu.x, y: nu.y };
    rm(nu.g); nu.g = null;
    flashes.push({ e: el('circle', { cx: nu.x, cy: nu.y, r: R, fill: 'url(#gFlash)' }, top), t: 0 });
    var a = rnd() * Math.PI * 2;
    // the nucleus does not vanish: it becomes two smaller atoms that stay put
    [['gBa', 10, -1], ['gKr', 8, 1]].forEach(function (k) {
      frags.push({ c: nu, ox: Math.cos(a) * 11 * k[2], oy: Math.sin(a) * 11 * k[2], t: 0,
        e: el('circle', { cx: nu.x, cy: nu.y, r: k[1], fill: 'url(#' + k[0] + ')', stroke: '#333', 'stroke-width': .8 }, mid) });
    });
    var a0 = intro === 1 ? Math.PI / 6 : rnd() * Math.PI * 2;   // first split: the 3 neutrons leave through gaps between atoms
    for (var j = 0; j < 3; j++) spawnNeutron(nu.x, nu.y, a0 + j * Math.PI * 2 / 3);
  }

  function step(dt) {
    var i, j;
    if (cu) { stepCloseup(dt); return; }
    if (intro === 0) {
      introT += dt;
      if (introT > .8) {
        var c0 = null, best = 1e9;
        cells.forEach(function (z) { var dd = Math.hypot(z.x - CLX, z.y - CLY); if (z.active && dd < best) { best = dd; c0 = z; } });
        c0.state = 1; c0.t = 0; c0.induced = true; seenCloseup = true; intro = 1;
        startCloseup(c0);
        return;
      }
    } else if (intro === 1 && fissions > 0) {
      intro = 2; introT = 0;
      capEl.textContent = 'The 3 neutrons missed: no chain reaction';
      subEl.textContent = 'The uranium atoms are too far apart, so the neutrons fly off without splitting anything.';
    } else if (intro === 2) {
      introT += dt;
      if (neutrons.length === 0 && introT > 3.5) {
        intro = 3; spacingEl.disabled = false;
        capEl.textContent = 'Uranium-235 fuel: what is critical mass?';
        subEl.textContent = 'Drag the slider to pack the atoms closer until the chain takes off.';
      }
    }
    simT += dt;
    heat *= Math.exp(-DECAY * dt);
    tDisp += (heat - tDisp) * Math.min(1, dt * 6);
    if (exploded) tDisp = TMAX;
    setThermometer(tDisp);
    if (Math.abs(dTarget - dCur) > .05) {
      dCur += (dTarget - dCur) * Math.min(1, dt * 5);
      cells.forEach(place);
    }
    if (!exploded) {
      if (heat >= TMAX) explode();
      else if (heat >= 4) subEl.textContent = 'The energy meter is climbing. Will it reach the top?';
      else if (intro === 3 && fissions > 0 && heat < 2) subEl.textContent = dTarget > 70 ? 'Too spread out: most neutrons escape, so each split fizzles out.' : 'Closer atoms catch more neutrons. Keep packing them in.';
    }
    for (i = cells.length - 1; i >= 0; i--) {
      var q = cells[i];
      if (!q.active) continue;
      if (q.state === 0 && !exploded && intro === 3 && rnd() < SPONT * dt) { q.state = 1; q.t = 0; q.induced = false; }
      if (q.state === 1) {
        q.t += dt;
        if (q.t > 0) {
          var k = Math.min(1, q.t / .45);
          q.g.setAttribute('transform', 'translate(' + q.x + ' ' + q.y + ') scale(' + (1 + .5 * k) + ' ' + (1 - .25 * k) + ')');
          if (q.t >= .45) fission(q);
        }
      }
    }
    for (i = neutrons.length - 1; i >= 0; i--) {
      var n = neutrons[i];
      n.x += n.vx * dt; n.y += n.vy * dt; n.life -= dt;
      var hit = null;
      for (j = 0; j < cells.length; j++) {
        var nu = cells[j];
        if (nu.active && nu.state === 0 && Math.abs(n.x - nu.x) < R + NR && Math.abs(n.y - nu.y) < R + NR && Math.hypot(n.x - nu.x, n.y - nu.y) < R + NR) { hit = nu; break; }
      }
      if (hit) {
        rm(n.e); neutrons.splice(i, 1);
        if (rnd() > CAP) continue;   // absorbed without splitting
        hit.state = 1; hit.t = 0; hit.induced = true;
        if (!seenCloseup && !exploded) { seenCloseup = true; startCloseup(hit); }
        continue;
      }
      if (n.life <= 0 || n.x < -20 || n.x > W + 20 || n.y < -20 || n.y > H + 20) { rm(n.e); neutrons.splice(i, 1); continue; }
      n.e.setAttribute('cx', n.x); n.e.setAttribute('cy', n.y);
    }
    for (i = frags.length - 1; i >= 0; i--) {
      var f = frags[i]; f.t += dt;
      var u = ease(f.t / 1.2);
      if (!f.c.active) { f.e.setAttribute('display', 'none'); continue; }
      f.e.removeAttribute('display');
      f.e.setAttribute('cx', f.c.x + f.ox * u); f.e.setAttribute('cy', f.c.y + f.oy * u);
    }
    for (i = flashes.length - 1; i >= 0; i--) {
      var fl = flashes[i]; fl.t += dt;
      if (fl.big) {
        fl.e.setAttribute('r', 20 + fl.t * 700); fl.e.setAttribute('opacity', Math.max(0, 1 - fl.t * .7));
        if (fl.t > 1.5) { rm(fl.e); flashes.splice(i, 1); }
      } else {
        fl.e.setAttribute('r', R + fl.t * 110); fl.e.setAttribute('opacity', Math.max(0, 1 - fl.t * 2.2));
        if (fl.t > .45) { rm(fl.e); flashes.splice(i, 1); }
      }
    }
  }

  function loop(ts) {
    if (!running) return;
    if (last === null) last = ts;
    var dt = Math.min(.05, (ts - last) / 1000); last = ts;
    step(dt);
    raf = requestAnimationFrame(loop);
  }

  spacingEl.addEventListener('input', function () {
    if (exploded) { build(true); return; }
    dTarget = dFromSlider();
  });
  resetBtn.addEventListener('click', function () { seenCloseup = false; spacingEl.value = 0; build(); });

  build();
})();
</script>
</main>
