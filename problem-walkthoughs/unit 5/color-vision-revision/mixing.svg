<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><defs><radialGradient id="red"><stop stop-color="#fc8e87" offset="0"/><stop stop-color="#bb222b" offset=".7"/><stop stop-color="#70121c" offset="1"/></radialGradient><radialGradient id="dark"><stop stop-color="#454554"/><stop stop-color="#101722" offset="1"/></radialGradient></defs><rect width="1400" height="760" rx="24" fill="#f1f6f8"/><text x="48" y="65" font-family="Arial,sans-serif" font-size="36" fill="#153348" text-anchor="start">Additive mixing: follow the overlaps</text><defs><clipPath id="r"><circle cx="420" cy="300" r="175"/></clipPath><clipPath id="g"><circle cx="610" cy="300" r="175"/></clipPath><clipPath id="b"><circle cx="515" cy="460" r="175"/></clipPath></defs><rect x="35" y="100" width="750" height="620" rx="20" fill="#101c2c" stroke="#d8e3e9" stroke-width="2"/><circle cx="420" cy="300" r="175" fill="#ff0000"/><circle cx="610" cy="300" r="175" fill="#00ff00"/><circle cx="515" cy="460" r="175" fill="#0000ff"/><g clip-path="url(#r)"><circle cx="610" cy="300" r="175" fill="#ffff00"/><circle cx="515" cy="460" r="175" fill="#ff00ff"/></g><g clip-path="url(#g)"><circle cx="515" cy="460" r="175" fill="#00ffff"/></g><g clip-path="url(#r)"><g clip-path="url(#g)"><circle cx="515" cy="460" r="175" fill="#fff"/></g></g><text x="350" y="265" font-family="Arial,sans-serif" font-size="25" fill="#fff" text-anchor="middle">R</text><text x="680" y="265" font-family="Arial,sans-serif" font-size="25" fill="#153348" text-anchor="middle">G</text><text x="515" y="570" font-family="Arial,sans-serif" font-size="25" fill="#fff" text-anchor="middle">B</text><text x="515" y="270" font-family="Arial,sans-serif" font-size="25" fill="#153348" text-anchor="middle">yellow</text><text x="405" y="430" font-family="Arial,sans-serif" font-size="25" fill="#153348" text-anchor="middle">magenta</text><text x="625" y="430" font-family="Arial,sans-serif" font-size="25" fill="#153348" text-anchor="middle">cyan</text><text x="515" y="380" font-family="Arial,sans-serif" font-size="25" fill="#153348" text-anchor="middle">white</text><text x="80" y="670" font-family="Arial,sans-serif" font-size="25" fill="white" text-anchor="start">Overlapping beams on a white surface</text><text x="835" y="175" font-family="Arial,sans-serif" font-size="31" fill="#153348" text-anchor="start">ADD LIGHT</text><text x="835" y="235" font-family="Arial,sans-serif" font-size="29" fill="#153348" text-anchor="start">R + G → yellow</text><text x="835" y="295" font-family="Arial,sans-serif" font-size="29" fill="#153348" text-anchor="start">G + B → cyan</text><text x="835" y="355" font-family="Arial,sans-serif" font-size="29" fill="#153348" text-anchor="start">B + R → magenta</text><text x="835" y="435" font-family="Arial,sans-serif" font-size="29" fill="#153348" text-anchor="start">Balanced R + G + B</text><text x="835" y="475" font-family="Arial,sans-serif" font-size="29" fill="#153348" text-anchor="start">→ white</text><text x="835" y="555" font-family="Arial,sans-serif" font-size="29" fill="#153348" text-anchor="start">No light → black</text><text x="835" y="635" font-family="Arial,sans-serif" font-size="23" fill="#4c6575" text-anchor="start">Mixture changes the response,</text><text x="835" y="670" font-family="Arial,sans-serif" font-size="23" fill="#4c6575" text-anchor="start">not the source wavelengths.</text></svg>