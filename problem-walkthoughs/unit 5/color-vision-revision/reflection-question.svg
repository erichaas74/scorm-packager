<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="510" viewBox="0 0 1400 510"><defs><radialGradient id="red"><stop stop-color="#fc8e87" offset="0"/><stop stop-color="#bb222b" offset=".7"/><stop stop-color="#70121c" offset="1"/></radialGradient><radialGradient id="dark"><stop stop-color="#454554"/><stop stop-color="#101722" offset="1"/></radialGradient></defs><rect width="1400" height="510" rx="24" fill="#f1f6f8"/><text x="48" y="65" font-family="Arial,sans-serif" font-size="36" fill="#153348" text-anchor="start">Predict the light reaching the eye</text><rect x="35" y="95" width="1330" height="260" rx="20" fill="#fff" stroke="#d8e3e9" stroke-width="2"/><text x="65" y="135" font-family="Arial,sans-serif" font-size="28" fill="#153348" text-anchor="start">B  •  Blue-only illumination</text><g transform="translate(100 220)"><path d="M0 -32 L65 -47 L65 47 L0 32Z" fill="#354e60"/><ellipse cx="65" cy="0" rx="13" ry="47" fill="#386ee8" stroke="#153348" stroke-width="3"/><path d="M20 35 L20 85" fill="none" stroke="#153348" stroke-width="8"/><path d="M-10 85 L55 85" fill="none" stroke="#153348" stroke-width="8"/></g><ellipse cx="620" cy="300" rx="90" ry="12" fill="#dce4e8"/><circle cx="620" cy="225" r="65" fill="url(#red)"/><text x="620" y="337" font-family="Arial,sans-serif" font-size="24" fill="#153348" text-anchor="middle">same ideal red surface</text><g transform="translate(1110 225)"><path d="M0 0 Q55 -60 110 0 Q55 60 0 0" fill="white" stroke="#153348" stroke-width="4"/><circle cx="55" cy="0" r="23" fill="#5c9294"/><circle cx="55" cy="0" r="10" fill="#153348"/><circle cx="48" cy="-8" r="5" fill="white"/></g><path d="M200 225 L535 225" fill="none" stroke="#386ee8" stroke-width="5"/><path d="M-12 -7 L0 0 L-12 7" fill="none" stroke="#386ee8" stroke-width="5" transform="translate(535 225) rotate(0)"/><text x="240" y="197" font-family="Arial,sans-serif" font-size="24" fill="#386ee8" text-anchor="start">blue light only</text><text x="880" y="205" font-family="Arial,sans-serif" font-size="27" fill="#153348" text-anchor="middle">What reaches the eye?</text><text x="880" y="250" font-family="Arial,sans-serif" font-size="52" fill="#153348" text-anchor="middle">?</text><text x="60" y="415" font-family="Arial,sans-serif" font-size="27" fill="#153348" text-anchor="start">Surface rule: reflects red; absorbs blue. No other light is present.</text><text x="60" y="465" font-family="Arial,sans-serif" font-size="23" fill="#4c6575" text-anchor="start">Object color above identifies the material, not its appearance in this lighting.</text></svg>