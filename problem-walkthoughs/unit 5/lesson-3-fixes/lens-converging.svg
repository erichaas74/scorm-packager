<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><rect width="1200" height="600" rx="22" fill="#eef5fa"/><rect x="18" y="18" width="1164" height="564" rx="18" fill="white"/><text x="600" y="65" font-family="Arial,sans-serif" font-size="30" fill="#20394d" text-anchor="middle">Parallel rays converge</text><path d="M80,280L1120,280" stroke="#9ab0bf" stroke-width="4" fill="none" /><ellipse cx="520" cy="280" rx="28" ry="170" fill="#e2f2f7" stroke="#2463a6" stroke-width="3"/><path d="M100,160L520,160" stroke="#c46c19" stroke-width="4" fill="none" /><path d="M520,160L980,380.8" stroke="#c46c19" stroke-width="4" fill="none" /><path d="M100,280L520,280" stroke="#c46c19" stroke-width="4" fill="none" /><path d="M520,280L980,280" stroke="#c46c19" stroke-width="4" fill="none" /><path d="M100,400L520,400" stroke="#c46c19" stroke-width="4" fill="none" /><path d="M520,400L980,179.2" stroke="#c46c19" stroke-width="4" fill="none" /><text x="770" y="320" font-family="Arial,sans-serif" font-size="28" fill="#20394d" text-anchor="middle">F</text><path d="M770,270L770,290" stroke="#2463a6" stroke-width="4" fill="none" /><text x="520" y="490" font-family="Arial,sans-serif" font-size="24" fill="#20394d" text-anchor="middle">converging lens</text><text x="770" y="450" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="middle">focus for parallel incoming rays</text><text x="600" y="560" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="middle">A converging lens has positive focal length in the usual thin-lens convention.</text></svg>