<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><rect width="1200" height="600" rx="22" fill="#eef5fa"/><rect x="18" y="18" width="1164" height="564" rx="18" fill="white"/><text x="600" y="65" font-family="Arial,sans-serif" font-size="30" fill="#20394d" text-anchor="middle">Predict color from the light reaching the eye</text><text x="200" y="145" font-family="Arial,sans-serif" font-size="25" fill="#20394d" text-anchor="middle">blue-only source</text><rect x="110" y="235" width="170" height="130" rx="20" fill="#2860d8"/><path d="M290,300L515,300" stroke="#2860d8" stroke-width="4" fill="none" /><circle cx="515" cy="300" r="5" fill="#2860d8"/><circle cx="620" cy="300" r="80" fill="#c84944"/><text x="620" y="420" font-family="Arial,sans-serif" font-size="25" fill="#20394d" text-anchor="middle">ideal red object</text><text x="620" y="460" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle">absorbs blue</text><path d="M720,300L1020,300" stroke="#a6b3bb" stroke-width="4" fill="none" stroke-dasharray="9 7"/><text x="900" y="245" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="middle">little reflected light</text><text x="900" y="355" font-family="Arial,sans-serif" font-size="25" fill="#20394d" text-anchor="middle">observer: dark</text><text x="600" y="560" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="middle">An object cannot reflect a wavelength absent from the illumination. Real surfaces are not ideal filters.</text></svg>