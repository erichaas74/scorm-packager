<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><rect width="1200" height="600" rx="22" fill="#eef5fa"/><rect x="18" y="18" width="1164" height="564" rx="18" fill="white"/><text x="600" y="65" font-family="Arial,sans-serif" font-size="30" fill="#20394d" text-anchor="middle">Parallel rays diverge</text><path d="M100,280L1080,280" stroke="#8da5b5" stroke-width="4" fill="none" /><path d="M500 115 Q470 280 500 445 Q530 280 500 115" fill="#e3f2f7" stroke="#2463a6" stroke-width="3"/><text x="500" y="490" font-family="Arial,sans-serif" font-size="24" fill="#20394d" text-anchor="middle">Diverging lens</text><text x="960" y="260" font-family="Arial,sans-serif" font-size="20" fill="#20394d" text-anchor="middle">principal axis</text><text x="350" y="318" font-family="Arial,sans-serif" font-size="24" fill="#20394d" text-anchor="middle">F</text><text x="650" y="318" font-family="Arial,sans-serif" font-size="24" fill="#20394d" text-anchor="middle">F</text><path d="M350,270L350,290" stroke="#2463a6" stroke-width="4" fill="none" /><path d="M650,270L650,290" stroke="#2463a6" stroke-width="4" fill="none" /><path d="M100,200L500,200" stroke="#c46c19" stroke-width="4" fill="none" /><path d="M500,200L860,8" stroke="#c46c19" stroke-width="4" fill="none" /><path d="M350,280L500,200" stroke="#c46c19" stroke-width="4" fill="none" stroke-dasharray="9 7"/><path d="M100,360L500,360" stroke="#07847f" stroke-width="4" fill="none" /><path d="M500,360L860,552" stroke="#07847f" stroke-width="4" fill="none" /><path d="M350,280L500,360" stroke="#07847f" stroke-width="4" fill="none" stroke-dasharray="9 7"/><text x="255" y="430" font-family="Arial,sans-serif" font-size="21" fill="#20394d" text-anchor="middle">Dashed extensions meet at F</text><text x="600" y="560" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="middle">The rays do not meet at F; only their backward extensions do.</text></svg>