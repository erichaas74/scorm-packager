<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><rect width="1200" height="600" rx="22" fill="#eef5fa"/><rect x="18" y="18" width="1164" height="564" rx="18" fill="white"/><text x="600" y="65" font-family="Arial,sans-serif" font-size="30" fill="#20394d" text-anchor="middle">Real and virtual images: follow the actual rays</text><text x="300" y="135" font-family="Arial,sans-serif" font-size="26" fill="#07847f" text-anchor="middle">REAL</text><path d="M80,180L500,400" stroke="#c46c19" stroke-width="4" fill="none" /><path d="M80,400L500,180" stroke="#2463a6" stroke-width="4" fill="none" /><text x="290" y="455" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="middle">Actual rays meet; a screen can capture it.</text><text x="900" y="135" font-family="Arial,sans-serif" font-size="26" fill="#07847f" text-anchor="middle">VIRTUAL</text><path d="M850,220L1090,150" stroke="#c46c19" stroke-width="4" fill="none" /><path d="M850,340L1090,410" stroke="#2463a6" stroke-width="4" fill="none" /><path d="M650,280L850,220" stroke="#c46c19" stroke-width="4" fill="none" stroke-dasharray="9 7"/><path d="M650,280L850,340" stroke="#2463a6" stroke-width="4" fill="none" stroke-dasharray="9 7"/><text x="885" y="455" font-family="Arial,sans-serif" font-size="19" fill="#20394d" text-anchor="middle">Only backward extensions meet.</text><text x="600" y="560" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="middle">Solid lines: actual light paths. Dashed lines: geometric extensions, not traveling light.</text></svg>