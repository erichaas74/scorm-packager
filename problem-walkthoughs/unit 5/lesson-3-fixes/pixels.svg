<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><rect width="1200" height="600" rx="22" fill="#eef5fa"/><rect x="18" y="18" width="1164" height="564" rx="18" fill="white"/><text x="600" y="65" font-family="Arial,sans-serif" font-size="30" fill="#20394d" text-anchor="middle">A pixel contains independently controlled subpixels</text><rect x="170" y="160" width="440" height="300" rx="14" fill="#172633"/><rect x="200" y="190" width="115" height="240" fill="#ff2525"/><rect x="332" y="190" width="115" height="240" fill="#00df4b"/><rect x="464" y="190" width="115" height="240" fill="#101821"/><text x="258" y="495" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle">R: on</text><text x="390" y="495" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle">G: on</text><text x="522" y="495" font-family="Arial,sans-serif" font-size="23" fill="#20394d" text-anchor="middle">B: off</text><text x="700" y="325" font-family="Arial,sans-serif" font-size="60" fill="#20394d" text-anchor="middle">→</text><rect x="810" y="200" width="230" height="210" rx="12" fill="#ffff00" stroke="#a2aab0"/><text x="925" y="470" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="middle">yellow at viewing distance</text><text x="600" y="560" font-family="Arial,sans-serif" font-size="22" fill="#20394d" text-anchor="middle">Reducing green while holding red fixed shifts this mixture toward red.</text></svg>