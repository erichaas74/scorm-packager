<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitch or Loudness?</title>
<link rel="stylesheet" href="simple-walkthrough.css">
<style>
button[data-choice] { display: flex; align-items: center; justify-content: center; gap: 12px; }
button[data-choice="0"] { border: 2px solid #23649a; background: #edf5fc; color: #194c77; }
button[data-choice="1"] { border: 2px solid #a94b24; background: #fff1e9; color: #863917; }
button[data-choice="0"]:hover { background: #dcecf9; }
button[data-choice="1"]:hover { background: #ffe1ce; }
.button-swatches { display: flex; flex-direction: column; gap: 7px; flex: 0 0 38px; }
.wave-swatch { display: block; width: 38px; height: 0; border-top-width: 4px; }
.wave-swatch-a { border-top-style: dashed; border-top-color: #23649a; }
.wave-swatch-b { border-top-style: solid; border-top-color: #a94b24; }
.buttons { margin-top: 4px; } .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }.wave-reveal { animation: reveal-wave 1s linear both; } @keyframes reveal-wave { from { width: 0; } } @media(prefers-reduced-motion: reduce) { .wave-reveal { animation: none; } }</style>
</head>
<body>
<main class="lesson rise-walkthrough">
<h1>Pitch or Loudness?</h1>
<div class="content">
<div class="stage">
<svg id="scene" viewBox="0 0 840 405" role="img" aria-label="Reference wave A"></svg>
<span id="status" class="sr-only" role="status" aria-live="polite"></span>
</div>
<div class="buttons" role="group" aria-label="Compare the waves">
<button type="button" data-choice="0" hidden>Wave A is louder</button>
<button type="button" data-choice="1" hidden>Wave B is louder</button>
<button type="button" data-choice="2" hidden>Same loudness</button>
<button class="utility" type="button" id="replay">Replay</button>
</div>
</div>
</main>
<script>window.walkthroughLesson = {"title":"Pitch or Loudness?","type":"wave","variant":"pitch","question":"Compared with A, is B louder, higher pitched, or both?","choices":["Louder","Higher pitch","Both"],"correct":0,"explanation":"Larger amplitude means louder; higher frequency means higher pitch."};</script>
<script src="textbook-diagrams.js"></script>
<script src="pitch-loudness.js"></script>
</body>
</html>
