<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why Sound Gets Quieter</title><link rel="stylesheet" href="animated-demos.css"></head><body>
<main class="wave-demo">
<h1>Why Sound Gets Quieter</h1><div class="stage"><svg id="scene" role="img" aria-label="Sound spreading from a point source over spheres of radius r, 2r and 3r"></svg></div>
<div class="controls"><button id="step" type="button" hidden>Next step</button></div>
<span id="demo-status" class="sr-only" role="status" aria-live="polite"></span>
<script>window.walkthroughLesson = {"title":"Why Sound Gets Quieter","group":"demos","type":"animated-demo","demoKind":"intensity-spheres","choices":[]};</script>
<script>
(() => {
  'use strict';
  const C = { ink: '#17324a', blue: '#23649a', teal: '#087c80', orange: '#a94b24', cell: '#fff3b0', hot: '#ffcf4a' };
  const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const text = (x, y, s, size = 18, color = C.ink, anchor = 'middle', weight = '') =>
    `<text x="${x}" y="${y}" font-size="${size}" fill="${color}" text-anchor="${anchor}"${weight ? ` font-weight="${weight}"` : ''}>${s}</text>`;
  const line = (x, y, u, v, color = C.ink, w = 1.5, dash = '') =>
    `<line x1="${x}" y1="${y}" x2="${u}" y2="${v}" stroke="${color}" stroke-width="${w}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>`;

  // Stage start times (s): wave only, patch at r, patch at 2r, patch at 3r, summary.
  const T = [0, 3.4, 7.4, 11.4, 15.4], LENGTH = 18.5, HOLD = [2.8, 6.6, 10.6, 14.6, 17];
  const captions = [
    ['Sound spreads out in all directions.', 'The same power P crosses every sphere.'],
    ['At distance r, a box of area A', 'catches intensity I.'],
    ['At 2r the wave covers 4 boxes (4A).', 'One box of area A gets only I/4.'],
    ['At 3r the wave covers 9 boxes (9A).', 'One box of area A gets only I/9.'],
    ['Double the distance: 1/4 intensity.', 'Triple the distance: 1/9.']
  ];

  function render(w, t) {
    const compact = w < 600;
    const r = compact ? 90 : 150, alpha = compact ? 0.22 : 0.17, sx0 = compact ? 44 : 150, sy0 = compact ? 215 : 235;
    const H = compact ? 520 : 570, rMax = 3 * r + 45, speed = r * 0.85, sp = r * 0.45;
    const fs = compact ? 16 : 19;
    const stage = t < T[1] ? 0 : t < T[2] ? 1 : t < T[3] ? 2 : t < T[4] ? 3 : 4;
    // Oblique projection of a point on a sphere of radius d at in-plane angle a, depth angle b.
    const P = (d, a, b) => [sx0 + d * (Math.cos(a) * Math.cos(b) + 0.5 * Math.sin(b)), sy0 - d * (Math.sin(a) * Math.cos(b) + 0.35 * Math.sin(b))];
    let svg = '';

    // Spherical wavefronts: faint full rings, bright inside the cone, dimming as 1/r^2.
    const nRings = 5, cycle = nRings * sp * 1.6;
    for (let j = 0; j < nRings; j++) {
      const raw = speed * t - j * sp * 1.6;
      if (raw < 6) continue;
      const R = raw % cycle;
      if (R < 6) continue;
      const fade = clamp(1 / ((R / r) ** 2), 0.18, 1);
      const gid = 'g' + j;
      const op = (0.35 + 0.65 * fade).toFixed(2);
      svg += `<defs><radialGradient id="${gid}" cx="40%" cy="40%" r="62%"><stop offset="55%" stop-color="${C.teal}" stop-opacity="0"/><stop offset="100%" stop-color="${C.teal}" stop-opacity="${(0.1 + 0.16 * fade).toFixed(2)}"/></radialGradient></defs>`;
      svg += `<circle cx="${sx0}" cy="${sy0}" r="${R.toFixed(1)}" fill="url(#${gid})" stroke="${C.teal}" stroke-width="1.6" opacity="${op}"/>`;
      // Great circles in the same oblique projection as the boxes give the shell its 3D shape.
      for (const [u, v] of [[[1, 0], [0.5, -0.35]], [[0, -1], [0.5, -0.35]]]) {
        const g = [];
        for (let i = 0; i <= 48; i++) { const th = Math.PI * 2 * i / 48; g.push(`${i ? 'L' : 'M'}${(sx0 + R * (Math.cos(th) * u[0] + Math.sin(th) * v[0])).toFixed(1)},${(sy0 + R * (Math.cos(th) * u[1] + Math.sin(th) * v[1])).toFixed(1)}`); }
        svg += `<path d="${g.join(' ')}Z" fill="none" stroke="${C.teal}" stroke-width="1" opacity="${(0.45 * op).toFixed(2)}"/>`;
      }
      const pts = [];
      for (let i = 0; i <= 16; i++) { const a = -alpha + 2 * alpha * i / 16, p = P(R, a, 0); pts.push(`${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`); }
      svg += `<path d="${pts.join(' ')}" fill="none" stroke="${C.teal}" stroke-width="3.5" stroke-linecap="round" opacity="${fade.toFixed(2)}"/>`;
    }

    // Cone edges to the corners of the 3r patch.
    for (const [a, b] of [[-alpha, -alpha], [alpha, -alpha], [alpha, alpha], [-alpha, alpha]]) {
      const p = P(3 * r + 20, a, b);
      svg += line(sx0, sy0, p[0].toFixed(1), p[1].toFixed(1), C.blue, 1.3);
    }

    // Distance scale along the axis.
    const axisY = sy0 + (compact ? 150 : 175);
    svg += line(sx0, axisY, sx0 + 3 * r + 20, axisY, C.ink, 1.5);
    svg += line(sx0, axisY - 6, sx0, axisY + 6, C.ink, 1.5) + text(sx0, axisY + 24, 'source', fs - 3, C.ink);
    [1, 2, 3].forEach(k => {
      const x = sx0 + k * r;
      svg += line(x, axisY - 6, x, axisY + 6, C.ink, 1.5) + text(x, axisY + 24, k === 1 ? 'r' : k + 'r', fs, C.ink, 'middle', 700);
    });

    // Patches: draw far to near so the nearer ones sit on top.
    for (let k = 3; k >= 1; k--) {
      if (stage < k) continue;
      const u = t - T[k];
      const appear = clamp(u / 0.6);
      if (appear <= 0) continue;
      const d = k * r, N = k;
      const shade = ['#ffc933', '#ffe08a', '#fff2c4'];
      let cells = '', labels = '';
      for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
        const a0 = -alpha + 2 * alpha * i / N, a1 = -alpha + 2 * alpha * (i + 1) / N;
        const b0 = -alpha + 2 * alpha * j / N, b1 = -alpha + 2 * alpha * (j + 1) / N;
        const q = [P(d, a0, b0), P(d, a1, b0), P(d, a1, b1), P(d, a0, b1)];
        const pts = q.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
        const cx = q.reduce((s, p) => s + p[0], 0) / 4, cy = q.reduce((s, p) => s + p[1], 0) / 4;
        cells += `<polygon points="${pts}" fill="${shade[k - 1]}" stroke="${k === 1 ? C.ink : C.blue}" stroke-width="${k === 1 ? 2.2 : 1.4}" stroke-dasharray="${N > 1 ? '5 4' : ''}" stroke-linejoin="round"/>`;
        labels += text(cx.toFixed(1), (cy + 6).toFixed(1), 'A', compact ? 14 : 17, C.orange, 'middle', 700);
      }
      // Outer edge of the whole patch on top of the cells.
      const c0 = P(d, -alpha, -alpha), c1 = P(d, alpha, -alpha), c2 = P(d, alpha, alpha), c3 = P(d, -alpha, alpha);
      const outline = `<polygon points="${[c0, c1, c2, c3].map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}" fill="none" stroke="${C.ink}" stroke-width="2.2" stroke-linejoin="round"/>`;
      svg += `<g opacity="${appear.toFixed(2)}">${cells}${N > 1 ? outline : ''}${labels}</g>`;
      // Guide from the axis tick up to the patch, then intensity and area labels.
      const top = Math.min(c0[1], c1[1], c2[1], c3[1]), bottom = Math.max(c0[1], c1[1], c2[1], c3[1]);
      const mid = (Math.min(c0[0], c3[0]) + Math.max(c1[0], c2[0])) / 2;
      const showVals = clamp((u - 1.2) / 0.6);
      const I = k === 1 ? 'I' : 'I/' + k * k;
      svg += `<g opacity="${appear.toFixed(2)}">${text(sx0 + k * r, axisY + 52, I, compact ? 22 : 26, C.orange, 'middle', 800)}</g>`;
      const area = k === 1 ? 'area A' : `area ${k * k}A`;
      svg += `<g opacity="${showVals.toFixed(2)}">${text(mid.toFixed(1), (bottom + 24).toFixed(1), area, fs - 2, C.ink)}</g>`;
    }

    // Formula, top right.
    const fx = w - (compact ? 14 : 24), fw = compact ? 130 : 170;
    svg += `<rect x="${fx - fw}" y="14" width="${fw}" height="${compact ? 36 : 42}" rx="8" fill="#fff" stroke="${C.orange}" stroke-width="1.6"/>` + text(fx - fw / 2, compact ? 40 : 44, 'I = P / 4πr²', compact ? 20 : 24, C.ink, 'middle', 700);
    // Source.
    svg += `<circle cx="${sx0}" cy="${sy0}" r="9" fill="${C.orange}" stroke="${C.orange}" stroke-width="2"/>`;
    svg += text(sx0 + (compact ? 4 : 0), sy0 - 24, 'source P', fs, C.orange, 'middle', 700);

    // Caption.
    const cap = captions[stage], capY = axisY + (compact ? 92 : 98);
    cap.forEach((s, i) => { svg += text(w / 2, capY + i * (fs + 9), s, fs, C.ink, 'middle', i === 1 && stage > 0 ? 700 : 600); });

    const desc = captions[stage].join(' ');
    return { svg, height: H, description: 'A point source sends sound outward over spheres of radius r, 2r and 3r. ' + desc };
  }

  const scene = document.getElementById('scene'), step = document.getElementById('step'), live = document.getElementById('demo-status');
  const compactMq = matchMedia('(max-width: 760px)'), reduced = matchMedia('(prefers-reduced-motion: reduce)');
  let elapsed = 0, last = null, frameId, completed = false, view = 0;
  function draw(announce) {
    const w = compactMq.matches ? 420 : 840, res = render(w, elapsed);
    scene.setAttribute('viewBox', `0 0 ${w} ${res.height}`);
    scene.innerHTML = res.svg;
    scene.setAttribute('aria-label', res.description);
    scene.dataset.time = elapsed.toFixed(2);
    if (announce) live.textContent = res.description;
  }
  function finish() { if (!completed) { completed = true; window.parent.postMessage({ type: 'complete' }, '*'); } }
  function restart() { elapsed = 0; view = 0; last = null; draw(true); }
  function settings() { step.hidden = !reduced.matches; if (reduced.matches) { elapsed = HOLD[0]; view = 0; draw(true); } else restart(); }
  step.addEventListener('click', () => { view = (view + 1) % HOLD.length; elapsed = HOLD[view]; if (view === HOLD.length - 1) finish(); draw(true); });
  compactMq.addEventListener('change', () => draw());
  reduced.addEventListener('change', settings);
  document.addEventListener('visibilitychange', () => { last = null; });
  function frame(now) {
    const dt = last === null ? 0 : Math.min(0.1, (now - last) / 1000); last = now;
    if (!reduced.matches && !document.hidden) {
      elapsed += dt;
      if (elapsed >= T[4] + 1.5) finish();
      if (elapsed >= LENGTH) elapsed = 0;
      draw();
    }
    frameId = requestAnimationFrame(frame);
  }
  window.addEventListener('pagehide', () => cancelAnimationFrame(frameId));
  settings(); frameId = requestAnimationFrame(frame);
})();
</script>
</main></body></html>
