<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720"><rect width="1440" height="720" rx="28" fill="#eff5f9"/><rect x="28" y="28" width="1384" height="664" rx="18" fill="white" stroke="none" stroke-width="3"/><g font-family="Arial, sans-serif"><text x="85" y="98" font-size="36" fill="#17324d" text-anchor="start">Energy passing through an area each second</text><rect x="155" y="305" width="42" height="68" rx="18" fill="#17324d" stroke="none" stroke-width="3"/><path d="M 197 305 l 55 -35 v 138 l -55 -35 z" fill="#087f8c"/><line x1="310" y1="277" x2="665" y2="277" stroke="#087f8c" stroke-width="5"/><path d="M 665 277 l -16 -9 v 18 z" fill="#087f8c"/><line x1="310" y1="325" x2="665" y2="325" stroke="#087f8c" stroke-width="5"/><path d="M 665 325 l -16 -9 v 18 z" fill="#087f8c"/><line x1="310" y1="373" x2="665" y2="373" stroke="#087f8c" stroke-width="5"/><path d="M 665 373 l -16 -9 v 18 z" fill="#087f8c"/><line x1="310" y1="421" x2="665" y2="421" stroke="#087f8c" stroke-width="5"/><path d="M 665 421 l -16 -9 v 18 z" fill="#087f8c"/><path d="M 715 211 L 890 169 L 890 455 L 715 500 Z" fill="#ccecec" stroke="#087f8c" stroke-width="4"/><text x="805" y="355" font-size="32" fill="#17324d" text-anchor="middle">Area A</text><text x="485" y="514" font-size="29" fill="#087f8c" text-anchor="middle">Sound power P</text><rect x="970" y="236" width="340" height="218" rx="18" fill="#edf5fa" stroke="none" stroke-width="3"/><text x="1140" y="294" font-size="32" fill="#17324d" text-anchor="middle">Intensity</text><text x="1140" y="360" font-size="40" fill="#087f8c" text-anchor="middle">I = P / A</text><text x="1140" y="417" font-size="28" fill="#17324d" text-anchor="middle">Unit: W/m²</text><rect x="65" y="590" width="1310" height="72" rx="18" fill="#e8f4f4" stroke="none" stroke-width="3"/><text x="720" y="634" font-size="28" fill="#17324d" text-anchor="middle">More power through the same area means greater intensity.</text></g></svg>