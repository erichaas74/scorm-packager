<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720"><rect width="1440" height="720" rx="28" fill="#eff5f9"/><rect x="28" y="28" width="1384" height="664" rx="18" fill="white" stroke="none" stroke-width="3"/><g font-family="Arial, sans-serif"><text x="85" y="98" font-size="36" fill="#17324d" text-anchor="start">The same power spreads over a larger surface</text><circle cx="370" cy="350" r="92" fill="none" stroke="#087f8c" stroke-width="3" opacity="0.775609756097561"/><circle cx="370" cy="350" r="160" fill="none" stroke="#087f8c" stroke-width="3" opacity="0.6097560975609756"/><circle cx="370" cy="350" r="232" fill="none" stroke="#087f8c" stroke-width="3" opacity="0.4341463414634147"/><circle cx="370" cy="350" r="19" fill="#cf772a"/><text x="370" y="393" font-size="24" fill="#17324d" text-anchor="middle">Source</text><line x1="420" y1="350" x2="602" y2="350" stroke="#087f8c" stroke-width="5"/><path d="M 602 350 l -16 -9 v 18 z" fill="#087f8c"/><rect x="458" y="314" width="18" height="74" rx="18" fill="#cf772a" stroke="none" stroke-width="3"/><rect x="594" y="314" width="18" height="74" rx="18" fill="#cf772a" stroke="none" stroke-width="3"/><line x1="475" y1="320" x2="777" y2="247" stroke="#cf772a" stroke-width="3"/><line x1="611" y1="380" x2="777" y2="451" stroke="#cf772a" stroke-width="3"/><rect x="795" y="180" width="500" height="134" rx="18" fill="#edf5fa" stroke="none" stroke-width="3"/><text x="823" y="227" font-size="29" fill="#17324d" text-anchor="start">Near the source</text><text x="823" y="273" font-size="25" fill="#17324d" text-anchor="start">More power through a fixed area</text><rect x="795" y="375" width="500" height="134" rx="18" fill="#edf5fa" stroke="none" stroke-width="3"/><text x="823" y="422" font-size="29" fill="#17324d" text-anchor="start">Farther away</text><text x="823" y="468" font-size="25" fill="#17324d" text-anchor="start">Less power through the same area</text><text x="88" y="550" font-size="23" fill="#17324d" text-anchor="start">Circles represent spherical wavefronts.</text><rect x="65" y="590" width="1310" height="72" rx="18" fill="#e8f4f4" stroke="none" stroke-width="3"/><text x="720" y="634" font-size="28" fill="#17324d" text-anchor="middle">Ideal model: sound spreads in all directions with negligible absorption or reflection.</text></g></svg>