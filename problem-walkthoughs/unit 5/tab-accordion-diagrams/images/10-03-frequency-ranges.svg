<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720"><rect x="0" y="0" width="1440" height="720" rx="28" fill="#eff5f9" stroke="none" stroke-width="3"/><rect x="28" y="28" width="1384" height="664" rx="24" fill="white" stroke="none" stroke-width="3"/><defs><clipPath id="scene"><rect x="60" y="45" width="1320" height="555" rx="10"/></clipPath></defs><g clip-path="url(#scene)"><rect x="140" y="290" width="240" height="125" rx="18" fill="#687e90" stroke="none" stroke-width="3"/><text x="260.0" y="365" font-family="Arial,sans-serif" font-size="29" fill="white" text-anchor="middle">infrasound</text><rect x="380" y="290" width="660" height="125" rx="18" fill="#07828b" stroke="none" stroke-width="3"/><text x="710.0" y="365" font-family="Arial,sans-serif" font-size="29" fill="white" text-anchor="middle">human hearing</text><rect x="1040" y="290" width="250" height="125" rx="18" fill="#7756af" stroke="none" stroke-width="3"/><text x="1165.0" y="365" font-family="Arial,sans-serif" font-size="29" fill="white" text-anchor="middle">ultrasound</text><text x="380" y="465" font-family="Arial,sans-serif" font-size="32" fill="#18354e" text-anchor="middle">20 Hz</text><text x="1040" y="465" font-family="Arial,sans-serif" font-size="32" fill="#18354e" text-anchor="middle">20,000 Hz</text><text x="720" y="165" font-family="Arial,sans-serif" font-size="30" fill="#18354e" text-anchor="middle">approximate range • varies by person and age</text></g><text x="720" y="624" font-family="Arial,sans-serif" font-size="27" fill="#687e90" text-anchor="middle">The frequency scale is schematic, not linear.</text></svg>