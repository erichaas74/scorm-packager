<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720"><rect x="0" y="0" width="1440" height="720" rx="28" fill="#eff5f9" stroke="none" stroke-width="3"/><rect x="28" y="28" width="1384" height="664" rx="24" fill="white" stroke="none" stroke-width="3"/><defs><clipPath id="scene"><rect x="60" y="45" width="1320" height="555" rx="10"/></clipPath></defs><g clip-path="url(#scene)"><rect x="225" y="250" width="250" height="240" rx="18" fill="#eff5f9" stroke="none" stroke-width="3"/><text x="350" y="415" font-family="Arial,sans-serif" font-size="36" fill="#07828b" text-anchor="middle">0 dB</text><text x="350" y="325" font-family="Arial,sans-serif" font-size="38" fill="#18354e" text-anchor="middle">I₀</text><rect x="595" y="250" width="250" height="240" rx="18" fill="#eff5f9" stroke="none" stroke-width="3"/><text x="720" y="415" font-family="Arial,sans-serif" font-size="36" fill="#07828b" text-anchor="middle">10 dB</text><text x="720" y="325" font-family="Arial,sans-serif" font-size="38" fill="#18354e" text-anchor="middle">10 I₀</text><rect x="965" y="250" width="250" height="240" rx="18" fill="#eff5f9" stroke="none" stroke-width="3"/><text x="1090" y="415" font-family="Arial,sans-serif" font-size="36" fill="#07828b" text-anchor="middle">20 dB</text><text x="1090" y="325" font-family="Arial,sans-serif" font-size="38" fill="#18354e" text-anchor="middle">100 I₀</text><path d="M495,360L565,360" fill="none" stroke="#07828b" stroke-width="6" stroke-dasharray="" stroke-linecap="round"/><path d="M565,360L549.2035138859733,368.62965969487567L549.2035138859733,351.37034030512433Z" fill="#07828b"/><path d="M865,360L935,360" fill="none" stroke="#07828b" stroke-width="6" stroke-dasharray="" stroke-linecap="round"/><path d="M935,360L919.2035138859733,368.62965969487567L919.2035138859733,351.37034030512433Z" fill="#07828b"/><text x="720" y="550" font-family="Arial,sans-serif" font-size="33" fill="#07828b" text-anchor="middle">×10 intensity at each step</text><text x="720" y="105" font-family="Arial,sans-serif" font-size="36" fill="#07828b" text-anchor="middle">sound intensity level</text></g><text x="720" y="624" font-family="Arial,sans-serif" font-size="27" fill="#687e90" text-anchor="middle">Each 10 dB increase means 10 times the intensity, not 10 times perceived loudness.</text></svg>