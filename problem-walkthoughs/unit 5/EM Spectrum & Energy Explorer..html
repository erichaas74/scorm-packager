<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Electromagnetic Spectrum — Rise Block</title>

  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      margin: 0;
      padding: 16px;
      background: #ffffff;
      color: #0f172a;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .rise-wrapper {
      max-width: 920px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 20px 24px 26px;
      box-shadow: 0 10px 30px -10px rgba(15, 23, 42, 0.08);
    }

    /* Textbook Top Energy Arrow */
    .energy-line {
      position: relative;
      height: 2px;
      background: #0f172a;
      width: 100%;
      margin: 6px 0 18px;
    }
    .energy-line::before, .energy-line::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 0;
      height: 0;
      border-style: solid;
      transform: translateY(-50%);
    }
    .energy-line::before {
      left: -2px;
      border-width: 6px 10px 6px 0;
      border-color: transparent #0f172a transparent transparent;
    }
    .energy-line::after {
      right: -2px;
      border-width: 6px 0 6px 10px;
      border-color: transparent transparent transparent #0f172a;
    }

    /* Spectrum Track */
    .spectrum-bar {
      display: grid;
      grid-template-columns: 1.35fr 1.25fr 1.25fr 0.55fr 1.2fr 1.25fr 1.35fr;
      height: 68px;
      border-radius: 8px;
      overflow: hidden;
      border: 1.5px solid #cbd5e1;
    }
    .spec-cell {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s ease;
      border-right: 1px solid rgba(148, 163, 184, 0.35);
      padding: 4px;
    }
    .spec-cell:last-child { border-right: none; }
    .spec-cell:hover { filter: brightness(0.95); }
    .spec-cell.active {
      box-shadow: inset 0 0 0 3px #0f172a;
      z-index: 2;
    }
    .visible-sliver {
      background: linear-gradient(90deg, #ef4444 0%, #f97316 18%, #eab308 36%, #22c55e 55%, #3b82f6 76%, #8b5cf6 100%) !important;
    }

    /* Spring Reveal Cards */
    @keyframes springUp {
      0% { opacity: 0; transform: translateY(28px) scale(0.94); }
      70% { opacity: 1; transform: translateY(-4px) scale(1.01); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .spring-card {
      animation: springUp 0.48s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* Essential local layout also works when the optional Tailwind CDN is unavailable. */
    #mainTitle { font-size:clamp(20px,4vw,30px); text-align:center; margin:8px 0 18px; }
    #subTitle { display:none; }
    #stageCanvas { display:block; width:100%; height:auto; }
    #stageCanvas { border-radius:12px; }
    .relative {position:relative;} .absolute {position:absolute;}
    .top-2\.5 {top:10px;} .left-3 {left:12px;} .right-3 {right:12px;}
    #stageBadge {color:#e2e8f0; font-size:11px; padding:5px 10px; background:#0f172add; border-radius:20px;}
    #stageControls {display:flex;justify-content:center;padding:12px;}
    button {font:inherit;cursor:pointer;}
    #sceneActionBtn {border:0;border-radius:24px;color:white;font-size:13px;font-weight:700;padding:10px 20px;}
    button:focus-visible,.spec-cell:focus-visible {outline:3px solid #f59e0b;outline-offset:3px;}
    .flex {display:flex;} .justify-between {justify-content:space-between;} .grid {display:grid;}
    .grid-cols-4 {grid-template-columns:repeat(4,minmax(0,1fr));}
    .grid-cols-7 {grid-template-columns:repeat(7,minmax(0,1fr));}
    .text-center {text-align:center;} .w-full {width:100%;} .h-9 {height:36px;} .h-full {height:100%;}
    #topTicks {font-size:11px;margin-bottom:6px;}
    .spec-cell {min-width:0;font-size:10px;gap:4px;}
    #sizeRow {gap:5px;margin-top:12px;} #sizeRow button {font-size:11px;padding:8px 3px;border:1px solid #cbd5e1;border-radius:8px;}
    #sizeRow span {display:block;}
    #cardsContainer {grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px;}
    #cardsContainer>div {padding:14px;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;font-size:12px;line-height:1.6;}
    #cardsContainer p {margin:12px 0;} #cardsContainer .flex {flex-wrap:wrap;gap:4px;}
    #cardsContainer button {font-size:11px;text-align:left;border:1px solid #cbd5e1;padding:6px;border-radius:5px;}
    .grid-cols-7 + .text-center {font-size:10px;overflow-wrap:anywhere;}
    .grid-cols-7:not(#sizeRow) {font-size:10px;}
    @media(max-width:600px){body{padding:8px}.rise-wrapper{padding:12px 8px}#cardsContainer{grid-template-columns:1fr}.spec-cell{font-size:8px}#sizeRow button{font-size:9px}#stageBadge{font-size:8px;padding:3px 6px}.top-2\.5{top:3px}.left-3{left:4px} .justify-between{font-size:9px;gap:8px}}

    /* Self-contained presentation; no stylesheet request is required. */
    .rise-wrapper{max-width:1040px;padding:20px 24px 26px}
    #stageBadge{display:none}
    #stageCanvas{border:1px solid #24324c;border-radius:14px;cursor:default}
    #stageControls{min-height:64px;gap:16px;align-items:center;flex-wrap:wrap}
    #stageControls:empty{min-height:64px;padding:0}
    .scene-slider{display:flex;align-items:center;gap:14px;font-size:13px;font-weight:700;color:#334155}
    .scene-slider input{width:220px;min-height:32px;accent-color:#6366f1}
    #sceneActionBtn{min-height:44px}
    .spec-cell{border:0;border-right:1px solid #b8c4d4;font-weight:800;font-size:11px;color:#172033}
    .spec-cell:last-child{border-right:0}.spec-cell.active{box-shadow:inset 0 0 0 3px #0f172a}
    .band-symbol svg{width:26px;height:20px;display:block}
    .visible-sliver{color:white;text-shadow:0 1px 3px #000}
    #topTicks{margin:10px 0;font-size:12px}.energy-line{margin-top:10px}
    #cardsContainer ul{padding-left:18px}#cardsContainer button{background:#fff;color:#172033}
    #cardsContainer .bg-emerald-600{background:#059669;color:white}#cardsContainer .bg-rose-700{background:#be123c;color:white}
    @media(max-width:600px){.rise-wrapper{padding:12px 8px}#stageControls{gap:8px}.scene-slider{width:100%;justify-content:space-between;font-size:12px}.scene-slider input{width:46%}.spec-cell{font-size:9px}.band-symbol svg{width:22px}#topTicks{font-size:10px}.spectrum-bar{height:78px}}

    .spectrum-bar{grid-template-columns:repeat(7,minmax(0,1fr))}
    .spec-cell span:last-child{max-width:100%;overflow-wrap:anywhere;line-height:1.2}
    @media(max-width:600px){.spec-cell{padding:3px 2px;font-size:8px}.band-symbol svg{width:20px}}

    #sceneSummary{margin-top:16px}
    .metrics-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:0;border:1px solid #dce3ec;border-radius:10px;background:#f8fafc;overflow:hidden}
    .metrics-strip>div{padding:12px 16px;min-width:0}
    .metrics-strip>div+div{border-left:1px solid #dce3ec}
    .metrics-strip dt{font-size:11px;font-weight:700;color:#64748b;letter-spacing:.035em}
    .metrics-strip dt span{margin-left:3px}
    .metrics-strip dd{margin:5px 0 0;color:#172033;font-size:14px;font-weight:650;line-height:1.45;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
    .scene-explanation{margin:12px 2px 0;font-size:14px;line-height:1.6;color:#475569}
    @media(max-width:600px){.metrics-strip>div{padding:10px 8px}.metrics-strip dt{font-size:10px;letter-spacing:0}.metrics-strip dd{font-size:12px}.scene-explanation{font-size:13px;margin-top:10px}}

    #spectrumBar{height:auto;min-height:84px;align-items:stretch;overflow:visible;border:0;gap:4px}
    #spectrumBar .spec-cell{border:1px solid #cbd5e1;border-radius:10px;gap:7px;padding:12px 4px;overflow:hidden}
    #spectrumBar .spec-cell.active{padding:12px 10px;box-shadow:inset 0 0 0 2px #0f172a}
    #spectrumBar .comparison-detail{display:flex;flex-direction:column;align-items:center;width:100%;gap:4px;animation:comparisonReveal .3s ease-out}
    .comparison-example{font-size:12px;font-weight:700}.comparison-wave{display:block;width:100%;height:auto;max-height:170px}
    .comparison-object{font-size:11px}.comparison-note{font-size:10px;font-weight:400;opacity:.85}
    #spectrumBar .visible-sliver .comparison-detail{background:#ffffffed;border-radius:7px;color:#172033;text-shadow:none;padding:7px 3px}
    @keyframes comparisonReveal{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:600px){
      #spectrumBar{display:flex;flex-direction:column;gap:5px;min-height:0}
      #spectrumBar .spec-cell{flex-direction:row;justify-content:flex-start;min-height:42px;font-size:11px;padding:8px 12px;gap:12px}
      #spectrumBar .spec-cell.active{flex-wrap:wrap;min-height:255px;padding:12px;justify-content:center}
      #spectrumBar .comparison-detail{flex-basis:100%;max-width:360px}
      .comparison-example{font-size:13px}.comparison-object{font-size:12px}.comparison-note{font-size:11px}
      .relative.h-9{display:none}
    }

    .band-info{display:grid;gap:4px;margin-top:4px;font-size:10.5px;line-height:1.3;color:#334155}
    .band-info>div{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 3px;text-align:center;border-radius:8px;background:#f8fafc;border:1px solid #e2e8f0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
    .band-info>div.active{background:#eef2ff;border-color:#a5b4fc;font-weight:700}
    .zoom-compare{display:flex;justify-content:center;margin-top:10px;color:#172033;font-size:12px}
    .zoom-compare .comparison-detail{display:flex;flex-direction:column;align-items:center;width:100%;max-width:360px;gap:4px}
    .zoom-strip{margin-top:0}
    #zoomSvg{display:block;width:100%;height:34px}
    .zoom-bar{height:18px;border-radius:4px;background:linear-gradient(90deg,#d9231c 0%,#f5611c 16.7%,#ffb400 33.3%,#7ddf3b 50%,#00d1c0 66.7%,#2848ff 83.3%,#6a1fd0 100%)}
    .zoom-ticks{display:flex;justify-content:space-between;padding:3px 2px 0;font-size:10.5px;font-weight:700;color:#475569}
    @media(max-width:600px){.band-info,#zoomSvg,.zoom-bar,.zoom-ticks{display:none}}
  </style>
</head>
<body>

<div class="rise-wrapper">
  <!-- DYNAMIC TEXTBOOK TITLE -->
  <div class="text-center mb-2">
    <h1 id="mainTitle" class="text-2xl md:text-3xl font-black tracking-wider uppercase text-slate-900">
      VISIBLE SPECTRUM
    </h1>
    <p id="subTitle" class="text-xs font-medium text-slate-500 mt-0.5">
      Click any region of the Electromagnetic Spectrum below to launch its live physics & interactive scene
    </p>
  </div>

  <!-- LOW TO HIGH ENERGY ARROW -->
  <div class="px-2">
    <div class="flex justify-between text-[11px] font-extrabold tracking-wider uppercase text-slate-800">
      <span>LOW ENERGY (Long λ · Low Frequency)</span>
      <span>HIGH ENERGY (Short λ · High Frequency)</span>
    </div>
    <div class="energy-line"></div>
  </div>

  <!-- TOP WAVELENGTH TICKS FOR SELECTED BAND -->
  <div id="topTicks" class="grid grid-cols-4 text-center text-xs font-mono font-bold text-slate-700 mb-1 px-4">
    <div>7×10⁻⁷ m<br><span class="text-slate-400">│</span></div>
    <div>6×10⁻⁷ m<br><span class="text-slate-400">│</span></div>
    <div>5×10⁻⁷ m<br><span class="text-slate-400">│</span></div>
    <div>4×10⁻⁷ m<br><span class="text-slate-400">│</span></div>
  </div>

  <!-- MAIN ZOOMED INTERACTIVE STAGE (CANVAS + CONTROLS) -->
  <div class="relative rounded-xl overflow-hidden border-2 border-slate-800 shadow-md bg-slate-950">
    <!-- Top Floating Action Bar inside Stage -->
    <div class="absolute top-2.5 left-3 right-3 z-10 flex flex-wrap items-center justify-between gap-2 pointer-events-none">
      <div id="stageBadge" class="pointer-events-auto px-3 py-1 rounded-full text-xs font-bold bg-slate-900/85 text-white border border-slate-700 backdrop-blur-sm">
        🌈 Visible Light Window (400 nm – 700 nm)
      </div>

    </div>

    <canvas role="img" aria-label="Animated electromagnetic wave demonstration" id="stageCanvas" width="880" height="250" class="w-full block cursor-pointer" style="height:auto"></canvas>
  </div>

  <div id="stageControls" class="flex items-center justify-center gap-2 py-3"></div>

  <!-- DYNAMIC BRACKET CONNECTOR (Just like textbook reference image) -->
  <div class="relative h-9 w-full">
    <svg class="w-full h-full overflow-visible" viewBox="0 0 880 36" preserveAspectRatio="none">
      <!-- Top Wide Bracket Hugging Stage -->
      <path d="M 4 0 L 4 10 L 876 10 L 876 0" fill="none" stroke="#0f172a" stroke-width="2.2" />
      <!-- Sliding Stem + Small Bracket Locking Onto Active Band -->
      <line id="bracketStem" x1="455" y1="10" x2="455" y2="24" stroke="#0f172a" stroke-width="2.2" class="transition-all duration-300" />
      <path id="bracketFoot" d="M 428 35 L 428 24 L 482 24 L 482 35" fill="none" stroke="#0f172a" stroke-width="2.2" class="transition-all duration-300" />
    </svg>
  </div>

  <!-- 7-BAND TEXTBOOK SPECTRUM BAR -->
  <div id="spectrumBar" class="spectrum-bar">
    <!-- Generated by JS -->
  </div>

  <!-- Size of a wavelength + frequency rows, aligned under each band -->
  <div id="bandInfo" class="band-info"></div>

  <!-- Visible light zoom, as in the classic chart -->
  <div id="zoomStrip" class="zoom-strip">
    <svg id="zoomSvg" aria-hidden="true"></svg>
    <div id="zoomBar" class="zoom-bar"></div>
    <div id="zoomTicks" class="zoom-ticks"></div>
    <div id="zoomCompare" class="zoom-compare"></div>
  </div>

  <section id="sceneSummary" aria-label="Selected spectrum band details"></section>

</div>

function updatePointer(e) {
  const rect = canvas.getBoundingClientRect();
  const px=e.clientX-rect.left,py=e.clientY-rect.top;
  const region=displayRegions.find(r=>px>=r.dx&&px<=r.dx+r.dw&&py>=r.dy&&py<=r.dy+r.dh);
  if(!region)return;
  const sceneX=region.sx+(px-region.dx)/region.dw*region.sw;
  scannerX = Math.max(0.15, Math.min(0.85, sceneX/880));
  if (BANDS[currentIdx].id === 'uv') {uvCover=Math.max(.16,Math.min(.84,scannerX));document.getElementById('uvSlider').value=String(uvCover*100);}
  if (BANDS[currentIdx].id === 'xray' && xrState==='review') {xrReveal=Math.max(0,Math.min(1,(sceneX-290)/300));document.getElementById('xrSlider').value=String(xrReveal*100);}
  const slider = document.getElementById('irSlider');
  if (slider) slider.value = String(scannerX*100);
}

function renderStage() {
  t += 0.05;
  prepareScene();
  ctx.clearRect(0,0,880,sceneHeight);

  const b = BANDS[currentIdx];

  // Newton adjusts the prism, observes the spectrum, and records notes.
  if (b.id === 'visible') drawNewton();

  // Custom vector scenes share the same responsive canvas.
  else if (b.id === 'radio') drawRadio();
  else if (b.id === 'microwave') drawMicrowave();

  // Stacked astronomy and thermal scenes share one draggable viewer.
  else if (b.id === 'infrared') drawInfrared();

  // UV absorption produces a persistent modeled thymine dimer.
  else if (b.id === 'uv') drawUV();

  // Shared articulation keeps the captured silhouette and radiograph aligned.
  else if (b.id === 'xray') drawXray();

  // Three parallel shielding comparisons tell the pigs' story.
  else if (b.id === 'gamma') drawGammaPigs();

  presentScene();
  requestAnimationFrame(renderStage);
}

  const phase=time%14,target=Math.min(phase,12.7),m=popcornModel;
  if(target<m.time||target-m.time>15){m.time=0;m.next=0;m.particles=[];}
  while(m.time+1/120<=target){
    const dt=1/120;m.time+=dt;
    while(m.next<28&&m.time>=.4+m.next*.23){const n=m.next++,r=((n*73+19)%101)/100;m.particles.push({x:624+r*31,y:202,vx:(r-.5)*125,vy:-95-((n*37)%80),angle:n,spin:(r-.5)*9,r:6+n%3});}
    for(const p of m.particles){p.vy+=210*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.angle+=p.spin*dt;
      if(p.x-p.r<536){p.x=536+p.r;p.vx=Math.abs(p.vx)*.65;}if(p.x+p.r>744){p.x=744-p.r;p.vx=-Math.abs(p.vx)*.65;}
      if(p.y-p.r<122){p.y=122+p.r;p.vy=Math.abs(p.vy)*.55;}
      const floor=p.x>607&&p.x<675?209:263;
      if(p.y+p.r>floor){p.y=floor-p.r;p.vy=Math.abs(p.vy)>18?-Math.abs(p.vy)*.35:0;p.vx*=.92;p.spin*=.91;}
    }
    for(let i=0;i<m.particles.length;i++)for(let j=i+1;j<m.particles.length;j++){
      const a=m.particles[i],b=m.particles[j],dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy),min=(a.r+b.r)*.85;
      if(dist>.01&&dist<min){const nx=dx/dist,ny=dy/dist,over=(min-dist)*.5;a.x-=nx*over;a.y-=ny*over;b.x+=nx*over;b.y+=ny*over;
        const relative=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(relative<0){a.vx+=relative*nx*.65;a.vy+=relative*ny*.65;b.vx-=relative*nx*.65;b.vy-=relative*ny*.65;}a.spin*=.98;b.spin*=.98;
      }
    }
  }
  return {particles:m.particles,fade:Math.min(1,(14-phase)/1.3)};
}
function paintPopcorn(time){
  const state=updatePopcorn(time);ctx.save();ctx.globalAlpha=Math.max(0,state.fade);
  for(const p of state.particles){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);for(const [x,y,r] of [[-3,0,.7],[3,1,.65],[0,-4,.7]])disk(x,y,p.r*r,'#fff1c3');disk(0,2,p.r*.27,'#c79a4d');ctx.restore();}
  ctx.restore();
}
let xraySampleCache=null;
function xraySample(p,key){
  if(xraySampleCache?.key===key)return xraySampleCache;
  const mask=document.createElement('canvas');mask.width=880;mask.height=530;const saved=ctx;
  try{ctx=mask.getContext('2d');xrayFigure(p,true);}finally{ctx=saved;}
  const data=mask.getContext('2d').getImageData(0,0,880,530).data,rows=[];
  for(let row=0;row<28;row++){
    const y=130+row*10,samples=[];let optical=0;
    for(let x=137;x<=755;x+=2){const yy=231+(y-231)*(x-137)/(755-137),idx=(Math.round(yy)*880+x)*4,a=data[idx+3]/255;
      const luminance=(data[idx]+data[idx+1]+data[idx+2])/765;
      optical+=a>.7&&luminance>.55?.12:a>.02?.008:0;samples.push({x,y:yy,optical});
    }
    rows.push({y,samples,transmission:Math.exp(-optical)});
  }
  return xraySampleCache={key,rows};
}
function drawXrayPackets(model,elapsed,exposing){
  for(let row=0;row<model.rows.length;row++){
    const r=model.rows[row];let arrivals=0;
    for(let n=0;n<6;n++){
      const launch=n*.21,age=elapsed-launch,progress=age/1.1;
      const threshold=-Math.log((((row*37+n*59)%97)+.5)/97);
      const hit=r.samples.find(s=>s.optical>=threshold),end=hit?hit.x:755;
      if(progress>=1&&!hit)arrivals++;
      if(exposing&&progress>=0&&progress<1){const x=137+618*progress,y=231+(r.y-231)*progress;if(x<end)line([[x-5,y],[x,y]],'#c7d2fe',1.5);}
    }
    const light=215-Math.round(arrivals/6*190);box(747,r.y-3,34,7,`rgb(${light},${light},${Math.min(255,light+25)})`,1);
  }
}
function newtonWriting(cycle){
  const lineIndex=Math.min(3,Math.floor(Math.max(0,cycle-4)/2.5));
  const u=Math.max(0,Math.min(1,(cycle-4-lineIndex*2.5)/2.1));
  return {lineIndex,u,tip:[370+60*u,506+lineIndex*13+Math.sin(u*70)*1.6]};
}
function newtonElbow(shoulder,hand){
  const dx=hand[0]-shoulder[0],dy=hand[1]-shoulder[1],d=Math.max(1,Math.hypot(dx,dy)),l1=95,l2=100;
  const along=(l1*l1-l2*l2+d*d)/(2*d),perp=Math.sqrt(Math.max(0,l1*l1-along*along));
  return [shoulder[0]+along*dx/d-perp*dy/d,shoulder[1]+along*dy/d+perp*dx/d];
}


function materialGradient(x,y,w,h,light,mid,dark){const g=ctx.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,light);g.addColorStop(.42,mid);g.addColorStop(1,dark);return g;}
function shadedOrb(x,y,r,color){
  ctx.save();disk(x+1,y+2,r,'#00000035');const g=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.05,x,y,r);g.addColorStop(0,'#ffffff');g.addColorStop(.28,color);g.addColorStop(1,'#182238');disk(x,y,r,g);ctx.restore();
}
function softGlow(x,y,rx,ry,color){ctx.save();ctx.translate(x,y);ctx.scale(1,ry/rx);const g=ctx.createRadialGradient(0,0,0,0,0,rx);g.addColorStop(0,color);g.addColorStop(1,'#00000000');ctx.fillStyle=g;ctx.fillRect(-rx,-rx,rx*2,rx*2);ctx.restore();}
function rivet(x,y){disk(x,y,1.8,'#182238');disk(x-.4,y-.5,1,'#d7e1ec');}
function timber(x,y,w,h){
  box(x,y,w,h,materialGradient(x,y,w,h,'#ad7b51','#785139','#3e2b25'),4);
  for(let j=0;j<4;j++){const pts=[];for(let k=0;k<=30;k++)pts.push([x+k*w/30,y+3+j*(h-6)/4+Math.sin(k*.8+j)*1.1]);line(pts,'#2e211d40',.8);}
  line([[x+3,y+2],[x+w-3,y+2]],'#d6a57580',1);
}


const WAVE_COMPARISONS=[
  {wave:'100 m',object:'Football field ≈ 100 m',ratio:1,art:'<rect x="130" y="82" width="100" height="48" rx="3" fill="#24734c"/><path d="M180 82V130M140 82V130M220 82V130" stroke="#d1fae5"/><rect x="133" y="85" width="94" height="42" fill="none" stroke="#d1fae5"/><circle cx="180" cy="106" r="10" fill="none" stroke="#d1fae5"/>'},
  {wave:'12 cm',object:'Baseball diameter ≈ 7.4 cm',ratio:12/7.4,art:'<ellipse cx="180" cy="108" rx="50" ry="25" fill="#f8fafc" stroke="#94a3b8"/><path d="M153 87Q180 108 153 129M207 87Q180 108 207 129" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="3 2"/>'},
  {wave:'70 μm',object:'Hair diameter ≈ 70 μm',ratio:1,art:'<rect x="130" y="83" width="100" height="48" rx="14" fill="#a77b52"/><path d="M140 87V127M154 87V127M170 87V127M190 87V127M207 87V127M220 87V127" stroke="#d6b38c"/><text x="180" y="111" text-anchor="middle" fill="#201b19" font-size="11">hair width</text>'},
  {wave:'550 nm',object:'Small bacterium ≈ 1 μm long',ratio:.55,art:'<rect x="130" y="86" width="100" height="42" rx="21" fill="#6ee7b7" stroke="#047857" stroke-width="2"/><path d="M146 108q12-17 23 0t23 0t23 0" fill="none" stroke="#047857" stroke-width="2"/><circle cx="154" cy="100" r="2" fill="#047857"/>'},
  {wave:'50 nm',object:'Example virus ≈ 100 nm wide',ratio:.5,art:'<ellipse cx="180" cy="106" rx="41" ry="23" fill="#67e8f9" stroke="#0891b2"/><path d="M130 106H145M215 106H230M155 79l7 10M205 79l-7 10M155 133l7-10M205 133l-7-10" stroke="#0891b2" stroke-width="3"/><path d="M158 105q12-14 22 0t22 0" fill="none" stroke="#0e7490"/>'},
  {wave:'0.1 nm',object:'Atom diameter ≈ 0.1 nm',ratio:1,art:'<ellipse cx="180" cy="106" rx="50" ry="25" fill="#c7d2fe" fill-opacity=".65" stroke="#818cf8" stroke-dasharray="2 3"/><ellipse cx="180" cy="106" rx="35" ry="17" fill="#a5b4fc" fill-opacity=".4"/><circle cx="180" cy="106" r="4" fill="#4338ca"/>'},
  {wave:'1 pm (≈1 MeV photon)',object:'Nucleus ≈ 5 fm: λ is ~200× larger (not to scale)',ratio:2.2,art:'<ellipse cx="180" cy="106" rx="50" ry="25" fill="#c084fc" fill-opacity=".12"/>'+Array.from({length:14},(_,i)=>`<circle cx="${141+(i%5)*19+(Math.floor(i/5)%2)*7}" cy="${91+Math.floor(i/5)*15}" r="8" fill="${i%2?'#c084fc':'#60a5fa'}" stroke="#f5eaff" stroke-width=".6"/>`).join('')}
];
function wavelengthComparison(index){
  const c=WAVE_COMPARISONS[index],period=100*c.ratio,points=[];
  for(let x=-period;x<=360+period;x+=1.5)points.push(`${x.toFixed(1)},${(27-12*Math.cos(2*Math.PI*(x-28)/period)).toFixed(1)}`);
  return `<span class="comparison-detail"><span class="comparison-example">Example λ: ${c.wave}</span>
  <svg class="comparison-wave" viewBox="0 0 360 158" role="img" aria-label="Animated ${c.wave} wavelength compared with ${c.object}">
    <defs><clipPath id="waveClip${index}"><rect x="7" y="8" width="346" height="36"/></clipPath></defs>
    <g clip-path="url(#waveClip${index})"><polyline points="${points.join(' ')}" fill="none" stroke="currentColor" stroke-width="2.5"><animateTransform attributeName="transform" type="translate" from="0 0" to="${period} 0" dur="${(period/60).toFixed(2)}s" repeatCount="indefinite"/></polyline></g>
    <path d="M28 47v7h${period}v-7" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="${28+period/2}" y="69" text-anchor="middle" fill="currentColor" font-size="13">one wavelength (λ)</text>
    ${c.art}<path d="M130 139v5h100v-5" fill="none" stroke="currentColor" stroke-width="1.2"/>
  </svg><span class="comparison-object">${c.object}</span><span class="comparison-note">Each band is magnified separately.</span></span>`;
}
function buildBandInfo(){
  const info=document.getElementById('bandInfo');
  info.style.gridTemplateColumns=document.getElementById('spectrumBar').style.gridTemplateColumns;
  const cls=i=>i===currentIdx?' class="active"':'';
  info.innerHTML=BANDS.map((b,i)=>`<div${cls(i)}><span>${b.sizeLabel}</span></div>`).join('')
    +BANDS.map((b,i)=>`<div${cls(i)}><span>${b.frequency.replace(/\s*\([^)]*\)/g,'')}</span></div>`).join('');
}
function alignZoom(){
  const wrap=document.getElementById('zoomStrip'),cell=document.getElementById('bandInfo').children[currentIdx];if(!cell)return;
  const b=BANDS[currentIdx],vis=b.id==='visible';
  document.getElementById('zoomBar').style.background=vis?'':`linear-gradient(90deg,${b.accent}44,${b.accent})`;
  document.getElementById('zoomTicks').innerHTML=(vis?['700 nm (red)','600 nm','500 nm','400 nm (violet)']:b.ticks).map(t=>`<span>${t}</span>`).join('');
  document.getElementById('zoomCompare').innerHTML=wavelengthComparison(currentIdx);
  const wr=wrap.getBoundingClientRect(),r=cell.getBoundingClientRect(),w=wr.width,x1=r.left-wr.left,x2=r.right-wr.left;
  document.getElementById('zoomSvg').innerHTML=`<path d="M ${x1} 0 L 0 34 M ${x2} 0 L ${w} 34" fill="none" stroke="#64748b" stroke-width="1.5"/>`;
}
function alignSpectrumBracket(){
  const bar=document.getElementById('spectrumBar'),active=bar.querySelector('.active');if(!active)return;
  const br=bar.getBoundingClientRect(),r=active.getBoundingClientRect(),cx=(r.left-br.left+r.width/2)/br.width*880,half=Math.min(65,r.width/br.width*360);
  document.getElementById('bracketStem').setAttribute('x1',cx);document.getElementById('bracketStem').setAttribute('x2',cx);
  document.getElementById('bracketFoot').setAttribute('d',`M ${cx-half} 35 L ${cx-half} 24 L ${cx+half} 24 L ${cx+half} 35`);
}


window.addEventListener("resize",alignSpectrumBracket);window.addEventListener("resize",alignZoom);
buildUI();
renderStage();
