<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One filter: 50% transmitted.</title>
<link rel="stylesheet" href="simple-walkthrough.css">
<style>
#prompt { font-size: clamp(.875rem, 2.6vw, 1.625rem); font-weight: 750; }
#explanation { margin: 0; font-size: clamp(1.125rem, 2.2vw, 1.375rem); }
#mind-blown { float: right; margin: 0 4px 8px 14px; font-size: 3rem; line-height: 1.2; transform-origin: center; }
#mind-blown:not([hidden]) { animation: mind-blown-pop 1.4s ease-out; }
@keyframes mind-blown-pop {
  0% { opacity: 0; transform: scale(.25) rotate(-18deg); }
  35% { opacity: 1; transform: scale(1.3) rotate(12deg); }
  55% { transform: scale(.9) rotate(-8deg); }
  75% { transform: scale(1.1) rotate(4deg); }
  100% { transform: scale(1) rotate(0); }
}
@media (prefers-reduced-motion: reduce) { #mind-blown:not([hidden]) { animation: none; } }
</style>
</head>
<body>
<main class="lesson">
<h1 id="prompt" aria-live="polite">One filter: 50% transmitted.</h1>
<div class="content">
<div class="stage">
<svg id="scene" viewBox="0 0 840 450" role="img" aria-label="One polarizing filter between a lamp and screen"></svg>
<div class="message" role="status" aria-live="polite"><span id="mind-blown" hidden aria-hidden="true">🤯</span><p id="explanation">The filter transmits the electric-field component parallel to its transmission axis.</p></div>
</div>
<div class="buttons" role="group" aria-label="Lesson and playback">
<button id="start" hidden>Turn on light</button>
<button id="advance" hidden>Rotate the second filter</button>

<button class="utility" id="replay">Replay</button>
</div>
</div>
</main>
<script>window.walkthroughLesson = {"title":"Can Another Filter Restore Light?","type":"polarization","choices":["Still no light","Some light returns"],"correct":1};</script>
<script src="textbook-diagrams.js"></script>
<script src="polarization-filters.js"></script>
</body>
</html>
