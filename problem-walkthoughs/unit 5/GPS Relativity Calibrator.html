<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GPS Relativity Calibrator</title>
    <style>
        body { font-family: monospace; background: #0b1c2c; color: #fff; padding: 20px; }
        .dashboard { display: flex; gap: 20px; justify-content: center; margin-top: 40px; }
        .card { background: #15293d; padding: 20px; border-radius: 8px; width: 250px; text-align: center; border: 1px solid #284a6b; }
        .clock { font-size: 2em; color: #00ffcc; margin: 15px 0; }
        .drift { color: #ff4444; font-size: 1.2em; }
        .controls { text-align: center; margin-top: 30px; }
        label { margin: 0 15px; font-size: 1.1em; cursor: pointer; }
        input[type="checkbox"] { transform: scale(1.5); margin-right: 8px; }
    </style>
</head>
<body>
    <h2 style="text-align:center;">GPS Relativity Calibrator</h2>
    
    <div class="controls">
        <label><input type="checkbox" id="srToggle"> Enable Special Relativity (Velocity)</label>
        <label><input type="checkbox" id="grToggle"> Enable General Relativity (Gravity)</label>
    </div>

    <div class="dashboard">
        <div class="card">
            <h3>Earth Observer</h3>
            <div class="clock" id="earthTime">0.00000 s</div>
            <div>Reference Frame</div>
        </div>
        
        <div class="card">
            <h3>GPS Satellite</h3>
            <div class="clock" id="satTime">0.00000 s</div>
            <div>Orbiting at 14,000 km/h</div>
        </div>
        
        <div class="card">
            <h3>System Status</h3>
            <div style="margin: 15px 0;">Time Drift:</div>
            <div class="drift" id="driftVal">0.00 μs</div>
            <div id="navStatus" style="margin-top: 10px; color:#aaa;">Navigation Accurate</div>
        </div>
    </div>

    <script>
        let earthTime = 0; // simulated seconds
        let satTime = 0;
        
        // Exaggerated rates per tick for visual demonstration
        const tickRate = 0.05; // Base seconds per frame
        const srEffect = -0.00007; // Slows down
        const grEffect = +0.00045; // Speeds up

        function updateClocks() {
            const srOn = document.getElementById('srToggle').checked;
            const grOn = document.getElementById('grToggle').checked;

            earthTime += tickRate;
            
            let satTick = tickRate;
            if (srOn) satTick += srEffect;
            if (grOn) satTick += grEffect;
            satTime += satTick;

            // Display formatting
            document.getElementById('earthTime').innerText = earthTime.toFixed(5) + " s";
            document.getElementById('satTime').innerText = satTime.toFixed(5) + " s";

            // Calculate drift in microseconds (exaggerated mapping)
            let drift = (satTime - earthTime) * 1000000;
            const driftEl = document.getElementById('driftVal');
            driftEl.innerText = (drift > 0 ? "+" : "") + drift.toFixed(2) + " μs";

            // Status message
            const navStatus = document.getElementById('navStatus');
            if (Math.abs(drift) > 5) {
                driftEl.style.color = "#ff4444";
                navStatus.innerText = "⚠️ GPS Drift > 1.5 km. Navigation Failed.";
                navStatus.style.color = "#ff4444";
            } else {
                driftEl.style.color = "#00ffcc";
                navStatus.innerText = "✅ Navigation Accurate";
                navStatus.style.color = "#00ffcc";
            }

            requestAnimationFrame(updateClocks);
        }
        
        updateClocks();
    </script>
</body>
</html>
