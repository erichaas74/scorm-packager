<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemstone Refraction Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .math-font { font-family: 'JetBrains Mono', monospace; }
        /* Prevent touch actions on canvas to allow custom dragging without scrolling the page */
        canvas { touch-action: none; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 text-white p-4 shadow-md">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">Gemstone Refraction</h1>
                <p class="text-slate-400 text-sm">Interactive Light Physics Simulation</p>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 flex flex-col gap-4">
        
        <!-- Top Controls -->
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row gap-6 items-center justify-between">
            <div class="flex-1 w-full">
                <div class="flex justify-between items-center mb-1">
                    <label for="angleSlider" class="block text-sm font-semibold text-slate-700">
                        Angle of Incidence (θ₁)
                    </label>
                    <span id="angleValue" class="text-sm font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded">45.0°</span>
                </div>
                <input type="range" id="angleSlider" min="0" max="89" step="0.5" value="45" class="w-full mt-2 accent-blue-600 cursor-pointer">
            </div>

            <div class="flex-1 w-full">
                <label for="materialSelect" class="block text-sm font-semibold text-slate-700 mb-1">
                    Gemstone Material
                </label>
                <select id="materialSelect" class="w-full p-2 border border-slate-300 rounded-lg bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium">
                    <option value="2.417">Diamond (n = 2.417)</option>
                    <option value="2.180">Zircon (n = 2.180)</option>
                    <option value="1.940">Garnet (n = 1.940)</option>
                    <option value="1.762">Ruby (n = 1.762)</option>
                    <option value="1.520">Glass (n = 1.520)</option>
                    <option value="1.333">Water (n = 1.333)</option>
                </select>
            </div>

            <div class="flex-1 w-full flex gap-2">
                <button id="toggleProtractor" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2 px-4 rounded-lg transition-colors border border-slate-300">
                    Toggle Protractor
                </button>
                <button id="centerProtractor" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2 px-4 rounded-lg transition-colors border border-slate-300">
                    Reset Protractor
                </button>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div id="canvasContainer" class="w-full relative rounded-xl overflow-hidden border border-slate-300 shadow-inner bg-white flex-1 min-h-[650px] md:min-h-[750px]">
            <canvas id="simCanvas" class="absolute top-0 left-0 w-full h-full cursor-crosshair"></canvas>
        </div>

        <!-- Snell's Law Bottom Panel -->
        <div class="bg-slate-900 rounded-xl p-3 shadow-xl border border-slate-800 flex flex-col relative overflow-hidden mt-2">
            <div class="absolute top-0 right-0 w-64 h-64 bg-blue-500 rounded-full mix-blend-overlay filter blur-[80px] opacity-20 pointer-events-none"></div>
            <div class="absolute bottom-0 left-0 w-64 h-64 bg-purple-500 rounded-full mix-blend-overlay filter blur-[80px] opacity-20 pointer-events-none"></div>
            
            <h2 class="text-center font-bold text-slate-400 mb-2 tracking-widest uppercase text-[10px] z-10">Snell's Law: n₁ · sin(θ₁) = n₂ · sin(θ₂)</h2>
            
            <div class="flex flex-col lg:flex-row justify-between items-stretch gap-3 relative z-10">
                <!-- Left Side: Incident (Medium 1) -->
                <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700/50 flex-1 flex flex-col shadow-inner">
                    <h3 class="text-blue-400 font-semibold text-xs mb-2 flex items-center gap-2 uppercase tracking-wide">
                        <span class="w-2.5 h-2.5 rounded-full bg-blue-500 shadow-[0_0_8px_rgba(59,130,246,0.8)]"></span> Incident (Air)
                    </h3>
                    <div class="math-font flex-1 flex flex-row items-center justify-between gap-3">
                        <div class="flex flex-col bg-slate-900/50 p-2 rounded-lg flex-1 border border-slate-700/50 text-center">
                            <span class="text-slate-400 text-[10px] mb-0.5 uppercase tracking-wider">Index (n₁)</span>
                            <span class="text-white font-bold text-lg">1.000</span>
                        </div>
                        <div class="flex flex-col bg-slate-900/50 p-2 rounded-lg flex-1 border border-slate-700/50 text-center">
                            <span class="text-slate-400 text-[10px] mb-0.5 uppercase tracking-wider">Angle (θ₁)</span>
                            <span class="text-white font-bold text-lg"><span id="panelTheta1">45.0</span>°</span>
                        </div>
                    </div>
                </div>

                <!-- Right Side: Refracted (Medium 2) -->
                <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700/50 flex-1 flex flex-col shadow-inner">
                    <h3 class="text-purple-400 font-semibold text-xs mb-2 flex items-center gap-2 justify-end uppercase tracking-wide">
                        Refracted Material <span class="w-2.5 h-2.5 rounded-full bg-purple-500 shadow-[0_0_8px_rgba(168,85,247,0.8)]"></span>
                    </h3>
                    <div class="math-font flex-1 flex flex-row items-center justify-between gap-3">
                        <div class="flex flex-col bg-slate-900/50 p-2 rounded-lg flex-1 border border-slate-700/50 text-center">
                            <span class="text-slate-400 text-[10px] mb-0.5 uppercase tracking-wider">Index (n₂)</span>
                            <div class="flex items-center justify-center">
                                <input type="number" id="n2Input" placeholder="?" step="0.001" class="w-full max-w-[100px] bg-slate-950 text-amber-400 font-bold text-lg text-center border border-amber-500/50 rounded focus:outline-none focus:border-amber-400 placeholder-amber-700/50 transition-colors py-0.5">
                            </div>
                        </div>
                        <div class="flex flex-col bg-slate-900/50 p-2 rounded-lg flex-1 border border-slate-700/50 text-center">
                            <span class="text-slate-400 text-[10px] mb-0.5 uppercase tracking-wider">Angle (θ₂)</span>
                            <span class="text-white font-bold text-lg"><span id="panelTheta2">17.1</span>°</span>
                        </div>
                    </div>
                    <div class="mt-2 flex gap-2 justify-end items-center">
                        <span id="n2Feedback" class="text-[10px] font-semibold mr-auto"></span>
                        <span id="panelMat2Name" class="text-[10px] text-purple-300 mr-2 font-bold uppercase tracking-widest hidden"></span>
                        <button id="checkN2Btn" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-1 px-3 rounded transition-colors text-xs border border-slate-600">Check</button>
                        <button id="revealN2Btn" class="bg-amber-600 hover:bg-amber-500 text-white font-bold py-1 px-3 rounded transition-colors text-xs border border-amber-500/50 uppercase tracking-wide shadow-[0_0_10px_rgba(217,119,6,0.2)]">Reveal</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // DOM Elements
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvasContainer');

        const materialSelect = document.getElementById('materialSelect');
        const angleSlider = document.getElementById('angleSlider');
        const angleValue = document.getElementById('angleValue');
        const toggleProtractorBtn = document.getElementById('toggleProtractor');
        const centerProtractorBtn = document.getElementById('centerProtractor');

        // Panel Elements
        const panelTheta1 = document.getElementById('panelTheta1');
        const panelTheta2 = document.getElementById('panelTheta2');
        const panelMat2Name = document.getElementById('panelMat2Name');
        const n2Input = document.getElementById('n2Input');
        const checkN2Btn = document.getElementById('checkN2Btn');
        const revealN2Btn = document.getElementById('revealN2Btn');
        const n2Feedback = document.getElementById('n2Feedback');

        // State Variables
        let width, height;
        let n1 = 1.000; // Air
        let n2 = parseFloat(materialSelect.value);
        let thetaI = parseFloat(angleSlider.value); // Incident angle (degrees)
        let thetaR = 0; // Refracted angle (degrees)
        let entryPoint = { x: 0, y: 0 };
        let isIndexCalculated = false;

        // Protractor State
        let protractor = {
            x: 0, y: 0,
            radius: 180,
            angle: 0,
            visible: true,
            isDraggingCenter: false,
            isDraggingHandle: false
        };

        function calculatePhysics() {
            n2 = parseFloat(materialSelect.value);
            thetaI = parseFloat(angleSlider.value);
            
            // Snell's Law: n1 * sin(thetaI) = n2 * sin(thetaR)
            const thetaIRad = thetaI * Math.PI / 180;
            const sinThetaR = (n1 * Math.sin(thetaIRad)) / n2;
            
            // Handle total internal reflection (though unlikely entering denser medium)
            if (Math.abs(sinThetaR) > 1) {
                thetaR = 90; 
            } else {
                thetaR = Math.asin(sinThetaR) * 180 / Math.PI;
            }

            updateUI();
            draw();
        }

        function updateUI() {
            // Top UI
            angleValue.textContent = `${thetaI.toFixed(1)}°`;
            
            // Bottom Panel UI (Always update angles)
            panelTheta1.textContent = thetaI.toFixed(1);
            panelTheta2.textContent = thetaR.toFixed(1);

            // Logic for revealing n2
            if (!isIndexCalculated) {
                n2Input.disabled = false;
                n2Input.classList.remove('text-emerald-400', 'border-emerald-500');
                n2Input.classList.add('text-amber-400', 'border-amber-500/50');
                
                panelMat2Name.textContent = '';
                panelMat2Name.classList.add('hidden');
                
                revealN2Btn.disabled = false;
                revealN2Btn.classList.remove('opacity-50', 'cursor-not-allowed');
                revealN2Btn.textContent = 'Reveal';
                
                checkN2Btn.disabled = false;
                checkN2Btn.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                n2Input.value = n2.toFixed(3);
                n2Input.disabled = true;
                n2Input.classList.remove('text-amber-400', 'border-amber-500/50');
                n2Input.classList.add('text-emerald-400', 'border-emerald-500');
                
                // Get material name string without the (n=...) part
                const selectedText = materialSelect.options[materialSelect.selectedIndex].text;
                const matName = selectedText.substring(0, selectedText.indexOf('(')).trim();
                panelMat2Name.textContent = matName;
                panelMat2Name.classList.remove('hidden');
                
                revealN2Btn.disabled = true;
                revealN2Btn.classList.add('opacity-50', 'cursor-not-allowed');
                revealN2Btn.textContent = 'Revealed ✓';
                
                checkN2Btn.disabled = true;
                checkN2Btn.classList.add('opacity-50', 'cursor-not-allowed');
                n2Feedback.textContent = '';
            }
        }

        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            // Handle high DPI displays
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            width = rect.width;
            height = rect.height;

            // Set entry point in the middle of canvas horizontally, matching the gemstone top flat face
            entryPoint = { x: width / 2, y: height * 0.25 };
            
            // Initial protractor placement if it hasn't been set
            if (protractor.x === 0 && protractor.y === 0) {
                protractor.x = entryPoint.x;
                protractor.y = entryPoint.y;
            }
            
            draw();
        }

        function drawGemstone() {
            ctx.save();
            
            // Draw sky/air background over entire canvas
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(0, 0, width, height);

            // Define dynamic gemstone points based on canvas size
            const cx = width / 2;
            const topY = height * 0.25;
            const midY = height * 0.45;
            const botY = height * 0.95;
            
            const topW = Math.min(width * 0.5, 450);
            const midW = Math.min(width * 0.8, 750);

            const p0 = [cx - topW/2, topY];
            const p1 = [cx + topW/2, topY];
            const p2 = [cx + midW/2, midY];
            const p3 = [cx, botY];
            const p4 = [cx - midW/2, midY];

            // Draw outer shape
            ctx.fillStyle = 'rgba(147, 197, 253, 0.42)'; // Light blue diamond tint
            ctx.strokeStyle = '#315d8b';
            ctx.lineWidth = 3;
            
            ctx.beginPath();
            ctx.moveTo(...p0);
            ctx.lineTo(...p1);
            ctx.lineTo(...p2);
            ctx.lineTo(...p3);
            ctx.lineTo(...p4);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Draw internal facets for depth
            ctx.strokeStyle = 'rgba(49, 93, 139, 0.35)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(...p0); ctx.lineTo(...p3);
            ctx.moveTo(...p1); ctx.lineTo(...p3);
            ctx.moveTo(...p4); ctx.lineTo(...p2);
            ctx.stroke();

            // Draw Normal Line (dashed)
            ctx.beginPath();
            ctx.setLineDash([5, 5]);
            ctx.moveTo(entryPoint.x, 0);
            ctx.lineTo(entryPoint.x, height);
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.setLineDash([]);

            // Label Normal
            ctx.fillStyle = '#64748b';
            ctx.font = '12px Inter';
            ctx.fillText('Normal', entryPoint.x + 10, 30);
            
            ctx.restore();
        }

        function drawRays() {
            ctx.save();
            
            const rayLength = Math.max(width, height);
            
            // Incident Ray (Blue)
            const thetaIRad = thetaI * Math.PI / 180;
            // Angle from standard canvas coordinates (normal is vertical, so incident comes from top-left usually)
            const startX = entryPoint.x - rayLength * Math.sin(thetaIRad);
            const startY = entryPoint.y - rayLength * Math.cos(thetaIRad);

            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(entryPoint.x, entryPoint.y);
            ctx.strokeStyle = '#3b82f6'; // Blue-500
            ctx.lineWidth = 4;
            ctx.stroke();

            // Arrow on Incident
            drawArrow(startX, startY, entryPoint.x, entryPoint.y, '#3b82f6', 0.4);

            // Refracted Ray (Purple)
            const thetaRRad = thetaR * Math.PI / 180;
            const endX = entryPoint.x + rayLength * Math.sin(thetaRRad);
            const endY = entryPoint.y + rayLength * Math.cos(thetaRRad);

            ctx.beginPath();
            ctx.moveTo(entryPoint.x, entryPoint.y);
            ctx.lineTo(endX, endY);
            ctx.strokeStyle = '#a855f7'; // Purple-500
            ctx.lineWidth = 4;
            ctx.stroke();

            // Arrow on Refracted
            drawArrow(entryPoint.x, entryPoint.y, endX, endY, '#a855f7', 0.6);

            // Draw Entry Node
            ctx.beginPath();
            ctx.arc(entryPoint.x, entryPoint.y, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#1e293b';
            ctx.fill();
            
            ctx.restore();
        }

        function drawArrow(fromx, fromy, tox, toy, color, t) {
            // t is proportion along the line to draw the arrow
            const x = fromx + (tox - fromx) * t;
            const y = fromy + (toy - fromy) * t;
            const angle = Math.atan2(toy - fromy, tox - fromx);
            
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-12, -7);
            ctx.lineTo(-12, 7);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
            ctx.restore();
        }

        function drawProtractor() {
            if (!protractor.visible) return;

            ctx.save();
            ctx.translate(protractor.x, protractor.y);
            ctx.rotate(protractor.angle);

            const r = protractor.radius;
            
            // Full circle background
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, 2 * Math.PI);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#1e293b';
            ctx.stroke();

            // Crosshairs at center
            ctx.beginPath();
            ctx.moveTo(-20, 0); ctx.lineTo(20, 0);
            ctx.moveTo(0, -20); ctx.lineTo(0, 20);
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#94a3b8';
            ctx.stroke();

            // Tick marks
            ctx.strokeStyle = '#475569';
            ctx.fillStyle = '#0f172a';
            ctx.font = '11px Inter';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            for (let deg = 0; deg < 360; deg += 5) {
                // Orient 0 to be exactly at the top for easier normal measurements
                const rad = -Math.PI / 2 + (deg * Math.PI / 180);
                const isMajor = deg % 10 === 0;
                const innerR = isMajor ? r - 15 : r - 8;
                
                ctx.beginPath();
                ctx.lineWidth = isMajor ? 1.5 : 1;
                ctx.moveTo(innerR * Math.cos(rad), innerR * Math.sin(rad));
                ctx.lineTo(r * Math.cos(rad), r * Math.sin(rad));
                ctx.stroke();

                if (isMajor) {
                    const textR = r - 26;
                    ctx.fillText(deg.toString(), textR * Math.cos(rad), textR * Math.sin(rad));
                }
            }

            // Center drag node
            ctx.beginPath();
            ctx.arc(0, 0, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#ef4444'; // Red center
            ctx.fill();
            ctx.stroke();

            // Rotate Handle (placed at 0 degrees visually)
            const handleDist = r + 25;
            ctx.beginPath();
            ctx.moveTo(0, -r);
            ctx.lineTo(0, -handleDist);
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#6366f1'; // Indigo
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, -handleDist, 10, 0, Math.PI * 2);
            ctx.fillStyle = '#6366f1';
            ctx.fill();
            ctx.stroke();

            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            drawGemstone();
            drawRays();
            drawProtractor();
        }

        function getMousePos(evt) {
            const rect = canvas.getBoundingClientRect();
            // Need to account for potential CSS scaling vs actual canvas resolution
            const scaleX = canvas.width / rect.width / (window.devicePixelRatio || 1);
            const scaleY = canvas.height / rect.height / (window.devicePixelRatio || 1);
            
            return {
                x: (evt.clientX - rect.left) * scaleX,
                y: (evt.clientY - rect.top) * scaleY
            };
        }

        // Pointer Events for Protractor Dragging
        canvas.addEventListener('pointerdown', (e) => {
            if (!protractor.visible) return;
            
            const pos = getMousePos(e);
            
            // Check center node hit
            const distCenter = Math.hypot(pos.x - protractor.x, pos.y - protractor.y);
            if (distCenter < 15) {
                protractor.isDraggingCenter = true;
                canvas.setPointerCapture(e.pointerId);
                return;
            }

            // Check rotate handle hit
            // Calculate handle position taking into account current rotation
            const handleDist = protractor.radius + 25;
            const hx = protractor.x + handleDist * Math.sin(protractor.angle);
            // In canvas, y goes down. The handle is drawn at negative Y (up), so we subtract cos
            const hy = protractor.y - handleDist * Math.cos(protractor.angle);
            
            const distHandle = Math.hypot(pos.x - hx, pos.y - hy);
            if (distHandle < 15) {
                protractor.isDraggingHandle = true;
                canvas.setPointerCapture(e.pointerId);
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!protractor.isDraggingCenter && !protractor.isDraggingHandle) return;
            
            const pos = getMousePos(e);
            
            if (protractor.isDraggingCenter) {
                protractor.x = pos.x;
                protractor.y = pos.y;
            } else if (protractor.isDraggingHandle) {
                // Calculate new angle based on mouse position relative to center
                // Math.atan2(y, x) normally. We want 0 angle to be straight up (0, -1)
                // atan2(dy, dx) returns angle from positive X axis.
                const dy = pos.y - protractor.y;
                const dx = pos.x - protractor.x;
                // Add Math.PI/2 because our visual 0 is up, not right.
                protractor.angle = Math.atan2(dy, dx) + Math.PI/2;
            }
            draw();
        });

        canvas.addEventListener('pointerup', (e) => {
            protractor.isDraggingCenter = false;
            protractor.isDraggingHandle = false;
            canvas.releasePointerCapture(e.pointerId);
        });

        // UI Event Listeners
        angleSlider.addEventListener('input', () => {
            isIndexCalculated = false;
            calculatePhysics();
        });

        materialSelect.addEventListener('change', () => {
            isIndexCalculated = false;
            n2Input.value = '';
            n2Feedback.textContent = '';
            calculatePhysics();
        });

        revealN2Btn.addEventListener('click', () => {
            isIndexCalculated = true;
            calculatePhysics();
        });

        checkN2Btn.addEventListener('click', () => {
            const guess = parseFloat(n2Input.value);
            if(isNaN(guess)) {
                n2Feedback.textContent = 'Enter a value!';
                n2Feedback.className = 'text-xs font-semibold mr-auto text-red-400';
                return;
            }
            // Check if guess is close to actual refractive index
            if(Math.abs(guess - n2) < 0.05) {
                n2Feedback.textContent = 'Correct!';
                n2Feedback.className = 'text-xs font-semibold mr-auto text-emerald-400';
                isIndexCalculated = true;
                updateUI();
            } else {
                n2Feedback.textContent = 'Try again.';
                n2Feedback.className = 'text-xs font-semibold mr-auto text-red-400';
            }
        });

        toggleProtractorBtn.addEventListener('click', () => {
            protractor.visible = !protractor.visible;
            toggleProtractorBtn.classList.toggle('bg-slate-300', protractor.visible);
            toggleProtractorBtn.classList.toggle('bg-slate-100', !protractor.visible);
            draw();
        });

        centerProtractorBtn.addEventListener('click', () => {
            protractor.x = entryPoint.x;
            protractor.y = entryPoint.y;
            protractor.angle = 0;
            if(!protractor.visible) {
                protractor.visible = true;
                toggleProtractorBtn.classList.add('bg-slate-300');
                toggleProtractorBtn.classList.remove('bg-slate-100');
            }
            draw();
        });

        window.addEventListener('resize', () => {
            resizeCanvas();
            calculatePhysics(); // Re-calculate to redraw properly based on new coords
        });

        // Initialization
        window.onload = () => {
            resizeCanvas();
            calculatePhysics();
        };

    </script>
</body>
</html>
