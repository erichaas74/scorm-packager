<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One Photon’s Energy</title>
<style>
html, body { background: transparent; }*{box-sizing:border-box}body{margin:0;padding:10px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#16324b}.em{max-width:980px;margin:auto;padding:25px;background:#fcfcf9;border:5px solid #285f9f;border-radius:22px}.em h1{font-size:clamp(24px,5vw,34px);letter-spacing:-1px;text-align:center;margin:0 0 13px}.key{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;font-size:14px}.key strong{background:#174e3d;color:#fff;border-radius:30px;padding:8px 18px;font-size:17px}.key span{color:#465e6e}.rows{display:grid;gap:8px}.band{display:grid;grid-template-columns:145px minmax(140px,1fr) 200px;align-items:center;gap:14px;padding:10px 16px;border:1px solid #dce4e8;border-left:5px solid var(--ink);border-radius:12px;background:linear-gradient(110deg,var(--wash),#fff 78%);min-height:94px}.identity{display:flex;align-items:center;gap:10px}.photon{flex:0 0 17px;width:17px;height:17px;border:2px solid var(--ink);border-radius:50%;background:radial-gradient(circle at 35% 30%,white 5%,var(--ink) 90%);box-shadow:0 0 0 5px var(--wash)}.name{display:block;font-size:16px;font-weight:750}.lambda{font-size:12px;color:#4a6072}.art{height:74px;width:100%;display:block}.value{text-align:right}.cash{font-size:clamp(20px,3vw,27px);font-weight:800;letter-spacing:-.7px;color:#174e3d;white-space:nowrap}.caption{font-size:12px;color:#405868;margin-top:3px}.ratio{font-size:11px;color:#285f9f;margin-top:5px;font-weight:700}.bottom{margin-top:18px;padding-top:14px;border-top:1px solid #d5dfe4;display:flex;align-items:center;justify-content:space-between;gap:12px}.bottom strong{font-size:14px;line-height:1.5}.formula{white-space:nowrap;font-size:19px;color:#285f9f;font-weight:700}.note{text-align:center;font-size:11px;line-height:1.5;color:#526575;margin:12px 0 0}
@media(max-width:620px){body{padding:4px}.em{padding:16px 10px;border-radius:16px}.band{grid-template-columns:minmax(90px,1fr) minmax(125px,1fr);gap:5px;padding:10px;min-height:110px}.art{grid-row:2;grid-column:1/3;height:56px}.value{grid-row:1;grid-column:2}.cash{font-size:20px}.name{font-size:14px}.identity{gap:8px}.photon{flex-basis:13px;width:13px;height:13px}.caption{font-size:10px}.ratio{font-size:10px}.bottom{display:block;text-align:center}.formula{display:block;margin-top:8px}.key{gap:7px;margin-bottom:14px}.key span{font-size:12px}}

.calculation{background:#edf3fa;border:1px solid #d2deec;border-radius:12px;padding:14px 18px;margin:0 0 17px;text-align:center}.calculation .equation{font-size:21px;font-weight:750;color:#285f9f}.calculation p{margin:5px 0;font-size:13px;line-height:1.6}.wavebox{min-width:0}.wave{width:100%;height:150px;display:block}.wave-label{text-align:center;font-size:12px;color:#405868}.wave-ratio{text-align:center;color:#285f9f;font-size:11px;font-weight:650;margin-top:4px}.moneybox{min-width:0}.moneybox .art{height:56px}.moneybox .value{text-align:center}.band{grid-template-columns:135px minmax(140px,1fr) 230px;min-height:150px}.column-head{display:grid;grid-template-columns:135px minmax(140px,1fr) 230px;gap:14px;padding:0 16px 8px 21px;color:#526575;font-size:11px;font-weight:750;text-align:center}.column-head span:first-child{text-align:left}.moneybox .ratio{font-size:10px}.cash{font-size:24px}
@media(max-width:620px){.column-head{display:none}.band{grid-template-columns:1fr;gap:8px;padding:14px}.identity{justify-content:center}.wavebox{grid-row:2}.moneybox{grid-row:3;border-top:1px solid #dce4e8;padding-top:7px}.moneybox .art{height:58px}.moneybox .value{grid-row:auto;grid-column:auto}.cash{font-size:24px}.wave{height:150px}.calculation{padding:10px}.calculation .equation{font-size:19px}.calculation p{font-size:12px}}
.gamma-size{height:245px}@media(max-width:620px){.gamma-size{height:245px}}
</style></head><body><main class="em">
<h1>One Photon’s Energy</h1>
<div class="calculation"><div class="equation">c = fλ &nbsp; → &nbsp; f = c/λ</div><div class="equation" style="margin-top:8px">E = hf = hc/λ</div><p style="margin-top:10px"><strong>Shorter wavelength → Higher frequency → More energy in each photon</strong></p></div>
<div class="key"><strong>If 1 eV were $1</strong><span>Each row represents ONE photon.</span></div>
<div class="column-head"><span>ONE PHOTON</span><span>WAVELENGTH &amp; FREQUENCY</span><span>ENERGY AS MONEY</span></div>
<div id="bands" class="rows" aria-label="Photon energies increasing from radio to gamma rays"></div>


<script>
(()=>{
const h=6.62607015e-34,c=299792458,e=1.602176634e-19;
const bands=[['Radio',100,'100 m','#475d91','#f0f3fa','About 1/800,000 of a penny'],['Microwave',.01,'1 cm','#426e8a','#edf5f8','About 1/80 of a penny'],['Infrared',1e-5,'10 μm','#a34432','#fcf0ec','About 12 cents'],['Visible green',500e-9,'500 nm','#16704e','#edf8f1','About two and a half dollars'],['Ultraviolet',100e-9,'100 nm','#7351a5','#f4f0fa','About twelve dollars'],['X-ray',1e-10,'0.1 nm','#385da9','#eef2fc','About twelve thousand dollars'],['Gamma ray',1e-12,'0.001 nm','#80447f','#f8eff7','About 1.24 million dollars']];
function bill(x,y,amount,scale=1){return `<g transform="translate(${x} ${y}) scale(${scale})"><rect x="2" y="4" width="96" height="43" rx="4" fill="#143d2c" opacity=".13"/><rect width="96" height="43" rx="4" fill="#c7dfbf" stroke="#346846" stroke-width="1.5"/><rect x="5" y="5" width="86" height="33" rx="3" fill="none" stroke="#719a6c"/><ellipse cx="48" cy="21.5" rx="18" ry="14" fill="#e4efdb" stroke="#719a6c"/><text x="48" y="27" text-anchor="middle" font-size="14" font-weight="800" fill="#234b31">${amount}</text><path d="M10 12h12m-12 4h8m52 12h12m-8 4h8" stroke="#719a6c"/></g>`;}
function coin(x,y,r,label){return `<g><ellipse cx="${x}" cy="${y+3}" rx="${r}" ry="${r}" fill="#8e5f36"/><circle cx="${x}" cy="${y}" r="${r}" fill="#e3ba7c" stroke="#946837" stroke-width="2"/><circle cx="${x}" cy="${y}" r="${r-4}" fill="none" stroke="#ac7c43"/><text x="${x}" y="${y+4}" text-anchor="middle" fill="#704921" font-size="12" font-weight="750">${label}</text></g>`;}
function art(i){if(i<2)return `<circle cx="107" cy="36" r="25" fill="none" stroke="#adbbc4" stroke-width="2" stroke-dasharray="3 3"/><text x="107" y="40" text-anchor="middle" fill="#607684" font-size="14">1¢</text><path d="M143 36h28" stroke="#859ba8"/><circle cx="186" cy="36" r="${i?3.5:1.5}" fill="#9a6b36"/><text x="228" y="41" text-anchor="middle" font-size="12" fill="#566b7a">tiny fraction</text>`;
if(i===2)return coin(118,36,22,'10¢')+coin(165,40,16,'1¢')+coin(200,40,16,'1¢');
if(i===3)return bill(65,19,'$1')+bill(110,10,'$1')+coin(239,37,21,'48¢');
if(i===4)return bill(45,19,'$10')+bill(115,10,'$1')+bill(160,21,'$1')+coin(282,38,18,'40¢');
let drawing='';const count=i===5?3:12;for(let n=0;n<count;n++){const col=n%4,row=Math.floor(n/4);const x=45+col*67,y=45-row*14;drawing+=bill(x,y,'$100',.68);drawing+=`<path d="M${x+28} ${y}v29" stroke="#f3dfaf" stroke-width="10"/>`;}
return drawing;}
function frequency(value){const power=Math.floor(Math.log10(value));return (value/10**power).toFixed(2)+' × 10<sup>'+power+'</sup> Hz';}
function wave(i,ink){
const labels=['Football field ≈ 100 m','Blueberry ≈ 1 cm','Cell ≈ 10 μm','Small bacterium width ≈ 500 nm','Virus ≈ 100 nm','Helium atom ≈ 0.1 nm','Helium nucleus · enlarged'];
let drawing='';
if(i===0){drawing='<rect x="30" y="22" width="220" height="92" rx="4" fill="#34704c" stroke="#244a35" stroke-width="2"/><rect x="42" y="28" width="196" height="80" fill="none" stroke="white"/><path d="M54 28v80M76 28v80M98 28v80M120 28v80M142 28v80M164 28v80M186 28v80M208 28v80M230 28v80" stroke="#d5e8d7"/>';for(let x=62;x<228;x+=11)drawing+=`<path d="M${x} 49v6m0 26v6" stroke="white"/>`;}
if(i===1)drawing='<circle cx="140" cy="68" r="43" fill="#4e608e" stroke="#303f68" stroke-width="3"/><ellipse cx="127" cy="52" rx="24" ry="19" fill="#899bc5" opacity=".6"/><path d="M140 40l7 9 12-1-5 10 6 10-13-2-8 9-3-12-12-4 10-6z" fill="#293956"/><path d="M110 76q3 20 22 24" fill="none" stroke="#7687ae" stroke-width="3"/>';
if(i===2)drawing='<ellipse cx="140" cy="68" rx="66" ry="43" fill="#f2d8b9" stroke="#ac7855" stroke-width="3"/><ellipse cx="140" cy="68" rx="60" ry="37" fill="none" stroke="#d8a889"/><ellipse cx="146" cy="65" rx="23" ry="20" fill="#a88bbc" stroke="#76558b" stroke-width="2"/><circle cx="150" cy="64" r="7" fill="#76558b"/><path d="M98 51q12-10 20 0t-20 0M171 87q12-10 20 0t-20 0M101 84q10-10 17 0t-17 0" fill="#d19075" stroke="#a46c58"/>';
if(i===3)drawing='<rect x="72" y="40" width="136" height="57" rx="28" fill="#a5cec0" stroke="#3a7964" stroke-width="3"/><rect x="78" y="46" width="124" height="45" rx="23" fill="none" stroke="#68a68c"/><path d="M99 63q12-17 22 5t20 0 22 0 20-3" fill="none" stroke="#477767" stroke-width="3"/><path d="M208 68q20-25 35 0t30-2" fill="none" stroke="#3a7964" stroke-width="2"/>';
if(i===4){drawing='<circle cx="140" cy="68" r="32" fill="#c3b0db" stroke="#76558e" stroke-width="2"/><path d="M123 61q15-20 25 3t-18 13 12-20" fill="none" stroke="#76558e" stroke-width="3"/>';for(let n=0;n<12;n++){const t=n*Math.PI/6;drawing+=`<path d="M${140+33*Math.cos(t)} ${68+33*Math.sin(t)}L${140+45*Math.cos(t)} ${68+45*Math.sin(t)}" stroke="#76558e" stroke-width="3"/><circle cx="${140+46*Math.cos(t)}" cy="${68+46*Math.sin(t)}" r="4" fill="#9474b2"/>`;}}
function nucleon(x,y,r,kind){const color=kind==='p'?'#e95269':'#416fd5',light=kind==='p'?'#ffb1b9':'#a3c9ff';return `<circle cx="${x+1}" cy="${y+2}" r="${r}" fill="#182d53" opacity=".16"/><circle cx="${x}" cy="${y}" r="${r}" fill="${color}" stroke="white" stroke-width="1.4"/><ellipse cx="${x-r*.25}" cy="${y-r*.35}" rx="${r*.45}" ry="${r*.26}" fill="${light}" opacity=".8"/><text x="${x}" y="${y+r*.34}" text-anchor="middle" fill="white" font-size="${r}" font-weight="800">${kind==='p'?'+':'n'}</text>`;}
if(i===5){drawing='<ellipse cx="140" cy="66" rx="62" ry="47" fill="#ebe4fa"/><ellipse cx="140" cy="66" rx="49" ry="37" fill="#d9c8f2" opacity=".65"/><ellipse cx="140" cy="66" rx="61" ry="28" transform="rotate(-27 140 66)" fill="none" stroke="#9c78c7" stroke-width="1.5" stroke-dasharray="3 4"/>';
drawing+=nucleon(132,58,10,'p')+nucleon(147,58,10,'n')+nucleon(132,73,10,'n')+nucleon(147,73,10,'p');
for(const [x,y] of [[88,91],[192,41]])drawing+=`<circle cx="${x}" cy="${y}" r="9" fill="#f1b82b" stroke="#805c0d" stroke-width="1.2"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="17" font-weight="800" fill="#533a00">−</text>`;
drawing+='<text x="140" y="11" text-anchor="middle" fill="#65508a" font-size="11">2 electrons · schematic cloud</text>';}
if(i===6){return `<svg class="wave size-reference gamma-size" viewBox="0 0 280 245" role="img" aria-label="An atom is about 100,000 femtometres across, this gamma wavelength is 1,000 femtometres, and a helium nucleus is about 3 femtometres. The lower comparison is magnified 200 times.">
<circle cx="140" cy="63" r="45" fill="#e6ddf5" stroke="#9271b7" stroke-width="1.5"/><circle cx="140" cy="63" r="31" fill="#d1bee9" opacity=".55"/><circle cx="140" cy="63" r="16" fill="#b79bd6" opacity=".35"/>
<path d="M95 111v6h90v-6" fill="none" stroke="#76558e" stroke-width="1.5"/>
<text x="140" y="13" text-anchor="middle" font-size="12" font-weight="700" fill="#60477e">Atom ≈ 100,000 fm across</text>
<path d="M139.55 63h.9" stroke="#c3457c" stroke-width="3"/><path d="M142 64l66 22" stroke="#c3457c" fill="none"/><text x="210" y="99" text-anchor="middle" font-size="11" fill="#8c2854">Gamma λ</text>
<path d="M139.55 65L50 157M140.45 65L230 157" stroke="#abb9c6" stroke-dasharray="3 4" fill="none"/>
<rect x="35" y="137" width="210" height="91" rx="8" fill="#f8f4fb" stroke="#cbb9df"/>
<text x="140" y="153" text-anchor="middle" font-size="11" fill="#60477e">Magnified 200×</text>
<path d="M50 167v10h180v-10" fill="none" stroke="#c3457c" stroke-width="2"/>
<text x="140" y="194" text-anchor="middle" font-size="12" font-weight="700" fill="#8c2854">Gamma wavelength = 1,000 fm</text>
<circle cx="50" cy="210" r=".27" fill="#285f9f"/><path d="M54 210h18" stroke="#285f9f" stroke-width=".7"/>
<text x="78" y="214" font-size="11" fill="#285f9f">Nucleus ≈ 3 fm (tiny dot)</text>
<text x="140" y="242" text-anchor="middle" font-size="11" font-weight="700" fill="#304e63">Atom &gt; gamma wavelength &gt; nucleus</text>
</svg>`;}

let measure=i===3?'<path d="M64 40h-7v57h7" stroke="#285f9f" fill="none" stroke-width="2"/><text x="48" y="70" text-anchor="end" font-size="13" fill="#285f9f">λ</text>':`<path d="M${i===0?30:i===2?74:i>=5?97:i===4?94:97} 124v7H${i===0?250:i===2?206:i>=5?183:i===4?186:183}v-7" fill="none" stroke="#285f9f" stroke-width="2"/>`;
if(i===6)measure='<text x="140" y="137" text-anchor="middle" font-size="11" fill="#405868">Nucleus: a few fm across</text><text x="140" y="151" text-anchor="middle" font-size="11" fill="#285f9f">This photon’s λ = 1,000 fm</text>';

return `<svg class="wave size-reference" viewBox="0 0 280 170" role="img" aria-label="${labels[i]}. Each illustration is enlarged independently.">${drawing}${measure}<text x="140" y="${i===6?164:156}" text-anchor="middle" fill="#304e63" font-size="13" font-weight="650">${labels[i]}</text></svg>`;
}
function money(E){return '$'+Number(E.toPrecision(3)).toLocaleString('en-US',{maximumFractionDigits:12});}
document.getElementById('bands').innerHTML=bands.map(([name,lambda,label,ink,wash,caption],i)=>{const E=h*c/lambda/e,ratio=i?bands[i-1][1]/lambda:1;return `<div class="band" style="--ink:${ink};--wash:${wash}"><div class="identity"><span class="photon" aria-hidden="true"></span><div><span class="name">${name}</span><span class="lambda">λ = ${label}</span></div></div><div class="wavebox">${wave(i,ink)}<div class="wave-label">f = ${frequency(c/lambda)}</div></div><div class="moneybox"><svg class="art" viewBox="0 0 340 78" aria-hidden="true">${art(i)}</svg><div class="value"><div class="cash">${money(E)}</div><div class="caption">${caption}</div></div></div></div>`;}).join('');
let completed=false;requestAnimationFrame(()=>{if(!completed){completed=true;window.parent.postMessage({ type: 'complete' }, '*');}});
})();
</script></main></body></html>
