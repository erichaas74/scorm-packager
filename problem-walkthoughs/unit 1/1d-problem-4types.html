<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1D Kinematics Diagram Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- gifshot is used to convert the canvas frames into an animated GIF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>
  <style>
    /* Pulsating keyframes for the acceleration arrow */
    @keyframes accelPulse {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body class="flex h-screen w-full bg-slate-50 font-sans text-slate-800 overflow-hidden">

  <!-- Control Panel (Left Sidebar) -->
  <div class="w-96 bg-white border-r border-slate-200 shadow-sm flex flex-col z-10 overflow-hidden shrink-0">
    <div class="p-6 border-b border-slate-100 bg-slate-50 flex items-center gap-3">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-600"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="7" r="3"/><circle cx="7" cy="17" r="3"/></svg>
      <h1 class="text-xl font-bold text-slate-800">1D Kinematics</h1>
    </div>

    <div class="p-6 overflow-y-auto flex-1">
      <!-- Animation Toggle -->
      <div class="mb-8">
        <label class="block text-sm font-semibold text-slate-500 uppercase tracking-wider mb-3">Animation</label>
        <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-lg">
          <button data-action="isAnimated" data-val="false" class="flex items-center justify-center gap-2 py-2 text-sm font-medium rounded-md transition-all">Static</button>
          <button data-action="isAnimated" data-val="true" class="flex items-center justify-center gap-2 py-2 text-sm font-medium rounded-md transition-all">Animated</button>
        </div>
      </div>

      <!-- Motion Type Selection -->
      <div class="mb-8">
        <label class="block text-sm font-semibold text-slate-500 uppercase tracking-wider mb-3">Motion Type</label>
        <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-lg">
          <button data-action="motionType" data-val="horizontal" class="flex items-center justify-center gap-2 py-2 text-sm font-medium rounded-md transition-all">Horizontal</button>
          <button data-action="motionType" data-val="vertical-up" class="flex items-center justify-center gap-2 py-2 text-sm font-medium rounded-md transition-all">Toss Up</button>
          <button data-action="motionType" data-val="vertical-drop" class="flex items-center justify-center gap-2 py-2 text-sm font-medium rounded-md transition-all">Drop</button>
          <button data-action="motionType" data-val="vertical-toss" class="flex items-center justify-center gap-2 py-2 text-sm font-medium rounded-md transition-all">Up & Down</button>
        </div>
      </div>

      <!-- Object Type Selection -->
      <div class="mb-8">
        <label class="block text-sm font-semibold text-slate-500 uppercase tracking-wider mb-3">Object Type</label>
        <div class="grid grid-cols-4 gap-2 bg-slate-100 p-1 rounded-lg">
          <button data-action="objectType" data-val="block" class="flex items-center justify-center gap-2 py-2 text-sm font-medium rounded-md transition-all capitalize">block</button>
          <button data-action="objectType" data-val="ball" class="flex items-center justify-center gap-2 py-2 text-sm font-medium rounded-md transition-all capitalize">ball</button>
          <button data-action="objectType" data-val="car" class="flex items-center justify-center gap-2 py-2 text-sm font-medium rounded-md transition-all capitalize">car</button>
          <button data-action="objectType" data-val="person" class="flex items-center justify-center gap-2 py-2 text-sm font-medium rounded-md transition-all capitalize">person</button>
        </div>
      </div>

      <!-- Ruler Style Toggle -->
      <div class="mb-8">
        <label class="block text-sm font-semibold text-slate-500 uppercase tracking-wider mb-3">Ruler Style</label>
        <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-lg">
          <button data-action="rulerStyle" data-val="simple" class="flex items-center justify-center gap-2 py-2 text-sm font-medium rounded-md transition-all">Simple</button>
          <button data-action="rulerStyle" data-val="detailed" class="flex items-center justify-center gap-2 py-2 text-sm font-medium rounded-md transition-all">Detailed</button>
        </div>
      </div>

      <!-- Top-Left Variables List Toggle -->
      <div class="mb-8">
        <label class="block text-sm font-semibold text-slate-500 uppercase tracking-wider mb-3">Variables List (Top Left)</label>
        <div class="grid grid-cols-3 gap-2 bg-slate-100 p-1 rounded-lg">
          <button data-action="listDisplay" data-val="hidden" class="flex items-center justify-center gap-2 py-2 text-sm font-medium rounded-md transition-all">Hidden</button>
          <button data-action="listDisplay" data-val="symbols" class="flex items-center justify-center gap-2 py-2 text-sm font-medium rounded-md transition-all">Symbols</button>
          <button data-action="listDisplay" data-val="values" class="flex items-center justify-center gap-2 py-2 text-sm font-medium rounded-md transition-all">Values</button>
        </div>
      </div>

      <!-- Top-Right Equations Toggle -->
      <div class="mb-8">
        <label class="block text-sm font-semibold text-slate-500 uppercase tracking-wider mb-3">Equations (Top Right)</label>
        <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-lg mb-2">
          <button data-action="equationsDisplay" data-val="hidden" class="flex items-center justify-center gap-2 py-2 text-sm font-medium rounded-md transition-all">Hidden</button>
          <button data-action="equationsDisplay" data-val="visible" class="flex items-center justify-center gap-2 py-2 text-sm font-medium rounded-md transition-all">Visible</button>
        </div>
        <!-- Highlight Equations Sub-controls -->
        <div id="eq-highlight-controls" class="grid grid-cols-5 gap-1 bg-slate-100 p-1 rounded-lg hidden">
          <button data-action="eqHighlight" data-val="0" class="flex items-center justify-center py-1 text-xs font-medium rounded-md transition-all">None</button>
          <button data-action="eqHighlight" data-val="1" class="flex items-center justify-center py-1 text-xs font-medium rounded-md transition-all">Eq 1</button>
          <button data-action="eqHighlight" data-val="2" class="flex items-center justify-center py-1 text-xs font-medium rounded-md transition-all">Eq 2</button>
          <button data-action="eqHighlight" data-val="3" class="flex items-center justify-center py-1 text-xs font-medium rounded-md transition-all">Eq 3</button>
          <button data-action="eqHighlight" data-val="4" class="flex items-center justify-center py-1 text-xs font-medium rounded-md transition-all">Eq 4</button>
        </div>
      </div>

      <!-- Export Actions -->
      <div class="mb-8">
        <label class="block text-sm font-semibold text-slate-500 uppercase tracking-wider mb-3">Export Diagram</label>
        <div class="grid grid-cols-3 gap-2 bg-slate-100 p-1 rounded-lg">
          <button data-action="export" data-val="svg" class="flex items-center justify-center gap-2 py-2 text-sm font-medium rounded-md transition-all text-slate-500 hover:text-blue-600 hover:bg-white hover:shadow-sm">SVG</button>
          <button data-action="export" data-val="png" class="flex items-center justify-center gap-2 py-2 text-sm font-medium rounded-md transition-all text-slate-500 hover:text-blue-600 hover:bg-white hover:shadow-sm">PNG</button>
          <button data-action="export" data-val="gif" class="flex items-center justify-center gap-2 py-2 text-sm font-medium rounded-md transition-all text-slate-500 hover:text-blue-600 hover:bg-white hover:shadow-sm">GIF</button>
        </div>
        <div id="export-status" class="mt-2 text-xs font-semibold text-center text-blue-600 hidden">Generating... this may take a moment.</div>
      </div>

      <!-- Variables List -->
      <div id="variables-container" class="space-y-4 pb-12"></div>
    </div>
  </div>

  <!-- Canvas Area -->
  <div class="flex-1 flex items-center justify-center p-8 bg-slate-200/50 h-full overflow-hidden">
    <div class="w-full max-w-5xl aspect-[4/3] bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden relative" id="svg-container"></div>
  </div>

  <script>
    const eyeIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`;
    const eyeOffIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>`;

    let state = {
      motionType: 'horizontal',
      objectType: 'ball',
      isAnimated: false,
      rulerStyle: 'detailed',
      listDisplay: 'hidden',
      equationsDisplay: 'hidden',
      eqHighlight: '0',
      vars: {
        displacement: { show: true, val: '100', unit: 'm', unknown: false, label: 'Displacement' },
        v0: { show: true, val: '20', unit: 'm/s', unknown: false, label: 'Initial Velocity' },
        v: { show: true, val: '', unit: 'm/s', unknown: true, label: 'Final Velocity' },
        a: { show: true, val: '-9.8', unit: 'm/s²', unknown: false, label: 'Acceleration' },
        t: { show: false, val: '5', unit: 's', unknown: false, label: 'Total Time' },
        t_up: { show: true, val: '2.5', unit: 's', unknown: false, label: 'Time Up' },
        t_down: { show: true, val: '2.5', unit: 's', unknown: false, label: 'Time Down' }
      }
    };

    function updateState(key, value) {
      state[key] = value;
      updateButtonsUI();
      updateVarsUI();
      drawSVG();
    }

    function updateVar(key, field, value) {
      state.vars[key][field] = value;
      updateVarsUI();
      drawSVG();
    }

    function init() {
      buildVariablesUI();
      setupButtonListeners();
      updateButtonsUI();
      updateVarsUI();
      drawSVG();
    }

    function setupButtonListeners() {
      document.querySelectorAll('button[data-action]').forEach(btn => {
        btn.addEventListener('click', () => {
          if (btn.dataset.action === 'export') {
            if (btn.dataset.val === 'svg') exportSVG();
            if (btn.dataset.val === 'png') exportPNG();
            if (btn.dataset.val === 'gif') exportGIF();
            return;
          }

          let val = btn.dataset.val;
          if (val === 'true') val = true;
          else if (val === 'false') val = false;
          updateState(btn.dataset.action, val);
        });
      });
    }

    function updateButtonsUI() {
      const eqHighlightControls = document.getElementById('eq-highlight-controls');
      if (eqHighlightControls) {
        if (state.equationsDisplay === 'visible') {
          eqHighlightControls.classList.remove('hidden');
        } else {
          eqHighlightControls.classList.add('hidden');
        }
      }

      document.querySelectorAll('button[data-action]').forEach(btn => {
        if (btn.dataset.action === 'export') return; 
        
        let val = btn.dataset.val;
        if (val === 'true') val = true;
        else if (val === 'false') val = false;
        
        const key = btn.dataset.action;
        const isActive = String(state[key]) === String(val);
        btn.className = `flex items-center justify-center gap-2 py-2 text-sm font-medium rounded-md transition-all capitalize ${isActive ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500 hover:text-slate-700'}`;
      });
    }

    function buildVariablesUI() {
      const container = document.getElementById('variables-container');
      container.innerHTML = '';
      Object.keys(state.vars).forEach(key => {
        const div = document.createElement('div');
        div.id = `var-card-${key}`;
        div.innerHTML = `
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
              <button id="show-${key}" class="p-1 rounded-md hover:bg-slate-100"></button>
              <span id="label-${key}" class="font-semibold text-sm"></span>
            </div>
            <label class="flex items-center gap-2 text-xs cursor-pointer text-slate-500">
              <input type="checkbox" id="unk-${key}" class="rounded border-slate-300" /> Unknown (?)
            </label>
          </div>
          <div id="inputs-${key}" class="flex gap-2">
            <input type="text" id="val-${key}" class="flex-1 px-3 py-1.5 border border-slate-200 rounded-lg text-sm disabled:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            <input type="text" id="unit-${key}" class="w-16 px-3 py-1.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
        `;
        container.appendChild(div);
        
        document.getElementById(`show-${key}`).onclick = () => updateVar(key, 'show', !state.vars[key].show);
        document.getElementById(`unk-${key}`).onchange = (e) => updateVar(key, 'unknown', e.target.checked);
        document.getElementById(`val-${key}`).oninput = (e) => updateVar(key, 'val', e.target.value);
        document.getElementById(`unit-${key}`).oninput = (e) => updateVar(key, 'unit', e.target.value);
      });
    }

    function updateVarsUI() {
      state.vars.displacement.label = state.motionType === 'vertical-toss' ? 'Max Height' : 'Displacement';
      Object.keys(state.vars).forEach(key => {
        const data = state.vars[key];
        const card = document.getElementById(`var-card-${key}`);
        
        // Hide specific vars if not in vertical-toss mode
        if ((key === 't_up' || key === 't_down') && state.motionType !== 'vertical-toss') {
            card.style.display = 'none';
            return;
        }
        
        card.style.display = 'block';

        card.className = `border rounded-xl p-4 transition-colors ${data.show ? 'bg-white border-blue-200 shadow-sm' : 'bg-slate-50 border-slate-200'}`;
        document.getElementById(`show-${key}`).innerHTML = data.show ? eyeIcon : eyeOffIcon;
        document.getElementById(`label-${key}`).textContent = data.label;
        document.getElementById(`unk-${key}`).checked = data.unknown;
        document.getElementById(`inputs-${key}`).style.display = data.show ? 'flex' : 'none';
        
        const valEl = document.getElementById(`val-${key}`);
        if (valEl.value !== data.val) valEl.value = data.val;
        valEl.disabled = data.unknown;
        
        const unitEl = document.getElementById(`unit-${key}`);
        if (unitEl.value !== data.unit) unitEl.value = data.unit;
      });
    }

    function getLabelText(data) { 
      return data.unknown ? "?" : `${data.val} ${data.unit}`; 
    }
    
    function isNegative(val) { 
      return String(val).replace(/\s/g,'').startsWith('-'); 
    }
    
    function formatVarName(key) {
      if (key === 'displacement') {
        if (state.motionType === 'vertical-toss') {
          return `<tspan font-style="italic">h</tspan><tspan font-size="0.7em" baseline-shift="sub">max</tspan>`;
        }
        return `<tspan>Δ</tspan><tspan font-style="italic">${state.motionType==='horizontal'?'x':'y'}</tspan>`;
      }
      if (key === 'v0') return `<tspan font-style="italic">v</tspan><tspan font-size="0.7em" baseline-shift="sub">0</tspan>`;
      if (key === 't_up') return `<tspan font-style="italic">t</tspan><tspan font-size="0.7em" baseline-shift="sub">up</tspan>`;
      if (key === 't_down') return `<tspan font-style="italic">t</tspan><tspan font-size="0.7em" baseline-shift="sub">down</tspan>`;
      return `<tspan font-style="italic">${key}</tspan>`;
    }

    function RenderObject(x, y, type, opacity) {
      const color = "#64748b", stroke = "#334155";
      if (type === 'ball') {
        const tbColor = "#ccff00"; 
        const tbStroke = "#8da600";
        return `<g transform="translate(${x},${y})" opacity="${opacity}">
          <circle r="20" fill="${tbColor}" stroke="${tbStroke}" stroke-width="2"/>
          <path d="M-12-16 A16 16 0 0 1 -12 16 M12-16 A16 16 0 0 0 12 16" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.9"/>
          <path d="M-8-12A12 12 0 0 1 8-12A14 14 0 0 0-8-12Z" fill="#fff" opacity="0.3"/>
        </g>`;
      }
      if (type === 'car') {
        return `<g transform="translate(${x},${y})" opacity="${opacity}">
          <path d="M -26 0 L -18 -12 L 10 -12 L 20 0 L 30 0 A 4 4 0 0 1 34 4 L 34 10 A 2 2 0 0 1 32 12 L -30 12 A 2 2 0 0 1 -32 10 L -32 4 A 4 4 0 0 1 -26 0 Z" fill="${color}" stroke="${stroke}" stroke-width="2" stroke-linejoin="round" />
          <path d="M -16 -2 L -13 -10 L -2 -10 L -2 -2 Z" fill="#e2e8f0" stroke="${stroke}" stroke-width="1" stroke-linejoin="round" />
          <path d="M 0 -2 L 0 -10 L 8 -10 L 16 -2 Z" fill="#e2e8f0" stroke="${stroke}" stroke-width="1" stroke-linejoin="round" />
          <rect x="30" y="2" width="4" height="5" rx="1" fill="#fbbf24" stroke="${stroke}" stroke-width="1" />
          <rect x="-32" y="2" width="3" height="6" rx="1" fill="#ef4444" stroke="${stroke}" stroke-width="1" />
          <circle cx="-16" cy="12" r="7" fill="#1e293b" stroke="${stroke}" stroke-width="1" />
          <circle cx="-16" cy="12" r="3" fill="#cbd5e1" />
          <circle cx="18" cy="12" r="7" fill="#1e293b" stroke="${stroke}" stroke-width="1" />
          <circle cx="18" cy="12" r="3" fill="#cbd5e1" />
        </g>`;
      }
      if (type === 'person') {
        return `<g transform="translate(${x},${y-5})" opacity="${opacity}">
          <circle cy="-18" r="7" fill="${color}" stroke="${stroke}" stroke-width="2"/>
          <rect x="-5" y="-10" width="10" height="18" rx="4" fill="${color}" stroke="${stroke}" stroke-width="2"/>
          <path d="M-2 7L-6 24M2 7L6 24" stroke="${color}" stroke-width="5" stroke-linecap="round"/>
        </g>`;
      }
      return `<g transform="translate(${x-20},${y-20})" opacity="${opacity}">
        <rect width="40" height="40" rx="3" fill="${color}" stroke="${stroke}" stroke-width="2"/>
        <line x1="4" y1="4" x2="36" y2="36" stroke="#fff" stroke-width="2" opacity="0.3"/>
        <line x1="36" y1="4" x2="4" y2="36" stroke="#fff" stroke-width="2" opacity="0.3"/>
      </g>`;
    }

    function VectorArrow(startX, startY, isVertical, isNeg, color, varKey, data, motionType) {
      const len = 70;
      let sign = isNeg ? -1 : 1;
      
      if (isVertical && (motionType === 'vertical-drop' || motionType === 'vertical-toss') && varKey === 'v') {
        sign = -1;
      }
      
      const endX = isVertical ? startX : startX + len * sign;
      const endY = isVertical ? startY - len * sign : startY;
      const midX = (startX + endX) / 2;
      const midY = (startY + endY) / 2;
      
      let tx = midX;
      let ty = isVertical ? midY : midY - 20;
      if (isVertical) tx = startX < 400 ? midX - 65 : midX + 65;

      return `
        <g>
          <line x1="${startX}" y1="${startY}" x2="${endX}" y2="${endY}" stroke="${color}" stroke-width="3" marker-end="url(#head-${color.replace('#','')})"/>
          <text x="${tx}" y="${ty}" fill="${color}" font-size="18" font-weight="bold" text-anchor="middle" dominant-baseline="middle" font-family="serif">
            ${formatVarName(varKey)} = ${getLabelText(data)}
          </text>
        </g>`;
    }

    function AccelArrow(startX, startY, isVertical, isNeg, color, varKey, data, isAnimated, timeParam) {
      const len = 70, sign = isNeg ? -1 : 1;
      const endX = isVertical ? startX : startX + len * sign;
      const endY = isVertical ? startY - len * sign : startY;
      const midX = (startX+endX)/2, midY = (startY+endY)/2;
      
      const tx = isVertical ? (startX < 400 ? midX - 80 : midX + 80) : midX;
      const ty = isVertical ? midY : midY - 25;
      
      const t_sec = timeParam !== undefined ? timeParam * 2.5 : 0;
      
      // Calculate exact direction angle and unit vector for perfectly aligned chevrons
      const dx = endX - startX;
      const dy = endY - startY;
      const lenExact = Math.sqrt(dx * dx + dy * dy);
      const ux = dx / lenExact;
      const uy = dy / lenExact;
      const ang = Math.atan2(dy, dx) * (180 / Math.PI);

      const heads = [0, 1].map((i) => {
        // Position chevrons right at the tip, spacing backward
        const offset = 6 + i * 14; 
        const hx = endX - ux * offset;
        const hy = endY - uy * offset;
        
        const delay = i * 0.15;
        let opacityStyle = '';
        
        if (timeParam !== undefined && isAnimated) {
            let phase = ((t_sec - delay) % 1.5 + 1.5) % 1.5 / 1.5;
            let op = 0.2;
            if (phase < 0.5) op = 0.2 + (phase/0.5)*(1 - 0.2);
            else op = 1 - ((phase - 0.5)/0.5)*(1 - 0.2);
            opacityStyle = `opacity: ${op.toFixed(2)}`;
        } else {
            opacityStyle = isAnimated ? `animation:accelPulse 1.5s infinite; animation-delay:${delay}s;` : `opacity: 1;`;
        }

        return `<g transform="translate(${hx},${hy}) rotate(${ang}) scale(1.1)">
          <path d="M-8-8 L6 0 L-8 8 L-3 0 Z" fill="${color}" style="${opacityStyle}"/>
        </g>`;
      }).join('');

      return `
        <g>
          <line x1="${startX}" y1="${startY}" x2="${endX - ux*2}" y2="${endY - uy*2}" stroke="${color}" stroke-width="3" opacity="0.6"/>
          ${heads}
          <text x="${tx}" y="${ty}" fill="${color}" font-size="18" font-weight="bold" text-anchor="middle" dominant-baseline="middle" font-family="serif">
            ${formatVarName(varKey)} = ${getLabelText(data)}
          </text>
        </g>`;
    }

    function RulerGraphic(data, style, motionType, startObj, endObj, peakObj) {
      let x1, y1, x2, y2, tx, ty, rot = 0;
      const isH = motionType === 'horizontal';
      
      if (isH) {
        x1 = startObj.x; 
        x2 = endObj.x; 
        y1 = y2 = startObj.y + 80;
        tx = (x1+x2)/2; 
        ty = y1 + 25;
      } else {
        const top = motionType === 'vertical-toss' ? peakObj.y : Math.min(startObj.y, endObj.y);
        const bot = Math.max(startObj.y, endObj.y);
        x1 = x2 = startObj.x - (motionType === 'vertical-toss' ? 100 : 80);
        y1 = bot; 
        y2 = top;
        tx = x1 - (motionType === 'vertical-toss' ? 65 : 25); 
        ty = (y1+y2)/2;
        rot = motionType === 'vertical-toss' ? 0 : -90;
      }

      if (style === 'detailed' && !data.unknown && parseFloat(data.val) > 0) {
        const maxVal = Math.abs(parseFloat(data.val));
        const len = isH ? Math.abs(x2-x1) : Math.abs(y2-y1);
        let step = 10;
        
        if (maxVal >= 250) step = 100; 
        else if (maxVal >= 100) step = 50; 
        else if (maxVal >= 50) step = 25;
        
        let ticks = '';
        const dir = (isH ? (x2>x1) : (y2>y1)) ? 1 : -1;

        for (let v = 0; v <= maxVal; v += step/5) {
          const isMaj = Math.abs(v % step) < 0.001;
          const p = (v/maxVal)*len;
          const cx = isH ? x1 + dir*p : x1;
          const cy = isH ? y1 : y1 + dir*p;
          
          if (isH) {
            ticks += `<line x1="${cx}" y1="${cy-10}" x2="${cx}" y2="${cy-10+(isMaj?12:6)}" stroke="#ca8a04" stroke-width="${isMaj?2:1}"/>`;
            if (isMaj) ticks += `<text x="${cx}" y="${cy+7}" fill="#a16207" font-size="10" font-weight="bold" text-anchor="middle">${v}</text>`;
          } else {
            ticks += `<line x1="${cx+10-(isMaj?12:6)}" y1="${cy}" x2="${cx+10}" y2="${cy}" stroke="#ca8a04" stroke-width="${isMaj?2:1}"/>`;
            if (isMaj) ticks += `<text x="${cx-2}" y="${cy}" fill="#a16207" font-size="10" font-weight="bold" text-anchor="middle" transform="rotate(-90,${cx-2},${cy})">${v}</text>`;
          }
        }
        return `
          <g>
            <rect x="${isH?Math.min(x1,x2):x1-10}" y="${isH?y1-10:Math.min(y1,y2)}" width="${isH?len:20}" height="${isH?20:len}" fill="#fef08a" stroke="#ca8a04" stroke-width="2" rx="2"/>
            ${ticks}
            <text x="${tx}" y="${ty}" transform="rotate(${rot},${tx},${ty})" fill="#374151" font-size="20" font-weight="bold" text-anchor="middle" dominant-baseline="middle" font-family="serif">
              ${formatVarName('displacement')} = ${getLabelText(data)}
            </text>
          </g>`;
      }
      
      return `
        <g stroke="#4b5563" stroke-width="2">
          <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-dasharray="6 6"/>
          <line x1="${isH?x1:x1-15}" y1="${isH?y1-15:y1}" x2="${isH?x1:x1+15}" y2="${isH?y1+15:y1}"/>
          <line x1="${isH?x2:x2-15}" y1="${isH?y2-15:y2}" x2="${isH?x2:x2+15}" y2="${isH?y2+15:y2}"/>
          <text x="${tx}" y="${ty}" transform="rotate(${rot},${tx},${ty})" fill="#374151" font-size="20" font-weight="bold" text-anchor="middle" dominant-baseline="middle" font-family="serif" stroke="none">
            ${formatVarName('displacement')} = ${getLabelText(data)}
          </text>
        </g>`;
    }

    function StopwatchGraphic(x, y, data, varKey = 't') {
      let labelStr = 't';
      if (varKey === 't_up') labelStr = 't_up';
      if (varKey === 't_down') labelStr = 't_dn';

      const text = data.unknown ? `${labelStr} = ?` : `${labelStr} = ${data.val} ${data.unit}`;
      const charWidth = 8.5; // Approx monospace width per character
      const textWidth = Math.max(80, text.length * charWidth);
      const boxWidth = textWidth + 30;
      const innerWidth = textWidth + 10;
      
      const leftBtnX = -boxWidth / 2 + 10;
      const rightBtnX = boxWidth / 2 - 24;

      return `
        <g transform="translate(${x}, ${y})">
          <rect x="${leftBtnX}" y="-24" width="14" height="10" rx="3" fill="#ef4444" stroke="#000" stroke-width="2" />
          <rect x="${rightBtnX}" y="-24" width="14" height="10" rx="3" fill="#3b82f6" stroke="#000" stroke-width="2" />
          <rect x="${-boxWidth / 2}" y="-20" width="${boxWidth}" height="40" rx="8" fill="#fff" stroke="#000" stroke-width="3" />
          <rect x="${-innerWidth / 2}" y="-12" width="${innerWidth}" height="24" rx="4" fill="#f8fafc" stroke="#000" stroke-width="2"/>
          <text x="0" y="2" fill="#000" font-size="14" font-weight="bold" text-anchor="middle" dominant-baseline="middle" font-family="monospace">${text}</text>
        </g>`;
    }

    function generateSVGString(timeParam) {
      const h = state.motionType === 'horizontal';
      let startObj = { x: 200, y: 300 }, endObj = { x: 600, y: 300 }, peakObj = null;
      
      if (state.motionType === 'vertical-up') { 
        startObj = { x: 400, y: 450 }; endObj = { x: 400, y: 150 }; 
      } else if (state.motionType === 'vertical-drop') { 
        startObj = { x: 400, y: 150 }; endObj = { x: 400, y: 450 }; 
      } else if (state.motionType === 'vertical-toss') { 
        startObj = { x: 350, y: 450 }; peakObj = { x: 400, y: 115 }; endObj = { x: 450, y: 450 }; 
      }

      let svg = `
        <defs>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f1f5f9" stroke-width="1"/>
          </pattern>
          <marker id="head-2563eb" orient="auto" markerWidth="6" markerHeight="8" refX="5" refY="4">
            <path d="M0,0 V8 L6,4 Z" fill="#2563eb"/>
          </marker>
        </defs>
        <rect width="100%" height="100%" fill="#ffffff"/>
        <rect width="100%" height="100%" fill="url(#grid)"/>`;

      if (h) {
        svg += `<line x1="100" y1="320" x2="700" y2="320" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>`;
      } else if (state.motionType === 'vertical-toss') {
        svg += `<line x1="250" y1="470" x2="550" y2="470" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>`;
        svg += `<path d="M350 450C350 0,450 0,450 450" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8"/>`;
      } else {
        svg += `<line x1="425" y1="100" x2="425" y2="500" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="10 10"/>`;
        svg += `<line x1="400" y1="${Math.min(startObj.y, endObj.y)}" x2="400" y2="${Math.max(startObj.y, endObj.y)}" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8"/>`;
      }

      if (state.motionType === 'vertical-toss') {
        svg += RenderObject(peakObj.x, peakObj.y, state.objectType, 0.15);
      }

      if (timeParam !== undefined) {
         let objX, objY;
         if (state.motionType === 'vertical-toss') {
             const u = 1 - timeParam;
             objX = u*u*u*350 + 3*u*u*timeParam*350 + 3*u*timeParam*timeParam*450 + timeParam*timeParam*timeParam*450;
             objY = u*u*u*450 + 3*u*u*timeParam*0 + 3*u*timeParam*timeParam*0 + timeParam*timeParam*timeParam*450;
         } else {
             objX = startObj.x + (endObj.x - startObj.x) * timeParam;
             objY = startObj.y + (endObj.y - startObj.y) * timeParam;
         }
         
         if (state.isAnimated) {
             svg += RenderObject(startObj.x, startObj.y, state.objectType, 0.3);
             svg += RenderObject(endObj.x, endObj.y, state.objectType, 0.3);
         }
         svg += RenderObject(objX, objY, state.objectType, 1);
         
      } else {
         svg += RenderObject(startObj.x, startObj.y, state.objectType, state.isAnimated ? 0.3 : 1);
         svg += RenderObject(endObj.x, endObj.y, state.objectType, 0.3);
         
         if (state.isAnimated) {
             const pathData = state.motionType === 'vertical-toss' ? `M350 450C350 0,450 0,450 450` : `M${startObj.x},${startObj.y} L${endObj.x},${endObj.y}`;
             svg += `<g><animateMotion dur="2.5s" repeatCount="indefinite" path="${pathData}"/>${RenderObject(0, 0, state.objectType, 1)}</g>`;
         }
      }

      if (state.vars.displacement.show) {
        svg += RulerGraphic(state.vars.displacement, state.rulerStyle, state.motionType, startObj, endObj, peakObj);
      }
      
      if (state.vars.v0.show && !(state.motionType==='vertical-drop' && parseFloat(state.vars.v0.val)===0)) {
        svg += VectorArrow(startObj.x, h?startObj.y-50:startObj.y, !h, isNegative(state.vars.v0.val), "#2563eb", "v0", state.vars.v0, state.motionType);
      }
      
      if (state.vars.v.show) {
        svg += VectorArrow(endObj.x, h?endObj.y-50:endObj.y, !h, isNegative(state.vars.v.val), "#2563eb", "v", state.vars.v, state.motionType);
      }
      
      if (state.vars.a.show) {
        const ax = h ? 400 : (state.motionType==='vertical-toss'?550:500);
        const ay = h ? 180 : (state.motionType==='vertical-toss'?250:300);
        svg += AccelArrow(ax, ay, !h, isNegative(state.vars.a.val), "#ea580c", "a", state.vars.a, state.isAnimated, timeParam);
      }
      
      // Core Total Time
      if (state.vars.t.show) {
        svg += StopwatchGraphic(h?endObj.x+100:endObj.x+120, h?endObj.y:endObj.y, state.vars.t, 't');
      }

      // Display custom t_up and t_down for Toss motion
      if (state.motionType === 'vertical-toss') {
        if (state.vars.t_up && state.vars.t_up.show) {
          svg += StopwatchGraphic(210, 250, state.vars.t_up, 't_up');
        }
        if (state.vars.t_down && state.vars.t_down.show) {
          svg += StopwatchGraphic(590, 250, state.vars.t_down, 't_down');
        }
      }

      if (state.listDisplay !== 'hidden') {
        const varKeys = ['displacement', 'v0', 'v', 'a', 't'];
        if (state.motionType === 'vertical-toss') {
          varKeys.push('t_up', 't_down');
        }
        
        const boxWidth = state.listDisplay === 'values' ? 200 : 90;
        let listSvg = `<g transform="translate(30, 40)">`;
        
        listSvg += `<rect x="-10" y="-22" width="${boxWidth}" height="${varKeys.length * 28 + 10}" fill="rgba(255,255,255,0.85)" stroke="#cbd5e1" stroke-width="1" rx="6"/>`;

        varKeys.forEach((key, i) => {
          const data = state.vars[key];
          const sym = formatVarName(key);
          let valText = '';
          if (state.listDisplay === 'values') {
             valText = getLabelText(data);
          }
          listSvg += `<text x="0" y="${i * 28}" fill="#334155" font-size="18" font-family="serif">${sym} = ${valText}</text>`;
        });
        
        listSvg += `</g>`;
        svg += listSvg;
      }

      if (state.equationsDisplay === 'visible') {
        let dispSym;
        if (state.motionType === 'vertical-toss') {
          dispSym = `<tspan font-style="italic">h</tspan><tspan font-size="0.7em" baseline-shift="sub">max</tspan>`;
        } else {
          dispSym = `<tspan>Δ</tspan><tspan font-style="italic">${state.motionType==='horizontal'?'x':'y'}</tspan>`;
        }
        
        const v = `<tspan font-style="italic">v</tspan>`;
        const v0 = `<tspan font-style="italic">v</tspan><tspan font-size="0.7em" baseline-shift="sub">0</tspan>`;
        const a = `<tspan font-style="italic">a</tspan>`;
        const t = `<tspan font-style="italic">t</tspan>`;
        const t2 = `<tspan font-style="italic">t</tspan><tspan font-size="0.7em" baseline-shift="super">2</tspan>`;
        const v2 = `<tspan font-style="italic">v</tspan><tspan font-size="0.7em" baseline-shift="super">2</tspan>`;
        const v02 = `<tspan font-style="italic">v</tspan><tspan font-size="0.7em" baseline-shift="sub">0</tspan><tspan font-size="0.7em" baseline-shift="super">2</tspan>`;

        const eq1 = `${v} = ${v0} + ${a}${t}`;
        const eq2 = `${dispSym} = ${v0}${t} + ½${a}${t2}`;
        const eq3 = `${v2} = ${v02} + 2${a}${dispSym}`;
        const eq4 = `${dispSym} = ½(${v0} + ${v})${t}`;

        const eqs = [eq1, eq2, eq3, eq4];
        
        let eqSvg = `<g transform="translate(600, 40)">`;
        
        eqSvg += `<rect x="-10" y="-22" width="180" height="${eqs.length * 28 + 10}" fill="rgba(255,255,255,0.85)" stroke="#cbd5e1" stroke-width="1" rx="6"/>`;
        
        eqs.forEach((eq, i) => {
          const isHighlighted = String(state.eqHighlight) === String(i + 1);
          
          if (isHighlighted) {
            eqSvg += `<rect x="-5" y="${i * 28 - 18}" width="170" height="24" fill="#fef08a" rx="4"/>`;
          }
          
          const fillCol = isHighlighted ? "#1d4ed8" : "#334155";
          const weight = isHighlighted ? "bold" : "normal";

          eqSvg += `<text x="0" y="${i * 28}" fill="${fillCol}" font-weight="${weight}" font-size="18" font-family="serif" text-anchor="start">${eq}</text>`;
        });
        
        eqSvg += `</g>`;
        svg += eqSvg;
      }

      return svg;
    }

    function drawSVG() {
      document.getElementById('svg-container').innerHTML = `<svg viewBox="0 0 800 600" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">${generateSVGString()}</svg>`;
    }


    // ---------------------------------------------------------
    // EXPORT FUNCTIONALITY (SVG, PNG, GIF)
    // ---------------------------------------------------------

    function svgToCanvas(svgStr) {
      return new Promise(resolve => {
        const img = new Image();
        const svgBlob = new Blob([svgStr], { type: "image/svg+xml;charset=utf-8" });
        const url = URL.createObjectURL(svgBlob);
        
        img.onload = function() {
          const canvas = document.createElement("canvas");
          canvas.width = 800;
          canvas.height = 600;
          const ctx = canvas.getContext("2d");
          
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, 800, 600);
          ctx.drawImage(img, 0, 0);
          
          URL.revokeObjectURL(url);
          resolve(canvas);
        };
        img.src = url;
      });
    }

    function exportSVG() {
      const svgStr = `<svg viewBox="0 0 800 600" width="800" height="600" xmlns="http://www.w3.org/2000/svg">${generateSVGString()}</svg>`;
      const blob = new Blob([svgStr], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "kinematics_diagram.svg";
      a.click();
      URL.revokeObjectURL(url);
    }

    async function exportPNG() {
      const svgStr = `<svg viewBox="0 0 800 600" width="800" height="600" xmlns="http://www.w3.org/2000/svg">${generateSVGString(state.isAnimated ? 1 : undefined)}</svg>`;
      const canvas = await svgToCanvas(svgStr);
      const a = document.createElement('a');
      a.download = 'kinematics_diagram.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    }

    async function exportGIF() {
      if (typeof gifshot === 'undefined') {
        alert("GIF library hasn't finished loading yet, please try again in a moment.");
        return;
      }
      
      const statusEl = document.getElementById('export-status');
      statusEl.classList.remove('hidden');
      statusEl.textContent = 'Generating frames...';

      try {
        const frames = 30;
        const frameImages = [];
        
        if (state.isAnimated) {
          for (let i = 0; i < frames; i++) {
            const t = i / (frames - 1);
            const svgStr = `<svg viewBox="0 0 800 600" width="800" height="600" xmlns="http://www.w3.org/2000/svg">${generateSVGString(t)}</svg>`;
            const canvas = await svgToCanvas(svgStr);
            frameImages.push(canvas.toDataURL('image/png'));
          }
        } else {
          const svgStr = `<svg viewBox="0 0 800 600" width="800" height="600" xmlns="http://www.w3.org/2000/svg">${generateSVGString()}</svg>`;
          const canvas = await svgToCanvas(svgStr);
          const dataUrl = canvas.toDataURL('image/png');
          frameImages.push(dataUrl, dataUrl); 
        }

        statusEl.textContent = 'Encoding GIF...';
        
        gifshot.createGIF({
          images: frameImages,
          gifWidth: 800,
          gifHeight: 600,
          interval: 2.5 / frames,
          numWorkers: 2
        }, function(obj) {
          if (!obj.error) {
            const a = document.createElement("a");
            a.href = obj.image;
            a.download = "kinematics_diagram.gif";
            a.click();
            statusEl.classList.add('hidden');
          } else {
            statusEl.textContent = 'Error generating GIF.';
            setTimeout(() => statusEl.classList.add('hidden'), 3000);
          }
        });
      } catch (err) {
        console.error(err);
        statusEl.textContent = 'Error generating GIF.';
        setTimeout(() => statusEl.classList.add('hidden'), 3000);
      }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
