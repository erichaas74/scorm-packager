<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newton's Space Walk</title>
<style>
        400;600;800&display=swap');
        body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background-color: #050505; color: #e5e7eb; overflow: hidden; margin: 0; }
        canvas { touch-action: none; cursor: crosshair; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-space {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-space:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        .btn-space:active:not(:disabled) { transform: translateY(0); }
        .btn-space:disabled { opacity: 0.3; cursor: not-allowed; }
        .selected-item { border-color: #3b82f6; background: rgba(59, 130, 246, 0.2); }
        
        .success-glow {
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.5);
        }
    </style>

  <style id="rise-compliance-styles">
    :root {
      --rise-brand: #285f9f;
      --rise-surface: #ffffff;
      --rise-text: #0f172a;
      --rise-muted: #64748b;
      --rise-line: #cbd5e1;
      --rise-success: #15803d;
      --rise-warning: #b45309;
      --rise-danger: #b91c1c;
    }
    html, body { background: transparent !important; max-width: 100%; }
    #gameCanvas { border: 5px solid #285f9f !important; border-radius: 18px; box-sizing: border-box; }
    button, input, select, textarea, [role="button"] { min-height: 24px; }
    :focus-visible { outline: 3px solid #285f9f !important; outline-offset: 3px !important; }
    .rise-sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }
    html.rise-paused *, html.rise-paused *::before, html.rise-paused *::after { animation-play-state: paused !important; }
    @media (max-width: 480px) {
      body { overflow-x: hidden; }
      button, input, select, textarea { font-size: max(16px, 1em); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center">
<main class="rise-embed" style="display: contents;">
  <script src="../vendor/tailwindcss-3.4.17.js"></script>
  <script id="rise-walkthrough-runtime">
  (() => {
    'use strict';
    let completionSent = false;
    const nativeRequestAnimationFrame = window.requestAnimationFrame.bind(window);
    const nativeCancelAnimationFrame = window.cancelAnimationFrame.bind(window);
    let frameSequence = 0;
    const pendingFrames = new Map();

    function scheduleFrame(id) {
      const record = pendingFrames.get(id);
      if (!record || document.hidden) return;
      record.nativeId = nativeRequestAnimationFrame((time) => {
        if (!pendingFrames.has(id)) return;
        if (document.hidden) {
          record.nativeId = null;
          return;
        }
        pendingFrames.delete(id);
        record.callback(time);
      });
    }

    window.requestAnimationFrame = (callback) => {
      const id = ++frameSequence;
      pendingFrames.set(id, { callback, nativeId: null });
      scheduleFrame(id);
      return id;
    };

    window.cancelAnimationFrame = (id) => {
      const record = pendingFrames.get(id);
      if (record && record.nativeId !== null) nativeCancelAnimationFrame(record.nativeId);
      pendingFrames.delete(id);
    };

    window.RiseWalkthrough = Object.freeze({
      complete() {
        if (completionSent) return;
        completionSent = true;
        document.documentElement.dataset.riseComplete = 'true';
        window.parent.postMessage({ type: 'complete' }, '*');
      },
      get completed() { return completionSent; },
      reduceMotion: window.matchMedia('(prefers-reduced-motion: reduce)').matches
    });

    function normalizeControls(root = document) {
      root.querySelectorAll('button:not([type])').forEach((button) => { button.type = 'button'; });
      root.querySelectorAll('[role="button"]').forEach((control) => {
        if (!control.hasAttribute('tabindex')) control.tabIndex = 0;
      });
    }

    document.addEventListener('keydown', (event) => {
      const control = event.target.closest?.('[role="button"]');
      if (!control || (event.key !== 'Enter' && event.key !== ' ')) return;
      event.preventDefault();
      control.click();
    });

    document.addEventListener('DOMContentLoaded', () => {
      normalizeControls();
      const status = document.createElement('p');
      status.className = 'rise-sr-only';
      status.id = 'rise-completion-status';
      status.setAttribute('role', 'status');
      status.setAttribute('aria-live', 'polite');
      status.textContent = 'Interactive walkthrough ready.';
      document.querySelector('main')?.append(status);
      new MutationObserver((records) => records.forEach((record) => {
        record.addedNodes.forEach((node) => { if (node.nodeType === 1) normalizeControls(node); });
      })).observe(document.querySelector('main') || document.body, { childList: true, subtree: true });
    });

    document.addEventListener('visibilitychange', () => {
      document.documentElement.classList.toggle('rise-paused', document.hidden);
      if (!document.hidden) [...pendingFrames.keys()].forEach(scheduleFrame);
    });
  })();
  </script>

    <div id="ui-layer" class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-between p-6">
        <div class="flex justify-between items-start pointer-events-auto">
            <div class="glass-panel p-4 rounded-xl max-w-sm">
                <div id="level-display" class="text-blue-400 font-bold text-xs uppercase tracking-tighter mb-1">Level 1: The Drift</div>
                <p class="text-[10px] text-gray-400 leading-relaxed italic">
                    "For every action, there is an equal and opposite reaction."
                </p>
            </div>

            <div id="status-panel" class="glass-panel p-4 rounded-xl text-right">
                <div class="text-xs uppercase tracking-widest text-gray-500">Current Velocity</div>
                <div id="velocity-display" class="text-2xl font-mono text-green-400">0.00 m/s</div>
            </div>
        </div>

        <div class="flex flex-col items-center gap-4 pointer-events-auto">
            <div id="message-box" class="glass-panel px-6 py-3 rounded-full text-sm font-medium text-blue-300">
                Choose an object to throw...
            </div>

            <div id="inventory" class="flex gap-4">
                <button type="button" onclick="selectItem('wrench')" id="btn-wrench" class="btn-space glass-panel p-3 rounded-2xl flex flex-col items-center w-24 border-2 border-transparent">
                    <span class="text-lg mb-1">🔧</span>
                    <span class="text-[10px] font-bold">WRENCH</span>
                    <span id="count-wrench" class="text-[8px] opacity-60">Infinite</span>
                </button>
                <button type="button" onclick="selectItem('rope')" id="btn-rope" class="btn-space glass-panel p-3 rounded-2xl flex flex-col items-center w-24 border-2 border-transparent">
                    <span class="text-lg mb-1">🪢</span>
                    <span class="text-[10px] font-bold">ROPE</span>
                    <span id="count-rope" class="text-[8px] opacity-60">Infinite</span>
                </button>
                <button type="button" onclick="selectItem('radar')" id="btn-radar" class="btn-space glass-panel p-3 rounded-2xl flex flex-col items-center w-24 border-2 border-transparent">
                    <span class="text-lg mb-1">📡</span>
                    <span class="text-[10px] font-bold">RADAR</span>
                    <span id="count-radar" class="text-[8px] opacity-60">Infinite</span>
                </button>
                <button type="button" onclick="selectItem('gold')" id="btn-gold" class="btn-space glass-panel p-3 rounded-2xl flex flex-col items-center w-24 border-2 border-transparent">
                    <span class="text-lg mb-1">🪙</span>
                    <span class="text-[10px] font-bold text-yellow-400">GOLD</span>
                    <span id="count-gold" class="text-[8px] opacity-60">Infinite</span>
                </button>
            </div>

            <div id="action-hint" class="text-xs text-gray-500 bg-black/40 px-3 py-1 rounded-full opacity-0 transition-opacity">
                Click and drag to aim your throw
            </div>

            <div class="flex gap-4">
                <button type="button" id="reset-btn" onclick="resetSim()" class="hidden bg-slate-800 text-white font-bold py-2 px-8 rounded-full hover:bg-slate-700 transition-colors border border-white/20">
                    RETRY MISSION
                </button>
                <button type="button" id="next-btn" onclick="startNextMission()" class="hidden bg-green-500 text-white font-bold py-2 px-8 rounded-full hover:bg-green-400 transition-colors success-glow">
                    NEXT MISSION
                </button>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas" class="absolute inset-0" role="img" aria-label="Newton's Space Walk: Game Canvas visual"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const velocityDisplay = document.getElementById('velocity-display');
        const messageBox = document.getElementById('message-box');
        const actionHint = document.getElementById('action-hint');
        const resetBtn = document.getElementById('reset-btn');
        const nextBtn = document.getElementById('next-btn');
        const levelDisplay = document.getElementById('level-display');

        let width, height;
        let stars = [];
        let gameState = 'PLAYING'; // PLAYING, FINISHED
        let interactionState = 'IDLE'; // IDLE, AIMING
        let selectedItem = null;
        let mousePos = { x: 0, y: 0 };
        let isMouseDown = false;
        let currentLevel = 0;
        const riseCompletedMissions = new Set();

        const levels = [
            { name: "Level 1: Basic Drift", vx: -0.2, vy: 0, shipY: 0.5, moving: false },
            { name: "Level 2: Speeding Away", vx: -0.6, vy: 0, shipY: 0.5, moving: false },
            { name: "Level 3: Diagonal Tumble", vx: -0.3, vy: -0.3, shipY: 0.5, moving: false },
            { name: "Level 4: Moving Shuttle", vx: -0.3, vy: 0.1, shipY: 0.5, moving: true },
            { name: "Level 5: Deep Space Chaos", vx: -0.5, vy: -0.4, shipY: 0.5, moving: true, shipSpeed: 2 }
        ];

        const astronaut = {
            x: 0, y: 0,
            vx: 0, vy: 0,
            mass: 100,
            rotation: 0
        };

        const ship = { x: 0, y: 0, targetY: 0, direction: 1 };
        const items = {
            wrench: { name: 'Wrench', mass: 1, emoji: '🔧' },
            rope: { name: 'Rope', mass: 2, emoji: '🪢' },
            radar: { name: 'Radar Dish', mass: 25, emoji: '📡' },
            gold: { name: 'Gold Bar', mass: 50, emoji: '🪙' }
        };
        let activeProjectiles = [];

        function drawArrow(ctx, fromX, fromY, toX, toY, color, width = 2) {
            const headLength = 15;
            const dx = toX - fromX;
            const dy = toY - fromY;
            const angle = Math.atan2(dy, dx);
            
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = width;
            
            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - headLength * Math.cos(angle - Math.PI / 6), toY - headLength * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(toX - headLength * Math.cos(angle + Math.PI / 6), toY - headLength * Math.sin(angle + Math.PI / 6));
            ctx.closePath();
            ctx.fill();
        }

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            
            stars = [];
            for(let i=0; i<200; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2,
                    opacity: Math.random()
                });
            }
            loadLevel(currentLevel);
        }

        function loadLevel(idx) {
            const lvl = levels[idx];
            levelDisplay.innerText = lvl.name;
            astronaut.x = width * 0.85; // Start a bit further back to give room for multiple throws
            astronaut.y = height * 0.5;
            astronaut.vx = lvl.vx;
            astronaut.vy = lvl.vy;
            astronaut.rotation = 0;
            
            ship.x = width * 0.1;
            ship.y = height * lvl.shipY;
            ship.targetY = height * lvl.shipY;
            
            resetSimUI();
        }

        function resetSimUI() {
            activeProjectiles = [];
            gameState = 'PLAYING';
            interactionState = 'IDLE';
            selectedItem = null;
            resetBtn.classList.add('hidden');
            nextBtn.classList.add('hidden');
            messageBox.innerText = "Choose an object to throw...";
            messageBox.classList.remove('text-green-400', 'text-red-500');
            
            document.querySelectorAll('.btn-space').forEach(b => {
                b.disabled = false;
                b.classList.remove('selected-item');
            });
        }

        function startNextMission() {
            currentLevel = (currentLevel + 1) % levels.length;
            loadLevel(currentLevel);
        }

        function resetSim() {
            loadLevel(currentLevel);
        }

        window.addEventListener('resize', init);
        window.addEventListener('mousedown', () => { if (interactionState === 'AIMING') isMouseDown = true; });
        window.addEventListener('mousemove', (e) => { mousePos.x = e.clientX; mousePos.y = e.clientY; });
        window.addEventListener('mouseup', () => {
            if (isMouseDown && interactionState === 'AIMING') {
                isMouseDown = false;
                executeThrow();
            }
        });

        function selectItem(itemKey) {
            if (gameState !== 'PLAYING') return;
            selectedItem = itemKey;
            document.querySelectorAll('.btn-space').forEach(b => b.classList.remove('selected-item'));
            document.getElementById('btn-' + itemKey).classList.add('selected-item');
            interactionState = 'AIMING';
            messageBox.innerText = "Click and drag to aim your throw!";
            actionHint.style.opacity = '1';
        }

        function executeThrow() {
            const dx = mousePos.x - astronaut.x;
            const dy = mousePos.y - astronaut.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            const power = Math.min(dist / 10, 15);
            const throwVx = (dx / dist) * power;
            const throwVy = (dy / dist) * power;

            const itemData = items[selectedItem];

            // Newton's 3rd Law: Action = -Reaction
            // m1v1 = -m2v2 => deltaV_astro = -(m_obj * v_obj) / m_astro
            const deltaVx = -(itemData.mass * throwVx) / astronaut.mass;
            const deltaVy = -(itemData.mass * throwVy) / astronaut.mass;

            astronaut.vx += deltaVx;
            astronaut.vy += deltaVy;

            activeProjectiles.push({
                x: astronaut.x,
                y: astronaut.y,
                vx: throwVx + astronaut.vx,
                vy: throwVy + astronaut.vy,
                type: selectedItem,
                rotation: 0
            });

            messageBox.innerText = `Thrown! Use another object for a correction?`;
            
            // Clean up interaction but keep game playing
            interactionState = 'IDLE';
            selectedItem = null;
            document.querySelectorAll('.btn-space').forEach(b => b.classList.remove('selected-item'));
            actionHint.style.opacity = '0';
        }

        function drawShip() {
            const lvl = levels[currentLevel];
            if (lvl.moving && gameState !== 'FINISHED') {
                const speed = lvl.shipSpeed || 1;
                ship.y += ship.direction * speed;
                if (ship.y > height * 0.8 || ship.y < height * 0.2) ship.direction *= -1;
            }

            ctx.save();
            ctx.translate(ship.x, ship.y - 25);
            
            // Rocket body
            ctx.fillStyle = '#f1f5f9';
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(120, 0);
            ctx.lineTo(150, 25); 
            ctx.lineTo(120, 50);
            ctx.lineTo(0, 50);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#475569';
            ctx.fillRect(-15, 10, 15, 30);

            // Fins
            ctx.fillStyle = '#ef4444';
            ctx.beginPath(); 
            ctx.moveTo(10, 0); ctx.lineTo(-20, -15); ctx.lineTo(40, 0); ctx.fill();
            ctx.beginPath(); 
            ctx.moveTo(10, 50); ctx.lineTo(-20, 65); ctx.lineTo(40, 50); ctx.fill();

            // Window
            ctx.fillStyle = '#38bdf8';
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(80, 25, 12, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();

            ctx.fillStyle = '#94a3b8';
            ctx.font = 'bold 9px Inter';
            ctx.fillText("AIRLOCK", 10, 30);

            ctx.restore();
        }

        function drawAstronaut() {
            ctx.save();
            ctx.translate(astronaut.x, astronaut.y);
            ctx.rotate(astronaut.rotation);

            // Backpack
            ctx.fillStyle = '#94a3b8';
            ctx.beginPath(); ctx.roundRect(-18, -12, 10, 25, 4); ctx.fill();

            // Limbs
            ctx.strokeStyle = 'white'; ctx.lineWidth = 7; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(-10, -5); ctx.lineTo(-22, 8); ctx.stroke(); 
            ctx.beginPath(); ctx.moveTo(10, -5); ctx.lineTo(22, 8); ctx.stroke();  
            ctx.beginPath(); ctx.moveTo(-6, 15); ctx.lineTo(-12, 32); ctx.stroke(); 
            ctx.beginPath(); ctx.moveTo(6, 15); ctx.lineTo(12, 32); ctx.stroke();  

            // Torso
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.roundRect(-12, -15, 24, 32, 8); ctx.fill();

            // Helmet
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(0, -22, 11, 0, Math.PI * 2); ctx.fill();

            // Visor
            ctx.fillStyle = '#1e293b'; 
            ctx.beginPath(); ctx.roundRect(-8, -27, 16, 10, 4); ctx.fill();
            
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.beginPath(); ctx.roundRect(-5, -25, 4, 3, 1); ctx.fill();

            ctx.restore();

            if (isMouseDown && interactionState === 'AIMING') {
                drawArrow(ctx, astronaut.x, astronaut.y, mousePos.x, mousePos.y, '#3b82f6', 3);
                ctx.font = 'bold 12px Inter';
                ctx.fillStyle = '#60a5fa';
                ctx.fillText("ACTION: THROW DIRECTION", mousePos.x + 15, mousePos.y);
            }
        }

        function drawProjectiles() {
            activeProjectiles.forEach(p => {
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);
                ctx.font = '30px Inter';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(items[p.type].emoji, 0, 0);
                ctx.restore();
            });
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            // Stars
            stars.forEach(s => {
                ctx.fillStyle = `rgba(255, 255, 255, ${s.opacity})`;
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });

            drawShip();
            drawProjectiles();
            drawAstronaut();

            if (gameState !== 'FINISHED') {
                // Movement
                astronaut.x += astronaut.vx;
                astronaut.y += astronaut.vy;
                astronaut.rotation += astronaut.vx * 0.01;

                activeProjectiles.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.rotation += 0.1;
                });

                // Update UI
                velocityDisplay.innerText = `${(Math.sqrt(astronaut.vx**2 + astronaut.vy**2) * 10).toFixed(2)} m/s`;

                // Success check (Airlock collision)
                const dx = astronaut.x - (ship.x + 40);
                const dy = astronaut.y - ship.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist < 60) {
                    gameState = 'FINISHED';
                    riseCompletedMissions.add(currentLevel);
                    if (riseCompletedMissions.size === levels.length) window.RiseWalkthrough.complete();
                    messageBox.innerText = "MISSION SUCCESS! You reached the rocket.";
                    messageBox.classList.add('text-green-400');
                    resetBtn.classList.remove('hidden');
                    nextBtn.classList.remove('hidden');
                    document.querySelectorAll('.btn-space').forEach(b => b.disabled = true);
                }

                // Failure check
                if (astronaut.x > width + 500 || astronaut.x < -500 || astronaut.y > height + 500 || astronaut.y < -500) {
                    gameState = 'FINISHED';
                    messageBox.innerText = "LOST IN SPACE. Try more massive objects next time.";
                    messageBox.classList.add('text-red-500');
                    resetBtn.classList.remove('hidden');
                    document.querySelectorAll('.btn-space').forEach(b => b.disabled = true);
                }
            }

            requestAnimationFrame(animate);
        }

        window.onload = () => {
            init();
            animate();
        };
    </script>
  </main>
</body>
</html>
