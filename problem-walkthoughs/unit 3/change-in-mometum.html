<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change in Momentum Walkthrough</title>
<style>
:root {
      --bg: #f7f9fc;
      --panel: #ffffff;
      --line: #d8e0ea;
      --text: #172033;
      --muted: #526070;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --teal: #0f766e;
      --green: #15803d;
      --amber: #b45309;
      --red: #b91c1c;
      --shadow: 0 18px 42px rgba(31, 42, 68, 0.12);
    }

    * { box-sizing: border-box; }

    html {
      width: 1130px;
      height: 736px;
    }

    body {
      margin: 0;
      width: 1130px;
      height: 736px;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: transparent;
      color: var(--text);
    }

    .stage {
      width: 1130px;
      height: 736px;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .stage { padding: 14px; }

    .canvas-shell {
      position: relative;
      width: 1100px;
      height: 650px;
    }

    canvas {
      width: 1100px;
      height: 650px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      background: linear-gradient(#dbeafe, #eff6ff);
      display: block;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(110px, 150px) minmax(260px, 1fr) minmax(150px, 220px);
      gap: 10px;
      margin: 0 0 12px;
      align-items: stretch;
    }

    button {
      min-height: 44px;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.94rem;
      cursor: pointer;
      background: var(--blue);
      color: white;
      font-weight: 700;
    }

    button:hover { background: var(--blue-dark); }

    button.secondary { background: #4b5563; }
    button.secondary:hover { background: #374151; }

    button.answer { background: var(--teal); }
    button.answer:hover { background: #115e59; }

    button.choice-button {
      min-height: 38px;
      background: #ffffff;
      color: var(--text);
      border: 1px solid #b7c2d0;
      text-align: left;
    }

    button.choice-button:hover {
      background: #eff6ff;
      border-color: var(--blue);
    }

    button.choice-button.is-selected {
      background: #dbeafe;
      border-color: var(--blue);
      color: #1e3a8a;
    }

    button.choice-button.is-correct {
      background: #dcfce7;
      border-color: rgba(21, 128, 61, 0.45);
      color: #14532d;
    }

    button.choice-button.is-wrong {
      background: #fef3c7;
      border-color: rgba(180, 83, 9, 0.45);
      color: #78350f;
    }

    button.choice-button.primary-action {
      min-height: 72px;
      justify-content: center;
      text-align: center;
      background: #15803d;
      border-color: #166534;
      color: #ffffff;
      font-size: clamp(1.2rem, 3vw, 1.7rem);
      box-shadow: 0 12px 28px rgba(21, 128, 61, 0.26);
    }

    button.choice-button.primary-action:hover {
      background: #166534;
      border-color: #14532d;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .question-overlay {
      position: absolute;
      left: 22px;
      right: 22px;
      overflow: auto;
      padding: 14px;
      border: 1px solid rgba(148, 163, 184, 0.55);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 16px 34px rgba(15, 23, 42, 0.18);
      backdrop-filter: blur(10px);
    }

    .question-overlay {
      bottom: 22px;
      max-height: 48%;
    }

    .feedback-overlay {
      min-height: 44px;
      overflow: auto;
      padding: 10px 12px;
      border: 1px solid rgba(148, 163, 184, 0.55);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
    }

    .question-overlay p {
      margin: 0 0 12px;
      color: var(--muted);
      line-height: 1.55;
    }

    .choice-area {
      display: grid;
      gap: 12px;
      margin-top: 10px;
    }

    .choice-group {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fbfdff;
    }

    .choice-buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }

    .feedback {
      min-height: 42px;
      margin: 0;
      padding: 11px 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: #f8fafc;
      color: var(--muted);
      line-height: 1.45;
    }

    .feedback.good {
      border-color: rgba(21, 128, 61, 0.3);
      background: #f0fdf4;
      color: #14532d;
    }

    .feedback.needs-work {
      border-color: rgba(180, 83, 9, 0.36);
      background: #fffbeb;
      color: #78350f;
    }

    .feedback.answer-key {
      border-color: rgba(37, 99, 235, 0.28);
      background: #eff6ff;
      color: #1e3a8a;
    }

    .formula {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(37, 99, 235, 0.09);
      color: #1e40af;
      font-weight: 700;
      max-width: 100%;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .feedback-formula {
      margin-top: 8px;
    }

    .feedback-overlay .feedback {
      min-height: 0;
      padding: 0;
      border: 0;
      background: transparent;
    }

  </style>

  <style id="rise-compliance-styles">
    :root {
      --rise-brand: #285f9f;
      --rise-surface: #ffffff;
      --rise-text: #0f172a;
      --rise-muted: #64748b;
      --rise-line: #cbd5e1;
      --rise-success: #15803d;
      --rise-warning: #b45309;
      --rise-danger: #b91c1c;
    }
    html, body { background: transparent !important; max-width: 100%; }
    main.rise-embed > .stage { border: 5px solid #285f9f !important; border-radius: 18px; box-sizing: border-box; }
    button, input, select, textarea, [role="button"] { min-height: 24px; }
    :focus-visible { outline: 3px solid #285f9f !important; outline-offset: 3px !important; }
    .rise-sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }
    html.rise-paused *, html.rise-paused *::before, html.rise-paused *::after { animation-play-state: paused !important; }
    @media (max-width: 480px) {
      body { overflow-x: hidden; }
      button, input, select, textarea { font-size: max(16px, 1em); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
<main class="rise-embed" style="display: contents;">
  <script id="rise-walkthrough-runtime">
  (() => {
    'use strict';
    let completionSent = false;
    const nativeRequestAnimationFrame = window.requestAnimationFrame.bind(window);
    const nativeCancelAnimationFrame = window.cancelAnimationFrame.bind(window);
    let frameSequence = 0;
    const pendingFrames = new Map();

    function scheduleFrame(id) {
      const record = pendingFrames.get(id);
      if (!record || document.hidden) return;
      record.nativeId = nativeRequestAnimationFrame((time) => {
        if (!pendingFrames.has(id)) return;
        if (document.hidden) {
          record.nativeId = null;
          return;
        }
        pendingFrames.delete(id);
        record.callback(time);
      });
    }

    window.requestAnimationFrame = (callback) => {
      const id = ++frameSequence;
      pendingFrames.set(id, { callback, nativeId: null });
      scheduleFrame(id);
      return id;
    };

    window.cancelAnimationFrame = (id) => {
      const record = pendingFrames.get(id);
      if (record && record.nativeId !== null) nativeCancelAnimationFrame(record.nativeId);
      pendingFrames.delete(id);
    };

    window.RiseWalkthrough = Object.freeze({
      complete() {
        if (completionSent) return;
        completionSent = true;
        document.documentElement.dataset.riseComplete = 'true';
        window.parent.postMessage({ type: 'complete' }, '*');
      },
      get completed() { return completionSent; },
      reduceMotion: window.matchMedia('(prefers-reduced-motion: reduce)').matches
    });

    function normalizeControls(root = document) {
      root.querySelectorAll('button:not([type])').forEach((button) => { button.type = 'button'; });
      root.querySelectorAll('[role="button"]').forEach((control) => {
        if (!control.hasAttribute('tabindex')) control.tabIndex = 0;
      });
    }

    document.addEventListener('keydown', (event) => {
      const control = event.target.closest?.('[role="button"]');
      if (!control || (event.key !== 'Enter' && event.key !== ' ')) return;
      event.preventDefault();
      control.click();
    });

    document.addEventListener('DOMContentLoaded', () => {
      normalizeControls();
      const status = document.createElement('p');
      status.className = 'rise-sr-only';
      status.id = 'rise-completion-status';
      status.setAttribute('role', 'status');
      status.setAttribute('aria-live', 'polite');
      status.textContent = 'Interactive walkthrough ready.';
      document.querySelector('main')?.append(status);
      new MutationObserver((records) => records.forEach((record) => {
        record.addedNodes.forEach((node) => { if (node.nodeType === 1) normalizeControls(node); });
      })).observe(document.querySelector('main') || document.body, { childList: true, subtree: true });
    });

    document.addEventListener('visibilitychange', () => {
      document.documentElement.classList.toggle('rise-paused', document.hidden);
      if (!document.hidden) [...pendingFrames.keys()].forEach(scheduleFrame);
    });
  })();
  </script>
  <section class="stage" aria-label="Collision animation">
    <div class="controls">
      <button type="button" id="resetBtn" class="secondary">Reset</button>
      <div id="feedbackOverlay" class="feedback-overlay" aria-live="polite">
        <div id="feedback" class="feedback">Start by dropping both balls.</div>
        <div id="feedbackFormula" class="feedback-formula"></div>
      </div>
      <button type="button" id="nextBtn" disabled>Next Step</button>
    </div>

    <div class="canvas-shell">
      <canvas id="demoCanvas" width="1100" height="650" role="img" aria-label="Change in Momentum Walkthrough: Demo Canvas visual"></canvas>
      <div id="questionOverlay" class="question-overlay" aria-live="polite">
        <div id="questionBody"></div>
        <div id="choiceArea" class="choice-area"></div>
      </div>
    </div>
  </section>

  <script>
    const canvas = document.getElementById("demoCanvas");
    const ctx = canvas.getContext("2d");

    const resetBtn = document.getElementById("resetBtn");
    const nextBtn = document.getElementById("nextBtn");
    const questionBody = document.getElementById("questionBody");
    const choiceArea = document.getElementById("choiceArea");
    const feedback = document.getElementById("feedback");
    const feedbackFormula = document.getElementById("feedbackFormula");

    // Calculation values use the student's Step 2 sign convention.
    const mass = 0.10;       // kg
    const impactSpeed = 4.4; // m/s
    const elasticReboundSpeed = 3.5; // m/s
    const inelasticStopSpeed = 0; // m/s

    const groundY = 400;
    const radius = 30;
    const startY = 95;
    const elasticX = 310;
    const inelasticX = 785;
    const canvasG = 1700;
    const restitution = 0.78;
    const preImpactY = groundY - 8;
    const postImpactY = groundY - 45;
    const reboundPeakY = Math.round(groundY - (groundY - startY) * restitution * restitution);
    const impactSpeedPx = Math.sqrt(2 * canvasG * (groundY - startY));

    let elasticBall;
    let inelasticBall;
    let running = false;
    let demoFinished = false;
    let lastTime = null;
    let animationPhase = "idle";
    let simPhase = "start";
    let step = 0;
    let prediction = null;
    let signConvention = null;
    let answers = {};
    let autoAdvanceTimer = null;
    let autoAdvanceStep = null;
    let previewReplayTimer = null;
    let celebrationActive = false;
    let confettiPieces = [];

    const questionSteps = {
      0: {
        label: "Step 1 of 6",
        body: `
          <p>Question: Which ball has the largest change in momentum?</p>
        `,
        feedbackFormula: "change in momentum Δp = pf - pi",
        completeFeedback: "Prediction saved. The walkthrough will start the calculation steps next.",
        groups: [
          {
            id: "prediction",
            prompt: "",
            neutral: true,
            choices: [
              { value: "Elastic Ball", label: "Elastic Ball", correct: true },
              { value: "Inelastic Ball", label: "Inelastic Ball", correct: true },
              { value: "Same Change", label: "Same", correct: true }
            ]
          }
        ]
      },
      1: {
        label: "Step 2 of 6",
        body: `
          <p>Before impact, both balls are moving downward. Choose the sign convention you want to use for the rest of the problem.</p>
        `,
        groups: [
          {
            id: "viSign",
            prompt: "",
            choices: [
              { value: "downPositive", label: "Downward is positive", correct: true },
              { value: "downNegative", label: "Downward is negative", correct: true }
            ]
          }
        ]
      },
      2: {
        label: "Step 3 of 6",
        body: `
          <p>Now use your sign convention to calculate the initial momentum for either ball.</p>
        `,
        feedbackFormula: "pi = mvi",
        groups: [
          {
            id: "initialMomentum",
            prompt: "",
            choices: []
          }
        ]
      },
      3: {
        label: "Step 4 of 6",
        body: `
          <p>Calculate the elastic ball's change in momentum first.</p>
        `,
        feedbackFormula: "|change in momentum| = |m(vf - vi)|",
        groups: [
          {
            id: "elasticDelta",
            prompt: "",
            choices: [
              { value: "0.35", label: "Elastic: 0.35 kg*m/s" },
              { value: "0.44", label: "Elastic: 0.44 kg*m/s" },
              { value: "0.79", label: "Elastic: 0.79 kg*m/s", correct: true }
            ]
          }
        ]
      },
      4: {
        label: "Step 5 of 6",
        body: `
          <p>Now calculate the inelastic ball's change in momentum.</p>
        `,
        feedbackFormula: "|change in momentum| = |m(vf - vi)|",
        groups: [
          {
            id: "inelasticDelta",
            prompt: "",
            choices: [
              { value: "0", label: "Inelastic: 0 kg*m/s" },
              { value: "0.44", label: "Inelastic: 0.44 kg*m/s", correct: true },
              { value: "0.79", label: "Inelastic: 0.79 kg*m/s" }
            ]
          }
        ]
      },
      5: {
        label: "Step 6 of 6",
        body: `
          <p>The numbers show the elastic ball has the larger change in momentum. Choose the best explanation.</p>
        `,
        groups: [
          {
            id: "reasonChoice",
            prompt: "Why is the elastic ball's change larger?",
            choices: [
              { value: "mass", label: "It has a larger mass." },
              { value: "height", label: "It started from a greater height." },
              { value: "direction", label: "Its momentum changes direction from downward to upward.", correct: true },
              { value: "zero", label: "Its final momentum is zero." }
            ]
          }
        ]
      }
    };

    const finalStep = Object.keys(questionSteps).length - 1;
    const autoAdvanceDelayMs = 1500;
    const previewReplayDelayMs = 1000;
    const celebrationMessage = "Congratulations! You understand that something that bounces has a greater change in momentum.";

    function clearAutoAdvance() {
      if (autoAdvanceTimer !== null) {
        clearTimeout(autoAdvanceTimer);
        autoAdvanceTimer = null;
      }
      autoAdvanceStep = null;
    }

    function clearPreviewReplay() {
      if (previewReplayTimer !== null) {
        clearTimeout(previewReplayTimer);
        previewReplayTimer = null;
      }
    }

    function clearCelebration() {
      celebrationActive = false;
      confettiPieces = [];
    }

    function canAutoAdvance(stepNumber = step) {
      const readyToAdvance = stepNumber === 0 ? true : demoFinished && !running;
      return readyToAdvance && stepNumber < finalStep && isStepComplete(stepNumber);
    }

    function syncAutoAdvance() {
      if (!canAutoAdvance()) {
        clearAutoAdvance();
        return;
      }

      if (autoAdvanceTimer !== null && autoAdvanceStep === step) return;

      clearAutoAdvance();

      const scheduledStep = step;
      autoAdvanceStep = scheduledStep;
      autoAdvanceTimer = setTimeout(() => {
        autoAdvanceTimer = null;
        autoAdvanceStep = null;
        if (step === scheduledStep && canAutoAdvance(scheduledStep)) {
          nextStep();
        }
      }, autoAdvanceDelayMs);
    }

    function hasSignConvention() {
      return signConvention === "downPositive" || signConvention === "downNegative";
    }

    function isDownPositive() {
      return signConvention === "downPositive";
    }

    function currentInitialVelocity() {
      return (isDownPositive() ? 1 : -1) * impactSpeed;
    }

    function currentElasticFinalVelocity() {
      return (isDownPositive() ? -1 : 1) * elasticReboundSpeed;
    }

    function currentInelasticFinalVelocity() {
      return inelasticStopSpeed;
    }

    function currentInitialMomentum() {
      return mass * currentInitialVelocity();
    }

    function currentElasticFinalMomentum() {
      return mass * currentElasticFinalVelocity();
    }

    function currentInelasticFinalMomentum() {
      return mass * currentInelasticFinalVelocity();
    }

    function currentElasticDeltaP() {
      return Math.abs(currentElasticFinalMomentum() - currentInitialMomentum());
    }

    function currentInelasticDeltaP() {
      return Math.abs(currentInelasticFinalMomentum() - currentInitialMomentum());
    }

    function formatSigned(value, decimals) {
      const threshold = Math.pow(10, -decimals) / 2;
      if (Math.abs(value) < threshold) return "0";
      return (value > 0 ? "+" : "") + value.toFixed(decimals);
    }

    function formatVelocity(value) {
      return formatSigned(value, 1) + " m/s";
    }

    function formatMomentum(value) {
      return formatSigned(value, 2) + " kg*m/s";
    }

    function formatMagnitude(value) {
      return value.toFixed(2) + " kg*m/s";
    }

    function initialMomentumChoices() {
      const correctValue = formatSigned(currentInitialMomentum(), 2);
      const oppositeValue = formatSigned(-currentInitialMomentum(), 2);

      return [
        { value: correctValue, label: correctValue + " kg*m/s", correct: true },
        { value: oppositeValue, label: oppositeValue + " kg*m/s" },
        { value: "0", label: "0 kg*m/s" }
      ];
    }

    function getChoices(group) {
      if (group.id === "initialMomentum") {
        return initialMomentumChoices();
      }

      return group.choices;
    }

    function signConventionFeedback() {
      if (isDownPositive()) {
        return "You chose downward as positive. Keep downward values positive and upward values negative for the rest of the problem.";
      }

      return "You chose downward as negative. Keep downward values negative and upward values positive for the rest of the problem.";
    }

    function completeFeedbackForStep(stepNumber) {
      const current = questionSteps[stepNumber];

      if (stepNumber === 0) {
        return "";
      }

      if (stepNumber === 1) {
        return signConventionFeedback();
      }

      if (stepNumber === 2) {
        return "Correct. Initial momentum is pi = 0.10("
          + formatSigned(currentInitialVelocity(), 1)
          + ") = "
          + formatMomentum(currentInitialMomentum())
          + " for both balls.";
      }

      if (stepNumber === 3) {
        return "Correct. Elastic: " + formatMagnitude(currentElasticDeltaP()) + ".";
      }

      if (stepNumber === 4) {
        return "Correct. Inelastic: " + formatMagnitude(currentInelasticDeltaP()) + ".";
      }

      if (stepNumber === 5) {
        if (isDownPositive()) {
          return "Correct. The elastic ball changes from positive downward momentum to negative upward momentum, so the momentum vector changes more.";
        }

        return "Correct. The elastic ball changes from negative downward momentum to positive upward momentum, so the momentum vector changes more.";
      }

      return current.completeFeedback || "Correct.";
    }

    function feedbackFormulaForStep(stepNumber) {
      const current = questionSteps[stepNumber];

      if (stepNumber === 2 && hasSignConvention()) {
        return "pi = 0.10(" + formatSigned(currentInitialVelocity(), 1) + ")";
      }

      if (stepNumber === 3 && hasSignConvention()) {
        return "Elastic: |0.10("
          + formatSigned(currentElasticFinalVelocity(), 1)
          + " - ("
          + formatSigned(currentInitialVelocity(), 1)
          + "))|";
      }

      if (stepNumber === 4 && hasSignConvention()) {
        return "Inelastic: |0.10(0 - ("
          + formatSigned(currentInitialVelocity(), 1)
          + "))|";
      }

      return current.feedbackFormula || "";
    }

    function setFeedback(message, state) {
      feedback.className = "feedback" + (state ? " " + state : "");
      feedback.textContent = message;
    }

    function getCurrentAnswers() {
      if (!answers[step]) answers[step] = {};
      return answers[step];
    }

    function findChoice(group, value) {
      return getChoices(group).find((choice) => choice.value === value);
    }

    function isStepComplete(stepNumber) {
      const current = questionSteps[stepNumber];
      if (!current || !current.groups.length) return demoFinished;
      const stepAnswers = answers[stepNumber] || {};
      const requiredGroups = current.groups.filter((group) => !group.optional);

      if (!requiredGroups.length) return demoFinished;

      return requiredGroups.every((group) => {
        const selected = stepAnswers[group.id];
        const choice = findChoice(group, selected);
        return Boolean(choice && choice.correct);
      });
    }

    function renderChoiceGroups() {
      const current = questionSteps[step];
      const stepAnswers = answers[step] || {};
      const disableChoices = running && step !== 0 ? " disabled" : "";

      choiceArea.innerHTML = current.groups.map((group) => {
        const buttons = getChoices(group).map((choice) => {
          const isSelected = stepAnswers[group.id] === choice.value;
          const stateClass = isSelected
            ? (choice.correct ? " is-selected is-correct" : " is-selected is-wrong")
            : "";
          const primaryClass = choice.primary ? " primary-action" : "";

          return `
            <button
              class="choice-button${stateClass}${primaryClass}"
              type="button"
              data-group-id="${group.id}"
              data-choice-value="${choice.value}"
              ${disableChoices}
            >${choice.label}</button>
          `;
        }).join("");

        return `
          <div class="choice-group">
            <div class="choice-buttons">${buttons}</div>
          </div>
        `;
      }).join("");
    }

    function updateControls() {
      const current = questionSteps[step];
      nextBtn.textContent = step >= finalStep ? current.label : current.label + ": Next";
      nextBtn.disabled = running || !demoFinished || step >= finalStep || !isStepComplete(step);
      syncAutoAdvance();
    }

    function renderQuestionPanel() {
      const current = questionSteps[step];
      const formula = feedbackFormulaForStep(step);
      questionBody.innerHTML = current.body;
      feedbackFormula.innerHTML = formula
        ? `<span class="formula">${formula}</span>`
        : "";
      renderChoiceGroups();

      if (step === 0) {
        setFeedback("", "");
      } else if (isStepComplete(step)) {
        setFeedback(completeFeedbackForStep(step), "good");
      } else {
        setFeedback("Choose an answer on the canvas.", "");
      }
    }

    function setStep(nextStep) {
      clearAutoAdvance();
      clearPreviewReplay();
      step = nextStep;
      renderQuestionPanel();
      updateControls();
      draw();
    }

    function resetBallsToStart() {
      elasticBall = {
        x: elasticX,
        y: startY,
        vy: 0,
        bounced: false
      };

      inelasticBall = {
        x: inelasticX,
        y: startY,
        vy: 0,
        stopped: false
      };
    }

    function resetDemo() {
      clearAutoAdvance();
      clearPreviewReplay();
      clearCelebration();
      resetBallsToStart();

      running = false;
      demoFinished = false;
      lastTime = null;
      animationPhase = "idle";
      simPhase = "start";
      prediction = null;
      signConvention = null;
      answers = {};
      setStep(0);
      startPredictionReplay();
    }

    function roundedRect(x, y, w, h, r, fill, stroke) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
      if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    function drawTextBox(x, y, w, h, title, lines, options = {}) {
      roundedRect(x, y, w, h, 8, options.fill || "rgba(255,255,255,0.94)", options.stroke || "#cbd5e1");

      ctx.fillStyle = options.titleColor || "#111827";
      ctx.font = "bold 20px Arial";
      ctx.textAlign = "left";
      ctx.fillText(title, x + 18, y + 30);

      ctx.fillStyle = "#1f2937";
      ctx.font = options.font || "16px Arial";

      let lineY = y + 60;
      for (const line of lines) {
        ctx.fillText(line, x + 18, lineY);
        lineY += options.lineHeight || 24;
      }
    }

    function drawBall(ball, color, label) {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, radius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#111827";
      ctx.stroke();

      ctx.fillStyle = "#111827";
      ctx.font = "bold 15px Arial";
      ctx.textAlign = "center";
      ctx.fillText("0.1 kg", ball.x, ball.y + 5);

      ctx.fillStyle = "#111827";
      ctx.font = "bold 22px Arial";
      ctx.textAlign = "center";
      ctx.fillText(label, ball.x, 46);
      ctx.font = "15px Arial";
      ctx.fillText(label === "Elastic" ? "bounces upward" : "stops after impact", ball.x, 70);
    }

    function drawVector(x, y, length, direction, label, color) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 5;
      ctx.font = "bold 16px Arial";
      ctx.textAlign = "left";

      const endY = direction === "down" ? y + length : y - length;

      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x, endY);
      ctx.stroke();

      ctx.beginPath();
      if (direction === "down") {
        ctx.moveTo(x - 10, endY - 14);
        ctx.lineTo(x, endY);
        ctx.lineTo(x + 10, endY - 14);
      } else {
        ctx.moveTo(x - 10, endY + 14);
        ctx.lineTo(x, endY);
        ctx.lineTo(x + 10, endY + 14);
      }
      ctx.fill();

      ctx.fillText(label, x + 16, y + (endY - y) / 2 + 5);
      ctx.restore();
    }

    function drawSignArrow(x, centerY, length, direction, sign, color) {
      const startY = direction === "down" ? centerY - length / 2 : centerY + length / 2;
      const endY = direction === "down" ? centerY + length / 2 : centerY - length / 2;

      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x, startY);
      ctx.lineTo(x, endY);
      ctx.stroke();

      ctx.beginPath();
      if (direction === "down") {
        ctx.moveTo(x - 8, endY - 11);
        ctx.lineTo(x, endY);
        ctx.lineTo(x + 8, endY - 11);
      } else {
        ctx.moveTo(x - 8, endY + 11);
        ctx.lineTo(x, endY);
        ctx.lineTo(x + 8, endY + 11);
      }
      ctx.fill();

      ctx.font = "bold 20px Arial";
      ctx.textAlign = "center";
      ctx.fillText(sign, x + 16, centerY + 7);
      ctx.restore();
    }

    function drawSignConventionKey() {
      if (!hasSignConvention()) return;

      const boxX = 1030;
      const boxY = 112;
      roundedRect(boxX, boxY, 52, 158, 8, "rgba(255,255,255,0.92)", "#94a3b8");

      ctx.fillStyle = "#334155";
      ctx.font = "bold 13px Arial";
      ctx.textAlign = "center";
      ctx.fillText("+/-", boxX + 26, boxY + 23);

      drawSignArrow(
        boxX + 26,
        boxY + 68,
        42,
        isDownPositive() ? "down" : "up",
        "+",
        "#16a34a"
      );

      drawSignArrow(
        boxX + 26,
        boxY + 126,
        42,
        isDownPositive() ? "up" : "down",
        "-",
        "#dc2626"
      );
    }

    function createConfetti() {
      const colors = ["#facc15", "#22c55e", "#3b82f6", "#ec4899", "#f97316", "#a855f7"];
      confettiPieces = [];

      for (let i = 0; i < 150; i += 1) {
        confettiPieces.push({
          x: Math.random() * canvas.width,
          y: -Math.random() * canvas.height,
          vx: -45 + Math.random() * 90,
          vy: 95 + Math.random() * 170,
          size: 5 + Math.random() * 7,
          angle: Math.random() * Math.PI * 2,
          spin: -5 + Math.random() * 10,
          color: colors[i % colors.length]
        });
      }
    }

    function updateConfetti(dt) {
      if (!celebrationActive) return;

      for (const piece of confettiPieces) {
        piece.x += piece.vx * dt;
        piece.y += piece.vy * dt;
        piece.angle += piece.spin * dt;

        if (piece.y > canvas.height + 30) {
          piece.y = -20 - Math.random() * 120;
          piece.x = Math.random() * canvas.width;
        }
      }
    }

    function drawConfetti() {
      if (!celebrationActive) return;

      ctx.save();
      for (const piece of confettiPieces) {
        ctx.translate(piece.x, piece.y);
        ctx.rotate(piece.angle);
        ctx.fillStyle = piece.color;
        ctx.fillRect(-piece.size / 2, -piece.size / 2, piece.size, piece.size * 0.55);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
      }
      ctx.restore();
    }

    function drawGroundAndGuides() {
      ctx.strokeStyle = "#111827";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(80, groundY + radius);
      ctx.lineTo(canvas.width - 80, groundY + radius);
      ctx.stroke();

      ctx.fillStyle = "#64748b";
      ctx.font = "16px Arial";
      ctx.textAlign = "center";
      ctx.fillText("floor", canvas.width / 2, groundY + radius + 28);

    }

    function drawElasticEquationPanel(x, y, compact = false) {
      const lines = compact
        ? [
          "vi = " + formatVelocity(currentInitialVelocity()),
          "vf = " + formatVelocity(currentElasticFinalVelocity())
        ]
        : [
        "vi = " + formatVelocity(currentInitialVelocity()),
        "vf = " + formatVelocity(currentElasticFinalVelocity()),
        "|change in p| = |m(vf - vi)|",
        "|change in p| = " + formatMagnitude(currentElasticDeltaP())
      ];

      drawTextBox(x, y, compact ? 255 : 420, compact ? 112 : 150, "Elastic Ball", lines, {
        fill: "rgba(255,251,235,0.96)",
        stroke: "#f59e0b",
        titleColor: "#92400e",
        font: "17px Arial"
      });
    }

    function drawInelasticEquationPanel(x, y, compact = false) {
      const lines = compact
        ? [
          "vi = " + formatVelocity(currentInitialVelocity()),
          "vf = " + formatVelocity(currentInelasticFinalVelocity())
        ]
        : [
        "vi = " + formatVelocity(currentInitialVelocity()),
        "vf = " + formatVelocity(currentInelasticFinalVelocity()),
        "|change in p| = |m(vf - vi)|",
        "|change in p| = " + formatMagnitude(currentInelasticDeltaP())
      ];

      drawTextBox(x, y, compact ? 255 : 420, compact ? 112 : 150, "Inelastic Ball", lines, {
        fill: "rgba(239,246,255,0.96)",
        stroke: "#3b82f6",
        titleColor: "#1d4ed8",
        font: "17px Arial"
      });
    }

    function drawEquationPanels() {
      if (step === 3) {
        drawElasticEquationPanel(20, 220, true);
      } else if (step === 4) {
        drawInelasticEquationPanel(825, 220, true);
      }
    }

    function drawZeroMomentum(x, y, label, color) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(x - 18, y);
      ctx.lineTo(x + 18, y);
      ctx.stroke();

      ctx.font = "bold 16px Arial";
      ctx.textAlign = "left";
      ctx.fillText(label, x + 28, y + 5);
      ctx.restore();
    }

    function drawMomentumChangeSummary() {
      if (step !== 5) return;

      ctx.font = "bold 18px Arial";
      ctx.textAlign = "left";

      ctx.fillStyle = "#92400e";
      ctx.fillText("Elastic momentum", 90, 118);
      drawVector(120, 150, 76, "down", "pi = " + formatMomentum(currentInitialMomentum()), "#dc2626");
      drawVector(260, 300, 62, "up", "pf = " + formatMomentum(currentElasticFinalMomentum()), "#16a34a");
      ctx.fillStyle = "#111827";
      ctx.font = "bold 17px Arial";
      ctx.fillText("total change = " + formatMagnitude(currentElasticDeltaP()), 90, 350);

      ctx.fillStyle = "#1d4ed8";
      ctx.font = "bold 18px Arial";
      ctx.fillText("Inelastic momentum", 610, 118);
      drawVector(640, 150, 76, "down", "pi = " + formatMomentum(currentInitialMomentum()), "#dc2626");
      drawZeroMomentum(790, 300, "pf = " + formatMomentum(currentInelasticFinalMomentum()), "#1d4ed8");
      ctx.fillStyle = "#111827";
      ctx.font = "bold 17px Arial";
      ctx.fillText("total change = " + formatMagnitude(currentInelasticDeltaP()), 610, 350);
    }

    function drawReboundHeightMarker() {
      if (simPhase !== "reboundHeight") return;

      ctx.strokeStyle = "#64748b";
      ctx.setLineDash([7, 6]);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(35, reboundPeakY);
      ctx.lineTo(225, reboundPeakY);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = "#334155";
      ctx.font = "bold 16px Arial";
      ctx.textAlign = "left";
      ctx.fillText("rebound height", 45, reboundPeakY - 12);

    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGroundAndGuides();
      drawBall(elasticBall, "#facc15", "Elastic");
      drawBall(inelasticBall, "#60a5fa", "Inelastic");

      if (!celebrationActive && step >= 1 && step < 4 && hasSignConvention()) {
        drawVector(elasticBall.x + 48, elasticBall.y - 12, 80, "down", "vi = " + formatVelocity(currentInitialVelocity()), "#dc2626");
        drawVector(inelasticBall.x + 48, inelasticBall.y - 12, 80, "down", "vi = " + formatVelocity(currentInitialVelocity()), "#dc2626");
      }

      if (!celebrationActive && step >= 3 && step < 5 && simPhase !== "reboundHeight") {
        drawVector(elasticBall.x + 48, elasticBall.y + 12, 75, "up", "vf = " + formatVelocity(currentElasticFinalVelocity()), "#16a34a");

        ctx.strokeStyle = "#1d4ed8";
        ctx.fillStyle = "#1d4ed8";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(inelasticBall.x + 28, inelasticBall.y);
        ctx.lineTo(inelasticBall.x + 68, inelasticBall.y);
        ctx.stroke();

        ctx.font = "bold 16px Arial";
        ctx.textAlign = "left";
        ctx.fillText("vf = 0 m/s", inelasticBall.x + 80, inelasticBall.y + 5);
      }

      if (!celebrationActive) {
        drawReboundHeightMarker();
        drawEquationPanels();
        drawMomentumChangeSummary();
        drawSignConventionKey();
      }

      drawConfetti();
    }

    function setPreImpactStop() {
      elasticBall.y = preImpactY;
      elasticBall.vy = 0;
      elasticBall.bounced = false;
      inelasticBall.y = preImpactY;
      inelasticBall.vy = 0;
      inelasticBall.stopped = false;
      simPhase = "preImpact";
    }

    function setPostImpactStop() {
      elasticBall.y = postImpactY;
      elasticBall.vy = 0;
      elasticBall.bounced = true;
      inelasticBall.y = groundY;
      inelasticBall.vy = 0;
      inelasticBall.stopped = true;
      simPhase = "postImpact";
    }

    function updateToPreImpact(dt) {
      elasticBall.vy += canvasG * dt;
      elasticBall.y += elasticBall.vy * dt;

      inelasticBall.vy += canvasG * dt;
      inelasticBall.y += inelasticBall.vy * dt;

      if (elasticBall.y >= preImpactY || inelasticBall.y >= preImpactY) {
        running = false;
        animationPhase = "idle";
        demoFinished = true;
        setPreImpactStop();
        setStep(1);
      }
    }

    function schedulePredictionReplay() {
      clearPreviewReplay();
      if (step !== 0) return;

      previewReplayTimer = setTimeout(() => {
        previewReplayTimer = null;
        if (step === 0) {
          startPredictionReplay();
        }
      }, previewReplayDelayMs);
    }

    function startPredictionReplay() {
      if (step !== 0 || running) return;

      clearPreviewReplay();
      resetBallsToStart();
      running = true;
      animationPhase = "fullSimulationPreview";
      simPhase = "preview";
      lastTime = null;
      setFeedback("", "");
      renderChoiceGroups();
      updateControls();
      requestAnimationFrame(animate);
    }

    function updateFullSimulationPreview(dt) {
      if (!elasticBall.bounced) {
        elasticBall.vy += canvasG * dt;
        elasticBall.y += elasticBall.vy * dt;

        if (elasticBall.y >= groundY) {
          elasticBall.y = groundY;
          elasticBall.vy = -Math.abs(elasticBall.vy) * restitution;
          elasticBall.bounced = true;
          simPhase = "postImpact";
        }
      } else {
        elasticBall.vy += canvasG * dt;
        elasticBall.y += elasticBall.vy * dt;
      }

      if (!inelasticBall.stopped) {
        inelasticBall.vy += canvasG * dt;
        inelasticBall.y += inelasticBall.vy * dt;

        if (inelasticBall.y >= groundY) {
          inelasticBall.y = groundY;
          inelasticBall.vy = 0;
          inelasticBall.stopped = true;
        }
      }

      if (elasticBall.bounced && (elasticBall.vy >= 0 || elasticBall.y <= reboundPeakY)) {
        running = false;
        animationPhase = "idle";
        elasticBall.y = reboundPeakY;
        elasticBall.vy = 0;
        simPhase = "reboundHeight";
        setFeedback("", "");
        renderChoiceGroups();
        updateControls();
        draw();
        schedulePredictionReplay();
      }
    }

    function startCelebration() {
      clearAutoAdvance();
      clearPreviewReplay();
      resetBallsToStart();
      createConfetti();
      celebrationActive = true;
      running = true;
      animationPhase = "celebrationReplay";
      simPhase = "celebration";
      lastTime = null;
      setFeedback(celebrationMessage, "good");
      renderChoiceGroups();
      updateControls();
      requestAnimationFrame(animate);
    }

    function updateCelebrationReplay(dt) {
      if (!elasticBall.bounced) {
        elasticBall.vy += canvasG * dt;
        elasticBall.y += elasticBall.vy * dt;

        if (elasticBall.y >= groundY) {
          elasticBall.y = groundY;
          elasticBall.vy = -Math.abs(elasticBall.vy) * restitution;
          elasticBall.bounced = true;
          simPhase = "postImpact";
        }
      } else {
        elasticBall.vy += canvasG * dt;
        elasticBall.y += elasticBall.vy * dt;
      }

      if (!inelasticBall.stopped) {
        inelasticBall.vy += canvasG * dt;
        inelasticBall.y += inelasticBall.vy * dt;

        if (inelasticBall.y >= groundY) {
          inelasticBall.y = groundY;
          inelasticBall.vy = 0;
          inelasticBall.stopped = true;
        }
      }

      if (elasticBall.bounced && (elasticBall.vy >= 0 || elasticBall.y <= reboundPeakY)) {
        running = false;
        animationPhase = "idle";
        elasticBall.y = reboundPeakY;
        elasticBall.vy = 0;
        simPhase = "reboundHeight";
        setFeedback(celebrationMessage, "good");
        renderChoiceGroups();
        updateControls();
        draw();
      }
    }

    function updateThroughImpact(dt) {
      if (!elasticBall.bounced) {
        elasticBall.vy += canvasG * dt;
        elasticBall.y += elasticBall.vy * dt;

        if (elasticBall.y >= groundY) {
          elasticBall.y = groundY;
          elasticBall.vy = -Math.abs(elasticBall.vy) * restitution;
          elasticBall.bounced = true;
        }
      } else {
        elasticBall.vy += canvasG * dt;
        elasticBall.y += elasticBall.vy * dt;
      }

      if (!inelasticBall.stopped) {
        inelasticBall.vy += canvasG * dt;
        inelasticBall.y += inelasticBall.vy * dt;

        if (inelasticBall.y >= groundY) {
          inelasticBall.y = groundY;
          inelasticBall.vy = 0;
          inelasticBall.stopped = true;
        }
      }

      if (elasticBall.bounced && elasticBall.y <= postImpactY) {
        running = false;
        animationPhase = "idle";
        setPostImpactStop();
        setFeedback("Stopped just after impact. Now compare the final velocities.", "");
        setStep(3);
      }
    }

    function updateToReboundHeight(dt) {
      elasticBall.vy += canvasG * dt;
      elasticBall.y += elasticBall.vy * dt;

      if (elasticBall.vy >= 0 || elasticBall.y <= reboundPeakY) {
        running = false;
        animationPhase = "idle";
        elasticBall.y = reboundPeakY;
        elasticBall.vy = 0;
        simPhase = "reboundHeight";
        setFeedback("Elastic ball reached rebound height. At that top point its velocity is momentarily 0 m/s.", "answer-key");
        renderChoiceGroups();
        updateControls();
        draw();
      }
    }

    function update(dt) {
      if (animationPhase === "toPreImpact") {
        updateToPreImpact(dt);
      } else if (animationPhase === "fullSimulationPreview") {
        updateFullSimulationPreview(dt);
      } else if (animationPhase === "celebrationReplay") {
        updateCelebrationReplay(dt);
      } else if (animationPhase === "throughImpact") {
        updateThroughImpact(dt);
      } else if (animationPhase === "toReboundHeight") {
        updateToReboundHeight(dt);
      }

      updateConfetti(dt);
    }

    function animate(ts) {
      if (!running) return;

      if (lastTime === null) lastTime = ts;
      const dt = Math.min((ts - lastTime) / 1000, 0.03);
      lastTime = ts;

      update(dt);
      draw();
      requestAnimationFrame(animate);
    }

    function startDrop() {
      if (running) return;

      startPredictionReplay();
    }

    function startImpact() {
      if (running) return;

      clearAutoAdvance();
      if (simPhase !== "preImpact") {
        setPreImpactStop();
      }

      running = true;
      animationPhase = "throughImpact";
      lastTime = null;
      elasticBall.vy = impactSpeedPx;
      inelasticBall.vy = impactSpeedPx;
      setFeedback("Watch the collision. The next stop is just after impact.", "");
      renderChoiceGroups();
      updateControls();
      requestAnimationFrame(animate);
    }

    function startReboundHeight() {
      if (running) return;

      clearAutoAdvance();
      if (simPhase !== "postImpact") {
        setPostImpactStop();
      }

      running = true;
      animationPhase = "toReboundHeight";
      lastTime = null;
      elasticBall.vy = -Math.sqrt(2 * canvasG * (postImpactY - reboundPeakY));
      setFeedback("Watch the elastic ball travel back upward to its rebound height.", "");
      renderChoiceGroups();
      updateControls();
      requestAnimationFrame(animate);
    }

    function nextStep() {
      if (step >= finalStep) return;

      clearAutoAdvance();
      if (step === 0) {
        if (!isStepComplete(step)) {
          setFeedback("Choose a prediction on the canvas before moving on.", "needs-work");
          return;
        }

        clearPreviewReplay();
        running = false;
        animationPhase = "idle";
        demoFinished = true;
        setPreImpactStop();
        setStep(1);
        return;
      }

      if (!demoFinished) return;

      if (!isStepComplete(step)) {
        setFeedback("Answer the question on the canvas before moving on.", "needs-work");
        return;
      }

      if (step === 2 && simPhase === "preImpact") {
        startImpact();
        return;
      }

      if (simPhase === "reboundHeight" && step >= 3) {
        setPostImpactStop();
      }

      setStep(step + 1);
    }

    function wrongFeedbackForStep() {
      if (step === 1) {
        return "Choose one sign convention and keep it consistent for the rest of the problem.";
      }

      if (step === 2) {
        return "Use p = mv with m = 0.10 kg and vi = " + formatVelocity(currentInitialVelocity()) + ".";
      }

      if (step === 3) {
        return "For the elastic ball, subtract the signed initial velocity from the signed upward final velocity.";
      }

      if (step === 4) {
        return "For the inelastic ball, the final velocity is 0, but you still subtract the signed initial velocity.";
      }

      if (step === 5) {
        return "Look at the sign of momentum before and after impact. One ball reverses direction; the other only goes to zero.";
      }

      return "Try that one again.";
    }

    function handleChoiceClick(event) {
      const button = event.target.closest(".choice-button");
      if (!button) return;

      const current = questionSteps[step];
      const group = current.groups.find((item) => item.id === button.dataset.groupId);
      if (!group) return;

      const choice = findChoice(group, button.dataset.choiceValue);
      if (!choice) return;

      if (choice.action === "drop") {
        startDrop();
        return;
      }

      if (choice.action === "rebound") {
        startReboundHeight();
        return;
      }

      const stepAnswers = getCurrentAnswers();
      stepAnswers[group.id] = choice.value;

      if (group.id === "viSign") {
        signConvention = choice.value;
        answers[2] = {};
      }

      if (group.id === "prediction") {
        prediction = choice.value;
      }

      renderChoiceGroups();

      if (step === finalStep && group.id === "reasonChoice" && choice.correct) {
        window.RiseWalkthrough.complete();
        startCelebration();
        return;
      }

      if (isStepComplete(step)) {
        setFeedback(
          completeFeedbackForStep(step),
          "good"
        );
      } else if (choice.correct) {
        setFeedback("Good. Answer the remaining question on the canvas.", "good");
      } else {
        setFeedback(wrongFeedbackForStep(), "needs-work");
      }

      updateControls();
      draw();
    }

    resetBtn.addEventListener("click", resetDemo);
    nextBtn.addEventListener("click", nextStep);
    choiceArea.addEventListener("click", handleChoiceClick);

    resetDemo();
  </script>
  </main>
</body>
</html>
