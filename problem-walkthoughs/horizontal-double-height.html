<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Castle Launch: Scaling Projectiles</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #f1f5f9;
    }
    body {
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: Arial, Helvetica, sans-serif;
    }
    @media (max-width: 760px) {
      body { padding: 10px; }
    }
  </style>
</head>
<body>
<style>
.rh{--blue:#28609f;--dark:#173f66;--bg:#edf5fb;--line:#d7e2ef;--text:#1f2937;--muted:#64748b;max-width:1260px;margin:auto;padding:10px;border-radius:20px;background:var(--blue);font-family:Arial,Helvetica,sans-serif;color:var(--text);width:100%}
.rh,.rh *{box-sizing:border-box}.rh button{font:inherit}.rh .card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 12px 30px #0f172a22}.rh .scene{position:relative;aspect-ratio:2/1;min-height:380px;overflow:hidden;background:linear-gradient(var(--bg) 0 86%,#cbd5e1 86%)}
.rh .scene:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#0f172a12 1px,transparent 1px),linear-gradient(90deg,#0f172a12 1px,transparent 1px);background-size:48px 48px;opacity:.35}
.rh .board{position:absolute;right:1%;top:2%;z-index:2;width:auto;min-width:25%;min-height:48px;padding:10px 14px;border:2px solid #94a3b8;border-radius:12px;background:#dbeafe;font-weight:800;font-size:clamp(1rem,1.8vw,1.15rem);line-height:1.15;text-align:center}
.rh .ground{position:absolute;left:0;right:0;bottom:13.5%;z-index:1;border-top:2px solid #47556955}

/* Castle Tower (Stretched height from 60% to 76%) */
.rh .tower{position:absolute;left:5%;bottom:13.5%;width:11%;height:76%;background-color:#94a3b8;background-image:url("data:image/svg+xml,%3Csvg width='32' height='32' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0h2v14H0zM0 14h32v2H0zM16 16h2v14H16zM0 30h32v2H0z' fill='%23475569'/%3E%3C/svg%3E");border:3px solid #334155;border-bottom:none;z-index:3}
/* Tower shading overlay */
.rh .tower:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#fff3 0 10%,transparent 40%,#0004 90% 100%);pointer-events:none}
/* Battlements (teeth at the top) */
.rh .tower:before{content:"";position:absolute;top:-16px;left:-3px;right:-3px;height:16px;background-image:repeating-linear-gradient(90deg,#94a3b8 0,#94a3b8 22px,transparent 22px,transparent 32px);border-bottom:3px solid #334155;z-index:5}
/* Archway Door */
.rh .door{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:35%;height:15%;background:#1e293b;border:3px solid #334155;border-bottom:none;border-radius:40px 40px 0 0;z-index:4;overflow:hidden}
/* Portcullis bars */
.rh .door:after{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(90deg, transparent, transparent 6px, #0f172a 6px, #0f172a 8px);opacity:0.6}
/* Stone Ledges (Beefed up significantly) */
.rh .ledge{position:absolute;left:0;right:-30%;height:18px;background:#94a3b8;border:2px solid #334155;border-left:none;border-radius:0 4px 4px 0;z-index:4}
.rh .ledge.l1{bottom:calc(25% - 18px)} .rh .ledge.l2{bottom:calc(50% - 18px)} .rh .ledge.l3{bottom:calc(75% - 18px)} .rh .ledge.l4{bottom:calc(100% - 18px)}
/* Corbel supports under ledges */
.rh .ledge:before{content:"";position:absolute;left:calc(100% / 1.3 + 3px);top:15px;width:20px;height:20px;background:#64748b;clip-path:polygon(100% 0, 0 0, 0 100%);z-index:-1}
/* Cannons (Adjusted positioning) */
.rh .cannon{position:absolute;right:0;bottom:calc(100% + 1px);width:34px;height:20px;background:#1e293b;border-radius:17px 17px 0 0;z-index:5;border:2px solid #0f172a;border-bottom:none}
.rh .cannon:before{content:"";position:absolute;right:-40px;top:1px;width:46px;height:12px;background:#0f172a;border-radius:2px}
/* Fuse and Spark */
.rh .cannon:after{content:"";position:absolute;left:-16px;top:-6px;width:16px;height:16px;border-bottom:3px solid #475569;border-left:3px solid #475569;border-top:none;border-right:none;border-radius:0 0 0 20px;z-index:-1}
.rh .spark{position:absolute;left:-25px;top:-15px;width:18px;height:18px;background:radial-gradient(circle,#ffffff 10%,#fde047 30%,#ef4444 60%,transparent 80%);border-radius:50%;opacity:0;pointer-events:none;z-index:6;box-shadow:0 0 8px #f97316}
@keyframes sizzle{0%{transform:scale(0.7) translate(1px,-1px);opacity:0.8}33%{transform:scale(1.2) translate(-1px,1px);opacity:1}66%{transform:scale(0.8) translate(1px,1px);opacity:0.9}100%{transform:scale(1.3) translate(-1px,-1px);opacity:1}}
.rh .ledge.lit .spark{opacity:1;animation:sizzle 0.15s infinite}

/* Knights */
.rh .knight{position:absolute;right:52px;bottom:calc(100% + 7px);width:14px;height:16px;background:var(--armor);border-radius:4px 4px 2px 2px;z-index:3}
.rh .knight:before{content:"";position:absolute;top:-12px;left:-2px;width:16px;height:14px;background:#cbd5e1;border-radius:6px;box-shadow:inset 0 -3px #94a3b8}
.rh .knight:after{content:"";position:absolute;top:-8px;right:-1px;width:7px;height:3px;background:#0f172a;border-radius:2px}
.rh .knight .plume{position:absolute;top:-20px;left:0;width:10px;height:8px;background:var(--armor);border-radius:50% 50% 0 0}
.rh .knight .plume:after{content:"";position:absolute;top:4px;left:-6px;width:8px;height:6px;background:var(--armor);border-radius:4px}
.rh .knight .limbs{position:absolute;bottom:-6px;left:2px;width:4px;height:6px;background:#64748b;border-radius:2px;box-shadow:6px 0 0 #64748b}
.rh .knight .limbs:after{content:"";position:absolute;top:-12px;left:4px;width:5px;height:12px;background:var(--armor);border-radius:3px;transform:rotate(-40deg);transform-origin:top center;box-shadow:inset 0 -2px #0003;z-index:4}

/* Hitboxes for Cannons (Expanded to cover the taller level gaps) */
.rh .hitbox{display:none;position:absolute;top:-65px;bottom:-18px;left:-10px;right:-55px;background:transparent;border:2px dashed transparent;border-radius:12px;z-index:30;cursor:pointer;opacity:0;transition:.2s}
.rh.ask .hitbox{display:block}
.rh.ask .hitbox:hover,.rh.ask .hitbox:focus-visible{opacity:1;background:#ffffff1a;border-color:var(--armor);box-shadow:inset 0 0 8px var(--armor);outline:none}

/* Target Flag */
.rh .target{position:absolute;bottom:13.5%;width:4px;height:30px;background:#94a3b8;z-index:2;transition:left 1s cubic-bezier(0.4, 0, 0.2, 1);opacity:0}
.rh .target:after{content:"";position:absolute;left:4px;top:0;border-top:10px solid #ef4444;border-right:16px solid transparent;border-bottom:10px solid #ef4444}
.rh .target.show{opacity:1}

/* Paths & Ball */
.rh svg{position:absolute;inset:0;z-index:7;width:100%;height:100%;overflow:visible;pointer-events:none}
.rh .path-base{fill:none;stroke:#94a3b8;stroke-width:3;stroke-dasharray:6 6;opacity:0;transition:opacity .3s}
.rh .path{fill:none;stroke:#28609fb8;stroke-width:3;stroke-dasharray:9 8;stroke-linecap:round;opacity:0;transition:.2s}
.rh .ball{position:absolute;z-index:9;width:clamp(10px,1.25vw,14px);height:clamp(10px,1.25vw,14px);border-radius:50%;border:1px solid #0f172a55;box-shadow:0 2px 4px #0f172a29;will-change:left,top,transform;background:radial-gradient(circle at 34% 30%,#fff6 0 12%,transparent 20%),radial-gradient(circle,#64748b,#334155 62%,#0f172a)}
.rh .preview{z-index:10;opacity:0;pointer-events:none;box-shadow:0 0 0 3px #fff,0 6px 14px #0f172a2e;transition:opacity .14s}
.rh .preview.show{opacity:.6}

/* UI Controls */
.rh .banner{position:absolute;right:1%;top:calc(2% + 64px);z-index:20;width:min(420px,45%);padding:14px;border:2px solid #28609f38;border-radius:18px;background:#fffffff5;box-shadow:0 12px 24px #0f172a1f}
.rh h3{margin:0 0 8px;color:var(--dark);font-size:clamp(1.05rem,1.8vw,1.25rem)}.rh p{margin:0;color:var(--muted);line-height:1.4}
.rh .choices{display:none;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.rh .choice,.rh .main{border:0;border-radius:14px;padding:12px 14px;font-weight:800;cursor:pointer}
.rh .choice{min-height:52px;text-align:center;background:#fff;color:var(--dark);border:2px solid var(--armor);font-size:1rem;opacity:0.85;transition:.2s}
.rh .choice.on{background:var(--armor);color:#fff;opacity:1}
.rh .main{background:var(--blue);color:#fff}
.rh button:hover,.rh button:focus-visible{transform:translateY(-1px);box-shadow:0 8px 18px #0f172a24;outline:3px solid #28609f40}
.rh button:disabled{background:#94a3b8;cursor:not-allowed;transform:none;box-shadow:none;opacity:.8}
.rh .hitbox:disabled{background:transparent;border-color:transparent;box-shadow:none;opacity:0;cursor:default;outline:none;transform:none}
.rh .bar{position:absolute;left:8%;bottom:2%;z-index:21;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rh .help{color:var(--muted);font-size:.9rem;font-weight:700}.rh .warn{color:#b45309}
.rh .fb{display:none;margin-top:12px;padding:12px;border-left:6px solid var(--blue);border-radius:12px;background:#eff6ff;line-height:1.4;font-size:.95rem}
.rh .fb strong{display:block;margin-bottom:4px;color:var(--dark)}
.rh .good{border-color:#0f766e;background:#ecfdf5}.rh .bad{border-color:#b45309;background:#fff7ed}
@media(max-width:760px){.rh .scene{aspect-ratio:4/3}.rh .board{top:2%;right:3%;width:auto;padding:8px 10px}.rh .banner{top:calc(2% + 56px);right:3%;width:min(360px,75%)}.rh .bar{left:4%;right:4%;bottom:4%}}
@media(prefers-reduced-motion:reduce){.rh *{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>

<section class="rh" data-rh aria-label="Projectile height and range interaction">
  <div class="card"><div class="scene" data-scene>
    <div class="board">Height vs Range</div>
    <div class="ground"></div>
    
    <!-- Castle Elements -->
    <div class="tower">
      <div class="door"></div>
      <div class="ledge l4" data-ledge="4" style="--armor:#ef4444"><button class="hitbox" type="button" data-choice="4" aria-label="Select Level 4"></button><div class="knight"><div class="plume"></div><div class="limbs"></div></div><div class="cannon"><div class="spark"></div></div></div>
      <div class="ledge l3" data-ledge="3" style="--armor:#eab308"><button class="hitbox" type="button" data-choice="3" aria-label="Select Level 3"></button><div class="knight"><div class="plume"></div><div class="limbs"></div></div><div class="cannon"><div class="spark"></div></div></div>
      <div class="ledge l2" data-ledge="2" style="--armor:#22c55e"><button class="hitbox" type="button" data-choice="2" aria-label="Select Level 2"></button><div class="knight"><div class="plume"></div><div class="limbs"></div></div><div class="cannon"><div class="spark"></div></div></div>
      <div class="ledge l1" data-ledge="1" style="--armor:#3b82f6"><div class="knight"><div class="plume"></div><div class="limbs"></div></div><div class="cannon"><div class="spark"></div></div></div>
    </div>
    
    <div class="target" data-target></div>
    
    <svg data-svg aria-hidden="true">
      <path class="path-base" data-path-base></path>
      <path class="path" data-path></path>
    </svg>
    
    <div class="ball preview" data-preview aria-hidden="true"></div>
    <div class="ball" data-ball aria-label="Cannonball"></div>
    
    <div class="banner">
      <div data-text aria-live="polite">
        <h3>Baseline Shot</h3>
        <p>Click start. The Level 1 cannon will fire to establish our baseline distance.</p>
      </div>
      <div class="choices" data-choices aria-label="Prediction choices">
        <button class="choice" type="button" data-choice="2" style="--armor:#22c55e">Level 2</button>
        <button class="choice" type="button" data-choice="3" style="--armor:#eab308">Level 3</button>
        <button class="choice" type="button" data-choice="4" style="--armor:#ef4444">Level 4</button>
      </div>
      <div class="fb" data-fb aria-live="polite"></div>
    </div>
    <div class="bar"><button class="main" type="button" data-main>Fire Baseline</button><span class="help" data-help></span></div>
  </div></div>
</section>

<script>
(()=>{
  const root=document.currentScript.previousElementSibling;if(!root?.matches('[data-rh]'))return;
  const $=q=>root.querySelector(q),$$=q=>[...root.querySelectorAll(q)];
  
  const scene=$('[data-scene]'), svg=$('[data-svg]'), pathBase=$('[data-path-base]'), path=$('[data-path]'),
        ball=$('[data-ball]'), previewBall=$('[data-preview]'), target=$('[data-target]'),
        text=$('[data-text]'), choices=$('[data-choices]'), btns=$$('[data-choice]'),
        main=$('[data-main]'), help=$('[data-help]'), fb=$('[data-fb]'), ledges=$$('[data-ledge]');
        
  let state='setup', picked=0, busy=false, raf=0, token=0, autoResetTimer=0;
  const T={flightBase:1000}; 
  
  const put=(el,x,y)=>{
    let rad=el.offsetWidth/2;
    el.style.left=(x-rad)+'px';
    el.style.top=(y-rad)+'px';
  };
  
  const clearPreview=()=>{
    previewBall.classList.remove('show');
    ledges.forEach(l => l.classList.remove('lit'));
  };
  const markPreview=(L,level)=>{
    put(previewBall, L.originX, L.levels[level].y);
    previewBall.classList.add('show');
    ledges.forEach(l => l.classList.toggle('lit', parseInt(l.dataset.ledge) === level));
  };

  function layout(){
    let sr=scene.getBoundingClientRect();
    let ballRad=ball.offsetWidth/2;
    let gy = sr.height * 0.865 - ballRad; 
    
    // Adjusted origin to match the much longer cannon barrels
    // Tower is 11% wide + 5% left = 16%. Ledge overhangs another ~3.3%. Barrel extends 40px.
    let originX = sr.width * 0.193 + 38; 
    
    let levels = {};
    ledges.forEach(l => {
      let r = l.getBoundingClientRect();
      // Exactly align height to the center of the barrel:
      // Ledge top is r.top. Cannon is 1px above. Cannon height is 20px. 
      // Barrel center is 11px above the ledge surface.
      levels[l.dataset.ledge] = { y: r.top - sr.top - 11 }; 
    });
    
    let h1 = gy - levels[1].y; 
    let ay = 2 * h1 / ( (T.flightBase/1000)**2 ); 
    
    // Increased by 10% (from 0.28 to 0.308)
    let d1 = sr.width * 0.308; 
    let vx = d1 / (T.flightBase/1000);
    
    for(let i=1; i<=4; i++){
      let height = gy - levels[i].y;
      let t = Math.sqrt(2 * height / ay);
      levels[i].time = t;
      levels[i].dist = vx * t;
      levels[i].hitX = originX + levels[i].dist;
    }
    
    svg.setAttribute('viewBox',`0 0 ${sr.width} ${sr.height}`);
    return {sr, ballRad, gy, originX, ay, vx, levels};
  }

  const pos=(L, level, t)=>({
    x: L.originX + L.vx * t,
    y: L.levels[level].y + 0.5 * L.ay * t * t
  });

  function getPathStr(L, level){
    let tMax = L.levels[level].time;
    let d = `M ${L.originX} ${L.levels[level].y}`;
    for(let i=1; i<=24; i++){
      let q = pos(L, level, tMax * i/24);
      d += ` L ${q.x} ${q.y}`;
    }
    return d;
  }

  function setBusy(v){busy=v;main.disabled=v;btns.forEach(b=>b.disabled=v)}
  function msg(s,w=false){help.textContent=s;help.classList.toggle('warn',w)}
  function feedback(html,ok){
    fb.style.display=html?'block':'none';
    fb.className='fb '+(ok?'good':'bad');
    fb.innerHTML=html||'';
  }
  function clearAutoReset(){
    if(autoResetTimer){
      clearTimeout(autoResetTimer);
      autoResetTimer=0;
    }
  }
  function resetQuestionView(){
    let L=layout();
    picked=0;
    clearPreview();
    btns.forEach(b=>{b.classList.remove('on'); b.setAttribute('aria-pressed','false')});
    path.style.opacity=0;
    pathBase.setAttribute('d', getPathStr(L, 1));
    pathBase.style.opacity=1;
    target.style.left = (L.levels[4].hitX - target.offsetWidth/2) + 'px';
    target.classList.add('show');
    put(ball, L.originX, L.levels[1].y);
    feedback('',false);
  }
  function returnToQuestion(){
    clearAutoReset();
    resetQuestionView();
    screen('question');
  }
  function scheduleQuestionReset(){
    clearAutoReset();
    if(picked === 4)return;
    msg('Returning to choices in 5 seconds. Press Try Again to pick now.', true);
    autoResetTimer=setTimeout(()=>{
      autoResetTimer=0;
      if(state !== 'done' || busy || picked === 4)return;
      returnToQuestion();
    }, 5000);
  }

  function reset(){
    clearAutoReset();
    cancelAnimationFrame(raf); token++; picked=0; clearPreview();
    btns.forEach(b=>{b.classList.remove('on'); b.setAttribute('aria-pressed','false')});
    let L=layout();
    pathBase.style.opacity=0;
    path.style.opacity=0;
    target.classList.remove('show');
    target.style.left = L.levels[1].hitX + 'px';
    put(ball, L.originX, L.levels[1].y);
    feedback('',false); msg('');
  }

  function screen(next){
    state=next;
    root.classList.toggle('ask', next === 'question');
    if(next==='setup'){
      clearAutoReset();
      text.innerHTML='<h3>Baseline Shot</h3><p>Click start. The Level 1 cannon will fire to establish our baseline distance.</p>';
      choices.style.display='none';
      main.textContent='Fire Baseline';
      reset();
    }
    if(next==='question'){
      clearAutoReset();
      text.innerHTML='<h3>Double the Range</h3><p>The target has moved exactly <strong>twice</strong> as far away. Assuming horizontal velocity ($v_x$) is identical, which level must fire to hit it?</p>';
      choices.style.display='grid';
      main.textContent='Reset';
      msg('Select a level to test.');
    }
    if(next==='done'){
      let ok = picked === 4;
      text.innerHTML=`<h3>Result</h3><p>Level ${picked} fired.</p>`;
      choices.style.display=ok?'none':'grid';
      main.textContent='Try Again';
      feedback(ok ? 
        `<strong>Spot on!</strong> Horizontal distance relates linearly to time ($x = v_xt$). To double the distance, you must double the time in the air. Since $y = \\frac{1}{2}gt^2$, doubling time requires $2^2 = 4$ times the height!` : 
        `<strong>Not quite.</strong> Horizontal distance requires more time in the air. Remember, height depends on time squared.`, ok);
      msg(ok ? 'Perfect hit.' : 'Target missed.');
      if(!ok) scheduleQuestionReset();
    }
  }

  function animate(ms,fn){
    let my=++token, t0=performance.now();
    return new Promise(res=>{
      function step(now){
        if(my!==token)return;
        let p=Math.min(1,(now-t0)/ms);
        fn(p);
        p<1 ? raf=requestAnimationFrame(step) : res();
      }
      raf=requestAnimationFrame(step);
    });
  }

  async function playSetup(){
    if(busy)return;
    setBusy(true);
    let L=layout();
    
    pathBase.setAttribute('d', getPathStr(L, 1));
    pathBase.style.opacity=1;
    target.style.left = (L.levels[1].hitX - target.offsetWidth/2) + 'px';
    target.classList.add('show');
    main.textContent='Firing...';
    msg('Establishing baseline...');
    
    // Light the fuse for Level 1 baseline
    ledges.find(l => parseInt(l.dataset.ledge) === 1).classList.add('lit');
    
    let ms = L.levels[1].time * 1000;
    await animate(ms, p => {
      let t = L.levels[1].time * p;
      let q = pos(L, 1, t);
      put(ball, q.x, q.y);
    });
    
    // Extinguish fuse after firing
    ledges.find(l => parseInt(l.dataset.ledge) === 1).classList.remove('lit');
    
    msg('Moving target to 2x distance...');
    await animate(1000, p => { 
      target.style.left = (L.levels[4].hitX - target.offsetWidth/2) + 'px';
    });
    
    setBusy(false);
    screen('question');
  }

  async function reveal(level){
    if(busy)return;
    clearPreview();
    root.classList.remove('ask');
    
    // Light the fuse for the chosen cannon
    ledges.find(l => parseInt(l.dataset.ledge) === level).classList.add('lit');
    
    setBusy(true);
    choices.style.display='none';
    main.textContent='Firing...';
    msg(`Firing Level ${level}...`);
    
    let L=layout();
    path.setAttribute('d', getPathStr(L, level));
    path.style.opacity=1;
    
    let ms = L.levels[level].time * 1000;
    await animate(ms, p => {
      let t = L.levels[level].time * p;
      let q = pos(L, level, t);
      put(ball, q.x, q.y);
    });
    
    // Extinguish fuse after firing
    ledges.find(l => parseInt(l.dataset.ledge) === level).classList.remove('lit');
    
    setBusy(false);
    screen('done');
  }

  btns.forEach(b=>{
    let level = parseInt(b.dataset.choice);
    b.setAttribute('aria-pressed','false');
    b.addEventListener('mouseenter', ()=> { if(!busy && state==='question') markPreview(layout(), level); });
    b.addEventListener('mouseleave', clearPreview);
    b.addEventListener('focus', ()=> { if(!busy && state==='question') markPreview(layout(), level); });
    b.addEventListener('blur', clearPreview);
    b.addEventListener('click', ()=>{
      if(busy)return;
      clearAutoReset();
      picked=level;
      btns.forEach(x=>{
        let match = parseInt(x.dataset.choice) === picked;
        x.classList.toggle('on', match);
        x.setAttribute('aria-pressed', match?'true':'false');
      });
      reveal(level);
    });
  });

  main.addEventListener('click',()=> {
    clearAutoReset();
    if(state==='setup') playSetup();
    else if(state==='done' && picked !== 4) returnToQuestion();
    else screen('setup');
  });
  addEventListener('resize',()=> { if(!busy) screen('setup') });
  
  screen('setup');
})();
</script>
</body>
</html>
