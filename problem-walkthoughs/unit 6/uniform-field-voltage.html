<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uniform-Field Voltage Model</title>
  <style>
    html, body {
      background: transparent;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    .app {
      max-width: 720px;
      margin: 0 auto;
      padding: 8px;
      box-sizing: border-box;
    }
    .card {
      border: 5px solid #285f9f;
      border-radius: 12px;
      background: #f8fafc;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #e2e8f0;
      border-bottom: 1px solid #cbd5e1;
    }
    .header h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      color: #1e293b;
    }
    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #0f172a;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .prompt-area {
      padding: 12px;
      background: #fff;
      border-top: 1px solid #e2e8f0;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .prompt {
      margin: 0;
      font-size: 0.95rem;
      color: #1e293b;
      line-height: 1.4;
    }
    .choices {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .choices button {
      flex: 1 1 100px;
      padding: 10px 12px;
      font-size: 0.9rem;
      font-weight: 600;
      border: 2px solid #285f9f;
      border-radius: 8px;
      background: #fff;
      color: #1e293b;
      cursor: pointer;
      min-height: 44px;
    }
    .choices button:hover, .choices button:focus {
      background: #dbeafe;
      outline: 2px solid #285f9f;
      outline-offset: 2px;
    }
    .feedback {
      margin: 0;
      font-size: 0.9rem;
      color: #0f172a;
      min-height: 1.4em;
    }
    .main-btn {
      align-self: flex-start;
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: #285f9f;
      color: #fff;
      cursor: pointer;
      min-height: 44px;
    }
    .main-btn:hover, .main-btn:focus {
      background: #1e4a7a;
      outline: 2px solid #1e4a7a;
      outline-offset: 2px;
    }
    .hidden { display: none !important; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .controls label {
      font-size: 0.85rem;
      color: #334155;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .controls input[type="range"] {
      width: 140px;
    }
    .eq {
      font-family: ui-monospace, monospace;
      background: #e2e8f0;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card" data-wt>
      <div class="header">
        <h1>Uniform-Field Voltage Model</h1>
        <button class="main-btn" data-reset style="padding:6px 12px;font-size:0.85rem;background:#64748b;">Reset</button>
      </div>
      <div class="stage" aria-label="Parallel plates with adjustable field and separation">
        <canvas id="c" width="640" height="360" role="img" aria-label="Parallel plates showing potential difference"></canvas>
      </div>
      <div class="prompt-area" aria-live="polite">
        <p class="prompt" data-prompt>Parallel plates create a uniform field.</p>
        <div class="choices" data-choices hidden>
          <button data-choice="larger">Larger ΔV</button>
          <button data-choice="smaller">Smaller ΔV</button>
          <button data-choice="same">Same ΔV</button>
        </div>
        <div class="controls" data-controls hidden>
          <label>E (N/C)
            <input type="range" id="eSlider" min="50" max="300" value="100" step="10">
          </label>
          <label>d (m)
            <input type="range" id="dSlider" min="0.1" max="0.5" value="0.2" step="0.05">
          </label>
          <span class="eq" data-eq>ΔV = −E d = ?</span>
        </div>
        <p class="feedback" data-feedback></p>
        <button class="main-btn" data-main>Start</button>
      </div>
    </section>
  </main>

  <script>
    (function() {
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      const promptEl = document.querySelector('[data-prompt]');
      const choicesEl = document.querySelector('[data-choices]');
      const feedbackEl = document.querySelector('[data-feedback]');
      const mainBtn = document.querySelector('[data-main]');
      const resetBtn = document.querySelector('[data-reset]');
      const controlsEl = document.querySelector('[data-controls]');
      const eqEl = document.querySelector('[data-eq]');
      const eSlider = document.getElementById('eSlider');
      const dSlider = document.getElementById('dSlider');

      let state = 'setup'; // setup → predict → adjust → explain
      let prediction = null;
      let E = 100;
      let d = 0.2;
      let showResult = false;
      let completed = false;

      function draw() {
        const W = canvas.width;
        const H = canvas.height;
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, W, H);

        // plates
        const plateH = 22;
        const maxGap = 180;
        const gap = 40 + (d - 0.1) / 0.4 * maxGap;
        const topY = (H - gap - 2 * plateH) / 2;
        const botY = topY + plateH + gap;

        ctx.fillStyle = '#ef4444';
        ctx.fillRect(60, topY, W - 120, plateH);
        ctx.fillStyle = '#3b82f6';
        ctx.fillRect(60, botY, W - 120, plateH);

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('+  V_high', W / 2, topY + 16);
        ctx.fillText('−  V_low', W / 2, botY + 16);

        // field arrows density based on E
        const arrowCount = Math.max(3, Math.floor(E / 40));
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.7)';
        ctx.lineWidth = 2;
        const spacing = (W - 160) / (arrowCount + 1);
        for (let i = 1; i <= arrowCount; i++) {
          const x = 80 + i * spacing;
          ctx.beginPath();
          ctx.moveTo(x, topY + plateH + 8);
          ctx.lineTo(x, botY - 8);
          ctx.lineTo(x - 5, botY - 18);
          ctx.moveTo(x, botY - 8);
          ctx.lineTo(x + 5, botY - 18);
          ctx.stroke();
        }

        // d label
        ctx.strokeStyle = '#94a3b8';
        ctx.beginPath();
        ctx.moveTo(40, topY + plateH);
        ctx.lineTo(40, botY);
        ctx.stroke();
        ctx.fillStyle = '#e2e8f0';
        ctx.font = '12px system-ui';
        ctx.textAlign = 'right';
        ctx.fillText('d = ' + d.toFixed(2) + ' m', 36, (topY + botY) / 2 + 4);

        // E label
        ctx.textAlign = 'left';
        ctx.fillText('E = ' + E + ' N/C', 70, H - 16);

        if (showResult) {
          const dV = E * d;
          ctx.fillStyle = '#fbbf24';
          ctx.font = 'bold 16px system-ui';
          ctx.textAlign = 'center';
          ctx.fillText('ΔV = E d = ' + dV.toFixed(1) + ' V', W / 2, H / 2);
        }
      }

      function updateEq() {
        if (showResult) {
          const dV = (E * d).toFixed(1);
          eqEl.textContent = `ΔV = E d = ${dV} V`;
        } else {
          eqEl.textContent = `ΔV = −E d = ?`;
        }
      }

      function render() {
        choicesEl.classList.add('hidden');
        controlsEl.classList.add('hidden');
        mainBtn.classList.remove('hidden');
        feedbackEl.textContent = '';
        showResult = false;

        if (state === 'setup') {
          promptEl.textContent = 'Parallel plates create a uniform field.';
          mainBtn.textContent = 'Start';
          E = 100;
          d = 0.2;
          eSlider.value = E;
          dSlider.value = d;
          draw();
        } else if (state === 'predict') {
          promptEl.textContent = 'If you increase plate separation d while keeping E fixed, what happens to |ΔV|?';
          choicesEl.classList.remove('hidden');
          choicesEl.innerHTML = '';
          const opts = [
            { v: 'larger', t: 'Larger ΔV' },
            { v: 'smaller', t: 'Smaller ΔV' },
            { v: 'same', t: 'Same ΔV' }
          ];
          for (let i = opts.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [opts[i], opts[j]] = [opts[j], opts[i]];
          }
          opts.forEach(o => {
            const b = document.createElement('button');
            b.dataset.choice = o.v;
            b.textContent = o.t;
            b.addEventListener('click', () => choose(o.v));
            choicesEl.appendChild(b);
          });
          mainBtn.classList.add('hidden');
          draw();
        } else if (state === 'adjust') {
          promptEl.textContent = 'Adjust E and d. Observe how ΔV changes.';
          controlsEl.classList.remove('hidden');
          showResult = true;
          updateEq();
          mainBtn.textContent = 'Finish';
          draw();
        } else if (state === 'explain') {
          promptEl.textContent = '';
          feedbackEl.textContent = 'Larger d or stronger E produces larger |ΔV|. ΔV = −E d links field, distance, and potential difference.';
          mainBtn.textContent = 'Replay';
          showResult = true;
          updateEq();
          draw();
          if (!completed) {
            completed = true;
            try { window.parent.postMessage({ type: 'complete' }, '*'); } catch (e) {}
          }
        }
      }

      function choose(v) {
        if (state !== 'predict') return;
        prediction = v;
        state = 'adjust';
        render();
      }

      eSlider.addEventListener('input', () => {
        E = +eSlider.value;
        updateEq();
        draw();
      });
      dSlider.addEventListener('input', () => {
        d = +dSlider.value;
        updateEq();
        draw();
      });

      mainBtn.addEventListener('click', () => {
        if (state === 'setup') {
          state = 'predict';
          render();
        } else if (state === 'adjust') {
          state = 'explain';
          render();
        } else if (state === 'explain') {
          state = 'setup';
          prediction = null;
          completed = false;
          render();
        }
      });

      resetBtn.addEventListener('click', () => {
        state = 'setup';
        prediction = null;
        completed = false;
        render();
      });

      render();
    })();
  </script>
</body>
</html>
