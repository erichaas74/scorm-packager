<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ohm's Law and Circuit Models</title>
  <style>
    :root {
      --blue: #28609f;
      --blue-dark: #1f4d82;
      --blue-soft: #eaf3fb;
      --ink: #172033;
      --muted: #627087;
      --line: #dbe4ee;
      --panel: #ffffff;
      --stage: #f4f7fa;
      --wire: #273444;
      --red: #d64545;
      --green: #23845b;
      --amber: #d89521;
      --shadow: 0 12px 28px rgba(32, 53, 81, 0.10);
    }

    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      box-sizing: border-box;
    }

    *, *::before, *::after { box-sizing: inherit; }

    .walkthrough {
      max-width: 848px;
      margin: 0 auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 2px 4px;
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .scenario-dot {
      width: 11px;
      height: 11px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 0 5px rgba(40, 96, 159, 0.10);
    }

    .header h2 {
      margin: 0;
      font-size: 1.06rem;
      line-height: 1.25;
      font-weight: 750;
      color: #26354a;
    }

    .progress {
      flex: 0 0 auto;
      font-size: .8rem;
      font-weight: 750;
      color: var(--blue);
      background: var(--blue-soft);
      border: 1px solid #cfe0f1;
      border-radius: 999px;
      padding: 6px 10px;
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 820 / 405;
      overflow: hidden;
      border: 1px solid #d8e2ec;
      border-radius: 18px;
      background:
        linear-gradient(rgba(80, 103, 128, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(80, 103, 128, .045) 1px, transparent 1px),
        linear-gradient(180deg, #fbfcfd 0%, var(--stage) 100%);
      background-size: 28px 28px, 28px 28px, 100% 100%;
      box-shadow: inset 0 1px 0 #fff;
    }

    .stage::before {
      content: "MODEL";
      position: absolute;
      top: 14px;
      left: 16px;
      z-index: 2;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .12em;
      color: #8291a4;
      pointer-events: none;
    }

    #sim-svg { display: block; width: 100%; height: 100%; }

    .card {
      border: 1px solid #d7e1ec;
      border-left: 6px solid var(--blue);
      border-radius: 16px;
      padding: 20px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .card p {
      margin: 0 0 12px;
      line-height: 1.52;
    }

    #setup-text {
      color: #4f5f73;
      font-size: .98rem;
    }

    #prompt-text {
      margin-top: 4px;
      color: #172033;
      font-size: 1.05rem;
      font-weight: 750;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
      margin-top: 13px;
    }

    button {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1.5px solid #cbd7e4;
      border-radius: 12px;
      background: #fff;
      color: #233247;
      font: inherit;
      font-size: .98rem;
      font-weight: 650;
      text-align: left;
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: #77a5d2;
      background: #f5f9fd;
      box-shadow: 0 5px 14px rgba(40, 96, 159, .09);
    }

    button:focus-visible {
      outline: 3px solid rgba(40, 96, 159, .30);
      outline-offset: 2px;
    }

    #feedback-panel {
      margin-top: 12px;
    }

    #feedback-text {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .action-btn {
      margin-top: 15px;
      border-color: var(--blue);
      background: var(--blue);
      color: #fff;
      text-align: center;
      box-shadow: 0 8px 18px rgba(40, 96, 159, .18);
    }

    .action-btn:hover {
      border-color: var(--blue-dark);
      background: var(--blue-dark);
      color: #fff;
    }

    .hidden { display: none !important; }

    @media (max-width: 640px) {
      .walkthrough { padding: 8px; }
      .stage { border-radius: 14px; }
      .card { padding: 16px; }
      .header h2 { font-size: .98rem; }
    }
  </style>
</head>
<body>
  <main class="walkthrough">
    <div class="header">
      <div class="title-wrap">
        <span class="scenario-dot" aria-hidden="true"></span>
        <h2 id="scenario-title">Scenario Title</h2>
      </div>
      <span class="progress" id="progress" aria-live="polite">1 / 4</span>
    </div>

    <div class="stage" aria-label="Circuit Simulation Stage" role="img">
      <svg id="sim-svg" viewBox="0 0 820 405" preserveAspectRatio="xMidYMid meet">
        <defs>
          <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#21334d" flood-opacity="0.14"/>
          </filter>
          <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <marker id="axisArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#53657b"/>
          </marker>
          <marker id="currentArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#28609f"/>
          </marker>
        </defs>
        <g id="svg-content"></g>
      </svg>
    </div>

    <div class="card" aria-live="polite">
      <p id="setup-text"></p>
      <p id="prompt-text"></p>
      <div id="choices" class="choices" role="group" aria-label="Prediction Choices"></div>
      <div id="feedback-panel" class="hidden">
        <p id="feedback-text"></p>
        <button id="next-btn" class="action-btn">Next Scenario</button>
      </div>
    </div>

    <script>
      const drawCircuit = () => `
        <!-- circuit board -->
        <rect x="0" y="54" width="820" height="216" rx="28" fill="#ffffff" stroke="#dde6ef" stroke-width="2" filter="url(#softShadow)"/>

        <!-- wires -->
        <path d="M210 213 L210 114 L330 114" stroke="#273444" stroke-width="8" stroke-linecap="round" fill="none"/>
        <path d="M490 114 L610 114 L610 213" stroke="#273444" stroke-width="8" stroke-linecap="round" fill="none"/>
        <path d="M610 213 L475 213" stroke="#273444" stroke-width="8" stroke-linecap="round" fill="none"/>
        <path d="M345 213 L210 213" stroke="#273444" stroke-width="8" stroke-linecap="round" fill="none"/>

        <!-- current arrows -->
        <path d="M238 114 L284 114" stroke="#28609f" stroke-width="3" marker-end="url(#currentArrow)"/>
        <path d="M542 213 L500 213" stroke="#28609f" stroke-width="3" marker-end="url(#currentArrow)"/>
        <text x="260" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#28609f">current</text>

        <!-- resistor body -->
        <line x1="330" y1="114" x2="348" y2="114" stroke="#273444" stroke-width="8" stroke-linecap="round"/>
        <rect x="348" y="93" width="124" height="42" rx="10" fill="#f6c66d" stroke="#a66718" stroke-width="3"/>
        <rect x="366" y="94" width="8" height="40" fill="#8a5b24" opacity=".70"/>
        <rect x="393" y="94" width="8" height="40" fill="#c63c3c" opacity=".78"/>
        <rect x="420" y="94" width="8" height="40" fill="#6f55b5" opacity=".78"/>
        <rect x="447" y="94" width="8" height="40" fill="#d6a51d" opacity=".85"/>
        <line x1="472" y1="114" x2="490" y2="114" stroke="#273444" stroke-width="8" stroke-linecap="round"/>
        <text x="410" y="77" text-anchor="middle" font-size="17" font-weight="800" fill="#7a4d13" id="resistor-label"></text>
        <text x="410" y="154" text-anchor="middle" font-size="12" font-weight="700" fill="#7b8796">RESISTOR</text>

        <!-- battery -->
        <g transform="translate(345 183)">
          <rect x="0" y="0" width="130" height="60" rx="13" fill="#eef3f8" stroke="#59697b" stroke-width="2.5"/>
          <rect x="8" y="8" width="114" height="44" rx="8" fill="#ffffff"/>
          <line x1="46" y1="13" x2="46" y2="47" stroke="#273444" stroke-width="4"/>
          <line x1="62" y1="20" x2="62" y2="40" stroke="#273444" stroke-width="8"/>
          <line x1="78" y1="13" x2="78" y2="47" stroke="#273444" stroke-width="4"/>
          <line x1="94" y1="20" x2="94" y2="40" stroke="#273444" stroke-width="8"/>
          <text x="18" y="36" font-size="17" font-weight="900" fill="#d64545">+</text>
          <text x="110" y="35" font-size="20" font-weight="900" fill="#28609f">−</text>
        </g>
        <text x="410" y="263" text-anchor="middle" font-size="17" font-weight="800" fill="#26354a" id="battery-label"></text>

        <!-- ammeter -->
        <g transform="translate(610 164)">
          <circle cx="0" cy="0" r="38" fill="#f7fbff" stroke="#28609f" stroke-width="4" filter="url(#softShadow)"/>
          <circle cx="0" cy="0" r="28" fill="#ffffff" stroke="#d7e5f2" stroke-width="2"/>
          <path d="M-17 8 Q0 -17 17 8" fill="none" stroke="#91a4b8" stroke-width="2"/>
          <line x1="0" y1="6" x2="12" y2="-12" stroke="#d64545" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="0" cy="6" r="3.5" fill="#d64545"/>
          <text x="0" y="25" text-anchor="middle" font-size="12" font-weight="900" fill="#28609f">A</text>
        </g>
        <text x="670" y="170" font-size="18" font-weight="850" fill="#28609f" id="ammeter-label"></text>
      `;

      const drawGraphAxes = () => `
        <rect x="0" y="38" width="820" height="238" rx="20" fill="#ffffff" stroke="#dce5ee" stroke-width="2" filter="url(#softShadow)"/>
        <line x1="230" y1="238" x2="230" y2="72" stroke="#53657b" stroke-width="3" marker-end="url(#axisArrow)"/>
        <line x1="230" y1="238" x2="612" y2="238" stroke="#53657b" stroke-width="3" marker-end="url(#axisArrow)"/>
        ${[1,2,3,4].map(i => `<line x1="230" y1="${238-i*36}" x2="600" y2="${238-i*36}" stroke="#e9eef4" stroke-width="1"/>`).join('')}
        ${[1,2,3,4,5].map(i => `<line x1="${230+i*65}" y1="78" x2="${230+i*65}" y2="238" stroke="#eef2f6" stroke-width="1"/>`).join('')}
        <text x="167" y="76" font-size="15" font-weight="850" fill="#39495c">Current, I</text>
        <text x="566" y="264" font-size="15" font-weight="850" fill="#39495c">Voltage, V</text>
        <text x="209" y="255" font-size="12" font-weight="700" fill="#8794a4">0</text>
      `;

      const drawOhmsLawPanel = (details = '') => `
        <g id="ohms-law-panel">
          <rect x="0" y="288" width="820" height="98" rx="18" fill="#ffffff" stroke="#d7e1ec" stroke-width="2" filter="url(#softShadow)"/>
          <rect x="18" y="303" width="190" height="68" rx="13" fill="#eaf3fb" stroke="#cfe0f1" stroke-width="1.5"/>
          <text x="113" y="324" text-anchor="middle" font-size="11" font-weight="850" letter-spacing="1.4" fill="#627087">OHM'S LAW</text>
          <text x="113" y="354" text-anchor="middle" font-size="25" font-weight="900" fill="#28609f">V = IR</text>
          ${details || `
            <text x="514" y="326" text-anchor="middle" font-size="15" font-weight="800" fill="#314155">Voltage = current &times; resistance</text>
            <text x="514" y="351" text-anchor="middle" font-size="13" font-weight="700" fill="#6b7a8d">Choose an answer to insert the values.</text>
          `}
        </g>
      `;

      const scenarios = [
        {
          title: "Missing-Variable Circuit Challenge",
          setup: "A circuit has a 12 V battery and an unknown resistor. The ammeter reads 3 A.",
          promptText: "Which equation correctly rearranges Ohm's Law (V = IR) to find the resistance?",
          choices: [
            { text: "R = V / I" },
            { text: "R = V × I" },
            { text: "R = I / V" }
          ],
          feedback: "Resistance is calculated by V / I. Dividing 12 V by 3 A reveals a 4 &Omega; resistor.",
          getSVG: (reveal) => {
            let svg = drawCircuit();
            svg = svg.replace('id="battery-label"></text>', 'id="battery-label">12 V</text>');
            svg = svg.replace('id="ammeter-label"></text>', 'id="ammeter-label">3 A</text>');
            if (!reveal) {
              svg = svg.replace('id="resistor-label"></text>', 'id="resistor-label">R = ?</text>');
            } else {
              svg = svg.replace('id="resistor-label"></text>', 'id="resistor-label">R = 4 &Omega;</text>');
            }
            svg += drawOhmsLawPanel(reveal ? `
              <rect x="226" y="301" width="576" height="72" rx="13" fill="#e9f7f0" stroke="#b9e2ce" stroke-width="1.5"/>
              <text x="514" y="320" text-anchor="middle" font-size="11.5" font-weight="800" fill="#527064">Insert the known values into V = IR</text>
              <text x="514" y="342" text-anchor="middle" font-size="16" font-weight="850" fill="#314155">12 V = (3 A)R</text>
              <text x="514" y="365" text-anchor="middle" font-size="17" font-weight="900" fill="#23845b">R = 12 V / 3 A = 4 &Omega;</text>
            ` : '');
            return svg;
          }
        },
        {
          title: "Ohm's Law Proportions",
          setup: "A circuit has a fixed 10 &Omega; resistor and a 5 V battery, resulting in 0.5 A of current.",
          promptText: "If the battery is swapped for a 10 V battery, what happens to the current?",
          choices: [
            { text: "It doubles" },
            { text: "It drops in half" },
            { text: "It stays the same" }
          ],
          feedback: "The current doubles to 1.0 A. Voltage and current are directly proportional when resistance is constant.",
          getSVG: (reveal) => {
            let svg = drawCircuit();
            svg = svg.replace('id="resistor-label"></text>', 'id="resistor-label">10 &Omega;</text>');
            if (!reveal) {
              svg = svg.replace('id="battery-label"></text>', 'id="battery-label">5 V</text>');
              svg = svg.replace('id="ammeter-label"></text>', 'id="ammeter-label">0.5 A</text>');
            } else {
              svg = svg.replace('id="battery-label"></text>', 'id="battery-label">10 V</text>');
              svg = svg.replace('id="ammeter-label"></text>', 'id="ammeter-label">1.0 A</text>');
            }
            svg += drawOhmsLawPanel(reveal ? `
              <rect x="226" y="299" width="278" height="59" rx="11" fill="#f4f8fc" stroke="#cfdce8" stroke-width="1.5"/>
              <text x="365" y="315" text-anchor="middle" font-size="10.5" font-weight="850" fill="#627087">ORIGINAL: V = IR</text>
              <text x="365" y="334" text-anchor="middle" font-size="12" font-weight="800" fill="#314155">5 V = I(10 &Omega;)</text>
              <text x="365" y="351" text-anchor="middle" font-size="12" font-weight="900" fill="#28609f">I = 0.5 A</text>
              <rect x="522" y="299" width="280" height="59" rx="11" fill="#e9f7f0" stroke="#b9e2ce" stroke-width="1.5"/>
              <text x="662" y="315" text-anchor="middle" font-size="10.5" font-weight="850" fill="#527064">DOUBLED: V = IR</text>
              <text x="662" y="334" text-anchor="middle" font-size="12" font-weight="800" fill="#314155">10 V = I(10 &Omega;)</text>
              <text x="662" y="351" text-anchor="middle" font-size="12" font-weight="900" fill="#23845b">I = 1.0 A</text>
              <text x="514" y="377" text-anchor="middle" font-size="12" font-weight="850" fill="#23845b">2&times; voltage &rarr; 2&times; current when resistance is fixed</text>
            ` : '');
            return svg;
          }
        },
        {
          title: "Voltage-Current Graph Builder",
          setup: "Voltage is steadily increased across a standard fixed resistor.",
          promptText: "What shape will the Current vs. Voltage (I-V) graph form?",
          choices: [
            { text: "A straight diagonal line" },
            { text: "A curve bending upward" },
            { text: "A flat horizontal line" }
          ],
          feedback: "It forms a straight diagonal line. This constant slope represents a constant resistance, characteristic of ohmic materials.",
          getSVG: (reveal) => {
            let svg = drawGraphAxes();
            if (!reveal) {
              svg += `
                <circle cx="420" cy="156" r="34" fill="#f0f4f8" stroke="#d6e0ea" stroke-width="2"/>
                <text x="420" y="168" text-anchor="middle" font-size="38" font-weight="850" fill="#8b99a8">?</text>`;
            } else {
              svg += `
                <line x1="230" y1="238" x2="565" y2="84" stroke="#28609f" stroke-width="5" stroke-linecap="round"/>
                <circle cx="295" cy="208" r="5" fill="#28609f"/>
                <circle cx="360" cy="178" r="5" fill="#28609f"/>
                <circle cx="425" cy="148" r="5" fill="#28609f"/>
                <circle cx="490" cy="118" r="5" fill="#28609f"/>
                <circle cx="555" cy="88" r="5" fill="#28609f"/>
                <rect x="433" y="57" width="188" height="34" rx="17" fill="#eaf3fb" stroke="#cfe0f1"/>
                <text x="527" y="79" text-anchor="middle" font-size="13" font-weight="800" fill="#28609f">constant resistance</text>`;
            }
            svg += drawOhmsLawPanel(reveal ? `
              <rect x="226" y="301" width="576" height="72" rx="13" fill="#eaf3fb" stroke="#cfe0f1" stroke-width="1.5"/>
              <text x="514" y="321" text-anchor="middle" font-size="12" font-weight="800" fill="#627087">Rearrange the model: I = V / R</text>
              <text x="514" y="345" text-anchor="middle" font-size="15" font-weight="900" fill="#28609f">Fixed R gives a constant I-to-V ratio.</text>
              <text x="514" y="365" text-anchor="middle" font-size="12" font-weight="750" fill="#52657a">Feedback: the I-V graph is a straight diagonal line.</text>
            ` : '');
            return svg;
          }
        },
        {
          title: "Ohmic vs. Non-Ohmic Materials",
          setup: "Voltage is steadily increased across an incandescent light bulb filament, causing it to heat up.",
          promptText: "How does this heating affect the bulb's Current vs. Voltage (I-V) graph?",
          choices: [
            { text: "Curves downward (less current added)" },
            { text: "Curves upward (more current added)" },
            { text: "Remains a straight line" }
          ],
          feedback: "The line curves downward. The hot filament increases in resistance, drawing less and less additional current per volt.",
          getSVG: (reveal) => {
            let svg = drawGraphAxes();
            svg += `
              <line x1="230" y1="238" x2="565" y2="84" stroke="#b8c3cf" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round"/>
              <text x="520" y="70" font-size="12" font-weight="700" fill="#8b99a8">Ohmic reference</text>
              <g transform="translate(626 112)">
                <circle cx="0" cy="0" r="28" fill="#fff7d6" stroke="#d59b22" stroke-width="2.5"/>
                <path d="M-9 7 Q0 -12 9 7" fill="none" stroke="#d45d2f" stroke-width="3"/>
                <line x1="-8" y1="18" x2="8" y2="18" stroke="#6c7785" stroke-width="4"/>
                <line x1="-6" y1="24" x2="6" y2="24" stroke="#6c7785" stroke-width="4"/>
              </g>`;
            if (!reveal) {
              svg += `
                <circle cx="420" cy="156" r="34" fill="#f0f4f8" stroke="#d6e0ea" stroke-width="2"/>
                <text x="420" y="168" text-anchor="middle" font-size="38" font-weight="850" fill="#8b99a8">?</text>`;
            } else {
              svg += `
                <path d="M230 238 C320 184, 415 148, 565 132" stroke="#d64545" stroke-width="5" stroke-linecap="round" fill="none"/>
                <circle cx="315" cy="189" r="5" fill="#d64545"/>
                <circle cx="405" cy="154" r="5" fill="#d64545"/>
                <circle cx="490" cy="138" r="5" fill="#d64545"/>
                <rect x="421" y="171" width="205" height="40" rx="20" fill="#fff0f0" stroke="#f0c5c5"/>
                <text x="523" y="188" text-anchor="middle" font-size="13" font-weight="850" fill="#bd3636">filament heats up</text>
                <text x="523" y="203" text-anchor="middle" font-size="12" font-weight="700" fill="#bd3636">resistance increases</text>`;
            }
            svg += drawOhmsLawPanel(reveal ? `
              <rect x="226" y="301" width="576" height="72" rx="13" fill="#fff0f0" stroke="#f0c5c5" stroke-width="1.5"/>
              <text x="514" y="321" text-anchor="middle" font-size="12" font-weight="800" fill="#7b5a5a">Rearrange the model: I = V / R</text>
              <text x="514" y="345" text-anchor="middle" font-size="14" font-weight="900" fill="#bd3636">Heating raises R, so current rises more slowly.</text>
              <text x="514" y="365" text-anchor="middle" font-size="12" font-weight="750" fill="#7b5a5a">Feedback: the I-V line curves downward.</text>
            ` : '');
            return svg;
          }
        }
      ];

      let currentScenarioIndex = 0;
      let state = 'setup';
      let completed = false;

      function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
          randomIndex = Math.floor(Math.random() * currentIndex);
          currentIndex--;
          [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
      }

      function renderScenario() {
        state = 'setup';
        const scen = scenarios[currentScenarioIndex];
        document.getElementById('scenario-title').innerText = scen.title;
        document.getElementById('progress').innerText = `${currentScenarioIndex + 1} / ${scenarios.length}`;
        document.getElementById('setup-text').innerHTML = scen.setup;
        document.getElementById('prompt-text').innerHTML = scen.promptText;
        document.getElementById('svg-content').innerHTML = scen.getSVG(false);

        const choicesDiv = document.getElementById('choices');
        choicesDiv.innerHTML = '';
        choicesDiv.classList.remove('hidden');
        document.getElementById('prompt-text').classList.remove('hidden');
        document.getElementById('feedback-panel').classList.add('hidden');
        document.getElementById('next-btn').classList.remove('hidden');

        const shuffledOptions = shuffle([...scen.choices]);
        shuffledOptions.forEach(opt => {
          const btn = document.createElement('button');
          btn.innerHTML = opt.text;
          btn.onclick = () => choose();
          choicesDiv.appendChild(btn);
        });
      }

      function choose() {
        if (state !== 'setup') return;
        state = 'reveal';
        const scen = scenarios[currentScenarioIndex];
        document.getElementById('choices').classList.add('hidden');
        document.getElementById('prompt-text').classList.add('hidden');
        document.getElementById('svg-content').innerHTML = scen.getSVG(true);
        const fbPanel = document.getElementById('feedback-panel');
        fbPanel.classList.remove('hidden');
        document.getElementById('feedback-text').innerHTML = scen.feedback;

        const nextBtn = document.getElementById('next-btn');
        if (currentScenarioIndex === scenarios.length - 1) {
          nextBtn.innerText = "Finish";
          nextBtn.onclick = finishWalkthrough;
        } else {
          nextBtn.innerText = "Next Scenario";
          nextBtn.onclick = () => {
            currentScenarioIndex++;
            renderScenario();
          };
        }
      }

      function finishWalkthrough() {
        if (!completed) {
          window.parent.postMessage({ type: 'complete' }, '*');
          completed = true;
        }
        document.getElementById('feedback-text').innerHTML = "<strong>Walkthrough complete.</strong> You have successfully applied Ohm's Law to predict circuit behavior and interpret V-I graphs.";
        document.getElementById('next-btn').classList.add('hidden');
      }

      renderScenario();
    </script>
  </main>
</body>
</html>
