<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loop and Solenoid Field Model</title><style>
.lsf-control[hidden]{display:none!important}
:root{--n:#153456;--b:#285f9f;--l:#bfd2e6;--s:#eef7ff;--i:#132238;--m:#52657b;--o:#a75e00;--g:#166534}*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--i);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit;min-height:44px}.lsf-app{width:min(100%,1080px);margin:auto;border:5px solid var(--b);border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 18px 48px #15345624}.lsf-head{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:17px 21px 14px;border-bottom:1px solid var(--l);background:linear-gradient(115deg,#fff,#eef7ff)}.lsf-k{margin:0 0 3px;color:var(--b);font-size:.73rem;font-weight:850;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;color:var(--n);font-size:clamp(1.35rem,4vw,2rem);line-height:1.08}.lsf-reset{padding:8px 14px;border:1px solid var(--l);border-radius:999px;background:#fff;color:var(--b);font-weight:800}.lsf-main{padding:16px}.lsf-stage{border:1px solid #a9c3df;border-radius:18px 18px 0 0;overflow:hidden;background:linear-gradient(#285f9f0d 1px,transparent 1px),linear-gradient(90deg,#285f9f0d 1px,transparent 1px),var(--s);background-size:30px 30px}.lsf-stage svg{display:block;width:100%;height:auto;min-height:330px}.lsf-coil{fill:none;stroke:#b94b28;stroke-width:9}.lsf-field{fill:none;stroke:var(--o);stroke-width:5;opacity:0;marker-end:url(#lsf-arrow)}.lsf-field[data-show=true]{opacity:.75}.lsf-axis{stroke:var(--b);stroke-width:8;opacity:0;marker-end:url(#lsf-blue)}.lsf-axis[data-show=true]{opacity:1}.lsf-unit{fill:#fff;stroke:var(--o);stroke-width:3;opacity:0}.lsf-unit[data-show=true]{opacity:1}.lsf-label{fill:var(--n);font-size:16px;font-weight:850;text-anchor:middle}.lsf-read{fill:var(--n);font-size:14px;font-weight:900;text-anchor:middle}.lsf-card{padding:14px 16px;border:1px solid #a9c3df;border-top:0;border-radius:0 0 18px 18px}.lsf-prompt{margin:0;color:var(--n);font-weight:850}.lsf-choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.lsf-choice{border:2px solid var(--l);border-radius:12px;background:#fff;font-weight:850}.lsf-feedback{margin:9px 0 0;color:var(--m);line-height:1.45}.lsf-action{margin-top:9px;border:0;border-radius:11px;background:var(--b);color:#fff;font-weight:850;padding:8px 15px}.lsf-control{display:flex;align-items:center;gap:12px;margin-top:10px;padding:11px 13px;border:1px solid var(--l);border-radius:14px}.lsf-control label{color:var(--n);font-weight:850}.lsf-control input{flex:1;accent-color:var(--b);min-height:44px}.lsf-control output{min-width:62px;color:var(--b);font-weight:900}.lsf-note{margin:7px 0 0;color:var(--m);font-size:.78rem}:focus-visible{outline:3px solid #e56b24;outline-offset:3px}@media(max-width:560px){.lsf-main{padding:9px}.lsf-stage svg{min-height:280px}.lsf-choices{grid-template-columns:1fr}.lsf-head{align-items:flex-start}.lsf-control{flex-wrap:wrap}.lsf-control input{flex-basis:100%}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="lsf-app"><header class="lsf-head"><div><p class="lsf-k">Unit 6 &middot; Part 1 &middot; Combined fields</p><h1>Loop and Solenoid Field Model</h1></div><button class="lsf-reset" id="lsf-reset" type="button">Reset</button></header><div class="lsf-main"><section aria-label="Comparison of one current loop and a solenoid"><div class="lsf-stage"><svg viewBox="0 0 900 360" role="img" aria-labelledby="lsf-title lsf-desc"><title id="lsf-title">Single loop and multi-loop solenoid magnetic fields</title><desc id="lsf-desc">A single current loop is compared with several aligned loops whose fields add inside a solenoid.</desc><defs><marker id="lsf-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a75e00"/></marker><marker id="lsf-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#285f9f"/></marker></defs><text class="lsf-label" x="225" y="38">One current loop</text><ellipse class="lsf-coil" cx="225" cy="185" rx="42" ry="105"/><path class="lsf-field" data-one d="M225 178C125 120 120 250 225 200C330 250 325 120 225 178"/><line class="lsf-axis" data-one x1="155" y1="190" x2="295" y2="190"/><text class="lsf-read" id="lsf-one-read" x="225" y="328">Field strength: ?</text><text class="lsf-label" x="655" y="38">Multi-loop solenoid</text><g id="lsf-coils"><ellipse class="lsf-coil" cx="530" cy="185" rx="35" ry="92"/><ellipse class="lsf-coil" cx="580" cy="185" rx="35" ry="92"/><ellipse class="lsf-coil" cx="630" cy="185" rx="35" ry="92"/><ellipse class="lsf-coil" cx="680" cy="185" rx="35" ry="92"/><ellipse class="lsf-coil" cx="730" cy="185" rx="35" ry="92"/><ellipse class="lsf-coil" cx="780" cy="185" rx="35" ry="92"/></g><g id="lsf-unit-arrows"><circle class="lsf-unit" cx="545" cy="150" r="10"/><circle class="lsf-unit" cx="585" cy="150" r="10"/><circle class="lsf-unit" cx="625" cy="150" r="10"/><circle class="lsf-unit" cx="665" cy="150" r="10"/><circle class="lsf-unit" cx="705" cy="150" r="10"/><circle class="lsf-unit" cx="745" cy="150" r="10"/></g><path class="lsf-field" data-many d="M520 175C470 75 820 75 785 175M520 205C470 300 820 300 785 205"/><line class="lsf-axis" data-many x1="520" y1="190" x2="800" y2="190"/><text class="lsf-read" id="lsf-many-read" x="655" y="328">Combined field: ?</text></svg></div><div class="lsf-card" aria-live="polite"><p class="lsf-prompt" id="lsf-prompt">At the same current, which has the stronger center field?</p><div class="lsf-choices" id="lsf-choices"><button class="lsf-choice" data-a="loop" type="button">Single loop</button><button class="lsf-choice" data-a="solenoid" type="button">Solenoid</button><button class="lsf-choice" data-a="same" type="button">Same strength</button></div><p class="lsf-feedback" id="lsf-feedback"></p><button class="lsf-action" id="lsf-action" type="button" hidden>Reveal combined fields</button></div></section><div class="lsf-control" id="lsf-control" hidden><label for="lsf-turns">Solenoid turns shown</label><input id="lsf-turns" type="range" min="2" max="6" value="6" step="1"><output id="lsf-out">6 turns</output></div><p class="lsf-note">After the reveal, change the turns to see how aligned loop fields add.</p></div><script>
(()=>{const $=s=>document.querySelector(s),state={phase:'predict',choice:null,complete:false};function show(){state.phase='explain';const n=Number($('#lsf-turns').value);document.querySelectorAll('[data-one],[data-many],.lsf-unit').forEach(e=>e.dataset.show='true');document.querySelectorAll('#lsf-coils ellipse,#lsf-unit-arrows circle').forEach((e,i)=>e.style.display=i<n?'':'none');$('#lsf-out').textContent=n+' turns';$('#lsf-one-read').textContent='Relative center field: 1×';$('#lsf-many-read').textContent=`Combined center field: ${n}×`;$('#lsf-prompt').textContent='The solenoid has the stronger center field.';$('#lsf-feedback').textContent=`${state.choice==='solenoid'?'Your prediction matches the model.':'The model shows a different result.'} Each loop contributes a field in the same direction inside the coil.`;$('#lsf-action').textContent='Finish';$('#lsf-control').hidden=false}$('#lsf-choices').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||state.phase!=='predict')return;state.phase='ready';state.choice=b.dataset.a;document.querySelectorAll('.lsf-choice').forEach(x=>x.disabled=true);$('#lsf-prompt').textContent='Prediction locked. Reveal the individual loop contributions.';const a=$('#lsf-action');a.hidden=false;a.focus()});$('#lsf-action').addEventListener('click',()=>{if(state.phase==='ready')show();else if(state.phase==='explain'&&!state.complete){state.complete=true;$('#lsf-action').hidden=true;$('#lsf-prompt').textContent='Aligned loop fields combine into a stronger solenoid field.';window.parent.postMessage({ type: 'complete' }, '*');}});$('#lsf-turns').addEventListener('input',show);$('#lsf-reset').addEventListener('click',()=>{state.phase='predict';state.choice=null;document.querySelectorAll('.lsf-choice').forEach(x=>x.disabled=false);document.querySelectorAll('[data-one],[data-many],.lsf-unit').forEach(e=>e.dataset.show='false');$('#lsf-one-read').textContent='Field strength: ?';$('#lsf-many-read').textContent='Combined field: ?';$('#lsf-prompt').textContent='At the same current, which has the stronger center field?';$('#lsf-feedback').textContent='';$('#lsf-action').hidden=true;$('#lsf-control').hidden=true;$('#lsf-turns').value=6});})();
</script></main></body></html>
