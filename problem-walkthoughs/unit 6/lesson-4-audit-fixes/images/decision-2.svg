<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680"><rect x="0" y="0" width="1440" height="680" rx="18" fill="#edf4f7"/><rect x="24" y="24" width="1392" height="632" rx="18" fill="white"/><rect x="65" y="180" width="285" height="250" rx="18" fill="#edf4f7"/><text x="207" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#087e8b">Predict</text><path d="M355,305 L395,305" stroke="#087e8b" stroke-width="5" fill="none"/><path d="M380,295 L395,305 L380,315" stroke="#087e8b" stroke-width="5" fill="none"/><text x="207" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#193650">expected result</text><rect x="410" y="180" width="285" height="250" rx="18" fill="#edf4f7"/><text x="552" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#087e8b">Change one setting</text><path d="M700,305 L740,305" stroke="#087e8b" stroke-width="5" fill="none"/><path d="M725,295 L740,305 L725,315" stroke="#087e8b" stroke-width="5" fill="none"/><text x="552" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#193650">core diameter</text><rect x="755" y="180" width="285" height="250" rx="18" fill="#edf4f7"/><text x="897" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#087e8b">Test and check</text><path d="M1045,305 L1085,305" stroke="#087e8b" stroke-width="5" fill="none"/><path d="M1070,295 L1085,305 L1070,315" stroke="#087e8b" stroke-width="5" fill="none"/><text x="897" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#193650">value + percent</text><rect x="1100" y="180" width="285" height="250" rx="18" fill="#edf4f7"/><text x="1242" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#087e8b">Keep or refine</text><text x="1242" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#193650">best reference</text><text x="