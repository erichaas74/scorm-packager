<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680"><rect x="0" y="0" width="1440" height="680" rx="18" fill="#edf4f7"/><rect x="24" y="24" width="1392" height="632" rx="18" fill="white"/><rect x="100" y="150" width="570" height="350" rx="18" fill="#edf4f7"/><rect x="770" y="150" width="570" height="350" rx="18" fill="#edf4f7"/><text x="385" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" fill="#087e8b">Keep original fractions</text><text x="385" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="74" fill="#087e8b">19.1%</text><text x="385" y="435" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#193650">Round only the final answer</text><text x="1055" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" fill="#c6782d">Round ratios too early</text><text x="1055" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="74" fill="#c6782d">19.2%</text><text x="1055" y="435" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" fill="#193650">Small rounding errors accumulate</text><text x="720" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#607688">The percentage describes value, not energy efficiency</text></svg>