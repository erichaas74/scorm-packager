<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680"><rect x="0" y="0" width="1440" height="680" rx="18" fill="#edf4f7"/><rect x="24" y="24" width="1392" height="632" rx="18" fill="white"/><rect x="120" y="100" width="1200" height="445" rx="18" fill="#edf4f7"/><text x="720" y="158" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" fill="#087e8b">One complete record for each distinct design</text><text x="180" y="240" text-anchor="start" font-family="Arial,sans-serif" font-size="30" fill="#193650">Settings</text><text x="760" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" fill="#193650">turns • core material • core diameter (mm)</text><text x="760" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" fill="#193650">cell count • series or parallel arrangement</text><text x="180" y="355" text-anchor="start" font-family="Arial,sans-serif" font-size="30" fill="#193650">Results</text><text x="760" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" fill="#193650">current • clips lifted • cost • wire length</text><text x="180" y="450" text-anchor="start" font-family="Arial,sans-serif" font-size="30" fill="#193650">Comparison</text><text x="760" y="450" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" fill="#193650">clips per cost • change made and why</text><text x="720" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#607688">Keep original clips and cost for the percentage calculation</text></svg>