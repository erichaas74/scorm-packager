<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Distance Data Comparison</title>
  <style>
    html, body { background: transparent; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
    .app { max-width: 720px; margin: 0 auto; padding: 8px; box-sizing: border-box; }
    .card { border: 5px solid #285f9f; border-radius: 12px; background: #f8fafc; overflow: hidden; display: flex; flex-direction: column; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #e2e8f0; border-bottom: 1px solid #cbd5e1; }
    .header h1 { margin: 0; font-size: 1rem; font-weight: 600; color: #1e293b; }
    .stage { position: relative; width: 100%; aspect-ratio: 16/10; background: #0f172a; overflow: hidden; padding: 12px; box-sizing: border-box; color: #e2e8f0; font-size: 0.85rem; }
    .prompt-area { padding: 12px; background: #fff; border-top: 1px solid #e2e8f0; min-height: 130px; display: flex; flex-direction: column; gap: 8px; }
    .prompt { margin: 0; font-size: 0.95rem; color: #1e293b; line-height: 1.4; }
    .choices { display: flex; flex-wrap: wrap; gap: 8px; }
    .choices button { flex: 1 1 160px; padding: 10px 12px; font-size: 0.9rem; font-weight: 600; border: 2px solid #285f9f; border-radius: 8px; background: #fff; color: #1e293b; cursor: pointer; min-height: 44px; }
    .choices button:hover, .choices button:focus { background: #dbeafe; outline: 2px solid #285f9f; outline-offset: 2px; }
    .feedback { margin: 0; font-size: 0.9rem; color: #0f172a; min-height: 1.4em; }
    .main-btn { align-self: flex-start; padding: 10px 20px; font-size: 0.95rem; font-weight: 600; border: none; border-radius: 8px; background: #285f9f; color: #fff; cursor: pointer; min-height: 44px; }
    .main-btn:hover, .main-btn:focus { background: #1e4a7a; outline: 2px solid #1e4a7a; outline-offset: 2px; }
    .hidden { display: none !important; }
    .datasets { display: flex; gap: 12px; height: 100%; }
    .ds { flex: 1; background: #1e293b; border-radius: 8px; padding: 10px; overflow: auto; }
    .ds h3 { margin: 0 0 8px; font-size: 0.9rem; color: #fbbf24; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { border: 1px solid #334155; padding: 4px 6px; text-align: center; }
    th { background: #334155; }
    .highlight { background: rgba(56, 189, 248, 0.25); }
  </style>
</head>
<body>
  <main class="app">
    <section class="card">
      <div class="header">
        <h1>Distance Data Comparison</h1>
        <button class="main-btn" data-reset style="padding:6px 12px;font-size:0.85rem;background:#64748b;">Reset</button>
      </div>
      <div class="stage" aria-label="Three data sets of magnetic field vs distance">
        <div class="datasets" data-stage>
          <div class="ds" id="dsA">
            <h3>Data Set A</h3>
            <table>
              <tr><th>d (cm)</th><th>B (mT)</th></tr>
              <tr><td>2</td><td>12.4</td></tr>
              <tr><td>4</td><td>11.9</td></tr>
              <tr><td>6</td><td>12.1</td></tr>
              <tr><td>8</td><td>11.8</td></tr>
              <tr><td>10</td><td>12.0</td></tr>
            </table>
          </div>
          <div class="ds" id="dsB">
            <h3>Data Set B</h3>
            <table>
              <tr><th>d (cm)</th><th>B (mT)</th></tr>
              <tr><td>2</td><td>18.5</td></tr>
              <tr><td>4</td><td>9.2</td></tr>
              <tr><td>6</td><td>5.1</td></tr>
              <tr><td>8</td><td>3.3</td></tr>
              <tr><td>10</td><td>2.2</td></tr>
            </table>
          </div>
          <div class="ds" id="dsC">
            <h3>Data Set C</h3>
            <table>
              <tr><th>d (cm)</th><th>B (mT)</th></tr>
              <tr><td>2</td><td>4.1</td></tr>
              <tr><td>4</td><td>6.8</td></tr>
              <tr><td>6</td><td>9.5</td></tr>
              <tr><td>8</td><td>12.0</td></tr>
              <tr><td>10</td><td>14.7</td></tr>
            </table>
          </div>
        </div>
      </div>
      <div class="prompt-area" aria-live="polite">
        <p class="prompt" data-prompt>Three teams measured B at different distances from a magnet.</p>
        <div class="choices" data-choices hidden>
          <button data-choice="A">Data Set A</button>
          <button data-choice="B">Data Set B</button>
          <button data-choice="C">Data Set C</button>
        </div>
        <p class="feedback" data-feedback></p>
        <button class="main-btn" data-main>Start</button>
      </div>
    </section>
  </main>
  <script>
    (function() {
      const promptEl = document.querySelector('[data-prompt]');
      const choicesEl = document.querySelector('[data-choices]');
      const feedbackEl = document.querySelector('[data-feedback]');
      const mainBtn = document.querySelector('[data-main]');
      const resetBtn = document.querySelector('[data-reset]');
      const dsA = document.getElementById('dsA');
      const dsB = document.getElementById('dsB');
      const dsC = document.getElementById('dsC');

      let state = 'setup';
      let prediction = null;
      let completed = false;

      function clearHighlight() {
        [dsA, dsB, dsC].forEach(d => d.classList.remove('highlight'));
      }

      function render() {
        choicesEl.classList.add('hidden');
        mainBtn.classList.remove('hidden');
        feedbackEl.textContent = '';
        clearHighlight();

        if (state === 'setup') {
          promptEl.textContent = 'Three teams measured B at different distances from a magnet.';
          mainBtn.textContent = 'Start';
        } else if (state === 'predict') {
          promptEl.textContent = 'Which data set best supports the claim that field strength decreases with distance?';
          choicesEl.classList.remove('hidden');
          choicesEl.innerHTML = '';
          const opts = [
            { v: 'A', t: 'Data Set A' },
            { v: 'B', t: 'Data Set B' },
            { v: 'C', t: 'Data Set C' }
          ];
          for (let i = opts.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [opts[i], opts[j]] = [opts[j], opts[i]];
          }
          opts.forEach(o => {
            const b = document.createElement('button');
            b.dataset.choice = o.v;
            b.textContent = o.t;
            b.addEventListener('click', () => choose(o.v));
            choicesEl.appendChild(b);
          });
          mainBtn.classList.add('hidden');
        } else if (state === 'explain') {
          dsB.classList.add('highlight');
          feedbackEl.textContent = 'Data Set B shows B falling as distance rises. A is roughly constant; C increases — neither supports the claim.';
          mainBtn.textContent = 'Replay';
          if (!completed) {
            completed = true;
            try { window.parent.postMessage({ type: 'complete' }, '*'); } catch (e) {}
          }
        }
      }

      function choose(v) {
        if (state !== 'predict') return;
        prediction = v;
        state = 'explain';
        render();
      }

      mainBtn.addEventListener('click', () => {
        if (state === 'setup') {
          state = 'predict';
          render();
        } else if (state === 'explain') {
          state = 'setup';
          prediction = null;
          completed = false;
          render();
        }
      });

      resetBtn.addEventListener('click', () => {
        state = 'setup';
        prediction = null;
        completed = false;
        render();
      });

      render();
    })();
  </script>
</body>
</html>
