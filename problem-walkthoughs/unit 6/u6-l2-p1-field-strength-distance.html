<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electric Field Strength and Distance Lab</title>
  <style>
    :root{--blue:#285f9f;--blue-dark:#173f70;--ink:#17263a;--muted:#52657a;--line:#bfd0e2;--soft:#eef6ff;--positive:#d64045;--field:#6f3fb2;--focus:#ffbf47;--locked:#e8eef5}
    *{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}body{padding:8px}
    .rph-app{width:min(100%,980px);margin:0 auto;border:5px solid var(--blue);border-radius:24px;background:linear-gradient(180deg,#fff,#f4f9ff);padding:18px;box-shadow:0 16px 34px rgba(23,63,112,.14)}
    .rph-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}.rph-kicker{margin:0 0 3px;color:var(--blue);font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}h1{margin:0;font-size:clamp(1.25rem,2.8vw,1.85rem);line-height:1.1}
    button{font:inherit;font-weight:800;cursor:pointer;min-height:44px;border-radius:13px;border:2px solid transparent;transition:transform .15s ease,box-shadow .15s ease}button:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(23,63,112,.14)}button:focus-visible{outline:4px solid var(--focus);outline-offset:2px}button:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none}
    .rph-reset{background:#fff;border-color:var(--line);color:var(--blue-dark);padding:9px 14px}.rph-run{background:var(--blue);color:#fff;padding:10px 18px}.rph-distance{background:#fff;border-color:var(--line);color:var(--ink);padding:9px 13px}.rph-distance.selected{background:var(--blue-dark);color:#fff;border-color:var(--blue-dark)}
    .rph-layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:14px}.rph-card{border:2px solid #c6d6e8;border-radius:18px;background:#fff;overflow:hidden}.rph-scene{background:radial-gradient(circle at 35% 45%,#fff 0%,#edf5ff 85%);min-height:330px}.rph-scene svg{display:block;width:100%;height:330px}
    .rph-controls{border-top:2px solid #c6d6e8;padding:13px}.rph-controls p{margin:0 0 10px;font-weight:800}.rph-distance-row{display:flex;flex-wrap:wrap;gap:8px}.rph-run-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:11px}.rph-status{color:var(--muted);font-size:.9rem;font-weight:700}
    .rph-data{padding:14px}.rph-data h2,.rph-analysis h2{margin:0 0 10px;font-size:1.05rem}.rph-checks{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.rph-check{display:grid;place-items:center;min-height:34px;border-radius:9px;background:#edf2f7;color:#5d6d7e;font-weight:800}.rph-check.done{background:#d9f2e5;color:#146c43}
    table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{padding:9px 7px;border-bottom:1px solid #d8e2ed;text-align:right}th:first-child,td:first-child{text-align:left}th{background:#f1f6fb;color:var(--blue-dark)}.rph-empty{text-align:center!important;color:var(--muted);font-style:italic}
    .rph-analysis{margin-top:12px;padding:14px;border:2px solid #c6d6e8;border-radius:16px;background:#fff}.rph-analysis.locked{background:var(--locked);color:#66778a}.rph-lock{margin:0;font-weight:700}.rph-question{margin:0 0 10px;font-weight:800}.rph-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.rph-choice{background:#fff;border-color:var(--line);color:var(--ink);padding:10px}.rph-feedback{min-height:2.7em;margin:10px 0 0;font-weight:700;line-height:1.35}.rph-graph{margin-top:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px}.rph-hidden{display:none!important}
    .charge-text{font-size:29px;font-weight:900;fill:#fff;text-anchor:middle;dominant-baseline:central}.scene-label{font-size:16px;font-weight:800;fill:var(--ink);text-anchor:middle}.axis-label{font-size:14px;font-weight:800;fill:var(--muted)}.field-arrow{stroke:var(--field);stroke-width:8;stroke-linecap:round}.measure-label{fill:var(--field);font-size:19px;font-weight:900;text-anchor:middle}
    @media(max-width:760px){body{padding:3px}.rph-app{padding:12px;border-radius:18px}.rph-layout{grid-template-columns:1fr}.rph-scene,.rph-scene svg{height:285px;min-height:285px}.rph-checks{grid-template-columns:repeat(4,1fr)}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation-duration:.001ms!important}}
  </style>
</head>
<body>
<main class="rph-app" aria-labelledby="title">
  <div class="rph-top"><div><p class="rph-kicker">Unit 6 · Lesson 2 · Part 1</p><h1 id="title">Field Strength and Distance Lab</h1></div><button class="rph-reset" id="resetBtn" type="button">Reset</button></div>
  <div class="rph-layout">
    <section class="rph-card" aria-label="Electric field trial controls">
      <div class="rph-scene">
        <svg viewBox="0 0 620 330" role="img" aria-labelledby="sceneTitle sceneDesc">
          <title id="sceneTitle">A positive source charge and a movable probe</title><desc id="sceneDesc">Select a distance, run a trial, and record the field strength.</desc>
          <defs><marker id="arrowHead" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="#6f3fb2"></path></marker></defs>
          <line x1="95" y1="175" x2="565" y2="175" stroke="#9fb3c8" stroke-width="3"></line>
          <g><circle cx="95" cy="175" r="46" fill="#d64045"></circle><text x="95" y="175" class="charge-text">+</text><text x="95" y="245" class="scene-label">+1.0 μC</text></g>
          <g id="probe" transform="translate(0 0)"><circle cx="210" cy="175" r="27" fill="#f7c948" stroke="#9a6f00" stroke-width="4"></circle><text x="210" y="175" class="charge-text" style="font-size:19px;fill:#5a4200">+</text><text x="210" y="222" class="scene-label">probe</text></g>
          <g id="arrowGroup" class="rph-hidden"><line id="arrow" x1="210" y1="175" x2="320" y2="175" class="field-arrow" marker-end="url(#arrowHead)"></line><text id="measureLabel" x="265" y="145" class="measure-label">?</text></g>
          <g id="ticks"></g>
        </svg>
      </div>
      <div class="rph-controls">
        <p>Choose a probe distance.</p>
        <div class="rph-distance-row" id="distanceButtons" aria-label="Probe distance choices"></div>
        <div class="rph-run-row"><span class="rph-status" id="runStatus">No trial selected.</span><button class="rph-run" id="runBtn" type="button" disabled>Run trial</button></div>
      </div>
    </section>
    <section>
      <div class="rph-card rph-data">
        <h2>Measurements</h2>
        <div class="rph-checks" id="checks" aria-label="Trial completion"></div>
        <table aria-label="Electric field measurements"><thead><tr><th>Distance</th><th>Field strength</th></tr></thead><tbody id="dataBody"><tr><td colspan="2" class="rph-empty">Run four trials.</td></tr></tbody></table>
      </div>
      <div class="rph-analysis locked" id="analysis">
        <h2>Analyze the pattern</h2>
        <p class="rph-lock" id="lockText">Complete all four distances to unlock.</p>
        <div id="analysisContent" class="rph-hidden">
          <p class="rph-question">When distance doubles, field strength becomes…</p>
          <div class="rph-choices" id="analysisChoices"></div>
          <p class="rph-feedback" id="feedback" role="status" aria-live="polite"></p>
          <div class="rph-graph rph-hidden" id="graphWrap">
            <svg viewBox="0 0 340 180" role="img" aria-label="Graph showing electric field strength decreasing with distance"><line x1="42" y1="145" x2="320" y2="145" stroke="#61758a" stroke-width="2"></line><line x1="42" y1="145" x2="42" y2="18" stroke="#61758a" stroke-width="2"></line><polyline id="graphLine" points="" fill="none" stroke="#6f3fb2" stroke-width="4"></polyline><g id="graphPoints"></g><text x="170" y="174" class="axis-label">distance</text><text x="14" y="90" class="axis-label" transform="rotate(-90 14 90)">field strength</text></svg>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script>
    (()=>{
      const distances=[1,2,3,4], kq=8990;
      let selected=null;const results=new Map();let completionSent=false;
      const distanceButtons=document.getElementById('distanceButtons'),runBtn=document.getElementById('runBtn'),runStatus=document.getElementById('runStatus');
      const probe=document.getElementById('probe'),arrowGroup=document.getElementById('arrowGroup'),arrow=document.getElementById('arrow'),measureLabel=document.getElementById('measureLabel');
      const checks=document.getElementById('checks'),dataBody=document.getElementById('dataBody'),analysis=document.getElementById('analysis'),lockText=document.getElementById('lockText'),analysisContent=document.getElementById('analysisContent'),analysisChoices=document.getElementById('analysisChoices'),feedback=document.getElementById('feedback'),graphWrap=document.getElementById('graphWrap'),graphLine=document.getElementById('graphLine'),graphPoints=document.getElementById('graphPoints'),resetBtn=document.getElementById('resetBtn'),ticks=document.getElementById('ticks');
      function shuffle(a){const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]]}return c}
      function xFor(d){return 95+d*105}
      function strength(d){return Math.round(kq/(d*d))}
      function buildTicks(){ticks.innerHTML='';distances.forEach(d=>{const x=xFor(d);const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',x);l.setAttribute('x2',x);l.setAttribute('y1',168);l.setAttribute('y2',183);l.setAttribute('stroke','#61758a');l.setAttribute('stroke-width','2');ticks.appendChild(l);const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',x);t.setAttribute('y',205);t.setAttribute('class','axis-label');t.setAttribute('text-anchor','middle');t.textContent=`${d} m`;ticks.appendChild(t)})}
      function buildButtons(){distanceButtons.innerHTML='';distances.forEach(d=>{const b=document.createElement('button');b.type='button';b.className='rph-distance';b.textContent=`${d} m`;b.dataset.distance=d;b.addEventListener('click',()=>selectDistance(d));distanceButtons.appendChild(b)})}
      function buildChecks(){checks.innerHTML='';distances.forEach(d=>{const c=document.createElement('span');c.className='rph-check'+(results.has(d)?' done':'');c.textContent=results.has(d)?`${d} m ✓`:`${d} m`;checks.appendChild(c)})}
      function selectDistance(d){selected=d;[...distanceButtons.children].forEach(b=>b.classList.toggle('selected',Number(b.dataset.distance)===d));probe.setAttribute('transform',`translate(${xFor(d)-210} 0)`);arrowGroup.classList.add('rph-hidden');runBtn.disabled=results.has(d);runStatus.textContent=results.has(d)?`${d} m is already recorded.`:`Probe set to ${d} m.`}
      function run(){if(selected===null||results.has(selected))return;const e=strength(selected);const x=xFor(selected);const len=Math.max(42,Math.min(118,42+e/115));arrow.setAttribute('x1',x);arrow.setAttribute('x2',x+len);measureLabel.setAttribute('x',x+len/2);measureLabel.textContent=`${e.toLocaleString()} N/C`;arrowGroup.classList.remove('rph-hidden');results.set(selected,e);runBtn.disabled=true;runStatus.textContent=`Trial recorded at ${selected} m.`;renderTable();buildChecks();if(results.size===4)unlock()}
      function renderTable(){dataBody.innerHTML='';[...results.entries()].sort((a,b)=>a[0]-b[0]).forEach(([d,e])=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${d} m</td><td>${e.toLocaleString()} N/C</td>`;dataBody.appendChild(tr)})}
      function unlock(){analysis.classList.remove('locked');lockText.classList.add('rph-hidden');analysisContent.classList.remove('rph-hidden');analysisChoices.innerHTML='';shuffle(['one-half','one-fourth','two times','four times']).forEach(label=>{const b=document.createElement('button');b.type='button';b.className='rph-choice';b.textContent=label;b.addEventListener('click',()=>answer(label));analysisChoices.appendChild(b)});analysisContent.querySelector('button').focus()}
      function answer(label){[...analysisChoices.querySelectorAll('button')].forEach(b=>b.disabled=true);const correct='one-fourth';feedback.textContent=label===correct?'It becomes one-fourth as strong. The measurements follow an inverse-square pattern, E ∝ 1/r².':`It becomes one-fourth as strong, not ${label}. The measurements follow an inverse-square pattern, E ∝ 1/r².`;drawGraph();graphWrap.classList.remove('rph-hidden');if(!completionSent){completionSent=true;window.parent.postMessage({type:'complete'},'*')}}
      function drawGraph(){graphPoints.innerHTML='';const pts=distances.map(d=>{const x=42+(d-1)*88;const y=145-(strength(d)/strength(1))*112;const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r','5');c.setAttribute('fill','#6f3fb2');graphPoints.appendChild(c);return`${x},${y}`});graphLine.setAttribute('points',pts.join(' '))}
      function reset(){selected=null;results.clear();completionSent=false;runBtn.disabled=true;runStatus.textContent='No trial selected.';probe.setAttribute('transform','translate(0 0)');arrowGroup.classList.add('rph-hidden');dataBody.innerHTML='<tr><td colspan="2" class="rph-empty">Run four trials.</td></tr>';analysis.classList.add('locked');lockText.classList.remove('rph-hidden');analysisContent.classList.add('rph-hidden');feedback.textContent='';graphWrap.classList.add('rph-hidden');buildButtons();buildChecks()}
      runBtn.addEventListener('click',run);resetBtn.addEventListener('click',reset);buildTicks();buildButtons();buildChecks();
    })();
  </script>
</main>
</body>
</html>
