<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700"><rect x="0" y="0" width="1440" height="700" rx="24" fill="#eff5f9" stroke="none" stroke-width="3"/><rect x="28" y="28" width="1384" height="644" rx="24" fill="white" stroke="none" stroke-width="3"/><circle cx="370" cy="330" r="140" fill="#eff5f9" stroke="#3869b1" stroke-width="3"/><path d="M510,330 L570,290 L600,370 L650,315 L690,350 L735,320" fill="none" stroke="#dd8432" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><circle cx="885" cy="330" r="140" fill="#eff5f9" stroke="#687e90" stroke-width="3"/><text x="370" y="340" font-family="Arial,sans-serif" font-size="35" fill="#3869b1" text-anchor="middle">− − −</text><text x="900" y="340" font-family="Arial,sans-serif" font-size="35" fill="#c34b65" text-anchor="middle">+ + +</text><text x="720" y="110" font-family="Arial,sans-serif" font-size="34" fill="#18354e" text-anchor="middle">air becomes conducting</text><text x="720" y="550" font-family="Arial,sans-serif" font-size="31" fill="#18354e" text-anchor="middle">a brief charge transfer through an ionized path</text><text x="720" y="624" font-family="Arial,sans-serif" font-size="27" fill="#687e90" text-anchor="middle">A sufficiently strong electric field can ionize air and allow a discharge.</text></svg>