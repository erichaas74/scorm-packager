<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700"><rect x="0" y="0" width="1440" height="700" rx="24" fill="#eff5f9" stroke="none" stroke-width="3"/><rect x="28" y="28" width="1384" height="644" rx="24" fill="white" stroke="none" stroke-width="3"/><text x="720" y="100" font-family="Arial,sans-serif" font-size="44" fill="#07828b" text-anchor="middle">R = ρL / A</text><rect x="270" y="215" width="420" height="90" rx="20" fill="#eff5f9" stroke="#687e90" stroke-width="3"/><text x="480.0" y="187" font-family="Arial,sans-serif" font-size="29" fill="#18354e" text-anchor="middle">length L</text><rect x="270" y="420" width="840" height="90" rx="20" fill="#eff5f9" stroke="#687e90" stroke-width="3"/><text x="690.0" y="392" font-family="Arial,sans-serif" font-size="29" fill="#18354e" text-anchor="middle">length 2L</text><text x="1160" y="275" font-family="Arial,sans-serif" font-size="39" fill="#3869b1" text-anchor="middle">R</text><text x="1200" y="480" font-family="Arial,sans-serif" font-size="39" fill="#dd8432" text-anchor="middle">2R</text><text x="720" y="624" font-family="Arial,sans-serif" font-size="27" fill="#687e90" text-anchor="middle">Same material and area: doubling wire length doubles resistance.</text></svg>