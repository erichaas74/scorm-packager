<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700"><rect x="0" y="0" width="1440" height="700" rx="24" fill="#eff5f9" stroke="none" stroke-width="3"/><rect x="28" y="28" width="1384" height="644" rx="24" fill="white" stroke="none" stroke-width="3"/><text x="720" y="100" font-family="Arial,sans-serif" font-size="44" fill="#07828b" text-anchor="middle">R = ρL / A</text><rect x="250" y="200" width="640" height="100" rx="20" fill="#eff5f9" stroke="#687e90" stroke-width="3"/><text x="570.0" y="172" font-family="Arial,sans-serif" font-size="29" fill="#18354e" text-anchor="middle">copper • lower resistivity</text><rect x="250" y="405" width="640" height="100" rx="20" fill="#eff5f9" stroke="#687e90" stroke-width="3"/><text x="570.0" y="377" font-family="Arial,sans-serif" font-size="29" fill="#18354e" text-anchor="middle">iron • higher resistivity</text><text x="1100" y="265" font-family="Arial,sans-serif" font-size="32" fill="#07828b" text-anchor="middle">lower R</text><text x="1100" y="470" font-family="Arial,sans-serif" font-size="32" fill="#dd8432" text-anchor="middle">higher R</text><text x="720" y="624" font-family="Arial,sans-serif" font-size="27" fill="#687e90" text-anchor="middle">Compare wires of equal length, area, and temperature to isolate material resistivity.</text></svg>