<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><rect width="1200" height="600" rx="28" fill="#eef3f8"/><rect x="24" y="24" width="1152" height="552" rx="20" fill="white"/><g font-family="Arial, sans-serif"><text x="65" y="75" font-size="28" fill="#19334a">Charging an isolated metal sphere by induction</text><circle cx="650" cy="300" r="125" fill="#e4eaf2" stroke="#7a8ca5" stroke-width="3"/><rect x="633" y="425" width="34" height="85" rx="12" fill="#d5dfe9"/><text x="550" y="550" font-size="23" fill="#19334a">insulating stand</text><circle cx="752" cy="300" r="16" fill="#bb5264"/><text x="741" y="310" font-size="36" fill="white">+</text><circle cx="599" cy="388.33459118601274" r="16" fill="#bb5264"/><text x="588" y="398.33459118601274" font-size="36" fill="white">+</text><circle cx="599" cy="211.66540881398726" r="16" fill="#bb5264"/><text x="588" y="221.66540881398726" font-size="36" fill="white">+</text><text x="120" y="290" font-size="29" fill="#19334a">Rod removed</text><text x="825" y="250" font-size="26" fill="#19334a">Positive net charge</text><text x="825" y="295" font-size="23" fill="#19334a">spreads over the surface.</text><text x="105" y="500" font-size="25" fill="#19334a">Disconnect ground first; then remove the rod.</text></g></svg>