<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voltage Push Model</title>
  <style>
    html, body { background: transparent; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
    .app { max-width: 720px; margin: 0 auto; padding: 8px; box-sizing: border-box; }
    .card { border: 5px solid #285f9f; border-radius: 12px; background: #f8fafc; overflow: hidden; display: flex; flex-direction: column; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #e2e8f0; border-bottom: 1px solid #cbd5e1; }
    .header h1 { margin: 0; font-size: 1rem; font-weight: 600; color: #1e293b; }
    .stage { position: relative; width: 100%; aspect-ratio: 16/9; background: #0f172a; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    .prompt-area { padding: 12px; background: #fff; border-top: 1px solid #e2e8f0; min-height: 130px; display: flex; flex-direction: column; gap: 8px; }
    .prompt { margin: 0; font-size: 0.95rem; color: #1e293b; line-height: 1.4; }
    .choices { display: flex; flex-wrap: wrap; gap: 8px; }
    .choices button { flex: 1 1 110px; padding: 10px 12px; font-size: 0.9rem; font-weight: 600; border: 2px solid #285f9f; border-radius: 8px; background: #fff; color: #1e293b; cursor: pointer; min-height: 44px; }
    .choices button:hover, .choices button:focus { background: #dbeafe; outline: 2px solid #285f9f; outline-offset: 2px; }
    .feedback { margin: 0; font-size: 0.9rem; color: #0f172a; min-height: 1.4em; }
    .main-btn { align-self: flex-start; padding: 10px 20px; font-size: 0.95rem; font-weight: 600; border: none; border-radius: 8px; background: #285f9f; color: #fff; cursor: pointer; min-height: 44px; }
    .main-btn:hover, .main-btn:focus { background: #1e4a7a; outline: 2px solid #1e4a7a; outline-offset: 2px; }
    .hidden { display: none !important; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .controls label { font-size: 0.85rem; color: #334155; display: flex; flex-direction: column; gap: 2px; }
    .controls input[type="range"] { width: 160px; }
    .readout { font-family: ui-monospace, monospace; background: #e2e8f0; padding: 6px 10px; border-radius: 6px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main class="app">
    <section class="card">
      <div class="header">
        <h1>Voltage Push Model</h1>
        <button class="main-btn" data-reset style="padding:6px 12px;font-size:0.85rem;background:#64748b;">Reset</button>
      </div>
      <div class="stage" aria-label="Simple circuit with battery and resistor">
        <canvas id="c" width="640" height="360" role="img" aria-label="Battery, resistor, and current flow"></canvas>
      </div>
      <div class="prompt-area" aria-live="polite">
        <p class="prompt" data-prompt>A battery drives current through a fixed resistor.</p>
        <div class="choices" data-choices hidden>
          <button data-choice="more">Current increases</button>
          <button data-choice="less">Current decreases</button>
          <button data-choice="same">Current stays the same</button>
        </div>
        <div class="controls" data-controls hidden>
          <label>Voltage (V)
            <input type="range" id="vSlider" min="1" max="12" value="6" step="1">
          </label>
          <span class="readout" data-readout>I = ? A</span>
        </div>
        <p class="feedback" data-feedback></p>
        <button class="main-btn" data-main>Start</button>
      </div>
    </section>
  </main>
  <script>
    (function() {
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      const promptEl = document.querySelector('[data-prompt]');
      const choicesEl = document.querySelector('[data-choices]');
      const feedbackEl = document.querySelector('[data-feedback]');
      const mainBtn = document.querySelector('[data-main]');
      const resetBtn = document.querySelector('[data-reset]');
      const controlsEl = document.querySelector('[data-controls]');
      const readoutEl = document.querySelector('[data-readout]');
      const vSlider = document.getElementById('vSlider');

      let state = 'setup';
      let prediction = null;
      let V = 6;
      const R = 3; // fixed ohms
      let showI = false;
      let particles = [];
      let animId = null;
      let completed = false;

      function initParticles() {
        particles = [];
        for (let i = 0; i < 20; i++) {
          particles.push({ t: i / 20 });
        }
      }

      function draw() {
        const W = canvas.width, H = canvas.height;
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, W, H);

        // battery
        ctx.fillStyle = '#64748b';
        ctx.fillRect(40, 140, 50, 80);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(40, 140, 50, 28);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('+', 65, 160);
        ctx.fillText('−', 65, 205);
        ctx.fillStyle = '#fbbf24';
        ctx.font = '13px system-ui';
        ctx.fillText(V + ' V', 65, 130);

        // wires
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(90, 155);
        ctx.lineTo(200, 155);
        ctx.lineTo(200, 100);
        ctx.lineTo(440, 100);
        ctx.lineTo(440, 155);
        ctx.lineTo(550, 155);
        ctx.lineTo(550, 205);
        ctx.lineTo(440, 205);
        ctx.lineTo(440, 260);
        ctx.lineTo(200, 260);
        ctx.lineTo(200, 205);
        ctx.lineTo(90, 205);
        ctx.stroke();

        // resistor zigzag
        ctx.strokeStyle = '#f97316';
        ctx.lineWidth = 4;
        ctx.beginPath();
        let rx = 250;
        ctx.moveTo(200, 100);
        for (let i = 0; i < 6; i++) {
          ctx.lineTo(rx, 100 - (i % 2 === 0 ? 18 : -18));
          rx += 30;
        }
        ctx.lineTo(440, 100);
        ctx.stroke();
        ctx.fillStyle = '#f97316';
        ctx.font = '12px system-ui';
        ctx.fillText('R = ' + R + ' Ω', 320, 70);

        // current particles (clockwise conventional)
        if (showI) {
          const I = V / R;
          const speed = 0.008 * (I / 2);
          particles.forEach(p => {
            p.t = (p.t + speed) % 1;
            let x, y;
            const tt = p.t;
            // approximate path length segments
            if (tt < 0.2) { // top left to resistor
              x = 200 + (tt / 0.2) * 240;
              y = 100;
            } else if (tt < 0.35) {
              x = 440;
              y = 100 + ((tt - 0.2) / 0.15) * 55;
            } else if (tt < 0.55) {
              x = 440 + ((tt - 0.35) / 0.2) * 110;
              y = 155;
            } else if (tt < 0.65) {
              x = 550;
              y = 155 + ((tt - 0.55) / 0.1) * 50;
            } else if (tt < 0.85) {
              x = 550 - ((tt - 0.65) / 0.2) * 350;
              y = 205;
            } else {
              x = 200;
              y = 205 - ((tt - 0.85) / 0.15) * 50;
            }
            ctx.beginPath();
            ctx.arc(x, y, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#38bdf8';
            ctx.fill();
          });
        }

        // I readout on canvas
        if (showI) {
          const I = (V / R).toFixed(2);
          ctx.fillStyle = '#e2e8f0';
          ctx.font = 'bold 16px system-ui';
          ctx.textAlign = 'center';
          ctx.fillText('I = V / R = ' + I + ' A', W / 2, H - 20);
        }
      }

      function tick() {
        draw();
        animId = requestAnimationFrame(tick);
      }

      function updateReadout() {
        if (showI) {
          readoutEl.textContent = 'I = ' + (V / R).toFixed(2) + ' A';
        } else {
          readoutEl.textContent = 'I = ? A';
        }
      }

      function render() {
        choicesEl.classList.add('hidden');
        controlsEl.classList.add('hidden');
        mainBtn.classList.remove('hidden');
        feedbackEl.textContent = '';
        showI = false;

        if (state === 'setup') {
          promptEl.textContent = 'A battery drives current through a fixed resistor.';
          mainBtn.textContent = 'Start';
          V = 6;
          vSlider.value = 6;
          initParticles();
          draw();
          if (!animId) tick();
        } else if (state === 'predict') {
          promptEl.textContent = 'If you raise the battery voltage, what happens to current?';
          choicesEl.classList.remove('hidden');
          choicesEl.innerHTML = '';
          const opts = [
            { v: 'more', t: 'Current increases' },
            { v: 'less', t: 'Current decreases' },
            { v: 'same', t: 'Current stays the same' }
          ];
          for (let i = opts.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [opts[i], opts[j]] = [opts[j], opts[i]];
          }
          opts.forEach(o => {
            const b = document.createElement('button');
            b.dataset.choice = o.v;
            b.textContent = o.t;
            b.addEventListener('click', () => choose(o.v));
            choicesEl.appendChild(b);
          });
          mainBtn.classList.add('hidden');
          draw();
        } else if (state === 'adjust') {
          promptEl.textContent = 'Adjust voltage. Watch current and flow.';
          controlsEl.classList.remove('hidden');
          showI = true;
          updateReadout();
          mainBtn.textContent = 'Finish';
          draw();
        } else if (state === 'explain') {
          feedbackEl.textContent = 'Higher voltage pushes more charge per second. Current rises in proportion: I = V / R.';
          mainBtn.textContent = 'Replay';
          showI = true;
          updateReadout();
          draw();
          if (!completed) {
            completed = true;
            try { window.parent.postMessage({ type: 'complete' }, '*'); } catch (e) {}
          }
        }
      }

      function choose(v) {
        if (state !== 'predict') return;
        prediction = v;
        state = 'adjust';
        render();
      }

      vSlider.addEventListener('input', () => {
        V = +vSlider.value;
        updateReadout();
      });

      mainBtn.addEventListener('click', () => {
        if (state === 'setup') {
          state = 'predict';
          render();
        } else if (state === 'adjust') {
          state = 'explain';
          render();
        } else if (state === 'explain') {
          state = 'setup';
          prediction = null;
          completed = false;
          render();
        }
      });

      resetBtn.addEventListener('click', () => {
        state = 'setup';
        prediction = null;
        completed = false;
        if (animId) { cancelAnimationFrame(animId); animId = null; }
        render();
      });

      initParticles();
      render();
    })();
  </script>
</body>
</html>
