<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materials and Charge Behavior</title>
  <style>
    /* Rise Compatibility: Transparent background */
    html, body {
      background: transparent;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      color: #1a1a1a;
      box-sizing: border-box;
    }
    
    *, *::before, *::after {
      box-sizing: inherit;
    }

    .walkthrough {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      padding: 1rem;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 0.5rem;
    }

    .header h2 {
      margin: 0;
      font-size: 1.125rem;
      font-weight: 600;
      color: #334155;
    }

    .progress {
      font-size: 0.875rem;
      color: #64748b;
      font-weight: 500;
    }

    /* Simulation Stage */
    .stage {
      width: 100%;
      height: 280px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
    }

    /* Standardized Learner Card */
    .card {
      border: 5px solid #285f9f;
      border-radius: 12px;
      padding: 1.5rem;
      background: #ffffff;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .card p {
      margin: 0 0 1rem 0;
      line-height: 1.5;
    }

    #prompt-text {
      font-weight: 600;
      font-size: 1.05rem;
    }

    /* Accessible Interactive Controls */
    .choices {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    button {
      font-family: inherit;
      font-size: 1rem;
      font-weight: 500;
      padding: 0.875rem 1rem;
      border: 2px solid #cbd5e1;
      border-radius: 6px;
      background: #ffffff;
      color: #1e293b;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
      min-height: 48px; /* WCAG Pointer Target minimum */
    }

    button:hover {
      border-color: #285f9f;
      background: #f0f7ff;
    }

    button:focus-visible {
      outline: 3px solid #285f9f;
      outline-offset: 2px;
    }

    .action-btn {
      text-align: center;
      background: #285f9f;
      color: #ffffff;
      border-color: #285f9f;
      margin-top: 1rem;
      width: 100%;
    }

    .action-btn:hover {
      background: #1e4b82;
      border-color: #1e4b82;
      color: #ffffff;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  
  <main class="walkthrough">
    
    <div class="header">
      <h2 id="scenario-title">Scenario Title</h2>
      <span class="progress" id="progress" aria-live="polite">1 / 4</span>
    </div>

    <!-- The physical situation the learner watches -->
    <div class="stage" aria-label="Charge Simulation Stage" role="img">
      <svg id="sim-svg" width="100%" height="100%" viewBox="0 0 760 280">
        <defs>
          <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6" />
          </marker>
        </defs>
        <g id="svg-content"></g>
      </svg>
    </div>

    <!-- The decision card -->
    <div class="card" aria-live="polite">
      <p id="setup-text"></p>
      <p id="prompt-text"></p>
      
      <div id="choices" class="choices" role="group" aria-label="Prediction Choices"></div>
      
      <div id="feedback-panel" class="hidden">
        <p id="feedback-text"></p>
        <button id="next-btn" class="action-btn">Next Scenario</button>
      </div>
    </div>

    <script>
      /** 
       * Type 2 Scenario Array
       */
      const scenarios = [
        {
          id: 1,
          title: "Conductor vs. Insulator Charge Motion",
          setup: "A small cluster of excess electrons is placed on the center of a copper rod (left) and a glass rod (right).",
          promptText: "What happens to the excess electrons on each material over time?",
          choices: [
            { text: "Spread out on both" },
            { text: "Stay put on both" },
            { text: "Spread on copper, stay on glass" }
          ],
          feedback: "Electrons spread across the copper but remain clustered on the glass. Conductors allow free charge movement, while insulators hold charges exactly where they are placed.",
          getSVG: (reveal) => {
            const base = `
              <rect x="150" y="100" width="160" height="40" rx="4" fill="#fb923c" />
              <text x="230" y="80" text-anchor="middle" font-weight="bold" fill="#c2410c">Copper (Conductor)</text>
              
              <rect x="450" y="100" width="160" height="40" rx="4" fill="#94a3b8" opacity="0.6"/>
              <text x="530" y="80" text-anchor="middle" font-weight="bold" fill="#475569">Glass (Insulator)</text>
            `;
            if (!reveal) {
              return base + `
                <!-- Initial cluster on Copper -->
                <circle cx="230" cy="120" r="8" fill="#3b82f6"/><text x="230" y="123" fill="#fff" font-size="10" text-anchor="middle">-</text>
                <circle cx="215" cy="120" r="8" fill="#3b82f6"/><text x="215" y="123" fill="#fff" font-size="10" text-anchor="middle">-</text>
                <circle cx="245" cy="120" r="8" fill="#3b82f6"/><text x="245" y="123" fill="#fff" font-size="10" text-anchor="middle">-</text>
                
                <!-- Initial cluster on Glass -->
                <circle cx="530" cy="120" r="8" fill="#3b82f6"/><text x="530" y="123" fill="#fff" font-size="10" text-anchor="middle">-</text>
                <circle cx="515" cy="120" r="8" fill="#3b82f6"/><text x="515" y="123" fill="#fff" font-size="10" text-anchor="middle">-</text>
                <circle cx="545" cy="120" r="8" fill="#3b82f6"/><text x="545" y="123" fill="#fff" font-size="10" text-anchor="middle">-</text>
                
                <text x="380" y="200" text-anchor="middle" font-size="36" font-weight="bold" fill="#94a3b8">?</text>
              `;
            } else {
              return base + `
                <!-- Spread on Copper -->
                <circle cx="165" cy="120" r="8" fill="#3b82f6"/><text x="165" y="123" fill="#fff" font-size="10" text-anchor="middle">-</text>
                <circle cx="230" cy="120" r="8" fill="#3b82f6"/><text x="230" y="123" fill="#fff" font-size="10" text-anchor="middle">-</text>
                <circle cx="295" cy="120" r="8" fill="#3b82f6"/><text x="295" y="123" fill="#fff" font-size="10" text-anchor="middle">-</text>
                <path d="M 180 120 L 210 120" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
                <path d="M 280 120 L 250 120" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
                <text x="230" y="165" text-anchor="middle" font-size="14" fill="#3b82f6" font-weight="bold">Repel & Spread</text>
                
                <!-- Clustered on Glass -->
                <circle cx="530" cy="120" r="8" fill="#3b82f6"/><text x="530" y="123" fill="#fff" font-size="10" text-anchor="middle">-</text>
                <circle cx="515" cy="120" r="8" fill="#3b82f6"/><text x="515" y="123" fill="#fff" font-size="10" text-anchor="middle">-</text>
                <circle cx="545" cy="120" r="8" fill="#3b82f6"/><text x="545" y="123" fill="#fff" font-size="10" text-anchor="middle">-</text>
                <text x="530" y="165" text-anchor="middle" font-size="14" fill="#475569" font-weight="bold">Stuck in place</text>
              `;
            }
          }
        },
        {
          id: 2,
          title: "Charging by Induction",
          setup: "A negatively charged rod is brought near a neutral metal sphere. The sphere is briefly connected to the ground, then the ground and rod are removed.",
          promptText: "What is the final net charge of the metal sphere?",
          choices: [
            { text: "Negative" },
            { text: "Positive" },
            { text: "Neutral" }
          ],
          feedback: "The sphere becomes positive. The rod repelled electrons down the ground wire; when the wire was cut, the sphere was left with a deficit of electrons.",
          getSVG: (reveal) => {
            const base = `
              <circle cx="380" cy="140" r="50" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
            `;
            if (!reveal) {
              return base + `
                <!-- Rod -->
                <rect x="180" y="130" width="100" height="20" rx="4" fill="#ef4444" />
                <text x="230" y="145" text-anchor="middle" fill="#fff" font-weight="bold">------</text>
                <!-- Ground Wire -->
                <path d="M 430 140 L 500 140 L 500 180" stroke="#475569" stroke-width="3" fill="none"/>
                <path d="M 480 180 L 520 180 M 490 188 L 510 188 M 495 196 L 505 196" stroke="#475569" stroke-width="3"/>
                <text x="380" y="80" text-anchor="middle" font-size="36" font-weight="bold" fill="#94a3b8">?</text>
              `;
            } else {
              return base + `
                <text x="380" y="120" text-anchor="middle" font-size="24" fill="#ef4444" font-weight="bold">+</text>
                <text x="360" y="150" text-anchor="middle" font-size="24" fill="#ef4444" font-weight="bold">+</text>
                <text x="400" y="150" text-anchor="middle" font-size="24" fill="#ef4444" font-weight="bold">+</text>
                <text x="380" y="175" text-anchor="middle" font-size="24" fill="#ef4444" font-weight="bold">+</text>
                <text x="380" y="220" text-anchor="middle" font-size="14" fill="#ef4444" font-weight="bold">Electrons escaped; Net Positive</text>
              `;
            }
          }
        },
        {
          id: 3,
          title: "Polarization Without Charge Transfer",
          setup: "A positively charged rod is brought near a neutral wooden block (an insulator).",
          promptText: "Does the neutral wooden block experience an electrical force?",
          choices: [
            { text: "Yes, its molecules stretch and attract" },
            { text: "No, insulators don't react" },
            { text: "Yes, electrons jump to the rod" }
          ],
          feedback: "Yes, it experiences an attractive force. The wood's molecules polarize, pulling their electron clouds slightly toward the positive rod without leaving their atoms.",
          getSVG: (reveal) => {
            const base = `
              <rect x="200" y="120" width="100" height="20" rx="4" fill="#3b82f6" />
              <text x="250" y="136" text-anchor="middle" fill="#fff" font-weight="bold">++++++</text>
              
              <rect x="360" y="80" width="120" height="100" rx="2" fill="#d97706" />
            `;
            if (!reveal) {
              return base + `<text x="420" y="135" text-anchor="middle" font-size="36" font-weight="bold" fill="#fcd34d">?</text>`;
            } else {
              return base + `
                <!-- Polarized Molecules -->
                <ellipse cx="390" cy="100" rx="15" ry="8" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
                <text x="382" y="104" font-size="12" fill="#ef4444" font-weight="bold">-</text><text x="398" y="104" font-size="12" fill="#3b82f6" font-weight="bold">+</text>
                
                <ellipse cx="390" cy="130" rx="15" ry="8" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
                <text x="382" y="134" font-size="12" fill="#ef4444" font-weight="bold">-</text><text x="398" y="134" font-size="12" fill="#3b82f6" font-weight="bold">+</text>
                
                <ellipse cx="390" cy="160" rx="15" ry="8" fill="#fef3c7" stroke="#b45309" stroke-width="1"/>
                <text x="382" y="164" font-size="12" fill="#ef4444" font-weight="bold">-</text><text x="398" y="164" font-size="12" fill="#3b82f6" font-weight="bold">+</text>
                
                <path d="M 350 130 L 320 130" stroke="#ef4444" stroke-width="3" marker-end="url(#arrow-red)"/>
                <text x="420" y="210" text-anchor="middle" font-size="14" fill="#b45309" font-weight="bold">Attraction due to surface polarization</text>
              `;
            }
          }
        },
        {
          id: 4,
          title: "Sharp-Point Charge Concentration",
          setup: "Excess electrons are added to a tear-drop shaped metal conductor (sharp on the left, round on the right).",
          promptText: "Where do the excess charges concentrate the most?",
          choices: [
            { text: "Evenly across the surface" },
            { text: "At the round, wide end" },
            { text: "At the sharp, pointed end" }
          ],
          feedback: "Charges concentrate at the sharp, pointed end. Repulsive forces push mobile charges into regions of tight curvature, causing a dense electric field.",
          getSVG: (reveal) => {
            const base = `
              <path d="M 220 140 Q 300 60 450 80 Q 520 140 450 200 Q 300 220 220 140 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
            `;
            if (!reveal) {
              return base + `<text x="360" y="150" text-anchor="middle" font-size="36" font-weight="bold" fill="#94a3b8">?</text>`;
            } else {
              return base + `
                <!-- Sparse on round side -->
                <text x="440" y="95" font-size="20" fill="#3b82f6" font-weight="bold">-</text>
                <text x="475" y="145" font-size="20" fill="#3b82f6" font-weight="bold">-</text>
                <text x="440" y="195" font-size="20" fill="#3b82f6" font-weight="bold">-</text>
                <text x="380" y="90" font-size="20" fill="#3b82f6" font-weight="bold">-</text>
                <text x="380" y="200" font-size="20" fill="#3b82f6" font-weight="bold">-</text>
                
                <!-- Dense on point -->
                <text x="240" y="130" font-size="20" fill="#ef4444" font-weight="bold">-</text>
                <text x="240" y="145" font-size="20" fill="#ef4444" font-weight="bold">-</text>
                <text x="240" y="160" font-size="20" fill="#ef4444" font-weight="bold">-</text>
                <text x="260" y="125" font-size="20" fill="#ef4444" font-weight="bold">-</text>
                <text x="260" y="165" font-size="20" fill="#ef4444" font-weight="bold">-</text>
                <text x="275" y="115" font-size="20" fill="#ef4444" font-weight="bold">-</text>
                <text x="275" y="175" font-size="20" fill="#ef4444" font-weight="bold">-</text>

                <text x="260" y="235" text-anchor="middle" font-size="14" fill="#ef4444" font-weight="bold">High Charge Density</text>
              `;
            }
          }
        }
      ];

      // Walkthrough State Machine
      let currentScenarioIndex = 0;
      let state = 'setup'; // 'setup' -> 'reveal'
      let completed = false;

      // Utility: Shuffle choices
      function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
          randomIndex = Math.floor(Math.random() * currentIndex);
          currentIndex--;
          [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
      }

      function renderScenario() {
        state = 'setup';
        const scen = scenarios[currentScenarioIndex];
        
        // Reset Text and Progress
        document.getElementById('scenario-title').innerText = scen.title;
        document.getElementById('progress').innerText = `${currentScenarioIndex + 1} / ${scenarios.length}`;
        document.getElementById('setup-text').innerHTML = scen.setup;
        document.getElementById('prompt-text').innerHTML = scen.promptText;
        
        // Render SVG for Prediction state
        document.getElementById('svg-content').innerHTML = scen.getSVG(false);

        // Manage Card Visibility Blocks
        const choicesDiv = document.getElementById('choices');
        choicesDiv.innerHTML = '';
        choicesDiv.classList.remove('hidden');
        document.getElementById('prompt-text').classList.remove('hidden');
        document.getElementById('feedback-panel').classList.add('hidden');

        // Build Buttons
        const shuffledOptions = shuffle([...scen.choices]);
        shuffledOptions.forEach(opt => {
          const btn = document.createElement('button');
          btn.innerText = opt.text;
          btn.onclick = () => choose();
          choicesDiv.appendChild(btn);
        });
      }

      function choose() {
        if (state !== 'setup') return;
        state = 'reveal';

        const scen = scenarios[currentScenarioIndex];

        // 1. Hide choices and prompt
        document.getElementById('choices').classList.add('hidden');
        document.getElementById('prompt-text').classList.add('hidden');

        // 2. Reveal visual evidence synchronized with the choice
        document.getElementById('svg-content').innerHTML = scen.getSVG(true);

        // 3. Show succinct feedback block
        const fbPanel = document.getElementById('feedback-panel');
        fbPanel.classList.remove('hidden');
        document.getElementById('feedback-text').innerHTML = scen.feedback;

        // 4. Update the Next action
        const nextBtn = document.getElementById('next-btn');
        if (currentScenarioIndex === scenarios.length - 1) {
          nextBtn.innerText = "Finish";
          nextBtn.onclick = finishWalkthrough;
        } else {
          nextBtn.innerText = "Next Scenario";
          nextBtn.onclick = () => {
            currentScenarioIndex++;
            renderScenario();
          };
        }
      }

      function finishWalkthrough() {
        if (!completed) {
          window.parent.postMessage({ type: 'complete' }, '*');
          completed = true;
        }
        document.getElementById('feedback-text').innerHTML = "<strong>Walkthrough complete.</strong> You have successfully explored how charge behaves differently in conductors and insulators.";
        document.getElementById('next-btn').classList.add('hidden');
      }

      // Initialize the first loop
      renderScenario();
    </script>
  </main>
</body>
</html>
