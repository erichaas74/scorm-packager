<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Circuit Wire Placement Challenge</title>
<style>
  :root {
    --bg: #eef3f8;
    --panel: #ffffff;
    --ink: #0f172a;
    --muted: #64748b;
    --blue: #2563eb;
    --good: #16a34a;
    --bad: #dc2626;
    --warn: #f59e0b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: var(--ink);
  }
  body { padding: 12px; }
  .app {
    max-width: 940px;
    margin: 0 auto;
    background: var(--panel);
    border: 3px solid #94a3b8;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 8px 28px rgba(15, 23, 42, 0.12);
  }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: linear-gradient(180deg, #f8fbff, #eef4fb);
    border-bottom: 1px solid #cbd5e1;
  }
  .top h1 { margin: 0; font-size: 1.1rem; }
  .reset {
    border: 0;
    border-radius: 10px;
    padding: 9px 14px;
    background: #64748b;
    color: white;
    font-weight: 700;
    cursor: pointer;
  }
  .stage {
    background: var(--bg);
    padding: 10px;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 4 / 3;
    border-radius: 14px;
    background: #f4f7fb;
    touch-action: manipulation;
  }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>Circuit Wire Placement Challenge</h1>
    <button id="resetBtn" class="reset">Reset</button>
  </div>
  <div class="stage">
    <canvas id="c" width="900" height="675" aria-label="Click directly on a dotted green wire to answer the circuit question"></canvas>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const resetBtn = document.getElementById('resetBtn');

  const questions = [
    {
      prompt: 'Which dotted green line closes the circuit?',
      correct: 'B',
      type: 'closed',
      feedback: 'B closes the gap. Current flows through the bulb, so it lights up.'
    },
    {
      prompt: 'Which dotted green line does nothing?',
      correct: 'C',
      type: 'nothing',
      feedback: 'C connects two spots already on the same red wire, so it does not change the circuit.'
    },
    {
      prompt: 'Which dotted green line creates a short circuit?',
      correct: 'A',
      type: 'short',
      feedback: 'A bypasses the load and creates a short circuit.'
    }
  ];

  let qIndex = 0;
  let answered = false;
  let selected = null;
  let revealType = null;
  let hoverLetter = null;
  let animStart = 0;
  let time = 0;
  let autoAdvanceAt = null;
  let completionSent = false;

  const points = {
    A: { x: 270, yTop: 180, yBottom: 505, labelX: 270, labelY: 573 },
    B: { x: 428, yTop: 180, yBottom: 311, labelX: 428, labelY: 573 },
    C: { x: 705, yTop: 311, yBottom: 505, labelX: 705, labelY: 573 }
  };

  const hitBoxes = {
    A: { x: 245, y: 168, w: 50, h: 345 },
    B: { x: 403, y: 168, w: 50, h: 155 },
    C: { x: 680, y: 299, w: 50, h: 214 }
  };

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  function roundRect(x, y, w, h, r, fill, stroke, lineWidth = 2) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth; ctx.stroke(); }
  }

  function drawWire(path, color, width = 6, dash = []) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.setLineDash(dash);
    ctx.beginPath();
    ctx.moveTo(path[0][0], path[0][1]);
    for (let i = 1; i < path.length; i++) ctx.lineTo(path[i][0], path[i][1]);
    ctx.stroke();
    ctx.restore();
  }

  function drawPartialVertical(x, y1, y2, progress, color, width = 8) {
    const y = y1 + (y2 - y1) * clamp(progress, 0, 1);
    drawWire([[x, y1], [x, y]], color, width);
  }

  function drawRealisticBattery() {
    const x = 72, y = 220, w = 84, h = 165;
    const grad = ctx.createLinearGradient(x, y, x + w, y);
    grad.addColorStop(0, '#f8fafc');
    grad.addColorStop(0.22, '#ffffff');
    grad.addColorStop(0.55, '#dfe5eb');
    grad.addColorStop(0.82, '#f8fafc');
    grad.addColorStop(1, '#cdd5df');
    roundRect(x, y, w, h, 10, grad, '#111827', 2.5);

    ctx.fillStyle = '#111827';
    ctx.fillRect(x + 25, y - 14, 16, 14);
    ctx.fillRect(x + 48, y - 12, 10, 12);
    ctx.fillStyle = '#9ca3af';
    roundRect(x + 23, y - 19, 20, 7, 3, '#aeb8c4', '#111827', 1.5);
    roundRect(x + 46, y - 17, 14, 5, 3, '#c5ced8', '#111827', 1.5);

    const gloss = ctx.createLinearGradient(x + 12, y, x + 28, y);
    gloss.addColorStop(0, 'rgba(255,255,255,0.55)');
    gloss.addColorStop(1, 'rgba(255,255,255,0)');
    roundRect(x + 10, y + 10, 18, h - 20, 8, gloss, null);

    ctx.fillStyle = '#111827';
    ctx.font = '700 16px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('−', x + w / 2, y + 26);
    ctx.fillStyle = '#dc2626';
    ctx.fillText('+', x + w / 2, y + h - 22);

    ctx.save();
    ctx.translate(x + w / 2, y + h / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillStyle = '#111827';
    ctx.font = '700 17px system-ui';
    ctx.fillText('Battery', 0, 0);
    ctx.restore();
  }

  function drawRealisticBulb(glowAmount) {
    const cx = 590, cy = 250;
    const glassGlow = Math.max(0, glowAmount);

    if (glassGlow > 0) {
      const halo = ctx.createRadialGradient(cx, cy - 12, 12, cx, cy - 12, 110);
      halo.addColorStop(0, `rgba(255, 245, 157, ${0.55 * glassGlow})`);
      halo.addColorStop(0.45, `rgba(250, 204, 21, ${0.18 * glassGlow})`);
      halo.addColorStop(1, 'rgba(250, 204, 21, 0)');
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(cx, cy - 10, 105, 0, Math.PI * 2);
      ctx.fill();

      for (let i = 0; i < 10; i++) {
        const ang = (Math.PI * 2 * i) / 10;
        const r1 = 72;
        const r2 = 92 + glassGlow * 10;
        ctx.strokeStyle = `rgba(245, 158, 11, ${0.28 + 0.22 * glassGlow})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(ang) * r1, cy - 14 + Math.sin(ang) * r1);
        ctx.lineTo(cx + Math.cos(ang) * r2, cy - 14 + Math.sin(ang) * r2);
        ctx.stroke();
      }
    }

    ctx.save();
    ctx.translate(cx, cy);

    const glass = ctx.createLinearGradient(-48, -92, 48, 54);
    if (glassGlow > 0) {
      glass.addColorStop(0, '#fffde7');
      glass.addColorStop(0.4, '#fff59d');
      glass.addColorStop(0.8, '#fde68a');
      glass.addColorStop(1, '#fef3c7');
    } else {
      glass.addColorStop(0, '#fffef7');
      glass.addColorStop(0.45, '#fff9c4');
      glass.addColorStop(1, '#eceff4');
    }

    ctx.fillStyle = glass;
    ctx.strokeStyle = '#111827';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(-36, 20);
    ctx.bezierCurveTo(-45, -6, -52, -44, -26, -72);
    ctx.bezierCurveTo(-8, -93, 8, -93, 26, -72);
    ctx.bezierCurveTo(52, -44, 45, -6, 36, 20);
    ctx.quadraticCurveTo(26, 34, 22, 40);
    ctx.lineTo(-22, 40);
    ctx.quadraticCurveTo(-26, 34, -36, 20);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,255,255,0.72)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-18, -60);
    ctx.quadraticCurveTo(-26, -20, -16, 18);
    ctx.stroke();

    ctx.strokeStyle = glowAmount > 0 ? '#d97706' : '#8b5e3c';
    ctx.lineWidth = 2.8;
    ctx.beginPath();
    ctx.moveTo(-12, 8);
    ctx.lineTo(-12, -16);
    ctx.quadraticCurveTo(0, -28, 12, -16);
    ctx.lineTo(12, 8);
    ctx.stroke();

    ctx.strokeStyle = '#6b7280';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-15, 6);
    ctx.lineTo(-6, 18);
    ctx.moveTo(15, 6);
    ctx.lineTo(6, 18);
    ctx.stroke();

    const metal = ctx.createLinearGradient(-27, 42, 27, 90);
    metal.addColorStop(0, '#e5e7eb');
    metal.addColorStop(0.28, '#bfc6cf');
    metal.addColorStop(0.55, '#8d99a6');
    metal.addColorStop(0.82, '#d7dce2');
    metal.addColorStop(1, '#9ca3af');
    ctx.fillStyle = metal;
    roundRect(-28, 40, 56, 42, 10, metal, '#111827', 2.5);
    ctx.strokeStyle = '#4b5563';
    ctx.lineWidth = 2;
    for (let i = 0; i < 5; i++) {
      const yy = 48 + i * 7;
      ctx.beginPath();
      ctx.moveTo(-24, yy);
      ctx.lineTo(24, yy);
      ctx.stroke();
    }

    ctx.fillStyle = '#7c8693';
    ctx.beginPath();
    ctx.ellipse(0, 86, 8, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#111827';
    ctx.font = '700 17px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('Load', 0, -52);

    ctx.restore();
  }

  function drawChoiceLabel(letter, active = false, hover = false) {
    const p = points[letter];
    const fill = active ? '#dbeafe' : hover ? '#eff6ff' : '#ffffff';
    const stroke = active ? '#2563eb' : hover ? '#60a5fa' : '#94a3b8';
    roundRect(p.labelX - 28, p.labelY - 24, 56, 42, 12, fill, stroke, 2);
    ctx.fillStyle = active || hover ? '#2563eb' : '#334155';
    ctx.font = '800 28px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(letter, p.labelX, p.labelY - 2);
  }

  function drawCallout(x, y, text, color) {
    ctx.font = '700 16px system-ui';
    const w = ctx.measureText(text).width + 24;
    roundRect(x - w / 2, y - 17, w, 34, 10, '#ffffff', color, 2);
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y + 1);
  }

  function drawStatusBubble(text, tone) {
    let stroke = '#94a3b8';
    let fill = 'rgba(255,255,255,0.92)';
    if (tone === 'good') { stroke = '#16a34a'; fill = 'rgba(240,253,244,0.96)'; }
    if (tone === 'warn') { stroke = '#f59e0b'; fill = 'rgba(255,251,235,0.97)'; }
    if (tone === 'bad') { stroke = '#dc2626'; fill = 'rgba(254,242,242,0.97)'; }
    roundRect(90, 604, 720, 42, 12, fill, stroke, 2);
    ctx.fillStyle = '#0f172a';
    ctx.font = '600 17px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, 450, 625);
  }

  function drawDotsAlongPath(path, color, speed, count, phase) {
    const lengths = [];
    let total = 0;
    for (let i = 0; i < path.length - 1; i++) {
      const dx = path[i + 1][0] - path[i][0];
      const dy = path[i + 1][1] - path[i][1];
      const L = Math.hypot(dx, dy);
      lengths.push(L);
      total += L;
    }
    ctx.fillStyle = color;
    for (let p = 0; p < count; p++) {
      let d = ((p / count) + phase * speed) % 1 * total;
      let seg = 0;
      while (seg < lengths.length - 1 && d > lengths[seg]) {
        d -= lengths[seg];
        seg++;
      }
      const f = lengths[seg] === 0 ? 0 : d / lengths[seg];
      const x = path[seg][0] + (path[seg + 1][0] - path[seg][0]) * f;
      const y = path[seg][1] + (path[seg + 1][1] - path[seg][1]) * f;
      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawBaseCircuit(glowAmount = 0) {
    const W = canvas.width;
    const H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#eef3f8';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#0f172a';
    ctx.font = '800 34px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(questions[qIndex].prompt, W / 2, 18);

    roundRect(34, 76, W - 68, 580, 18, '#f8fafc', '#cbd5e1', 2);

    drawRealisticBattery();

    // black top wire from battery negative to top rail
    drawWire([[109, 220], [109, 180], [428, 180]], '#000000', 6);

    // black wire from B connection down to left contact of bulb base
    drawWire([[428, 311], [534, 311], [562, 311]], '#000000', 6);

    // red wire from right contact of bulb base back to battery positive
    drawWire([[618, 311], [790, 311], [790, 505], [110, 505], [110, 385]], '#ef0000', 6);

    // bulb drawn after wires so base appears connected
    drawRealisticBulb(glowAmount);

    const dotted = [10, 8];
    ['A', 'B', 'C'].forEach(letter => {
      const p = points[letter];
      const isHover = hoverLetter === letter && !answered;
      drawWire([[p.x, p.yTop], [p.x, p.yBottom]], isHover ? '#16a34a' : '#22c55e', isHover ? 8 : 6, dotted);
    });

    drawChoiceLabel('A', selected === 'A', hoverLetter === 'A' && !answered);
    drawChoiceLabel('B', selected === 'B', hoverLetter === 'B' && !answered);
    drawChoiceLabel('C', selected === 'C', hoverLetter === 'C' && !answered);

    if (!answered) {
      drawStatusBubble('Click directly on a dotted green line.', 'neutral');
    }
  }

  function drawReveal() {
    if (!revealType) return;
    const elapsed = (performance.now() - animStart) / 1000;
    const q = questions[qIndex];
    const correct = selected === q.correct;

    if (revealType === 'closed') {
      const closeProgress = clamp(elapsed / 0.9, 0, 1);
      const glowProgress = clamp((elapsed - 0.9) / 0.7, 0, 1);
      drawBaseCircuit(glowProgress);
      drawPartialVertical(points.B.x, points.B.yTop, points.B.yBottom, closeProgress, '#16a34a', 9);
      drawCallout(points.B.labelX, 575, 'closes circuit', '#16a34a');
      drawStatusBubble((correct ? 'Correct. ' : 'Not quite. ') + q.feedback, correct ? 'good' : 'warn');
      if (closeProgress >= 1) {
        const currentPath = [[109,220],[109,180],[428,180],[428,311],[562,311],[618,311],[790,311],[790,505],[110,505],[110,385]];
        drawDotsAlongPath(currentPath, '#16a34a', 0.35, 18, time / 60);
      }
    } else if (revealType === 'nothing') {
      drawBaseCircuit(0);
      drawWire([[points.C.x, points.C.yTop], [points.C.x, points.C.yBottom]], '#f59e0b', 8);
      drawCallout(points.C.labelX, 575, 'does nothing', '#f59e0b');
      drawStatusBubble((correct ? 'Correct. ' : 'Not quite. ') + q.feedback, correct ? 'good' : 'warn');
    } else if (revealType === 'short') {
      const closeProgress = clamp(elapsed / 0.8, 0, 1);
      drawBaseCircuit(0);
      if (Math.floor(time / 18) % 2 === 0) {
        ctx.fillStyle = 'rgba(220,38,38,0.08)';
        ctx.fillRect(34, 76, canvas.width - 68, 580);
      }
      drawPartialVertical(points.A.x, points.A.yTop, points.A.yBottom, closeProgress, '#dc2626', 9);
      drawCallout(points.A.labelX, 575, 'short circuit', '#dc2626');
      drawStatusBubble((correct ? 'Correct. ' : 'Not quite. ') + q.feedback, correct ? 'good' : 'bad');
      if (closeProgress >= 1) {
        const shortPath = [[109,220],[109,180],[270,180],[270,505],[110,505],[110,385]];
        drawDotsAlongPath(shortPath, '#dc2626', 0.5, 16, time / 60);
      }
    }
  }

  function renderQuestion() {
    answered = false;
    selected = null;
    revealType = null;
    hoverLetter = null;
    autoAdvanceAt = null;
    drawBaseCircuit(0);
  }

  function handleAnswer(letter) {
    if (answered) return;
    answered = true;
    selected = letter;
    revealType = questions[qIndex].type;
    animStart = performance.now();
    autoAdvanceAt = performance.now() + 2600;
  }

  function getCanvasPos(evt) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
      x: (evt.clientX - rect.left) * scaleX,
      y: (evt.clientY - rect.top) * scaleY
    };
  }

  function getHitLetter(x, y) {
    for (const [letter, box] of Object.entries(hitBoxes)) {
      if (x >= box.x && x <= box.x + box.w && y >= box.y && y <= box.y + box.h) return letter;
    }
    return null;
  }

  canvas.addEventListener('mousemove', evt => {
    if (answered) return;
    const pos = getCanvasPos(evt);
    hoverLetter = getHitLetter(pos.x, pos.y);
    canvas.style.cursor = hoverLetter ? 'pointer' : 'default';
  });

  canvas.addEventListener('mouseleave', () => {
    hoverLetter = null;
    canvas.style.cursor = 'default';
  });

  canvas.addEventListener('click', evt => {
    if (answered) return;
    const pos = getCanvasPos(evt);
    const hit = getHitLetter(pos.x, pos.y);
    if (hit) handleAnswer(hit);
  });

  resetBtn.addEventListener('click', () => {
    qIndex = 0;
    completionSent = false;
    renderQuestion();
  });

  function advanceQuestion() {
    if (qIndex === questions.length - 1 && !completionSent) {
      completionSent = true;
      try { window.parent.postMessage({ type: 'complete' }, '*'); } catch (error) {}
    }
    qIndex = (qIndex + 1) % questions.length;
    renderQuestion();
  }

  function loop() {
    time++;
    drawBaseCircuit(0);
    drawReveal();
    if (autoAdvanceAt && performance.now() >= autoAdvanceAt) advanceQuestion();
    requestAnimationFrame(loop);
  }

  renderQuestion();
  loop();
})();
</script>
</body>
</html>
