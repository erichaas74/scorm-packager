<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Magnetic Braking Model</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#16283b;--blue:#285f9f;--ink:#16283b;--muted:#5c6f82;--panel:#f5f8fb;--line:#b9c8d8;--good:#176b43;--warn:#8a4f00;--red:#a22b2b}
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{padding:8px}
.app{width:min(980px,100%);margin:0 auto;border:5px solid #285f9f;border-radius:18px;background:#fff;overflow:hidden;box-shadow:0 8px 24px rgba(23,48,76,.12)}
.app header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);background:#f8fbff}
.app h1{font-size:clamp(1.05rem,2.4vw,1.45rem);margin:0}
.app button,.app select,.app input{font:inherit}
.app button{min-height:44px;border:2px solid var(--blue);border-radius:10px;background:#fff;color:var(--blue);font-weight:700;padding:8px 14px;cursor:pointer}
.app button:hover{background:#edf5ff}.app button:focus-visible,.app select:focus-visible,.app input:focus-visible{outline:4px solid #f0b429;outline-offset:2px}
.app button.primary{background:var(--blue);color:#fff}.app button.primary:hover{background:#1f4e83}.app button:disabled{opacity:.48;cursor:not-allowed}
.stage{min-height:420px;padding:18px;background:linear-gradient(#f7fbff,#eef5fb);display:grid;place-items:center;position:relative}
.stage svg{width:100%;height:auto;max-height:430px;display:block}
.card{margin:0 18px 18px;border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff}
.prompt{font-size:1.08rem;font-weight:700;margin:0 0 12px}.subtle{color:var(--muted);margin:4px 0 12px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.choices button{width:100%}
.feedback{min-height:50px;margin:12px 0 0;font-weight:700}.feedback.good{color:var(--good)}.feedback.bad{color:var(--red)}
.status-row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.pill{border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:#fff;font-weight:700}.hidden{display:none!important}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:10px 0}.control{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel)}.control label{display:block;font-weight:700;margin-bottom:7px}.control output{display:block;font-weight:700;margin-top:7px;color:var(--blue)}
.meter{height:18px;border:1px solid #8ca0b5;border-radius:999px;background:#e9eef3;overflow:hidden}.meter>span{display:block;height:100%;width:0;background:#5f8fbd;transition:width .5s ease}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.9rem;color:var(--muted)}.legend span{display:inline-flex;gap:6px;align-items:center}.swatch{width:14px;height:14px;border-radius:3px;border:1px solid #52677d}
.progress{font-weight:700;color:var(--muted)}
@media(max-width:620px){body{padding:3px}.app{border-width:5px}.app header{padding:10px 12px}.stage{min-height:330px;padding:10px}.card{margin:0 10px 10px;padding:12px}.choices{grid-template-columns:1fr}.controls{grid-template-columns:1fr}.app button{min-height:48px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}

.tube{fill:rgba(120,130,140,.16);stroke:#70849a;stroke-width:8}.copper{stroke:#b87333}.slot{stroke-dasharray:18 10}.magnet{fill:url(#magGrad);stroke:#26384c;stroke-width:3}.dropA,.dropB{transition:transform 1.5s cubic-bezier(.35,.05,.7,1)}.reveal .fast{transform:translateY(240px)}.reveal .slow{transform:translateY(110px)}.eddy{fill:none;stroke:#1f79a8;stroke-width:5;opacity:0;stroke-dasharray:8 5}.force-arrow{opacity:0;fill:#8a4f00;font-weight:700}.force-arrow line{stroke:#8a4f00;stroke-width:6}.reveal .eddy{opacity:1;animation:ring 1s infinite alternate}.reveal .force-arrow{opacity:1}@keyframes ring{to{stroke-width:8;opacity:.35}}
</style></head><body><main class="app" id="app"><header><h1>Magnetic Braking Model</h1><button id="reset">Reset</button></header><section class="stage"><svg viewBox="0 0 900 430" role="img" aria-labelledby="bTitle bDesc"><title id="bTitle">Two tube magnetic braking comparison</title><desc id="bDesc">Two identical magnets are positioned above different vertical tubes. Their motion and induced-current rings appear after a prediction.</desc><defs><linearGradient id="magGrad" x1="0" x2="1"><stop offset="0" stop-color="#b94343"/><stop offset=".5" stop-color="#b94343"/><stop offset=".5" stop-color="#3b6ea8"/><stop offset="1" stop-color="#3b6ea8"/></linearGradient></defs><text x="280" y="38" text-anchor="middle" font-size="24" font-weight="700" id="labelA"></text><text x="620" y="38" text-anchor="middle" font-size="24" font-weight="700" id="labelB"></text><rect x="225" y="100" width="110" height="280" rx="18" class="tube" id="tubeA"/><rect x="565" y="100" width="110" height="280" rx="18" class="tube" id="tubeB"/><g class="dropA"><rect x="240" y="55" width="80" height="38" rx="10" class="magnet"/><ellipse cx="280" cy="145" rx="70" ry="22" class="eddy"/></g><g id="forceA" class="force-arrow"><line x1="190" y1="205" x2="190" y2="155"/><polygon points="190,140 178,160 202,160" fill="#8a4f00"/><text x="155" y="225">Opposing force</text></g><g class="dropB"><rect x="580" y="55" width="80" height="38" rx="10" class="magnet"/><ellipse cx="620" cy="145" rx="70" ry="22" class="eddy"/></g><g id="forceB" class="force-arrow"><line x1="710" y1="205" x2="710" y2="155"/><polygon points="710,140 698,160 722,160" fill="#8a4f00"/><text x="675" y="225">Opposing force</text></g><line x1="170" y1="390" x2="730" y2="390" stroke="#52677d" stroke-width="8"/></svg></section><section class="card" aria-live="polite"><div class="progress" id="progress"></div><p class="prompt" id="prompt"></p><div class="choices" id="choices"></div><p class="feedback" id="feedback"></p><button id="next" class="hidden">Next comparison</button></section><script>
(()=>{const scenarios=[
{a:'Copper tube',b:'Plastic tube',aClass:'copper',bClass:'',slow:'a',q:'Which magnet reaches the bottom last?',choices:['Copper tube','Plastic tube','Same time'],answer:'Copper tube',ex:'The copper tube slows the magnet. Changing flux produces eddy currents whose magnetic force opposes the motion.'},
{a:'Solid copper',b:'Slotted copper',aClass:'copper',bClass:'copper slot',slow:'a',q:'Which design produces stronger magnetic braking?',choices:['Solid copper','Slotted copper','Same braking'],answer:'Solid copper',ex:'The solid tube produces stronger braking. The slot interrupts closed current loops and weakens the opposing field.'},
{a:'Thick copper',b:'Thin copper',aClass:'copper',bClass:'copper',slow:'a',q:'Which tube gives more controlled slowing?',choices:['Thick copper','Thin copper','No difference'],answer:'Thick copper',ex:'The thicker conductor supports larger induced currents. Stronger induced currents create a larger opposing force without contact.'}
];let idx=0,chosen=null,completed=false;const $=s=>document.querySelector(s);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function render(){const s=scenarios[idx];$('#progress').textContent=`Comparison ${idx+1} of ${scenarios.length}`;$('#prompt').textContent=s.q;$('#labelA').textContent=s.a;$('#labelB').textContent=s.b;$('#tubeA').setAttribute('class','tube '+s.aClass);$('#tubeB').setAttribute('class','tube '+s.bClass);$('.dropA').setAttribute('class','dropA');$('.dropB').setAttribute('class','dropB');$('.dropA .eddy').style.display=s.aClass.includes('copper')?'':'none';$('.dropB .eddy').style.display=s.bClass.includes('copper')?'':'none';$('#forceA').style.display=s.aClass.includes('copper')?'':'none';$('#forceB').style.display=s.bClass.includes('copper')?'':'none';$('#app').classList.remove('reveal');$('#feedback').textContent='';$('#feedback').className='feedback';$('#next').classList.add('hidden');chosen=null;$('#choices').innerHTML='';shuffle(s.choices).forEach(c=>{const b=document.createElement('button');b.textContent=c;b.onclick=()=>choose(c);$('#choices').appendChild(b)})}function choose(c){if(chosen)return;chosen=c;const s=scenarios[idx];$('#choices').querySelectorAll('button').forEach(b=>b.disabled=true);$('.dropA').classList.add(s.slow==='a'?'slow':'fast');$('.dropB').classList.add(s.slow==='b'?'slow':'fast');$('#app').classList.add('reveal');setTimeout(()=>{$('#feedback').textContent=s.ex;$('#feedback').className='feedback '+(c===s.answer?'good':'bad');$('#next').classList.remove('hidden');if(idx===scenarios.length-1)$('#next').textContent='Evaluate design'},700)}function next(){if(idx<scenarios.length-1){idx++;render()}else{$('#prompt').textContent='Best design for strong, contact-free controlled slowing?';$('#choices').innerHTML='';['Solid copper path','Plastic guide','Slotted conductor'].forEach(c=>{const b=document.createElement('button');b.textContent=c;b.onclick=()=>finish(c);$('#choices').appendChild(b)});$('#feedback').textContent='';$('#next').classList.add('hidden')}}function finish(c){$('#choices').querySelectorAll('button').forEach(b=>b.disabled=true);$('#feedback').textContent=c==='Solid copper path'?'A solid copper path provides the strongest controlled noncontact braking. Continuous conducting loops allow larger induced currents.':'A solid copper path is the stronger design. It supports continuous induced-current loops that oppose motion.';$('#feedback').className='feedback '+(c==='Solid copper path'?'good':'bad');complete()}function complete(){if(completed)return;completed=true;window.parent.postMessage({type:'complete'},'*')}$('#next').onclick=next;$('#reset').onclick=()=>{idx=0;completed=false;render()};render();})();
</script></main></body></html>
