<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motors, Generators, and Energy Transfer</title>
  <style>
    /* Rise Compatibility: Transparent background */
    html, body {
      background: transparent;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      color: #1a1a1a;
      box-sizing: border-box;
    }
    
    *, *::before, *::after {
      box-sizing: inherit;
    }

    .walkthrough {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      padding: 1rem;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 0.5rem;
    }

    .header h2 {
      margin: 0;
      font-size: 1.125rem;
      font-weight: 600;
      color: #334155;
    }

    .progress {
      font-size: 0.875rem;
      color: #64748b;
      font-weight: 500;
    }

    /* Simulation Stage */
    .stage {
      width: 100%;
      height: 280px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
    }

    /* Standardized Learner Card */
    .card {
      border: 5px solid #285f9f;
      border-radius: 12px;
      padding: 1.5rem;
      background: #ffffff;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .card p {
      margin: 0 0 1rem 0;
      line-height: 1.5;
    }

    #prompt-text {
      font-weight: 600;
      font-size: 1.05rem;
    }

    /* Accessible Interactive Controls */
    .choices {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    button {
      font-family: inherit;
      font-size: 1rem;
      font-weight: 500;
      padding: 0.875rem 1rem;
      border: 2px solid #cbd5e1;
      border-radius: 6px;
      background: #ffffff;
      color: #1e293b;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
      min-height: 48px;
    }

    button:hover {
      border-color: #285f9f;
      background: #f0f7ff;
    }

    button:focus-visible {
      outline: 3px solid #285f9f;
      outline-offset: 2px;
    }

    .action-btn {
      text-align: center;
      background: #285f9f;
      color: #ffffff;
      border-color: #285f9f;
      margin-top: 1rem;
      width: 100%;
    }

    .action-btn:hover {
      background: #1e4b82;
      border-color: #1e4b82;
      color: #ffffff;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  
  <main class="walkthrough">
    
    <div class="header">
      <h2 id="scenario-title">Scenario Title</h2>
      <span class="progress" id="progress" aria-live="polite">1 / 4</span>
    </div>

    <!-- The physical situation the learner watches -->
    <div class="stage" aria-label="Energy Transfer Simulation Stage" role="img">
      <svg id="sim-svg" width="100%" height="100%" viewBox="0 0 760 280">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6" />
          </marker>
          <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" />
          </marker>
        </defs>
        <g id="svg-content"></g>
      </svg>
    </div>

    <!-- The decision card -->
    <div class="card" aria-live="polite">
      <p id="setup-text"></p>
      <p id="prompt-text"></p>
      
      <div id="choices" class="choices" role="group" aria-label="Prediction Choices"></div>
      
      <div id="feedback-panel" class="hidden">
        <p id="feedback-text"></p>
        <button id="next-btn" class="action-btn">Next Scenario</button>
      </div>
    </div>

    <script>
      /** 
       * Type 2 Scenario Array
       */
      const scenarios = [
        {
          title: "Motor vs. Generator",
          setup: "A wire coil sits between two magnets, connected to a battery.",
          promptText: "Because electrical energy is being supplied to the coil in a magnetic field, what happens?",
          choices: [
            { text: "The coil rotates (Motor mode)" },
            { text: "The coil produces more electricity (Generator mode)" },
            { text: "The magnets flip their poles" }
          ],
          feedback: "The coil rotates (Motor mode). Adding electrical energy creates magnetic forces that spin the coil, converting electrical energy into mechanical energy.",
          getSVG: (reveal) => {
            let svg = `
              <!-- Magnets -->
              <rect x="180" y="80" width="60" height="100" fill="#ef4444" />
              <text x="210" y="135" text-anchor="middle" fill="#fff" font-weight="bold" font-size="20">N</text>
              <rect x="520" y="80" width="60" height="100" fill="#3b82f6" />
              <text x="550" y="135" text-anchor="middle" fill="#fff" font-weight="bold" font-size="20">S</text>
              
              <!-- Coil -->
              <rect x="290" y="100" width="180" height="60" fill="none" stroke="#b45309" stroke-width="6" />
              <line x1="380" y1="160" x2="380" y2="210" stroke="#b45309" stroke-width="4" />
              
              <!-- Battery -->
              <rect x="350" y="210" width="60" height="30" fill="#1e293b" />
              <text x="380" y="230" text-anchor="middle" fill="#fff" font-size="12">Battery</text>
            `;
            if (!reveal) {
              svg += `<text x="380" y="140" text-anchor="middle" font-size="36" font-weight="bold" fill="#94a3b8">?</text>`;
            } else {
              svg += `
                <path d="M 330 70 A 50 50 0 0 1 430 70" fill="none" stroke="#10b981" stroke-width="4" marker-end="url(#arrow-green)"/>
                <text x="380" y="50" text-anchor="middle" font-weight="bold" fill="#10b981">Mechanical Rotation</text>
                <text x="380" y="140" text-anchor="middle" font-size="18" font-weight="bold" fill="#b45309">Motor Mode</text>
              `;
            }
            return svg;
          }
        },
        {
          title: "DC Motor Commutator",
          setup: "A DC motor's coil rotates exactly halfway (180 degrees) through the magnetic field.",
          promptText: "What must the split-ring commutator do at this exact moment to keep the coil spinning in the same direction?",
          choices: [
            { text: "Reverse the direction of the current" },
            { text: "Increase the current's strength" },
            { text: "Turn off the magnetic field" }
          ],
          feedback: "Reverse the direction of the current. Flipping the current reverses the magnetic forces on the wire, pushing the coil through the next half-turn.",
          getSVG: (reveal) => {
            let svg = `
              <!-- Magnets -->
              <rect x="180" y="100" width="40" height="60" fill="#ef4444" />
              <text x="200" y="135" text-anchor="middle" fill="#fff" font-weight="bold">N</text>
              <rect x="540" y="100" width="40" height="60" fill="#3b82f6" />
              <text x="560" y="135" text-anchor="middle" fill="#fff" font-weight="bold">S</text>
              
              <!-- Coil and Commutator Setup -->
              <line x1="250" y1="130" x2="510" y2="130" stroke="#b45309" stroke-width="6" />
              
              <!-- Split ring commutator -->
              <path d="M 360 170 A 20 20 0 0 1 400 170" fill="none" stroke="#f59e0b" stroke-width="6" />
              <path d="M 360 180 A 20 20 0 0 0 400 180" fill="none" stroke="#f59e0b" stroke-width="6" />
              <line x1="375" y1="130" x2="375" y2="170" stroke="#b45309" stroke-width="4" />
              <line x1="385" y1="130" x2="385" y2="170" stroke="#b45309" stroke-width="4" />
            `;
            
            if (!reveal) {
              svg += `<text x="380" y="90" text-anchor="middle" font-size="36" font-weight="bold" fill="#94a3b8">?</text>`;
            } else {
              svg += `
                <!-- Current flipped arrows -->
                <path d="M 330 115 L 290 115" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)"/>
                <path d="M 430 145 L 470 145" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)"/>
                <text x="380" y="80" text-anchor="middle" font-weight="bold" fill="#10b981">Current Reversed</text>
                
                <!-- Force arrows continuing rotation -->
                <path d="M 270 130 L 270 90" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>
                <path d="M 490 130 L 490 170" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>
                <text x="270" y="75" text-anchor="middle" font-size="12" fill="#3b82f6">Force Up</text>
                <text x="490" y="190" text-anchor="middle" font-size="12" fill="#3b82f6">Force Down</text>
              `;
            }
            return svg;
          }
        },
        {
          title: "Hand-Crank Generator",
          setup: "You are turning a hand-crank generator at a steady speed to light a small bulb.",
          promptText: "How can you make the bulb burn brighter without turning the crank any faster?",
          choices: [
            { text: "Add more turns of wire to the coil" },
            { text: "Use weaker magnets" },
            { text: "Reverse the cranking direction" }
          ],
          feedback: "Add more turns of wire to the coil. More coil turns increase the induced voltage and current for the same mechanical input.",
          getSVG: (reveal) => {
            let svg = `
              <!-- Crank -->
              <circle cx="200" cy="140" r="40" fill="none" stroke="#64748b" stroke-width="4"/>
              <line x1="200" y1="140" x2="230" y2="110" stroke="#1e293b" stroke-width="6"/>
              <circle cx="230" cy="110" r="8" fill="#1e293b"/>
              <path d="M 170 110 A 40 40 0 0 1 230 95" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="4,4"/>
              
              <!-- Shaft -->
              <line x1="240" y1="140" x2="330" y2="140" stroke="#64748b" stroke-width="6"/>
            `;
            
            if (!reveal) {
              svg += `
                <!-- Few Coils -->
                <rect x="330" y="100" width="80" height="80" fill="none" stroke="#b45309" stroke-width="2" />
                
                <!-- Dim Bulb -->
                <circle cx="500" cy="140" r="20" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
                <line x1="410" y1="140" x2="480" y2="140" stroke="#475569" stroke-width="3"/>
                <text x="370" y="80" text-anchor="middle" font-size="36" font-weight="bold" fill="#94a3b8">?</text>
              `;
            } else {
              svg += `
                <!-- Many Coils -->
                <rect x="330" y="100" width="80" height="80" fill="none" stroke="#b45309" stroke-width="8" />
                <text x="370" y="80" text-anchor="middle" font-weight="bold" fill="#b45309">More Turns</text>
                
                <!-- Bright Bulb -->
                <circle cx="500" cy="140" r="20" fill="#fde047" stroke="#ca8a04" stroke-width="2"/>
                <!-- Rays -->
                <line x1="500" y1="100" x2="500" y2="80" stroke="#facc15" stroke-width="3"/>
                <line x1="540" y1="140" x2="560" y2="140" stroke="#facc15" stroke-width="3"/>
                <line x1="500" y1="180" x2="500" y2="200" stroke="#facc15" stroke-width="3"/>
                <line x1="460" y1="140" x2="440" y2="140" stroke="#facc15" stroke-width="3"/>
                <line x1="528" y1="112" x2="542" y2="98" stroke="#facc15" stroke-width="3"/>
                <line x1="528" y1="168" x2="542" y2="182" stroke="#facc15" stroke-width="3"/>
                
                <line x1="410" y1="140" x2="480" y2="140" stroke="#475569" stroke-width="3"/>
                <text x="500" y="225" text-anchor="middle" font-weight="bold" fill="#ca8a04">Higher Voltage & Brighter Bulb</text>
              `;
            }
            return svg;
          }
        },
        {
          title: "Dynamic Microphone Model",
          setup: "A sound wave pushes a microphone diaphragm back and forth, moving an attached wire coil near a magnet.",
          promptText: "As the diaphragm and coil vibrate, what happens inside the coil?",
          choices: [
            { text: "An alternating electrical signal is induced" },
            { text: "The coil becomes permanently magnetized" },
            { text: "The wire generates its own sound waves" }
          ],
          feedback: "An alternating electrical signal is induced. The back-and-forth motion changes the magnetic flux, generating an electrical signal that matches the sound wave.",
          getSVG: (reveal) => {
            let svg = `
              <!-- Magnet -->
              <rect x="400" y="110" width="40" height="60" fill="#ef4444" />
              <text x="420" y="145" text-anchor="middle" fill="#fff" font-weight="bold">N</text>
              
              <!-- Sound Waves -->
              <path d="M 120 110 Q 140 140 120 170" fill="none" stroke="#94a3b8" stroke-width="3"/>
              <path d="M 140 100 Q 170 140 140 180" fill="none" stroke="#94a3b8" stroke-width="3"/>
              <path d="M 160 90 Q 200 140 160 190" fill="none" stroke="#94a3b8" stroke-width="3"/>
            `;
            
            if (!reveal) {
              svg += `
                <!-- Diaphragm & Coil Static -->
                <line x1="240" y1="80" x2="240" y2="200" stroke="#1e293b" stroke-width="4" />
                <rect x="240" y="125" width="100" height="30" fill="none" stroke="#b45309" stroke-width="4" />
                
                <text x="320" y="80" text-anchor="middle" font-size="36" font-weight="bold" fill="#94a3b8">?</text>
              `;
            } else {
              svg += `
                <!-- Diaphragm & Coil Moving (shifted right) -->
                <line x1="260" y1="80" x2="260" y2="200" stroke="#1e293b" stroke-width="4" />
                <rect x="260" y="125" width="110" height="30" fill="none" stroke="#b45309" stroke-width="4" />
                
                <!-- Motion Arrows -->
                <path d="M 230 220 L 290 220" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>
                <path d="M 290 230 L 230 230" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow)"/>
                
                <!-- Signal Graph -->
                <rect x="520" y="100" width="120" height="80" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
                <path d="M 520 140 Q 550 100 580 140 T 640 140" fill="none" stroke="#10b981" stroke-width="3"/>
                <text x="580" y="200" text-anchor="middle" font-weight="bold" fill="#10b981" font-size="14">Alternating Signal</text>
              `;
            }
            return svg;
          }
        }
      ];

      // Walkthrough State Machine
      let currentScenarioIndex = 0;
      let state = 'setup'; // 'setup' -> 'reveal'
      let completed = false;

      // Utility: Shuffle choices
      function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
          randomIndex = Math.floor(Math.random() * currentIndex);
          currentIndex--;
          [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
      }

      function renderScenario() {
        state = 'setup';
        const scen = scenarios[currentScenarioIndex];
        
        // Reset Text and Progress
        document.getElementById('scenario-title').innerText = scen.title;
        document.getElementById('progress').innerText = `${currentScenarioIndex + 1} / ${scenarios.length}`;
        document.getElementById('setup-text').innerHTML = scen.setup;
        document.getElementById('prompt-text').innerHTML = scen.promptText;
        
        // Render SVG for Prediction state
        document.getElementById('svg-content').innerHTML = scen.getSVG(false);

        // Manage Card Visibility Blocks
        const choicesDiv = document.getElementById('choices');
        choicesDiv.innerHTML = '';
        choicesDiv.classList.remove('hidden');
        document.getElementById('prompt-text').classList.remove('hidden');
        document.getElementById('feedback-panel').classList.add('hidden');

        // Build Buttons
        const shuffledOptions = shuffle([...scen.choices]);
        shuffledOptions.forEach(opt => {
          const btn = document.createElement('button');
          btn.innerText = opt.text;
          btn.onclick = () => choose();
          choicesDiv.appendChild(btn);
        });
      }

      function choose() {
        if (state !== 'setup') return;
        state = 'reveal';

        const scen = scenarios[currentScenarioIndex];

        // Hide choices and prompt
        document.getElementById('choices').classList.add('hidden');
        document.getElementById('prompt-text').classList.add('hidden');

        // Reveal visual evidence synchronized with the choice
        document.getElementById('svg-content').innerHTML = scen.getSVG(true);

        // Show succinct feedback block
        const fbPanel = document.getElementById('feedback-panel');
        fbPanel.classList.remove('hidden');
        document.getElementById('feedback-text').innerHTML = scen.feedback;

        // Update the Next action
        const nextBtn = document.getElementById('next-btn');
        if (currentScenarioIndex === scenarios.length - 1) {
          nextBtn.innerText = "Finish";
          nextBtn.onclick = finishWalkthrough;
        } else {
          nextBtn.innerText = "Next Scenario";
          nextBtn.onclick = () => {
            currentScenarioIndex++;
            renderScenario();
          };
        }
      }

      function finishWalkthrough() {
        if (!completed) {
          window.parent.postMessage({ type: 'complete' }, '*');
          completed = true;
        }
        document.getElementById('feedback-text').innerHTML = "<strong>Walkthrough complete.</strong> You have successfully compared how motors and generators transfer energy.";
        document.getElementById('next-btn').classList.add('hidden');
      }

      // Initialize the first loop
      renderScenario();
    </script>
  </main>
</body>
</html>
