<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Electromagnetic Device Evidence Sorter</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#16283b;--blue:#285f9f;--ink:#16283b;--muted:#5c6f82;--panel:#f5f8fb;--line:#b9c8d8;--good:#176b43;--warn:#8a4f00;--red:#a22b2b}
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{padding:8px}
.app{width:min(980px,100%);margin:0 auto;border:5px solid #285f9f;border-radius:18px;background:#fff;overflow:hidden;box-shadow:0 8px 24px rgba(23,48,76,.12)}
.app header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);background:#f8fbff}
.app h1{font-size:clamp(1.05rem,2.4vw,1.45rem);margin:0}
.app button,.app select,.app input{font:inherit}
.app button{min-height:44px;border:2px solid var(--blue);border-radius:10px;background:#fff;color:var(--blue);font-weight:700;padding:8px 14px;cursor:pointer}
.app button:hover{background:#edf5ff}.app button:focus-visible,.app select:focus-visible,.app input:focus-visible{outline:4px solid #f0b429;outline-offset:2px}
.app button.primary{background:var(--blue);color:#fff}.app button.primary:hover{background:#1f4e83}.app button:disabled{opacity:.48;cursor:not-allowed}
.stage{min-height:420px;padding:18px;background:linear-gradient(#f7fbff,#eef5fb);display:grid;place-items:center;position:relative}
.stage svg{width:100%;height:auto;max-height:430px;display:block}
.card{margin:0 18px 18px;border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff}
.prompt{font-size:1.08rem;font-weight:700;margin:0 0 12px}.subtle{color:var(--muted);margin:4px 0 12px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.choices button{width:100%}
.feedback{min-height:50px;margin:12px 0 0;font-weight:700}.feedback.good{color:var(--good)}.feedback.bad{color:var(--red)}
.status-row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.pill{border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:#fff;font-weight:700}.hidden{display:none!important}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:10px 0}.control{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel)}.control label{display:block;font-weight:700;margin-bottom:7px}.control output{display:block;font-weight:700;margin-top:7px;color:var(--blue)}
.meter{height:18px;border:1px solid #8ca0b5;border-radius:999px;background:#e9eef3;overflow:hidden}.meter>span{display:block;height:100%;width:0;background:#5f8fbd;transition:width .5s ease}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.9rem;color:var(--muted)}.legend span{display:inline-flex;gap:6px;align-items:center}.swatch{width:14px;height:14px;border-radius:3px;border:1px solid #52677d}
.progress{font-weight:700;color:var(--muted)}
@media(max-width:620px){body{padding:3px}.app{border-width:5px}.app header{padding:10px 12px}.stage{min-height:330px;padding:10px}.card{margin:0 10px 10px;padding:12px}.choices{grid-template-columns:1fr}.controls{grid-template-columns:1fr}.app button{min-height:48px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}

.device{fill:#eaf1f7;stroke:#52677d;stroke-width:4}.accent{fill:none;stroke:#b87333;stroke-width:10}.fieldline{fill:none;stroke:#2d7cb8;stroke-width:4;stroke-dasharray:8 5;opacity:0}.reveal .fieldline{opacity:1}.motion{opacity:0}.reveal .motion{opacity:1;animation:nudge .8s infinite alternate}@keyframes nudge{to{transform:translateX(22px)}}
</style></head><body><main class="app" id="app"><header><h1>Device Evidence Sorter</h1><button id="reset">Reset</button></header><section class="stage"><svg viewBox="0 0 900 420" role="img" aria-labelledby="dTitle dDesc"><title id="dTitle">Electromagnetic device model</title><desc id="dDesc">A simplified device diagram is shown. Field lines or motion indicators appear only after an answer.</desc><g id="diagram"></g></svg></section><section class="card" aria-live="polite"><div class="progress" id="progress"></div><p class="prompt" id="prompt"></p><div class="choices" id="choices"></div><p class="feedback" id="feedback"></p><button id="next" class="hidden">Next device</button></section><script>
(()=>{const mechanisms=['Current creates a field','A field exerts force','Changing flux induces current'];const devices=[
{name:'Electric motor',answer:'A field exerts force',reason:'The motor turns because a magnetic field exerts force on current-carrying conductors.',kind:'motor'},
{name:'Generator',answer:'Changing flux induces current',reason:'Rotation changes magnetic flux through a coil and induces voltage.',kind:'generator'},
{name:'Metal detector',answer:'Current creates a field',reason:'Alternating current in the search coil creates the changing magnetic field used to detect metal.',kind:'detector'},
{name:'Dynamic microphone',answer:'Changing flux induces current',reason:'The moving coil changes magnetic flux and produces an electrical signal.',kind:'microphone'},
{name:'Transformer',answer:'Changing flux induces current',reason:'Changing flux from the primary coil induces voltage in the secondary coil.',kind:'transformer'}];let idx=0,locked=false,completed=false;const $=s=>document.querySelector(s);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function draw(kind){let h='';if(kind==='motor')h=`<circle cx="450" cy="210" r="100" class="device"/><rect x="405" y="145" width="90" height="130" rx="12" class="accent"/><path d="M280 210 C330 95 570 95 620 210" class="fieldline"/><path d="M620 210 C570 325 330 325 280 210" class="fieldline"/><path d="M450 75 l25 32 h-50 z" fill="#52677d" class="motion"/>`;if(kind==='generator')h=`<rect x="210" y="120" width="130" height="180" fill="#b94343"/><rect x="560" y="120" width="130" height="180" fill="#3b6ea8"/><rect x="390" y="130" width="120" height="160" rx="10" class="accent"/><line x1="450" y1="80" x2="450" y2="330" stroke="#52677d" stroke-width="8"/><path d="M450 65 l28 35 h-56 z" fill="#52677d" class="motion"/><path d="M330 210 C370 120 530 120 570 210" class="fieldline"/>`;if(kind==='detector')h=`<rect x="420" y="60" width="60" height="190" rx="20" class="device"/><ellipse cx="450" cy="305" rx="175" ry="65" class="accent"/><rect x="330" y="365" width="240" height="30" class="device"/><ellipse cx="450" cy="305" rx="230" ry="100" class="fieldline"/>`;if(kind==='microphone')h=`<circle cx="300" cy="210" r="110" class="device"/><path d="M285 105 Q370 210 285 315" class="accent"/><rect x="520" y="130" width="100" height="160" rx="12" fill="#b94343"/><path d="M390 210 H520" stroke="#52677d" stroke-width="7" class="motion"/><path d="M360 125 C440 125 480 170 520 210" class="fieldline"/>`;if(kind==='transformer')h=`<rect x="300" y="95" width="300" height="230" rx="25" class="device"/><path d="M340 120 v180 M375 120 v180 M410 120 v180" class="accent"/><path d="M490 120 v180 M525 120 v180 M560 120 v180" class="accent"/><path d="M330 210 C390 80 510 80 570 210 C510 340 390 340 330 210" class="fieldline"/>`;$('#diagram').innerHTML=h}
function render(){locked=false;const d=devices[idx];$('#progress').textContent=`Device ${idx+1} of ${devices.length}`;$('#prompt').textContent=`${d.name}: Which mechanism is most important here?`;draw(d.kind);$('#app').classList.remove('reveal');$('#feedback').textContent='';$('#feedback').className='feedback';$('#next').classList.add('hidden');$('#choices').innerHTML='';shuffle(mechanisms).forEach(m=>{const b=document.createElement('button');b.textContent=m;b.onclick=()=>choose(m);$('#choices').appendChild(b)})}function choose(m){if(locked)return;locked=true;const d=devices[idx];$('#choices').querySelectorAll('button').forEach(b=>b.disabled=true);$('#app').classList.add('reveal');$('#feedback').textContent=d.reason;$('#feedback').className='feedback '+(m===d.answer?'good':'bad');$('#next').classList.remove('hidden');if(idx===devices.length-1)$('#next').textContent='Finish'}function next(){if(idx<devices.length-1){idx++;render()}else{$('#feedback').textContent='Sort complete. Electromagnetic devices combine fields, forces, and induction in different ways.';$('#feedback').className='feedback good';$('#next').classList.add('hidden');complete()}}function complete(){if(completed)return;completed=true;window.parent.postMessage({type:'complete'},'*')}$('#next').onclick=next;$('#reset').onclick=()=>{idx=0;completed=false;render()};render();})();
</script></main></body></html>
