<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test-Charge Electric Field Walkthrough</title>
  <style>
    :root {
      --blue: #285f9f;
      --blue-dark: #173f70;
      --ink: #17263a;
      --muted: #52657a;
      --panel: #ffffff;
      --soft: #edf5ff;
      --line: #b9cbe0;
      --positive: #d64045;
      --negative: #2457c5;
      --field: #7a3db8;
      --focus: #ffbf47;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; font-family: Arial, Helvetica, sans-serif; color: var(--ink); }
    body { padding: 8px; }
    .rph-app {
      width: min(100%, 960px);
      margin: 0 auto;
      border: 5px solid var(--blue);
      border-radius: 24px;
      background: linear-gradient(180deg, #ffffff 0%, #f4f9ff 100%);
      padding: 18px;
      box-shadow: 0 16px 34px rgba(23, 63, 112, 0.14);
    }
    .rph-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .rph-kicker { margin: 0 0 3px; color: var(--blue); font-size: 0.78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(1.25rem, 2.8vw, 1.85rem); line-height: 1.1; }
    .rph-reset, .rph-main, .rph-choice {
      border: 2px solid transparent;
      border-radius: 13px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      min-height: 44px;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .rph-reset { background: #fff; border-color: var(--line); color: var(--blue-dark); padding: 9px 14px; white-space: nowrap; }
    .rph-main { background: var(--blue); color: #fff; padding: 11px 20px; }
    .rph-choice { background: #fff; border-color: var(--line); color: var(--ink); padding: 11px 16px; }
    button:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(23,63,112,.14); }
    button:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; }
    button:disabled { cursor: default; opacity: .58; transform: none; box-shadow: none; }
    .rph-progress { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .9rem; font-weight: 700; margin-bottom: 10px; }
    .rph-dots { display: flex; gap: 6px; }
    .rph-dot { width: 11px; height: 11px; border-radius: 50%; background: #cad7e6; border: 1px solid #a7b9cc; }
    .rph-dot.active { background: var(--blue); }
    .rph-stage {
      min-height: 410px;
      border: 2px solid #c6d6e8;
      border-radius: 18px;
      background: radial-gradient(circle at 50% 45%, #ffffff 0%, #edf5ff 78%);
      display: grid;
      grid-template-rows: minmax(260px, 1fr) auto;
      overflow: hidden;
    }
    .rph-scene { position: relative; min-height: 280px; }
    svg { width: 100%; height: 100%; min-height: 280px; display: block; }
    .rph-question {
      background: rgba(255,255,255,.96);
      border-top: 2px solid #c6d6e8;
      padding: 14px;
    }
    .rph-prompt { margin: 0 0 10px; font-size: 1.02rem; font-weight: 800; }
    .rph-directions { margin: 0 0 10px; color: var(--muted); font-size: .9rem; }
    .rph-choices { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; }
    .rph-feedback { min-height: 2.6em; margin: 10px 0 0; font-weight: 700; line-height: 1.35; }
    .rph-actions { display: flex; justify-content: flex-end; margin-top: 10px; }
    .charge-label { font-size: 28px; font-weight: 900; fill: #fff; text-anchor: middle; dominant-baseline: central; }
    .small-label { font-size: 17px; font-weight: 800; fill: var(--ink); text-anchor: middle; }
    .guide-line { stroke: #9eb4cb; stroke-width: 2; stroke-dasharray: 7 7; }
    .field-arrow { stroke: var(--field); stroke-width: 8; stroke-linecap: round; }
    .arrow-label { fill: var(--field); font-size: 19px; font-weight: 900; }
    .rph-hidden { display: none !important; }
    @media (max-width: 640px) {
      body { padding: 3px; }
      .rph-app { padding: 12px; border-radius: 18px; }
      .rph-top { align-items: flex-start; }
      .rph-choices { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .rph-stage { min-height: 470px; }
      .rph-question { padding: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation-duration: .001ms !important; }
    }
  </style>
</head>
<body>
<main class="rph-app" aria-labelledby="rph-title">
  <div class="rph-top">
    <div>
      <p class="rph-kicker">Unit 6 · Lesson 2 · Part 1</p>
      <h1 id="rph-title">Test-Charge Field Direction</h1>
    </div>
    <button class="rph-reset" id="resetBtn" type="button">Reset</button>
  </div>

  <div class="rph-progress" aria-label="Scenario progress">
    <span id="progressText">Scenario 1 of 4</span>
    <div class="rph-dots" id="dots" aria-hidden="true"></div>
  </div>

  <section class="rph-stage" aria-label="Electric field prediction simulation">
    <div class="rph-scene">
      <svg id="scene" viewBox="0 0 800 330" role="img" aria-labelledby="sceneTitle sceneDesc">
        <title id="sceneTitle">A source charge and a positive test charge</title>
        <desc id="sceneDesc">Predict the direction of the electric field at the test charge.</desc>
        <defs>
          <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
            <path d="M0,0 L12,6 L0,12 Z" fill="#7a3db8"></path>
          </marker>
        </defs>
        <line id="guide" class="guide-line" x1="400" y1="160" x2="620" y2="160"></line>
        <g id="sourceGroup">
          <circle id="sourceCircle" cx="400" cy="160" r="52" fill="#d64045"></circle>
          <text id="sourceSign" x="400" y="160" class="charge-label">+</text>
          <text x="400" y="230" class="small-label">source charge</text>
        </g>
        <g id="probeGroup">
          <circle cx="620" cy="160" r="29" fill="#f7c948" stroke="#9a6f00" stroke-width="4"></circle>
          <text x="620" y="160" class="charge-label" style="font-size:20px; fill:#5a4200">+</text>
          <text id="probeLabel" x="620" y="215" class="small-label">positive test charge</text>
        </g>
        <g id="fieldGroup" class="rph-hidden">
          <line id="fieldArrow" class="field-arrow" x1="620" y1="160" x2="710" y2="160" marker-end="url(#arrowHead)"></line>
          <text id="fieldLabel" x="665" y="130" class="arrow-label">E</text>
        </g>
      </svg>
    </div>

    <div class="rph-question">
      <p class="rph-prompt" id="prompt">Which direction is the electric field at the test charge?</p>
      <p class="rph-directions">Choose a direction, then watch the field vector appear.</p>
      <div class="rph-choices" id="choices"></div>
      <p class="rph-feedback" id="feedback" role="status" aria-live="polite"></p>
      <div class="rph-actions">
        <button class="rph-main rph-hidden" id="nextBtn" type="button">Next scenario</button>
      </div>
    </div>
  </section>

  <script>
    (() => {
      const scenarios = [
        { sign: '+', source: [400,160], probe: [620,160], answer: 'Right', strength: 'weaker', explanation: 'The field points away from a positive source charge' },
        { sign: '−', source: [400,160], probe: [400,65], answer: 'Down', strength: 'stronger', explanation: 'The field points toward a negative source charge' },
        { sign: '+', source: [400,160], probe: [230,160], answer: 'Left', strength: 'stronger', explanation: 'A positive test charge is pushed away from the positive source' },
        { sign: '−', source: [400,160], probe: [400,285], answer: 'Up', strength: 'weaker', explanation: 'A positive test charge is pulled toward the negative source' }
      ];
      const vectors = { Right:[92,0], Left:[-92,0], Up:[0,-92], Down:[0,92] };
      const allChoices = ['Up','Down','Left','Right'];
      let index = 0;
      let state = 'predict';
      let completionSent = false;

      const sourceCircle = document.getElementById('sourceCircle');
      const sourceSign = document.getElementById('sourceSign');
      const sourceGroup = document.getElementById('sourceGroup');
      const probeGroup = document.getElementById('probeGroup');
      const guide = document.getElementById('guide');
      const fieldGroup = document.getElementById('fieldGroup');
      const fieldArrow = document.getElementById('fieldArrow');
      const fieldLabel = document.getElementById('fieldLabel');
      const choices = document.getElementById('choices');
      const feedback = document.getElementById('feedback');
      const nextBtn = document.getElementById('nextBtn');
      const resetBtn = document.getElementById('resetBtn');
      const progressText = document.getElementById('progressText');
      const dots = document.getElementById('dots');

      function shuffle(items) {
        const copy = [...items];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function setGroupPosition(group, x, y) {
        group.setAttribute('transform', `translate(${x - 400} ${y - 160})`);
      }

      function renderDots() {
        dots.innerHTML = '';
        scenarios.forEach((_, i) => {
          const dot = document.createElement('span');
          dot.className = 'rph-dot' + (i === index ? ' active' : '');
          dots.appendChild(dot);
        });
      }

      function renderScenario() {
        state = 'predict';
        const s = scenarios[index];
        progressText.textContent = `Scenario ${index + 1} of ${scenarios.length}`;
        renderDots();
        sourceCircle.setAttribute('fill', s.sign === '+' ? '#d64045' : '#2457c5');
        sourceSign.textContent = s.sign;
        setGroupPosition(sourceGroup, s.source[0], s.source[1]);
        setGroupPosition(probeGroup, s.probe[0], s.probe[1]);
        guide.setAttribute('x1', s.source[0]);
        guide.setAttribute('y1', s.source[1]);
        guide.setAttribute('x2', s.probe[0]);
        guide.setAttribute('y2', s.probe[1]);
        fieldGroup.classList.add('rph-hidden');
        feedback.textContent = '';
        nextBtn.classList.add('rph-hidden');
        choices.innerHTML = '';
        shuffle(allChoices).forEach(label => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'rph-choice';
          button.textContent = label;
          button.addEventListener('click', () => choose(label));
          choices.appendChild(button);
        });
      }

      function choose(label) {
        if (state !== 'predict') return;
        state = 'reveal';
        [...choices.querySelectorAll('button')].forEach(btn => btn.disabled = true);
        const s = scenarios[index];
        const [dx, dy] = vectors[s.answer];
        const startX = s.probe[0];
        const startY = s.probe[1];
        fieldArrow.setAttribute('x1', startX);
        fieldArrow.setAttribute('y1', startY);
        fieldArrow.setAttribute('x2', startX + dx);
        fieldArrow.setAttribute('y2', startY + dy);
        fieldLabel.setAttribute('x', startX + dx * .52 + (dy ? 22 : 0));
        fieldLabel.setAttribute('y', startY + dy * .52 - (dx ? 18 : 0));
        fieldGroup.classList.remove('rph-hidden');
        const result = label === s.answer ? `The field points ${s.answer.toLowerCase()}.` : `The field points ${s.answer.toLowerCase()}, not ${label.toLowerCase()}.`;
        feedback.textContent = `${result} ${s.explanation}, and the field is ${s.strength} because of the probe's distance.`;
        nextBtn.textContent = index === scenarios.length - 1 ? 'Finish' : 'Next scenario';
        nextBtn.classList.remove('rph-hidden');
        nextBtn.focus();
      }

      function next() {
        if (state !== 'reveal') return;
        if (index < scenarios.length - 1) {
          index += 1;
          renderScenario();
        } else {
          feedback.textContent = 'Complete. Electric-field direction is defined by the force on a positive test charge.';
          nextBtn.classList.add('rph-hidden');
          if (!completionSent) {
            completionSent = true;
            window.parent.postMessage({ type: 'complete' }, '*');
          }
        }
      }

      function reset() {
        index = 0;
        completionSent = false;
        renderScenario();
      }

      nextBtn.addEventListener('click', next);
      resetBtn.addEventListener('click', reset);
      renderScenario();
    })();
  </script>
</main>
</body>
</html>
