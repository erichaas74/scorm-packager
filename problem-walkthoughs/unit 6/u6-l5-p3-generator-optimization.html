<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generator Optimization Challenge</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#16283b;--blue:#285f9f;--ink:#16283b;--muted:#5c6f82;--panel:#f5f8fb;--line:#b9c8d8;--good:#176b43;--warn:#8a4f00;--red:#a22b2b}
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{padding:8px}
.app{width:min(980px,100%);margin:0 auto;border:5px solid #285f9f;border-radius:18px;background:#fff;overflow:hidden;box-shadow:0 8px 24px rgba(23,48,76,.12)}
.app header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);background:#f8fbff}
.app h1{font-size:clamp(1.05rem,2.4vw,1.45rem);margin:0}
.app button,.app select,.app input{font:inherit}
.app button{min-height:44px;border:2px solid var(--blue);border-radius:10px;background:#fff;color:var(--blue);font-weight:700;padding:8px 14px;cursor:pointer}
.app button:hover{background:#edf5ff}.app button:focus-visible,.app select:focus-visible,.app input:focus-visible{outline:4px solid #f0b429;outline-offset:2px}
.app button.primary{background:var(--blue);color:#fff}.app button.primary:hover{background:#1f4e83}.app button:disabled{opacity:.48;cursor:not-allowed}
.stage{min-height:420px;padding:18px;background:linear-gradient(#f7fbff,#eef5fb);display:grid;place-items:center;position:relative}
.stage svg{width:100%;height:auto;max-height:430px;display:block}
.card{margin:0 18px 18px;border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff}
.prompt{font-size:1.08rem;font-weight:700;margin:0 0 12px}.subtle{color:var(--muted);margin:4px 0 12px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.choices button{width:100%}
.feedback{min-height:50px;margin:12px 0 0;font-weight:700}.feedback.good{color:var(--good)}.feedback.bad{color:var(--red)}
.status-row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.pill{border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:#fff;font-weight:700}.hidden{display:none!important}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:10px 0}.control{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel)}.control label{display:block;font-weight:700;margin-bottom:7px}.control output{display:block;font-weight:700;margin-top:7px;color:var(--blue)}
.meter{height:18px;border:1px solid #8ca0b5;border-radius:999px;background:#e9eef3;overflow:hidden}.meter>span{display:block;height:100%;width:0;background:#5f8fbd;transition:width .5s ease}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.9rem;color:var(--muted)}.legend span{display:inline-flex;gap:6px;align-items:center}.swatch{width:14px;height:14px;border-radius:3px;border:1px solid #52677d}
.progress{font-weight:700;color:var(--muted)}
@media(max-width:620px){body{padding:3px}.app{border-width:5px}.app header{padding:10px 12px}.stage{min-height:330px;padding:10px}.card{margin:0 10px 10px;padding:12px}.choices{grid-template-columns:1fr}.controls{grid-template-columns:1fr}.app button{min-height:48px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}

.rotor{transform-origin:450px 210px}.running .rotor{animation:spin .65s linear 2}@keyframes spin{to{transform:rotate(720deg)}}.coilwire{fill:none;stroke:#c97827;stroke-width:10}.magnetN{fill:#b94343}.magnetS{fill:#3b6ea8}.wire{stroke:#26384c;stroke-width:5;fill:none}.lamp{fill:#d4dbe3;stroke:#52677d;stroke-width:4}.lit .lamp{fill:#ffd45a;filter:drop-shadow(0 0 14px #ffc928)}
</style></head><body><main class="app" id="app"><header><h1>Generator Optimization Challenge</h1><button id="reset">Reset</button></header><section class="stage" aria-label="Rotating coil generator"><svg viewBox="0 0 900 420" role="img" aria-labelledby="gTitle gDesc"><title id="gTitle">Generator model</title><desc id="gDesc">A coil rotates between north and south magnetic poles and connects to a lamp. Rotation and lamp brightness appear after testing.</desc><rect x="130" y="105" width="145" height="210" rx="16" class="magnetN"/><text x="202" y="220" text-anchor="middle" fill="white" font-size="72" font-weight="700">N</text><rect x="625" y="105" width="145" height="210" rx="16" class="magnetS"/><text x="698" y="220" text-anchor="middle" fill="white" font-size="72" font-weight="700">S</text><g class="rotor"><rect x="365" y="120" width="170" height="180" rx="12" class="coilwire"/><line x1="450" y1="90" x2="450" y2="330" stroke="#52677d" stroke-width="8"/></g><path d="M450 330 C450 365 540 365 600 365" class="wire"/><path d="M450 330 C450 385 350 385 300 365" class="wire"/><circle cx="675" cy="365" r="32" class="lamp"/><text x="675" y="373" text-anchor="middle" font-size="24" font-weight="700">LOAD</text></svg></section><section class="card" aria-live="polite"><div class="progress" id="progress"></div><p class="prompt" id="prompt"></p><p class="subtle" id="limits"></p><div class="controls" id="controls"></div><div class="status-row"><span class="pill" id="voltage">Output voltage: ?</span><span class="pill" id="cost">Cost: ?</span><span class="pill" id="status">Target: ?</span></div><div class="meter"><span id="meterFill"></span></div><div class="choices" style="margin-top:12px"><button class="primary" id="run">Run generator</button><button id="next" class="hidden">Next round</button></div><p class="feedback" id="feedback"></p></section><script>
(()=>{const rounds=[
{label:'Rotation speed',options:[600,900,1200,1500],unit:'rpm',base:{magnet:1.1,area:1.0,turns:160},target:8,maxCost:70,prompt:'Choose a rotation speed that reaches the target without exceeding the cost limit.'},
{label:'Magnet strength',options:['Standard','Strong','Rare-earth'],unit:'',base:{rpm:900,area:1.0,turns:180},target:9,maxCost:85,prompt:'Choose a magnet that reaches the target within budget.'},
{label:'Coil area',options:[0.6,0.9,1.2,1.5],unit:'relative area',base:{rpm:1000,magnet:1.25,turns:170},target:10,maxCost:82,prompt:'Choose coil area that reaches the target within budget.'},
{label:'Coil turns',options:[100,160,220,280],unit:'turns',base:{rpm:900,magnet:1.3,area:1.1},target:11,maxCost:90,prompt:'Choose coil turns that reach the target within budget.'}
];let idx=0,done=false,completed=false;const $=s=>document.querySelector(s);function mag(v){return v==='Standard'?0.9:v==='Strong'?1.25:v==='Rare-earth'?1.65:Number(v)}function costFor(label,val){if(label==='Rotation speed')return val/25;if(label==='Magnet strength')return val==='Standard'?25:val==='Strong'?48:78;if(label==='Coil area')return val*42;if(label==='Coil turns')return val*.28;return 0}function render(){const r=rounds[idx];$('#progress').textContent=`Round ${idx+1} of 4`;$('#prompt').textContent=r.prompt;$('#limits').textContent=`Target: at least ${r.target} V. Budget: ${r.maxCost} cost units.`;$('#controls').innerHTML=`<div class="control"><label for="choice">${r.label}</label><select id="choice">${r.options.map(v=>`<option value="${v}">${v} ${r.unit}</option>`).join('')}</select><output id="choiceOut">Select, then run.</output></div>`;$('#voltage').textContent='Output voltage: ?';$('#cost').textContent='Cost: ?';$('#status').textContent=`Target: ${r.target} V`;$('#meterFill').style.width='0%';$('#feedback').textContent='';$('#feedback').className='feedback';$('#run').classList.remove('hidden');$('#next').classList.add('hidden');$('#app').classList.remove('running','lit');done=false}function evaluate(){if(done)return;done=true;const r=rounds[idx],raw=$('#choice').value,val=isNaN(Number(raw))?raw:Number(raw),p={...r.base};if(r.label==='Rotation speed')p.rpm=val;if(r.label==='Magnet strength')p.magnet=mag(val);if(r.label==='Coil area')p.area=val;if(r.label==='Coil turns')p.turns=val;p.magnet=mag(p.magnet);const V=.000045*p.rpm*p.magnet*p.area*p.turns;const cost=costFor(r.label,val);const success=V>=r.target&&cost<=r.maxCost;$('#app').classList.add('running');setTimeout(()=>{if(success)$('#app').classList.add('lit')},250);$('#voltage').textContent=`Output voltage: ${V.toFixed(1)} V`;$('#cost').textContent=`Cost: ${cost.toFixed(0)}`;$('#meterFill').style.width=Math.min(100,V/r.target*75)+'%';$('#choiceOut').textContent=`Tested ${val} ${r.unit}.`;$('#feedback').textContent=success?'The generator reaches the voltage target within budget. Faster flux change, stronger magnets, larger area, and more turns increase induced voltage.':cost>r.maxCost?'The design exceeds the cost limit. Use a less expensive component while preserving enough flux change.':'The output is below the target. Increase the rate of flux change or the amount of flux linked to the coil.';$('#feedback').className='feedback '+(success?'good':'bad');$('#run').classList.add('hidden');$('#next').classList.remove('hidden');if(idx===3)$('#next').textContent='Finish'}function next(){if(idx<3){idx++;render()}else{$('#feedback').textContent='Optimization complete. Generator output depends on how rapidly magnetic flux changes through the coil.';$('#feedback').className='feedback good';$('#next').classList.add('hidden');complete()}}function complete(){if(completed)return;completed=true;window.parent.postMessage({type:'complete'},'*')}$('#run').onclick=evaluate;$('#next').onclick=next;$('#reset').onclick=()=>{idx=0;completed=false;render()};render();})();
</script></main></body></html>
