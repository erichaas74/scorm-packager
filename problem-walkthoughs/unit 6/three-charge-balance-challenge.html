<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three-Charge Balance Challenge</title>
  <style>
    :root{--navy:#153456;--blue:#285f9f;--blue2:#174b86;--sky:#eef7ff;--line:#bfd2e6;--ink:#132238;--muted:#52657b;--red:#9f2034;--gold:#9b5e00;--green:#166534}
    *{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit;min-height:44px}.tcb-app{width:min(100%,1080px);margin:0 auto;border:5px solid var(--blue);border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 18px 48px rgba(21,52,86,.14)}.tcb-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 21px 14px;border-bottom:1px solid var(--line);background:linear-gradient(115deg,#fff,#eef7ff)}.tcb-kicker{margin:0 0 3px;color:var(--blue);font-size:.73rem;font-weight:850;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;color:var(--navy);font-size:clamp(1.35rem,4vw,2rem);line-height:1.08;letter-spacing:-.03em}.tcb-reset{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--blue2);font-weight:800;cursor:pointer}.tcb-main{padding:16px}.tcb-progress{display:flex;align-items:center;gap:8px;margin-bottom:10px}.tcb-progress span{margin-right:auto;color:var(--muted);font-size:.8rem;font-weight:800}.tcb-dot{width:11px;height:11px;border:2px solid #91abc5;border-radius:50%;background:#fff}.tcb-dot[data-state=current]{border-color:var(--blue);background:var(--blue)}.tcb-dot[data-state=done]{border-color:var(--green);background:var(--green)}.tcb-stage{position:relative;border:1px solid #a9c3df;border-radius:18px 18px 0 0;overflow:hidden;background:linear-gradient(rgba(40,95,159,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(40,95,159,.05) 1px,transparent 1px),var(--sky);background-size:30px 30px}.tcb-stage svg{display:block;width:100%;height:auto;min-height:300px}.tcb-axis{stroke:#7995b2;stroke-width:4;stroke-linecap:round}.tcb-tick{stroke:#7995b2;stroke-width:3}.tcb-fixed{filter:drop-shadow(0 8px 8px rgba(21,52,86,.18))}.tcb-symbol{fill:#fff;font-size:24px;font-weight:900;text-anchor:middle;dominant-baseline:central}.tcb-label{fill:var(--navy);font-size:14px;font-weight:850;text-anchor:middle}.tcb-test{opacity:0}.tcb-test[data-show=true]{opacity:1}.tcb-test-circle{fill:#fff;stroke:#2c759f;stroke-width:5}.tcb-test-symbol{fill:#174b86;font-size:20px;font-weight:900;text-anchor:middle;dominant-baseline:central}.tcb-force{opacity:0;stroke:var(--gold);stroke-width:7;stroke-linecap:round}.tcb-force[data-show=true]{opacity:1}.tcb-force-label{opacity:0;fill:#704400;font-size:13px;font-weight:900;text-anchor:middle}.tcb-force-label[data-show=true]{opacity:1}.tcb-result{position:absolute;top:12px;left:50%;translate:-50% 0;min-width:170px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.95);color:var(--navy);font-weight:900;text-align:center;box-shadow:0 5px 15px rgba(21,52,86,.1)}.tcb-question{padding:14px 16px;border:1px solid #a9c3df;border-top:0;border-radius:0 0 18px 18px;background:#fff}.tcb-prompt{margin:0;color:var(--navy);font-weight:850}.tcb-choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}.tcb-choice{padding:8px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-weight:850;cursor:pointer}.tcb-choice:hover{background:#f2f7fc}.tcb-choice:disabled{opacity:.68}.tcb-feedback{margin:10px 0 0;color:var(--muted);line-height:1.45}.tcb-feedback strong{color:var(--navy)}.tcb-next{margin-top:10px;padding:9px 16px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:850;cursor:pointer}.tcb-note{margin:8px 2px 0;color:var(--muted);font-size:.78rem;text-align:center}
    :focus-visible{outline:3px solid #e56b24;outline-offset:3px}@media(max-width:700px){.tcb-choices{grid-template-columns:1fr 1fr}.tcb-stage svg{min-height:260px}.tcb-head{align-items:flex-start}}@media(max-width:420px){.tcb-main{padding:9px}.tcb-stage svg{min-height:230px}.tcb-choices{grid-template-columns:1fr}.tcb-reset{padding:7px 10px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="tcb-app">
    <header class="tcb-head"><div><p class="tcb-kicker">Unit 6 &middot; Net electric force</p><h1>Three-Charge Balance Challenge</h1></div><button class="tcb-reset" id="tcb-reset" type="button">Reset</button></header>
    <div class="tcb-main">
      <div class="tcb-progress"><span id="tcb-round">Round 1 of 3</span><i class="tcb-dot" data-state="current"></i><i class="tcb-dot"></i><i class="tcb-dot"></i></div>
      <section aria-label="Electric-force balance challenge">
        <div class="tcb-stage"><div class="tcb-result" id="tcb-result">Resultant force: ?</div><svg viewBox="0 0 900 330" role="img" aria-labelledby="tcb-svg-title tcb-svg-desc"><title id="tcb-svg-title">Two fixed charges on a number line</title><desc id="tcb-svg-desc">After a prediction, a positive test charge and its two individual force vectors appear.</desc><defs><marker id="tcb-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9b5e00"/></marker><radialGradient id="tcb-pos" cx="35%" cy="30%"><stop offset="0" stop-color="#5597d5"/><stop offset="1" stop-color="#174b86"/></radialGradient><radialGradient id="tcb-neg" cx="35%" cy="30%"><stop offset="0" stop-color="#df6572"/><stop offset="1" stop-color="#8f1f30"/></radialGradient></defs>
          <line class="tcb-axis" x1="75" y1="220" x2="825" y2="220"/><line class="tcb-tick" x1="250" y1="210" x2="250" y2="230"/><line class="tcb-tick" x1="550" y1="210" x2="550" y2="230"/>
          <g><circle class="tcb-fixed" id="tcb-left" cx="250" cy="160" r="51" fill="url(#tcb-pos)"/><text class="tcb-symbol" id="tcb-left-symbol" x="250" y="160">+4</text><text class="tcb-label" x="250" y="250">Fixed charge 1</text></g><g><circle class="tcb-fixed" id="tcb-right" cx="550" cy="160" r="51" fill="url(#tcb-pos)"/><text class="tcb-symbol" id="tcb-right-symbol" x="550" y="160">+4</text><text class="tcb-label" x="550" y="250">Fixed charge 2</text></g>
          <g class="tcb-test" id="tcb-test" data-show="false"><circle class="tcb-test-circle" id="tcb-test-circle" cx="400" cy="220" r="28"/><text class="tcb-test-symbol" id="tcb-test-symbol" x="400" y="220">+?</text><text class="tcb-label" id="tcb-test-label" x="400" y="290">Positive test charge</text></g>
          <line class="tcb-force" id="tcb-force-left" data-show="false" x1="392" y1="115" x2="312" y2="115" marker-end="url(#tcb-arrow)"/><line class="tcb-force" id="tcb-force-right" data-show="false" x1="408" y1="115" x2="488" y2="115" marker-end="url(#tcb-arrow)"/><text class="tcb-force-label" id="tcb-flabel" data-show="false" x="352" y="95">Force 1</text><text class="tcb-force-label" id="tcb-rlabel" data-show="false" x="448" y="95">Force 2</text>
        </svg></div>
        <div class="tcb-question" aria-live="polite"><p class="tcb-prompt" id="tcb-prompt">Where could a positive test charge experience zero net force?</p><div class="tcb-choices" id="tcb-choices"></div><p class="tcb-feedback" id="tcb-feedback"></p><button class="tcb-next" id="tcb-next" type="button" hidden>Next round</button></div>
      </section>
      <p class="tcb-note">Choose a region; individual force vectors appear only after your prediction.</p>
    </div>
    <script>
      (()=>{
        const $=s=>document.querySelector(s), scenarios=[
          {left:4,right:4,x:400,correct:'mid',options:[['mid','Exactly midway'],['nearRight','Between, near charge 2'],['outside','Right of charge 2'],['none','Nowhere']],why:'Equal charges at equal distances produce equal, opposite forces.'},
          {left:9,right:1,x:475,correct:'nearRight',options:[['mid','Exactly midway'],['nearLeft','Between, near charge 1'],['nearRight','Between, near charge 2'],['outside','Right of charge 2']],why:'The balance point is closer to the smaller +1 charge.'},
          {left:9,right:-1,x:700,correct:'outside',options:[['between','Between the charges'],['left','Left of charge 1'],['outside','Right of charge 2'],['none','Nowhere']],why:'Between opposite charges both forces point right, so balance occurs beyond the smaller charge.'}
        ],state={round:0,phase:'predict',choice:null,complete:false};
        function shuffled(items){return items.map(v=>({v,r:Math.random()})).sort((a,b)=>a.r-b.r).map(o=>o.v)}function signed(n){return `${n>0?'+':'−'}${Math.abs(n)}`}
        function dots(){document.querySelectorAll('.tcb-dot').forEach((d,i)=>d.dataset.state=i<state.round?'done':i===state.round?'current':'')}
        function setCharge(side,value){$('#tcb-'+side).setAttribute('fill',`url(#tcb-${value>0?'pos':'neg'})`);$('#tcb-'+side+'-symbol').textContent=signed(value)}
        function setup(){state.phase='predict';state.choice=null;const s=scenarios[state.round];dots();$('#tcb-round').textContent=`Round ${state.round+1} of ${scenarios.length}`;setCharge('left',s.left);setCharge('right',s.right);$('#tcb-test').dataset.show='false';document.querySelectorAll('.tcb-force,.tcb-force-label').forEach(e=>e.dataset.show='false');$('#tcb-result').textContent='Resultant force: ?';$('#tcb-prompt').textContent='Where could a positive test charge experience zero net force?';$('#tcb-feedback').textContent='';$('#tcb-next').hidden=true;const box=$('#tcb-choices');box.innerHTML='';shuffled(s.options).forEach(([value,label])=>{const b=document.createElement('button');b.className='tcb-choice';b.type='button';b.dataset.value=value;b.textContent=label;box.appendChild(b)})}
        function choose(value){if(state.phase!=='predict')return;state.phase='explain';state.choice=value;document.querySelectorAll('.tcb-choice').forEach(b=>b.disabled=true);const s=scenarios[state.round],x=s.x;['circle','symbol','label'].forEach(part=>$('#tcb-test-'+part).setAttribute('x',x));$('#tcb-test-circle').setAttribute('cx',x);$('#tcb-test').dataset.show='true';const len=82,fy=110;const left=$('#tcb-force-left'),right=$('#tcb-force-right');left.setAttribute('x1',x-8);left.setAttribute('x2',x-len);left.setAttribute('y1',fy);left.setAttribute('y2',fy);right.setAttribute('x1',x+8);right.setAttribute('x2',x+len);right.setAttribute('y1',fy);right.setAttribute('y2',fy);$('#tcb-flabel').setAttribute('x',x-len/2);$('#tcb-rlabel').setAttribute('x',x+len/2);document.querySelectorAll('.tcb-force,.tcb-force-label').forEach(e=>e.dataset.show='true');$('#tcb-result').textContent='Resultant force: 0 N';const correct=value===s.correct;$('#tcb-prompt').textContent=`Balance point: ${s.options.find(o=>o[0]===s.correct)[1]}.`;$('#tcb-feedback').innerHTML=`<strong>${correct?'Your region matches the vectors.':'The vectors place the balance in a different region.'}</strong> ${s.why}`;const next=$('#tcb-next');next.hidden=false;next.textContent=state.round===scenarios.length-1?'Finish':'Next round';next.focus()}
        function next(){if(state.phase!=='explain')return;if(state.round<scenarios.length-1){state.round++;setup()}else if(!state.complete){state.complete=true;document.querySelectorAll('.tcb-dot').forEach(d=>d.dataset.state='done');$('#tcb-next').hidden=true;$('#tcb-prompt').textContent='All three balance patterns revealed.';window.parent.postMessage({ type: 'complete' }, '*');}}
        $('#tcb-choices').addEventListener('click',e=>{const b=e.target.closest('button');if(b)choose(b.dataset.value)});$('#tcb-next').addEventListener('click',next);$('#tcb-reset').addEventListener('click',()=>{Object.assign(state,{round:0,phase:'predict',choice:null});setup()});setup();
      })();
    </script>
  </main>
</body>
</html>
