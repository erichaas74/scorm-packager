<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720"><rect width="1440" height="720" rx="28" fill="#eef4f8"/><rect x="24" y="24" width="1392" height="672" rx="22" fill="white"/><text x="720" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" fill="#17344a">Generator brief</text><rect x="120" y="185" width="560" height="330" rx="16" fill="#eef4f8" stroke="#c8d6df" stroke-width="2"/><rect x="760" y="185" width="560" height="330" rx="16" fill="#eef4f8" stroke="#c8d6df" stroke-width="2"/><text x="400" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#087c80">OUTPUT</text><text x="400" y="385" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" fill="#17344a">at least 8 V peak</text><text x="1040" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#bd6821">BUDGET</text><text x="1040" y="385" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" fill="#17344a">at most 70 units</text><text x="720" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#17344a">A valid design must satisfy both constraints.</text></svg>