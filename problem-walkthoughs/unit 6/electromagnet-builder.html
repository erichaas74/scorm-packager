<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Electromagnet Builder</title><style>
#emb-coils + .emb-label{transform:translateY(-28px)}
:root{--n:#153456;--b:#285f9f;--l:#bfd2e6;--s:#eef7ff;--i:#132238;--m:#52657b;--o:#a75e00;--g:#166534}*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--i);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit;min-height:44px}.emb-app{width:min(100%,1080px);margin:auto;border:5px solid var(--b);border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 18px 48px #15345624}.emb-head{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:17px 21px 14px;border-bottom:1px solid var(--l);background:linear-gradient(115deg,#fff,#eef7ff)}.emb-k{margin:0 0 3px;color:var(--b);font-size:.73rem;font-weight:850;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;color:var(--n);font-size:clamp(1.35rem,4vw,2rem);line-height:1.08}.emb-reset{padding:8px 14px;border:1px solid var(--l);border-radius:999px;background:#fff;color:var(--b);font-weight:800}.emb-main{padding:16px}.emb-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}.emb-round{margin-right:auto;color:var(--m);font-size:.8rem;font-weight:850}.emb-dot{width:11px;height:11px;border:2px solid #91abc5;border-radius:50%}.emb-dot[data-state=current]{background:var(--b);border-color:var(--b)}.emb-dot[data-state=done]{background:var(--g);border-color:var(--g)}.emb-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(250px,.65fr);gap:11px}.emb-stage{position:relative;border:1px solid #a9c3df;border-radius:18px;overflow:hidden;background:linear-gradient(#285f9f0d 1px,transparent 1px),linear-gradient(90deg,#285f9f0d 1px,transparent 1px),var(--s);background-size:30px 30px}.emb-stage svg{display:block;width:100%;height:auto;min-height:390px}.emb-core{fill:#8195a8;stroke:#153456;stroke-width:4}.emb-coil{fill:none;stroke:#b94b28;stroke-width:10}.emb-field{fill:none;stroke:var(--o);stroke-width:5;opacity:0}.emb-field[data-on=true]{opacity:var(--power,.6)}.emb-washer{fill:#dce7ef;stroke:#405d78;stroke-width:4;transition:transform .5s ease}.emb-washer[data-lift=true]{transform:translateY(-125px)}.emb-label{fill:var(--n);font-size:15px;font-weight:850;text-anchor:middle}.emb-badge{position:absolute;top:11px;left:50%;translate:-50%;padding:7px 11px;border:1px solid var(--l);border-radius:999px;background:#fffd;color:var(--n);font-weight:900;white-space:nowrap}.emb-controls{display:grid;gap:9px}.emb-card{padding:12px;border:1px solid var(--l);border-radius:14px;background:#fff}.emb-card label{display:flex;justify-content:space-between;gap:8px;color:var(--n);font-size:.83rem;font-weight:850}.emb-card input,.emb-card select{width:100%;accent-color:var(--b)}.emb-card input:disabled,.emb-card select:disabled{opacity:.5}.emb-target{padding:13px;border-radius:14px;background:#e8f2fd;color:var(--n)}.emb-target small{display:block;color:var(--b);font-weight:850;text-transform:uppercase}.emb-target strong{font-size:1.12rem}.emb-action{border:0;border-radius:13px;background:var(--b);color:#fff;font-weight:900}.emb-readouts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.emb-read{padding:10px;border:1px solid var(--l);border-radius:12px;text-align:center}.emb-read span{display:block;color:var(--m);font-size:.7rem;font-weight:850;text-transform:uppercase}.emb-read output{color:var(--n);font-size:1.1rem;font-weight:900}.emb-feedback{grid-column:1/-1;margin:0;padding:11px 13px;border:1px solid var(--l);border-radius:14px;color:var(--m);line-height:1.4}.emb-feedback strong{color:var(--n)}:focus-visible{outline:3px solid #e56b24;outline-offset:3px}@media(max-width:680px){.emb-main{padding:9px}.emb-layout{grid-template-columns:1fr}.emb-stage svg{min-height:310px}.emb-controls{grid-template-columns:1fr 1fr}.emb-target,.emb-action,.emb-feedback{grid-column:1/-1}.emb-head{align-items:flex-start}}@media(max-width:430px){.emb-controls{grid-template-columns:1fr}.emb-target,.emb-action,.emb-feedback{grid-column:auto}}@media(prefers-reduced-motion:reduce){.emb-washer{transition:none}}
</style></head><body><main class="emb-app"><header class="emb-head"><div><p class="emb-k">Unit 6 &middot; Part 1 &middot; Engineering challenge</p><h1>Electromagnet Builder</h1></div><button class="emb-reset" id="emb-reset" type="button">Reset</button></header><div class="emb-main"><div class="emb-top"><span class="emb-round" id="emb-round">Round 1 of 3</span><i class="emb-dot" data-state="current"></i><i class="emb-dot"></i><i class="emb-dot"></i></div><div class="emb-layout"><section class="emb-stage" aria-label="Coil around a core lifting metal washers"><div class="emb-badge" id="emb-badge">Electromagnet off</div><svg viewBox="0 0 650 430" role="img" aria-labelledby="emb-title emb-desc"><title id="emb-title">Adjustable electromagnet</title><desc id="emb-desc">A current-carrying coil wraps around a core above eight metal washers.</desc><g id="emb-fields"><path class="emb-field" d="M105 215C80 55 560 55 535 215"/><path class="emb-field" d="M105 235C80 375 560 375 535 235"/></g><rect class="emb-core" id="emb-core" x="145" y="170" width="360" height="80" rx="22"/><g id="emb-coils"></g><text class="emb-label" x="325" y="145">Wire coil around core</text><g id="emb-washers"></g><text class="emb-label" x="325" y="416">Metal washers</text></svg></section><div class="emb-controls"><div class="emb-target"><small>Goal</small><strong id="emb-goal">Lift at least 4 washers</strong></div><div class="emb-card"><label for="emb-current"><span>Current</span><output id="emb-current-out">1.0 A</output></label><input id="emb-current" type="range" min="0" max="5" step=".5" value="1"></div><div class="emb-card"><label for="emb-turns"><span>Wire turns</span><output id="emb-turns-out">50</output></label><input id="emb-turns" type="range" min="10" max="100" step="10" value="50" disabled></div><div class="emb-card"><label for="emb-material"><span>Core material</span></label><select id="emb-material" disabled><option value="air">Air</option><option value="steel">Steel</option><option value="iron" selected>Soft iron</option></select></div><button class="emb-action" id="emb-action" type="button">Energize and test</button><div class="emb-readouts"><div class="emb-read"><span>Field strength</span><output id="emb-field">?</output></div><div class="emb-read"><span>Washers lifted</span><output id="emb-lift">?</output></div></div><p class="emb-feedback" id="emb-feedback" aria-live="polite">Set the available variable, then test your design.</p></div></div></div><script>
(()=>{const $=s=>document.querySelector(s),rounds=[{goal:4,adjust:'current',I:1,N:50,mat:'iron'},{goal:5,adjust:'turns',I:3,N:20,mat:'iron'},{goal:7,adjust:'material',I:4,N:80,mat:'air'}],factor={air:.35,steel:1,iron:1.5},state={round:0,tested:false,complete:false};function draw(){const N=Number($('#emb-turns').value),count=Math.max(3,Math.round(N/10));$('#emb-coils').innerHTML=Array.from({length:count},(_,i)=>`<ellipse class="emb-coil" cx="${170+i*(310/(count-1))}" cy="210" rx="26" ry="72"/>`).join('');$('#emb-washers').innerHTML=Array.from({length:8},(_,i)=>`<g class="emb-washer" data-lift="false" style="transform-origin:${150+i*50}px 365px"><circle cx="${150+i*50}" cy="365" r="20"/><circle cx="${150+i*50}" cy="365" r="8" fill="#eef7ff"/></g>`).join('')}function strength(){return .02*Number($('#emb-current').value)*Number($('#emb-turns').value)*factor[$('#emb-material').value]}function outputs(){const I=Number($('#emb-current').value),N=Number($('#emb-turns').value);$('#emb-current-out').textContent=I.toFixed(1)+' A';$('#emb-turns-out').textContent=N;draw()}function dots(){document.querySelectorAll('.emb-dot').forEach((d,i)=>d.dataset.state=i<state.round?'done':i===state.round?'current':'')}function setup(){state.tested=false;const r=rounds[state.round];dots();$('#emb-round').textContent=`Round ${state.round+1} of 3`;$('#emb-goal').textContent=`Lift at least ${r.goal} washers`;$('#emb-current').value=r.I;$('#emb-turns').value=r.N;$('#emb-material').value=r.mat;$('#emb-current').disabled=r.adjust!=='current';$('#emb-turns').disabled=r.adjust!=='turns';$('#emb-material').disabled=r.adjust!=='material';$('#emb-field').textContent='?';$('#emb-lift').textContent='?';$('#emb-badge').textContent='Electromagnet off';$('#emb-feedback').textContent='Set the available variable, then test your design.';$('#emb-action').textContent='Energize and test';document.querySelectorAll('.emb-field').forEach(e=>e.dataset.on='false');outputs()}function test(){const r=rounds[state.round],B=strength(),lift=Math.min(8,Math.floor(B));state.tested=true;$('#emb-field').textContent=B.toFixed(1)+' mT';$('#emb-lift').textContent=lift;$('#emb-badge').textContent=`Field on · ${B.toFixed(1)} mT`;document.querySelectorAll('.emb-field').forEach(e=>{e.dataset.on='true';e.style.setProperty('--power',Math.min(1,.28+B/13))});document.querySelectorAll('.emb-washer').forEach((e,i)=>e.dataset.lift=String(i<lift));if(lift>=r.goal){$('#emb-feedback').innerHTML=`<strong>Goal reached: ${lift} washers lifted.</strong> A larger current-turns product and a magnetic core make a stronger field.`;$('#emb-action').textContent=state.round===2?'Finish':'Next round'}else{$('#emb-feedback').innerHTML=`<strong>${lift} washers lifted; the goal is ${r.goal}.</strong> Increase the available variable and test again.`;$('#emb-action').textContent='Adjust and retest'}}function action(){const r=rounds[state.round],lift=Math.min(8,Math.floor(strength()));if(state.tested&&lift>=r.goal){if(state.round<2){state.round++;setup()}else if(!state.complete){state.complete=true;document.querySelectorAll('.emb-dot').forEach(d=>d.dataset.state='done');$('#emb-action').disabled=true;$('#emb-feedback').innerHTML='<strong>Builder complete.</strong> Current, turns, and core permeability all affect electromagnet strength.';window.parent.postMessage({ type: 'complete' }, '*');}}else test()}['#emb-current','#emb-turns','#emb-material'].forEach(s=>$(s).addEventListener('input',()=>{state.tested=false;$('#emb-field').textContent='?';$('#emb-lift').textContent='?';$('#emb-badge').textContent='Electromagnet off';document.querySelectorAll('.emb-field').forEach(e=>e.dataset.on='false');outputs()}));$('#emb-action').addEventListener('click',action);$('#emb-reset').addEventListener('click',()=>{state.round=0;$('#emb-action').disabled=false;setup()});setup()})();
</script></main></body></html>
