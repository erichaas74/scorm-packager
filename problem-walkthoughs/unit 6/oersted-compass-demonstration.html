<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oersted Compass Demonstration</title><style>
:root{--n:#153456;--b:#285f9f;--l:#bfd2e6;--s:#eef7ff;--i:#132238;--m:#52657b;--r:#a72b3e;--g:#166534;--o:#a75e00}*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--i);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit;min-height:44px}.ocd-app{width:min(100%,1080px);margin:auto;border:5px solid var(--b);border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 18px 48px #15345624}.ocd-head{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:17px 21px 14px;border-bottom:1px solid var(--l);background:linear-gradient(115deg,#fff,#eef7ff)}.ocd-k{margin:0 0 3px;color:var(--b);font-size:.73rem;font-weight:850;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;color:var(--n);font-size:clamp(1.35rem,4vw,2rem);line-height:1.08}.ocd-reset{padding:8px 14px;border:1px solid var(--l);border-radius:999px;background:#fff;color:var(--b);font-weight:800}.ocd-main{padding:16px}.ocd-progress{display:flex;gap:8px;align-items:center;margin-bottom:10px;color:var(--m);font-size:.8rem;font-weight:800}.ocd-progress span{margin-right:auto}.ocd-dot{width:11px;height:11px;border:2px solid #91abc5;border-radius:50%}.ocd-dot[data-on=true]{background:var(--b);border-color:var(--b)}.ocd-stage{position:relative;border:1px solid #a9c3df;border-radius:18px 18px 0 0;overflow:hidden;background:linear-gradient(#285f9f0d 1px,transparent 1px),linear-gradient(90deg,#285f9f0d 1px,transparent 1px),var(--s);background-size:30px 30px}.ocd-stage svg{display:block;width:100%;height:auto;min-height:320px}.ocd-compass{filter:drop-shadow(0 10px 9px #1534562c)}.ocd-needle{transform-origin:450px 135px;transition:transform .75s ease}.ocd-north{fill:var(--r)}.ocd-south{fill:#e7eef5}.ocd-field{fill:none;stroke:var(--o);stroke-width:6;stroke-dasharray:8 7;opacity:0;marker-end:url(#ocd-arrow)}.ocd-field[data-show=true]{opacity:1}.ocd-wire{filter:drop-shadow(0 8px 8px #15345630)}.ocd-symbol{fill:#fff;font-size:31px;font-weight:900;text-anchor:middle;dominant-baseline:central}.ocd-label{fill:var(--n);font-size:15px;font-weight:850;text-anchor:middle}.ocd-badge{position:absolute;top:12px;left:50%;translate:-50%;padding:7px 12px;border:1px solid var(--l);border-radius:999px;background:#fffc;color:var(--n);font-weight:850}.ocd-card{padding:14px 16px;border:1px solid #a9c3df;border-top:0;border-radius:0 0 18px 18px}.ocd-prompt{margin:0;color:var(--n);font-weight:850}.ocd-choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.ocd-choice{border:2px solid var(--l);border-radius:12px;background:#fff;font-weight:850;cursor:pointer}.ocd-choice:disabled{opacity:.68}.ocd-row{display:flex;align-items:center;gap:10px;margin-top:10px}.ocd-action{padding:9px 16px;border:0;border-radius:12px;background:var(--b);color:#fff;font-weight:850}.ocd-feedback{margin:0;color:var(--m);line-height:1.45}.ocd-feedback strong{color:var(--n)}.ocd-note{margin:8px 2px 0;color:var(--m);font-size:.78rem;text-align:center}:focus-visible{outline:3px solid #e56b24;outline-offset:3px}@media(max-width:600px){.ocd-main{padding:9px}.ocd-stage svg{min-height:260px}.ocd-choices{grid-template-columns:1fr}.ocd-head{align-items:flex-start}}@media(prefers-reduced-motion:reduce){.ocd-needle{transition:none}}
</style></head><body><main class="ocd-app"><header class="ocd-head"><div><p class="ocd-k">Unit 6 &middot; Part 1 &middot; Magnetic fields</p><h1>Oersted Compass Demonstration</h1></div><button class="ocd-reset" id="ocd-reset" type="button">Reset</button></header><div class="ocd-main"><div class="ocd-progress"><span id="ocd-round">Round 1 of 2</span><i class="ocd-dot" data-on="true"></i><i class="ocd-dot"></i></div><section aria-label="Top view of a compass beside a wire"><div class="ocd-stage"><div class="ocd-badge" id="ocd-badge">Current off</div><svg viewBox="0 0 900 350" role="img" aria-labelledby="ocd-title ocd-desc"><title id="ocd-title">Compass near a current-carrying wire</title><desc id="ocd-desc">Top view. The compass is north of a wire that carries current into or out of the screen.</desc><defs><marker id="ocd-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a75e00"/></marker><radialGradient id="ocd-metal"><stop stop-color="#dbe9f5"/><stop offset="1" stop-color="#567793"/></radialGradient></defs><path class="ocd-field" id="ocd-field" d="M450 285a90 90 0 1 1 1 0"/><g class="ocd-compass"><circle cx="450" cy="135" r="88" fill="#fff" stroke="#153456" stroke-width="5"/><text class="ocd-label" x="450" y="63">N</text><text class="ocd-label" x="450" y="218">S</text><g class="ocd-needle" id="ocd-needle"><path class="ocd-north" d="M450 72L432 138H468Z"/><path class="ocd-south" d="M450 198L432 132H468Z" stroke="#6b8299" stroke-width="2"/></g><circle cx="450" cy="135" r="9" fill="#153456"/></g><g><circle class="ocd-wire" cx="450" cy="285" r="47" fill="url(#ocd-metal)" stroke="#153456" stroke-width="4"/><text class="ocd-symbol" id="ocd-symbol" x="450" y="285">OFF</text><text class="ocd-label" x="450" y="342">Wire, top view</text></g></svg></div><div class="ocd-card" aria-live="polite"><p class="ocd-prompt" id="ocd-prompt">With current out of the screen, which way will the north end turn?</p><div class="ocd-choices" id="ocd-choices"><button class="ocd-choice" data-a="right" type="button">Right</button><button class="ocd-choice" data-a="left" type="button">Left</button><button class="ocd-choice" data-a="north" type="button">Stay north</button></div><div class="ocd-row"><button class="ocd-action" id="ocd-action" type="button" hidden>Turn current on</button><p class="ocd-feedback" id="ocd-feedback"></p></div></div></section><p class="ocd-note">Predict first, then switch the current on and reverse it.</p></div><script>
(()=>{const $=s=>document.querySelector(s),rounds=[{dir:'out',correct:'left',angle:-90,prompt:'With current out of the screen, which way will the north end turn?',result:'The north end turns left.'},{dir:'in',correct:'right',angle:90,prompt:'When the current reverses into the screen, which way will the north end turn?',result:'The north end turns right.'}],state={round:0,phase:'predict',choice:null,complete:false};function setup(){const r=rounds[state.round];state.phase='predict';state.choice=null;$('#ocd-round').textContent=`Round ${state.round+1} of 2`;document.querySelectorAll('.ocd-dot').forEach((d,i)=>d.dataset.on=String(i===state.round));$('#ocd-badge').textContent='Current off';$('#ocd-symbol').textContent='OFF';$('#ocd-field').dataset.show='false';$('#ocd-needle').style.transform='rotate(0deg)';$('#ocd-prompt').textContent=r.prompt;$('#ocd-feedback').textContent='';$('#ocd-action').hidden=true;document.querySelectorAll('.ocd-choice').forEach(b=>b.disabled=false)}function choose(v){if(state.phase!=='predict')return;state.phase='ready';state.choice=v;document.querySelectorAll('.ocd-choice').forEach(b=>b.disabled=true);$('#ocd-prompt').textContent='Prediction locked. Close the switch.';$('#ocd-feedback').textContent='The compass will reveal the field direction.';const a=$('#ocd-action');a.hidden=false;a.textContent=state.round?'Reverse current':'Turn current on';a.focus()}function reveal(){if(state.phase!=='ready')return;const r=rounds[state.round];state.phase='explain';$('#ocd-badge').textContent=`Current ${r.dir} of screen`;$('#ocd-symbol').textContent=r.dir==='out'?'•':'×';$('#ocd-field').dataset.show='true';$('#ocd-field').style.transformOrigin='450px 285px';$('#ocd-field').style.transform=r.dir==='out'?'scale(1)':'scaleX(-1)';$('#ocd-needle').style.transform=`rotate(${r.angle}deg)`;$('#ocd-prompt').textContent=r.result;$('#ocd-feedback').innerHTML=`<strong>${state.choice===r.correct?'Your prediction matches the compass.':'The compass turns the other way.'}</strong> Reversing current reverses the magnetic field.`;$('#ocd-action').textContent=state.round?'Finish':'Turn current off and reverse'}function action(){if(state.phase==='ready')reveal();else if(state.phase==='explain'){if(state.round===0){state.round=1;setup()}else if(!state.complete){state.complete=true;document.querySelectorAll('.ocd-dot').forEach(d=>d.dataset.on='true');$('#ocd-action').hidden=true;$('#ocd-prompt').textContent='Current direction controls magnetic-field direction.';window.parent.postMessage({ type: 'complete' }, '*');}}}$('#ocd-choices').addEventListener('click',e=>{const b=e.target.closest('button');if(b)choose(b.dataset.a)});$('#ocd-action').addEventListener('click',action);$('#ocd-reset').addEventListener('click',()=>{state.round=0;setup()});setup()})();
</script></main></body></html>
