<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Field Around a Straight Wire</title><style>
:root{--n:#153456;--b:#285f9f;--l:#bfd2e6;--s:#eef7ff;--i:#132238;--m:#52657b;--o:#a75e00;--g:#166534}*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--i);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit;min-height:44px}.fsw-app{width:min(100%,1080px);margin:auto;border:5px solid var(--b);border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 18px 48px #15345624}.fsw-head{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:17px 21px 14px;border-bottom:1px solid var(--l);background:linear-gradient(115deg,#fff,#eef7ff)}.fsw-k{margin:0 0 3px;color:var(--b);font-size:.73rem;font-weight:850;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;color:var(--n);font-size:clamp(1.35rem,4vw,2rem);line-height:1.08}.fsw-reset{padding:8px 14px;border:1px solid var(--l);border-radius:999px;background:#fff;color:var(--b);font-weight:800}.fsw-main{padding:16px}.fsw-stage{position:relative;border:1px solid #a9c3df;border-radius:18px;overflow:hidden;background:linear-gradient(#285f9f0d 1px,transparent 1px),linear-gradient(90deg,#285f9f0d 1px,transparent 1px),var(--s);background-size:30px 30px}.fsw-stage svg{display:block;width:100%;height:auto;min-height:330px}.fsw-ring{fill:none;stroke:var(--o);stroke-width:5;stroke-dasharray:10 8;marker-mid:url(#fsw-arrow);opacity:0}.fsw-ring[data-show=true]{opacity:var(--op,.7)}.fsw-wire{filter:drop-shadow(0 10px 9px #1534562d)}.fsw-symbol{fill:#fff;font-size:50px;font-weight:900;text-anchor:middle;dominant-baseline:central}.fsw-point{fill:#fff;stroke:var(--b);stroke-width:4}.fsw-ptext{fill:var(--n);font-weight:900;text-anchor:middle}.fsw-vector{stroke:var(--o);stroke-width:8;marker-end:url(#fsw-big);opacity:0}.fsw-vector[data-show=true]{opacity:1}.fsw-badge{position:absolute;top:12px;left:12px;padding:7px 11px;border:1px solid var(--l);border-radius:999px;background:#fffd;color:var(--n);font-weight:850}.fsw-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.fsw-card{padding:12px;border:1px solid var(--l);border-radius:14px}.fsw-card h2{margin:0 0 7px;color:var(--n);font-size:.82rem;text-transform:uppercase}.fsw-dir{display:grid;grid-template-columns:1fr 1fr;gap:7px}.fsw-dir button,.fsw-choice{border:2px solid var(--l);border-radius:11px;background:#fff;font-weight:850}.fsw-dir button[aria-pressed=true]{border-color:var(--b);background:#e8f2fd;color:var(--b)}.fsw-range{width:100%;accent-color:var(--b)}.fsw-rlabel{display:flex;justify-content:space-between;color:var(--m);font-size:.84rem;font-weight:800}.fsw-q{margin-top:10px;padding:13px 15px;border:1px solid var(--l);border-radius:14px}.fsw-q p{margin:0;color:var(--n);font-weight:850}.fsw-choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}.fsw-feedback{margin:9px 0 0!important;color:var(--m)!important;font-weight:500!important}.fsw-next{margin-top:9px;border:0;border-radius:11px;background:var(--b);color:#fff;font-weight:850;padding:8px 15px}:focus-visible{outline:3px solid #e56b24;outline-offset:3px}@media(max-width:560px){.fsw-main{padding:9px}.fsw-controls{grid-template-columns:1fr}.fsw-choices{grid-template-columns:1fr}.fsw-stage svg{min-height:270px}.fsw-head{align-items:flex-start}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="fsw-app"><header class="fsw-head"><div><p class="fsw-k">Unit 6 &middot; Part 1 &middot; Right-hand rule</p><h1>Field Around a Straight Wire</h1></div><button class="fsw-reset" id="fsw-reset" type="button">Reset</button></header><div class="fsw-main"><section class="fsw-stage" aria-label="Top view of circular magnetic field around a wire"><div class="fsw-badge" id="fsw-badge">Field hidden until prediction</div><svg viewBox="0 0 900 360" role="img" aria-labelledby="fsw-title fsw-desc"><title id="fsw-title">Magnetic field around a straight wire</title><desc id="fsw-desc">Concentric circular field lines surround a wire perpendicular to the screen. Point P is right of the wire.</desc><defs><marker id="fsw-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a75e00"/></marker><marker id="fsw-big" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a75e00"/></marker><radialGradient id="fsw-metal"><stop stop-color="#dbe9f5"/><stop offset="1" stop-color="#567793"/></radialGradient></defs><g id="fsw-rings"><circle class="fsw-ring" cx="420" cy="185" r="75"/><circle class="fsw-ring" cx="420" cy="185" r="125"/><circle class="fsw-ring" cx="420" cy="185" r="175"/></g><circle class="fsw-wire" cx="420" cy="185" r="57" fill="url(#fsw-metal)" stroke="#153456" stroke-width="4"/><text class="fsw-symbol" id="fsw-symbol" x="420" y="185">•</text><circle class="fsw-point" cx="655" cy="185" r="25"/><text class="fsw-ptext" x="655" y="191">P</text><line class="fsw-vector" id="fsw-vector" x1="655" y1="150" x2="655" y2="85"/><text class="fsw-ptext" x="655" y="232">Test point</text></svg></section><div class="fsw-controls"><div class="fsw-card"><h2>Current direction</h2><div class="fsw-dir"><button data-dir="out" aria-pressed="true" type="button">Out of screen &bull;</button><button data-dir="in" aria-pressed="false" type="button">Into screen &times;</button></div></div><div class="fsw-card"><h2>Current magnitude</h2><label class="fsw-rlabel" for="fsw-range"><span>Current</span><output id="fsw-out">2.0 A</output></label><input class="fsw-range" id="fsw-range" type="range" min="1" max="5" step=".5" value="2"></div></div><section class="fsw-q" aria-live="polite"><p id="fsw-prompt">At point P, which way does the magnetic field point?</p><div class="fsw-choices" id="fsw-choices"><button class="fsw-choice" data-a="down" type="button">Down</button><button class="fsw-choice" data-a="up" type="button">Up</button><button class="fsw-choice" data-a="right" type="button">Right</button></div><p class="fsw-feedback" id="fsw-feedback"></p><button class="fsw-next" id="fsw-next" type="button" hidden>Try reversed current</button></section></div><script>
(()=>{const $=s=>document.querySelector(s),state={dir:'out',round:0,revealed:false,complete:false};function render(){const I=Number($('#fsw-range').value),out=state.dir==='out';$('#fsw-out').textContent=I.toFixed(1)+' A';$('#fsw-symbol').textContent=out?'•':'×';$('#fsw-rings').style.transformOrigin='420px 185px';$('#fsw-rings').style.transform=out?'scale(1)':'scaleX(-1)';document.querySelectorAll('.fsw-ring').forEach((r,i)=>{r.dataset.show=String(state.revealed);r.style.setProperty('--op',Math.min(.95,.25+I*.12-i*.08));r.style.strokeWidth=3+I*.65});const v=$('#fsw-vector');v.dataset.show=String(state.revealed);v.setAttribute('y1',out?150:220);v.setAttribute('y2',out?75:290);$('#fsw-badge').textContent=state.revealed?`Circular field · ${I.toFixed(1)} A`:'Field hidden until prediction'}function setup(dir){state.dir=dir;state.revealed=false;document.querySelectorAll('.fsw-dir button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.dir===dir)));document.querySelectorAll('.fsw-choice').forEach(b=>b.disabled=false);$('#fsw-prompt').textContent='At point P, which way does the magnetic field point?';$('#fsw-feedback').textContent='';$('#fsw-next').hidden=true;render()}function choose(a){if(state.revealed)return;state.revealed=true;document.querySelectorAll('.fsw-choice').forEach(b=>b.disabled=true);const correct=state.dir==='out'?'up':'down';$('#fsw-prompt').textContent=`At P, the field points ${correct}.`;$('#fsw-feedback').textContent=`${a===correct?'Your prediction matches the field.':'The field points the other way.'} Curl your right-hand fingers around the current direction.`;const n=$('#fsw-next');n.hidden=false;n.textContent=state.round?'Finish':'Try reversed current';render()}document.querySelector('.fsw-dir').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||state.revealed)return;setup(b.dataset.dir)});$('#fsw-range').addEventListener('input',render);$('#fsw-choices').addEventListener('click',e=>{const b=e.target.closest('button');if(b)choose(b.dataset.a)});$('#fsw-next').addEventListener('click',()=>{if(!state.round){state.round=1;setup(state.dir==='out'?'in':'out')}else if(!state.complete){state.complete=true;$('#fsw-next').hidden=true;$('#fsw-prompt').textContent='Reversing current reverses every field-line arrow.';window.parent.postMessage({ type: 'complete' }, '*');}});$('#fsw-reset').addEventListener('click',()=>{state.round=0;setup('out')});setup('out')})();
</script></main></body></html>
