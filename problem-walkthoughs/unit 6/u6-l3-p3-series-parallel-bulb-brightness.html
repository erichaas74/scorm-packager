<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Series and Parallel Bulb Energy Flow</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#16263a;line-height:1.35}
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{padding:8px}
.app{width:min(100%,980px);margin:0 auto;background:#fff;border:5px solid #285f9f;border-radius:18px;box-shadow:0 8px 24px rgba(30,55,85,.15);overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:#eef5fb;border-bottom:1px solid #bfd2e5}
h1{font-size:clamp(1rem,2.5vw,1.35rem);margin:0;color:#173b63}
button{font:inherit;min-height:42px;min-width:44px;border:2px solid #285f9f;border-radius:10px;background:#fff;color:#173b63;padding:8px 14px;font-weight:700;cursor:pointer}
button:hover{background:#edf5fd}
button:focus-visible{outline:4px solid #f3b61f;outline-offset:2px}
button[disabled]{opacity:.55;cursor:not-allowed}
.stage{padding:14px;background:linear-gradient(#fbfdff,#f5f9fc)}
.scene{position:relative;border:2px solid #a9bfd4;border-radius:14px;background:#fff;min-height:360px;padding:10px;display:grid;grid-template-rows:1fr auto;gap:10px}
svg{width:100%;height:auto;max-height:410px;display:block}
.card{border:2px solid #8eabc5;border-radius:12px;background:#fff;padding:12px;box-shadow:0 4px 12px rgba(30,55,85,.08)}
.prompt{font-size:clamp(1rem,2.3vw,1.18rem);font-weight:700;margin:0 0 10px}
.setup{margin:0 0 10px;color:#334b65}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.feedback{min-height:2.7em;margin:10px 0 0;font-weight:700;color:#163b60}
.status{font-size:.9rem;color:#4b6179;margin:0}
.evidence{display:none;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}
.evidence.show{display:grid}
.metric{border:1px solid #a9bfd4;border-radius:9px;background:#f7fbff;padding:8px;text-align:center}
.metric strong{display:block;font-size:1.15rem;color:#153d66}
.hidden{display:none!important}
.glow{filter:drop-shadow(0 0 10px #f4c542) drop-shadow(0 0 18px #f4c542)}
.dim{opacity:.25}
.wire{stroke:#34495e;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.battery{fill:#eef5fb;stroke:#285f9f;stroke-width:3}
.bulb{fill:#f3f5f7;stroke:#5b6b7a;stroke-width:3}
.bulb.on{fill:#ffd861;stroke:#8a6700}
.label{font-size:22px;font-weight:700;fill:#173b63}
.small{font-size:18px;fill:#354b60}
.current{stroke:#e05a47;stroke-width:7;fill:none;stroke-linecap:round;marker-end:url(#arrow)}
.power{stroke:#8f4fd6;stroke-width:8;fill:none;stroke-linecap:round;marker-end:url(#arrow2)}
.meter{fill:#fff;stroke:#285f9f;stroke-width:4}
.meterText{font-size:21px;font-weight:700;fill:#173b63;text-anchor:middle;dominant-baseline:middle}
@media(max-width:620px){body{padding:3px}.app{border-width:4px;border-radius:13px}.topbar{padding:9px 10px}.stage{padding:8px}.scene{min-height:330px;padding:6px}.card{padding:9px}.choices{display:grid;grid-template-columns:1fr}button{width:100%}.topbar button{width:auto}.label{font-size:18px}.small{font-size:15px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head>
<body><main class="app">
<header class="topbar"><h1>Series vs. Parallel Bulb Energy Flow</h1><button id="reset" type="button">Reset</button></header>
<section class="stage"><div class="scene" aria-label="Two circuits with identical batteries and bulbs">
<svg viewBox="0 0 900 420" role="img" aria-labelledby="spTitle spDesc"><title id="spTitle">Series and parallel circuit comparison</title><desc id="spDesc">A series circuit and a parallel circuit each contain a 12 volt battery and two identical 6 ohm bulbs.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#e05a47"/></marker><marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8f4fd6"/></marker></defs>
<text x="225" y="35" class="label" text-anchor="middle">Series</text><text x="675" y="35" class="label" text-anchor="middle">Parallel</text>
<!-- series --> <rect x="45" y="150" width="54" height="105" rx="8" class="battery"/><line x1="63" y1="171" x2="82" y2="171" stroke="#285f9f" stroke-width="5"/><line x1="55" y1="195" x2="90" y2="195" stroke="#285f9f" stroke-width="5"/><text x="72" y="281" class="small" text-anchor="middle">12 V</text><path d="M99 200 H150 V95 H400 V200 H350" class="wire"/><path d="M99 205 H150 V310 H400 V205 H350" class="wire"/><circle id="sBulb1" cx="245" cy="95" r="34" class="bulb"/><circle id="sBulb2" cx="245" cy="310" r="34" class="bulb"/><path id="sFlow" d="M125 200 H150 V95 H190" class="current hidden"/><text x="245" y="101" class="small" text-anchor="middle">6 Ω</text><text x="245" y="316" class="small" text-anchor="middle">6 Ω</text>
<!-- parallel --> <rect x="495" y="150" width="54" height="105" rx="8" class="battery"/><line x1="513" y1="171" x2="532" y2="171" stroke="#285f9f" stroke-width="5"/><line x1="505" y1="195" x2="540" y2="195" stroke="#285f9f" stroke-width="5"/><text x="522" y="281" class="small" text-anchor="middle">12 V</text><path d="M549 200 H610 V80 H835 V320 H610 V205 H549" class="wire"/><path d="M610 80 V200 H835" class="wire"/><circle id="pBulb1" cx="720" cy="80" r="34" class="bulb"/><circle id="pBulb2" cx="720" cy="200" r="34" class="bulb"/><path id="pFlow" d="M565 200 H610 V80 H665" class="current hidden"/><text x="720" y="86" class="small" text-anchor="middle">6 Ω</text><text x="720" y="206" class="small" text-anchor="middle">6 Ω</text>
</svg>
<div class="card" aria-live="polite"><p id="setup" class="setup">Both circuits use a 12 V battery and two identical 6 Ω bulbs.</p><p id="prompt" class="prompt">Choose Start, then predict each comparison.</p><div id="choices" class="choices hidden"></div><div id="evidence" class="evidence"></div><p id="feedback" class="feedback"></p><button id="main" type="button">Start</button><p id="status" class="status">Question 0 of 3</p></div>
</div></section>
<script>
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let completionSent=false;
function completeOnce(){if(completionSent)return;completionSent=true;window.parent.postMessage({type:'complete'},'*');}

const scenarios=[
{q:'Which circuit makes each bulb brighter?',opts:[['series','Series'],['parallel','Parallel'],['same','Same brightness']],correct:'parallel',feedback:'Each parallel bulb is brighter. Each receives the full 12 V and transfers 24 W.',metrics:[['Series current','1.0 A'],['Series bulb power','6 W each'],['Parallel current','4.0 A'],['Parallel bulb power','24 W each']]},
{q:'Which circuit draws more total current?',opts:[['series','Series'],['parallel','Parallel'],['same','Same current']],correct:'parallel',feedback:'The parallel circuit draws more current. Its 3 Ω equivalent resistance allows 4 A from the battery.',metrics:[['Series Rₑq','12 Ω'],['Series current','1.0 A'],['Parallel Rₑq','3 Ω'],['Parallel current','4.0 A']]},
{q:'Which circuit transfers more total power?',opts:[['series','Series'],['parallel','Parallel'],['same','Same total power']],correct:'parallel',feedback:'The parallel circuit transfers more total power. At 12 V it transfers 48 W compared with 12 W in series.',metrics:[['Series total power','12 W'],['Parallel total power','48 W'],['Series energy each second','12 J'],['Parallel energy each second','48 J']]}
];
let index=-1,state='setup';
const $=id=>document.getElementById(id);
function clearVisuals(){['sBulb1','sBulb2','pBulb1','pBulb2'].forEach(id=>$(id).setAttribute('class','bulb'));$('sFlow').classList.add('hidden');$('pFlow').classList.add('hidden');$('evidence').className='evidence';$('evidence').innerHTML='';$('feedback').textContent='';}
function startScenario(){clearVisuals();state='predict';const s=scenarios[index];$('prompt').textContent=s.q;$('choices').innerHTML='';shuffle(s.opts).forEach(([v,label])=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.addEventListener('click',()=>choose(v));$('choices').appendChild(b);});$('choices').classList.remove('hidden');$('main').classList.add('hidden');$('status').textContent=`Question ${index+1} of ${scenarios.length}`;}
function choose(v){if(state!=='predict')return;state='reveal';$('choices').classList.add('hidden');['sBulb1','sBulb2'].forEach(id=>$(id).classList.add('on'));['pBulb1','pBulb2'].forEach(id=>$(id).classList.add('on','glow'));$('sFlow').classList.remove('hidden');$('pFlow').classList.remove('hidden');const s=scenarios[index];$('evidence').innerHTML=s.metrics.map(([a,b])=>`<div class="metric"><span>${a}</span><strong>${b}</strong></div>`).join('');$('evidence').classList.add('show');$('feedback').textContent=s.feedback;$('main').textContent=index===scenarios.length-1?'Finish':'Next question';$('main').classList.remove('hidden');state='explain';}
$('main').addEventListener('click',()=>{if(state==='setup'){index=0;startScenario();}else if(state==='explain'){if(index===scenarios.length-1){completeOnce();$('prompt').textContent='Comparison complete.';$('main').textContent='Replay';state='done';}else{index++;startScenario();}}else if(state==='done'){index=0;startScenario();}});
$('reset').addEventListener('click',()=>{index=-1;state='setup';clearVisuals();$('prompt').textContent='Choose Start, then predict each comparison.';$('choices').classList.add('hidden');$('main').textContent='Start';$('main').classList.remove('hidden');$('status').textContent='Question 0 of 3';});
</script></main></body></html>
