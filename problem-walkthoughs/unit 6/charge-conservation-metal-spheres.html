<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charge Conservation with Metal Spheres</title>
  <style>
    :root{--navy:#153456;--blue:#285f9f;--blue2:#174b86;--sky:#eef7ff;--line:#bfd2e6;--ink:#132238;--muted:#52657b;--orange:#b55213;--green:#166534;--green-soft:#e8f7ed}
    *{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit;min-height:44px}.ccs-app{width:min(100%,1080px);margin:0 auto;border:5px solid var(--blue);border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 18px 48px rgba(21,52,86,.14)}.ccs-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 21px 14px;border-bottom:1px solid var(--line);background:linear-gradient(115deg,#fff,#eef7ff)}.ccs-kicker{margin:0 0 3px;color:var(--blue);font-size:.73rem;font-weight:850;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;color:var(--navy);font-size:clamp(1.35rem,4vw,2rem);line-height:1.08;letter-spacing:-.03em}.ccs-reset{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--blue2);font-weight:800;cursor:pointer}.ccs-main{padding:16px}.ccs-progress{display:flex;align-items:center;gap:8px;margin:0 0 10px}.ccs-progress-label{margin-right:auto;color:var(--muted);font-size:.8rem;font-weight:800}.ccs-dot{width:11px;height:11px;border:2px solid #91abc5;border-radius:50%;background:#fff}.ccs-dot[data-state=current]{border-color:var(--blue);background:var(--blue)}.ccs-dot[data-state=done]{border-color:var(--green);background:var(--green)}.ccs-stage{position:relative;border:1px solid #a9c3df;border-radius:18px;overflow:hidden;background:linear-gradient(rgba(40,95,159,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(40,95,159,.05) 1px,transparent 1px),var(--sky);background-size:30px 30px}.ccs-stage svg{display:block;width:100%;height:auto;min-height:310px}.ccs-sphere{filter:drop-shadow(0 11px 9px rgba(21,52,86,.17))}.ccs-wire{stroke:#6f89a5;stroke-width:6}.ccs-charge{fill:#fff;font-size:29px;font-weight:900;text-anchor:middle;dominant-baseline:central}.ccs-label{fill:var(--navy);font-size:15px;font-weight:850;text-anchor:middle}.ccs-total-card{position:absolute;top:12px;left:50%;translate:-50% 0;min-width:190px;padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.95);color:var(--navy);font-weight:850;text-align:center;box-shadow:0 5px 15px rgba(21,52,86,.1)}.ccs-electrons{opacity:0}.ccs-electrons[data-show=true]{opacity:1}.ccs-e{fill:#fff;stroke:#176ca7;stroke-width:3}.ccs-e-text{fill:#176ca7;font-size:12px;font-weight:900;text-anchor:middle;dominant-baseline:central}.ccs-qmark{transform-box:fill-box;transform-origin:center;animation:ccs-pulse 1.6s ease-in-out infinite}.ccs-qmark[data-show=false]{opacity:0}.ccs-qmark circle{fill:#fff;stroke:var(--blue);stroke-width:3}.ccs-qmark text{fill:var(--blue);font-size:30px;font-weight:900;text-anchor:middle;dominant-baseline:central}@keyframes ccs-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}.ccs-card{margin-top:12px;padding:14px 16px;border:2px solid var(--line);border-radius:16px;background:#fff;transition:border-color .25s,box-shadow .25s}.ccs-card[data-flash=true]{border-color:var(--blue);box-shadow:0 0 0 4px rgba(40,95,159,.16)}.ccs-steps{display:flex;gap:8px;margin:0 0 11px}.ccs-step{flex:1;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:#f5f9fd;color:var(--muted);font-size:.78rem;font-weight:850;text-align:center;transition:background .2s,color .2s,border-color .2s}.ccs-step[data-state=current]{border-color:var(--blue);background:var(--blue);color:#fff}.ccs-step[data-state=done]{border-color:var(--green);background:var(--green-soft);color:var(--green)}.ccs-ask[data-anim=true]{animation:ccs-enter .4s ease-out}@keyframes ccs-enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.ccs-prompt{margin:0;color:var(--navy);font-weight:850}.ccs-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}.ccs-choice{padding:8px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-weight:850;cursor:pointer}.ccs-choice:hover{background:#f2f7fc}.ccs-choice:disabled{opacity:.68}.ccs-choice[data-picked=true]{border-color:var(--blue);background:#e9f2fb;opacity:1}.ccs-choice[data-correct=true]{border-color:var(--green);background:var(--green-soft);color:var(--green);opacity:1}.ccs-action-row{display:flex;align-items:center;gap:10px;margin-top:10px}.ccs-action{padding:9px 16px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:850;cursor:pointer}.ccs-action:disabled{opacity:.48;cursor:not-allowed}.ccs-feedback{margin:0;color:var(--muted);line-height:1.45}.ccs-feedback strong{color:var(--navy)}
    :focus-visible{outline:3px solid #e56b24;outline-offset:3px}@media(max-width:680px){.ccs-choices{grid-template-columns:1fr 1fr}.ccs-stage svg{min-height:270px}.ccs-action-row{align-items:flex-start;flex-direction:column}.ccs-head{align-items:flex-start}}@media(max-width:420px){.ccs-main{padding:9px}.ccs-stage svg{min-height:235px}.ccs-choices{grid-template-columns:1fr}.ccs-reset{padding:7px 10px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="ccs-app">
    <header class="ccs-head"><div><p class="ccs-kicker">Unit 6 &middot; Charge conservation</p><h1>Charge Conservation with Metal Spheres</h1></div><button class="ccs-reset" id="ccs-reset" type="button">Reset</button></header>
    <div class="ccs-main">
      <div class="ccs-progress"><span class="ccs-progress-label" id="ccs-round">Round 1 of 3</span><i class="ccs-dot" data-state="current"></i><i class="ccs-dot"></i><i class="ccs-dot"></i></div>
      <section class="ccs-stage" aria-label="Two identical conducting spheres on insulating stands">
        <div class="ccs-total-card" id="ccs-total">System charge after contact: ?</div>
        <svg viewBox="0 0 900 340" role="img" aria-labelledby="ccs-svg-title ccs-svg-desc"><title id="ccs-svg-title">Metal sphere charge-sharing diagram</title><desc id="ccs-svg-desc">Two identical spheres are touching. Electrons cross the contact point, then the spheres separate with equal charge.</desc><defs><radialGradient id="ccs-metal" cx="35%" cy="28%"><stop offset="0" stop-color="#ecf5fc"/><stop offset=".42" stop-color="#9ab6cf"/><stop offset="1" stop-color="#3f6282"/></radialGradient></defs>
          <line class="ccs-wire" id="ccs-stand-a" x1="375" y1="235" x2="375" y2="300"/><line class="ccs-wire" id="ccs-stand-b" x1="525" y1="235" x2="525" y2="300"/>
          <line id="ccs-base-a" x1="315" y1="304" x2="435" y2="304" stroke="#6f89a5" stroke-width="8" stroke-linecap="round"/><line id="ccs-base-b" x1="465" y1="304" x2="585" y2="304" stroke="#6f89a5" stroke-width="8" stroke-linecap="round"/>
          <g id="ccs-group-a"><circle class="ccs-sphere" id="ccs-sphere-a" cx="375" cy="170" r="75" fill="url(#ccs-metal)" stroke="#153456" stroke-width="3"/><text class="ccs-charge" id="ccs-charge-a" x="375" y="170">+6 nC</text><text class="ccs-label" id="ccs-label-a" x="375" y="265">Sphere A</text></g>
          <g id="ccs-group-b"><circle class="ccs-sphere" id="ccs-sphere-b" cx="525" cy="170" r="75" fill="url(#ccs-metal)" stroke="#153456" stroke-width="3"/><text class="ccs-charge" id="ccs-charge-b" x="525" y="170">−2 nC</text><text class="ccs-label" id="ccs-label-b" x="525" y="265">Sphere B</text></g>
          <g class="ccs-electrons" id="ccs-electrons" data-show="false"><g class="ccs-e-pack"><circle class="ccs-e" r="15"/><text class="ccs-e-text">e−</text></g><g class="ccs-e-pack"><circle class="ccs-e" r="15"/><text class="ccs-e-text">e−</text></g><g class="ccs-e-pack"><circle class="ccs-e" r="15"/><text class="ccs-e-text">e−</text></g></g>
          <g class="ccs-qmark" id="ccs-qmark" data-show="true"><circle cx="450" cy="170" r="25"/><text x="450" y="171">?</text></g>
        </svg>
      </section>
      <section class="ccs-card" id="ccs-card" aria-live="polite">
        <div class="ccs-steps"><span class="ccs-step" data-state="current">1 &middot; Which way?</span><span class="ccs-step">2 &middot; Final charges</span></div>
        <div class="ccs-ask" id="ccs-ask"><p class="ccs-prompt" id="ccs-prompt">The spheres are touching. Which way does charge move?</p><div class="ccs-choices" id="ccs-choices"></div></div>
        <div class="ccs-action-row"><button class="ccs-action" id="ccs-action" type="button" hidden>Next round</button><p class="ccs-feedback" id="ccs-feedback"></p></div>
      </section>
    </div>
    <script>
      (()=>{
        const $=s=>document.querySelector(s), scenarios=[
          {a:6,b:-2,final:2,options:[[2,2],[4,4],[0,0],[8,-4]]},
          {a:-4,b:0,final:-2,options:[[-2,-2],[-4,-4],[0,0],[-4,4]]},
          {a:5,b:1,final:3,options:[[3,3],[6,6],[2,2],[4,4]]}
        ];
        const flows=[{v:'a2b',t:'Electrons: A → B'},{v:'b2a',t:'Electrons: B → A'},{v:'protons',t:'Protons move, not electrons'},{v:'none',t:'No charge moves'}];
        const TOUCH_A=375,TOUCH_B=525,APART_A=270,APART_B=630;
        const state={round:0,phase:'flow',dir:null,choice:null,complete:false,anim:null,timer:null,flash:null};const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
        const packs=[].slice.call(document.querySelectorAll('.ccs-e-pack'));
        function q(n,dp){const v=Math.abs(n)<5e-4?0:n;return `${v>0?'+':v<0?'−':''}${Math.abs(v).toFixed(dp||0)} nC`}function shuffled(items){return items.map(v=>({v,r:Math.random()})).sort((x,y)=>x.r-y.r).map(x=>x.v)}
        function flowOf(s){return s.a>s.b?'b2a':s.a<s.b?'a2b':'none'}function flowText(dir){return dir==='a2b'?'A to B':dir==='b2a'?'B to A':'nowhere'}
        function pos(side,x){$('#ccs-sphere-'+side).setAttribute('cx',x);$('#ccs-charge-'+side).setAttribute('x',x);$('#ccs-label-'+side).setAttribute('x',x);$('#ccs-stand-'+side).setAttribute('x1',x);$('#ccs-stand-'+side).setAttribute('x2',x);$('#ccs-base-'+side).setAttribute('x1',x-60);$('#ccs-base-'+side).setAttribute('x2',x+60)}
        function setCharges(a,b,dp){$('#ccs-charge-a').textContent=q(a,dp);$('#ccs-charge-b').textContent=q(b,dp)}
        function dots(){document.querySelectorAll('.ccs-dot').forEach((d,i)=>d.dataset.state=i<state.round?'done':i===state.round?'current':'')}
        function steps(n){document.querySelectorAll('.ccs-step').forEach((el,i)=>el.dataset.state=n>i+1?'done':n===i+1?'current':'')}
        function announce(){const ask=$('#ccs-ask'),card=$('#ccs-card');ask.dataset.anim='false';void ask.offsetWidth;ask.dataset.anim='true';card.dataset.flash='true';clearTimeout(state.flash);state.flash=setTimeout(()=>{card.dataset.flash='false'},760)}
        function buttons(list){const box=$('#ccs-choices');box.innerHTML='';list.forEach(o=>{const b=document.createElement('button');b.className='ccs-choice';b.type='button';b.dataset.value=o.v;b.textContent=o.t;box.appendChild(b)})}
        function lock(value){document.querySelectorAll('.ccs-choice').forEach(b=>{b.disabled=true;if(b.dataset.value===value)b.dataset.picked='true'})}
        function setup(){cancelAnimationFrame(state.anim);clearTimeout(state.timer);clearTimeout(state.flash);state.phase='flow';state.dir=null;state.choice=null;const s=scenarios[state.round];$('#ccs-round').textContent=`Round ${state.round+1} of ${scenarios.length}`;dots();pos('a',TOUCH_A);pos('b',TOUCH_B);setCharges(s.a,s.b,0);$('#ccs-total').textContent=`System charge: ${q(s.a+s.b)} → ?`;const qm=$('#ccs-qmark');qm.dataset.show='true';qm.style.opacity='';$('#ccs-electrons').dataset.show='false';packs.forEach(g=>g.style.opacity=0);steps(1);$('#ccs-prompt').textContent='The spheres are touching. Which way does charge move?';$('#ccs-feedback').textContent='Only one kind of charge is free to move inside a metal.';buttons(shuffled(flows));announce();const action=$('#ccs-action');action.hidden=true;action.disabled=false}
        function chooseFlow(value){if(state.phase!=='flow')return;state.dir=value;state.phase='amount';lock(value);const s=scenarios[state.round],picked=flows.find(f=>f.v===value);state.timer=setTimeout(()=>{steps(2);$('#ccs-prompt').textContent='What charge will each sphere have after contact?';$('#ccs-feedback').textContent=`Locked in: ${picked.t}. Now predict the final charges.`;buttons(shuffled(s.options).map(pair=>({v:pair.join(','),t:`A: ${q(pair[0])}  ·  B: ${q(pair[1])}`})));announce()},320)}
        function chooseAmount(value){if(state.phase!=='amount')return;state.phase='reveal';state.choice=value.split(',').map(Number);lock(value);state.timer=setTimeout(reveal,320)}
        function bez(p0,c,p1,t){const u=1-t;return u*u*p0+2*u*t*c+t*t*p1}
        function paint(dir,progress){const sx=dir==='a2b'?TOUCH_A:TOUCH_B,dx=dir==='a2b'?TOUCH_B:TOUCH_A;packs.forEach((g,i)=>{const t=(progress*2.2+i*0.34)%1;g.setAttribute('transform',`translate(${bez(sx,450,dx,t).toFixed(1)},${bez(140,88,140,t).toFixed(1)})`);g.style.opacity=Math.min(1,Math.sin(Math.PI*t)*1.9).toFixed(2)})}
        function reveal(){const s=scenarios[state.round],dir=flowOf(s),qm=$('#ccs-qmark');qm.dataset.show='false';$('#ccs-prompt').textContent='Electrons are crossing the contact point…';$('#ccs-feedback').textContent='Watch each sphere’s number change while the system total holds steady.';const settle=()=>{setCharges(s.final,s.final,0);$('#ccs-total').textContent=`System charge: ${q(s.a+s.b)} → ${q(s.final+s.final)}`;$('#ccs-electrons').dataset.show='false';state.timer=setTimeout(separate,500)};if(reduced){qm.style.opacity=0;paint(dir,.5);$('#ccs-electrons').dataset.show='true';settle();return}$('#ccs-electrons').dataset.show='true';const duration=1600,start=performance.now();function frame(now){const t=Math.min(1,(now-start)/duration),ease=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;qm.style.opacity=Math.max(0,1-t*6).toFixed(2);setCharges(s.a+(s.final-s.a)*ease,s.b+(s.final-s.b)*ease,1);paint(dir,t);if(t<1)state.anim=requestAnimationFrame(frame);else settle()}state.anim=requestAnimationFrame(frame)}
        function separate(){const s=scenarios[state.round];if(reduced){pos('a',APART_A);pos('b',APART_B);explain(s);return}const duration=700,start=performance.now();function frame(now){const t=Math.min(1,(now-start)/duration),ease=t*t*(3-2*t);pos('a',TOUCH_A-105*ease);pos('b',TOUCH_B+105*ease);if(t<1)state.anim=requestAnimationFrame(frame);else explain(s)}state.anim=requestAnimationFrame(frame)}
        function explain(s){state.phase='explain';steps(3);$('#ccs-electrons').dataset.show='false';const dir=flowOf(s),dirOK=state.dir===dir,valOK=state.choice[0]===s.final&&state.choice[1]===s.final;const more=s.a>s.b?'A':'B',less=s.a>s.b?'B':'A';const head=dirOK&&valOK?'Both predictions match the evidence.':dirOK?'Right direction — the final values need another look.':valOK?'Right values — the flow direction needs another look.':'The evidence changes both predictions.';document.querySelectorAll('.ccs-choice').forEach(b=>{if(b.dataset.value===`${s.final},${s.final}`)b.dataset.correct='true'});$('#ccs-prompt').textContent=`Electrons flowed from ${less} to ${more}, and each sphere finishes at ${q(s.final)}.`;$('#ccs-feedback').innerHTML=`<strong>${head}</strong> Sphere ${more} was the more positive side, so free electrons drifted from ${less} onto ${more} until both matched — protons stay locked in place. The unchanged total, ${q(s.a+s.b)}, divides equally between identical spheres.`;const action=$('#ccs-action');action.disabled=false;action.hidden=false;action.textContent=state.round===scenarios.length-1?'Finish':'Next round';action.focus()}
        function next(){if(state.phase!=='explain')return;if(state.round<scenarios.length-1){state.round++;setup()}else if(!state.complete){state.complete=true;document.querySelectorAll('.ccs-dot').forEach(d=>d.dataset.state='done');$('#ccs-action').hidden=true;$('#ccs-prompt').textContent='Charge conserved across all three contacts.';window.parent.postMessage({ type: 'complete' }, '*');}}
        $('#ccs-choices').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(state.phase==='flow')chooseFlow(b.dataset.value);else if(state.phase==='amount')chooseAmount(b.dataset.value)});$('#ccs-action').addEventListener('click',next);$('#ccs-reset').addEventListener('click',()=>{Object.assign(state,{round:0,phase:'flow',dir:null,choice:null,anim:null,timer:null});$('#ccs-card').dataset.flash='false';setup()});setup();
      })();
    </script>
  </main>
</body>
</html>
