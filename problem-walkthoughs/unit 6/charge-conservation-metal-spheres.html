<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Two Identical Spheres Touch</title><style>
html, body { background: transparent; }
body{margin:0;font-family:system-ui,sans-serif;color:#17324c}.spheres{box-sizing:border-box;max-width:960px;margin:auto;border:5px solid #285f9f;border-radius:18px;background:#f8fbfd;padding:12px}.spheres h1{font-size:clamp(17px,3.5vw,25px);text-align:center;margin:4px 0 10px;white-space:nowrap}.spheres svg{display:block;width:100%;background:white;border-radius:12px}.spheres button{margin-top:6px;padding:10px 18px;border:1px solid #285f9f;border-radius:8px;background:white;color:#17324c;font:600 15px system-ui;min-height:44px;cursor:pointer}.spheres button:focus-visible{outline:3px solid #b45d14;outline-offset:3px}.spheres .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.spheres svg text{font-family:system-ui,sans-serif;fill:#17324c;font-size:18px}.spheres svg .small{font-size:15px}.spheres svg .value{font-size:27px;font-weight:750}.spheres svg .caption{font-size:19px;font-weight:650}@media(max-width:480px){.spheres{padding:6px;border-radius:12px}.spheres svg .small{font-size:19px}}
.controls{display:flex;gap:18px;margin-top:6px}.controls label{flex:1;min-width:0;font-size:14px;font-weight:650}.controls output{float:right}.controls input{display:block;width:100%;min-height:32px;accent-color:#285f9f}.spheres button:disabled{opacity:.6;cursor:default}.spheres svg .value{font-size:24px}
</style></head><body><main class="spheres"><h1>Two Identical Spheres Touch</h1><svg id="scene" role="img" aria-labelledby="scene-title scene-desc"></svg><div class="controls"><label for="charge-a">Sphere A <output id="charge-a-value">+6.0 nC</output><input id="charge-a" type="range" min="-8" max="8" step="1" value="6"></label><label for="charge-b">Sphere B <output id="charge-b-value">−2.0 nC</output><input id="charge-b" type="range" min="-8" max="8" step="1" value="-2"></label></div><button id="run" type="button">Touch spheres</button> <button id="replay" type="button">Reset trial</button><div id="status" class="sr" role="status" aria-live="polite"></div><script src="sphere-contact.js"></script></main></body></html>
