<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charge Conservation with Metal Spheres</title>
  <style>
    :root{--navy:#153456;--blue:#285f9f;--blue2:#174b86;--sky:#eef7ff;--line:#bfd2e6;--ink:#132238;--muted:#52657b;--orange:#b55213;--green:#166534;--green-soft:#e8f7ed}
    *{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit;min-height:44px}.ccs-app{width:min(100%,1080px);margin:0 auto;border:5px solid var(--blue);border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 18px 48px rgba(21,52,86,.14)}.ccs-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 21px 14px;border-bottom:1px solid var(--line);background:linear-gradient(115deg,#fff,#eef7ff)}.ccs-kicker{margin:0 0 3px;color:var(--blue);font-size:.73rem;font-weight:850;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;color:var(--navy);font-size:clamp(1.35rem,4vw,2rem);line-height:1.08;letter-spacing:-.03em}.ccs-reset{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--blue2);font-weight:800;cursor:pointer}.ccs-main{padding:16px}.ccs-progress{display:flex;align-items:center;gap:8px;margin:0 0 10px}.ccs-progress-label{margin-right:auto;color:var(--muted);font-size:.8rem;font-weight:800}.ccs-dot{width:11px;height:11px;border:2px solid #91abc5;border-radius:50%;background:#fff}.ccs-dot[data-state=current]{border-color:var(--blue);background:var(--blue)}.ccs-dot[data-state=done]{border-color:var(--green);background:var(--green)}.ccs-stage{position:relative;border:1px solid #a9c3df;border-radius:18px;overflow:hidden;background:linear-gradient(rgba(40,95,159,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(40,95,159,.05) 1px,transparent 1px),var(--sky);background-size:30px 30px}.ccs-stage svg{display:block;width:100%;height:auto;min-height:310px}.ccs-sphere{filter:drop-shadow(0 11px 9px rgba(21,52,86,.17))}.ccs-wire{stroke:#6f89a5;stroke-width:6}.ccs-charge{fill:#fff;font-size:29px;font-weight:900;text-anchor:middle;dominant-baseline:central}.ccs-label{fill:var(--navy);font-size:15px;font-weight:850;text-anchor:middle}.ccs-total-card{position:absolute;top:12px;left:50%;translate:-50% 0;min-width:190px;padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.95);color:var(--navy);font-weight:850;text-align:center;box-shadow:0 5px 15px rgba(21,52,86,.1)}.ccs-electrons{opacity:0}.ccs-electrons[data-show=true]{opacity:1}.ccs-e{fill:#fff;stroke:#176ca7;stroke-width:3}.ccs-e-text{fill:#176ca7;font-size:12px;font-weight:900;text-anchor:middle;dominant-baseline:central}.ccs-card{margin-top:12px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:#fff}.ccs-prompt{margin:0;color:var(--navy);font-weight:850}.ccs-choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}.ccs-choice{padding:8px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-weight:850;cursor:pointer}.ccs-choice:hover{background:#f2f7fc}.ccs-choice:disabled{opacity:.68}.ccs-action-row{display:flex;align-items:center;gap:10px;margin-top:10px}.ccs-action{padding:9px 16px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:850;cursor:pointer}.ccs-action:disabled{opacity:.48;cursor:not-allowed}.ccs-feedback{margin:0;color:var(--muted);line-height:1.45}.ccs-feedback strong{color:var(--navy)}.ccs-legend{margin:8px 2px 0;color:var(--muted);font-size:.78rem;text-align:center}
    :focus-visible{outline:3px solid #e56b24;outline-offset:3px}@media(max-width:680px){.ccs-choices{grid-template-columns:1fr 1fr}.ccs-stage svg{min-height:270px}.ccs-action-row{align-items:flex-start;flex-direction:column}.ccs-head{align-items:flex-start}}@media(max-width:420px){.ccs-main{padding:9px}.ccs-stage svg{min-height:235px}.ccs-choices{grid-template-columns:1fr}.ccs-reset{padding:7px 10px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="ccs-app">
    <header class="ccs-head"><div><p class="ccs-kicker">Unit 6 &middot; Charge conservation</p><h1>Charge Conservation with Metal Spheres</h1></div><button class="ccs-reset" id="ccs-reset" type="button">Reset</button></header>
    <div class="ccs-main">
      <div class="ccs-progress"><span class="ccs-progress-label" id="ccs-round">Round 1 of 3</span><i class="ccs-dot" data-state="current"></i><i class="ccs-dot"></i><i class="ccs-dot"></i></div>
      <section class="ccs-stage" aria-label="Two identical conducting spheres on insulating stands">
        <div class="ccs-total-card" id="ccs-total">System charge after contact: ?</div>
        <svg viewBox="0 0 900 340" role="img" aria-labelledby="ccs-svg-title ccs-svg-desc"><title id="ccs-svg-title">Metal sphere charge-sharing diagram</title><desc id="ccs-svg-desc">Two identical spheres move together, exchange electrons, then separate with equal charge.</desc><defs><radialGradient id="ccs-metal" cx="35%" cy="28%"><stop offset="0" stop-color="#ecf5fc"/><stop offset=".42" stop-color="#9ab6cf"/><stop offset="1" stop-color="#3f6282"/></radialGradient></defs>
          <line class="ccs-wire" id="ccs-stand-a" x1="270" y1="235" x2="270" y2="300"/><line class="ccs-wire" id="ccs-stand-b" x1="630" y1="235" x2="630" y2="300"/><path d="M210 304H330M570 304H690" stroke="#6f89a5" stroke-width="8" stroke-linecap="round"/>
          <g id="ccs-group-a"><circle class="ccs-sphere" id="ccs-sphere-a" cx="270" cy="170" r="75" fill="url(#ccs-metal)" stroke="#153456" stroke-width="3"/><text class="ccs-charge" id="ccs-charge-a" x="270" y="170">+6 nC</text><text class="ccs-label" id="ccs-label-a" x="270" y="265">Sphere A</text></g>
          <g id="ccs-group-b"><circle class="ccs-sphere" id="ccs-sphere-b" cx="630" cy="170" r="75" fill="url(#ccs-metal)" stroke="#153456" stroke-width="3"/><text class="ccs-charge" id="ccs-charge-b" x="630" y="170">−2 nC</text><text class="ccs-label" id="ccs-label-b" x="630" y="265">Sphere B</text></g>
          <g class="ccs-electrons" id="ccs-electrons" data-show="false"><circle class="ccs-e" cx="430" cy="152" r="15"/><text class="ccs-e-text" x="430" y="152">e−</text><circle class="ccs-e" cx="470" cy="188" r="15"/><text class="ccs-e-text" x="470" y="188">e−</text></g>
        </svg>
      </section>
      <p class="ccs-legend">Identical conducting spheres share total charge equally when they touch.</p>
      <section class="ccs-card" aria-live="polite"><p class="ccs-prompt" id="ccs-prompt">After contact, what charge will each sphere have?</p><div class="ccs-choices" id="ccs-choices"></div><div class="ccs-action-row"><button class="ccs-action" id="ccs-action" type="button" hidden>Touch spheres</button><p class="ccs-feedback" id="ccs-feedback"></p></div></section>
    </div>
    <script>
      (()=>{
        const $=s=>document.querySelector(s), scenarios=[
          {a:6,b:-2,final:2,options:[[2,2],[4,4],[0,0],[8,-4]]},
          {a:-4,b:0,final:-2,options:[[-2,-2],[-4,-4],[0,0],[-4,4]]},
          {a:5,b:1,final:3,options:[[3,3],[6,6],[2,2],[4,4]]}
        ];
        const state={round:0,phase:'predict',choice:null,complete:false,anim:null,timer:null};const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
        function q(n){return `${n>0?'+':n<0?'−':''}${Math.abs(n)||0} nC`}function shuffled(items){return items.map(v=>({v,r:Math.random()})).sort((x,y)=>x.r-y.r).map(x=>x.v)}
        function pos(side,x){$('#ccs-sphere-'+side).setAttribute('cx',x);$('#ccs-charge-'+side).setAttribute('x',x);$('#ccs-label-'+side).setAttribute('x',x);$('#ccs-stand-'+side).setAttribute('x1',x);$('#ccs-stand-'+side).setAttribute('x2',x)}
        function setCharges(a,b){$('#ccs-charge-a').textContent=q(a);$('#ccs-charge-b').textContent=q(b)}
        function dots(){document.querySelectorAll('.ccs-dot').forEach((d,i)=>d.dataset.state=i<state.round?'done':i===state.round?'current':'')}
        function setup(){cancelAnimationFrame(state.anim);clearTimeout(state.timer);state.phase='predict';state.choice=null;const s=scenarios[state.round];$('#ccs-round').textContent=`Round ${state.round+1} of ${scenarios.length}`;dots();pos('a',270);pos('b',630);setCharges(s.a,s.b);$('#ccs-total').textContent='System charge after contact: ?';$('#ccs-electrons').dataset.show='false';$('#ccs-prompt').textContent='After contact, what charge will each sphere have?';$('#ccs-feedback').textContent='';const choices=$('#ccs-choices');choices.innerHTML='';shuffled(s.options).forEach(pair=>{const b=document.createElement('button');b.className='ccs-choice';b.type='button';b.dataset.value=pair.join(',');b.textContent=`A: ${q(pair[0])}  ·  B: ${q(pair[1])}`;choices.appendChild(b)});$('#ccs-action').hidden=true}
        function choose(value){if(state.phase!=='predict')return;state.phase='ready';state.choice=value.split(',').map(Number);document.querySelectorAll('.ccs-choice').forEach(b=>b.disabled=true);$('#ccs-prompt').textContent='Prediction locked. Bring the spheres into contact.';$('#ccs-feedback').textContent='Watch the system total and both final charges.';const action=$('#ccs-action');action.hidden=false;action.textContent='Touch spheres';action.focus()}
        function touch(){if(state.phase!=='ready')return;state.phase='reveal';$('#ccs-action').disabled=true;$('#ccs-feedback').textContent='';const s=scenarios[state.round];if(reduced){pos('a',375);pos('b',525);$('#ccs-electrons').dataset.show='true';setCharges(s.final,s.final);$('#ccs-total').textContent=`System charge: ${q(s.a+s.b)} → ${q(s.final+s.final)}`;state.timer=setTimeout(separate,0);return}const duration=1050,start=performance.now();function frame(now){const t=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-t,3);pos('a',270+105*ease);pos('b',630-105*ease);if(t>=.72)$('#ccs-electrons').dataset.show='true';if(t<1)state.anim=requestAnimationFrame(frame);else{setCharges(s.final,s.final);$('#ccs-total').textContent=`System charge: ${q(s.a+s.b)} → ${q(s.final+s.final)}`;state.timer=setTimeout(separate,550)}}state.anim=requestAnimationFrame(frame)}
        function separate(){const s=scenarios[state.round];if(reduced){pos('a',270);pos('b',630);explain(s);return}const duration=700,start=performance.now();function frame(now){const t=Math.min(1,(now-start)/duration),ease=t*t*(3-2*t);pos('a',375-105*ease);pos('b',525+105*ease);if(t<1)state.anim=requestAnimationFrame(frame);else explain(s)}state.anim=requestAnimationFrame(frame)}
        function explain(s){state.phase='explain';$('#ccs-electrons').dataset.show='false';const correct=state.choice[0]===s.final&&state.choice[1]===s.final;$('#ccs-prompt').textContent=`Each sphere finishes at ${q(s.final)}.`;$('#ccs-feedback').innerHTML=`<strong>${correct?'Your prediction matches the evidence.':'The evidence changes the prediction.'}</strong> The unchanged total, ${q(s.a+s.b)}, divides equally between identical spheres.`;const action=$('#ccs-action');action.disabled=false;action.textContent=state.round===scenarios.length-1?'Finish':'Next round';action.focus()}
        function next(){if(state.phase==='ready')touch();else if(state.phase==='explain'){if(state.round<scenarios.length-1){state.round++;setup()}else if(!state.complete){state.complete=true;document.querySelectorAll('.ccs-dot').forEach(d=>d.dataset.state='done');$('#ccs-action').hidden=true;$('#ccs-prompt').textContent='Charge conserved across all three contacts.';window.parent.postMessage({ type: 'complete' }, '*');}}}
        $('#ccs-choices').addEventListener('click',e=>{const b=e.target.closest('button');if(b)choose(b.dataset.value)});$('#ccs-action').addEventListener('click',next);$('#ccs-reset').addEventListener('click',()=>{Object.assign(state,{round:0,phase:'predict',choice:null,anim:null,timer:null});$('#ccs-action').disabled=false;setup()});setup();
      })();
    </script>
  </main>
</body>
</html>
