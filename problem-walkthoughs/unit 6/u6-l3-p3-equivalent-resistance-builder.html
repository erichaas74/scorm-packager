<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equivalent Resistance Builder</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#16263a;line-height:1.35}
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{padding:8px}
.app{width:min(100%,980px);margin:0 auto;background:#fff;border:5px solid #285f9f;border-radius:18px;box-shadow:0 8px 24px rgba(30,55,85,.15);overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:#eef5fb;border-bottom:1px solid #bfd2e5}
h1{font-size:clamp(1rem,2.5vw,1.35rem);margin:0;color:#173b63}
button{font:inherit;min-height:42px;min-width:44px;border:2px solid #285f9f;border-radius:10px;background:#fff;color:#173b63;padding:8px 14px;font-weight:700;cursor:pointer}
button:hover{background:#edf5fd}
button:focus-visible{outline:4px solid #f3b61f;outline-offset:2px}
button[disabled]{opacity:.55;cursor:not-allowed}
.stage{padding:14px;background:linear-gradient(#fbfdff,#f5f9fc)}
.scene{position:relative;border:2px solid #a9bfd4;border-radius:14px;background:#fff;min-height:360px;padding:10px;display:grid;grid-template-rows:1fr auto;gap:10px}
svg{width:100%;height:auto;max-height:410px;display:block}
.card{border:2px solid #8eabc5;border-radius:12px;background:#fff;padding:12px;box-shadow:0 4px 12px rgba(30,55,85,.08)}
.prompt{font-size:clamp(1rem,2.3vw,1.18rem);font-weight:700;margin:0 0 10px}
.setup{margin:0 0 10px;color:#334b65}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.feedback{min-height:2.7em;margin:10px 0 0;font-weight:700;color:#163b60}
.status{font-size:.9rem;color:#4b6179;margin:0}
.evidence{display:none;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}
.evidence.show{display:grid}
.metric{border:1px solid #a9bfd4;border-radius:9px;background:#f7fbff;padding:8px;text-align:center}
.metric strong{display:block;font-size:1.15rem;color:#153d66}
.hidden{display:none!important}
.glow{filter:drop-shadow(0 0 10px #f4c542) drop-shadow(0 0 18px #f4c542)}
.dim{opacity:.25}
.wire{stroke:#34495e;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.battery{fill:#eef5fb;stroke:#285f9f;stroke-width:3}
.bulb{fill:#f3f5f7;stroke:#5b6b7a;stroke-width:3}
.bulb.on{fill:#ffd861;stroke:#8a6700}
.label{font-size:22px;font-weight:700;fill:#173b63}
.small{font-size:18px;fill:#354b60}
.current{stroke:#e05a47;stroke-width:7;fill:none;stroke-linecap:round;marker-end:url(#arrow)}
.power{stroke:#8f4fd6;stroke-width:8;fill:none;stroke-linecap:round;marker-end:url(#arrow2)}
.meter{fill:#fff;stroke:#285f9f;stroke-width:4}
.meterText{font-size:21px;font-weight:700;fill:#173b63;text-anchor:middle;dominant-baseline:middle}
@media(max-width:620px){body{padding:3px}.app{border-width:4px;border-radius:13px}.topbar{padding:9px 10px}.stage{padding:8px}.scene{min-height:330px;padding:6px}.card{padding:9px}.choices{display:grid;grid-template-columns:1fr}button{width:100%}.topbar button{width:auto}.label{font-size:18px}.small{font-size:15px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head>
<body><main class="app"><header class="topbar"><h1>Equivalent Resistance Builder</h1><button id="reset" type="button">Reset</button></header>
<section class="stage"><div class="scene" aria-label="Equivalent resistance goal challenge">
<svg viewBox="0 0 900 430" role="img" aria-labelledby="erTitle erDesc"><title id="erTitle">Equivalent resistance circuit builder</title><desc id="erDesc">A 12 volt battery powers resistor arrangements. The learner selects a circuit change to hit a target current.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#e05a47"/></marker><marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8f4fd6"/></marker></defs>
<text id="roundTitle" x="450" y="35" class="label" text-anchor="middle">Target current</text><rect x="80" y="155" width="60" height="110" rx="8" class="battery"/><text x="110" y="292" class="small" text-anchor="middle">12 V</text>
<path d="M140 210 H225 V90 H785 V330 H225 V215 H140" class="wire"/>
<g id="resistors"><rect id="r1" x="360" y="62" width="120" height="56" rx="10" fill="#f6efe5" stroke="#8b6b42" stroke-width="4"/><text x="420" y="97" class="small" text-anchor="middle">6 Ω</text><rect id="r2" x="540" y="62" width="120" height="56" rx="10" fill="#f6efe5" stroke="#8b6b42" stroke-width="4"/><text id="r2text" x="600" y="97" class="small" text-anchor="middle">6 Ω</text><rect id="r3" x="450" y="185" width="120" height="56" rx="10" fill="#f6efe5" stroke="#8b6b42" stroke-width="4" class="hidden"/><text id="r3text" x="510" y="220" class="small hidden" text-anchor="middle">6 Ω</text></g>
<path id="branchWire" d="M300 90 V213 H450 M570 213 H720 V90" class="wire hidden"/>
<path id="flow" d="M165 210 H225 V90 H325" class="current hidden"/>
<path id="powerFlow" d="M165 245 H225 V330 H730" class="power hidden"/>
<g id="targetBox"><rect x="300" y="300" width="300" height="92" rx="15" fill="#eef5fb" stroke="#285f9f" stroke-width="3"/><text x="450" y="334" class="small" text-anchor="middle">Target total current</text><text id="targetText" x="450" y="374" class="label" text-anchor="middle">?</text></g>
</svg>
<div class="card" aria-live="polite"><p id="setup" class="setup">Choose one circuit change, then test the result.</p><p id="prompt" class="prompt">Choose Start to begin the first target.</p><div id="choices" class="choices hidden"></div><div id="evidence" class="evidence"></div><p id="feedback" class="feedback"></p><button id="main" type="button">Start</button><p id="status" class="status">Round 0 of 4</p></div>
</div></section>
<script>
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let completionSent=false;
function completeOnce(){if(completionSent)return;completionSent=true;window.parent.postMessage({type:'complete'},'*');}

const rounds=[
{title:'One 6 Ω resistor',target:'1.0 A',base:'single',q:'Which change produces 1.0 A total current?',opts:[['series','Add 6 Ω in series'],['parallel','Add 6 Ω in parallel'],['none','Make no change']],correct:'series',reason:'Increasing equivalent resistance reduces total current and energy transfer each second.',outcomes:{series:['6 Ω + 6 Ω = 12 Ω','12 V ÷ 12 Ω = 1.0 A','12 V × 1.0 A = 12 W'],parallel:['1/Rₑq = 1/6 + 1/6; Rₑq = 3 Ω','12 V ÷ 3 Ω = 4.0 A','12 V × 4.0 A = 48 W'],none:['Rₑq = 6 Ω','12 V ÷ 6 Ω = 2.0 A','12 V × 2.0 A = 24 W']}},
{title:'One 6 Ω resistor',target:'4.0 A',base:'single',q:'Which change produces 4.0 A total current?',opts:[['series','Add 6 Ω in series'],['parallel','Add 6 Ω in parallel'],['none','Make no change']],correct:'parallel',reason:'Lower equivalent resistance increases total current and total power.',outcomes:{series:['6 Ω + 6 Ω = 12 Ω','12 V ÷ 12 Ω = 1.0 A','12 V × 1.0 A = 12 W'],parallel:['1/Rₑq = 1/6 + 1/6; Rₑq = 3 Ω','12 V ÷ 3 Ω = 4.0 A','12 V × 4.0 A = 48 W'],none:['Rₑq = 6 Ω','12 V ÷ 6 Ω = 2.0 A','12 V × 2.0 A = 24 W']}},
{title:'Two 6 Ω resistors in series',target:'2.0 A',base:'series2',q:'Which change produces 2.0 A total current?',opts:[['remove','Remove one resistor'],['addSeries','Add another in series'],['none','Make no change']],correct:'remove',reason:'Removing one series resistor lowers equivalent resistance from 12 Ω to 6 Ω.',outcomes:{remove:['Rₑq = 6 Ω','12 V ÷ 6 Ω = 2.0 A','12 V × 2.0 A = 24 W'],addSeries:['Rₑq = 6 + 6 + 6 = 18 Ω','12 V ÷ 18 Ω = 0.67 A','12 V × 0.67 A ≈ 8 W'],none:['Rₑq = 6 + 6 = 12 Ω','12 V ÷ 12 Ω = 1.0 A','12 V × 1.0 A = 12 W']}},
{title:'Two 6 Ω resistors in parallel',target:'6.0 A',base:'parallel2',q:'Which change produces 6.0 A total current?',opts:[['addParallel','Add a third 6 Ω branch'],['remove','Remove one branch'],['none','Make no change']],correct:'addParallel',reason:'More parallel paths lower equivalent resistance and increase energy transfer.',outcomes:{addParallel:['1/Rₑq = 1/6 + 1/6 + 1/6; Rₑq = 2 Ω','12 V ÷ 2 Ω = 6.0 A','12 V × 6.0 A = 72 W'],remove:['Rₑq = 6 Ω','12 V ÷ 6 Ω = 2.0 A','12 V × 2.0 A = 24 W'],none:['1/Rₑq = 1/6 + 1/6; Rₑq = 3 Ω','12 V ÷ 3 Ω = 4.0 A','12 V × 4.0 A = 48 W']}}
]
let index=-1,state='setup';const $=id=>document.getElementById(id);
function setBase(base){$('r2').classList.toggle('hidden',base==='single');$('r2text').classList.toggle('hidden',base==='single');const par=base==='parallel2';$('branchWire').classList.toggle('hidden',!par);$('r3').classList.add('hidden');$('r3text').classList.add('hidden');$('flow').classList.add('hidden');$('powerFlow').classList.add('hidden');$('evidence').className='evidence';$('evidence').innerHTML='';$('feedback').textContent='';}
function startRound(){state='predict';const r=rounds[index];setBase(r.base);$('roundTitle').textContent=r.title;$('targetText').textContent=r.target;$('prompt').textContent=r.q;$('choices').innerHTML='';shuffle(r.opts).forEach(([v,label])=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.addEventListener('click',()=>choose(v));$('choices').appendChild(b);});$('choices').classList.remove('hidden');$('main').classList.add('hidden');$('status').textContent=`Round ${index+1} of 4`;}
function showChosen(v){if(v==='series'||v==='addSeries'){$('r2').classList.remove('hidden');$('r2text').classList.remove('hidden');$('branchWire').classList.add('hidden');}else if(v==='parallel'||v==='addParallel'){$('r2').classList.remove('hidden');$('r2text').classList.remove('hidden');$('branchWire').classList.remove('hidden');if(v==='addParallel'){$('r3').classList.remove('hidden');$('r3text').classList.remove('hidden');}}else if(v==='remove'){$('r2').classList.add('hidden');$('r2text').classList.add('hidden');$('branchWire').classList.add('hidden');}}
function choose(v){if(state!=='predict')return;state='reveal';const r=rounds[index];const [req,current,power]=r.outcomes[v];$('choices').classList.add('hidden');showChosen(v);$('flow').classList.remove('hidden');$('powerFlow').classList.remove('hidden');$('evidence').innerHTML=`<div class="metric"><span>Equivalent resistance</span><strong>${req}</strong></div><div class="metric"><span>Total current</span><strong>${current}</strong></div><div class="metric"><span>Total power</span><strong>${power}</strong></div>`;$('evidence').classList.add('show');if(v===r.correct){$('feedback').textContent='Target reached. '+r.reason;$('main').textContent=index===3?'Finish':'Next target';state='explain';}else{$('feedback').textContent=`That circuit produces ${current.split('= ').pop()}, not ${r.target}. Try a different change.`;$('main').textContent='Try again';state='retry';}$('main').classList.remove('hidden');}
$('main').addEventListener('click',()=>{if(state==='setup'){index=0;startRound();}else if(state==='retry'){startRound();}else if(state==='explain'){if(index===3){completeOnce();$('prompt').textContent='Builder challenge complete.';$('main').textContent='Replay';state='done';}else{index++;startRound();}}else if(state==='done'){index=0;startRound();}});
$('reset').addEventListener('click',()=>{index=-1;state='setup';setBase('single');$('roundTitle').textContent='Target current';$('targetText').textContent='?';$('prompt').textContent='Choose Start to begin the first target.';$('choices').classList.add('hidden');$('main').textContent='Start';$('main').classList.remove('hidden');$('status').textContent='Round 0 of 4';});
</script></main></body></html>
