<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Virtual Ammeter and Voltmeter</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#16263a;line-height:1.35}
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{padding:8px}
.app{width:min(100%,980px);margin:0 auto;background:#fff;border:5px solid #285f9f;border-radius:18px;box-shadow:0 8px 24px rgba(30,55,85,.15);overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:#eef5fb;border-bottom:1px solid #bfd2e5}
h1{font-size:clamp(1rem,2.5vw,1.35rem);margin:0;color:#173b63}
button{font:inherit;min-height:42px;min-width:44px;border:2px solid #285f9f;border-radius:10px;background:#fff;color:#173b63;padding:8px 14px;font-weight:700;cursor:pointer}
button:hover{background:#edf5fd}
button:focus-visible{outline:4px solid #f3b61f;outline-offset:2px}
button[disabled]{opacity:.55;cursor:not-allowed}
.stage{padding:14px;background:linear-gradient(#fbfdff,#f5f9fc)}
.scene{position:relative;border:2px solid #a9bfd4;border-radius:14px;background:#fff;min-height:360px;padding:10px;display:grid;grid-template-rows:1fr auto;gap:10px}
svg{width:100%;height:auto;max-height:410px;display:block}
.card{border:2px solid #8eabc5;border-radius:12px;background:#fff;padding:12px;box-shadow:0 4px 12px rgba(30,55,85,.08)}
.prompt{font-size:clamp(1rem,2.3vw,1.18rem);font-weight:700;margin:0 0 10px}
.setup{margin:0 0 10px;color:#334b65}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.feedback{min-height:2.7em;margin:10px 0 0;font-weight:700;color:#163b60}
.status{font-size:.9rem;color:#4b6179;margin:0}
.evidence{display:none;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}
.evidence.show{display:grid}
.metric{border:1px solid #a9bfd4;border-radius:9px;background:#f7fbff;padding:8px;text-align:center}
.metric strong{display:block;font-size:1.15rem;color:#153d66}
.hidden{display:none!important}
.glow{filter:drop-shadow(0 0 10px #f4c542) drop-shadow(0 0 18px #f4c542)}
.dim{opacity:.25}
.wire{stroke:#34495e;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.battery{fill:#eef5fb;stroke:#285f9f;stroke-width:3}
.bulb{fill:#f3f5f7;stroke:#5b6b7a;stroke-width:3}
.bulb.on{fill:#ffd861;stroke:#8a6700}
.label{font-size:22px;font-weight:700;fill:#173b63}
.small{font-size:18px;fill:#354b60}
.current{stroke:#e05a47;stroke-width:7;fill:none;stroke-linecap:round;marker-end:url(#arrow)}
.power{stroke:#8f4fd6;stroke-width:8;fill:none;stroke-linecap:round;marker-end:url(#arrow2)}
.meter{fill:#fff;stroke:#285f9f;stroke-width:4}
.meterText{font-size:21px;font-weight:700;fill:#173b63;text-anchor:middle;dominant-baseline:middle}
@media(max-width:620px){body{padding:3px}.app{border-width:4px;border-radius:13px}.topbar{padding:9px 10px}.stage{padding:8px}.scene{min-height:330px;padding:6px}.card{padding:9px}.choices{display:grid;grid-template-columns:1fr}button{width:100%}.topbar button{width:auto}.label{font-size:18px}.small{font-size:15px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head>
<body><main class="app"><header class="topbar"><h1>Virtual Ammeter and Voltmeter</h1><button id="reset" type="button">Reset</button></header>
<section class="stage"><div class="scene" aria-label="Meters placed at circuit locations">
<svg viewBox="0 0 900 430" role="img" aria-labelledby="mvTitle mvDesc"><title id="mvTitle">Circuit meter placement</title><desc id="mvDesc">A series or parallel circuit contains meter locations labeled A and B. Meter readings remain hidden until a prediction is made.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#e05a47"/></marker><marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8f4fd6"/></marker></defs>
<text id="circuitTitle" x="450" y="35" class="label" text-anchor="middle">Series current</text><rect x="75" y="160" width="58" height="110" rx="8" class="battery"/><text x="104" y="298" class="small" text-anchor="middle">12 V</text>
<g id="seriesCircuit"><path d="M133 215 H220 V95 H785 V335 H220 V220 H133" class="wire"/><circle cx="430" cy="95" r="38" class="bulb on"/><circle cx="640" cy="95" r="38" class="bulb on"/><text x="430" y="101" class="small" text-anchor="middle">6 Ω</text><text x="640" y="101" class="small" text-anchor="middle">6 Ω</text></g>
<g id="parallelCircuit" class="hidden"><path d="M133 215 H220 V75 H785 V340 H220 V220 H133" class="wire"/><path d="M220 220 H785" class="wire"/><circle cx="525" cy="75" r="38" class="bulb on"/><circle cx="525" cy="220" r="38" class="bulb on"/><text x="525" y="81" class="small" text-anchor="middle">6 Ω</text><text x="525" y="226" class="small" text-anchor="middle">6 Ω</text></g>
<g id="meterA"><circle cx="300" cy="335" r="40" class="meter"/><text id="meterAText" x="300" y="335" class="meterText">?</text><text id="meterALabel" x="300" y="390" class="small" text-anchor="middle">Meter A</text></g>
<g id="meterB"><circle cx="600" cy="335" r="40" class="meter"/><text id="meterBText" x="600" y="335" class="meterText">?</text><text id="meterBLabel" x="600" y="390" class="small" text-anchor="middle">Meter B</text></g>
<path id="leadA" d="M300 295 V255" stroke="#285f9f" stroke-width="4" stroke-dasharray="7 7"/><path id="leadB" d="M600 295 V255" stroke="#285f9f" stroke-width="4" stroke-dasharray="7 7"/>
</svg>
<div class="card" aria-live="polite"><p id="setup" class="setup">The battery is 12 V and each bulb is 6 Ω.</p><p id="prompt" class="prompt">Choose Start to place the meters.</p><div id="choices" class="choices hidden"></div><div id="evidence" class="evidence"></div><p id="feedback" class="feedback"></p><button id="main" type="button">Start</button><p id="status" class="status">Measurement 0 of 4</p></div>
</div></section>
<script>
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let completionSent=false;
function completeOnce(){if(completionSent)return;completionSent=true;window.parent.postMessage({type:'complete'},'*');}

const scenarios=[
{kind:'series',title:'Series current',meter:'Ammeter',q:'How do the current readings at A and B compare?',opts:[['equal','They are equal'],['aMore','A is greater'],['bMore','B is greater']],correct:'equal',a:'1.0 A',b:'1.0 A',feedback:'Both ammeters read 1.0 A. A series circuit has one path, so the same current passes every component.',metrics:[['Total resistance','12 Ω'],['Current at A','1.0 A'],['Current at B','1.0 A']]},
{kind:'series',title:'Series voltage',meter:'Voltmeter',q:'How do the voltage drops across identical bulbs compare?',opts:[['equal','They are equal'],['aMore','Bulb A is greater'],['bMore','Bulb B is greater']],correct:'equal',a:'6.0 V',b:'6.0 V',feedback:'Each bulb has a 6.0 V drop. Identical series resistors divide the 12 V equally.',metrics:[['Battery voltage','12 V'],['Bulb A drop','6.0 V'],['Bulb B drop','6.0 V']]},
{kind:'parallel',title:'Parallel current',meter:'Ammeter',q:'How does total current compare with either branch current?',opts:[['double','Total is twice a branch'],['equal','They are equal'],['half','Total is half a branch']],correct:'double',a:'4.0 A',b:'2.0 A',feedback:'The total current is 4.0 A and each branch carries 2.0 A. Branch currents add at the junction.',metrics:[['Total current','4.0 A'],['Branch current','2.0 A'],['Branch sum','2.0 + 2.0 A']]},
{kind:'parallel',title:'Parallel voltage',meter:'Voltmeter',q:'How do the voltages across the two branches compare?',opts:[['equal','They are equal'],['topMore','Top branch is greater'],['bottomMore','Bottom branch is greater']],correct:'equal',a:'12 V',b:'12 V',feedback:'Both branches have 12 V. Each branch connects across the same two battery terminals.',metrics:[['Battery voltage','12 V'],['Top branch','12 V'],['Bottom branch','12 V']]}
];
let index=-1,state='setup';const $=id=>document.getElementById(id);
function prep(s){$('seriesCircuit').classList.toggle('hidden',s.kind!=='series');$('parallelCircuit').classList.toggle('hidden',s.kind!=='parallel');$('circuitTitle').textContent=s.title;$('meterAText').textContent='?';$('meterBText').textContent='?';$('meterALabel').textContent=`${s.meter} A`;$('meterBLabel').textContent=`${s.meter} B`;$('evidence').className='evidence';$('evidence').innerHTML='';$('feedback').textContent='';}
function startScenario(){state='predict';const s=scenarios[index];prep(s);$('prompt').textContent=s.q;$('choices').innerHTML='';shuffle(s.opts).forEach(([v,label])=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.addEventListener('click',()=>choose(v));$('choices').appendChild(b);});$('choices').classList.remove('hidden');$('main').classList.add('hidden');$('status').textContent=`Measurement ${index+1} of 4`;}
function choose(v){if(state!=='predict')return;state='reveal';const s=scenarios[index];$('choices').classList.add('hidden');$('meterAText').textContent=s.a;$('meterBText').textContent=s.b;$('evidence').innerHTML=s.metrics.map(([a,b])=>`<div class="metric"><span>${a}</span><strong>${b}</strong></div>`).join('');$('evidence').classList.add('show');$('feedback').textContent=s.feedback;$('main').textContent=index===3?'Finish':'Next placement';$('main').classList.remove('hidden');state='explain';}
$('main').addEventListener('click',()=>{if(state==='setup'){index=0;startScenario();}else if(state==='explain'){if(index===3){completeOnce();$('prompt').textContent='Meter walkthrough complete.';$('main').textContent='Replay';state='done';}else{index++;startScenario();}}else if(state==='done'){index=0;startScenario();}});
$('reset').addEventListener('click',()=>{index=-1;state='setup';prep(scenarios[0]);$('prompt').textContent='Choose Start to place the meters.';$('choices').classList.add('hidden');$('main').textContent='Start';$('main').classList.remove('hidden');$('status').textContent='Measurement 0 of 4';});
</script></main></body></html>
