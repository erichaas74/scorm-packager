<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiple-Charge Electric Field Vector Map</title>
  <style>
    :root{--blue:#285f9f;--blue-dark:#173f70;--ink:#17263a;--muted:#52657a;--line:#bfd0e2;--positive:#d64045;--negative:#2457c5;--e1:#d97706;--e2:#168aad;--net:#6f3fb2;--focus:#ffbf47}
    *{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}body{padding:8px}
    .rph-app{width:min(100%,960px);margin:0 auto;border:5px solid var(--blue);border-radius:24px;background:linear-gradient(180deg,#fff,#f4f9ff);padding:18px;box-shadow:0 16px 34px rgba(23,63,112,.14)}
    .rph-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}.rph-kicker{margin:0 0 3px;color:var(--blue);font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}h1{margin:0;font-size:clamp(1.25rem,2.8vw,1.85rem);line-height:1.1}
    button{font:inherit;font-weight:800;cursor:pointer;min-height:44px;border-radius:13px;border:2px solid transparent;transition:transform .15s ease,box-shadow .15s ease}button:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(23,63,112,.14)}button:focus-visible{outline:4px solid var(--focus);outline-offset:2px}button:disabled{opacity:.58;cursor:default;transform:none;box-shadow:none}
    .rph-reset{background:#fff;border-color:var(--line);color:var(--blue-dark);padding:9px 14px}.rph-main{background:var(--blue);color:#fff;padding:11px 20px}.rph-choice{background:#fff;border-color:var(--line);color:var(--ink);padding:10px 12px}
    .rph-progress{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem;font-weight:700;margin-bottom:10px}.rph-dots{display:flex;gap:6px}.rph-dot{width:11px;height:11px;border-radius:50%;background:#cad7e6;border:1px solid #a7b9cc}.rph-dot.active{background:var(--blue)}
    .rph-stage{border:2px solid #c6d6e8;border-radius:18px;background:radial-gradient(circle at 50% 45%,#fff 0%,#edf5ff 80%);overflow:hidden}.rph-scene{min-height:330px}.rph-scene svg{display:block;width:100%;height:330px}
    .rph-question{background:rgba(255,255,255,.97);border-top:2px solid #c6d6e8;padding:14px}.rph-prompt{margin:0 0 10px;font-size:1.02rem;font-weight:800}.rph-directions{margin:0 0 10px;color:var(--muted);font-size:.9rem}.rph-choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.rph-feedback{min-height:2.7em;margin:10px 0 0;font-weight:700;line-height:1.35}.rph-actions{display:flex;justify-content:flex-end;margin-top:10px}.rph-hidden{display:none!important}
    .charge-text{font-size:28px;font-weight:900;fill:#fff;text-anchor:middle;dominant-baseline:central}.charge-caption{font-size:15px;font-weight:800;fill:var(--ink);text-anchor:middle}.point-text{font-size:17px;font-weight:900;fill:var(--ink);text-anchor:middle}.vector-label{font-size:17px;font-weight:900}.guide{stroke:#a8bacd;stroke-width:2;stroke-dasharray:7 7}.component1{stroke:var(--e1);stroke-width:7;stroke-linecap:round}.component2{stroke:var(--e2);stroke-width:7;stroke-linecap:round}.net{stroke:var(--net);stroke-width:9;stroke-linecap:round}
    .legend{font-size:14px;font-weight:800}.legend1{fill:var(--e1)}.legend2{fill:var(--e2)}.legendNet{fill:var(--net)}
    @media(max-width:650px){body{padding:3px}.rph-app{padding:12px;border-radius:18px}.rph-choices{grid-template-columns:repeat(2,minmax(0,1fr))}.rph-scene,.rph-scene svg{height:300px;min-height:300px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation-duration:.001ms!important}}
  </style>
</head>
<body>
<main class="rph-app" aria-labelledby="title">
  <div class="rph-top"><div><p class="rph-kicker">Unit 6 · Lesson 2 · Part 1</p><h1 id="title">Multiple-Charge Vector Map</h1></div><button class="rph-reset" id="resetBtn" type="button">Reset</button></div>
  <div class="rph-progress"><span id="progressText">Map 1 of 4</span><div class="rph-dots" id="dots" aria-hidden="true"></div></div>
  <section class="rph-stage" aria-label="Multiple-charge electric field prediction">
    <div class="rph-scene">
      <svg viewBox="0 0 800 330" role="img" aria-labelledby="sceneTitle sceneDesc">
        <title id="sceneTitle">Two source charges and a point P</title><desc id="sceneDesc">Predict the net electric field direction at point P before the component vectors are revealed.</desc>
        <defs>
          <marker id="head1" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#d97706"></path></marker>
          <marker id="head2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#168aad"></path></marker>
          <marker id="headNet" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="#6f3fb2"></path></marker>
        </defs>
        <g id="guides"></g><g id="charges"></g><g id="point"></g>
        <g id="vectors" class="rph-hidden"><line id="v1" class="component1" marker-end="url(#head1)"></line><line id="v2" class="component2" marker-end="url(#head2)"></line><line id="vnet" class="net" marker-end="url(#headNet)"></line><text id="l1" class="vector-label legend1">E₁</text><text id="l2" class="vector-label legend2">E₂</text><text id="lnet" class="vector-label legendNet">Eₙₑₜ</text><text x="26" y="28" class="legend legend1">orange = field from q₁</text><text x="26" y="50" class="legend legend2">teal = field from q₂</text><text x="26" y="72" class="legend legendNet">purple = net field</text></g>
      </svg>
    </div>
    <div class="rph-question">
      <p class="rph-prompt">Which direction is the net electric field at point P?</p>
      <p class="rph-directions">Choose first. Component vectors appear after your prediction.</p>
      <div class="rph-choices" id="choices"></div>
      <p class="rph-feedback" id="feedback" role="status" aria-live="polite"></p>
      <div class="rph-actions"><button class="rph-main rph-hidden" id="nextBtn" type="button">Next map</button></div>
    </div>
  </section>
  <script>
    (()=>{
      const NS='http://www.w3.org/2000/svg';
      const scenarios=[
        {q1:{x:250,y:200,q:1},q2:{x:550,y:200,q:1},p:{x:400,y:80},answer:'Up',choices:['Up','Down','Left','Right'],explain:'The sideways components cancel and the upward components add.'},
        {q1:{x:250,y:160,q:1},q2:{x:550,y:160,q:-1},p:{x:400,y:160},answer:'Right',choices:['Right','Left','Up','Down'],explain:'The positive charge pushes right and the negative charge pulls right.'},
        {q1:{x:250,y:120,q:1},q2:{x:550,y:120,q:1},p:{x:400,y:270},answer:'Down',choices:['Down','Up','Left','Right'],explain:'The sideways components cancel and both vertical components point down.'},
        {q1:{x:250,y:220,q:1},q2:{x:550,y:80,q:-1},p:{x:400,y:150},answer:'Up-right',choices:['Up-right','Down-left','Up-left','Down-right'],explain:'Both fields point up and right, so the net field follows the same diagonal.'}
      ];
      let index=0,state='predict',completionSent=false;
      const chargesG=document.getElementById('charges'),guidesG=document.getElementById('guides'),pointG=document.getElementById('point'),vectorsG=document.getElementById('vectors');
      const v1=document.getElementById('v1'),v2=document.getElementById('v2'),vnet=document.getElementById('vnet'),l1=document.getElementById('l1'),l2=document.getElementById('l2'),lnet=document.getElementById('lnet');
      const choices=document.getElementById('choices'),feedback=document.getElementById('feedback'),nextBtn=document.getElementById('nextBtn'),resetBtn=document.getElementById('resetBtn'),progressText=document.getElementById('progressText'),dots=document.getElementById('dots');
      function el(name,attrs={}){const n=document.createElementNS(NS,name);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));return n}
      function shuffle(a){const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]]}return c}
      function drawCharge(obj,label){const g=el('g');g.appendChild(el('circle',{cx:obj.x,cy:obj.y,r:40,fill:obj.q>0?'#d64045':'#2457c5'}));const t=el('text',{x:obj.x,y:obj.y,class:'charge-text'});t.textContent=obj.q>0?'+':'−';g.appendChild(t);const c=el('text',{x:obj.x,y:obj.y+62,class:'charge-caption'});c.textContent=label;g.appendChild(c);return g}
      function fieldVector(charge,p){const dx=p.x-charge.x,dy=p.y-charge.y;const r2=dx*dx+dy*dy;const r=Math.sqrt(r2);const direction=charge.q>0?1:-1;return{x:direction*dx/r/r2,y:direction*dy/r/r2}}
      function scaled(vec,length){const m=Math.hypot(vec.x,vec.y)||1;return{x:vec.x/m*length,y:vec.y/m*length}}
      function setLine(line,p,vec){line.setAttribute('x1',p.x);line.setAttribute('y1',p.y);line.setAttribute('x2',p.x+vec.x);line.setAttribute('y2',p.y+vec.y)}
      function setLabel(label,p,vec,offsetX=8,offsetY=-8){label.setAttribute('x',p.x+vec.x*.62+offsetX);label.setAttribute('y',p.y+vec.y*.62+offsetY)}
      function drawScene(){const s=scenarios[index];chargesG.innerHTML='';guidesG.innerHTML='';pointG.innerHTML='';vectorsG.classList.add('rph-hidden');chargesG.appendChild(drawCharge(s.q1,'q₁'));chargesG.appendChild(drawCharge(s.q2,'q₂'));guidesG.appendChild(el('line',{x1:s.q1.x,y1:s.q1.y,x2:s.p.x,y2:s.p.y,class:'guide'}));guidesG.appendChild(el('line',{x1:s.q2.x,y1:s.q2.y,x2:s.p.x,y2:s.p.y,class:'guide'}));pointG.appendChild(el('circle',{cx:s.p.x,cy:s.p.y,r:12,fill:'#17263a'}));const pt=el('text',{x:s.p.x,y:s.p.y-19,class:'point-text'});pt.textContent='P';pointG.appendChild(pt)}
      function renderDots(){dots.innerHTML='';scenarios.forEach((_,i)=>{const d=document.createElement('span');d.className='rph-dot'+(i===index?' active':'');dots.appendChild(d)})}
      function render(){state='predict';progressText.textContent=`Map ${index+1} of ${scenarios.length}`;renderDots();drawScene();feedback.textContent='';nextBtn.classList.add('rph-hidden');choices.innerHTML='';shuffle(scenarios[index].choices).forEach(label=>{const b=document.createElement('button');b.type='button';b.className='rph-choice';b.textContent=label;b.addEventListener('click',()=>choose(label));choices.appendChild(b)})}
      function revealVectors(){const s=scenarios[index],f1=fieldVector(s.q1,s.p),f2=fieldVector(s.q2,s.p),sum={x:f1.x+f2.x,y:f1.y+f2.y};const a1=scaled(f1,82),a2=scaled(f2,82),an=scaled(sum,125);setLine(v1,s.p,a1);setLine(v2,s.p,a2);setLine(vnet,s.p,an);setLabel(l1,s.p,a1,8,-8);setLabel(l2,s.p,a2,-24,18);setLabel(lnet,s.p,an,10,-10);vectorsG.classList.remove('rph-hidden')}
      function choose(label){if(state!=='predict')return;state='reveal';[...choices.querySelectorAll('button')].forEach(b=>b.disabled=true);revealVectors();const s=scenarios[index];feedback.textContent=label===s.answer?`The net field points ${s.answer.toLowerCase()}. ${s.explain}`:`The net field points ${s.answer.toLowerCase()}, not ${label.toLowerCase()}. ${s.explain}`;nextBtn.textContent=index===scenarios.length-1?'Finish':'Next map';nextBtn.classList.remove('rph-hidden');nextBtn.focus()}
      function next(){if(state!=='reveal')return;if(index<scenarios.length-1){index++;render()}else{feedback.textContent='Complete. The net electric field is the vector sum of the fields from every source charge.';nextBtn.classList.add('rph-hidden');if(!completionSent){completionSent=true;window.parent.postMessage({type:'complete'},'*')}}}
      function reset(){index=0;completionSent=false;render()}
      nextBtn.addEventListener('click',next);resetBtn.addEventListener('click',reset);render();
    })();
  </script>
</main>
</body>
</html>
