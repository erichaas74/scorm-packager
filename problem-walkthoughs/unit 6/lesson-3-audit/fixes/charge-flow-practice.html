<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apply charge flow</title><style>body{font:18px/1.55 system-ui;margin:0;color:#172a40;background:#f3f6fa}main{max-width:850px;margin:auto;padding:28px}h1{font-size:1.65rem}section{background:white;border:1px solid #c8d5e5;border-radius:12px;padding:22px;margin:22px 0}button{display:block;width:100%;text-align:left;font:inherit;color:#173555;background:white;border:2px solid #a9bdd5;border-radius:7px;padding:12px;margin:10px 0;cursor:pointer}button:focus-visible{outline:3px solid #b45b00}button:disabled{cursor:default}button.correct{border-color:#24734a;background:#e9f7ef}.feedback{padding:12px;background:#edf3fa;min-height:1.4em}.progress{font-weight:700}</style><main><h1>Apply charge flow</h1><p>Work out each answer before choosing. Use the feedback to check your method, then retry if needed.</p><div id="questions"></div><p class="progress" id="progress" aria-live="polite"></p></main><script>const data=[["A charge magnitude of 8.0 C crosses a wire section in 5.0 s. What is the average current?", ["1.6 A", "0.625 A", "40 A"], 0, "I = Q/t = 8.0 C / 5.0 s = 1.6 A. Current measures charge per second."], ["How many electrons correspond to that 8.0 C charge magnitude? Use e = 1.60 × 10⁻¹⁹ C.", ["5.0 × 10¹⁹ electrons", "1.28 × 10⁻¹⁸ electrons", "5.0 × 10⁻¹⁹ electrons"], 0, "N = Q/e = 8.0 / (1.60 × 10⁻¹⁹) = 5.0 × 10¹⁹ electrons. Conventional current points opposite electron drift in a metal."]];let done=new Set();const host=document.getElementById('questions');function progress(){document.getElementById('progress').textContent=done.size+' of '+data.length+' correct';if(done.size===data.length)window.parent.postMessage({type:'complete'},'*');}data.forEach((q,i)=>{const s=document.createElement('section');const h=document.createElement('h2');h.style.fontSize='1.12rem';h.textContent=(i+1)+'. '+q[0];s.append(h);const f=document.createElement('p');f.className='feedback';f.setAttribute('aria-live','polite');f.textContent='Choose an answer.';q[1].map((text,j)=>({text,j})).sort((a,b)=>((a.j+i)%q[1].length)-((b.j+i)%q[1].length)).forEach(o=>{const b=document.createElement('button');b.textContent=o.text;b.onclick=()=>{if(o.j===q[2]){done.add(i);b.className='correct';f.textContent='Correct. '+q[3];s.querySelectorAll('button').forEach(x=>x.disabled=true);progress();}else f.textContent='Not yet. '+q[3]+' Choose the answer that matches this calculation.';};s.append(b);});s.append(f);host.append(s);});progress();</script></html>
