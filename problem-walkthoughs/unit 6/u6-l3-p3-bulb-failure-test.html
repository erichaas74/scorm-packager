<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bulb Failure in Series and Parallel Circuits</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#16263a;line-height:1.35}
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{padding:8px}
.app{width:min(100%,980px);margin:0 auto;background:#fff;border:5px solid #285f9f;border-radius:18px;box-shadow:0 8px 24px rgba(30,55,85,.15);overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:#eef5fb;border-bottom:1px solid #bfd2e5}
h1{font-size:clamp(1rem,2.5vw,1.35rem);margin:0;color:#173b63}
button{font:inherit;min-height:42px;min-width:44px;border:2px solid #285f9f;border-radius:10px;background:#fff;color:#173b63;padding:8px 14px;font-weight:700;cursor:pointer}
button:hover{background:#edf5fd}
button:focus-visible{outline:4px solid #f3b61f;outline-offset:2px}
button[disabled]{opacity:.55;cursor:not-allowed}
.stage{padding:14px;background:linear-gradient(#fbfdff,#f5f9fc)}
.scene{position:relative;border:2px solid #a9bfd4;border-radius:14px;background:#fff;min-height:360px;padding:10px;display:grid;grid-template-rows:1fr auto;gap:10px}
svg{width:100%;height:auto;max-height:410px;display:block}
.card{border:2px solid #8eabc5;border-radius:12px;background:#fff;padding:12px;box-shadow:0 4px 12px rgba(30,55,85,.08)}
.prompt{font-size:clamp(1rem,2.3vw,1.18rem);font-weight:700;margin:0 0 10px}
.setup{margin:0 0 10px;color:#334b65}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.feedback{min-height:2.7em;margin:10px 0 0;font-weight:700;color:#163b60}
.status{font-size:.9rem;color:#4b6179;margin:0}
.evidence{display:none;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}
.evidence.show{display:grid}
.metric{border:1px solid #a9bfd4;border-radius:9px;background:#f7fbff;padding:8px;text-align:center}
.metric strong{display:block;font-size:1.15rem;color:#153d66}
.hidden{display:none!important}
.glow{filter:drop-shadow(0 0 10px #f4c542) drop-shadow(0 0 18px #f4c542)}
.dim{opacity:.25}
.wire{stroke:#34495e;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.battery{fill:#eef5fb;stroke:#285f9f;stroke-width:3}
.bulb{fill:#f3f5f7;stroke:#5b6b7a;stroke-width:3}
.bulb.on{fill:#ffd861;stroke:#8a6700}
.label{font-size:22px;font-weight:700;fill:#173b63}
.small{font-size:18px;fill:#354b60}
.current{stroke:#e05a47;stroke-width:7;fill:none;stroke-linecap:round;marker-end:url(#arrow)}
.power{stroke:#8f4fd6;stroke-width:8;fill:none;stroke-linecap:round;marker-end:url(#arrow2)}
.meter{fill:#fff;stroke:#285f9f;stroke-width:4}
.meterText{font-size:21px;font-weight:700;fill:#173b63;text-anchor:middle;dominant-baseline:middle}
@media(max-width:620px){body{padding:3px}.app{border-width:4px;border-radius:13px}.topbar{padding:9px 10px}.stage{padding:8px}.scene{min-height:330px;padding:6px}.card{padding:9px}.choices{display:grid;grid-template-columns:1fr}button{width:100%}.topbar button{width:auto}.label{font-size:18px}.small{font-size:15px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head>
<body><main class="app"><header class="topbar"><h1>Bulb Failure Test</h1><button id="reset" type="button">Reset</button></header>
<section class="stage"><div class="scene" aria-label="Circuit bulb removal prediction">
<svg viewBox="0 0 900 420" role="img" aria-labelledby="bfTitle bfDesc"><title id="bfTitle">Circuit with removable bulb</title><desc id="bfDesc">A circuit changes between series and parallel arrangements. One bulb is marked for removal.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#e05a47"/></marker><marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8f4fd6"/></marker></defs>
<g id="seriesScene"><text x="450" y="38" class="label" text-anchor="middle">Series circuit</text><rect x="85" y="155" width="60" height="110" rx="8" class="battery"/><text x="115" y="292" class="small" text-anchor="middle">12 V</text><path d="M145 210 H230 V100 H760 V320 H230 V215 H145" class="wire"/><circle id="seriesKeep" cx="415" cy="100" r="42" class="bulb on glow"/><circle id="seriesRemove" cx="610" cy="100" r="42" class="bulb on glow"/><text x="610" y="106" class="small" text-anchor="middle">remove</text><path id="seriesGap" d="M565 100 H655" stroke="#fff" stroke-width="16" class="hidden"/><path id="seriesFlow" d="M170 210 H230 V100 H355" class="current hidden"/></g>
<g id="parallelScene" class="hidden"><text x="450" y="38" class="label" text-anchor="middle">Parallel circuit</text><rect x="85" y="155" width="60" height="110" rx="8" class="battery"/><text x="115" y="292" class="small" text-anchor="middle">12 V</text><path d="M145 210 H250 V75 H760 V335 H250 V215 H145" class="wire"/><path d="M250 205 H760" class="wire"/><circle id="parallelKeep" cx="520" cy="75" r="42" class="bulb on glow"/><circle id="parallelRemove" cx="520" cy="205" r="42" class="bulb on glow"/><text x="520" y="211" class="small" text-anchor="middle">remove</text><path id="parallelGap" d="M475 205 H565" stroke="#fff" stroke-width="16" class="hidden"/><path id="parallelFlow" d="M165 210 H250 V75 H455" class="current hidden"/></g>
</svg>
<div class="card" aria-live="polite"><p id="setup" class="setup">One glowing bulb will be removed from the circuit.</p><p id="prompt" class="prompt">Choose Start to predict what happens.</p><div id="choices" class="choices hidden"></div><div id="evidence" class="evidence"></div><p id="feedback" class="feedback"></p><button id="main" type="button">Start</button><p id="status" class="status">Circuit 0 of 2</p></div>
</div></section>
<script>
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let completionSent=false;
function completeOnce(){if(completionSent)return;completionSent=true;window.parent.postMessage({type:'complete'},'*');}

const scenarios=[
{type:'series',q:'What happens to the other bulb?',opts:[['alloff','It also turns off'],['stayon','It stays on'],['brighter','It becomes brighter']],correct:'alloff',feedback:'The other bulb turns off. Removing one bulb opens the only conducting path.',metrics:[['Closed paths before','1'],['Closed paths after','0'],['Current after','0 A']]},
{type:'parallel',q:'What happens to the bulb in the other branch?',opts:[['alloff','It also turns off'],['stayon','It stays on'],['dimmer','It becomes dimmer']],correct:'stayon',feedback:'The other bulb stays on. Its separate branch still forms a complete path across the battery.',metrics:[['Working branches','1'],['Branch voltage','12 V'],['Other-bulb current','2 A']]}
];
let index=-1,state='setup';const $=id=>document.getElementById(id);
function showScene(type){$('seriesScene').classList.toggle('hidden',type!=='series');$('parallelScene').classList.toggle('hidden',type!=='parallel');}
function resetScene(){$('seriesKeep').setAttribute('class','bulb on glow');$('seriesRemove').setAttribute('class','bulb on glow');$('parallelKeep').setAttribute('class','bulb on glow');$('parallelRemove').setAttribute('class','bulb on glow');['seriesGap','parallelGap','seriesFlow','parallelFlow'].forEach(id=>$(id).classList.add('hidden'));$('evidence').className='evidence';$('evidence').innerHTML='';$('feedback').textContent='';}
function startScenario(){resetScene();state='predict';const s=scenarios[index];showScene(s.type);$('prompt').textContent=s.q;$('choices').innerHTML='';shuffle(s.opts).forEach(([v,label])=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.addEventListener('click',()=>choose(v));$('choices').appendChild(b);});$('choices').classList.remove('hidden');$('main').classList.add('hidden');$('status').textContent=`Circuit ${index+1} of 2`;}
function choose(v){if(state!=='predict')return;state='reveal';$('choices').classList.add('hidden');const s=scenarios[index];if(s.type==='series'){$('seriesRemove').classList.add('dim');$('seriesKeep').classList.remove('on','glow');$('seriesGap').classList.remove('hidden');}else{$('parallelRemove').classList.add('dim');$('parallelGap').classList.remove('hidden');$('parallelFlow').classList.remove('hidden');}$('evidence').innerHTML=s.metrics.map(([a,b])=>`<div class="metric"><span>${a}</span><strong>${b}</strong></div>`).join('');$('evidence').classList.add('show');$('feedback').textContent=s.feedback;$('main').textContent=index===1?'Finish':'Next circuit';$('main').classList.remove('hidden');state='explain';}
$('main').addEventListener('click',()=>{if(state==='setup'){index=0;startScenario();}else if(state==='explain'){if(index===1){completeOnce();$('prompt').textContent='Failure comparison complete.';$('main').textContent='Replay';state='done';}else{index++;startScenario();}}else if(state==='done'){index=0;startScenario();}});
$('reset').addEventListener('click',()=>{index=-1;state='setup';resetScene();showScene('series');$('prompt').textContent='Choose Start to predict what happens.';$('choices').classList.add('hidden');$('main').textContent='Start';$('main').classList.remove('hidden');$('status').textContent='Circuit 0 of 2';});
</script></main></body></html>
