<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Electromagnetic Crane Design</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#16283b;--blue:#285f9f;--ink:#16283b;--muted:#5c6f82;--panel:#f5f8fb;--line:#b9c8d8;--good:#176b43;--warn:#8a4f00;--red:#a22b2b}
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{padding:8px}
.app{width:min(980px,100%);margin:0 auto;border:5px solid #285f9f;border-radius:18px;background:#fff;overflow:hidden;box-shadow:0 8px 24px rgba(23,48,76,.12)}
.app header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);background:#f8fbff}
.app h1{font-size:clamp(1.05rem,2.4vw,1.45rem);margin:0}
.app button,.app select,.app input{font:inherit}
.app button{min-height:44px;border:2px solid var(--blue);border-radius:10px;background:#fff;color:var(--blue);font-weight:700;padding:8px 14px;cursor:pointer}
.app button:hover{background:#edf5ff}.app button:focus-visible,.app select:focus-visible,.app input:focus-visible{outline:4px solid #f0b429;outline-offset:2px}
.app button.primary{background:var(--blue);color:#fff}.app button.primary:hover{background:#1f4e83}.app button:disabled{opacity:.48;cursor:not-allowed}
.stage{min-height:420px;padding:18px;background:linear-gradient(#f7fbff,#eef5fb);display:grid;place-items:center;position:relative}
.stage svg{width:100%;height:auto;max-height:430px;display:block}
.card{margin:0 18px 18px;border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff}
.prompt{font-size:1.08rem;font-weight:700;margin:0 0 12px}.subtle{color:var(--muted);margin:4px 0 12px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.choices button{width:100%}
.feedback{min-height:50px;margin:12px 0 0;font-weight:700}.feedback.good{color:var(--good)}.feedback.bad{color:var(--red)}
.status-row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.pill{border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:#fff;font-weight:700}.hidden{display:none!important}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:10px 0}.control{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel)}.control label{display:block;font-weight:700;margin-bottom:7px}.control output{display:block;font-weight:700;margin-top:7px;color:var(--blue)}
.meter{height:18px;border:1px solid #8ca0b5;border-radius:999px;background:#e9eef3;overflow:hidden}.meter>span{display:block;height:100%;width:0;background:#5f8fbd;transition:width .5s ease}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.9rem;color:var(--muted)}.legend span{display:inline-flex;gap:6px;align-items:center}.swatch{width:14px;height:14px;border-radius:3px;border:1px solid #52677d}
.progress{font-weight:700;color:var(--muted)}
@media(max-width:620px){body{padding:3px}.app{border-width:5px}.app header{padding:10px 12px}.stage{min-height:330px;padding:10px}.card{margin:0 10px 10px;padding:12px}.choices{grid-template-columns:1fr}.controls{grid-template-columns:1fr}.app button{min-height:48px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}

.crane-arm{stroke:#52677d;stroke-width:16;stroke-linecap:round}.cable{stroke:#26384c;stroke-width:5}.coil{fill:#c97827;stroke:#7d4310;stroke-width:3}.core{fill:#79899b;stroke:#26384c;stroke-width:3}.load{fill:#bcc8d4;stroke:#52677d;stroke-width:3}.field{fill:none;stroke:#2d7cb8;stroke-width:3;stroke-dasharray:7 5;opacity:0}.active .field{opacity:1;animation:pulse 1s infinite alternate}.lifted .load-group{transform:translateY(-58px)}.load-group{transition:transform .8s ease}@keyframes pulse{to{stroke-width:5;opacity:.45}}
</style></head><body><main class="app" id="app"><header><h1>Electromagnetic Crane Design</h1><button id="reset">Reset</button></header>
<section class="stage" aria-label="Electromagnetic crane lifting a steel load"><svg viewBox="0 0 900 420" role="img" aria-labelledby="craneTitle craneDesc"><title id="craneTitle">Electromagnetic crane</title><desc id="craneDesc">A crane suspends a copper coil and iron core above a steel load. Field rings appear only after a test.</desc><line x1="110" y1="70" x2="610" y2="70" class="crane-arm"/><line x1="595" y1="70" x2="595" y2="210" class="cable"/><rect x="535" y="190" width="120" height="64" rx="18" class="coil"/><rect x="573" y="188" width="44" height="95" rx="8" class="core"/><g id="fieldRings"><ellipse cx="595" cy="248" rx="80" ry="30" class="field"/><ellipse cx="595" cy="257" rx="120" ry="52" class="field"/><ellipse cx="595" cy="270" rx="160" ry="75" class="field"/></g><g class="load-group"><rect x="490" y="305" width="210" height="70" rx="9" class="load"/><text x="595" y="347" text-anchor="middle" font-size="26" font-weight="700" fill="#26384c" id="loadText">Load</text></g><rect x="40" y="365" width="820" height="20" fill="#75889d"/></svg></section>
<section class="card" aria-live="polite"><div class="progress" id="progress">Round 1 of 4</div><p class="prompt" id="prompt">Choose the voltage that lifts the load without exceeding the current limit.</p><p class="subtle" id="limitText"></p><div class="controls" id="controls"></div><div class="status-row"><span class="pill" id="current">Current: ?</span><span class="pill" id="heat">Heating: ?</span><span class="pill" id="force">Lift strength: ?</span></div><div class="meter" aria-label="Lift strength meter"><span id="meterFill"></span></div><div class="choices" style="margin-top:12px"><button class="primary" id="test">Test design</button><button id="next" class="hidden">Next round</button></div><p class="feedback" id="feedback"></p></section>
<script>
(()=>{
const rounds=[
{label:'Battery voltage',options:[6,9,12,15],unit:'V',base:{turns:180,core:1.3,res:5},load:72,maxI:2.5,maxHeat:28,prompt:'Choose the voltage that lifts the load without exceeding the current limit.'},
{label:'Coil turns',options:[80,140,200,260],unit:'turns',base:{voltage:12,core:1.2,res:6},load:65,maxI:2.3,maxHeat:30,prompt:'Choose the coil turns that lift the load without overheating.'},
{label:'Core material',options:['Air','Steel','Soft iron'],unit:'',base:{voltage:9,turns:180,res:5},load:68,maxI:2.2,maxHeat:26,prompt:'Choose the core material that lifts the load safely.'},
{label:'Wire resistance',options:[3,5,7,9],unit:'Ω',base:{voltage:12,turns:210,core:1.45},load:70,maxI:2.6,maxHeat:34,prompt:'Choose resistance that balances lifting force and heating.'}
];
let idx=0,done=false,completed=false;const $=s=>document.querySelector(s);const controls=$('#controls');
function coreFactor(v){return v==='Air'?0.55:v==='Steel'?1.15:v==='Soft iron'?1.5:Number(v)}
function render(){const r=rounds[idx];$('#progress').textContent=`Round ${idx+1} of ${rounds.length}`;$('#prompt').textContent=r.prompt;$('#limitText').textContent=`Limits: current ≤ ${r.maxI.toFixed(1)} A; heating ≤ ${r.maxHeat} W. Required lift strength: ${r.load}.`;controls.innerHTML=`<div class="control"><label for="choice">${r.label}</label><select id="choice">${r.options.map(v=>`<option value="${v}">${v} ${r.unit}</option>`).join('')}</select><output id="choiceOut">Select, then test.</output></div>`;resetReadouts();$('#next').classList.add('hidden');$('#test').classList.remove('hidden');$('#feedback').textContent='';$('#feedback').className='feedback';$('#app').classList.remove('active','lifted');done=false;}
function resetReadouts(){$('#current').textContent='Current: ?';$('#heat').textContent='Heating: ?';$('#force').textContent='Lift strength: ?';$('#meterFill').style.width='0%'}
function evaluate(){if(done)return;done=true;const r=rounds[idx];const raw=$('#choice').value;const val=isNaN(Number(raw))?raw:Number(raw);const p={...r.base};if(r.label==='Battery voltage')p.voltage=val;if(r.label==='Coil turns')p.turns=val;if(r.label==='Core material')p.core=coreFactor(val);if(r.label==='Wire resistance')p.res=val;p.core=coreFactor(p.core);const I=p.voltage/p.res;const heat=I*I*p.res;const strength=(p.turns/10)*I*p.core;const safe=I<=r.maxI&&heat<=r.maxHeat;const lift=strength>=r.load&&safe;$('#app').classList.add('active');if(lift)$('#app').classList.add('lifted');$('#current').textContent=`Current: ${I.toFixed(2)} A`;$('#heat').textContent=`Heating: ${heat.toFixed(1)} W`;$('#force').textContent=`Lift strength: ${strength.toFixed(0)}`;$('#meterFill').style.width=Math.min(100,strength/r.load*75)+'%';$('#choiceOut').textContent=`Tested ${val} ${r.unit}.`;$('#feedback').textContent=lift?'The load lifts and both safety limits are met. More turns, current, and a magnetic core strengthen the electromagnet.':!safe?'The design violates a current or heating limit. Reduce current or increase resistance before increasing magnetic strength.':'The design is safe but too weak to lift the load. Increase turns, current, or core effectiveness.';$('#feedback').className='feedback '+(lift?'good':'bad');$('#test').classList.add('hidden');$('#next').classList.remove('hidden');if(idx===rounds.length-1)$('#next').textContent='Finish';}
function next(){if(idx<rounds.length-1){idx++;render()}else{$('#feedback').textContent='Design review complete. Strong electromagnets require both magnetic strength and safe electrical operation.';$('#feedback').className='feedback good';$('#next').classList.add('hidden');complete();}}
function complete(){if(completed)return;completed=true;window.parent.postMessage({type:'complete'},'*')}
$('#test').addEventListener('click',evaluate);$('#next').addEventListener('click',next);$('#reset').addEventListener('click',()=>{idx=0;completed=false;render()});render();
})();
</script></main></body></html>
