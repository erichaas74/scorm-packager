<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elastic Momentum Prediction Playground</title>
  <style>
    :root {
      --navy: #172033;
      --bg: #eef2f7;
      --canvas-bg: #f8fbff;
      --line: #d7deea;
      --muted: #64748b;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --green: #16a34a;
      --red: #dc2626;
      --orange: #d97706;
      --panel: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--navy);
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .game {
      width: min(1120px, 100%);
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }

    .top {
      background: var(--navy);
      color: white;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-weight: bold;
      align-items: center;
    }

    .top-title {
      font-size: 18px;
      flex: 1;
      min-width: 220px;
    }

    .scenario-title {
      flex: 1.2;
      text-align: center;
      font-size: 17px;
      letter-spacing: 0.01em;
      color: #e2e8f0;
      min-width: 240px;
    }

    .top-info {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 14px;
      opacity: 0.95;
      justify-content: flex-end;
      flex: 1;
      min-width: 220px;
    }

    .top-info button {
      padding: 7px 10px;
      font-size: 12px;
      border-radius: 8px;
    }

    #mainCanvas {
      display: block;
      width: 100%;
      height: auto;
      background: var(--canvas-bg);
      border-bottom: 1px solid var(--line);
    }

    .canvas-stage {
      position: relative;
    }

    .canvas-start {
      position: absolute;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      z-index: 10;
      opacity: 1;
      background: var(--blue);
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.24);
    }

    .panel {
      padding: 14px 16px 18px;
    }

    #message {
      display: none;
      font-size: 16px;
      margin-bottom: 10px;
      min-height: 24px;
      font-weight: 700;
      padding: 9px 11px;
      border-radius: 8px;
      border: 1px solid transparent;
    }

    #message.good {
      color: #166534;
      background: #dcfce7;
      border-color: #86efac;
    }

    #message.revise {
      color: #991b1b;
      background: #fee2e2;
      border-color: #fca5a5;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      width: 100%;
      margin-bottom: 12px;
      transition: opacity 0.25s ease;
    }

    .choices.hidden {
      opacity: 0;
      pointer-events: none;
      height: 0;
      overflow: hidden;
      margin: 0;
    }

    .choice-card {
      border-radius: 12px;
      border: 3px solid #cbd5e1;
      background: white;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease, border-width 0.12s ease;
    }

    .choice-card:hover {
      transform: translateY(-2px);
    }

    .choice-header {
      padding: 6px 8px;
      font-weight: bold;
      color: white;
      font-size: 13px;
    }

    .choice-a .choice-header,
    .choice-b .choice-header,
    .choice-c .choice-header {
      background: #64748b;
    }

    .choice-canvas {
      display: block;
      width: 100%;
      height: auto;
      background: var(--canvas-bg);
    }

    .choice-label {
      padding: 5px 6px 7px;
      font-size: 12px;
      color: #334155;
      text-align: center;
      font-weight: bold;
      min-height: 27px;
      border-top: 1px solid #e2e8f0;
    }

    .correct {
      border-width: 5px !important;
      border-color: var(--green) !important;
      box-shadow: 0 0 0 4px rgba(22,163,74,0.2);
    }

    .wrong {
      border-width: 5px !important;
      border-color: var(--red) !important;
      box-shadow: 0 0 0 4px rgba(220,38,38,0.2);
    }

    .disabled {
      pointer-events: none;
      opacity: 0.92;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 9px 12px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      background: var(--blue);
      color: white;
    }

    button:hover {
      background: var(--blue-dark);
    }

    button.secondary {
      background: #e2e8f0;
      color: #172033;
    }

    button.secondary:hover {
      background: #cbd5e1;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .result-panel {
      height: 145px;
      padding: 10px 16px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #fff;
      overflow: hidden;
      transition: opacity 0.2s ease;
    }

    .result-panel.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .equation-stack {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .equation-card {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 12px;
      background: #f8fafc;
    }

    .equation-card strong {
      display: block;
      margin-bottom: 6px;
      color: #172033;
      font-size: 13px;
    }

    .equation-lines {
      color: #475569;
      line-height: 1.55;
      font-size: 15px;
    }

    .equation-line {
      min-height: 24px;
    }

    .equation-symbol {
      color: #172033;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      font-style: italic;
      font-weight: 700;
    }

    .equation-solved {
      color: #0f766e;
      font-weight: 800;
      font-size: 16px;
    }

    .equation-note {
      margin-top: 10px;
      color: #475569;
      font-size: 13px;
      line-height: 1.4;
    }
#equations-container {
            height: 122px;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #ffffff;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 12px 8px;
        }
        
        #equations-wrapper {
            transform-origin: center center;
            transition: transform 0.2s ease-out;
        }
        .eq-row {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.45rem;
            font-weight: bold;
            margin-bottom: 0;
            position: relative;
            height: 2.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Fixed widths prevent layout from shifting when text size changes */
        .cell {
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease-in-out, color 0.3s;
            white-space: nowrap;
            color: #111827;
        }
        .cell-m { width: 64px; }
        .cell-total { width: 128px; }
        .cell-v { width: 76px; }
        .cell-op { width: 32px; color: #111827; }
        .cell-coef { width: 48px; }
        
        .result-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 2rem;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease-in-out;
            background: rgba(255, 255, 255, 0.92);
        }

        /* --- Translated Tailwind Classes --- */
        .section-title {
            color: #111827;
            font-weight: 500;
            text-align: center;
            margin-bottom: 0.35rem;
            text-transform: none;
            letter-spacing: 0;
            font-size: 0.95rem;
        }
        .mt-4 { margin-top: 1rem; }
        .equation-section.hidden {
            display: none;
        }
        .eq-grid {
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }
        .text-cyan { color: #111827; }
        .text-rose { color: #111827; }
        .text-green { color: #15803d; }
        .text-red { color: #b91c1c; }
    @media (max-width: 780px) {
      body {
        padding: 10px;
      }

      .choices {
        grid-template-columns: 1fr;
      }

    }

    @media (max-width: 520px) {
      #equations-wrapper {
        transform: scale(0.48);
      }
    }
  </style>
</head>
<body>
  <div class="game">
    <div class="top">
      <div class="top-title">Elastic Collision Momentum</div>
      <div class="scenario-title" id="scenarioTitle"></div>
      <div class="top-info">
        <button id="resetBtn" class="secondary">Reset Scenario</button>
        <button id="nextBtn" class="secondary">Next Scenario 1 / 6</button>
      </div>
    </div>

    <div class="canvas-stage">
      <canvas id="mainCanvas" width="1100" height="294"></canvas>
      <button id="startBtn" class="canvas-start">Start Collision</button>
    </div>

      <div id="resultPanel" class="result-panel hidden">
        <!-- Lock-Grid Equations Area -->
            <div id="equations-container">
                <div id="equations-wrapper">
                    <div id="momentum-section" class="equation-section">
                      <!-- Momentum Section -->
                      <div class="section-title" id="equationTitle">Total Momentum Before = Total Momentum After</div>
                      <div class="eq-row">
                          <div id="mom-grid" class="eq-grid text-cyan">
                              <div id="m_m1" class="cell cell-m">m<sub>A</sub></div>
                              <div id="m_v1" class="cell cell-v"><i>v</i><sub>Ai</sub></div>
                              <div id="m_op1" class="cell cell-op">+</div>
                              <div id="m_m2" class="cell cell-m text-rose">m<sub>B</sub></div>
                              <div id="m_v2" class="cell cell-v text-rose"><i>v</i><sub>Bi</sub></div>
                              <div id="m_equals" class="cell cell-op">=</div>
                              <div id="m_m3" class="cell cell-m">m<sub>A</sub></div>
                              <div id="m_v3" class="cell cell-v"><i>v</i><sub>Af</sub></div>
                              <div id="m_op2" class="cell cell-op">+</div>
                              <div id="m_m4" class="cell cell-m text-rose">m<sub>B</sub></div>
                              <div id="m_v4" class="cell cell-v text-rose"><i>v</i><sub>Bf</sub></div>
                          </div>
                          <div id="mom-result" class="result-overlay text-green">
                          </div>
                      </div>
                    </div>

                </div>
            </div>
      </div>

    <div class="panel">
      <div id="message"></div>

      <div class="choices hidden" id="choices">
        <div class="choice-card choice-a" id="card0">
          <div class="choice-header">Choice A</div>
          <canvas class="choice-canvas" id="choiceCanvas0" width="340" height="150"></canvas>
          <div class="choice-label" id="choiceLabel0"></div>
        </div>

        <div class="choice-card choice-b" id="card1">
          <div class="choice-header">Choice B</div>
          <canvas class="choice-canvas" id="choiceCanvas1" width="340" height="150"></canvas>
          <div class="choice-label" id="choiceLabel1"></div>
        </div>

        <div class="choice-card choice-c" id="card2">
          <div class="choice-header">Choice C</div>
          <canvas class="choice-canvas" id="choiceCanvas2" width="340" height="150"></canvas>
          <div class="choice-label" id="choiceLabel2"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const mainCanvas = document.getElementById("mainCanvas");
    const ctx = mainCanvas.getContext("2d");

    const choiceCanvases = [
      document.getElementById("choiceCanvas0"),
      document.getElementById("choiceCanvas1"),
      document.getElementById("choiceCanvas2")
    ];
    const choiceCtxs = choiceCanvases.map(c => c.getContext("2d"));

    const cards = [
      document.getElementById("card0"),
      document.getElementById("card1"),
      document.getElementById("card2")
    ];
    const choiceLabels = [
      document.getElementById("choiceLabel0"),
      document.getElementById("choiceLabel1"),
      document.getElementById("choiceLabel2")
    ];

    const choicesEl = document.getElementById("choices");
    const message = document.getElementById("message");
    const scenarioTitle = document.getElementById("scenarioTitle");
    const startBtn = document.getElementById("startBtn");
    const resetBtn = document.getElementById("resetBtn");
    const nextBtn = document.getElementById("nextBtn");
    const resultPanel = document.getElementById("resultPanel");
    const equationCells = {
      m_m1: document.getElementById("m_m1"),
      m_v1: document.getElementById("m_v1"),
      m_m2: document.getElementById("m_m2"),
      m_v2: document.getElementById("m_v2"),
      m_m3: document.getElementById("m_m3"),
      m_v3: document.getElementById("m_v3"),
      m_m4: document.getElementById("m_m4"),
      m_v4: document.getElementById("m_v4")
    };
    const equationOps = {
      op1: document.getElementById("m_op1"),
      equals: document.getElementById("m_equals"),
      op2: document.getElementById("m_op2")
    };
    const momGrid = document.getElementById("mom-grid");
    const momResult = document.getElementById("mom-result");
    const momentumSection = document.getElementById("momentum-section");
    const equationTitle = document.getElementById("equationTitle");

    const scenarios = [
      {
        title: "Equal Mass Transfer",
        description: "Cart A moves right into identical Cart B at rest.",
        m1: 1, u1: 3, m2: 1, u2: 0,
        askFor: "B",
        colors: { aFill: "#93c5fd", aStroke: "#2563eb", bFill: "#fdba74", bStroke: "#d97706" },
        explanation: "Cart A stops after impact, so momentum predicts Cart B's final velocity."
      },
      {
        title: "Equal Mass Head-On",
        description: "Two identical carts move toward each other with equal speeds.",
        m1: 1, u1: 2, m2: 1, u2: -2,
        askFor: "B",
        colors: { aFill: "#a7f3d0", aStroke: "#059669", bFill: "#f0abfc", bStroke: "#c026d3" },
        explanation: "Cart A reverses direction after impact, so momentum predicts Cart B's final velocity."
      },
      {
        title: "Light Cart Hits Heavy Cart",
        description: "A light Cart A moves right into a heavier Cart B at rest.",
        m1: 1, u1: 4, m2: 4, u2: 0,
        askFor: "B",
        colors: { aFill: "#bfdbfe", aStroke: "#1d4ed8", bFill: "#fecaca", bStroke: "#dc2626" },
        explanation: "Cart A rebounds left after impact, so momentum predicts the heavy cart's final velocity."
      },
      {
        title: "Heavy Cart Hits Light Cart",
        description: "A heavy Cart A moves right into a lighter Cart B at rest.",
        m1: 4, u1: 3, m2: 1, u2: 0,
        askFor: "B",
        colors: { aFill: "#ddd6fe", aStroke: "#7c3aed", bFill: "#fde68a", bStroke: "#ca8a04" },
        explanation: "Cart A keeps moving right after impact, so momentum predicts the light cart's final velocity."
      },
      {
        title: "Rear-End Collision",
        description: "Cart A is behind Cart B and moving faster in the same direction.",
        m1: 2, u1: 4, m2: 1, u2: 1,
        askFor: "B",
        colors: { aFill: "#99f6e4", aStroke: "#0f766e", bFill: "#fed7aa", bStroke: "#ea580c" },
        explanation: "Cart A slows after impact, so momentum predicts Cart B's faster final velocity."
      },
      {
        title: "Unequal Head-On Collision",
        description: "A light Cart A moves right into a heavier Cart B moving left slowly.",
        m1: 1, u1: 3, m2: 3, u2: -1,
        askFor: "B",
        colors: { aFill: "#c4b5fd", aStroke: "#6d28d9", bFill: "#bbf7d0", bStroke: "#16a34a" },
        explanation: "Cart A rebounds left after impact, so momentum predicts Cart B's final velocity."
      }
    ];

    let scenarioIndex = 0;
    let current = null;
    let options = [];
    let momentumOptions = [];
    let selected = -1;
    let stage = "setup"; // setup, movingToCollision, momentumChoice, choose, result
    let stageStart = 0;
    let clock = 0;
    let collisionData = null;
    let equationTimers = [];
    let advanceTimer = null;
    let evaluatingChoice = false;

    const trackY = 196;
    const cartH = 72;
    const beforeScale = 58;
    const afterScale = 56;
    const choiceScale = 26;

    function elasticFinal(m1, u1, m2, u2) {
      const v1 = ((m1 - m2) / (m1 + m2)) * u1 + ((2 * m2) / (m1 + m2)) * u2;
      const v2 = ((2 * m1) / (m1 + m2)) * u1 + ((m2 - m1) / (m1 + m2)) * u2;
      return { v1, v2 };
    }

    function momentum(m1, v1, m2, v2) {
      return m1 * v1 + m2 * v2;
    }

    function targetCart(s) {
      return s.askFor === "A" ? "A" : "B";
    }

    function givenCart(s) {
      return targetCart(s) === "A" ? "B" : "A";
    }

    function cartFinalVelocity(final, cart) {
      return cart === "A" ? final.v1 : final.v2;
    }

    function finalMomentum(s, option) {
      return momentum(s.m1, option.v1, s.m2, option.v2);
    }

    function fmt(value, digits = 2) {
      const fixed = Math.abs(value) < 0.005 ? 0 : value;
      return fixed.toFixed(digits);
    }

    function cartWidth(mass) {
      return 92 + mass * 16;
    }

    function directionWord(v) {
      if (Math.abs(v) < 0.05) return "stopped";
      return v > 0 ? "right" : "left";
    }

    function cartStyle(cart, s = current) {
      const colors = s && s.colors ? s.colors : scenarios[0].colors;
      return cart === "A"
        ? { fill: colors.aFill, stroke: colors.aStroke }
        : { fill: colors.bFill, stroke: colors.bStroke };
    }

    function cartStroke(cart, s = current) {
      return cartStyle(cart, s).stroke;
    }

    function velocityLabelHtml(cart, phase) {
      return `<i>v</i><sub>${cart}${phase}</sub>`;
    }

    function velocityLabel(cart, phase, value, prefix = "") {
      return {
        kind: "velocity",
        prefix,
        cart,
        phase,
        value
      };
    }

    function loadScenario(index) {
      if (advanceTimer) {
        window.clearTimeout(advanceTimer);
        advanceTimer = null;
      }
      scenarioIndex = (index + scenarios.length) % scenarios.length;
      current = scenarios[scenarioIndex];
      options = buildOptions(current);
      momentumOptions = buildMomentumOptions(current);
      selected = -1;
      evaluatingChoice = false;
      stage = "setup";
      stageStart = clock;
      collisionData = getCollisionData(current);

      nextBtn.textContent = "Next Scenario " + (scenarioIndex + 1) + " / " + scenarios.length;
      scenarioTitle.textContent = current.title;
      message.textContent = "";
      message.className = "";
      message.style.display = "none";
      choicesEl.classList.add("hidden");
      startBtn.disabled = false;
      resultPanel.classList.add("hidden");
      resetCards();
      resetEquationGrid();
      updateChoiceLabels(false);
      drawMain();
    }

    function buildOptions(s) {
      const final = elasticFinal(s.m1, s.u1, s.m2, s.u2);
      const target = targetCart(s);
      const correct = cartFinalVelocity(final, target);
      const spread = Math.max(0.75, Math.abs(correct) * 0.25 + 0.55);

      const candidates = [
        makeFinalVelocityChoice(s, final, correct, "correct", "Momentum result", true),
        makeFinalVelocityChoice(s, final, correct + spread, "tooFast", "Too much final momentum", false),
        makeFinalVelocityChoice(s, final, correct - spread, "tooSlow", "Too little final momentum", false),
        makeFinalVelocityChoice(s, final, correct + spread * 1.65, "muchTooFast", "Too much final momentum", false),
        makeFinalVelocityChoice(s, final, correct - spread * 1.65, "muchTooSlow", "Too little final momentum", false)
      ];

      const picked = [candidates[0]];
      for (const candidate of candidates.slice(1)) {
        if (picked.length >= 3) break;
        if (isDistinct(candidate, picked)) picked.push(candidate);
      }

      return shuffle(picked);
    }

    function buildMomentumOptions(s) {
      const correct = momentum(s.m1, s.u1, s.m2, s.u2);
      const candidates = [
        makeMomentumChoice(correct, "correct", true),
        makeMomentumChoice(momentum(s.m1, -s.u1, s.m2, s.u2), "wrongSign1", false),
        makeMomentumChoice(momentum(s.m1, s.u1, s.m2, -s.u2), "wrongSign2", false),
        makeMomentumChoice(momentum(s.m1, -s.u1, s.m2, -s.u2), "wrongSignBoth", false)
      ];

      const picked = [candidates[0]];
      for (const candidate of candidates.slice(1)) {
        if (picked.length >= 3) break;
        if (isDistinctMomentum(candidate, picked)) picked.push(candidate);
      }

      const fallbackStep = Math.max(1, Math.abs(s.m1 * s.u1), Math.abs(s.m2 * s.u2));
      const fallbackValues = [
        -correct,
        correct + fallbackStep,
        correct - fallbackStep,
        correct + 2 * fallbackStep,
        correct - 2 * fallbackStep
      ];

      for (const value of fallbackValues) {
        if (picked.length >= 3) break;
        const candidate = makeMomentumChoice(value, "signErrorFallback", false);
        if (isDistinctMomentum(candidate, picked)) picked.push(candidate);
      }

      return shuffle(picked);
    }

    function makeMomentumChoice(value, type, correct) {
      return {
        type,
        value,
        correct
      };
    }

    function isDistinctMomentum(candidate, picked) {
      return picked.every(item => Math.abs(item.value - candidate.value) > 0.05);
    }

    function makeFinalVelocityChoice(s, final, targetVelocity, type, label, correct) {
      const target = targetCart(s);
      const given = givenCart(s);
      const givenVelocity = cartFinalVelocity(final, given);
      const v1 = target === "A" ? targetVelocity : givenVelocity;
      const v2 = target === "B" ? targetVelocity : givenVelocity;

      return {
        type,
        label,
        target,
        given,
        targetVelocity,
        givenVelocity,
        v1,
        v2,
        correct
      };
    }

    function isDistinct(candidate, picked) {
      return picked.every(item => {
        return Math.abs(item.targetVelocity - candidate.targetVelocity) > 0.35;
      });
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function getCollisionData(s) {
      const w1 = cartWidth(s.m1);
      const w2 = cartWidth(s.m2);
      const collisionPoint = mainCanvas.width / 2;
      const duration = 1.75;
      const collisionX1 = collisionPoint - w1 / 2;
      const collisionX2 = collisionPoint + w2 / 2;
      const startX1 = collisionX1 - s.u1 * beforeScale * duration;
      const startX2 = collisionX2 - s.u2 * beforeScale * duration;

      return {
        w1, w2,
        startX1, startX2,
        collisionX1, collisionX2,
        collisionPoint,
        duration
      };
    }

    function startToCollision() {
      if (stage !== "setup") return;
      stage = "movingToCollision";
      stageStart = clock;
      startBtn.disabled = true;
      message.textContent = "";
    }

    function resetScenario() {
      loadScenario(scenarioIndex);
    }

    function nextScenario() {
      loadScenario(scenarioIndex + 1);
    }

    function resetCards() {
      cards.forEach(card => {
        card.classList.remove("correct", "wrong", "disabled");
      });
    }

    function updateChoiceLabels(showLabels) {
      for (let i = 0; i < 3; i++) {
        if (!options[i]) {
          choiceLabels[i].textContent = "";
          continue;
        }
        choiceLabels[i].innerHTML = `Predict ${velocityLabelHtml(options[i].target, "f")} = ${fmt(options[i].targetVelocity)} m/s`;
      }
    }

    function updateMomentumChoiceLabels() {
      for (let i = 0; i < 3; i++) {
        if (!momentumOptions[i]) {
          choiceLabels[i].textContent = "";
          continue;
        }
        choiceLabels[i].innerHTML = `P<sub>total</sub> = ${fmt(momentumOptions[i].value)} kg&middot;m/s`;
      }
    }

    function chooseCard(index) {
      if (stage === "momentumChoice") {
        chooseMomentumCard(index);
        return;
      }

      if (stage !== "choose" || evaluatingChoice) return;

      selected = index;
      evaluatingChoice = true;
      const option = options[index];

      cards.forEach((card) => {
        card.classList.add("disabled");
      });

      updateChoiceLabels(true);
      showEquationMath(option, index);
      resultPanel.classList.remove("hidden");
      message.textContent = "";
    }

    function showBeforeMomentumStep() {
      const s = current;

      resetEquationGrid();
      resultPanel.classList.remove("hidden");
      equationTitle.textContent = "Total Momentum Before Collision";
      momentumSection.classList.remove("hidden");
      momGrid.style.opacity = "1";
      momResult.style.opacity = "0";
      message.textContent = "";
      choicesEl.classList.remove("hidden");
      updateMomentumChoiceLabels();

      queueEquationStep(() => {
        equationCells.m_m1.innerHTML = `(${fmt(s.m1, 0)}`;
        equationCells.m_v1.innerHTML = `${fmt(s.u1)})`;
        equationCells.m_m2.innerHTML = `(${fmt(s.m2, 0)}`;
        equationCells.m_v2.innerHTML = `${fmt(s.u2)})`;
        equationCells.m_m3.innerHTML = "P<sub>total</sub>";
        equationCells.m_v3.innerHTML = "?";
        equationCells.m_m4.innerHTML = "";
        equationCells.m_v4.innerHTML = "";
        equationOps.op2.style.visibility = "hidden";
      }, 200);
    }

    function chooseMomentumCard(index) {
      if (evaluatingChoice || !momentumOptions[index]) return;

      selected = index;
      evaluatingChoice = true;
      const option = momentumOptions[index];
      const correctIndex = momentumOptions.findIndex(item => item.correct);

      cards.forEach(card => card.classList.add("disabled"));
      updateMomentumChoiceLabels();

      queueEquationStep(() => {
        equationCells.m_v3.innerHTML = fmt(option.value);
        momResult.className = `result-overlay ${option.correct ? "text-green" : "text-red"}`;
        momResult.textContent = option.correct
          ? `P total = ${fmt(option.value)} kg·m/s`
          : `P total is ${fmt(momentumOptions[correctIndex].value)} kg·m/s`;
        momResult.style.opacity = "1";

        if (option.correct) {
          cards[index].classList.add("correct");
        } else {
          cards[index].classList.add("wrong");
          if (correctIndex !== -1) cards[correctIndex].classList.add("correct");
        }
      }, 250);

      queueEquationStep(() => {
        selected = -1;
        evaluatingChoice = false;
        resetCards();
        updateChoiceLabels(true);
        stage = "choose";
        stageStart = clock;
        showFinalVelocityEquation(null);
      }, 1850);
    }

    function showFinalVelocityEquation(option) {
      const s = current;
      const final = elasticFinal(s.m1, s.u1, s.m2, s.u2);
      const given = givenCart(s);
      const target = targetCart(s);
      const givenVelocity = cartFinalVelocity(final, given);
      const targetValue = option ? fmt(option.targetVelocity) : "?";

      resetEquationGrid();
      resultPanel.classList.remove("hidden");
      equationTitle.textContent = "Total Momentum Before = Total Momentum After";
      momentumSection.classList.remove("hidden");
      momGrid.style.opacity = "1";
      momResult.style.opacity = "0";

      equationCells.m_m1.innerHTML = `(${fmt(s.m1, 0)}`;
      equationCells.m_v1.innerHTML = `${fmt(s.u1)})`;
      equationCells.m_m2.innerHTML = `(${fmt(s.m2, 0)}`;
      equationCells.m_v2.innerHTML = `${fmt(s.u2)})`;
      equationCells.m_m3.innerHTML = `(${fmt(s.m1, 0)}`;
      equationCells.m_v3.innerHTML = `${target === "A" ? targetValue : fmt(givenVelocity)})`;
      equationCells.m_m4.innerHTML = `(${fmt(s.m2, 0)}`;
      equationCells.m_v4.innerHTML = `${target === "B" ? targetValue : fmt(givenVelocity)})`;
    }

    function showEquationMath(option, index) {
      const s = current;
      const pBefore = momentum(s.m1, s.u1, s.m2, s.u2);
      const pAfter = finalMomentum(s, option);
      const momentumConserved = nearlyEqual(pBefore, pAfter);

      queueEquationStep(() => {
        showFinalVelocityEquation(option);
      }, 250);

      queueEquationStep(() => {
        momResult.className = `result-overlay ${momentumConserved ? "text-green" : "text-red"}`;
        momResult.textContent = `${fmt(pBefore)} = ${fmt(pAfter)} ${momentumConserved ? "conserved" : "not conserved"}`;
        momResult.style.opacity = "1";
      }, 1150);

      queueEquationStep(() => {
        evaluatingChoice = false;
        const correctIndex = options.findIndex(item => item.correct);
        if (momentumConserved) {
          cards[index].classList.add("correct");
        } else {
          cards[index].classList.add("wrong");
          if (correctIndex !== -1) cards[correctIndex].classList.add("correct");
        }
        showFeedback(momentumConserved);
        stage = "result";
        stageStart = clock;
        scheduleNextScenario();
      }, 2450);
    }

    function showFeedback(isCorrect) {
      const nextIndex = (scenarioIndex + 1) % scenarios.length;
      const nextTitle = scenarios[nextIndex].title;
      message.style.display = "block";
      message.className = isCorrect ? "good" : "revise";
      message.textContent = isCorrect
        ? `Correct. Loading ${nextTitle} next...`
        : `Not quite. The conserved-momentum choice is highlighted. Loading ${nextTitle} next...`;
    }

    function scheduleNextScenario() {
      if (advanceTimer) window.clearTimeout(advanceTimer);
      advanceTimer = window.setTimeout(() => {
        advanceTimer = null;
        loadScenario(scenarioIndex + 1);
      }, 2600);
    }

    function queueEquationStep(callback, delay) {
      equationTimers.push(window.setTimeout(callback, delay));
    }

    function nearlyEqual(a, b) {
      return Math.abs(a - b) < 0.05;
    }

    function resetEquationGrid() {
      const symbols = {
        m_m1: "m<sub>A</sub>",
        m_v1: "<i>v</i><sub>Ai</sub>",
        m_m2: "m<sub>B</sub>",
        m_v2: "<i>v</i><sub>Bi</sub>",
        m_m3: "m<sub>A</sub>",
        m_v3: "<i>v</i><sub>Af</sub>",
        m_m4: "m<sub>B</sub>",
        m_v4: "<i>v</i><sub>Bf</sub>"
      };

      for (const [id, value] of Object.entries(symbols)) {
        equationCells[id].innerHTML = value;
      }
      equationOps.op1.style.visibility = "visible";
      equationOps.equals.style.visibility = "visible";
      equationOps.op2.style.visibility = "visible";
      equationTimers.forEach(timer => window.clearTimeout(timer));
      equationTimers = [];
      momResult.textContent = "";
      momResult.style.opacity = "0";
      momGrid.style.opacity = "1";
      equationTitle.textContent = "Total Momentum Before = Total Momentum After";
      momentumSection.classList.remove("hidden");
    }

    function drawMain() {
      drawMainBackground();

      if (!current) return;

      const s = current;
      const d = collisionData;
      const final = elasticFinal(s.m1, s.u1, s.m2, s.u2);

      drawScenarioText(s);

      let x1 = d.startX1;
      let x2 = d.startX2;
      let v1 = s.u1;
      let v2 = s.u2;
      let resultPhase = "before";
      let showCollisionBurst = false;

      if (stage === "movingToCollision") {
        const t = Math.min((clock - stageStart) / d.duration, 1);
        const eased = smoothStep(t);
        x1 = lerp(d.startX1, d.collisionX1, eased);
        x2 = lerp(d.startX2, d.collisionX2, eased);

        if (t >= 1) {
          stage = "momentumChoice";
          stageStart = clock;
          showBeforeMomentumStep();
        }
      }

      if (stage === "momentumChoice" || stage === "choose") {
        x1 = d.collisionX1;
        x2 = d.collisionX2;
        v1 = s.u1;
        v2 = s.u2;
        showCollisionBurst = true;
      }

      if (stage === "result") {
        const afterDuration = 2.6;
        const restartPause = 0.55;
        const cycle = (clock - stageStart) % (d.duration + afterDuration + restartPause);

        if (cycle < d.duration) {
          const t = smoothStep(cycle / d.duration);
          x1 = lerp(d.startX1, d.collisionX1, t);
          x2 = lerp(d.startX2, d.collisionX2, t);
          v1 = s.u1;
          v2 = s.u2;
          resultPhase = "before";
        } else {
          const t = Math.min(cycle - d.duration, afterDuration);
          x1 = d.collisionX1 + final.v1 * afterScale * t;
          x2 = d.collisionX2 + final.v2 * afterScale * t;
          v1 = final.v1;
          v2 = final.v2;
          resultPhase = "after";
          drawCollisionMarker();
          drawAfterGhosts(final);
        }
      }

      const styleA = cartStyle("A", s);
      const styleB = cartStyle("B", s);
      if (stage === "momentumChoice" || stage === "choose" || (stage === "result" && resultPhase === "after")) {
        drawStartingGhosts(s, d, styleA, styleB);
      }
      drawCart(ctx, x1, trackY - cartH / 2, d.w1, cartH, "A", s.m1, styleA.fill, styleA.stroke);
      drawCart(ctx, x2, trackY - cartH / 2, d.w2, cartH, "B", s.m2, styleB.fill, styleB.stroke);
      if (showCollisionBurst) drawCollisionBurst();

      if (stage === "setup" || stage === "movingToCollision" || (stage === "result" && resultPhase === "before")) {
        drawVelocityArrow(ctx, x1, trackY - 95, s.u1, styleA.stroke, velocityLabel("A", "i", `= ${fmt(s.u1)} m/s`));
        drawVelocityArrow(ctx, x2, trackY - 95, s.u2, styleB.stroke, velocityLabel("B", "i", `= ${fmt(s.u2)} m/s`));
      } else if (stage === "momentumChoice") {
        drawText(ctx, "Choose total momentum before collision", mainCanvas.width / 2, 72, 15, "#0f766e", "center");
      } else if (stage === "choose") {
        drawFinalVelocityPrompt(final);
      } else {
        drawVelocityArrow(ctx, x1, trackY - 95, v1, styleA.stroke, velocityLabel("A", "f", `= ${fmt(v1)} m/s`));
        drawVelocityArrow(ctx, x2, trackY - 95, v2, styleB.stroke, velocityLabel("B", "f", `= ${fmt(v2)} m/s`));
      }

    }

    function drawMainBackground() {
      ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
      ctx.fillStyle = "#f8fbff";
      ctx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);

      ctx.strokeStyle = "rgba(100,116,139,0.14)";
      ctx.lineWidth = 1;
      for (let x = 50; x < mainCanvas.width; x += 50) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, mainCanvas.height);
        ctx.stroke();
      }

      ctx.fillStyle = "#e2e8f0";
      ctx.fillRect(0, trackY + 42, mainCanvas.width, mainCanvas.height - trackY);

      ctx.strokeStyle = "#64748b";
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(85, trackY + 3);
      ctx.lineTo(mainCanvas.width - 85, trackY + 3);
      ctx.stroke();

      ctx.fillStyle = "#cbd5e1";
      for (let x = 104; x < mainCanvas.width - 115; x += 62) {
        ctx.fillRect(x, trackY + 12, 38, 8);
      }
    }

    function drawScenarioText(s) {
      // Scenario descriptions remain in the data model, but are intentionally not drawn.
    }

    function drawCollisionMarker() {
      const center = collisionData.collisionPoint;
      ctx.setLineDash([8, 8]);
      ctx.strokeStyle = "#94a3b8";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(center, 95);
      ctx.lineTo(center, trackY + 55);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawCollisionBurst() {
      const center = collisionData.collisionPoint;
      const y = trackY + 48 - mainCanvas.height * 0.08;
      ctx.strokeStyle = "#dc2626";
      ctx.fillStyle = "rgba(254,226,226,0.95)";
      ctx.lineWidth = 4;
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(center - 35, y - 22);
      ctx.lineTo(center - 12, y - 7);
      ctx.lineTo(center - 25, y + 18);
      ctx.lineTo(center, y + 4);
      ctx.lineTo(center + 25, y + 18);
      ctx.lineTo(center + 12, y - 7);
      ctx.lineTo(center + 35, y - 22);
      ctx.lineTo(center + 18, y + 3);
      ctx.lineTo(center + 35, y + 28);
      ctx.lineTo(center, y + 12);
      ctx.lineTo(center - 35, y + 28);
      ctx.lineTo(center - 18, y + 3);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    function drawStartingGhosts(s, d, styleA, styleB) {
      ctx.globalAlpha = 0.22;
      drawCart(ctx, d.startX1, trackY - cartH / 2, d.w1, cartH, "A", s.m1, styleA.fill, styleA.stroke);
      drawCart(ctx, d.startX2, trackY - cartH / 2, d.w2, cartH, "B", s.m2, styleB.fill, styleB.stroke);
      ctx.globalAlpha = 0.62;
      drawVelocityArrow(ctx, d.startX1, trackY - 145, s.u1, styleA.stroke, velocityLabel("A", "i", `= ${fmt(s.u1)} m/s`, "start "));
      drawVelocityArrow(ctx, d.startX2, trackY - 145, s.u2, styleB.stroke, velocityLabel("B", "i", `= ${fmt(s.u2)} m/s`, "start "));
      ctx.globalAlpha = 1;
    }

    function drawFinalVelocityPrompt(final) {
      const target = targetCart(current);
      const given = givenCart(current);
      const d = collisionData;
      const givenX = given === "A" ? d.collisionX1 : d.collisionX2;
      const targetX = target === "A" ? d.collisionX1 : d.collisionX2;
      const v = cartFinalVelocity(final, given);
      const color = cartStroke(given);
      drawVelocityArrow(ctx, givenX, trackY - 102, v, color, velocityLabel(given, "f", `= ${fmt(v)} m/s`, "given "));
      drawQuestionVelocity(ctx, targetX, trackY - 102, "#0f766e", velocityLabel(target, "f", "= ?"));
    }

    function drawQuestionVelocity(drawCtx, x, y, color, label) {
      drawCtx.font = "bold 15px Arial";
      const textWidth = measureCanvasLabel(drawCtx, label, 15) + 18;
      roundedRect(drawCtx, x - textWidth / 2, y - 16, textWidth, 30, 8);
      drawCtx.fillStyle = "rgba(255,255,255,0.96)";
      drawCtx.strokeStyle = color;
      drawCtx.lineWidth = 2;
      drawCtx.fill();
      drawCtx.stroke();
      drawCanvasLabel(drawCtx, label, x, y + 5, 15, color, "center");
    }

    function drawAfterGhosts(final) {
      const d = collisionData;
      const styleA = cartStyle("A");
      const styleB = cartStyle("B");
      ctx.globalAlpha = 0.18;
      drawCart(ctx, d.collisionX1, trackY - cartH / 2, d.w1, cartH, "A", current.m1, styleA.fill, styleA.stroke);
      drawCart(ctx, d.collisionX2, trackY - cartH / 2, d.w2, cartH, "B", current.m2, styleB.fill, styleB.stroke);
      ctx.globalAlpha = 1;

      ctx.setLineDash([6, 7]);
      ctx.lineWidth = 3;
      ctx.strokeStyle = styleA.stroke;
      ctx.globalAlpha = 0.45;
      ctx.beginPath();
      ctx.moveTo(d.collisionX1, trackY - cartH / 2);
      ctx.lineTo(d.collisionX1 + final.v1 * afterScale * 2.4, trackY - cartH / 2);
      ctx.stroke();

      ctx.strokeStyle = styleB.stroke;
      ctx.beginPath();
      ctx.moveTo(d.collisionX2, trackY - cartH / 2 + 12);
      ctx.lineTo(d.collisionX2 + final.v2 * afterScale * 2.4, trackY - cartH / 2 + 12);
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.setLineDash([]);
    }

    function drawChoiceAnimations() {
      for (let i = 0; i < 3; i++) {
        const c = choiceCanvases[i];
        const cctx = choiceCtxs[i];
        cctx.clearRect(0, 0, c.width, c.height);

        cctx.fillStyle = "#f8fbff";
        cctx.fillRect(0, 0, c.width, c.height);

        cctx.fillStyle = "#e2e8f0";
        cctx.fillRect(0, 106, c.width, 44);

        cctx.strokeStyle = "#64748b";
        cctx.lineWidth = 4;
        cctx.beginPath();
        cctx.moveTo(12, 101);
        cctx.lineTo(c.width - 12, 101);
        cctx.stroke();

        if (!current || !options[i]) continue;

        if (stage === "setup" || stage === "movingToCollision") {
          drawMiniWaiting(cctx, c.width, c.height);
        } else if (stage === "momentumChoice") {
          drawMiniMomentumChoice(cctx, c.width, c.height, momentumOptions[i]);
        } else {
          drawMiniAfterPath(cctx, c.width, c.height, options[i], i);
        }
      }
    }

    function drawMiniWaiting(cctx, width, height) {
      drawText(cctx, "after-collision path", width / 2, 66, 14, "#94a3b8", "center");
    }

    function drawMiniMomentumChoice(cctx, width, height, option) {
      if (!option) return;

      drawText(cctx, "total momentum before", width / 2, 46, 13, "#475569", "center");
      cctx.font = "bold 22px Arial";
      const value = `${fmt(option.value)} kg·m/s`;
      const textWidth = cctx.measureText(value).width + 24;
      cctx.fillStyle = "rgba(255,255,255,0.96)";
      cctx.strokeStyle = option.correct && selected !== -1 ? "#16a34a" : "#64748b";
      cctx.lineWidth = 2;
      roundedRect(cctx, width / 2 - textWidth / 2, 61, textWidth, 36, 8);
      cctx.fill();
      cctx.stroke();
      drawText(cctx, value, width / 2, 86, 20, "#172033", "center");

      if (selected !== -1) {
        drawText(cctx, option.correct ? "correct p before" : "wrong sign", width / 2, 137, 12, option.correct ? "#15803d" : "#64748b", "center");
      }
    }

    function drawMiniAfterPath(cctx, width, height, option, index) {
      const s = current;
      const styleA = cartStyle("A", s);
      const styleB = cartStyle("B", s);
      const w1 = 48 + s.m1 * 6;
      const w2 = 48 + s.m2 * 6;
      const startA = width / 2 - w2 / 2;
      const startB = width / 2 + w1 / 2;
      const cycle = selected === -1 ? (clock % 2.5) / 2.5 : 0.78;
      const t = cycle * 2.2;

      let x1 = startA + option.v1 * choiceScale * t;
      let x2 = startB + option.v2 * choiceScale * t;

      x1 = clamp(x1, -35, width + 35);
      x2 = clamp(x2, -35, width + 35);

      cctx.setLineDash([4, 5]);
      cctx.strokeStyle = styleA.stroke;
      cctx.globalAlpha = 0.38;
      cctx.lineWidth = 2;
      cctx.beginPath();
      cctx.moveTo(startA, 80);
      cctx.lineTo(x1, 80);
      cctx.stroke();

      cctx.strokeStyle = styleB.stroke;
      cctx.beginPath();
      cctx.moveTo(startB, 91);
      cctx.lineTo(x2, 91);
      cctx.stroke();
      cctx.setLineDash([]);
      cctx.globalAlpha = 1;

      cctx.globalAlpha = 0.22;
      drawMiniCart(cctx, startA, 80, w1, 38, "A", s.m1, styleA.fill, styleA.stroke);
      drawMiniCart(cctx, startB, 80, w2, 38, "B", s.m2, styleB.fill, styleB.stroke);
      cctx.globalAlpha = 1;

      drawMiniCart(cctx, x1, 80, w1, 38, "A", s.m1, styleA.fill, styleA.stroke);
      drawMiniCart(cctx, x2, 80, w2, 38, "B", s.m2, styleB.fill, styleB.stroke);

      const aLabel = option.target === "A"
        ? velocityLabel("A", "f", `= ${fmt(option.v1)} m/s`)
        : velocityLabel("A", "f", `= ${fmt(option.v1)} m/s`, "given ");
      const bLabel = option.target === "B"
        ? velocityLabel("B", "f", `= ${fmt(option.v2)} m/s`)
        : velocityLabel("B", "f", `= ${fmt(option.v2)} m/s`, "given ");
      drawMiniVelocityArrow(cctx, x1, 40, option.v1, option.target === "A" ? "#0f766e" : styleA.stroke, aLabel, "above");
      drawMiniVelocityArrow(cctx, x2, 20, option.v2, option.target === "B" ? "#0f766e" : styleB.stroke, bLabel, "below");

      if (selected !== -1) {
        drawText(cctx, option.correct ? "momentum result" : option.label, width / 2, 137, 12, option.correct ? "#15803d" : "#64748b", "center");
      }
    }

    function drawCart(drawCtx, x, y, w, h, label, mass, fill, stroke) {
      drawCtx.fillStyle = fill;
      drawCtx.strokeStyle = stroke;
      drawCtx.lineWidth = 4;
      roundedRect(drawCtx, x - w / 2, y - h / 2, w, h, 12);
      drawCtx.fill();
      drawCtx.stroke();

      drawCtx.fillStyle = "#172033";
      drawCtx.font = "bold 20px Arial";
      drawCtx.textAlign = "center";
      drawCtx.fillText(label, x, y - 5);

      drawCtx.font = "bold 16px Arial";
      drawCtx.fillText(`${mass} kg`, x, y + 21);

      drawCtx.fillStyle = "#334155";
      drawCtx.beginPath();
      drawCtx.arc(x - w / 3, y + h / 2 + 7, 10, 0, Math.PI * 2);
      drawCtx.arc(x + w / 3, y + h / 2 + 7, 10, 0, Math.PI * 2);
      drawCtx.fill();
    }

    function drawMiniCart(drawCtx, x, y, w, h, label, mass, fill, stroke) {
      drawCtx.fillStyle = fill;
      drawCtx.strokeStyle = stroke;
      drawCtx.lineWidth = 2;
      roundedRect(drawCtx, x - w / 2, y - h / 2, w, h, 7);
      drawCtx.fill();
      drawCtx.stroke();

      drawCtx.fillStyle = "#172033";
      drawCtx.font = "bold 13px Arial";
      drawCtx.textAlign = "center";
      drawCtx.fillText(label, x, y - 2);

      drawCtx.font = "bold 10px Arial";
      drawCtx.fillText(`${mass} kg`, x, y + 12);
    }

    function isVelocityLabel(label) {
      return label && typeof label === "object" && label.kind === "velocity";
    }

    function measureCanvasLabel(drawCtx, label, size) {
      if (!isVelocityLabel(label)) return drawCtx.measureText(label).width;

      const subSize = Math.max(8, Math.round(size * 0.72));
      drawCtx.font = `bold ${size}px Arial`;
      const prefixWidth = drawCtx.measureText(label.prefix || "").width;
      drawCtx.font = `italic bold ${size}px Georgia`;
      const vWidth = drawCtx.measureText("v").width;
      drawCtx.font = `bold ${subSize}px Arial`;
      const subWidth = drawCtx.measureText(`${label.cart}${label.phase}`).width;
      drawCtx.font = `bold ${size}px Arial`;
      const valueWidth = drawCtx.measureText(` ${label.value}`).width;
      return prefixWidth + vWidth + subWidth + valueWidth;
    }

    function drawCanvasLabel(drawCtx, label, x, y, size, color, align = "center") {
      if (!isVelocityLabel(label)) {
        drawText(drawCtx, label, x, y, size, color, align);
        return;
      }

      const totalWidth = measureCanvasLabel(drawCtx, label, size);
      const subSize = Math.max(8, Math.round(size * 0.72));
      let cursor = align === "center" ? x - totalWidth / 2 : x;

      drawCtx.fillStyle = color;
      drawCtx.textAlign = "left";

      drawCtx.font = `bold ${size}px Arial`;
      const prefix = label.prefix || "";
      drawCtx.fillText(prefix, cursor, y);
      cursor += drawCtx.measureText(prefix).width;

      drawCtx.font = `italic bold ${size}px Georgia`;
      drawCtx.fillText("v", cursor, y);
      cursor += drawCtx.measureText("v").width;

      drawCtx.font = `bold ${subSize}px Arial`;
      drawCtx.fillText(`${label.cart}${label.phase}`, cursor, y + size * 0.35);
      cursor += drawCtx.measureText(`${label.cart}${label.phase}`).width;

      drawCtx.font = `bold ${size}px Arial`;
      drawCtx.fillText(` ${label.value}`, cursor, y);
      drawCtx.textAlign = align;
    }

    function drawVelocityArrow(drawCtx, x, y, v, color, label) {
      if (Math.abs(v) < 0.05) {
        drawText(drawCtx, label, x, y - 22, 13, color, "center");
        return;
      }

      const dir = v > 0 ? 1 : -1;
      const len = 42 + Math.min(100, Math.abs(v) * 22);
      drawArrow(drawCtx, x - dir * len / 2, y, x + dir * len / 2, y, color, label);
    }

    function drawMiniVelocityArrow(drawCtx, x, y, v, color, label, labelSide) {
      if (Math.abs(v) < 0.05) {
        drawMiniVelocityLabel(drawCtx, label, x, labelSide === "below" ? y + 21 : y - 15, color);
        return;
      }

      const dir = v > 0 ? 1 : -1;
      const len = 22 + Math.min(45, Math.abs(v) * 9);
      drawArrow(drawCtx, x - dir * len / 2, y, x + dir * len / 2, y, color, "");
      drawMiniVelocityLabel(drawCtx, label, x, labelSide === "below" ? y + 21 : y - 15, color);
    }

    function drawMiniVelocityLabel(drawCtx, label, x, y, color) {
      drawCtx.font = "bold 10px Arial";
      const textWidth = measureCanvasLabel(drawCtx, label, 10) + 8;
      drawCtx.fillStyle = "rgba(255,255,255,0.94)";
      drawCtx.strokeStyle = color;
      drawCtx.lineWidth = 1;
      roundedRect(drawCtx, x - textWidth / 2, y - 11, textWidth, 16, 5);
      drawCtx.fill();
      drawCtx.stroke();
      drawCanvasLabel(drawCtx, label, x, y + 1, 10, color, "center");
    }

    function drawArrow(drawCtx, x1, y1, x2, y2, color, label) {
      const angle = Math.atan2(y2 - y1, x2 - x1);
      const head = 12;
      const shaftEndX = x2 - head * Math.cos(angle);
      const shaftEndY = y2 - head * Math.sin(angle);

      drawCtx.strokeStyle = color;
      drawCtx.fillStyle = color;
      drawCtx.lineWidth = 4;
      drawCtx.lineCap = "round";

      drawCtx.beginPath();
      drawCtx.moveTo(x1, y1);
      drawCtx.lineTo(shaftEndX, shaftEndY);
      drawCtx.stroke();

      drawCtx.beginPath();
      drawCtx.moveTo(x2, y2);
      drawCtx.lineTo(x2 - head * Math.cos(angle - Math.PI / 6), y2 - head * Math.sin(angle - Math.PI / 6));
      drawCtx.lineTo(x2 - head * Math.cos(angle + Math.PI / 6), y2 - head * Math.sin(angle + Math.PI / 6));
      drawCtx.closePath();
      drawCtx.fill();

      if (label) {
        const lx = (x1 + x2) / 2;
        const ly = y1 - 16;
        drawCtx.font = "bold 13px Arial";
        const textWidth = measureCanvasLabel(drawCtx, label, 12) + 14;
        drawCtx.fillStyle = "rgba(255,255,255,0.94)";
        drawCtx.strokeStyle = color;
        drawCtx.lineWidth = 2;
        roundedRect(drawCtx, lx - textWidth / 2, ly - 13, textWidth, 24, 6);
        drawCtx.fill();
        drawCtx.stroke();
        drawCanvasLabel(drawCtx, label, lx, ly + 5, 12, color, "center");
      }
    }

    function drawText(drawCtx, text, x, y, size, color, align) {
      if (isVelocityLabel(text)) {
        drawCanvasLabel(drawCtx, text, x, y, size, color, align);
        return;
      }
      drawCtx.fillStyle = color;
      drawCtx.font = "bold " + size + "px Arial";
      drawCtx.textAlign = align;
      drawCtx.fillText(text, x, y);
    }

    function roundedRect(drawCtx, x, y, width, height, radius) {
      drawCtx.beginPath();
      drawCtx.moveTo(x + radius, y);
      drawCtx.lineTo(x + width - radius, y);
      drawCtx.quadraticCurveTo(x + width, y, x + width, y + radius);
      drawCtx.lineTo(x + width, y + height - radius);
      drawCtx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      drawCtx.lineTo(x + radius, y + height);
      drawCtx.quadraticCurveTo(x, y + height, x, y + height - radius);
      drawCtx.lineTo(x, y + radius);
      drawCtx.quadraticCurveTo(x, y, x + radius, y);
      drawCtx.closePath();
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function smoothStep(value) {
      const t = clamp(value, 0, 1);
      return t * t * (3 - 2 * t);
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    cards.forEach((card, index) => {
      card.addEventListener("click", () => chooseCard(index));
    });

    startBtn.addEventListener("click", startToCollision);
    resetBtn.addEventListener("click", resetScenario);
    nextBtn.addEventListener("click", nextScenario);

    function animate() {
      clock += 0.016;
      drawChoiceAnimations();
      drawMain();
      requestAnimationFrame(animate);
    }

    loadScenario(0);
    animate();
  </script>
</body>
