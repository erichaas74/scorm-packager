                <circle cx="81" cy="130" r="4" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
                <circle cx="90" cy="130" r="4" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>

                <!-- Heavy Body (Puffer Jacket) -->
                <rect x="65" y="45" width="50" height="40" rx="12" fill="${color}" stroke="#1e293b" stroke-width="3"/>
                <line x1="67" y1="55" x2="113" y2="55" stroke="#1e293b" stroke-width="2" opacity="0.4"/>
                <line x1="67" y1="65" x2="113" y2="65" stroke="#1e293b" stroke-width="2" opacity="0.4"/>
                <line x1="67" y1="75" x2="113" y2="75" stroke="#1e293b" stroke-width="2" opacity="0.4"/>

                <!-- Front Leg & Heavy Skate -->
                <path d="M 90 85 L 95 115" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
                <path d="M 93 115 L 103 115 L 105 126 L 87 126 Z" fill="#f1f5f9" stroke="#1e293b" stroke-width="2"/>
                <circle cx="91" cy="130" r="4" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
                <circle cx="100" cy="130" r="4" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>

                <!-- Head & Smiley -->
                <circle cx="90" cy="25" r="15" fill="#ffedd5" stroke="#1e293b" stroke-width="3"/>
                <circle cx="84" cy="22" r="2" fill="#1e293b"/>
                <path d="M 86 29 Q 83 33 80 29" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

                <!-- Arm -->
                <circle cx="90" cy="50" r="6" fill="#1e293b"/>
                <path d="M 90 50 L 90 80" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
                <circle cx="90" cy="80" r="6" fill="${color}" stroke="#1e293b" stroke-width="2"/>
            </svg>
        `;

        const SVGHeavySkaterPushingLeft = (color) => `
            <svg width="140" height="140" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
                <!-- Back Leg & Heavy Skate -->
                <path d="M 90 85 L 85 115" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
                <path d="M 83 115 L 93 115 L 95 126 L 77 126 Z" fill="#f1f5f9" stroke="#1e293b" stroke-width="2"/>
                <circle cx="81" cy="130" r="4" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
                <circle cx="90" cy="130" r="4" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>

                <!-- Heavy Body (Puffer Jacket) -->
                <rect x="65" y="45" width="50" height="40" rx="12" fill="${color}" stroke="#1e293b" stroke-width="3"/>
                <line x1="67" y1="55" x2="113" y2="55" stroke="#1e293b" stroke-width="2" opacity="0.4"/>
                <line x1="67" y1="65" x2="113" y2="65" stroke="#1e293b" stroke-width="2" opacity="0.4"/>
                <line x1="67" y1="75" x2="113" y2="75" stroke="#1e293b" stroke-width="2" opacity="0.4"/>

                <!-- Front Leg & Heavy Skate -->
                <path d="M 90 85 L 95 115" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
                <path d="M 93 115 L 103 115 L 105 126 L 87 126 Z" fill="#f1f5f9" stroke="#1e293b" stroke-width="2"/>
                <circle cx="91" cy="130" r="4" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
                <circle cx="100" cy="130" r="4" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>

                <!-- Head & Smiley -->
                <circle cx="90" cy="25" r="15" fill="#ffedd5" stroke="#1e293b" stroke-width="3"/>
                <circle cx="84" cy="22" r="2" fill="#1e293b"/>
                <path d="M 86 29 Q 83 33 80 29" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

                <!-- Arm (Pushing Left) -->
                <circle cx="90" cy="50" r="6" fill="#1e293b"/>
                <path d="M 90 50 L 35 50" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
                <circle cx="35" cy="50" r="6" fill="${color}" stroke="#1e293b" stroke-width="2"/>
            </svg>
        `;

        const SVGArrowAction = `
            <!-- Right Arrow (Action) -->
            <div id="arrow-action" class="absolute bottom-0 left-0 opacity-0 transition-opacity duration-500 transform translate-x-[7px]">
                <span class="absolute bottom-[28px] left-1/2 transform -translate-x-1/2 font-bold text-blue-500 text-lg">F</span>
                <svg width="80" height="40" viewBox="0 0 100 40" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 70 10 L 90 20 L 70 30 L 70 25 L 10 25 L 10 15 L 70 15 Z" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2"/>
                </svg>
            </div>
        `;

        const SVGArrowReaction = `
            <!-- Left Arrow (Reaction) -->
            <div id="arrow-reaction" class="absolute bottom-0 left-0 opacity-0 transition-opacity duration-500 transform -translate-x-[87px]">
                <span class="absolute bottom-[28px] left-1/2 transform -translate-x-1/2 font-bold text-red-500 text-lg">-F</span>
                <svg width="80" height="40" viewBox="0 0 100 40" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 30 10 L 10 20 L 30 30 L 30 25 L 90 25 L 90 15 L 30 15 Z" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/>
                </svg>
            </div>
        `;

        const SVGFrictionLeft = `
            <!-- Friction Arrow (Left) -->
            <div id="friction-left" class="absolute bottom-0 left-0 opacity-0 transition-opacity duration-500 transform translate-x-[15px] translate-y-[155px]">
                <span class="absolute top-[20px] left-1/2 transform -translate-x-1/2 font-bold text-amber-600 text-sm">Friction</span>
                <svg width="64" height="24" viewBox="0 0 100 40" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 30 10 L 10 20 L 30 30 L 30 25 L 90 25 L 90 15 L 30 15 Z" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
                </svg>
            </div>
        `;

        const SVGFrictionRight = `
            <!-- Friction Arrow (Right) -->
            <div id="friction-right" class="absolute bottom-0 left-0 opacity-0 transition-opacity duration-500 transform -translate-x-[79px] translate-y-[155px]">
                <span class="absolute top-[20px] left-1/2 transform -translate-x-1/2 font-bold text-amber-600 text-sm">Friction</span>
                <svg width="64" height="24" viewBox="0 0 100 40" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 70 10 L 90 20 L 70 30 L 70 25 L 10 25 L 10 15 L 70 15 Z" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
                </svg>
            </div>
        `;

        // --- DOM ELEMENTS ---
        const entityA = document.getElementById('entity-a');
        const entityB = document.getElementById('entity-b');
        const forceArrows = document.getElementById('force-arrows');
        const scenarioProgress = document.getElementById('scenario-progress');
        const promptText = document.getElementById('prompt-text');
        const buttonContainer = document.getElementById('button-container');

        // Colors
        const colorA = '#60a5fa'; // Blue
        const colorB = '#34d399'; // Green
        const colorHeavy = '#f59e0b'; // Amber

        const scenarioTitles = [
            'Skater vs Skater',
            'Skater vs Wall',
            'Skater vs Sneakers',
            'Sneakers vs Wall',
            'Skater vs Wall on Wheels',
            'Skater vs Heavy Skater'
        ];

        const feedbackPauseMs = 3600;

        // --- STATE MACHINE ---
        let currentState = 1;

        function updateScenarioProgress() {
            const scenarioNumber = Math.ceil(currentState / 2);
            const phaseLabel = currentState % 2 === 1 ? 'Predict' : 'Explain';
            scenarioProgress.textContent = `Scenario ${scenarioNumber} of ${scenarioTitles.length}: ${scenarioTitles[scenarioNumber - 1]} | ${phaseLabel}`;
        }

        function renderState() {
            // Clear buttons
            buttonContainer.innerHTML = '';
            updateScenarioProgress();

            switch(currentState) {
                // --- SCENARIO 1: SKATER VS SKATER ---
                case 1: 
                    promptText.innerText = "Watch the skaters...";
                    
                    entityA.className = 'absolute left-1/2 bottom-0 flex flex-col items-center transition-transform duration-[1500ms] ease-out z-10 -translate-x-[250px]';
                    entityB.className = 'absolute left-1/2 bottom-0 flex flex-col items-center transition-transform duration-[1500ms] ease-out z-10 translate-x-[250px]';
                    entityA.innerHTML = SVGSkaterIdleRight(colorA);
                    entityB.innerHTML = SVGSkaterIdleLeft(colorB);
                    forceArrows.innerHTML = SVGArrowReaction + SVGArrowAction;
                    
                    setTimeout(() => {
                        entityA.classList.replace('-translate-x-[250px]', '-translate-x-[87px]');
                        entityB.classList.replace('translate-x-[250px]', '-translate-x-[33px]');
                    }, 100);

                    setTimeout(() => {
                        entityA.innerHTML = SVGSkaterPushingRight(colorA);
                        entityB.innerHTML = SVGSkaterPushingLeft(colorB);
                        document.getElementById('arrow-action').classList.replace('opacity-0', 'opacity-100');
                        
                        promptText.innerText = "Two skaters on roller skates meet. Blue pushes Green. What happens?";
                        createButton("Only Green Skater moves.", () => advanceState(2));
                        createButton("Only Blue Skater moves.", () => advanceState(2));
                        createButton("Both move backward.", () => advanceState(2));
                    }, 1700);
                    break;

                case 2: 
                    promptText.innerText = "Both skaters feel equal and opposite forces, so both roll backward.";
                    
                    document.getElementById('arrow-reaction').classList.replace('opacity-0', 'opacity-100');
                    
                    setTimeout(() => {
                        document.getElementById('arrow-action').classList.replace('opacity-100', 'opacity-0');
                        document.getElementById('arrow-reaction').classList.replace('opacity-100', 'opacity-0');
                        
                        entityA.innerHTML = SVGSkaterIdleRight(colorA);
                        entityB.innerHTML = SVGSkaterIdleLeft(colorB);
                        
                        entityA.classList.replace('-translate-x-[87px]', '-translate-x-[250px]');
                        entityB.classList.replace('-translate-x-[33px]', 'translate-x-[250px]');
                    }, 1200);

                    queueAutoAdvance(3);
                    break;

                // --- SCENARIO 2: SKATER VS WALL ---
                case 3: 
                    promptText.innerText = "Watch closely...";
                    
                    entityA.className = 'absolute left-1/2 bottom-0 flex flex-col items-center transition-transform duration-[1500ms] ease-out z-10 -translate-x-[250px]';
                    entityB.className = 'absolute left-1/2 bottom-0 flex flex-col items-center transition-transform duration-[1500ms] ease-out z-10 translate-x-[0px]'; // Wall stays put
                    entityA.innerHTML = SVGSkaterIdleRight(colorA);
                    entityB.innerHTML = SVGWall; 
                    forceArrows.innerHTML = SVGArrowReaction + SVGArrowAction + SVGFrictionLeft;
                    
                    setTimeout(() => {
                        entityA.classList.replace('-translate-x-[250px]', '-translate-x-[87px]');
                    }, 100);

                    setTimeout(() => {
                        entityA.innerHTML = SVGSkaterPushingRight(colorA);
                        document.getElementById('arrow-action').classList.replace('opacity-0', 'opacity-100');
                        
                        promptText.innerText = "Blue pushes a brick wall. What happens?";
                        createButton("Nothing happens.", () => advanceState(4));
                        createButton("The wall moves.", () => advanceState(4));
                        createButton("Blue Skater moves back.", () => advanceState(4));
                    }, 1700);
                    break;

                case 4: 
                    promptText.innerText = "The wall pushes back, so the Blue Skater rolls backward.";
                    
                    document.getElementById('arrow-reaction').classList.replace('opacity-0', 'opacity-100');
                    document.getElementById('friction-left').classList.replace('opacity-0', 'opacity-100');
                    
                    setTimeout(() => {
                        document.getElementById('arrow-action').classList.replace('opacity-100', 'opacity-0');
                        document.getElementById('arrow-reaction').classList.replace('opacity-100', 'opacity-0');
                        document.getElementById('friction-left').classList.replace('opacity-100', 'opacity-0');
                        
                        entityA.innerHTML = SVGSkaterIdleRight(colorA);
                        entityA.classList.replace('-translate-x-[87px]', '-translate-x-[250px]');
                    }, 1200);

                    queueAutoAdvance(5);
                    break;

                // --- SCENARIO 3: SKATER VS SNEAKERS ---
                case 5: 
                    promptText.innerText = "Watch closely...";
                    
                    entityA.className = 'absolute left-1/2 bottom-0 flex flex-col items-center transition-transform duration-[1500ms] ease-out z-10 -translate-x-[250px]';
                    entityB.className = 'absolute left-1/2 bottom-0 flex flex-col items-center transition-transform duration-[1500ms] ease-out z-10 translate-x-[250px]';
                    entityA.innerHTML = SVGSkaterIdleRight(colorA);
                    entityB.innerHTML = SVGSneakerIdleLeft(colorB); 
                    forceArrows.innerHTML = SVGArrowReaction + SVGArrowAction + SVGFrictionLeft;
                    
                    setTimeout(() => {
                        entityA.classList.replace('-translate-x-[250px]', '-translate-x-[87px]');
                        entityB.classList.replace('translate-x-[250px]', '-translate-x-[33px]');
                    }, 100);

                    setTimeout(() => {
                        entityA.innerHTML = SVGSkaterPushingRight(colorA);
                        entityB.innerHTML = SVGSneakerPushingLeft(colorB);
                        document.getElementById('arrow-action').classList.replace('opacity-0', 'opacity-100');
                        
                        promptText.innerText = "Blue pushes a person in regular shoes. What happens?";
                        createButton("Only Green Person moves.", () => advanceState(6));
                        createButton("Only Blue Skater moves.", () => advanceState(6));
                        createButton("Both move backward.", () => advanceState(6));
                    }, 1700);
                    break;

                case 6: 
                    promptText.innerText = "The shoes grip the floor, so Green stays put while Blue rolls back.";
                    
                    document.getElementById('arrow-reaction').classList.replace('opacity-0', 'opacity-100');
                    document.getElementById('friction-left').classList.replace('opacity-0', 'opacity-100');
                    
                    setTimeout(() => {
                        document.getElementById('arrow-action').classList.replace('opacity-100', 'opacity-0');
                        document.getElementById('arrow-reaction').classList.replace('opacity-100', 'opacity-0');
                        document.getElementById('friction-left').classList.replace('opacity-100', 'opacity-0');
                        
                        entityA.innerHTML = SVGSkaterIdleRight(colorA);
                        entityB.innerHTML = SVGSneakerIdleLeft(colorB);
                        
                        entityA.classList.replace('-translate-x-[87px]', '-translate-x-[250px]');
                    }, 1200);

                    queueAutoAdvance(7);
                    break;

                // --- SCENARIO 4: PERSON (SNEAKERS) VS WALL ---
                case 7: 
                    promptText.innerText = "Watch closely...";
                    
                    entityA.className = 'absolute left-1/2 bottom-0 flex flex-col items-center transition-transform duration-[1500ms] ease-out z-10 -translate-x-[250px]';
                    entityB.className = 'absolute left-1/2 bottom-0 flex flex-col items-center transition-transform duration-[1500ms] ease-out z-10 translate-x-[0px]'; // Wall stays put
                    entityA.innerHTML = SVGSneakerIdleRight(colorA);
                    entityB.innerHTML = SVGWall; 
                    forceArrows.innerHTML = SVGArrowReaction + SVGArrowAction + SVGFrictionLeft + SVGFrictionRight;
                    
                    setTimeout(() => {
                        entityA.classList.replace('-translate-x-[250px]', '-translate-x-[87px]');
                    }, 100);

                    setTimeout(() => {
                        entityA.innerHTML = SVGSneakerPushingRight(colorA);
                        document.getElementById('arrow-action').classList.replace('opacity-0', 'opacity-100');
                        
                        promptText.innerText = "Blue, now in regular shoes, pushes the wall. What happens?";
                        createButton("Nothing happens.", () => advanceState(8));
                        createButton("The wall moves.", () => advanceState(8));
                        createButton("Blue Person moves back.", () => advanceState(8));
                    }, 1700);
                    break;

                case 8: 
                    promptText.innerText = "The wall pushes back, but shoe friction balances it, so nobody moves.";
                    
                    document.getElementById('arrow-reaction').classList.replace('opacity-0', 'opacity-100');
                    document.getElementById('friction-left').classList.replace('opacity-0', 'opacity-100');
                    document.getElementById('friction-right').classList.replace('opacity-0', 'opacity-100');
                    
                    setTimeout(() => {
                        document.getElementById('arrow-action').classList.replace('opacity-100', 'opacity-0');
                        document.getElementById('arrow-reaction').classList.replace('opacity-100', 'opacity-0');
                        document.getElementById('friction-left').classList.replace('opacity-100', 'opacity-0');
                        document.getElementById('friction-right').classList.replace('opacity-100', 'opacity-0');
                        
                        entityA.innerHTML = SVGSneakerIdleRight(colorA);
                    }, 1200);

                    queueAutoAdvance(9);
                    break;

                // --- SCENARIO 5: SKATER VS WALL ON WHEELS ---
                case 9: 
                    promptText.innerText = "Watch closely...";
                    
                    entityA.className = 'absolute left-1/2 bottom-0 flex flex-col items-center transition-transform duration-[1500ms] ease-out z-10 -translate-x-[250px]';
                    entityB.className = 'absolute left-1/2 bottom-0 flex flex-col items-center transition-transform duration-[1500ms] ease-out z-10 translate-x-[250px]';
                    entityA.innerHTML = SVGSkaterIdleRight(colorA);
                    entityB.innerHTML = SVGWallOnWheels; 
                    forceArrows.innerHTML = SVGArrowReaction + SVGArrowAction; // No friction arrows!
                    
                    setTimeout(() => {
                        entityA.classList.replace('-translate-x-[250px]', '-translate-x-[87px]');
                        entityB.classList.replace('translate-x-[250px]', '-translate-x-[33px]');
                    }, 100);

                    setTimeout(() => {
                        entityA.innerHTML = SVGSkaterPushingRight(colorA);
                        document.getElementById('arrow-action').classList.replace('opacity-0', 'opacity-100');
                        
                        promptText.innerText = "Blue pushes a wall on wheels. What happens?";
                        createButton("The wall moves faster.", () => advanceState(10));
                        createButton("Blue Skater moves faster.", () => advanceState(10));
                        createButton("They move at same speed.", () => advanceState(10));
                    }, 1700);
                    break;

                case 10: 
                    promptText.innerText = "With the wall on wheels, both move, but the heavier wall speeds up less.";
                    
                    document.getElementById('arrow-reaction').classList.replace('opacity-0', 'opacity-100');
                    
                    setTimeout(() => {
                        document.getElementById('arrow-action').classList.replace('opacity-100', 'opacity-0');
                        document.getElementById('arrow-reaction').classList.replace('opacity-100', 'opacity-0');
                        
                        entityA.innerHTML = SVGSkaterIdleRight(colorA);
                        
                        // Skater flies back, heavy wall drifts back slowly
                        entityA.classList.replace('-translate-x-[87px]', '-translate-x-[250px]');
                        entityB.classList.replace('-translate-x-[33px]', 'translate-x-[40px]');
                    }, 1200);

                    queueAutoAdvance(11);
                    break;

                // --- SCENARIO 6: SKATER VS HEAVY SKATER ---
                case 11: 
                    promptText.innerText = "Watch closely...";
                    
                    entityA.className = 'absolute left-1/2 bottom-0 flex flex-col items-center transition-transform duration-[1500ms] ease-out z-10 -translate-x-[250px]';
                    entityB.className = 'absolute left-1/2 bottom-0 flex flex-col items-center transition-transform duration-[1500ms] ease-out z-10 translate-x-[250px]';
                    entityA.innerHTML = SVGSkaterIdleRight(colorA);
                    entityB.innerHTML = SVGHeavySkaterIdleLeft(colorHeavy); 
                    forceArrows.innerHTML = SVGArrowReaction + SVGArrowAction;
                    
                    setTimeout(() => {
                        entityA.classList.replace('-translate-x-[250px]', '-translate-x-[87px]');
                        entityB.classList.replace('translate-x-[250px]', '-translate-x-[33px]');
                    }, 100);

                    setTimeout(() => {
                        entityA.innerHTML = SVGSkaterPushingRight(colorA);
                        entityB.innerHTML = SVGHeavySkaterPushingLeft(colorHeavy);
                        document.getElementById('arrow-action').classList.replace('opacity-0', 'opacity-100');
                        
                        promptText.innerText = "Blue pushes a much heavier Amber Skater. What happens?";
                        createButton("Amber Skater moves faster.", () => advanceState(12));
                        createButton("Blue Skater moves faster.", () => advanceState(12));
                        createButton("They move at same speed.", () => advanceState(12));
                    }, 1700);
                    break;

                case 12: 
                    promptText.innerText = "The forces match, but the heavier skater accelerates less.";
                    
                    document.getElementById('arrow-reaction').classList.replace('opacity-0', 'opacity-100');
                    
                    setTimeout(() => {
                        document.getElementById('arrow-action').classList.replace('opacity-100', 'opacity-0');
                        document.getElementById('arrow-reaction').classList.replace('opacity-100', 'opacity-0');
                        
                        entityA.innerHTML = SVGSkaterIdleRight(colorA);
                        entityB.innerHTML = SVGHeavySkaterIdleLeft(colorHeavy);
                        
                        // Heavy Skater glides shorter distance
                        entityA.classList.replace('-translate-x-[87px]', '-translate-x-[250px]');
                        entityB.classList.replace('-translate-x-[33px]', 'translate-x-[110px]');
                    }, 1200);

                    setTimeout(() => {
                        createButton("Restart Simulation", () => advanceState(1), true);
                    }, 3000);
                    break;
            }
        }

        // --- UTILS ---
        function advanceState(newState) {
            currentState = newState;
            renderState();
        }

        function queueAutoAdvance(nextState) {
            setTimeout(() => {
                if (currentState === nextState - 1) {
                    advanceState(nextState);
                }
            }, feedbackPauseMs);
        }

        function createButton(text, onClick, isPrimary = false) {
            const btn = document.createElement('button');
            btn.innerText = text;
            
            // Tailwind classes for buttons
            const baseClasses = "px-4 py-2 text-sm md:text-base rounded-lg font-semibold transition-all duration-200 transform hover:scale-105 active:scale-95 shadow-md flex-1 md:flex-none fade-in";
            const colorClasses = isPrimary 
                ? "bg-blue-500 hover:bg-blue-400 text-white border-2 border-blue-400" 
                : "bg-slate-700 hover:bg-slate-600 text-white border-2 border-slate-500";
            
            btn.className = `${baseClasses} ${colorClasses}`;
            
            btn.onclick = () => {
                // Visual feedback on click before state change
                btn.classList.add('ring-4', 'ring-blue-300');
                setTimeout(onClick, 150);
            };
            buttonContainer.appendChild(btn);
        }

        // Initialize
        renderState();
    </script>
</body>
</html>
