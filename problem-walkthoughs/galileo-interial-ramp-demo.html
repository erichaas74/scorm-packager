<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galileo's Inertia Thought Experiment</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      padding: 16px;
    }

    .app {
      width: min(1100px, 100%);
      margin: 0 auto;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.16);
      padding: 16px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 4vw, 2rem);
      line-height: 1.1;
      letter-spacing: -0.03em;
      font-weight: 900;
    }


    .canvas-wrap {
      position: relative;
      margin-top: 16px;
      border: 1px solid #e2e8f0;
      border-radius: 28px;
      overflow: hidden;
      background: #f8fafc;
    }

    canvas {
      display: block;
      width: 100%;
      height: 430px;
      cursor: pointer;
      touch-action: none;
    }

    .canvas-controls {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
      max-width: 55%;
    }

    button {
      border: 0;
      border-radius: 18px;
      padding: 12px 20px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease, box-shadow 120ms ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.16);
    }

    .primary-btn {
      background: #1d4ed8;
      color: #ffffff;
    }

    .primary-btn:hover:not(:disabled) {
      background: #1e40af;
    }

    .secondary-btn {
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #cbd5e1;
    }

    .choice-btn {
      background: #ffffff;
      color: #0f172a;
      border: 2px solid #cbd5e1;
    }

    .choice-btn.selected {
      background: #dbeafe;
      border-color: #2563eb;
      color: #1e3a8a;
    }

    .disabled-btn {
      background: #cbd5e1;
      color: #475569;
      cursor: not-allowed;
    }

    @media (max-width: 640px) {
      body {
        padding: 8px;
      }

      .app {
        border-radius: 20px;
        padding: 12px;
      }

      canvas {
        height: 360px;
      }

      .canvas-controls {
        top: 10px;
        right: 10px;
        gap: 8px;
        max-width: 60%;
      }

      button {
        padding: 10px 14px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="header">
      <div>
        <h1>Galileo's Inertia Thought Experiment</h1>
      </div>
    </section>

    <section class="canvas-wrap">
      <canvas id="simCanvas" aria-label="Galileo inertia ramp simulation"></canvas>
      <div class="canvas-controls" id="controls"></div>
    </section>
  </main>

  <script>
    window.addEventListener("DOMContentLoaded", function () {
      const canvas = document.getElementById("simCanvas");
      const ctx = canvas.getContext("2d");
      const controls = document.getElementById("controls");

      const scenes = [
        {
          title: "1. Two-sided ramp",
          prompt: "Where will the ball rise on the right ramp?",
          caption: "Same height on both sides",
          rightType: "equal",
          correct: "B",
          choices: [
            { id: "A", text: "Lower than start" },
            { id: "B", text: "Same as start" },
            { id: "C", text: "Higher / top" }
          ],
          reveal: "The ball rises to the same vertical height on the other side."
        },
        {
          title: "2. Lower the angle",
          prompt: "The right ramp is less steep. Where will the ball rise now?",
          caption: "Lower angle, longer distance",
          rightType: "shallow",
          correct: "B",
          choices: [
            { id: "A", text: "Lower than start" },
            { id: "B", text: "Same as start" },
            { id: "C", text: "Higher / top" }
          ],
          reveal: "It still reaches the same vertical height, but it travels farther along the ramp."
        },
        {
          title: "3. Make the ramp flat",
          prompt: "Now the right side is flat. What should happen without friction?",
          caption: "Flat surface: inertia",
          rightType: "flat",
          correct: "B",
          choices: [
            { id: "A", text: "Stops soon" },
            { id: "B", text: "Keeps going" }
          ],
          reveal: "If there were no friction, the ball would keep moving on the flat surface."
        }
      ];

      const sim = {
        sceneIndex: 0,
        mode: "predict",
        guess: null,
        progress: 0,
        markers: [],
        lastTime: performance.now(),
        rafId: null
      };

      const START_T = 0.13;

      function currentScene() {
        return scenes[sim.sceneIndex];
      }

      function setFeedback(text) {
        // Feedback is now shown inside the canvas reveal card instead of a separate panel.
      }

      function makeButton(text, className, onClick) {
        const button = document.createElement("button");
        button.textContent = text;
        button.className = className;
        if (onClick) button.addEventListener("click", onClick);
        return button;
      }

      function updatePanel() {
        controls.innerHTML = "";

        if (sim.mode === "predict") {
          controls.appendChild(makeButton("Run Experiment", "primary-btn", runExperiment));
        }

        if (sim.mode === "running") {
          const button = makeButton("Running...", "disabled-btn", null);
          button.disabled = true;
          controls.appendChild(button);
        }

        if (sim.mode === "reveal") {
          controls.appendChild(makeButton("Replay", "secondary-btn", replay));
          controls.appendChild(makeButton(sim.sceneIndex < scenes.length - 1 ? "Change Ramp" : "Finish", "primary-btn", nextScene));
        }

        if (sim.mode === "final") {
          controls.appendChild(makeButton("Start Over", "primary-btn", function () {
            resetScene(0);
          }));
        }
      }

      function resetScene(nextIndex) {
        sim.sceneIndex = nextIndex;
        sim.mode = "predict";
        sim.guess = null;
        sim.progress = 0;
        setFeedback("Make a prediction, or press Run Experiment to watch without recording a guess.");
        updatePanel();
        draw();
      }

      function chooseGuess(choice) {
        if (sim.mode !== "predict") return;
        sim.guess = choice;
        setFeedback("You chose " + choice + ". Now run the experiment.");
        updatePanel();
        draw();
      }

      function runExperiment() {
        if (sim.mode !== "predict") return;
        sim.progress = 0;
        sim.mode = "running";
        sim.lastTime = performance.now();
        setFeedback(sim.guess ? "Running the thought experiment..." : "Running without a recorded guess...");
        updatePanel();
        draw();
      }

      function replay() {
        sim.progress = 0;
        sim.mode = "running";
        sim.lastTime = performance.now();
        setFeedback("Running the thought experiment again...");
        updatePanel();
        draw();
      }

      function nextScene() {
        if (sim.sceneIndex < scenes.length - 1) {
          resetScene(sim.sceneIndex + 1);
        } else {
          sim.mode = "final";
          setFeedback("Galileo's idea: objects keep moving unless a force changes their motion.");
          updatePanel();
          draw();
        }
      }

      function getCanvasSize() {
        const rect = canvas.getBoundingClientRect();
        return {
          w: rect.width || canvas.clientWidth || 900,
          h: rect.height || canvas.clientHeight || 430
        };
      }

      function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        const size = getCanvasSize();
        canvas.width = Math.max(1, Math.round(size.w * dpr));
        canvas.height = Math.max(1, Math.round(size.h * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        draw();
      }

      function clamp01(t) {
        return Math.max(0, Math.min(1, t));
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function easeInQuad(t) {
        return t * t;
      }

      function easeOutQuad(t) {
        return 1 - (1 - t) * (1 - t);
      }

      function getGeometry() {
        const size = getCanvasSize();
        const w = size.w;
        const h = size.h;
        const highY = h * 0.28;
        const leftX = w * 0.13;
        const valleyX = w * 0.37;
        const valleyY = h * 0.72;
        const rightEndX = w * 0.88;
        const rightHighX = currentScene().rightType === "equal" ? w * 0.72 : w * 0.83;

        return {
          w: w,
          h: h,
          baseY: valleyY,
          highY: highY,
          leftX: leftX,
          valleyX: valleyX,
          valleyY: valleyY,
          rightEndX: rightEndX,
          rightHighX: rightHighX,
          rightHighY: highY,
          flatY: valleyY
        };
      }

      function quadraticPoint(p0, p1, p2, t) {
        const u = 1 - t;
        return {
          x: u * u * p0.x + 2 * u * t * p1.x + t * t * p2.x,
          y: u * u * p0.y + 2 * u * t * p1.y + t * t * p2.y
        };
      }

      function leftPathPoint(t) {
        const g = getGeometry();
        return quadraticPoint(
          { x: g.leftX, y: g.highY },
          { x: (g.leftX + g.valleyX) / 2, y: g.valleyY + 10 },
          { x: g.valleyX, y: g.valleyY },
          clamp01(t)
        );
      }

      function leftPathFromStart(t) {
        return leftPathPoint(lerp(START_T, 1, clamp01(t)));
      }

      function startPoint() {
        return leftPathPoint(START_T);
      }

      function rightPathPoint(t) {
        const g = getGeometry();
        const scene = currentScene();

        if (scene.rightType === "equal") {
          return quadraticPoint(
            { x: g.valleyX, y: g.valleyY },
            { x: (g.valleyX + g.rightHighX) / 2, y: g.valleyY + 10 },
            { x: g.rightHighX, y: g.rightHighY },
            clamp01(t)
          );
        }

        if (scene.rightType === "shallow") {
          return quadraticPoint(
            { x: g.valleyX, y: g.valleyY },
            { x: (g.valleyX + g.rightHighX) / 2, y: g.valleyY - 5 },
            { x: g.rightHighX, y: g.rightHighY },
            clamp01(t)
          );
        }

        return {
          x: lerp(g.valleyX, g.rightEndX, clamp01(t)),
          y: g.flatY
        };
      }

      function rightTForStartHeight() {
        const targetY = startPoint().y;
        let bestT = 1;
        let bestDiff = Infinity;

        for (let i = 0; i <= 200; i++) {
          const t = i / 200;
          const p = rightPathPoint(t);
          const diff = Math.abs(p.y - targetY);

          if (diff < bestDiff) {
            bestDiff = diff;
            bestT = t;
          }
        }

        return bestT;
      }

      function ballAt(progress) {
        const scene = currentScene();
        const p = clamp01(progress);

        if (scene.rightType === "flat") {
          if (p < 0.38) {
            return leftPathFromStart(easeInQuad(p / 0.38));
          }

          return rightPathPoint((p - 0.38) / 0.62);
        }

        if (p < 0.5) {
          return leftPathFromStart(easeInQuad(p / 0.5));
        }

        const targetT = rightTForStartHeight();
        return rightPathPoint(targetT * easeOutQuad((p - 0.5) / 0.5));
      }

      function samplePath(fn, n) {
        const points = [];

        for (let i = 0; i <= n; i++) {
          points.push(fn(i / n));
        }

        return points;
      }

      function drawRampLine(points, color, width) {
        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        ctx.beginPath();

        points.forEach(function (p, i) {
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        });

        ctx.stroke();
        ctx.restore();
      }

      function drawBall(contactX, contactY, r, alpha) {
        const cx = contactX;
        const cy = contactY - r;

        ctx.save();
        ctx.globalAlpha = alpha;

        const grad = ctx.createRadialGradient(
          cx - r * 0.35,
          cy - r * 0.45,
          r * 0.1,
          cx,
          cy,
          r
        );

        grad.addColorStop(0, "#fff7b8");
        grad.addColorStop(0.3, "#fde047");
        grad.addColorStop(0.65, "#f59e0b");
        grad.addColorStop(1, "#7c2d12");

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.lineWidth = 2;
        ctx.strokeStyle = "rgba(15,23,42,.75)";
        ctx.stroke();
        ctx.restore();
      }

      function getChoiceMarkers() {
        const g = getGeometry();
        const ballR = Math.max(10.5, g.w * 0.01725);
        const scene = currentScene();

        if (scene.rightType === "flat") {
          const a = rightPathPoint(0.18);
          const b = rightPathPoint(0.76);

          return [
            { id: "A", label: "A", text: "Stops soon", x: a.x, y: a.y - ballR, r: 18 },
            { id: "B", label: "B", text: "Keeps going", x: b.x, y: b.y - ballR, r: 18 }
          ];
        }

        const bT = rightTForStartHeight();
        const a = rightPathPoint(Math.max(0.12, bT - 0.28));
        const b = rightPathPoint(bT);
        const c = rightPathPoint(0.98);

        return [
          { id: "A", label: "A", x: a.x, y: a.y - ballR, r: 18 },
          { id: "B", label: "B", x: b.x, y: b.y - ballR, r: 18 },
          { id: "C", label: "C", x: c.x, y: c.y - ballR, r: 18 }
        ];
      }

      function drawMarker(marker) {
        const selected = sim.guess === marker.id;
        const showCorrect = sim.mode !== "predict" && marker.id === currentScene().correct;
        ctx.save();
        ctx.fillStyle = showCorrect ? "#dcfce7" : selected ? "#dbeafe" : "#ffffff";
        ctx.strokeStyle = showCorrect ? "#16a34a" : selected ? "#2563eb" : "#64748b";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(marker.x, marker.y, marker.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = showCorrect ? "#166534" : "#0f172a";
        ctx.font = "bold 18px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(marker.label, marker.x, marker.y + 1);

        if (marker.text) {
          ctx.fillStyle = "#334155";
          ctx.font = "13px system-ui, sans-serif";
          ctx.fillText(marker.text, marker.x, marker.y - 28);
        }
        ctx.restore();
      }

      function drawHeightLine() {
        if (currentScene().rightType === "flat") return;
        const g = getGeometry();
        ctx.save();
        ctx.strokeStyle = "#64748b";
        ctx.setLineDash([10, 8]);
        ctx.lineWidth = 2;
        ctx.beginPath();
        const start = startPoint();
        ctx.moveTo(g.leftX + 20, start.y);
        ctx.lineTo(g.rightEndX + 10, start.y);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
      }

      function roundedRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      function wrapText(text, maxWidth) {
        const words = text.split(" ");
        const lines = [];
        let line = "";
        words.forEach(function (word) {
          const test = line + word + " ";
          if (ctx.measureText(test).width > maxWidth && line.length > 0) {
            lines.push(line.trim());
            line = word + " ";
          } else {
            line = test;
          }
        });
        lines.push(line.trim());
        return lines;
      }

      function drawRevealBox() {
        if (sim.mode !== "reveal" && sim.mode !== "final") return;
        const scene = currentScene();
        const g = getGeometry();
        const boxW = g.w * 0.72;
        const boxH = 68;
        const boxX = (g.w - boxW) / 2;
        const boxY = g.h - boxH - 18;
        ctx.save();
        ctx.fillStyle = "rgba(255,255,255,.94)";
        ctx.strokeStyle = "#93c5fd";
        ctx.lineWidth = 2;
        roundedRect(boxX, boxY, boxW, boxH, 16);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#0f172a";
        ctx.font = "bold 17px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "alphabetic";
        wrapText(scene.reveal, boxW - 40).slice(0, 2).forEach(function (line, i) {
          ctx.fillText(line, boxX + boxW / 2, boxY + 27 + i * 22);
        });
        ctx.restore();
      }

      function drawMotionGhosts() {
        if (sim.mode !== "running" && sim.mode !== "reveal" && sim.mode !== "final") return;
        const g = getGeometry();
        const ballR = Math.max(10.5, g.w * 0.01725);
        const count = 5;
        for (let i = 1; i <= count; i++) {
          const p = Math.max(0, sim.progress - i * 0.055);
          if (p <= 0) continue;
          const pt = ballAt(p);
          drawBall(pt.x, pt.y, ballR, 0.16);
        }
      }

      function draw() {
        const scene = currentScene();
        const g = getGeometry();
        const ballR = Math.max(10.5, g.w * 0.01725);

        ctx.clearRect(0, 0, g.w, g.h);

        const bg = ctx.createLinearGradient(0, 0, 0, g.h);
        bg.addColorStop(0, "#f8fafc");
        bg.addColorStop(1, "#eef6ff");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, g.w, g.h);

        ctx.fillStyle = "#0f172a";
        ctx.font = "bold 24px system-ui, sans-serif";
        ctx.textAlign = "start";
        ctx.textBaseline = "alphabetic";
        ctx.fillText(scene.title, g.w * 0.04, 36);

        ctx.fillStyle = "#334155";
        ctx.font = "16px system-ui, sans-serif";
        ctx.fillText(scene.caption, g.w * 0.04, 62);

        ctx.strokeStyle = "rgba(15,23,42,.18)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(g.w * 0.07, g.baseY + 36);
        ctx.lineTo(g.w * 0.94, g.baseY + 36);
        ctx.stroke();

        drawHeightLine();

        const leftPts = samplePath(leftPathPoint, 40);
        const rightPts = samplePath(rightPathPoint, scene.rightType === "flat" ? 14 : 40);
        const rampPts = leftPts.concat(rightPts);

        drawRampLine(rampPts, "rgba(148,163,184,.35)", 13);
        drawRampLine(rampPts, "#111827", 6);

        sim.markers = getChoiceMarkers();
        sim.markers.forEach(drawMarker);


        const ballPoint = sim.mode === "predict" ? startPoint() : ballAt(sim.progress);
        drawBall(ballPoint.x, ballPoint.y, ballR, 1);

        drawRevealBox();
      }

      function endRun() {
        const scene = currentScene();
        sim.mode = "reveal";
        if (!sim.guess) {
          setFeedback(scene.reveal);
        } else if (sim.guess === scene.correct) {
          setFeedback("Correct. " + scene.reveal);
        } else {
          setFeedback("Not quite. " + scene.reveal);
        }
        updatePanel();
        draw();
      }

      function animate(now) {
        const dt = Math.min(0.05, Math.max(0, (now - sim.lastTime) / 1000));
        sim.lastTime = now;

        if (sim.mode === "running") {
          const scene = currentScene();
          const speed = scene.rightType === "flat" ? 0.55 : 0.62;
          sim.progress = Math.min(1, sim.progress + dt * speed);
          if (sim.progress >= 1) endRun();
        }

        draw();
        sim.rafId = requestAnimationFrame(animate);
      }

      function pointerPosition(event) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: event.clientX - rect.left,
          y: event.clientY - rect.top
        };
      }

      canvas.addEventListener("pointerdown", function (event) {
        if (sim.mode !== "predict") return;
        const pos = pointerPosition(event);
        const hit = sim.markers.find(function (m) {
          return Math.hypot(pos.x - m.x, pos.y - m.y) <= m.r + 10;
        });
        if (hit) chooseGuess(hit.id);
      });

      window.addEventListener("resize", resizeCanvas);

      if (window.ResizeObserver) {
        const observer = new ResizeObserver(resizeCanvas);
        observer.observe(canvas);
      }

      resetScene(0);
      resizeCanvas();
      sim.rafId = requestAnimationFrame(animate);
    });
  </script>
</body>
</html>
