<html lang="en">

  <title>Circus Act: Complementary Angles</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #f1f5f9;
    }
    body {
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: Arial, Helvetica, sans-serif;
    }
    @media (max-width: 760px) {
      body { padding: 10px; }
    }
  </style>

<style>
/* Base Styles adapted from Castle Launch */
.rh {
  --blue: #28609f;
  --dark: #173f66;
  --bg: #edf5fb;
  --line: #d7e2ef;
  --text: #1f2937;
  --muted: #64748b;
  /* Circus specific colors */
  --circus-red: #ef4444;
  --circus-yellow: #f59e0b;
  --circus-blue: #3b82f6;
  
  max-width: 1260px;
  margin: auto;
  padding: 10px;
  border-radius: 20px;
  background: var(--blue);
  font-family: Arial, Helvetica, sans-serif;
  color: var(--text);
  width: 100%
}
.rh, .rh * { box-sizing: border-box; }
.rh button { font: inherit; cursor: pointer; transition: .2s; }
.rh .card { background: #fff; border-radius: 18px; overflow: hidden; box-shadow: 0 12px 30px #0f172a22; }

/* Scene Setup */
.rh .scene {
  position: relative;
  aspect-ratio: 2/1;
  min-height: 400px;
  overflow: hidden;
  background: linear-gradient(var(--bg) 0 88%, #cbd5e1 88%); /* Ground start slightly lower */
}
/* Grid background */
.rh .scene:before {
  content: ""; position: absolute; inset: 0;
  background-image: linear-gradient(#0f172a12 1px, transparent 1px), linear-gradient(90deg, #0f172a12 1px, transparent 1px);
  background-size: 48px 48px; opacity: .35;
}

/* UI Elements mimicking original style */
.rh .board {
  position: absolute; right: 1%; top: 2%; z-index: 2;
  padding: 10px 14px; border: 2px solid #94a3b8; border-radius: 12px;
  background: #dbeafe; font-weight: 800; font-size: clamp(1rem, 1.8vw, 1.15rem);
  color: var(--dark); text-align: center;
}
.rh .ground { position: absolute; left: 0; right: 0; bottom: 12%; z-index: 1; border-top: 2px solid #47556955; }

/* Circus Elements */
.rh .circus-bg {
  position: absolute; left: 0; top: 0; width: 100%; height: 88%;
  background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0h30v30H0zM30 30h30v30H30z' fill='%23d7e2ef' fill-opacity='.4'/%3E%3C/svg%3E");
  opacity: 0.5;
}

/* Cannon Styling */
.rh .cannon-container { position: absolute; left: 5%; width: 120px; height: 160px; overflow: visible; }
.rh .cannon-stand { position: absolute; bottom: 0; left: 35px; width: 50px; height: 100px; background: #1e293b; border-radius: 8px; z-index: 1; }
.rh .cannon-back, .rh .cannon-front { position: absolute; left: 0; width: 100%; height: 100%; overflow: visible; }
.rh .cannon-back { z-index: 2; }
.rh .cannon-front { z-index: 4; }
.rh .c1 { bottom: 0; top: auto; }
.rh .c2 { bottom: 100px; top: auto; }

/* SVG Theming */
.rh .c1 .v-barrel { fill: #fac32b; }
.rh .c1 .v-muzzle { fill: #e64a45; }
.rh .c1 .v-band { fill: #1598a1; }

.rh .c2 .v-barrel { fill: #3b82f6; }
.rh .c2 .v-muzzle { fill: #fac32b; }
.rh .c2 .v-band { fill: #e64a45; }

/* Landing Area */
.rh .landing-net-container {
  position: absolute; z-index: 2; width: 140px; height: 12px;
  transition: left 0.4s ease, opacity 0.5s;
}
.rh .landing-net {
  width: 100%; height: 100%;
  background-image: repeating-linear-gradient(45deg, #000 0 2px, transparent 2px 8px), repeating-linear-gradient(-45deg, #000 0 2px, #fff 2px 8px);
  border: 3px solid #b45309; border-radius: 4px;
}
.rh .net-leg { position: absolute; top: 100%; width: 4px; height: 25px; background: #64748b; }
.rh .net-leg.left { left: 10px; }
.rh .net-leg.right { right: 10px; }

/* Projectile: Acrobat */
.rh .acrobat {
  position: absolute; z-index: 3; width: 122px; height: 122px;
  font-size: 120px; display: flex; align-items: center; justify-content: center;
  will-change: transform, left, top;
  opacity: 0;
}
.rh .acrobat.show { opacity: 1; }

/* Acrobat SVG Styling */
.rh .acrobat-svg { width: 100%; height: 100%; }
.rh .acrobat-svg .skin { fill: #e7b785; stroke: #e7b785; }
.rh .acrobat-svg .belt { fill: #e7bb2f; }
.rh .acrobat-svg .boot { fill: #3b2228; }
.rh .acrobat-svg .hair { fill: #2d2330; }
.rh .acrobat-svg .arm { fill: none; stroke: #e7b785; stroke-width: 46; stroke-linecap: round; stroke-linejoin: round; }
.rh .acrobat-svg .joint { fill: #e7b785; }
.rh .acrobat-svg .eyeWhite { fill: #ffffff; }
.rh .acrobat-svg .pupil { fill: #4b2a22; }
.rh .acrobat[data-projectile="1"] .suit { fill: #b43232; }
.rh .acrobat[data-projectile="2"] .suit { fill: var(--circus-blue); }

/* SVG Paths matching original style */
.rh svg { position: absolute; inset: 0; z-index: 7; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.rh .path-preview { fill: none; stroke-width: 3; stroke-dasharray: 8 8; opacity: 0; transition: opacity 0.3s; }
.rh .cannon.c1 + svg .path-preview { stroke: var(--circus-red); }
.rh .cannon.c2 + svg .path-preview { stroke: var(--circus-blue); }
.rh .path-flight { fill: none; stroke: #28609fb8; stroke-width: 4; stroke-linecap: round; opacity: 0; }

/* Control Sliders split into mini panels */
.rh .mini-panel {
  position: absolute; z-index: 10;
  background: #fffffff5; border: 2px solid #28609f38; border-radius: 12px;
  padding: 10px 14px; box-shadow: 0 10px 20px #0f172a15;
}
.rh .mini-panel.p1 { left: 5%; bottom: 2%; width: 160px; }
.rh .mini-panel.p2 { left: 2%; top: 120px; bottom: auto; width: 190px; display: none; opacity: 0; transition: opacity 0.3s; }
.rh.challenge .mini-panel.p2, .rh.done .mini-panel.p2 { display: block; opacity: 1; }
.rh .control-row { margin-bottom: 0; }
.rh label { display: flex; justify-content: space-between; font-weight: 700; color: var(--muted); margin-bottom: 6px; font-size: 0.85rem; }
.rh label span { color: var(--dark); }
.rh .fixed-tag { font-size: 0.8rem; color: var(--muted); font-weight: 600; text-align: center; background: #e2e8f0; border-radius: 6px; padding: 4px; }

/* Range Slider Styling */
.rh input[type=range] { width: 100%; cursor: pointer; margin: 0; }

/* Main Button Bar */
.rh .bar { position: absolute; left: 50%; transform: translateX(-50%); bottom: 2%; z-index: 21; display: flex; gap: 10px; }
.rh .main-btn {
  border: 0; border-radius: 14px; padding: 12px 24px;
  font-weight: 800; background: var(--blue); color: #fff;
  font-size: 1.1rem; box-shadow: 0 4px 6px #0002;
}
.rh .main-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 12px #0f172a24; }
.rh .main-btn:disabled { background: #94a3b8; cursor: not-allowed; transform: none; opacity: 0.7; }

/* Instructional Banner */
.rh .banner {
  position: absolute; left: 2%; top: 2%; transform: none; z-index: 20;
  width: auto; max-width: 250px; padding: 12px 14px;
  border: 2px solid #28609f38; border-radius: 14px;
  background: #fffffff5; box-shadow: 0 8px 16px #0f172a15; text-align: left;
}
.rh .banner h3 { margin: 0 0 6px; color: var(--dark); font-size: 1.05rem; }
.rh .banner p { margin: 0; color: var(--muted); line-height: 1.3; font-size: 0.85rem; }
.rh .banner .phys-data { display: inline-block; background: #e2e8f0; padding: 4px 8px; border-radius: 6px; font-weight: bold; color: var(--dark); margin-bottom: 6px; font-size: 0.85rem; margin-right: 4px; }

/* Feedback Box */
.rh .fb {
  position: absolute; right: 2%; top: 2%; z-index: 20;
  width: 280px; padding: 20px;
  border-radius: 0; border: 3px solid transparent;
  line-height: 1.5; font-size: 0.95rem; display: none;
  background: #fffffff5; box-shadow: 0 12px 24px #0f172a1f;
}
.rh .fb strong { display: block; margin-bottom: 8px; color: var(--dark); font-size: 1.15rem; }
.rh .fb.good { border-color: #0f766e; background: #ecfdf5f9; color: #0f766e; }
.rh .fb.bad { border-color: #b45309; background: #fff7edf9; color: #b45309; }

/* Mobile Adjustments */
@media(max-width:760px){
  .rh .scene { aspect-ratio: 1/1; min-height: 450px; }
  .rh .banner { width: auto; max-width: 200px; padding: 10px; }
  .rh .mini-panel.p1 { left: 2%; bottom: 2%; width: 140px; }
  .rh .mini-panel.p2 { left: 2%; top: 115px; width: 160px; padding: 8px; }
  .rh .fb { top: calc(2% + 90px); right: 2%; width: 96%; padding: 15px; }
  .rh .landing-net { right: 5%; width: 100px; }
}
</style>

<script>
(()=>{
  // scope within reference element
  const root = document.currentScript.previousElementSibling;
  if(!root?.matches('[data-rh]')) return;
  const $ = q => root.querySelector(q);
  const $$ = q => [...root.querySelectorAll(q)];

  const scene = $('[data-scene]');
  const cannonContainer = $('.cannon-container');
  const mainBtn = $('[data-main]');
  const text = $('[data-text]');
  const net = $('[data-net]');
  const fb = $('[data-fb]');
  const pathsFlight = [null, $('[data-path="flight1"]'), $('[data-path="flight2"]')];
  const projs = [null, $('[data-projectile="1"]'), $('[data-projectile="2"]')];
  const pathsPre = [null, $('[data-path="preview1"]'), $('[data-path="preview2"]')];
  const sliders = $$('input[type=range]');
  const visualsFront = [null, $('[data-cannon-visual="1"]'), $('[data-cannon-visual="2"]')];
  const visualsBack = [null, $('.cannon-back.c1'), $('.cannon-back.c2')];
  const valDisplays = [null, $('#val1'), $('#val2')];

  // Config
  const CONFIG = {
    projSize: 122
  };

  let L = {}; // Layout physics constants
  let busy = false;
  let landingX = [0, 0, 0];
  let fixedAngle = 30; // Will be randomized per setup
  let currentV0 = 15; // Random 15-20 m/s
  let state = 'setup';

  const G_PHYS = 9.8;
  const getPhysRange = (angle) => ((currentV0 * currentV0 * Math.sin(2 * angle * Math.PI / 180)) / G_PHYS).toFixed(1);

  function put(el, x, y) {
    el.style.left = (x - CONFIG.projSize/2) + 'px';
    el.style.top = (y - CONFIG.projSize/2) + 'px';
  }

  // Calculate pixel-based ground and origin based on current scene size
  function layout() {
    const sr = scene.getBoundingClientRect();
    const groundY = sr.height * 0.88; // Matches background css
    
    const cannonBaseX = sr.width * 0.05 + 60; // 5% + half of 120px width
    
    // Restore physics origin to previous height (center of mass)
    const originY1 = groundY - 50; 
    const originY2 = originY1 - 100; // Cannon 2 is 100px higher

    // Dynamic physics to ensure perfectly matching complementary curves
    // and responsive scaling
    const g = sr.height * 2; 
    const maxRange = sr.width * 0.70; 
    const v0 = Math.sqrt(maxRange * g);

    // Sync cannon visual position so pivot aligns with physics origin
    if (cannonContainer) {
      cannonContainer.style.top = (originY1 - 110) + 'px';
    }

    return {
      w: sr.width, h: sr.height,
      gy: groundY,
      ox: cannonBaseX, 
      oy1: originY1, 
      oy2: originY2,
      targetY1: originY1,
      targetY2: originY2, // Acrobat 2 target is 100px higher, making the physics perfectly complement
      g: g, v0: v0
    };
  }

  // Get position at time t (seconds)
  const pos = (id, angleRad, t) => {
    const oy = id === 1 ? L.oy1 : L.oy2;
    return {
      x: L.ox + L.v0 * Math.cos(angleRad) * t,
      y: oy - (L.v0 * Math.sin(angleRad) * t - 0.5 * L.g * t * t)
    };
  };

  function getFlightData(id, angleDeg, fallToGround = false) {
    const angleRad = angleDeg * (Math.PI / 180);
    const oy = id === 1 ? L.oy1 : L.oy2;
    
    // If they miss the net, they fall to the ground (L.gy - 30 keeps them visually laying on the grass)
    const targetY = fallToGround ? (L.gy - 30) : (id === 1 ? L.targetY1 : L.targetY2);
    
    // 0.5 * g * t^2 - v0y * t + (oy - targetY) = 0
    const v0y = L.v0 * Math.sin(angleRad);
    const a = 0.5 * L.g;
    const b = -v0y;
    const c = oy - targetY;
    
    const discriminant = b*b - 4*a*c;
    const time = (-b + Math.sqrt(discriminant)) / (2*a);
    const range = L.v0 * Math.cos(angleRad) * time;
    
    return { time, angleRad, range, hitX: L.ox + range, hitY: targetY };
  }

  // Draw SVG trajectory
  function updatePreview(id, angleDeg) {
    if(busy) return;
    const data = getFlightData(id, angleDeg);
    landingX[id] = data.hitX;

    const steps = 30;
    const oy = id === 1 ? L.oy1 : L.oy2;
    let d = `M ${L.ox} ${oy}`;
    for(let i=1; i<=steps; i++) {
      const p = pos(id, data.angleRad, data.time * (i/steps));
      d += ` L ${p.x} ${p.y}`;
    }
    
    pathsPre[id].setAttribute('d', d);
    pathsPre[id].style.opacity = 0.5;
  }

  function updateCannonVisual(id, angleDeg) {
    // CSS rotation: 0deg is vertical. Input 90 is horizontal.
    // CSS rot = 90 - inputAngle
    const rot = `rotate(${-angleDeg}deg)`;
    visualsFront[id].querySelector('.barrel-assembly').style.transform = rot;
    visualsBack[id].querySelector('.barrel-assembly').style.transform = rot;
    valDisplays[id].textContent = angleDeg;
  }

  function setAcrobatReady(id, angleDeg) {
    if (!L.v0) return; // guard against early initialization
    const proj = projs[id];
    const angleRad = angleDeg * (Math.PI / 180);
    
    // Increased offset so the head pokes fully out of the black hole
    const R_OFFSET = 85; 
    const tOffset = R_OFFSET / L.v0;
    const curPos = pos(id, angleRad, tOffset);
    
    put(proj, curPos.x, curPos.y);
    proj.style.transform = `rotate(${90 - angleDeg}deg)`;
    proj.style.zIndex = "3"; // Tuck them between cannon back (2) and front (4)
    proj.classList.add('show');
  }

  // Handle slider interaction
  sliders.forEach(slider => {
    slider.addEventListener('input', (e) => {
      if(busy) return;
      fb.style.display = 'none'; // Hide feedback on change
      pathsFlight.forEach(p => p && (p.style.opacity = 0)); // Hide old flight paths
      const id = parseInt(e.target.dataset.cannon);
      const angle = parseInt(e.target.value);
      L = layout(); // update layout in case of resize
      updateCannonVisual(id, angle);
      updatePreview(id, angle);
      setAcrobatReady(id, angle); // Instantly update their head tilt
    });
  });

  function adjustNet() {
    // Place net exactly at Cannon 1's fixed landing spot
    const data1 = getFlightData(1, fixedAngle);
    net.style.left = (data1.hitX - 70) + 'px'; // Center 140px wide net
    // Align net to the acrobats' feet (center + 61px - offset for beam height)
    net.style.top = (L.oy1 + 55) + 'px'; 
  }

  // Animation helper
  function animate(ms, fn) {
    const t0 = performance.now();
    return new Promise(res => {
      function step(now) {
        if (!busy) return res(); // Early exit if cancelled
        let p = Math.min(1, (now - t0) / ms);
        fn(p);
        p < 1 ? requestAnimationFrame(step) : res();
      }
      requestAnimationFrame(step);
    });
  }

  async function launchAcrobat(id, angleDeg, fallToGround = false) {
    const proj = projs[id];
    const data = getFlightData(id, angleDeg, fallToGround);
    
    // Setup flight path visibility. 
    // Draw path dynamically so it includes the full fall to the ground if they missed!
    const steps = 30;
    const oy = id === 1 ? L.oy1 : L.oy2;
    let d = `M ${L.ox} ${oy}`;
    for(let i=1; i<=steps; i++) {
      const pPath = pos(id, data.angleRad, data.time * (i/steps));
      d += ` L ${pPath.x} ${pPath.y}`;
    }
    pathsFlight[id].setAttribute('d', d);
    pathsFlight[id].style.opacity = 0.3;
    pathsFlight[id].style.stroke = visualsFront[id].classList.contains('c1') ? CONFIG.colors.c1 : CONFIG.colors.c2;

    const startRot = 90 - angleDeg;
    const endRot = 720; // 2 full spins, landing upright at 0/360/720 degrees

    // Math to ensure they don't visually "jump" from the muzzle back to the pivot
    const R_OFFSET = 85;
    const tOffset = R_OFFSET / L.v0; 
    const remainingTime = data.time - tOffset;
    const durationMs = remainingTime * 1000;
    const tClear = 140 / L.v0; // Time it takes to fully clear the cannon barrel

    await animate(durationMs, (p) => {
      const t = tOffset + p * remainingTime;
      const curPos = pos(id, data.angleRad, t);
      put(proj, curPos.x, curPos.y);
      
      // Bring them to the front layer once they shoot out of the barrel
      if (t > tClear) proj.style.zIndex = "5"; 
      
      // Calculate dynamic cartwheel spin
      const currentRot = startRot + p * (endRot - startRot);
      proj.style.transform = `rotate(${currentRot}deg)`;
    });
    
    // Keep proj at landing spot
    if (fallToGround) {
      proj.style.transform = `rotate(90deg)`; // Knocked over on the ground
    } else {
      proj.style.transform = `rotate(0deg)`; // Standing upright
    }
    put(proj, data.hitX, data.hitY); 
  }

  async function playSetup() {
    if(busy) return;
    busy = true; mainBtn.disabled = true;
    
    // Launch just the baseline acrobat
    await launchAcrobat(1, fixedAngle);
    
    busy = false; mainBtn.disabled = false;
    screenMode('challenge');
  }

  async function testAct() {
    if (busy) return;
    busy = true;
    mainBtn.disabled = true;
    sliders.forEach(s => s.disabled = true);
    fb.style.display = 'none';
    
    L = layout();
    adjustNet();
    
    const a1 = fixedAngle; // Cannon 1 is fixed
    const a2 = parseInt(sliders[0].value); // Cannon 2 is adjustable
    
    // Reset positions to tuck back in cannons
    setAcrobatReady(1, a1);
    setAcrobatReady(2, a2);
    
    // Tiny pause for visual reset effect
    await new Promise(r => setTimeout(r, 200));
    
    const sum = a1 + a2;
    const success = (sum === 90);
    const collision = (a1 === a2);
    const missNet = !success && !collision;

    // Hide previews
    pathsPre.forEach(p => p && (p.style.opacity = 0));

    // Launch sequence
    net.style.opacity = success ? 1 : 0.3; // Dim net if miss implied
    
    // Launch both simultaneously
    await Promise.all([
      launchAcrobat(1, a1, false),
      launchAcrobat(2, a2, missNet) // Pass missNet to determine if Acrobat 2 falls to ground
    ]);

    // If interrupted by resize, stop early
    if (!busy) return;

    // Results logic
    busy = false;
    mainBtn.disabled = false;
    sliders.forEach(s => s.disabled = false);

    // Calculate exact mathematical data (target height) for the range check
    const data1 = getFlightData(1, a1);
    const data2Target = getFlightData(2, a2);
    const diff = Math.abs(data1.hitX - data2Target.hitX);
    const threshold = 15; // px overlap threshold
    
    const r1 = getPhysRange(a1);
    const r2 = getPhysRange(a2);

    if (success && diff < threshold) {
      // Acrobat 2 lands perfectly at targetY2 (which is 100px higher, beautifully stacking on the shoulders)
      put(projs[2], data2Target.hitX, L.targetY2);
      fb.className = 'fb good';
      fb.innerHTML = `<strong>Perfect Sync!</strong>Cannon 1 Range: <b>${r1} m</b><br>Cannon 2 Range: <b>${r2} m</b><br><br>The ranges match exactly! What pattern do you notice about the two successful angles (${a1}° and ${a2}°)?`;
    } else if (collision) {
      // Crash! Ranges match, but identical times of flight mean a mid-air collision!
      put(projs[2], data2Target.hitX + 40, L.targetY1); // Drop Acrobat 2 to the net, offset slightly
      projs[1].style.transform = 'rotate(-90deg)'; // Knock acrobat 1 over
      projs[2].style.transform = 'rotate(90deg)';  // Knock acrobat 2 over
      fb.className = 'fb bad';
      fb.innerHTML = `<strong>Mid-Air Collision!</strong>Cannon 1 Range: <b>${r1} m</b><br>Cannon 2 Range: <b>${r2} m</b><br><br>The ranges match perfectly, but identical angles mean identical flight times! They arrived at the exact same moment. One acrobat must arrive early to catch the other. Can you find the <em>other</em> angle that gives this same range?`;
    } else {
      fb.className = 'fb bad';
      fb.innerHTML = `<strong>Act Failed.</strong>Cannon 1 Range: <b>${r1} m</b><br>Cannon 2 Range: <b>${r2} m</b><br><br>The acrobats landed in different spots. Try to find the angle that produces the exact same range!`;
    }
    fb.style.display = 'block';
    
    screenMode('done');
  }

  function screenMode(next) {
    state = next;
    root.className = `rh ${next}`;
    
    if (next === 'setup') {
      fixedAngle = Math.floor(Math.random() * 11) + 25; // Random 25-35
      currentV0 = Math.floor(Math.random() * 6) + 15; // Random 15-20
      $('#val1').textContent = fixedAngle;
      
      L = layout();
      
      // Hide second acrobat entirely
      projs[2].classList.remove('show');
      pathsPre.forEach(p => p && (p.style.opacity = 0));
      pathsFlight.forEach(p => p && (p.style.opacity = 0));
      
      updateCannonVisual(1, fixedAngle);
      setAcrobatReady(1, fixedAngle);
      
      text.innerHTML = `<h3>Baseline Shot</h3><div class="phys-data">v₀ = ${currentV0} m/s</div><p>Fire lower cannon to set target.</p>`;
      mainBtn.textContent = 'Fire Baseline';
      fb.style.display = 'none';
      sliders.forEach(s => s.disabled = false);
      
      adjustNet();
    } 
    else if (next === 'challenge') {
      // Initialize adjustable Cannon 2 UI
      const a2 = parseInt(sliders[0].value);
      updateCannonVisual(2, a2);
      updatePreview(2, a2);
      setAcrobatReady(2, a2);
      
      text.innerHTML = `<h3>Find Match</h3><div class="phys-data">v₀ = ${currentV0} m/s</div><div class="phys-data">Target: ${getPhysRange(fixedAngle)}m</div><p>Adjust Cannon 2 to match.</p>`;
      mainBtn.textContent = 'Test Act!';
    }
    else if (next === 'done') {
      text.innerHTML = `<h3>Act Complete</h3><div class="phys-data">v₀ = ${currentV0} m/s</div>`;
      mainBtn.textContent = 'Next Act';
    }
  }

  mainBtn.addEventListener('click', () => {
    if (state === 'setup') playSetup();
    else if (state === 'challenge') testAct();
    else if (state === 'done') screenMode('setup');
  });

  // Init
  addEventListener('resize', () => {
    if (busy) return; // let animation finish, or handle interrupt cleanly
    L = layout();
    adjustNet();
    
    if (state === 'setup') {
      updateCannonVisual(1, fixedAngle);
      setAcrobatReady(1, fixedAngle);
    } else {
      // restore both
      updateCannonVisual(1, fixedAngle);
      updateCannonVisual(2, parseInt(sliders[0].value));
      // Acrobats are at destination, don't move them unless requested
    }
  });

  function initScene() {
    CONFIG.colors = {
      c1: getComputedStyle(root).getPropertyValue('--circus-red'),
      c2: getComputedStyle(root).getPropertyValue('--circus-blue')
    };
    
    screenMode('setup');
  }

  initScene();

})();
</script>
</body>
