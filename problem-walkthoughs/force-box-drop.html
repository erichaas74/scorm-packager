<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Force Stop Challenge</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f4f6f8; color: #1f2937; }
    .app { max-width: 980px; margin: 14px auto; padding: 10px 14px; }

    .levelBar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .levelLabel { font-size: 13px; font-weight: 700; color: #475569; }
    .lvlBtn {
      width: 38px; height: 38px; border-radius: 50%;
      border: 2px solid #cbd5e1; background: #fff;
      font-weight: 700; font-size: 14px; cursor: pointer; color: #64748b;
      transition: all 0.15s;
    }
    .lvlBtn:hover { border-color: #2563eb; color: #2563eb; }
    .lvlBtn.active { background: #2563eb; border-color: #2563eb; color: #fff; }
    .hintBadge {
      font-size: 11px; font-weight: 700; background: #fef3c7; color: #92400e;
      border: 1px solid #fcd34d; border-radius: 999px; padding: 3px 9px;
    }

    .canvasWrap { position: relative; width: 100%; }
    canvas {
      width: 100%; height: auto; background: #fff;
      border: 1px solid #cfd8e3; border-radius: 14px; display: block;
      cursor: crosshair; touch-action: none;
    }

    .controls { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    button.ctrl {
      border: 0; border-radius: 8px; padding: 8px 16px;
      font-weight: 700; cursor: pointer; font-size: 13px;
      box-shadow: 0 1px 4px rgba(15,23,42,0.14);
    }
    button.ctrl.blue  { background: #2563eb; color: #fff; }
    button.ctrl.light { background: #e5e7eb; color: #1f2937; }

    .tip {
      font-size: 12px; color: #64748b; margin-top: 5px; line-height: 1.5;
    }
  </style>
</head>
<body>
<div class="app">
  <div class="levelBar">
    <span class="levelLabel">Level:</span>
    <button class="lvlBtn active" data-level="0">1</button>
    <button class="lvlBtn" data-level="1">2</button>
    <button class="lvlBtn" data-level="2">3</button>
    <button class="lvlBtn" data-level="3">4</button>
    <span class="hintBadge" id="hintBadge">★ Hint on</span>
  </div>

  <div class="canvasWrap">
    <canvas id="c" width="940" height="520"></canvas>
  </div>

  <div class="controls">
    <button class="ctrl blue"  id="launchBtn">Launch</button>
    <button class="ctrl light" id="resetBtn">Reset</button>
    <button class="ctrl light" id="clearBtn">Clear forces</button>
  </div>
  <p class="tip">
    Each level starts with a given force arrow already on the puck. Click the puck to add more &rarr;
    drag an arrowhead to set magnitude &amp; direction &rarr; double-click an arrowhead to remove it.
  </p>
</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

// ── constants ──────────────────────────────────────────────────────────────
const BOX   = { w: 82, h: 28 };
const TY    = 335;                      // track y
const FS    = 4;                        // force → acceleration scale (px/s² per N)
const AS    = 6;                        // force → arrow length scale (px per N)
const LIP_H = 11;
const LIP_W = 14;
const LIP_LAUNCH = 90;                  // upward px/s when launched over lip
const MAX_N = 30;
const HIT_R = 14;                       // arrowhead grab radius px

const COLORS = ['#dc2626','#2563eb','#16a34a','#d97706','#7c3aed','#0891b2'];

const LEVELS = [
  { sx: 130, tx: 600, wt: 10, hint: true,  lip: 90, initForces: [10]       },
  { sx: 130, tx: 600, wt: 10, hint: false, lip: 90, initForces: [15]       },
  { sx: 760, tx: 285, wt: 10, hint: false, lip: 90, initForces: [-12]      },
  { sx: 155, tx: 520, wt: 10, hint: false, lip: 65, initForces: [12, 5]    },
];

// ── state ──────────────────────────────────────────────────────────────────
let lvlIdx   = 0;
let box      = {};
let forces   = [];          // [{id, fx, color}]
let nid      = 0;
let drag     = null;        // {idx, isNew}
let running  = false;
let done     = false;
let lastT    = 0;
let flash    = 0;
let msg      = '';
let trail    = [];          // ghost trail points

// ── setup ──────────────────────────────────────────────────────────────────
function setup(clearF) {
  const lvl = LEVELS[lvlIdx];
  document.getElementById('hintBadge').style.display = lvl.hint ? 'inline' : 'none';
  running = false; done = false; lastT = 0; flash = 0; trail = [];
  box = { x: lvl.sx, y: TY - BOX.h/2, vx: 0, vy: 0, captured: false, flight: false, over: false };
  if (clearF) {
    forces = []; nid = 0;
    for (const fx of lvl.initForces) {
      forces.push({ id: nid, fx, color: COLORS[nid % COLORS.length] });
      nid++;
    }
  }
  msg = 'A force is already applied — add more arrows to control the puck, then Launch.';
  draw();
}

// ── geometry helpers ───────────────────────────────────────────────────────
function pit() {
  const lvl = LEVELS[lvlIdx];
  return { L: lvl.tx - BOX.w/2, R: lvl.tx + BOX.w/2, top: TY+2, bot: TY+2+BOX.h+2 };
}

function normal(bx) {
  const p = pit();
  return (bx >= p.L && bx <= p.R) ? 0 : LEVELS[lvlIdx].wt;
}

function netFx() { return forces.reduce((s,f) => s + f.fx, 0); }

// Arrow y positions – stack vertically around puck centre
function ay(i) {
  const sp = 20;
  return box.y - ((forces.length - 1) / 2 - i) * sp;
}

function tipOf(i) {
  return { x: box.x + forces[i].fx * AS, y: ay(i) };
}

function hitHead(mx, my) {
  for (let i = 0; i < forces.length; i++) {
    const t = tipOf(i);
    if (Math.hypot(mx - t.x, my - t.y) < HIT_R) return i;
  }
  return -1;
}

function hitPuck(mx, my) {
  return Math.hypot(mx - box.x, my - box.y) < BOX.w/2 + 10;
}

// ── canvas coords ──────────────────────────────────────────────────────────
function cxy(e) {
  const r  = canvas.getBoundingClientRect();
  const sx = canvas.width  / r.width;
  const sy = canvas.height / r.height;
  const s  = e.touches ? e.touches[0] : e;
  return { x: (s.clientX - r.left)*sx, y: (s.clientY - r.top)*sy };
}

// ── mouse / touch ──────────────────────────────────────────────────────────
function onDown(e) {
  if (e.touches) e.preventDefault();
  const {x,y} = cxy(e);
  const h = hitHead(x, y);
  if (h >= 0) { drag = {idx: h, isNew: false}; return; }
  if (hitPuck(x, y)) {
    forces.push({ id: nid++, fx: 0, color: COLORS[forces.length % COLORS.length] });
    drag = { idx: forces.length - 1, isNew: true };
  }
}

function onMove(e) {
  if (!drag) return;
  if (e.touches) e.preventDefault();
  const {x} = cxy(e);
  forces[drag.idx].fx = clamp((x - box.x) / AS, -MAX_N, MAX_N);
  statusFromForces();
  draw();
}

function onUp() {
  if (!drag) return;
  const f = forces[drag.idx];
  if (Math.abs(f.fx) < 0.5 && drag.isNew) forces.splice(drag.idx, 1);
  drag = null;
  statusFromForces();
  draw();
}

function onDbl(e) {
  const {x,y} = cxy(e);
  const h = hitHead(x, y);
  if (h >= 0) { forces.splice(h, 1); statusFromForces(); draw(); }
}

canvas.addEventListener('mousedown',  onDown);
canvas.addEventListener('mousemove',  onMove);
canvas.addEventListener('mouseup',    onUp);
canvas.addEventListener('dblclick',   onDbl);
canvas.addEventListener('touchstart', onDown, {passive:false});
canvas.addEventListener('touchmove',  onMove, {passive:false});
canvas.addEventListener('touchend',   onUp);

// ── status ─────────────────────────────────────────────────────────────────
function statusFromForces() {
  if (done) return;
  const net = netFx();
  if (forces.length === 0) {
    msg = 'Click the puck to add force arrows, then Launch.';
  } else if (Math.abs(net) < 0.15) {
    msg = 'Net ≈ 0 N — forces are balanced. No acceleration: the puck would keep moving at constant speed!';
  } else {
    msg = `Net = ${signed(net)} N → will ${net > 0 ? 'accelerate right' : 'accelerate left'}`;
  }
}

// ── launch ─────────────────────────────────────────────────────────────────
function launch() {
  if (running || done) return;
  if (Math.abs(netFx()) < 0.05) {
    msg = 'Net force is zero — add a force arrow first.'; draw(); return;
  }
  running = true; lastT = 0; trail = [];
  requestAnimationFrame(loop);
}

function loop(ts) {
  if (!running) return;
  if (!lastT) lastT = ts;
  const dt = Math.min((ts - lastT)/1000, 0.035);
  lastT = ts;
  trail.push({x: box.x, y: box.y});
  if (trail.length > 500) trail.shift();
  step(dt);
  // live net force status during motion
  if (running) {
    const net = netFx();
    const dir = net * Math.sign(box.vx || net);
    if (Math.abs(net) < 0.15)
      msg = 'Net ≈ 0 N — no acceleration, puck keeps moving at constant speed!';
    else if (dir > 0)
      msg = `Net = ${signed(net)} N — accelerating.`;
    else
      msg = `Net = ${signed(net)} N — decelerating.`;
  }
  draw();
  if (running) requestAnimationFrame(loop);
}

// ── physics ────────────────────────────────────────────────────────────────
function step(dt) {
  if (box.flight)    { stepFlight(dt);  return; }
  if (box.captured)  { stepCapture(dt); return; }

  const fx   = netFx();
  const ax   = fx * FS;
  const oldV = box.vx;
  box.vx += ax * dt;

  // Velocity reversal
  if ((oldV > 0 && box.vx <= 0 && ax < 0) || (oldV < 0 && box.vx >= 0 && ax > 0)) {
    box.x += oldV * dt * Math.abs(oldV) / (Math.abs(oldV) + Math.abs(box.vx));
    box.vx = 0;
    // If net force also zero → truly stopped; otherwise physics re-accelerates
    if (Math.abs(fx) < 0.1) { running = false; finish(); }
    return;
  }

  const newX = box.x + oldV * dt + 0.5 * ax * dt * dt;
  const p    = pit();

  const hl = oldV > 0 && box.x < p.L && newX >= p.L;
  const hr = oldV < 0 && box.x > p.R && newX <= p.R;

  if (hl || hr) {
    box.x = hl ? p.L : p.R;
    const spd = Math.abs(box.vx);
    if (spd > LEVELS[lvlIdx].lip) {
      box.flight = true; box.over = true;
      box.vy = -LIP_LAUNCH;
      msg = `Too fast (${spd.toFixed(0)} px/s)! Lip launched the puck over the hole.`;
    } else {
      box.captured = true; box.vx = 0;
    }
    return;
  }

  box.x = newX;
  box.y = TY - BOX.h/2;
  if (box.x < 28 || box.x > canvas.width - 28) { running = false; finish(); }
}

function stepFlight(dt) {
  box.vy += LEVELS[lvlIdx].wt * FS * dt;
  box.x  += box.vx * dt;
  box.y  += box.vy * dt;
  const gnd = TY - BOX.h/2;
  if (box.y >= gnd) { box.y = gnd; box.vy = 0; box.flight = false; running = false; finish(); }
  if (box.x < 0 || box.x > canvas.width) { running = false; finish(); }
}

function stepCapture(dt) {
  box.x = LEVELS[lvlIdx].tx;
  box.vx = 0;
  box.vy += LEVELS[lvlIdx].wt * FS * dt;
  box.y  += box.vy * dt;
  const bot = TY - BOX.h/2 + BOX.h;
  if (box.y >= bot) {
    box.y = bot; box.vy = 0;
    running = false; finish();
  }
}

function finish() {
  done = true;
  const lvl = LEVELS[lvlIdx];
  const p   = pit();
  if (box.captured && Math.abs(box.x - lvl.tx) <= 4 && box.y >= TY - BOX.h/2 + BOX.h - 2) {
    msg = '✓ The puck dropped into the hole!'; flash = 60;
  } else if (box.over) {
    msg = `Too fast — lip launched it over. Add an opposing force arrow to reduce net force.`;
  } else if (box.x < p.L - 5) {
    msg = 'Stopped before the hole. Increase net force toward the hole.';
  } else if (box.x > p.R + 5) {
    msg = 'Passed the hole. Add a force arrow pointing the other way.';
  } else {
    msg = 'Close! Adjust your forces.';
  }
}

// ── hint simulation ────────────────────────────────────────────────────────
function hintData() {
  const net = netFx();
  if (Math.abs(net) < 0.05) return null;
  const lvl = LEVELS[lvlIdx];
  const pL  = lvl.tx - BOX.w/2;
  const pR  = lvl.tx + BOX.w/2;
  let sx = lvl.sx, svx = 0;
  const DT = 0.018;
  for (let i = 0; i < 1200; i++) {
    const ax   = net * FS;
    const oldV = svx;
    svx += ax * DT;
    if ((oldV > 0 && svx <= 0 && ax < 0) || (oldV < 0 && svx >= 0 && ax > 0)) {
      if (Math.abs(ax) < 0.1) return { stopped: true, x: sx, speed: 0 };
      svx = 0; continue;
    }
    const nx = sx + oldV*DT + 0.5*ax*DT*DT;
    const hl = oldV > 0 && sx < pL && nx >= pL;
    const hr = oldV < 0 && sx > pR && nx <= pR;
    if (hl || hr) {
      const spd = Math.abs(svx);
      return { x: hl ? pL : pR, speed: spd, willEnter: spd <= lvl.lip };
    }
    sx = nx;
    if (sx < 0 || sx > 940) return { oob: true };
    if (Math.abs(svx) < 0.08 && Math.abs(ax) < 0.08) return { stopped: true, x: sx, speed: 0 };
  }
  return null;
}

// ── drawing ────────────────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBg();
  drawTrack();
  drawTrail();
  if (LEVELS[lvlIdx].hint && !running && !done) drawHint();
  drawBox();
  if (!box.flight && !box.captured) drawForceArrows();
  drawNetArrow();
  drawPanel();
  drawMsg();
}

function drawBg() {
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#f8fafc'; ctx.fillRect(0,0,canvas.width,72);
  ctx.strokeStyle = '#d7dee8'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0,72); ctx.lineTo(canvas.width,72); ctx.stroke();
}

function drawTrack() {
  const lvl = LEVELS[lvlIdx];
  const p   = pit();

  ctx.fillStyle = '#f8fafc'; ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1;
  rrect(28, 86, canvas.width-56, 308, 12); ctx.fill(); ctx.stroke();

  ctx.fillStyle = '#e2e8f0';
  ctx.fillRect(28, TY+2, p.L-28, 10);
  ctx.fillRect(p.R, TY+2, canvas.width-28-p.R, 10);

  ctx.strokeStyle = '#64748b'; ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(50, TY); ctx.lineTo(p.L - LIP_W + 2, TY);
  ctx.moveTo(p.R + LIP_W - 2, TY); ctx.lineTo(canvas.width-50, TY);
  ctx.stroke();

  // Pit
  ctx.fillStyle = 'rgba(34,197,94,0.15)'; ctx.strokeStyle = '#16a34a'; ctx.lineWidth = 2;
  ctx.fillRect(p.L, p.top, BOX.w, BOX.h+2);
  ctx.strokeRect(p.L, p.top, BOX.w, BOX.h+2);
  ctx.fillStyle = '#15803d'; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center';
  ctx.fillText(`< ${lvl.lip} px/s`, lvl.tx, p.bot - 3);

  // Lip ramps
  ctx.fillStyle = '#475569';
  ctx.beginPath(); ctx.moveTo(p.L-LIP_W, TY+2); ctx.lineTo(p.L, TY-LIP_H); ctx.lineTo(p.L, TY+2); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(p.R+LIP_W, TY+2); ctx.lineTo(p.R, TY-LIP_H); ctx.lineTo(p.R, TY+2); ctx.closePath(); ctx.fill();

  // Start marker
  ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 2; ctx.setLineDash([5,5]);
  ctx.beginPath(); ctx.moveTo(lvl.sx, TY-58); ctx.lineTo(lvl.sx, TY+10); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#1d4ed8'; ctx.font = '700 11px Arial'; ctx.textAlign = 'center';
  ctx.fillText('START', lvl.sx, TY+26); ctx.textAlign = 'left';
}

function drawTrail() {
  if (trail.length < 2) return;
  ctx.save();
  ctx.strokeStyle = 'rgba(99,102,241,0.28)'; ctx.lineWidth = 2; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(trail[0].x, trail[0].y);
  for (let i = 1; i < trail.length; i++) ctx.lineTo(trail[i].x, trail[i].y);
  ctx.stroke(); ctx.setLineDash([]); ctx.restore();
}

function drawHint() {
  const h = hintData();
  if (!h) return;
  const lvl = LEVELS[lvlIdx];
  ctx.save();
  if (h.stopped) {
    ctx.globalAlpha = 0.36;
    ellipse(h.x, TY-BOX.h/2, '#fbbf24', '#d97706');
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#92400e'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center';
    ctx.fillText('Stops here', h.x, TY-BOX.h/2-22);
  } else if (h.willEnter) {
    ctx.globalAlpha = 0.40;
    ellipse(lvl.tx, TY-BOX.h/2, '#22c55e', '#16a34a');
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#15803d'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center';
    ctx.fillText(`✓ ~${h.speed.toFixed(0)} px/s — enters hole`, lvl.tx, TY-BOX.h/2-22);
  } else if (!h.oob) {
    ctx.globalAlpha = 0.40;
    ellipse(h.x, TY-BOX.h/2, '#ef4444', '#dc2626');
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#991b1b'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center';
    ctx.fillText(`✗ ~${h.speed.toFixed(0)} px/s — flies over lip`, h.x, TY-BOX.h/2-22);
  }
  ctx.fillStyle = '#92400e'; ctx.font = '11px Arial'; ctx.textAlign = 'left';
  ctx.fillText('★ Hint: ghost shows predicted outcome', 34, canvas.height-18);
  ctx.restore();
}

function drawBox() {
  ctx.save();
  ctx.fillStyle   = box.over ? '#fca5a5' : '#dbeafe';
  ctx.strokeStyle = box.over ? '#dc2626' : '#1d4ed8';
  ctx.lineWidth   = 3;
  ctx.beginPath(); ctx.ellipse(box.x, box.y, BOX.w/2, BOX.h/2, 0, 0, Math.PI*2);
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(29,78,216,0.25)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(box.x-6, box.y-3, BOX.w/3, BOX.h/4, 0, 0, Math.PI*2); ctx.stroke();
  if (flash > 0) {
    ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 4; ctx.setLineDash([6,5]);
    ctx.beginPath(); ctx.ellipse(box.x, box.y, BOX.w/2+9, BOX.h/2+9, 0, 0, Math.PI*2);
    ctx.stroke(); ctx.setLineDash([]);
  }
  // Velocity arrow (below puck)
  if (Math.abs(box.vx) > 3) {
    const len = clamp(Math.abs(box.vx)*0.38, 18, 72);
    arrow(box.x, box.y+BOX.h/2+17, box.x+Math.sign(box.vx)*len, box.y+BOX.h/2+17, '#2563eb', 2.5);
  }
  ctx.restore();
}

function drawForceArrows() {
  for (let i = 0; i < forces.length; i++) {
    const f = forces[i];
    if (Math.abs(f.fx) < 0.3) continue;
    const y = ay(i);
    const t = tipOf(i);
    // Shaft
    arrow(box.x, y, t.x, y, f.color, 4);
    // Handle circle
    ctx.save();
    const hot = drag && drag.idx === i;
    ctx.fillStyle   = hot ? f.color : '#fff';
    ctx.strokeStyle = f.color; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(t.x, y, 8, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    // Force label
    ctx.fillStyle = f.color; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center';
    const lx = f.fx > 0 ? t.x + 24 : t.x - 24;
    ctx.fillText(signed(f.fx)+'N', lx, y+4);
    ctx.restore();
  }
}

function drawNetArrow() {
  const net = netFx();
  if (forces.length === 0) return;
  const y  = box.y + BOX.h/2 + 36;
  const tx = box.x + net * AS;
  ctx.save();
  if (Math.abs(net) < 0.15) {
    // Dot + label for zero net
    ctx.fillStyle = '#b45309';
    ctx.beginPath(); ctx.arc(box.x, y, 5, 0, Math.PI*2); ctx.fill();
    ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center';
    ctx.fillText('Net = 0 N', box.x, y - 9);
  } else {
    // Dashed net force arrow
    const color = '#0f172a';
    const hl = 14;
    const ang = tx > box.x ? 0 : Math.PI;
    ctx.strokeStyle = color; ctx.lineWidth = 3.5; ctx.lineCap = 'round'; ctx.setLineDash([7,4]);
    ctx.beginPath();
    ctx.moveTo(box.x, y);
    ctx.lineTo(tx - hl * 0.85 * Math.cos(ang), y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(tx, y);
    ctx.lineTo(tx - hl*Math.cos(ang-Math.PI/6), y - hl*Math.sin(ang-Math.PI/6));
    ctx.lineTo(tx - hl*Math.cos(ang+Math.PI/6), y - hl*Math.sin(ang+Math.PI/6));
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = color; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center';
    ctx.fillText(`Net = ${signed(net)} N`, (box.x + tx)/2, y - 9);
  }
  ctx.restore();
}

function drawPanel() {
  if (forces.length === 0) return;
  const net     = netFx();
  const isZero  = Math.abs(net) < 0.15;
  const panelH  = 36 + forces.length * 20 + 28;
  const bg      = (flash > 0) ? '#ecfdf5' : 'rgba(255,255,255,0.96)';
  const br      = (flash > 0) ? '#22c55e'  : '#cbd5e1';

  ctx.save();
  ctx.fillStyle = bg; ctx.strokeStyle = br; ctx.lineWidth = 1.5;
  rrect(640, 88, 278, panelH, 12); ctx.fill(); ctx.stroke();

  ctx.fillStyle = '#0f172a'; ctx.font = '700 13px Arial';
  ctx.fillText('Force diagram', 658, 110);
  ctx.font = '12px Arial';

  for (let i = 0; i < forces.length; i++) {
    const f = forces[i];
    ctx.fillStyle = f.color;
    ctx.beginPath(); ctx.arc(662, 124+i*20-3, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1e293b';
    ctx.fillText(`F${i+1}: ${signed(f.fx)} N  →  ${f.fx > 0 ? 'rightward' : f.fx < 0 ? 'leftward' : 'zero'}`, 674, 124+i*20);
  }

  const ny = 124 + forces.length * 20 + 8;
  ctx.fillStyle = isZero ? '#b45309' : '#0f172a';
  ctx.font = '700 12px Arial';
  ctx.fillText(
    isZero
      ? 'Net = 0 N  ← no acceleration!'
      : `Net = ${signed(net)} N  ← ${net > 0 ? 'accel →' : 'accel ←'}`,
    658, ny
  );
  ctx.restore();
}

function drawMsg() {
  ctx.save();
  ctx.fillStyle = '#334155'; ctx.font = '13px Arial'; ctx.textAlign = 'left';
  ctx.fillText(msg, 24, canvas.height - 16);
  ctx.restore();
}

// ── drawing utilities ──────────────────────────────────────────────────────
function arrow(x1, y1, x2, y2, color, lw) {
  lw = lw || 5;
  const hl  = 13;
  const ang = Math.atan2(y2-y1, x2-x1);
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2 - hl*0.85*Math.cos(ang), y2 - hl*0.85*Math.sin(ang));
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - hl*Math.cos(ang-Math.PI/6), y2 - hl*Math.sin(ang-Math.PI/6));
  ctx.lineTo(x2 - hl*Math.cos(ang+Math.PI/6), y2 - hl*Math.sin(ang+Math.PI/6));
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function ellipse(cx, cy, fill, stroke) {
  ctx.fillStyle = fill; ctx.strokeStyle = stroke; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(cx, cy, BOX.w/2, BOX.h/2, 0, 0, Math.PI*2);
  ctx.fill(); ctx.stroke();
}

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);     ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function signed(v) {
  if (Math.abs(v) < 0.05) return '0';
  return v > 0 ? `+${+v.toFixed(1)}` : `${+v.toFixed(1)}`;
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// ── buttons ────────────────────────────────────────────────────────────────
document.getElementById('launchBtn').addEventListener('click', launch);
document.getElementById('resetBtn') .addEventListener('click', () => setup(false));
document.getElementById('clearBtn') .addEventListener('click', () => setup(true));

document.querySelectorAll('.lvlBtn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.lvlBtn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    lvlIdx = +btn.dataset.level;
    setup(true);
  });
});

setup(true);
</script>
