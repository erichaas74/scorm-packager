<canvas id="simCanvas"></canvas>

<input id="magnitude" type="range" min="1" max="16" step="0.5" value="10" />
<input id="angle" type="range" min="-170" max="170" step="1" value="35" />

<span id="magnitudeValue"></span>
<span id="angleValue"></span>

<input id="showTrig" type="checkbox" checked />
<input id="showComponents" type="checkbox" checked />
<input id="showAxes" type="checkbox" checked />
<input id="showGrid" type="checkbox" checked />
<input id="showAngle" type="checkbox" checked />
<input id="showSideLabels" type="checkbox" checked />

<button id="playBtn">Play</button>
<button id="stepBtn">Next Step</button>
<button id="resetBtn">Reset</button>
<button id="newPromptBtn">New Prompt</button>
<button id="revealBtn">Reveal Rule</button>

<div id="stepList"></div>
<div id="mathBox"></div>
<div id="trigPrompt"></div>
<div id="trigFeedback" class="feedback-box neutral"></div>

<button data-choice="sin">sin θ</button>
<button data-choice="cos">cos θ</button>
<button data-choice="tan">tan θ</button>

<script type="module" src="./demo-app.js"></script>
