<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impulse Jump Lab</title>
    <style>
        * { box-sizing: border-box; }
        button { border: 0; cursor: pointer; font: inherit; }
        .flex-1 { flex: 1 1 0%; }
        .font-bold { font-weight: 700; }
        .mt-4 { margin-top: 1rem; }
        .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .rounded-lg { border-radius: 0.5rem; }
        .text-lg { font-size: 1.125rem; line-height: 1.75rem; }
        .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
        .text-slate-400 { color: #94a3b8; }
        .text-slate-700 { color: #334155; }
        .text-slate-800 { color: #1e293b; }
        .text-white { color: #ffffff; }
        .bg-amber-500 { background: #f59e0b; }
        .bg-blue-600 { background: #2563eb; }
        .bg-slate-200 { background: #e2e8f0; }
        .transition-colors { transition: color 0.15s, background-color 0.15s; }
        .w-full { width: 100%; }
        .hover\:bg-amber-600:hover { background: #d97706; }
        .hover\:bg-blue-700:hover { background: #1d4ed8; }
        .hover\:bg-slate-300:hover { background: #cbd5e1; }
        .hover\:text-slate-600:hover { color: #475569; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f8fafc;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Prevents scrollbars */
        }
        #lab-header {
            width: 100%;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
            z-index: 20;
            padding: 0.75rem 1rem;
        }
        .lab-header-inner {
            width: min(1100px, 100%);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
        }
        .lab-header-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 0.5rem;
        }
        #canvas-container {
            flex: 0 0 auto;
            height: min(600px, calc(100vh - 80px));
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        #button-container {
            position: absolute;
            left: clamp(12px, 4vw, 42px);
            bottom: 8px;
            z-index: 6;
            width: min(43vw, 430px);
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.4rem;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: default;
            touch-action: none;
        }
        .hidden {
            display: none !important;
        }
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(3px);
        }
        .overlay-card {
            width: min(560px, 100%);
            max-height: calc(100vh - 2rem);
            overflow-y: auto;
            background: #ffffff;
            border-radius: 12px;
            border-top: 6px solid #2563eb;
            box-shadow: 0 24px 70px rgba(15, 23, 42, 0.35);
            padding: 1.5rem;
        }
        .overlay-kicker {
            color: #2563eb;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 0.35rem;
        }
        .overlay-card h3 {
            margin: 0 0 0.75rem;
            color: #0f172a;
            font-size: 1.35rem;
            font-weight: 800;
        }
        .overlay-card p,
        .overlay-card li {
            color: #475569;
            line-height: 1.55;
        }
        .overlay-card ol,
        .overlay-card ul {
            margin: 0.25rem 0 1rem 1.25rem;
        }
        .formula-box {
            margin-top: 0.75rem;
            padding: 0.85rem;
            border-radius: 10px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e3a8a;
            font-weight: 700;
        }
        #walkthrough-spotlight {
            position: fixed;
            z-index: 60;
            border-radius: 12px;
            border: 3px solid #f59e0b;
            box-shadow: 0 0 0 9999px rgba(15, 23, 42, 0.62);
            pointer-events: none;
            transition: top 0.25s ease, left 0.25s ease, width 0.25s ease, height 0.25s ease;
        }
        #walkthrough-tooltip {
            position: fixed;
            z-index: 61;
            width: min(360px, calc(100vw - 24px));
            background: #ffffff;
            border-radius: 12px;
            border-top: 6px solid #f59e0b;
            box-shadow: 0 24px 70px rgba(15, 23, 42, 0.35);
            padding: 1rem 1.15rem;
        }
        #walkthrough-tooltip h4 {
            margin: 0 0 0.4rem;
            color: #0f172a;
            font-size: 1.05rem;
            font-weight: 800;
        }
        #walkthrough-tooltip p {
            color: #475569;
            font-size: 0.9rem;
            line-height: 1.5;
            margin: 0 0 0.35rem;
        }
        #walkthrough-tooltip .wt-kicker {
            color: #d97706;
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 0.3rem;
        }
        #walkthrough-tooltip .wt-buttons {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }
        @media (max-width: 700px) {
            .lab-header-inner {
                align-items: flex-start;
                flex-direction: column;
            }
            .lab-header-actions {
                justify-content: flex-start;
            }
            #button-container {
                width: calc(50vw - 18px);
                left: 8px;
                gap: 0.25rem;
            }
        }
        @media (min-width: 768px) { .md\:text-xl { font-size: 1.25rem; line-height: 1.75rem; } }
    </style>
</head>
<body>
    <header id="lab-header">
        <div class="lab-header-inner">
            <h1 class="text-slate-800 font-bold text-lg md:text-xl">Impulse Jump Lab: Force-Time Graph to Height</h1>
            <div class="lab-header-actions">
                <button type="button" onclick="startWalkthrough()" class="text-sm px-3 py-1 bg-amber-500 hover:bg-amber-600 text-white rounded-lg transition-colors font-bold">Walkthrough</button>
                <button type="button" data-overlay="guide" class="text-sm px-3 py-1 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg transition-colors font-bold">Formula Guide</button>
                <button type="button" onclick="clearHistory()" class="text-sm px-3 py-1 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg transition-colors font-bold">Clear Graphs</button>
            </div>
        </div>
    </header>

    <!-- Top Section: Physics Canvas -->
    <div id="canvas-container">
        <canvas id="simulationCanvas"></canvas>
        <div id="button-container" aria-label="Jump trials">
            <!-- Jump profile buttons injected by JS -->
        </div>
    </div>

    <div id="info-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
        <div class="overlay-card">
            <div class="overlay-kicker" id="overlay-kicker">Lab Task</div>
            <h3 id="overlay-title">Impulse Jump Lab</h3>
            <div id="overlay-body"></div>
            <button id="overlay-close" type="button" class="mt-4 w-full py-2 px-4 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-bold transition-colors">Close</button>
        </div>
    </div>

    <div id="walkthrough-spotlight" class="hidden"></div>
    <div id="walkthrough-tooltip" class="hidden">
        <div class="wt-kicker" id="wt-kicker">Walkthrough</div>
        <h4 id="wt-title"></h4>
        <div id="wt-body"></div>
        <div class="wt-buttons">
            <button id="wt-back" type="button" class="flex-1 py-2 px-3 rounded-lg bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-bold transition-colors">Back</button>
            <button id="wt-next" type="button" class="flex-1 py-2 px-3 rounded-lg bg-amber-500 hover:bg-amber-600 text-white text-sm font-bold transition-colors">Next</button>
            <button id="wt-exit" type="button" class="py-2 px-3 rounded-lg text-slate-400 hover:text-slate-600 text-sm font-bold transition-colors">Skip</button>
        </div>
    </div>

    <script src="stickman-jump-animator.js"></script>
    <script>
        const canvas = document.getElementById('simulationCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const stickmanAnimator = window.createStickmanJumpAnimator
            ? window.createStickmanJumpAnimator(ctx, { pixelsPerMeter: 180 })
            : null;

        let width, height;
        function resize() {
            // Safely get dimensions from the wrapper div to prevent syntax errors
            width = container.clientWidth;
            height = container.clientHeight;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = Math.max(1, Math.floor(width * dpr));
            canvas.height = Math.max(1, Math.floor(height * dpr));
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener('resize', resize);
        resize();

        // Physics constants
        const mass = 70; // kg
        const gravity = 9.81; // m/s^2
        const weight = mass * gravity; // ~686.7 N
        const GRAPH_MAX_TIME = 0.6; // s
        const GRAPH_MAX_FORCE = 4000; // N
        
        // Jump state variables
        let state = 'idle'; // idle, pushing, flight, landed
        let athleteY = 0; // Height above ground (meters)
        let athleteVy = 0; // Vertical velocity (m/s)
        let timeInPush = 0;
        let currentForce = 0;
        
        let jumpHistory = [];
        let currentGraphData = [];
        let activeProfile = null;
        let lastResult = null;
        let trialNumber = 0;
        const motionInput = {
            bendScale: 1,
            jumpHeightScale: 1
        };

        // Net-force profiles for a force plate zeroed to body weight.
        const jumpProfiles = [
            { id: 'quick', name: 'Quick Hop', contactTime: 0.16, peakNetForce: 1200, pulsePower: 1, visualBendScale: 0.35, color: '#f97316' },
            { id: 'deep', name: 'Deep Squat Jump', contactTime: 0.50, peakNetForce: 1050, pulsePower: 4, visualBendScale: 1.8, color: '#3b82f6' },
            { id: 'athletic', name: 'Athletic Max Jump', contactTime: 0.32, peakNetForce: 3000, pulsePower: 6, visualBendScale: 1.3, color: '#22c55e' }
        ];

        // Self-jump mode: drag the jumper down, release to launch.
        const CUSTOM_JUMP_COLOR = '#8b5cf6';
        const MAX_DRAG_DEPTH = 1.2;
        let isCharging = false;
        let dragStartY = 0;
        let dragDepth = 0;

        function buildCustomProfile(depth) {
            const d = clamp(depth, 0.15, MAX_DRAG_DEPTH);
            return {
                id: 'custom',
                name: 'Your Jump',
                isCustom: true,
                dragDepth: d,
                contactTime: Math.round((0.16 + 0.30 * d) * 50) / 50,
                peakNetForce: Math.round((400 + 1100 * d) / 10) * 10,
                pulsePower: 3,
                visualBendScale: 1,
                color: CUSTOM_JUMP_COLOR
            };
        }

        const btnContainer = document.getElementById('button-container');
        jumpProfiles.forEach(p => {
            const btn = document.createElement('button');
            btn.className = 'py-1.5 px-1 rounded border-2 font-bold text-[10px] md:text-xs leading-tight transition-all hover:bg-slate-50 bg-white shadow-sm';
            btn.style.borderColor = p.color;
            btn.style.color = p.color;
            btn.innerText = p.name;
            btn.onclick = () => startJump(p);
            btnContainer.appendChild(btn);
        });

        const GROUND_OFFSET = 92; // floor sits high enough to leave room for the jump buttons

        function scenePixelsPerMeter() {
            return Math.max(120, Math.min(180, height * 0.34));
        }

        function graphLayout() {
            const cardW = Math.min(550, width * 0.48);
            const cardX = width - cardW - 24;
            const gH = height - 116;
            return {
                cardX,
                cardY: 10,
                cardW,
                cardH: gH + 96,
                gX: cardX + 66,
                gY: 48,
                gW: cardW - 82,
                gH
            };
        }

        function sceneAthleteHeight() {
            return Math.max(100, Math.min(190, height * 0.38));
        }

        function canvasPos(evt) {
            const rect = canvas.getBoundingClientRect();
            return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
        }

        function overJumper(pos) {
            const groundY = height - GROUND_OFFSET;
            const athleteHeight = sceneAthleteHeight();
            return Math.abs(pos.x - width * 0.25) < 95 &&
                pos.y > groundY - athleteHeight - 55 &&
                pos.y < groundY + 16;
        }

        canvas.addEventListener('pointerdown', evt => {
            if (isCharging || state === 'pushing' || state === 'flight') return;
            const pos = canvasPos(evt);
            if (!overJumper(pos)) return;

            isCharging = true;
            state = 'charging';
            dragStartY = pos.y;
            dragDepth = 0;
            activeProfile = null;
            lastResult = null;
            currentForce = 0;
            athleteY = 0;
            athleteVy = 0;
            canvas.setPointerCapture(evt.pointerId);
            canvas.style.cursor = 'grabbing';
            evt.preventDefault();
        });

        canvas.addEventListener('pointermove', evt => {
            const pos = canvasPos(evt);
            if (isCharging) {
                const maxPull = sceneAthleteHeight() * 0.42;
                dragDepth = clamp((pos.y - dragStartY) / maxPull, 0, 1) * MAX_DRAG_DEPTH;
            } else if (state === 'idle' || state === 'landed') {
                canvas.style.cursor = overJumper(pos) ? 'grab' : 'default';
            }
        });

        function releaseCharge() {
            if (!isCharging) return;
            isCharging = false;
            canvas.style.cursor = 'default';

            if (dragDepth > 0.12) {
                state = 'landed';
                startJump(buildCustomProfile(dragDepth));
            } else {
                state = 'idle';
            }
            dragDepth = 0;
        }
        canvas.addEventListener('pointerup', releaseCharge);
        canvas.addEventListener('pointercancel', releaseCharge);

        function clearHistory() {
            jumpHistory = [];
            currentGraphData = [];
            lastResult = null;
            trialNumber = 0;
            state = 'idle';
            athleteY = 0;
            athleteVy = 0;
            activeProfile = null;
            currentForce = 0;
            motionInput.bendScale = 1;
            motionInput.jumpHeightScale = 1;
            isCharging = false;
            dragDepth = 0;
        }

        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        function startJump(profile) {
            // Prevent interrupting a jump in progress
            if (state === 'pushing' || state === 'flight') return;

            isCharging = false;
            canvas.style.cursor = 'default';
            activeProfile = profile;
            lastResult = null;
            state = 'pushing';
            timeInPush = 0;
            athleteY = 0;
            athleteVy = 0;
            currentForce = 0;
            currentGraphData = [{ t: 0, f: 0 }];
        }

        function getNetForce(profile, time) {
            if (!profile || time <= 0 || time >= profile.contactTime) return 0;

            const phase = Math.sin(Math.PI * time / profile.contactTime);
            return profile.peakNetForce * Math.pow(Math.max(0, phase), profile.pulsePower);
        }

        function calculateNetImpulse(profile) {
            const steps = 600;
            const dt = profile.contactTime / steps;
            let area = 0;
            let previousForce = getNetForce(profile, 0);

            for (let i = 1; i <= steps; i++) {
                const force = getNetForce(profile, i * dt);
                area += ((previousForce + force) / 2) * dt;
                previousForce = force;
            }

            return area;
        }

        let lastTime = performance.now();
        function animate(currentTime) {
            let dt = (currentTime - lastTime) / 1000;
            if (dt > 0.1) dt = 0.1; // Cap dt to prevent physics explosions on lag
            lastTime = currentTime;

            updatePhysics(dt);
            drawScene();

            requestAnimationFrame(animate);
        }

        function updatePhysics(dt) {
            if (state === 'pushing') {
                timeInPush += dt;
                
                if (timeInPush >= activeProfile.contactTime) {
                    // Takeoff!
                    state = 'flight';
                    currentForce = 0;
                    currentGraphData.push({ t: activeProfile.contactTime, f: 0 });
                    
                    const netImpulse = calculateNetImpulse(activeProfile);
                    const avgNetForce = netImpulse / activeProfile.contactTime;
                    const takeoffSpeed = netImpulse / mass;
                    const maxHeight = (takeoffSpeed * takeoffSpeed) / (2 * gravity);
                    
                    // Force the actual simulation velocity to match the perfect math
                    athleteVy = takeoffSpeed; 

                    lastResult = {
                        profile: activeProfile,
                        contactTime: activeProfile.contactTime,
                        avgNetForce,
                        netImpulse,
                        takeoffSpeed,
                        maxHeight
                    };
                    trialNumber += 1;

                    // Save graph data for curve comparisons.
                    jumpHistory.push({
                        profile: activeProfile,
                        points: [...currentGraphData],
                        result: lastResult
                    });

                } else {
                    // Calculate the zeroed force-plate curve during the push.
                    currentForce = getNetForce(activeProfile, timeInPush);
                    
                    // Update graph
                    currentGraphData.push({ t: timeInPush, f: currentForce });
                }
            } 
            else if (state === 'flight') {
                // Apply Gravity
                athleteVy -= gravity * dt;
                athleteY += athleteVy * dt;
                
                // Check for landing
                if (athleteY <= 0 && athleteVy < 0) {
                    athleteY = 0;
                    athleteVy = 0;
                    state = 'landed';
                }
            }
        }

        function roundedRectPath(x, y, w, h, r) {
            if (typeof ctx.roundRect === 'function') {
                ctx.beginPath();
                ctx.roundRect(x, y, w, h, r);
                return;
            }
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        function drawScene() {
            ctx.clearRect(0, 0, width, height);
            const groundY = height - GROUND_OFFSET;

            drawBackdrop(groundY);
            drawRuler(groundY);
            drawPeakMarker(groundY);
            drawForcePlate(groundY);
            drawJumper(groundY);
            if (isCharging) {
                drawPowerMeter(groundY);
            } else {
                drawDragHint(groundY);
            }
            drawGraph();
        }

        function drawBackdrop(groundY) {
            const sky = ctx.createLinearGradient(0, 0, 0, groundY);
            sky.addColorStop(0, '#dbeafe');
            sky.addColorStop(0.65, '#eff6ff');
            sky.addColorStop(1, '#f8fafc');
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, width, groundY);

            drawCloud(width * 0.13, height * 0.16, Math.min(28, height * 0.05));
            drawCloud(width * 0.36, height * 0.3, Math.min(21, height * 0.038));

            const dirt = ctx.createLinearGradient(0, groundY, 0, height);
            dirt.addColorStop(0, '#94a3b8');
            dirt.addColorStop(1, '#64748b');
            ctx.fillStyle = dirt;
            ctx.fillRect(0, groundY, width, height - groundY);
            ctx.fillStyle = '#475569';
            ctx.fillRect(0, groundY, width, 4);
        }

        function drawCloud(cx, cy, r) {
            if (r < 8) return;
            ctx.save();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.arc(cx + r * 0.95, cy + r * 0.3, r * 0.72, 0, Math.PI * 2);
            ctx.arc(cx - r * 0.95, cy + r * 0.32, r * 0.66, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawRuler(groundY) {
            const ppm = scenePixelsPerMeter();
            const x = Math.max(34, width * 0.05);
            const topY = groundY - 1.5 * ppm;
            if (topY < 10) return;

            ctx.save();
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x, groundY);
            ctx.lineTo(x, topY);
            ctx.stroke();

            ctx.font = '11px Inter';
            ctx.fillStyle = '#64748b';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';

            for (let m = 0; m <= 1.501; m += 0.25) {
                const y = groundY - m * ppm;
                const major = Math.round(m * 100) % 50 === 0;
                ctx.lineWidth = major ? 2 : 1;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + (major ? 12 : 7), y);
                ctx.stroke();
                if (major && m > 0) ctx.fillText(m.toFixed(1) + ' m', x + 16, y);
            }
            ctx.restore();
        }

        function drawPeakMarker(groundY) {
            if (!lastResult || (state !== 'flight' && state !== 'landed')) return;
            const ppm = scenePixelsPerMeter();
            const jumperX = width * 0.25;
            const y = groundY - lastResult.maxHeight * motionInput.jumpHeightScale * ppm;

            ctx.save();
            ctx.strokeStyle = lastResult.profile.color;
            ctx.setLineDash([6, 5]);
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(Math.max(34, width * 0.05), y);
            ctx.lineTo(jumperX + 108, y);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = lastResult.profile.color;
            ctx.font = 'bold 13px Inter';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(lastResult.maxHeight.toFixed(2) + ' m', jumperX + 116, y);
            ctx.restore();
        }

        function drawForcePlate(groundY) {
            const jumperX = width * 0.25;
            const plateW = 170;

            ctx.save();
            if (currentForce > 0 && activeProfile) {
                ctx.shadowColor = activeProfile.color;
                ctx.shadowBlur = 10 + 22 * Math.min(1, (currentForce / GRAPH_MAX_FORCE) * 2);
            }
            roundedRectPath(jumperX - plateW / 2, groundY - 5, plateW, 14, 4);
            ctx.fillStyle = '#334155';
            ctx.fill();
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = '#94a3b8';
            [jumperX - plateW / 2 + 13, jumperX + plateW / 2 - 13].forEach(bx => {
                ctx.beginPath();
                ctx.arc(bx, groundY + 2, 3, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();
        }

        function drawPowerMeter(groundY) {
            const jumperX = width * 0.25;
            const mH = Math.min(150, height * 0.32);
            const mX = jumperX + 100;
            const mBottom = groundY - 12;
            const frac = clamp(dragDepth / MAX_DRAG_DEPTH, 0, 1);

            ctx.save();
            roundedRectPath(mX, mBottom - mH, 20, mH, 6);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.fill();
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 2;
            ctx.stroke();

            if (frac > 0.02) {
                const fillH = (mH - 6) * frac;
                const hue = 120 - 120 * frac;
                roundedRectPath(mX + 3, mBottom - 3 - fillH, 14, fillH, 4);
                ctx.fillStyle = 'hsl(' + hue + ', 85%, 46%)';
                ctx.fill();
            }

            ctx.fillStyle = '#475569';
            ctx.font = 'bold 11px Inter';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText('POWER', mX + 10, mBottom - mH - 8);

            const preview = buildCustomProfile(dragDepth);
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.font = 'bold 12px Inter';
            ctx.fillStyle = '#6d28d9';
            ctx.fillText('peak ~' + preview.peakNetForce + ' N', mX + 32, mBottom - mH * 0.5);
            ctx.fillText('push ~' + preview.contactTime.toFixed(2) + ' s', mX + 32, mBottom - mH * 0.5 + 18);

            if (frac > 0.12) {
                ctx.fillStyle = '#16a34a';
                ctx.font = 'bold 14px Inter';
                ctx.fillText('Release to jump!', mX + 32, mBottom - mH * 0.5 - 24);
            }
            ctx.restore();
        }

        function drawDragHint(groundY) {
            if (state !== 'idle' && state !== 'landed') return;
            const jumperX = width * 0.25;
            const athleteHeight = sceneAthleteHeight();
            const bob = Math.sin(performance.now() / 400) * 4;
            const y = groundY - athleteHeight - 44 + bob;

            ctx.save();
            ctx.fillStyle = '#7c3aed';
            ctx.font = 'bold 13px Inter';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText('Drag me down, then release!', jumperX, y);
            ctx.strokeStyle = '#7c3aed';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(jumperX, y + 8);
            ctx.lineTo(jumperX, y + 26);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(jumperX - 6, y + 20);
            ctx.lineTo(jumperX, y + 28);
            ctx.lineTo(jumperX + 6, y + 20);
            ctx.stroke();
            ctx.restore();
        }

        function drawJumper(groundY) {
            const jumperX = width * 0.25;
            const pixelsPerMeter = scenePixelsPerMeter();
            const athleteHeight = sceneAthleteHeight();
            const visualBendScale = activeProfile ? (activeProfile.visualBendScale || 1) : 1;

            let displayState = state;
            let pushProgress = activeProfile ? timeInPush / activeProfile.contactTime : 0;
            let squatDepth;
            let color = activeProfile ? activeProfile.color : '#64748b';

            if (state === 'charging') {
                displayState = 'pushing';
                pushProgress = 0.5;
                squatDepth = dragDepth;
                color = CUSTOM_JUMP_COLOR;
            } else if (state === 'pushing' && activeProfile && activeProfile.isCustom) {
                // Launch from the held squat instead of dipping again.
                pushProgress = 0.5 + 0.5 * clamp(timeInPush / activeProfile.contactTime, 0, 1);
                squatDepth = activeProfile.dragDepth;
            }

            if (stickmanAnimator) {
                stickmanAnimator.drawJumpState({
                    x: jumperX,
                    groundY,
                    height: athleteHeight,
                    pixelsPerMeter,
                    state: displayState,
                    athleteY,
                    pushProgress,
                    squatDepth,
                    currentForce: currentForce + weight,
                    weight,
                    profile: activeProfile,
                    bendScale: motionInput.bendScale * visualBendScale,
                    jumpHeightScale: motionInput.jumpHeightScale,
                    color,
                    showForceArrow: state === 'pushing'
                });
                return;
            }

            drawFallbackJumper(jumperX, groundY, pixelsPerMeter);
        }

        function drawFallbackJumper(jumperX, groundY, pixelsPerMeter) {
            let boxHeight = Math.max(38, Math.min(56, height * 0.28));

            if (state === 'charging') {
                boxHeight = boxHeight - (boxHeight * 0.45 * clamp(dragDepth, 0, MAX_DRAG_DEPTH));
            } else if (state === 'pushing' && activeProfile) {
                const visualBendScale = activeProfile.visualBendScale || 1;
                const squatDepth = clamp((activeProfile.contactTime / 0.65) * motionInput.bendScale * visualBendScale, 0, 1.35);
                boxHeight = boxHeight - (boxHeight * 0.45 * squatDepth * Math.sin(Math.PI * timeInPush / activeProfile.contactTime));
            }

            const visualY = groundY - (athleteY * motionInput.jumpHeightScale * pixelsPerMeter) - boxHeight;
            ctx.fillStyle = (state === 'idle') ? '#cbd5e1' : (activeProfile ? activeProfile.color : (state === 'charging' ? CUSTOM_JUMP_COLOR : '#cbd5e1'));
            ctx.fillRect(jumperX - 25, visualY, 50, boxHeight);
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 2;
            ctx.strokeRect(jumperX - 25, visualY, 50, boxHeight);
        }

        function drawGraph() {
            // Fixed-width graph card (max 550px) anchored to the right edge
            const layout = graphLayout();
            const gX = layout.gX;
            const gY = layout.gY;
            const gW = layout.gW;
            const gH = layout.gH;

            if (gW < 100 || gH < 80) return; // Don't draw if screen is too tiny

            // Card behind the graph
            ctx.save();
            roundedRectPath(layout.cardX, layout.cardY, layout.cardW, layout.cardH, 12);
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = 'rgba(15, 23, 42, 0.14)';
            ctx.shadowBlur = 16;
            ctx.shadowOffsetY = 4;
            ctx.fill();
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();

            ctx.fillStyle = '#0f172a';
            ctx.font = 'bold 14px Inter';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            ctx.fillText('Net Force vs. Time', gX - 48, 34);

            // Plot area
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(gX, gY, gW, gH);
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2;
            ctx.strokeRect(gX, gY, gW, gH);

            drawGraphGrid(gX, gY, gW, gH);
            
            // A zeroed force plate reads 0 N when the jumper is standing still.
            const zeroY = gY + gH;
            ctx.beginPath();
            ctx.moveTo(gX, zeroY);
            ctx.lineTo(gX + gW, zeroY);
            ctx.strokeStyle = '#94a3b8';
            ctx.stroke();
            
            ctx.fillStyle = '#64748b';
            ctx.font = height < 210 ? '10px Inter' : '12px Inter';
            ctx.fillText('0 N net', gX + 5, zeroY - 5);
            
            // Axes Labels
            ctx.fillText('Time (s)', gX + gW - 48, gY + gH + 22);
            ctx.save();
            ctx.translate(gX - 48, gY + Math.min(64, gH * 0.6));
            ctx.rotate(-Math.PI/2);
            ctx.fillText('Force (N)', 0, 0);
            ctx.restore();

            // Draw all previous jumps (ghosted)
            jumpHistory.forEach(jump => {
                drawCurve(jump.points, jump.profile.color, 0.3, false, gX, gY, gW, gH, zeroY);
            });

            // Draw the current or most recent jump prominently and filled
            if (state === 'pushing') {
                drawCurve(currentGraphData, activeProfile.color, 1.0, true, gX, gY, gW, gH, zeroY);
            } else if (jumpHistory.length > 0 && state !== 'idle') {
                const lastJump = jumpHistory[jumpHistory.length - 1];
                drawCurve(lastJump.points, lastJump.profile.color, 1.0, true, gX, gY, gW, gH, zeroY);
            }
        }

        function drawGraphGrid(gX, gY, gW, gH) {
            const labelFont = height < 210 ? '9px Inter' : '10px Inter';
            ctx.save();
            ctx.lineWidth = 1;
            ctx.font = labelFont;
            ctx.fillStyle = '#475569';

            for (let force = 0; force <= GRAPH_MAX_FORCE; force += 500) {
                const y = gY + gH - (force / GRAPH_MAX_FORCE) * gH;
                ctx.beginPath();
                ctx.moveTo(gX, y);
                ctx.lineTo(gX + gW, y);
                ctx.strokeStyle = force === 0 ? '#94a3b8' : '#e2e8f0';
                ctx.stroke();

                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillText(String(force), gX - 8, y);
            }

            const timeSteps = Math.round(GRAPH_MAX_TIME / 0.1);
            for (let i = 0; i <= timeSteps; i++) {
                const time = i * 0.1;
                const x = gX + (time / GRAPH_MAX_TIME) * gW;
                ctx.beginPath();
                ctx.moveTo(x, gY);
                ctx.lineTo(x, gY + gH);
                ctx.strokeStyle = i === 0 ? '#94a3b8' : '#e2e8f0';
                ctx.stroke();

                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText(time.toFixed(1), x, gY + gH + 4);
            }

            ctx.restore();
        }

        function drawCurve(points, color, alpha, fillArea, gX, gY, gW, gH, zeroY) {
            if (points.length === 0) return;
            
            const maxTime = GRAPH_MAX_TIME; // Fixed x-axis scale
            const maxForce = GRAPH_MAX_FORCE; // Fixed y-axis scale
            
            ctx.beginPath();
            ctx.moveTo(gX, gY + gH - (points[0].f / maxForce) * gH);
            
            for(let i = 1; i < points.length; i++) {
                const x = gX + (points[i].t / maxTime) * gW;
                const y = gY + gH - (points[i].f / maxForce) * gH;
                ctx.lineTo(x, y);
            }
            
            ctx.strokeStyle = color;
            ctx.globalAlpha = alpha;
            ctx.lineWidth = fillArea ? 3 : 2;
            ctx.stroke();
            
            // Fill the area under the zeroed net-force curve.
            if (fillArea) {
                const lastX = gX + (points[points.length-1].t / maxTime) * gW;
                ctx.lineTo(lastX, zeroY);
                ctx.lineTo(gX, zeroY);
                ctx.fillStyle = color;
                ctx.globalAlpha = 0.2;
                ctx.fill();
            }
            
            ctx.globalAlpha = 1.0; // Reset alpha
        }

        const OVERLAY_CONTENT = {
            guide: {
                kicker: 'Formula Guide',
                title: 'Impulse to height overview',
                html: `
                    <p>The force plate is zeroed to body weight, so the graph already shows net force.</p>
                    <div class="formula-box">J = F_avg * dt</div>
                    <div class="formula-box">v_i = dv = J / m</div>
                    <div class="formula-box">h = v_takeoff^2 / (2g)</div>
                    <p>For this lab, m = 70 kg and g = 9.81 m/s^2.</p>
                    <div class="formula-box">1 grid box = 0.1 s * 500 N = 50 N*s</div>
                    <p>The shaded area under the curve is the impulse. A wide low graph and a narrow tall graph can have similar areas.</p>
                `
            },
        };

        function openOverlay(key) {
            const content = OVERLAY_CONTENT[key];
            if (!content) return;

            document.getElementById('overlay-kicker').textContent = content.kicker;
            document.getElementById('overlay-title').textContent = content.title;
            document.getElementById('overlay-body').innerHTML = content.html;
            document.getElementById('info-overlay').classList.remove('hidden');
        }

        function closeOverlay() {
            document.getElementById('info-overlay').classList.add('hidden');
        }

        document.querySelectorAll('[data-overlay]').forEach(button => {
            button.addEventListener('click', () => openOverlay(button.dataset.overlay));
        });
        document.getElementById('overlay-close').addEventListener('click', closeOverlay);
        document.getElementById('info-overlay').addEventListener('click', event => {
            if (event.target.id === 'info-overlay') closeOverlay();
        });
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') closeOverlay();
        });
        // ---------- Guided walkthrough ----------
        function graphScreenRect() {
            const rect = container.getBoundingClientRect();
            const layout = graphLayout();
            return {
                left: rect.left + layout.cardX - 6,
                top: rect.top + layout.cardY - 6,
                width: layout.cardW + 12,
                height: layout.cardH + 12
            };
        }

        function jumperScreenRect() {
            const rect = container.getBoundingClientRect();
            const groundY = rect.top + rect.height - GROUND_OFFSET;
            const athleteHeight = Math.max(100, Math.min(190, rect.height * 0.38));
            return {
                left: rect.left + rect.width * 0.25 - 120,
                top: groundY - athleteHeight - 82,
                width: 265,
                height: athleteHeight + 106
            };
        }

        function elementScreenRect(id) {
            const el = document.getElementById(id) || document.querySelector(id);
            if (!el) return null;
            const rect = el.getBoundingClientRect();
            return { left: rect.left - 8, top: rect.top - 8, width: rect.width + 16, height: rect.height + 16 };
        }

        const WALKTHROUGH_STEPS = [
            {
                title: 'Welcome to the Impulse Jump Lab',
                html: '<p>A jumper stands on a <strong>force plate</strong> that measures how hard they push on the ground. This tour shows you every part of the lab so you can collect data and run the impulse calculation on your own.</p>',
                target: null
            },
            {
                title: 'Run a jump trial',
                html: '<p>These three buttons launch different jumps. Each one pushes on the ground with a different <strong>force</strong> for a different amount of <strong>time</strong>.</p><p>Quick Hop is short and weak, Deep Squat is long and moderate, Athletic Max is the strongest push.</p>',
                target: () => elementScreenRect('button-container')
            },
            {
                title: 'Or make your own jump!',
                html: '<p>Press and hold the jumper, <strong>drag straight down</strong> into a squat, and <strong>release</strong> to launch. A deeper squat gives a longer, stronger push — watch the power meter while you pull.</p><p>Your jump appears on the graph as a <strong>purple curve</strong>, so you can compare it with the preset trials.</p>',
                target: () => jumperScreenRect()
            },
            {
                title: 'The force-time graph',
                html: '<p>Watch this graph — I just ran a Quick Hop for you. The curve shows <strong>net force</strong> (in newtons) versus <strong>time</strong> (in seconds) during the push.</p><p>The <strong>shaded area under the curve is the impulse</strong>. Each grid box is 0.1 s wide and 500 N tall, so one box = <strong>50 N·s</strong> of impulse.</p>',
                target: () => graphScreenRect(),
                onEnter: () => {
                    if (state === 'idle' || state === 'landed') startJump(jumpProfiles[0]);
                }
            },
            {
                title: 'Help when you need it',
                html: '<p><strong>Formula Guide</strong> lists every equation you\'ll need — J = F<sub>avg</sub> × Δt, v = J / m, and h = v² / (2g) — plus the 50 N·s grid-box trick for reading impulse off the graph. <strong>Clear Graphs</strong> wipes old curves so you can start fresh.</p><p>Past trials stay on the graph as faded curves so you can compare jump shapes.</p>',
                target: () => elementScreenRect('.lab-header-actions')
            },
            {
                title: 'You\'re ready!',
                html: '<p>Run all three jump profiles and study how the graphs differ. Then try to <strong>beat the Athletic Max Jump</strong> with your own drag-and-release jump — check the height marker on the ruler.</p><p>When you\'re done exploring, <strong>return to Buzz and answer the assessment questions</strong> — that\'s where you\'ll do the impulse calculations. Restart this tour any time with the <strong>Walkthrough</strong> button.</p>',
                target: null
            }
        ];

        let wtIndex = -1;
        const wtSpotlight = document.getElementById('walkthrough-spotlight');
        const wtTooltip = document.getElementById('walkthrough-tooltip');

        function startWalkthrough() {
            closeOverlay();
            wtIndex = 0;
            showWalkthroughStep();
        }

        function endWalkthrough() {
            wtIndex = -1;
            wtSpotlight.classList.add('hidden');
            wtTooltip.classList.add('hidden');
        }

        function positionWalkthrough() {
            if (wtIndex < 0) return;
            const step = WALKTHROUGH_STEPS[wtIndex];
            const rect = step.target ? step.target() : null;
            const margin = 12;

            if (rect) {
                wtSpotlight.classList.remove('hidden');
                wtSpotlight.style.left = rect.left + 'px';
                wtSpotlight.style.top = rect.top + 'px';
                wtSpotlight.style.width = rect.width + 'px';
                wtSpotlight.style.height = rect.height + 'px';

                const ttHeight = wtTooltip.offsetHeight || 200;
                const ttWidth = wtTooltip.offsetWidth || 340;
                let top = rect.top + rect.height + margin;
                if (top + ttHeight > window.innerHeight - margin) {
                    top = Math.max(margin, rect.top - ttHeight - margin);
                }
                let left = clamp(rect.left + rect.width / 2 - ttWidth / 2, margin, window.innerWidth - ttWidth - margin);
                wtTooltip.style.left = left + 'px';
                wtTooltip.style.top = top + 'px';
            } else {
                wtSpotlight.classList.remove('hidden');
                wtSpotlight.style.left = '50%';
                wtSpotlight.style.top = '-20px';
                wtSpotlight.style.width = '0px';
                wtSpotlight.style.height = '0px';
                const ttHeight = wtTooltip.offsetHeight || 200;
                const ttWidth = wtTooltip.offsetWidth || 340;
                wtTooltip.style.left = Math.max(margin, (window.innerWidth - ttWidth) / 2) + 'px';
                wtTooltip.style.top = Math.max(margin, (window.innerHeight - ttHeight) / 2.5) + 'px';
            }
        }

        function showWalkthroughStep() {
            const step = WALKTHROUGH_STEPS[wtIndex];
            if (!step) { endWalkthrough(); return; }

            if (typeof step.onEnter === 'function') step.onEnter();

            document.getElementById('wt-kicker').textContent = 'Walkthrough — ' + (wtIndex + 1) + ' of ' + WALKTHROUGH_STEPS.length;
            document.getElementById('wt-title').textContent = step.title;
            document.getElementById('wt-body').innerHTML = step.html;
            document.getElementById('wt-back').style.visibility = wtIndex === 0 ? 'hidden' : 'visible';
            document.getElementById('wt-next').textContent = wtIndex === WALKTHROUGH_STEPS.length - 1 ? 'Finish' : 'Next';
            wtTooltip.classList.remove('hidden');
            positionWalkthrough();
        }

        document.getElementById('wt-next').addEventListener('click', () => {
            if (wtIndex >= WALKTHROUGH_STEPS.length - 1) { endWalkthrough(); return; }
            wtIndex += 1;
            showWalkthroughStep();
        });
        document.getElementById('wt-back').addEventListener('click', () => {
            if (wtIndex > 0) { wtIndex -= 1; showWalkthroughStep(); }
        });
        document.getElementById('wt-exit').addEventListener('click', endWalkthrough);
        window.addEventListener('resize', positionWalkthrough);
        document.addEventListener('keydown', event => {
            if (wtIndex < 0) return;
            if (event.key === 'Escape') endWalkthrough();
            if (event.key === 'ArrowRight') document.getElementById('wt-next').click();
            if (event.key === 'ArrowLeft') document.getElementById('wt-back').click();
        });

        // Offer the tour automatically the first time the lab opens this session.
        try {
            if (!sessionStorage.getItem('impulseLabTourSeen')) {
                sessionStorage.setItem('impulseLabTourSeen', '1');
                startWalkthrough();
            }
        } catch (err) {
            startWalkthrough();
        }

        // Start animation loop
        requestAnimationFrame(animate);
    </script>
</body>
</html>
