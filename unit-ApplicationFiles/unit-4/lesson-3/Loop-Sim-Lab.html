<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Lab: Loop-the-Loop Simulation</title>
    <style>
        :root {
            --navy-950: #07111f;
            --navy-900: #0c1b2e;
            --navy-800: #122943;
            --panel: rgba(13, 31, 52, 0.92);
            --panel-soft: rgba(19, 43, 69, 0.88);
            --line: rgba(151, 184, 211, 0.28);
            --ink: #edf7ff;
            --muted: #a9bfd2;
            --blue: #57b5ff;
            --cyan: #52e0d4;
            --orange: #ff9b5a;
            --green: #62d99c;
            --red: #ff6b6b;
        }

        * { box-sizing: border-box; }

        body {
            background:
                radial-gradient(circle at 18% 12%, rgba(37, 112, 163, 0.25), transparent 30%),
                linear-gradient(145deg, var(--navy-900), var(--navy-950));
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        #simulation-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: clamp(0.65rem, 2vw, 1.25rem);
            gap: 1rem;
        }

        @media (min-width: 1024px) {
            #simulation-container {
                flex-direction: row;
            }
        }

        #canvas-wrapper {
            flex-grow: 1;
            background-color: var(--navy-900);
            border: 1px solid var(--line);
            border-radius: 1rem;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
            overflow: hidden;
            position: relative;
            min-height: 620px;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #controls-panel {
            width: 100%;
            background-color: var(--panel);
            border-radius: 0.75rem;
            padding: 1.5rem;
            border: 1px solid var(--line);
            box-shadow: 0 18px 44px rgba(0, 0, 0, 0.24);
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            overflow-y: auto;
        }

        @media (min-width: 1024px) {
            #controls-panel {
                width: 350px;
                min-width: 350px;
            }
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
        }
        
        .val-display {
            color: var(--blue);
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--blue);
        }

        select {
            background-color: var(--navy-800);
            color: var(--ink);
            border: 1px solid var(--line);
            border-radius: 0.375rem;
            padding: 0.5rem;
            font-size: 0.875rem;
            outline: none;
        }
        
        select:focus {
            border-color: var(--blue);
        }

        .btn {
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            border: none;
            color: var(--ink);
            font-size: 1rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1976c7, #0b9ea4);
            box-shadow: 0 10px 24px rgba(20, 142, 190, 0.28);
        }

        .btn-primary:hover {
            filter: brightness(1.1);
        }

        .btn-danger {
            background: #a83d4a;
            box-shadow: 0 10px 24px rgba(168, 61, 74, 0.24);
        }

        .btn-danger:hover {
            filter: brightness(1.1);
        }
        
        .btn:disabled {
            background-color: #496176;
            cursor: not-allowed;
            box-shadow: none;
        }

        .hud {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(7, 19, 33, 0.83);
            backdrop-filter: blur(10px);
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9rem;
            pointer-events: none;
            border: 1px solid var(--line);
        }
        
        .hud-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 4px;
        }

        .hud-label { color: var(--muted); }
        .hud-value { color: var(--ink); font-weight: bold; }
        
        #energy-bar-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 200px;
            background: rgba(7, 19, 33, 0.83);
            backdrop-filter: blur(10px);
            border-radius: 8px;
            border: 1px solid var(--line);
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            gap: 5px;
        }

        .bar-wrapper {
            width: 30px;
            height: 100%;
            background-color: rgba(124, 160, 188, 0.18);
            position: relative;
            border-radius: 4px;
            overflow: hidden;
        }

        .bar {
            position: absolute;
            bottom: 0;
            width: 100%;
            border-radius: 4px 4px 0 0;
            transition: height 0.1s;
        }

        #ke-bar { background: linear-gradient(#9bf1bd, var(--green)); }
        #pe-bar { background: linear-gradient(#8ad8ff, var(--blue)); }
        
        .bar-label {
            font-size: 0.7rem;
            font-weight: bold;
            color: var(--muted);
        }
        
        .bar-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            width: 100%;
        }

        /* Message Box Overlay */
        #message-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        
        #message-box {
            background: var(--navy-800);
            padding: 2rem;
            border-radius: 1rem;
            max-width: 400px;
            text-align: center;
            border: 1px solid var(--line);
            box-shadow: 0 24px 70px rgba(0,0,0,.45);
        }

        #message-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        
        .success-title { color: var(--green); }
        .fail-title { color: var(--red); }
        .accent-text { color: var(--blue); }
        .message-copy { margin: 0 0 1.5rem; color: var(--muted); }
        .wide { width: 100%; }

        @media (max-width: 760px) {
            #canvas-wrapper { min-height: 760px; }
            .hud { left: 12px; right: 12px; top: 12px; }
            #height-control-container { top: 190px !important; bottom: 210px !important; left: 12px !important; }
            #energy-bar-container { right: 12px !important; bottom: 210px !important; }
            #bottom-controls { left: 12px !important; right: 12px !important; flex-wrap: wrap; gap: 8px; }
            #bottom-controls > div { width: calc(50% - 4px) !important; }
            #bottom-controls > div:nth-child(2) { order: 3; width: 100% !important; justify-content: center; }
        }
    </style>
</head>
<body>

    <div id="simulation-container">
        <!-- Canvas Area -->
        <div id="canvas-wrapper">
            <canvas id="simCanvas"></canvas>
            
            <!-- Heads Up Display -->
            <div class="hud">
                <div class="hud-row"><span class="hud-label">Velocity (v):</span> <span class="hud-value" id="hud-v">0.0 m/s</span></div>
                <div class="hud-row"><span class="hud-label">Height (h):</span> <span class="hud-value" id="hud-h">0.0 m</span></div>
                <div class="hud-row"><span class="hud-label">Kinetic E (KE):</span> <span class="hud-value" id="hud-ke">0 J</span></div>
                <div class="hud-row"><span class="hud-label">Potential E (PE):</span> <span class="hud-value" id="hud-pe">0 J</span></div>
                <div class="hud-row"><span class="hud-label">Total E (TE):</span> <span class="hud-value" id="hud-te">0 J</span></div>
            </div>

            <!-- Canvas Overlay Controls -->
            
            <!-- Left Side: Vertical Height Slider -->
            <div id="height-control-container" style="position: absolute; left: 20px; top: 50px; bottom: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(45, 55, 72, 0.8); padding: 15px; border-radius: 8px; border: 1px solid #4a5568;">
                <label style="writing-mode: vertical-rl; transform: rotate(180deg); color: #cbd5e1; font-weight: bold; margin-bottom: 10px;">Height (h): <span id="height-val" class="accent-text">50 m</span></label>
                <input type="range" id="height-slider" min="10" max="100" value="50" step="1" style="writing-mode: vertical-lr; direction: rtl; appearance: slider-vertical; height: 100%; width: 20px; accent-color: #3b82f6;">
            </div>

            <!-- Bottom Controls Container -->
            <div id="bottom-controls" style="position: absolute; bottom: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none;">
                
                <!-- Bottom Left: Friction -->
                <div style="background: rgba(45, 55, 72, 0.8); padding: 10px 15px; border-radius: 8px; border: 1px solid #4a5568; pointer-events: auto; width: 200px;">
                    <label for="friction-slider" style="color: #cbd5e1; font-weight: bold; font-size: 0.8rem; display: flex; justify-content: space-between;">Friction (&mu;) <span id="friction-val" class="accent-text">0.00</span></label>
                    <input type="range" id="friction-slider" min="0" max="0.1" value="0" step="0.01" style="width: 100%; accent-color: #3b82f6; margin-top: 5px;">
                </div>

                <!-- Center: Action Buttons -->
                <div style="display: flex; gap: 10px; pointer-events: auto;">
                    <button id="btn-start" class="btn btn-primary" onclick="startSimulation()">Release Cart</button>
                    <button id="btn-reset" class="btn btn-danger" onclick="resetSimulation()" disabled>Reset Position</button>
                </div>

                <!-- Bottom Right: Mass -->
                <div style="background: rgba(45, 55, 72, 0.8); padding: 10px 15px; border-radius: 8px; border: 1px solid #4a5568; pointer-events: auto; width: 200px;">
                    <label for="mass-slider" style="color: #cbd5e1; font-weight: bold; font-size: 0.8rem; display: flex; justify-content: space-between;">Cart Mass (m) <span id="mass-val" class="accent-text">100 kg</span></label>
                    <input type="range" id="mass-slider" min="50" max="500" value="100" step="10" style="width: 100%; accent-color: #3b82f6; margin-top: 5px;">
                </div>

            </div>

            <!-- Energy Bars (Moved up slightly to avoid bottom controls) -->
            <div id="energy-bar-container" style="bottom: 90px;">
                <div style="display: flex; gap: 10px; height: 100%;">
                    <div class="bar-group">
                        <div class="bar-wrapper"><div id="ke-bar" class="bar" style="height: 0%"></div></div>
                        <span class="bar-label">KE</span>
                    </div>
                    <div class="bar-group">
                        <div class="bar-wrapper"><div id="pe-bar" class="bar" style="height: 0%"></div></div>
                        <span class="bar-label">PE</span>
                    </div>
                </div>
            </div>
            
            <!-- Overlay Message -->
            <div id="message-overlay">
                <div id="message-box">
                    <div id="message-title">Result</div>
                    <p id="message-text" class="message-copy">The cart completed the loop!</p>
                    <button class="btn btn-primary wide" onclick="closeMessage()">Continue</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Canvas Setup
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        // Physics Constants & State
        let state = {
            running: false,
            time: 0,
            dt: 0.016, // roughly 60fps
            scale: 6, // pixels per meter
            offsetX: 0,
            offsetY: 0
        };

        // Track Parameters
        let track = {
            startX: 50, // pixels
            groundY: 0, // pixels, calculated later
            rampLength: 100 // meters roughly
        };

        // Adjustable Parameters
        let params = {
            h0: 50,      // Initial height (m)
            R: 20,       // Loop radius (m) - Fixed now since slider is removed
            m: 100,      // Mass (kg)
            g: 9.81,     // Gravity (m/s^2) - Fixed to Earth
            mu: 0.0      // Coefficient of friction
        };

        const MAX_H = 100; // Fixed maximum height for the track ramp

        // Cart State
        let cart = {
            s: 0,        // Arc length position along track
            v: 0,        // Velocity
            x: 0,        // x pos (m)
            y: 0,        // y pos (m)
            angle: 0,    // angle for drawing
            fell: false, // Did it fall off?
            fallVx: 0,   // Velocity when falling
            fallVy: 0,
            completed: false,
            trail: []
        };

        // Track Geometry calculation helpers
        // We model the track as a smooth curve using a piecewise function parameterized by arc length 's'
        // Section 1: Ramp down to ground
        // Section 2: Flat to loop
        // Section 3: The loop
        // Section 4: Flat exit

        let trackData = {
            rampRun: 60,
            lengthRamp: 0,
            lengthFlatIn: 30, // Increased to push loop right
            lengthLoop: 0,
            lengthFlatOut: 50,
            totalLength: 0,
            loopStartX: 0
        };

        // DOM Elements
        const hudV = document.getElementById('hud-v');
        const hudH = document.getElementById('hud-h');
        const hudKE = document.getElementById('hud-ke');
        const hudPE = document.getElementById('hud-pe');
        const hudTE = document.getElementById('hud-te');
        const keBar = document.getElementById('ke-bar');
        const peBar = document.getElementById('pe-bar');
        
        const btnStart = document.getElementById('btn-start');
        const btnReset = document.getElementById('btn-reset');
        
        const overlay = document.getElementById('message-overlay');
        const msgTitle = document.getElementById('message-title');
        const msgText = document.getElementById('message-text');

        function resize() {
            const wrapper = document.getElementById('canvas-wrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            width = canvas.width;
            height = canvas.height;
            
            // Adjust scale based on screen size to keep track visible (narrowed to zoom in properly on the new layout)
            state.scale = Math.min(width / 180, height / 140);
            
            track.groundY = height - 80;
            track.startX = width * 0.05; // Moved slightly left to give more room for the loop
            
            updateTrackGeometry();
            if (!state.running && !cart.fell && !cart.completed) {
                resetSimulation();
            } else {
                draw(); // Redraw current state if resizing while paused/finished
            }
        }

        window.addEventListener('resize', resize);

        // UI Event Listeners
        const uiControls = ['height', 'mass', 'friction'];
        uiControls.forEach(ctrl => {
            const slider = document.getElementById(`${ctrl}-slider`);
            const valDisplay = document.getElementById(`${ctrl}-val`);
            
            if(slider) {
                slider.addEventListener('input', (e) => {
                    let val = parseFloat(e.target.value);
                    if (ctrl === 'friction') val = val.toFixed(2);
                    valDisplay.textContent = val + (ctrl === 'mass' ? ' kg' : (ctrl === 'friction' ? '' : ' m'));
                    
                    // Update params
                    if(ctrl === 'height') params.h0 = parseFloat(val);
                    if(ctrl === 'mass') params.m = parseFloat(val);
                    if(ctrl === 'friction') params.mu = parseFloat(val);
                    
                    if (!state.running) {
                        resetSimulation();
                    }
                });
            }
        });

        function updateTrackGeometry() {
            // Simplified track model with a fixed max-height ramp
            let R = params.R;
            
            // Fixed ramp properties so track doesn't visually resize
            let rampDx = trackData.rampRun;
            trackData.lengthRamp = Math.sqrt(rampDx*rampDx + MAX_H*MAX_H);
            
            // Lengthened flat-in section so the loop's left edge (which extends back by R=20) 
            // doesn't overlap with the bottom of the ramp
            trackData.lengthFlatIn = 30; 
            trackData.loopStartX = rampDx + trackData.lengthFlatIn;
            trackData.lengthLoop = 2 * Math.PI * R;
            trackData.lengthFlatOut = 50;
            
            trackData.totalLength = trackData.lengthRamp + trackData.lengthFlatIn + trackData.lengthLoop + trackData.lengthFlatOut;
        }

        function getPositionAtS(s) {
            let R = params.R;
            let rampDx = trackData.rampRun;
            
            let pos = { x: 0, y: 0, angle: 0, curvature: 0, section: '' };

            if (s <= trackData.lengthRamp) {
                // On Ramp
                pos.section = 'ramp';
                let fraction = s / trackData.lengthRamp;
                pos.x = fraction * rampDx;
                pos.y = MAX_H - (fraction * MAX_H); // y is height from ground
                pos.angle = Math.atan2(-MAX_H, rampDx); // negative pointing down-right
                pos.curvature = 0;
            } 
            else if (s <= trackData.lengthRamp + trackData.lengthFlatIn) {
                // Flat before loop
                pos.section = 'flatIn';
                let sInFlat = s - trackData.lengthRamp;
                pos.x = rampDx + sInFlat;
                pos.y = 0;
                pos.angle = 0;
                pos.curvature = 0;
            }
            else if (s <= trackData.lengthRamp + trackData.lengthFlatIn + trackData.lengthLoop) {
                // In the Loop
                pos.section = 'loop';
                let sInLoop = s - (trackData.lengthRamp + trackData.lengthFlatIn);
                let theta = (sInLoop / trackData.lengthLoop) * 2 * Math.PI; // angle starting from bottom, going CCW
                
                // Loop center is directly above loopStartX for a perfect tangent entry
                let centerX = trackData.loopStartX;
                let centerY = R;
                
                pos.x = centerX + R * Math.sin(theta); // CCW: right, up, left, down
                pos.y = centerY - R * Math.cos(theta); // starts at 0, peaks at 2R
                pos.angle = theta;
                pos.curvature = 1/R;
            }
            else {
                // Flat after loop
                pos.section = 'flatOut';
                let sOut = s - (trackData.lengthRamp + trackData.lengthFlatIn + trackData.lengthLoop);
                pos.x = trackData.loopStartX + sOut; // Continues strictly forward from loop bottom
                pos.y = 0;
                pos.angle = 0;
                pos.curvature = 0;
            }

            return pos;
        }

        function physicsStep() {
            if (!state.running) return;

            if (cart.fell) {
                // Projectile motion if fallen
                cart.fallVy -= params.g * state.dt; // Gravity pulls down
                cart.x += cart.fallVx * state.dt;
                cart.y += cart.fallVy * state.dt;
                
                cart.v = Math.sqrt(cart.fallVx**2 + cart.fallVy**2);

                if (cart.y <= 0) { // Hit ground
                    cart.y = 0;
                    state.running = false;
                    showMessage("Crash!", "The cart lost contact with the track and crashed.", false);
                    enableControls(true);
                }
                return;
            }

            // Normal track physics
            let pos = getPositionAtS(cart.s);
            let theta = pos.angle; // Angle of track relative to horizontal
            
            // Gravity component along track
            let a_gravity = -params.g * Math.sin(theta);
            
            // Friction (simplified, rolling/sliding combo)
            // Normal force N = mg*cos(theta) + m*v^2/R (centripetal)
            // If normal force < 0 in loop, it falls
            let centripetalAcc = 0;
            if (pos.section === 'loop') {
                centripetalAcc = (cart.v * cart.v) / params.R;
            }
            
            // Note: angle theta is 0 at bottom, PI at top.
            // cos(0) = 1 (bottom), cos(PI) = -1 (top).
            // Normal force pushes track ONTO cart.
            let normalForce_per_m = params.g * Math.cos(theta) + centripetalAcc;
            
            // Check if falling (only possible in upper half of loop where gravity opposes normal force)
            if (pos.section === 'loop' && normalForce_per_m <= 0) {
                cart.fell = true;
                // Convert tangential velocity to x/y velocity
                cart.fallVx = cart.v * Math.cos(theta); 
                cart.fallVy = cart.v * Math.sin(theta);
                return; // Switch to projectile motion next frame
            }

            // Calculate friction acceleration
            let a_friction = 0;
            if (cart.v > 0.01 || cart.v < -0.01) {
                let N = Math.abs(normalForce_per_m);
                a_friction = -Math.sign(cart.v) * params.mu * N;
            } else if (Math.abs(a_gravity) < params.mu * params.g * Math.cos(theta)) {
                // Static friction holds it (simplification)
                cart.v = 0;
                a_gravity = 0;
            }

            let acceleration = a_gravity + a_friction;
            
            // Update velocity and position
            cart.v += acceleration * state.dt;
            cart.s += cart.v * state.dt;
            
            // Prevent going backward off start
            if (cart.s < 0) {
                cart.s = 0;
                cart.v = 0;
            }

            // Update cart x,y from the same continuous path used to draw the rail.
            let newPos = getPositionAtS(cart.s);
            cart.x = newPos.x;
            cart.y = newPos.y;
            cart.angle = newPos.angle;
            let lastTrail = cart.trail[cart.trail.length - 1];
            if (!lastTrail || Math.hypot(cart.x - lastTrail.x, cart.y - lastTrail.y) > 1.8) {
                cart.trail.push({ x: cart.x, y: cart.y });
                if (cart.trail.length > 34) cart.trail.shift();
            }

            // Check completion
            if (cart.s >= trackData.totalLength - 5) { // Reached end
                state.running = false;
                cart.completed = true;
                cart.v = 0; // stop it
                showMessage("Success!", "The cart successfully completed the loop!", true);
                enableControls(true);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            let scale = state.scale;
            let ox = track.startX;
            let oy = track.groundY;
            function toCanvas(px, py) {
                return { x: ox + px * scale, y: oy - py * scale };
            }
            function traceTrack() {
                ctx.beginPath();
                let step = 0.45;
                for (let distance = 0; distance <= trackData.totalLength + step; distance += step) {
                    let point = getPositionAtS(Math.min(distance, trackData.totalLength));
                    let mapped = toCanvas(point.x, point.y);
                    distance === 0 ? ctx.moveTo(mapped.x, mapped.y) : ctx.lineTo(mapped.x, mapped.y);
                }
            }
            function label(text, x, y, align) {
                ctx.save();
                ctx.font = '700 12px Inter, system-ui, sans-serif';
                ctx.textAlign = align || 'left';
                let pad = 7;
                let textWidth = ctx.measureText(text).width;
                let left = align === 'center' ? x - textWidth / 2 - pad : x - pad;
                ctx.fillStyle = 'rgba(7, 18, 31, 0.82)';
                ctx.beginPath();
                ctx.roundRect(left, y - 15, textWidth + pad * 2, 24, 7);
                ctx.fill();
                ctx.fillStyle = '#dcefff';
                ctx.fillText(text, x, y + 2);
                ctx.restore();
            }

            // Layered sky and landscape add depth without competing with the track.
            let sky = ctx.createLinearGradient(0, 0, 0, oy);
            sky.addColorStop(0, '#07172a');
            sky.addColorStop(0.62, '#12365a');
            sky.addColorStop(1, '#2d6280');
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, width, oy);
            for (let i = 0; i < 34; i++) {
                let sx = (i * 83 + 29) % Math.max(width, 1);
                let sy = (i * 47 + 21) % Math.max(oy * 0.62, 1);
                ctx.fillStyle = i % 4 === 0 ? 'rgba(166, 226, 255, .58)' : 'rgba(255,255,255,.32)';
                ctx.fillRect(sx, sy, i % 5 === 0 ? 2 : 1, i % 5 === 0 ? 2 : 1);
            }
            ctx.fillStyle = 'rgba(28, 67, 89, .72)';
            ctx.beginPath();
            ctx.moveTo(0, oy);
            for (let x = 0; x <= width; x += 70) {
                ctx.lineTo(x, oy - 34 - ((x / 70) % 3) * 18);
            }
            ctx.lineTo(width, oy);
            ctx.closePath();
            ctx.fill();

            let ground = ctx.createLinearGradient(0, oy, 0, height);
            ground.addColorStop(0, '#183b42');
            ground.addColorStop(1, '#0b2029');
            ctx.fillStyle = ground;
            ctx.fillRect(0, oy, width, height - oy);
            ctx.strokeStyle = 'rgba(95, 212, 194, .28)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, oy);
            ctx.lineTo(width, oy);
            ctx.stroke();

            // Height guides connect the release control to the physical scene.
            ctx.save();
            ctx.setLineDash([4, 7]);
            ctx.font = '600 11px Inter, system-ui, sans-serif';
            ctx.textAlign = 'left';
            for (let meters = 20; meters <= 100; meters += 20) {
                let y = toCanvas(0, meters).y;
                ctx.strokeStyle = meters === 40 ? 'rgba(255, 155, 90, .36)' : 'rgba(175, 210, 232, .13)';
                ctx.beginPath();
                ctx.moveTo(ox, y);
                ctx.lineTo(width - 16, y);
                ctx.stroke();
                ctx.fillStyle = 'rgba(205, 228, 242, .66)';
                ctx.fillText(meters + ' m', ox + 5, y - 5);
            }
            ctx.restore();

            // Structural loop supports.
            let center = toCanvas(trackData.loopStartX, params.R);
            let leftFoot = toCanvas(trackData.loopStartX - params.R * 0.72, 0);
            let rightFoot = toCanvas(trackData.loopStartX + params.R * 0.72, 0);
            ctx.strokeStyle = 'rgba(124, 157, 181, .45)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(leftFoot.x, leftFoot.y);
            ctx.lineTo(center.x, center.y);
            ctx.lineTo(rightFoot.x, rightFoot.y);
            ctx.moveTo(center.x, oy);
            ctx.lineTo(center.x, center.y);
            ctx.stroke();
            for (let brace = 0.25; brace < 1; brace += 0.25) {
                let by = oy - params.R * scale * brace;
                let bx = params.R * scale * 0.72 * (1 - brace);
                ctx.beginPath();
                ctx.moveTo(center.x - bx, by);
                ctx.lineTo(center.x + bx, by);
                ctx.stroke();
            }

            // Sleepers are perpendicular to the exact centerline.
            ctx.strokeStyle = '#5f7890';
            ctx.lineWidth = 2;
            for (let distance = 2; distance < trackData.totalLength; distance += 6) {
                let point = getPositionAtS(distance);
                let mapped = toCanvas(point.x, point.y);
                let nx = -Math.sin(point.angle) * 6;
                let ny = -Math.cos(point.angle) * 6;
                ctx.beginPath();
                ctx.moveTo(mapped.x - nx, mapped.y - ny);
                ctx.lineTo(mapped.x + nx, mapped.y + ny);
                ctx.stroke();
            }

            // A shadow, rail, and highlight make one continuous path visually explicit.
            traceTrack();
            ctx.strokeStyle = 'rgba(0, 0, 0, .55)';
            ctx.lineWidth = 11;
            ctx.lineJoin = 'round';
            ctx.stroke();
            traceTrack();
            ctx.strokeStyle = '#b8cad7';
            ctx.lineWidth = 7;
            ctx.stroke();
            traceTrack();
            ctx.strokeStyle = '#eff8ff';
            ctx.lineWidth = 2;
            ctx.stroke();

            let startS = trackData.lengthRamp * (MAX_H - params.h0) / MAX_H;
            let release = getPositionAtS(startS);
            let releaseCanvas = toCanvas(release.x, release.y);
            ctx.fillStyle = '#57b5ff';
            ctx.beginPath();
            ctx.arc(releaseCanvas.x, releaseCanvas.y, 5, 0, Math.PI * 2);
            ctx.fill();
            label('release ' + params.h0.toFixed(0) + ' m', releaseCanvas.x + 2, releaseCanvas.y - 18, 'center');

            let entryCanvas = toCanvas(trackData.loopStartX, 0);
            ctx.strokeStyle = '#52e0d4';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(entryCanvas.x, entryCanvas.y - 10);
            ctx.lineTo(entryCanvas.x, entryCanvas.y + 10);
            ctx.stroke();
            label('loop entry', entryCanvas.x, entryCanvas.y + 31, 'center');
            label('R = 20 m', center.x, center.y + 3, 'center');

            // Motion trail makes high-speed travel easy to follow.
            cart.trail.forEach(function (point, index) {
                let mapped = toCanvas(point.x, point.y);
                let alpha = (index + 1) / cart.trail.length * 0.28;
                ctx.fillStyle = 'rgba(87, 181, 255, ' + alpha.toFixed(3) + ')';
                ctx.beginPath();
                ctx.arc(mapped.x, mapped.y - 8, 1.5 + alpha * 4, 0, Math.PI * 2);
                ctx.fill();
            });

            let cartCanvas = toCanvas(cart.x, cart.y);
            let cartAngle = cart.fell ? Math.atan2(-cart.fallVy, cart.fallVx) : -cart.angle;
            let speed = cart.fell ? Math.hypot(cart.fallVx, cart.fallVy) : Math.abs(cart.v);

            // Velocity vector.
            let vectorLength = Math.min(70, 18 + speed * 1.25);
            let vx = Math.cos(cartAngle) * vectorLength;
            let vy = Math.sin(cartAngle) * vectorLength;
            ctx.save();
            ctx.translate(cartCanvas.x, cartCanvas.y - 13);
            ctx.strokeStyle = '#52e0d4';
            ctx.fillStyle = '#52e0d4';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(vx, vy);
            ctx.stroke();
            ctx.translate(vx, vy);
            ctx.rotate(cartAngle);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-9, -5);
            ctx.lineTo(-9, 5);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            // Detailed cart with wheel rotation tied to distance traveled.
            ctx.save();
            ctx.translate(cartCanvas.x, cartCanvas.y);
            ctx.rotate(cartAngle);
            ctx.shadowColor = 'rgba(0,0,0,.45)';
            ctx.shadowBlur = 9;
            ctx.shadowOffsetY = 4;
            let bodyGradient = ctx.createLinearGradient(0, -18, 0, 0);
            bodyGradient.addColorStop(0, '#ffb06d');
            bodyGradient.addColorStop(1, '#e5533f');
            ctx.fillStyle = bodyGradient;
            ctx.beginPath();
            ctx.roundRect(-17, -17, 34, 14, 5);
            ctx.fill();
            ctx.fillStyle = '#dcefff';
            ctx.beginPath();
            ctx.roundRect(-8, -24, 18, 9, 4);
            ctx.fill();
            ctx.shadowColor = 'transparent';
            let wheelSpin = cart.s / 2.7;
            [-10, 10].forEach(function (wheelX) {
                ctx.fillStyle = '#08131f';
                ctx.beginPath();
                ctx.arc(wheelX, -2, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#a9bfd2';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(wheelX, -2);
                ctx.lineTo(wheelX + Math.cos(wheelSpin) * 5, -2 + Math.sin(wheelSpin) * 5);
                ctx.stroke();
            });
            ctx.restore();

            label(speed.toFixed(1) + ' m/s', cartCanvas.x, cartCanvas.y - 42, 'center');
            updateHUD();
        }

        function updateHUD() {
            // Calculations
            let v = Math.abs(cart.v);
            if (cart.fell) v = Math.sqrt(cart.fallVx**2 + cart.fallVy**2);
            
            let h = cart.y;
            
            let KE = 0.5 * params.m * v * v;
            let PE = params.m * params.g * h;
            let TE = KE + PE;

            // Max Initial Energy for scaling bars (locked to visual max height to easily see lower energy)
            let maxTE = params.m * params.g * MAX_H;
            // Ensure we don't divide by zero
            if (maxTE <= 0) maxTE = 1; 

            // Update text
            hudV.textContent = v.toFixed(1) + " m/s";
            hudH.textContent = h.toFixed(1) + " m";
            hudKE.textContent = Math.round(KE) + " J";
            hudPE.textContent = Math.round(PE) + " J";
            hudTE.textContent = Math.round(TE) + " J";

            // Update bars (percentage)
            let kePct = (KE / maxTE) * 100;
            let pePct = (PE / maxTE) * 100;
            
            // Cap at 100% for visual sanity (though with friction it will just be lower)
            keBar.style.height = Math.min(100, Math.max(0, kePct)) + "%";
            peBar.style.height = Math.min(100, Math.max(0, pePct)) + "%";
        }

        function startSimulation() {
            if (state.running) return;
            
            updateTrackGeometry();
            
            // Start position offset based on slider vs visual max height
            cart.s = trackData.lengthRamp * (MAX_H - params.h0) / MAX_H;
            cart.v = 0;
            cart.fell = false;
            cart.completed = false;
            cart.trail = [];
            
            let startPos = getPositionAtS(cart.s);
            cart.x = startPos.x;
            cart.y = startPos.y;
            cart.angle = startPos.angle;

            state.running = true;
            enableControls(false);
            
            overlay.style.display = 'none';
        }

        function resetSimulation() {
            state.running = false;
            updateTrackGeometry();
            
            // Start position offset based on slider vs visual max height
            cart.s = trackData.lengthRamp * (MAX_H - params.h0) / MAX_H;
            cart.v = 0;
            cart.fell = false;
            cart.completed = false;
            cart.trail = [];
            
            let startPos = getPositionAtS(cart.s);
            cart.x = startPos.x;
            cart.y = startPos.y;
            cart.angle = startPos.angle;

            enableControls(true);
            overlay.style.display = 'none';
            draw();
        }

        function enableControls(enable) {
            uiControls.forEach(ctrl => {
                const slider = document.getElementById(`${ctrl}-slider`);
                if(slider) slider.disabled = !enable;
            });
            
            btnStart.disabled = !enable;
            btnReset.disabled = enable; // Only enable reset if running/finished
        }

        function showMessage(title, text, success) {
            msgTitle.textContent = title;
            msgText.textContent = text;
            
            msgTitle.className = success ? 'success-title' : 'fail-title';
            msgTitle.style.fontSize = '1.5rem';
            msgTitle.style.fontWeight = 'bold';
            msgTitle.style.marginBottom = '1rem';
            
            overlay.style.display = 'flex';
        }

        function closeMessage() {
            overlay.style.display = 'none';
        }

        // Main Animation Loop
        let lastTime = 0;
        function loop(timestamp) {
            // Calculate dt, cap it to prevent huge jumps if tab is inactive
            if (!lastTime) lastTime = timestamp;
            let dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;
            
            if (dt > 0.05) dt = 0.05;

            // Moderate time scaling plus small adaptive steps prevents boundary skipping.
            let timeScale = 1.65;
            dt *= timeScale;
            
            if (state.running) {
                const physicsSteps = Math.max(1, Math.ceil(dt / 0.004));
                state.dt = dt / physicsSteps;
                for(let i=0; i<physicsSteps; i++) {
                    physicsStep();
                }
            }
            
            draw();
            requestAnimationFrame(loop);
        }

        // Initialization
        window.onload = () => {
            resize();
            resetSimulation();
            requestAnimationFrame(loop);
        };

    </script>
</body>
</html>
