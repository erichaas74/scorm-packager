<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Light Color and Vision Lab</title>
<style>

:root{
  --blue:#285f9f;
  --blue-dark:#17436f;
  --ink:#172033;
  --muted:#5c6678;
  --line:#cfd8e6;
  --soft:#eef5fb;
  --panel:#ffffff;
  --good:#17643b;
  --warn:#8a4b08;
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
body{padding:10px}
button,input{font:inherit}
button{min-height:44px;min-width:44px;border-radius:10px;border:2px solid var(--blue);background:#fff;color:var(--blue-dark);font-weight:700;padding:10px 14px;cursor:pointer}
button:hover{background:#f2f7fc}
button:focus-visible,input:focus-visible{outline:4px solid #f2b705;outline-offset:3px}
button[disabled]{opacity:.55;cursor:not-allowed}
.rph-app{max-width:980px;margin:0 auto;border:5px solid var(--blue);border-radius:22px;background:#fff;overflow:hidden}
.rph-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:#f8fbfe}
.rph-title{margin:0;font-size:1.05rem;color:var(--blue-dark)}
.rph-stage{min-height:440px;padding:18px;background:linear-gradient(180deg,#f9fcff,#eef5fb);display:grid;place-items:center}
.rph-scene{width:min(100%,860px);min-height:330px;border:1px solid var(--line);border-radius:18px;background:white;position:relative;overflow:hidden}
.rph-card{padding:16px;border-top:1px solid var(--line);background:#fff}
.rph-prompt{margin:0 0 12px;font-weight:700;font-size:1.05rem}
.rph-setup{margin:0 0 12px;color:var(--muted)}
.rph-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rph-feedback{min-height:48px;margin:12px 0 0;padding:10px 12px;border-radius:10px;background:#f5f7fa;color:var(--ink)}
.rph-controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.rph-progress{font-size:.9rem;color:var(--muted);font-weight:700}
.rph-hidden{display:none!important}
.rph-status{position:absolute;left:-9999px}
.rph-legend{display:flex;flex-wrap:wrap;gap:10px;padding:10px 12px;font-size:.86rem;color:var(--muted)}
.rph-chip{display:inline-flex;align-items:center;gap:6px}
.rph-dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid #455}
svg{width:100%;height:auto;display:block}
@media(max-width:700px){
  .rph-stage{min-height:360px;padding:10px}
  .rph-scene{min-height:300px}
  .rph-choices{grid-template-columns:1fr}
  .rph-top{align-items:flex-start}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}


.cv-object{stroke:#39485b;stroke-width:3}.cv-lamp{fill:#333}.cv-beam{opacity:.35}.cv-text{font:700 16px Arial;fill:#24344c}
.cv-eye{fill:#fff;stroke:#39485b;stroke-width:3}.cv-pupil{fill:#172033}.cv-cone{stroke:#fff;stroke-width:1}

</style>
</head>
<body>
<main class="rph-app">

<header class="rph-top">
 <h1 class="rph-title">Light Color and Vision Lab</h1>
 <div class="rph-progress" id="progress">Scenario 1 of 4</div>
 <button id="resetBtn" type="button">Reset</button>
</header>
<section class="rph-stage" aria-label="Color mixing and color vision simulation">
 <div class="rph-scene">
  <svg viewBox="0 0 860 330" role="img" aria-labelledby="cvTitle cvDesc">
   <title id="cvTitle">Colored light, an object, and a viewer</title>
   <desc id="cvDesc">The scene changes between additive color mixing, colored-object lighting, and cone-response comparisons.</desc>
   <rect width="860" height="330" fill="#fff"/>
   <g id="mixScene">
    <circle id="rCircle" cx="365" cy="150" r="92" fill="#ff2b2b" opacity=".65"/>
    <circle id="gCircle" cx="475" cy="150" r="92" fill="#28a745" opacity=".65"/>
    <circle id="bCircle" cx="420" cy="225" r="92" fill="#2b66ff" opacity=".65"/>
   </g>
   <g id="objectScene" class="rph-hidden">
    <rect x="70" y="110" width="80" height="80" rx="14" class="cv-lamp"/>
    <polygon id="beamPoly" class="cv-beam" points="150,125 560,80 560,245 150,175" fill="#34a853"/>
    <circle id="object" class="cv-object" cx="575" cy="165" r="70" fill="#d43c9f"/>
    <ellipse class="cv-eye" cx="755" cy="165" rx="55" ry="34"/>
    <circle class="cv-pupil" cx="755" cy="165" r="14"/>
   </g>
   <g id="coneScene" class="rph-hidden">
    <text class="cv-text" x="105" y="55">Human cone responses</text>
    <rect x="105" y="90" width="85" height="170" rx="10" fill="#d94141"/>
    <rect x="220" y="120" width="85" height="140" rx="10" fill="#39a852"/>
    <rect x="335" y="150" width="85" height="110" rx="10" fill="#3f68d7"/>
    <text class="cv-text" x="510" y="55">Bird cone responses</text>
    <rect x="510" y="90" width="65" height="170" rx="10" fill="#d94141"/>
    <rect x="595" y="120" width="65" height="140" rx="10" fill="#39a852"/>
    <rect x="680" y="150" width="65" height="110" rx="10" fill="#3f68d7"/>
    <rect x="765" y="105" width="45" height="155" rx="10" fill="#7e3fbf"/>
   </g>
   <text id="sceneLabel" class="cv-text" x="28" y="305"></text>
  </svg>
 </div>
</section>
<section class="rph-card" aria-live="polite">
 <p class="rph-setup" id="setup"></p><p class="rph-prompt" id="prompt"></p>
 <div class="rph-choices" id="choices"></div><p class="rph-feedback" id="feedback"></p>
 <div class="rph-controls"><button id="mainBtn" type="button">Start</button><button id="replayBtn" class="rph-hidden" type="button">Replay reveal</button></div>
</section>
<p class="rph-status" id="status" role="status" aria-live="polite"></p>

<script>

(() => {
 const scenarios=[
  {mode:'mix',setup:'Red, green, and blue light overlap.',q:'What color appears at the center?',c:['White','Black','Brown'],a:0,f:'The center appears white. Additive mixing combines red, green, and blue light.',label:'RGB additive mixing'},
  {mode:'object',setup:'Green light shines on a magenta object.',q:'How will the object appear?',c:['Bright magenta','Mostly dark','Bright green'],a:1,f:'The object appears mostly dark. Magenta pigment reflects red and blue but absorbs much of the green light.',label:'Colored-object lighting',beam:'#34a853',obj:'#d43c9f',reveal:'#2a2a2a'},
  {mode:'object',setup:'Blue light shines on a blue object.',q:'How will the object appear?',c:['Blue','Red','White'],a:0,f:'The object appears blue. It can reflect the blue wavelengths that are present in the illumination.',label:'Reflected wavelengths',beam:'#2b66ff',obj:'#2b66ff',reveal:'#2b66ff'},
  {mode:'cones',setup:'A bird has an additional ultraviolet-sensitive cone type.',q:'What can the bird potentially distinguish?',c:['Fewer colors','The same range','Additional UV patterns'],a:2,f:'The bird can potentially distinguish additional ultraviolet patterns. A fourth cone adds another channel of wavelength information.',label:'Human versus bird vision'}
 ];
 let i=0,state='setup',completionSent=false;
 const $=s=>document.querySelector(s),mix=$('#mixScene'),objectScene=$('#objectScene'),cone=$('#coneScene'),beam=$('#beamPoly'),obj=$('#object'),
 choices=$('#choices'),feedback=$('#feedback'),setup=$('#setup'),prompt=$('#prompt'),main=$('#mainBtn'),replay=$('#replayBtn'),progress=$('#progress'),label=$('#sceneLabel'),status=$('#status');
 function shuffle(a){return a.map((v,idx)=>({v,idx,r:Math.random()})).sort((x,y)=>x.r-y.r)}
 function prep(){
  const s=scenarios[i];mix.classList.toggle('rph-hidden',s.mode!=='mix');objectScene.classList.toggle('rph-hidden',s.mode!=='object');cone.classList.toggle('rph-hidden',s.mode!=='cones');label.textContent=s.label;
  if(s.mode==='object'){beam.setAttribute('fill',s.beam);obj.setAttribute('fill',s.obj)}
  if(s.mode==='mix'){mix.style.opacity=state==='reveal'||state==='explain'?1:.72}
 }
 function render(){
  const s=scenarios[i];progress.textContent=`Scenario ${i+1} of ${scenarios.length}`;prep();setup.textContent=s.setup;prompt.textContent=state==='predict'?s.q:'';feedback.textContent=state==='explain'?s.f:'';
  choices.innerHTML='';if(state==='predict')shuffle(s.c).forEach(o=>{let b=document.createElement('button');b.type='button';b.textContent=o.v;b.onclick=()=>choose(o.idx);choices.appendChild(b)});
  main.textContent=state==='setup'?'Start':state==='explain'?(i===scenarios.length-1?'Finish':'Next scenario'):state==='complete'?'Completed':'Revealing…';
  main.disabled=['predict','reveal','complete'].includes(state);replay.classList.toggle('rph-hidden',state!=='explain');
  if(state==='complete'){setup.textContent='Walkthrough complete.';prompt.textContent='';feedback.textContent='Perceived color depends on the available light, reflected wavelengths, and the observer’s cone responses.'}
 }
 function choose(){if(state!=='predict')return;state='reveal';render();setTimeout(()=>{const s=scenarios[i];if(s.mode==='object')obj.setAttribute('fill',s.reveal);state='explain';status.textContent=s.f;render()},matchMedia('(prefers-reduced-motion: reduce)').matches?0:700)}
 main.onclick=()=>{if(state==='setup'){state='predict';render()}else if(state==='explain'){if(i<scenarios.length-1){i++;state='setup';render()}else{state='complete';render();completeOnce()}}};
 replay.onclick=()=>{state='predict';render()};
 $('#resetBtn').onclick=()=>{i=0;state='setup';render()};
 function completeOnce(){if(completionSent)return;completionSent=true;window.parent.postMessage({type:'complete'},'*')}
 render();
})();

</script>
</main>
</body>
</html>
