<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Relative Motion: Canvas Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #020617; /* slate-950 */
            color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Input state
        const input = { x: 0, y: 0, isDown: false, justPressed: false, justReleased: false, wasDown: false };

        // Layout bounds
        const bounds = { sidebar: { x: 0, y: 0, w: 0, h: 0 }, sim: { x: 0, y: 0, w: 0, h: 0 }, isMobile: false };

        // Game State
        let uiElements = [];
        let isPlaying = false;
        let lastTime = 0;
        let showTelemetry = false;
        let vectorMode = 0;
        const vectorModeNames = ['No Hint', 'Full Vector Addition', 'Resultant Components', 'Drift Decomposition'];
        
        let scale = 10, originX = 0, originY = 0, waterParticles = [];

        const params = {
            vBoat: 5, angleDeg: 0, vRiver: 3, width: 50,
            vResultantX: 0, vResultantY: 0, vResultantMag: 0, effectiveBoatSpeed: 5, angleRad: 0
        };

        const physics = { time: 0, x: 0, y: 0, trail: [] };

        const mission = {
            level: 1, phase: 'setup', message: '', hits: 0, stars: 0,
            staminaMax: 0, staminaLeft: 0,
            startZone: { x: 0, y: 0, radius: 5.5 },
            baby: { x: 0, y: 0, radius: 4.5, rescued: false },
            obstacles: []
        };

        class Button {
            constructor(id, text, onClick) {
                this.id = id; this.text = text; this.onClick = onClick;
                this.x = 0; this.y = 0; this.w = 0; this.h = 0;
                this.isHovered = false; this.isActive = false; this.disabled = false;
                this.bgColor = '#1e293b'; this.hoverColor = '#334155'; this.textColor = '#f8fafc';
                this.activeBgColor = '#0ea5e9'; this.activeTextColor = '#ffffff';
                this.fontSize = 14;
            }
            setBounds(x, y, w, h) { this.x = x; this.y = y; this.w = w; this.h = h; }
            update() {
                if (this.disabled) { this.isHovered = false; return; }
                this.isHovered = input.x >= this.x && input.x <= this.x + this.w && input.y >= this.y && input.y <= this.y + this.h;
                if (this.isHovered && input.justReleased) this.onClick();
            }
            draw(ctx) {
                ctx.fillStyle = this.disabled ? '#334155' : this.isActive ? this.activeBgColor : this.isHovered ? this.hoverColor : this.bgColor;
                if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(this.x, this.y, this.w, this.h, 6); ctx.fill(); } 
                else { ctx.fillRect(this.x, this.y, this.w, this.h); }
                ctx.fillStyle = this.disabled ? '#64748b' : this.isActive ? this.activeTextColor : this.textColor;
                ctx.font = `600 ${this.fontSize}px Inter`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(this.text, this.x + this.w / 2, this.y + this.h / 2);
            }
        }

        class Slider {
            constructor(id, label, min, max, step, paramKey, unit) {
                this.id = id; this.label = label; this.min = min; this.max = max; this.step = step; this.paramKey = paramKey; this.unit = unit;
                this.x = 0; this.y = 0; this.w = 0; this.isDragging = false; this.disabled = false;
            }
            setBounds(x, y, w) { this.x = x; this.y = y; this.w = w; }
            update() {
                if (this.disabled) { this.isDragging = false; return; }
                const trackY = this.y + 25;
                if (input.justPressed && input.x >= this.x && input.x <= this.x + this.w && Math.abs(input.y - trackY) < 20) {
                    this.isDragging = true;
                }
                if (!input.isDown) this.isDragging = false;
                if (this.isDragging) {
                    let pct = Math.max(0, Math.min(1, (input.x - this.x) / this.w));
                    params[this.paramKey] = Math.round((this.min + pct * (this.max - this.min)) / this.step) * this.step;
                    recalculatePhysics();
                }
            }
            draw(ctx) {
                const val = params[this.paramKey];
                ctx.fillStyle = '#cbd5e1'; ctx.font = '500 12px Inter'; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.fillText(this.label, this.x, this.y + 12);
                ctx.fillStyle = '#7dd3fc'; ctx.font = '600 12px monospace'; ctx.textAlign = 'right'; ctx.fillText(val.toFixed(this.step % 1 === 0 ? 0 : 1) + this.unit, this.x + this.w, this.y + 12);
                const trackY = this.y + 25;
                ctx.fillStyle = '#334155'; ctx.fillRect(this.x, trackY - 2, this.w, 4);
                const fillW = ((val - this.min) / (this.max - this.min)) * this.w;
                ctx.fillStyle = this.disabled ? '#475569' : '#0284c7'; ctx.fillRect(this.x, trackY - 2, fillW, 4);
                ctx.beginPath(); ctx.arc(this.x + fillW, trackY, 8, 0, Math.PI * 2);
                ctx.fillStyle = this.disabled ? '#64748b' : '#ffffff'; ctx.fill();
                ctx.lineWidth = 2; ctx.strokeStyle = this.disabled ? '#334155' : '#0284c7'; ctx.stroke();
            }
        }

        class SpeedReadout {
            constructor(id) {
                this.id = id; this.x = 0; this.y = 0; this.w = 0; this.h = 0;
            }
            setBounds(x, y, w, h = 48) { this.x = x; this.y = y; this.w = w; this.h = h; }
            update() {}
            draw(ctx) {
                ctx.fillStyle = '#cbd5e1'; ctx.font = '500 12px Inter'; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
                ctx.fillText('Fixed Speeds', this.x, this.y + 12);

                const rowY = this.y + 32;
                ctx.fillStyle = '#94a3b8'; ctx.font = '500 12px Inter'; ctx.textBaseline = 'middle';
                ctx.fillText('Swimmer', this.x, rowY);
                ctx.fillText('Current', this.x + this.w * 0.5, rowY);

                ctx.fillStyle = '#7dd3fc'; ctx.font = '600 13px monospace'; ctx.textAlign = 'right';
                ctx.fillText(params.vBoat.toFixed(1) + ' m/s', this.x + this.w * 0.42, rowY);
                ctx.fillText(params.vRiver.toFixed(1) + ' m/s', this.x + this.w, rowY);

                ctx.strokeStyle = '#334155'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(this.x, this.y + this.h - 6); ctx.lineTo(this.x + this.w, this.y + this.h - 6); ctx.stroke();
            }
        }

        const genRockShape = (baseRadius) => {
            const pts = []; const sides = 6 + Math.floor(Math.random() * 4);
            for (let i = 0; i < sides; i++) pts.push({ a: (i / sides) * Math.PI * 2, r: baseRadius * (0.6 + Math.random() * 0.5) });
            return pts;
        };

        const makeRapid = (x, y, radius, rotation, rockDist = 5.0) => ({
            type: 'rapid', x, y, radius, rotation, hit: false, isMoving: false, rockDist,
            rock1Shape: genRockShape(4.0), rock2Shape: genRockShape(4.0)
        });

        const lowerLaneY = p => p.width * 0.55;

        function drawVectorArrow(fx, fy, tx, ty, color, width = 3, headLen = 10) {
            const dx = tx - fx, dy = ty - fy;
            if (Math.abs(dx) < 0.1 && Math.abs(dy) < 0.1) return;
            const angle = Math.atan2(dy, dx);
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(fx, fy);
            ctx.lineTo(tx, ty);
            ctx.lineTo(tx - headLen * Math.cos(angle - Math.PI/6), ty - headLen * Math.sin(angle - Math.PI/6));
            ctx.moveTo(tx, ty);
            ctx.lineTo(tx - headLen * Math.cos(angle + Math.PI/6), ty - headLen * Math.sin(angle + Math.PI/6));
            ctx.stroke();
            ctx.restore();
        }

        function drawVectorLabel(text, x, y, color, align = 'left') {
            ctx.save();
            ctx.font = '700 13px Inter';
            ctx.textAlign = align;
            ctx.textBaseline = 'middle';
            ctx.lineWidth = 4;
            ctx.strokeStyle = 'rgba(2, 6, 23, 0.85)';
            ctx.strokeText(text, x, y);
            ctx.fillStyle = color;
            ctx.fillText(text, x, y);
            ctx.restore();
        }

        const LEVEL_CONFIGS = {
            1: {
                title: 'Level 1: Dangerous Rapids',
                swimSpeed: 5,
                currentSpeed: 3,
                start: p => ({ x: 0, y: lowerLaneY(p), radius: 5.5 }),
                target: p => ({ x: p.width, y: lowerLaneY(p), radius: 5.5 }),
                startMsg: 'Reach the finish ring. Aim upstream to offset the current and avoid the rapids around the finish.',
                successMsg: s => `Level 1 clear. Rapids avoided with ${s.toFixed(0)}m stamina left.`,
                obstacles: p => {
                    const finishY = lowerLaneY(p);
                    return [
                        makeRapid(p.width * 0.74, finishY - 12, 7.0, -0.35),
                        makeRapid(p.width * 0.91, finishY - 21, 7.0, 0.25),
                        makeRapid(p.width * 0.74, finishY + 12, 7.0, 0.35),
                        makeRapid(p.width * 0.91, finishY + 21, 7.0, -0.25)
                    ];
                }
            },
            2: {
                title: 'Level 2: Floating Logs',
                swimSpeed: 5,
                currentSpeed: 3,
                start: p => ({ x: 0, y: lowerLaneY(p), radius: 5.5 }),
                target: p => ({ x: p.width, y: lowerLaneY(p), radius: 5.5 }),
                startMsg: 'Get across the river to the finish ring without hitting the floating logs.',
                successMsg: s => `Level 2 clear. Crossed without hitting the logs. ${s.toFixed(0)}m stamina left.`,
                obstacles: p => [
                    { type: 'log', x: p.width * 0.42, y: lowerLaneY(p) - 15.5, radius: 7.4, rotation: 0.45, hit: false, isMoving: true },
                    { type: 'log', x: p.width * 0.72, y: lowerLaneY(p) - 26.5, radius: 7.0, rotation: -0.25, hit: false, isMoving: true }
                ]
            },
            3: {
                title: 'Level 3: Catch the Baby',
                swimSpeed: 5,
                currentSpeed: 3,
                start: p => ({ x: 0, y: lowerLaneY(p), radius: 5.5 }),
                target: p => ({ x: p.width * 0.65, y: lowerLaneY(p) - 28, radius: 4.5 }),
                startMsg: 'The baby is floating down the river! Intercept the baby before they wash away.',
                successMsg: s => `Amazing intercept! Baby caught with ${s.toFixed(0)}m stamina left.`,
                obstacles: p => [
                    { type: 'log', x: p.width * 0.5, y: lowerLaneY(p) - 52, radius: 5.5, rotation: 1.2, hit: false, isMoving: true }
                ]
            }
        };

        let btnL1, btnL2, btnL3, btnPlay, btnReset, btnVector, btnData, speedReadout, sldAngle;

        function buildUI() {
            uiElements = [
                btnL1 = new Button('l1', 'L1', () => setLevel(1)),
                btnL2 = new Button('l2', 'L2', () => setLevel(2)),
                btnL3 = new Button('l3', 'L3', () => setLevel(3)),
                speedReadout = new SpeedReadout('fixed_speed'),
                sldAngle = new Slider('s_angle', 'Heading (theta)', -85, 85, 1, 'angleDeg', ' deg'),
                btnVector = new Button('vector', 'Hint: ' + vectorModeNames[vectorMode], () => {
                    vectorMode = (vectorMode + 1) % 4; btnVector.text = 'Hint: ' + vectorModeNames[vectorMode];
                }),
                btnData = new Button('data', 'Data', () => { showTelemetry = !showTelemetry; btnData.isActive = showTelemetry; }),
                btnPlay = new Button('play', 'START MISSION', togglePlayPause),
                btnReset = new Button('reset', 'RESET', resetSimulation)
            ];
            btnL1.fontSize = btnL2.fontSize = btnL3.fontSize = 12;
            btnVector.bgColor = btnData.bgColor = '#0f172a';
            btnPlay.bgColor = '#0284c7'; btnPlay.hoverColor = '#0369a1';
            btnReset.bgColor = '#334155'; btnReset.hoverColor = '#475569';
        }

        function layout() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
            const w = window.innerWidth;
            const h = window.innerHeight;

            bounds.isMobile = w < 768;
            if (bounds.isMobile) {
                bounds.sidebar = { x: 0, y: h - 380, w: w, h: 380 };
                bounds.sim = { x: 0, y: 0, w: w, h: h - 380 };
            } else {
                bounds.sidebar = { x: 0, y: 0, w: 340, h: h };
                bounds.sim = { x: 340, y: 0, w: w - 340, h: h };
            }

            const padX = bounds.sidebar.x + 20;
            const innerW = bounds.sidebar.w - 40;
            let currentY = bounds.sidebar.y + 60; // Skip Title

            const btnW = (innerW - 20) / 3;
            btnL1.setBounds(padX, currentY, btnW, 32);
            btnL2.setBounds(padX + btnW + 10, currentY, btnW, 32);
            btnL3.setBounds(padX + btnW*2 + 20, currentY, btnW, 32);
            currentY += 45 + 95; // Skip Status Box

            speedReadout.setBounds(padX, currentY, innerW); currentY += 50;
            sldAngle.setBounds(padX, currentY, innerW); currentY += 50;

            const halfW = (innerW - 10) / 2;
            btnVector.setBounds(padX, currentY, halfW, 36);
            btnData.setBounds(padX + halfW + 10, currentY, halfW, 36);
            currentY += 45;

            btnPlay.setBounds(padX, currentY, halfW, 44);
            btnReset.setBounds(padX + halfW + 10, currentY, halfW, 44);

            scale = (bounds.sim.w * 0.5) / params.width;
            originX = bounds.sim.x + bounds.sim.w * 0.15;
            originY = bounds.sim.y + bounds.sim.h * 0.2;

            waterParticles = [];
            for (let i = 0; i < 100; i++) {
                waterParticles.push({ x: Math.random(), y: bounds.sim.y - 100 + Math.random() * (bounds.sim.h + 200), length: 5 + Math.random() * 20, speed: 0.7 + Math.random() * 0.6 });
            }
        }

        function setLevel(lvl) {
            if (!LEVEL_CONFIGS[lvl]) return;
            mission.level = lvl; resetSimulation();
        }
        
        function recalculatePhysics() {
            params.angleRad = params.angleDeg * (Math.PI / 180);
            params.effectiveBoatSpeed = params.vBoat;
            params.vResultantX = params.effectiveBoatSpeed * Math.cos(params.angleRad);
            params.vResultantY = params.effectiveBoatSpeed * Math.sin(params.angleRad) + params.vRiver;
            params.vResultantMag = Math.hypot(params.vResultantX, params.vResultantY);
        }

        function resetSimulation() {
            const config = LEVEL_CONFIGS[mission.level];
            params.vBoat = config.swimSpeed;
            params.vRiver = config.currentSpeed;
            const start = config.start ? config.start(params) : { x: 0, y: 0, radius: 5.5 };

            isPlaying = false;
            physics.time = 0; physics.x = start.x; physics.y = start.y; physics.trail = [];
            mission.phase = 'setup'; mission.message = config.startMsg; mission.hits = 0; mission.stars = 0;
            mission.startZone = { x: start.x, y: start.y, radius: start.radius || 5.5 };

            const target = config.target ? config.target(params) : { x: params.width, y: lowerLaneY(params), radius: 5.5 };
            let tX = target.x, tY = target.y, tR = target.radius;
            
            mission.baby = { x: tX, y: tY, radius: tR, rescued: false };
            mission.obstacles = config.obstacles(params);
            mission.staminaMax = Math.round(params.width * (mission.level === 3 ? 3.0 : 2.5) + 40);
            mission.staminaLeft = mission.staminaMax;

            recalculatePhysics(); updateUIState();
        }

        function togglePlayPause() {
            if (mission.phase === 'success' || mission.phase === 'fail') { resetSimulation(); return; }
            if (mission.phase === 'setup') {
                mission.phase = 'outbound'; isPlaying = true;
            } else { isPlaying = !isPlaying; }
            if (isPlaying) lastTime = performance.now();
            updateUIState();
        }

        function updateUIState() {
            btnL1.isActive = mission.level === 1; btnL2.isActive = mission.level === 2;
            btnL3.isActive = mission.level === 3;
            const activeSwim = isPlaying || mission.phase === 'success' || mission.phase === 'fail';
            sldAngle.disabled = activeSwim;

            if (mission.phase === 'success' || mission.phase === 'fail') {
                btnPlay.text = 'PLAY AGAIN'; btnPlay.bgColor = mission.phase === 'success' ? '#059669' : '#b91c1c';
            } else if (isPlaying) { btnPlay.text = 'PAUSE'; btnPlay.bgColor = '#d97706'; } 
            else if (physics.time > 0) { btnPlay.text = 'RESUME'; btnPlay.bgColor = '#0284c7'; } 
            else { btnPlay.text = 'START MISSION'; btnPlay.bgColor = '#0284c7'; }
        }

        function checkCollisions() {
            for (let obs of mission.obstacles) {
                if (!obs.hit && Math.hypot(physics.x - obs.x, physics.y - obs.y) <= obs.radius + 1.5) {
                    obs.hit = true; mission.hits++;
                    return failMission(obs.type === 'log' ? 'Hit a floating log! Try a safer heading.' : 'Hit the rapids! Try a safer heading.');
                }
            }
            return false;
        }

        function failMission(msg) { isPlaying = false; mission.phase = 'fail'; mission.message = msg; updateUIState(); return true; }
        function succeedMission(msg) { isPlaying = false; mission.phase = 'success'; mission.message = msg; mission.stars = 1 + (mission.hits===0?1:0) + (mission.staminaLeft>mission.staminaMax*0.3?1:0); updateUIState(); }

        function updatePhysics(dt) {
            if (!isPlaying) return;
            physics.time += dt;
            const dx = params.vResultantX * dt; const dy = params.vResultantY * dt;
            physics.x += dx; physics.y += dy;
            mission.staminaLeft -= Math.hypot(dx, dy);

            if (mission.staminaLeft <= 0) return failMission('Out of stamina! You drifted away.');
            if (physics.trail.length === 0 || Math.hypot(physics.x - physics.trail[physics.trail.length-1].x, physics.y - physics.trail[physics.trail.length-1].y) > 1) {
                physics.trail.push({x: physics.x, y: physics.y});
            }

            mission.obstacles.forEach(obs => {
                if (obs.isMoving) {
                    obs.y += params.vRiver * dt; obs.rotation += 0.8 * dt;
                    if (obs.y > (bounds.sim.h - originY) / scale + 15) { obs.y = (0 - originY) / scale - 15; obs.hit = false; }
                }
            });

            if (mission.level === 3 && !mission.baby.rescued) {
                mission.baby.y += params.vRiver * dt;
                if (mission.baby.y > (bounds.sim.h - originY) / scale + 5) return failMission('The baby drifted too far downstream!');
            }

            if (checkCollisions()) return;

            if (!mission.baby.rescued) {
                if (Math.hypot(physics.x - mission.baby.x, physics.y - mission.baby.y) <= mission.baby.radius) {
                    mission.baby.rescued = true;
                    succeedMission(LEVEL_CONFIGS[mission.level].successMsg(mission.staminaLeft));
                } else if (physics.x > params.width + 10) {
                    failMission(mission.level === 3 ? 'Missed the baby! Swam past the intercept point.' : 'Missed the target! Swam past the far bank.');
                }
            }
        }

        function drawSidebar() {
            ctx.fillStyle = '#0f172a'; ctx.fillRect(bounds.sidebar.x, bounds.sidebar.y, bounds.sidebar.w, bounds.sidebar.h);
            ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1;
            ctx.beginPath();
            if (bounds.isMobile) { ctx.moveTo(bounds.sidebar.x, bounds.sidebar.y); ctx.lineTo(bounds.sidebar.x + bounds.sidebar.w, bounds.sidebar.y); } 
            else { ctx.moveTo(bounds.sidebar.x + bounds.sidebar.w, bounds.sidebar.y); ctx.lineTo(bounds.sidebar.x + bounds.sidebar.w, bounds.sidebar.y + bounds.sidebar.h); }
            ctx.stroke();

            const padX = bounds.sidebar.x + 20; let cy = bounds.sidebar.y + 35;
            ctx.fillStyle = '#67e8f9'; ctx.font = '700 22px Inter'; ctx.textAlign = 'left'; ctx.fillText('River Rescue', padX, cy);
            
            cy += 65;
            ctx.fillStyle = '#020617'; ctx.strokeStyle = 'rgba(6, 182, 212, 0.3)';
            if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(padX, cy, bounds.sidebar.w - 40, 80, 8); ctx.fill(); ctx.stroke(); }
            
            ctx.fillStyle = '#c0caf5'; ctx.font = '600 10px Inter'; ctx.fillText('MISSION STATUS', padX + 12, cy + 20);
            ctx.fillStyle = '#ffffff'; ctx.font = '600 15px Inter'; ctx.fillText(LEVEL_CONFIGS[mission.level].title, padX + 12, cy + 40);
            ctx.fillStyle = '#94a3b8'; ctx.font = '400 12px Inter';
            
            const words = mission.message.split(' '); let line = ''; let lineY = cy + 60;
            for(let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                if (ctx.measureText(testLine).width > bounds.sidebar.w - 60 && n > 0) { ctx.fillText(line, padX + 12, lineY); line = words[n] + ' '; lineY += 15; } 
                else { line = testLine; }
            }
            ctx.fillText(line, padX + 12, lineY);

            uiElements.forEach(el => el.draw(ctx));
        }

        function drawRiverEnv() {
            ctx.fillStyle = '#1e3a8a'; ctx.fillRect(bounds.sim.x, bounds.sim.y, bounds.sim.w, bounds.sim.h);
            const rLeft = originX, rRight = originX + params.width * scale;

            ctx.strokeStyle = 'rgba(96, 165, 250, 0.25)'; ctx.lineWidth = 2; ctx.beginPath();
            const visSpeed = isPlaying ? params.vRiver * 3 : 0;
            waterParticles.forEach(p => {
                if (isPlaying) { p.y += visSpeed * p.speed; if (p.y > bounds.sim.y + bounds.sim.h + 50) { p.y = bounds.sim.y - 50; p.x = Math.random(); } }
                const px = rLeft + p.x * (params.width * scale);
                if (px >= rLeft && px <= rRight) { ctx.moveTo(px, p.y); ctx.lineTo(px, p.y + p.length); }
            });
            ctx.stroke();

            ctx.fillStyle = '#166534';
            ctx.fillRect(bounds.sim.x, bounds.sim.y, rLeft - bounds.sim.x, bounds.sim.h);
            ctx.fillRect(rRight, bounds.sim.y, (bounds.sim.x + bounds.sim.w) - rRight, bounds.sim.h);
            ctx.strokeStyle = '#fcd34d'; ctx.lineWidth = 4; ctx.beginPath();
            ctx.moveTo(rLeft, bounds.sim.y); ctx.lineTo(rLeft, bounds.sim.y + bounds.sim.h);
            ctx.moveTo(rRight, bounds.sim.y); ctx.lineTo(rRight, bounds.sim.y + bounds.sim.h);
            ctx.stroke();

            ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '10px monospace'; ctx.textAlign = 'right';
            for (let i = 0; i <= 300; i += 20) {
                let y = originY + i * scale; if (y > bounds.sim.y + bounds.sim.h) break;
                ctx.fillText(i + 'm', rLeft - 8, y + 3); ctx.fillRect(rLeft - 5, y, 5, 1);
            }

            const riverW = params.width * scale;
            const arrowX = rRight - Math.max(56, riverW * 0.13);
            const arrowTop = bounds.sim.y + Math.max(36, bounds.sim.h * 0.08);
            const arrowLen = Math.max(54, Math.min(bounds.sim.h * 0.24, params.vRiver * 34));
            drawVectorArrow(arrowX, arrowTop, arrowX, arrowTop + arrowLen, '#38bdf8', 6, 16);
            drawVectorLabel('Water velocity = ' + params.vRiver.toFixed(1) + ' m/s', arrowX + 18, arrowTop + arrowLen * 0.5, '#bae6fd');
        }

        function drawBabyGraphic(ctx, r) {
            // Arms and Legs
            ctx.strokeStyle = '#fca5a5'; // Skin tone
            ctx.lineWidth = r * 0.3;
            ctx.lineCap = 'round';
            ctx.beginPath();
            // Arms flailing up
            ctx.moveTo(-r * 0.35, -r * 0.1); ctx.lineTo(-r * 0.8, -r * 0.5);
            ctx.moveTo(r * 0.35, -r * 0.1); ctx.lineTo(r * 0.8, -r * 0.5);
            // Legs kicking down
            ctx.moveTo(-r * 0.2, r * 0.3); ctx.lineTo(-r * 0.6, r * 0.8);
            ctx.moveTo(r * 0.2, r * 0.3); ctx.lineTo(r * 0.6, r * 0.8);
            ctx.stroke();

            // Head
            ctx.fillStyle = '#fca5a5';
            ctx.beginPath(); ctx.arc(0, -r * 0.5, r * 0.45, 0, Math.PI * 2); ctx.fill();

            // Face (Detailed Eyes)
            // Sclera (whites of the eyes)
            ctx.fillStyle = '#ffffff'; 
            ctx.beginPath(); ctx.arc(-r * 0.16, -r * 0.58, r * 0.12, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(r * 0.16, -r * 0.58, r * 0.12, 0, Math.PI * 2); ctx.fill();
            
            // Pupils
            ctx.fillStyle = '#1e293b'; // dark slate
            ctx.beginPath(); ctx.arc(-r * 0.16, -r * 0.58, r * 0.07, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(r * 0.16, -r * 0.58, r * 0.07, 0, Math.PI * 2); ctx.fill();
            
            // Catchlights (eye sparkles)
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(-r * 0.18, -r * 0.60, r * 0.025, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(r * 0.14, -r * 0.60, r * 0.025, 0, Math.PI * 2); ctx.fill();

            // Rosy cheeks
            ctx.fillStyle = 'rgba(239, 68, 68, 0.25)'; // soft transparent red
            ctx.beginPath(); ctx.arc(-r * 0.26, -r * 0.45, r * 0.08, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(r * 0.26, -r * 0.45, r * 0.08, 0, Math.PI * 2); ctx.fill();

            // Smile (Lowered)
            ctx.strokeStyle = '#7f1d1d'; // Dark red/brown
            ctx.lineWidth = r * 0.06;
            ctx.lineCap = 'round';
            ctx.beginPath(); ctx.arc(0, -r * 0.46, r * 0.18, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();

            // Diaper
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = r * 0.1;
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(-r * 0.5, 0);       // Top left
            ctx.lineTo(r * 0.5, 0);        // Top right
            ctx.lineTo(r * 0.25, r * 0.5); // Bottom right
            ctx.lineTo(-r * 0.25, r * 0.5);// Bottom left
            ctx.closePath();
            ctx.fill(); ctx.stroke();
            
            // Diaper tape details
            ctx.fillStyle = '#93c5fd'; // blue tape
            ctx.fillRect(-r * 0.4, 0, r * 0.15, r * 0.15);
            ctx.fillRect(r * 0.25, 0, r * 0.15, r * 0.15);
        }

        function drawEntities() {
            if (physics.trail.length > 0) {
                ctx.beginPath(); ctx.moveTo(originX + physics.trail[0].x * scale, originY + physics.trail[0].y * scale);
                for (let i = 1; i < physics.trail.length; i++) ctx.lineTo(originX + physics.trail[i].x * scale, originY + physics.trail[i].y * scale);
                ctx.lineTo(originX + physics.x * scale, originY + physics.y * scale);
                ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
            }

            const sx = originX + mission.startZone.x * scale, sy = originY + mission.startZone.y * scale, sr = mission.startZone.radius * scale;
            ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI*2); ctx.fillStyle = 'rgba(34, 197, 94, 0.15)'; ctx.fill();
            ctx.strokeStyle = '#86efac'; ctx.lineWidth = 2; ctx.setLineDash([4,4]); ctx.stroke(); ctx.setLineDash([]);
            ctx.fillStyle = '#bbf7d0'; ctx.font='11px Inter'; ctx.textAlign='left'; ctx.fillText('Start', sx + sr + 5, sy);

            if (!mission.baby.rescued) {
                const tx = originX + mission.baby.x * scale, ty = originY + mission.baby.y * scale, tr = mission.baby.radius * scale;
                if (mission.level === 3) {
                    ctx.save();
                    ctx.translate(tx, ty);
                    ctx.rotate(Math.sin(physics.time * 2) * 0.3); 
                    
                    drawBabyGraphic(ctx, tr);
                    
                    ctx.restore();
                    ctx.fillStyle = '#fff1f2'; ctx.textAlign='center'; ctx.fillText('Baby', tx, ty - tr - 12);
                } else {
                    ctx.beginPath(); ctx.arc(tx, ty, tr, 0, Math.PI*2); ctx.fillStyle = 'rgba(34, 197, 94, 0.2)'; ctx.fill();
                    ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 2; ctx.setLineDash([4,4]); ctx.stroke(); ctx.setLineDash([]);
                    ctx.fillStyle = '#86efac'; ctx.textAlign='center'; ctx.fillText('Finish', tx, ty - tr - 8);
                }
            }

            mission.obstacles.forEach(obs => {
                const ox = originX + obs.x * scale, oy = originY + obs.y * scale;
                ctx.save(); ctx.translate(ox, oy); ctx.rotate(obs.rotation);
                if (obs.type === 'rapid') {
                    // Whitewater base foam
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)'; ctx.beginPath(); 
                    ctx.ellipse(0, 0, obs.rockDist * scale * 1.3, obs.radius * scale * 0.7, 0, 0, Math.PI*2); ctx.fill();
                    
                    // Large rushing water flow lines in between the rocks
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
                    ctx.lineWidth = scale * 0.3; // thick water lines
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    
                    // Left channel flow
                    ctx.moveTo(-obs.rockDist * scale * 0.45, -obs.radius * scale * 0.5);
                    ctx.quadraticCurveTo(-obs.rockDist * scale * 0.1, 0, -obs.rockDist * scale * 0.45, obs.radius * scale * 0.5);
                    
                    // Center channel flow (animated surging)
                    const surge = Math.sin(physics.time * 4) * scale * 0.25;
                    ctx.moveTo(0, -obs.radius * scale * 0.7);
                    ctx.quadraticCurveTo(surge, 0, 0, obs.radius * scale * 0.7);
                    
                    // Right channel flow
                    ctx.moveTo(obs.rockDist * scale * 0.45, -obs.radius * scale * 0.5);
                    ctx.quadraticCurveTo(obs.rockDist * scale * 0.1, 0, obs.rockDist * scale * 0.45, obs.radius * scale * 0.5);
                    
                    ctx.stroke();

                    const drawRock = (shape, cx, cy) => {
                        ctx.beginPath(); shape.forEach((pt, idx) => { const px = cx + pt.r * scale * Math.cos(pt.a), py = cy + pt.r * scale * Math.sin(pt.a); if (idx === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); });
                        ctx.closePath(); ctx.fill(); ctx.stroke();
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)'; ctx.beginPath(); ctx.arc(cx - scale * 0.5, cy - scale * 0.5, scale * 1.5, Math.PI, 1.5 * Math.PI); ctx.stroke();
                    };
                    ctx.fillStyle = obs.hit ? '#7f1d1d' : '#475569'; ctx.strokeStyle = obs.hit ? '#fecaca' : '#1e293b'; ctx.lineWidth = 2;
                    drawRock(obs.rock1Shape, -obs.rockDist * scale, 0); drawRock(obs.rock2Shape, obs.rockDist * scale, 0);
                } else if (obs.type === 'rock') {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)'; ctx.beginPath(); ctx.ellipse(0, 0, obs.radius * scale * 1.5, obs.radius * scale * 1.2, 0, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = obs.hit ? '#7f1d1d' : '#475569'; ctx.strokeStyle = obs.hit ? '#fecaca' : '#1e293b'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.ellipse(0, 0, obs.radius * scale, obs.radius * scale * 0.8, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                } else {
                    ctx.fillStyle = obs.hit ? '#7f1d1d' : '#92400e'; ctx.strokeStyle = obs.hit ? '#fecaca' : '#451a03'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.ellipse(0, 0, obs.radius * scale, obs.radius * scale * 0.4, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                }
                ctx.restore();
            });

            const bx = originX + physics.x * scale, by = originY + physics.y * scale;
            ctx.save(); ctx.translate(bx, by); ctx.rotate(params.angleRad);
            ctx.fillStyle = '#22c55e'; ctx.strokeStyle = '#14532d'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-10, -8); ctx.lineTo(-8, 0); ctx.lineTo(-10, 8); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.restore();

            const vectorSetupVisible = !isPlaying && mission.phase !== 'success' && mission.phase !== 'fail';
            if (vectorSetupVisible) {
                const swimVs = 8;
                const swimX = params.effectiveBoatSpeed * Math.cos(params.angleRad) * swimVs;
                const swimY = params.effectiveBoatSpeed * Math.sin(params.angleRad) * swimVs;
                drawVectorArrow(bx, by, bx + swimX, by + swimY, '#f97316', 4, 12);
                drawVectorLabel('Swimmer velocity = ' + params.effectiveBoatSpeed.toFixed(1) + ' m/s', bx + swimX + 8, by + swimY - 10, '#fed7aa');
            }

            if (vectorMode > 0 && vectorSetupVisible) {
                const vs = 5, resX = params.vResultantX * vs, resY = params.vResultantY * vs;
                if (vectorMode === 1) {
                    const vbx = params.effectiveBoatSpeed * Math.cos(params.angleRad) * vs, vby = params.effectiveBoatSpeed * Math.sin(params.angleRad) * vs;
                    drawVectorArrow(bx + vbx, by + vby, bx + vbx, by + vby + params.vRiver * vs, '#38bdf8');
                    drawVectorArrow(bx, by, bx + resX, by + resY, '#22c55e');
                } else if (vectorMode === 2) {
                    drawVectorArrow(bx, by, bx + resX, by, '#f97316');
                    drawVectorArrow(bx + resX, by, bx + resX, by + resY, '#a855f7');
                    drawVectorArrow(bx, by, bx + resX, by + resY, '#22c55e');
                } else if (vectorMode === 3) {
                    const vby = params.effectiveBoatSpeed * Math.sin(params.angleRad) * vs, vry = params.vRiver * vs, off1 = 25, off2 = -25;
                    drawVectorArrow(bx + off1, by, bx + off1, by + vby, '#d946ef');
                    drawVectorArrow(bx + off1, by + vby, bx + off1, by + vby + vry, '#38bdf8');
                    drawVectorArrow(bx + off2, by, bx + off2, by + resY, '#a855f7');
                    ctx.beginPath(); ctx.moveTo(bx+off2, by); ctx.lineTo(bx+off1, by); ctx.moveTo(bx+off2, by+resY); ctx.lineTo(bx+off1, by+resY); ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);
                }
            }
        }

        function drawTelemetry() {
            if (!showTelemetry) return;
            const w = 220, h = 130;
            const x = bounds.sim.x + 20;
            const y = bounds.sim.y + bounds.sim.h - h - 20;

            ctx.fillStyle = 'rgba(15, 23, 42, 0.85)'; ctx.strokeStyle = '#334155'; ctx.lineWidth = 1;
            if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, 6); ctx.fill(); ctx.stroke(); } 
            else { ctx.fillRect(x, y, w, h); ctx.strokeRect(x, y, w, h); }

            ctx.fillStyle = '#64748b'; ctx.font = '600 11px Inter'; ctx.textAlign = 'left'; ctx.fillText('TELEMETRY', x + 15, y + 20);

            const stat = (label, val, yOff, color = '#f8fafc') => {
                ctx.fillStyle = '#94a3b8'; ctx.font = '400 12px Inter'; ctx.textAlign = 'left'; ctx.fillText(label, x + 15, y + yOff);
                ctx.fillStyle = color; ctx.font = '500 13px monospace'; ctx.textAlign = 'right'; ctx.fillText(val, x + w - 15, y + yOff);
            };

            const phaseL = {setup:'Setup', outbound:'Outbound', success:'Success', fail:'Failed'};
            stat('Phase', phaseL[mission.phase], 45);
            stat('Time', physics.time.toFixed(2) + ' s', 65);
            stat('Ground Speed', params.vResultantMag.toFixed(2) + ' m/s', 85, '#4ade80');
            stat('Stamina Left', mission.staminaLeft.toFixed(1) + ' m', 105, mission.staminaLeft < 30 ? '#ef4444' : '#facc15');
            stat('Drift Distance', physics.y.toFixed(1) + ' m', 125);
        }

        function engineLoop(timestamp) {
            const dt = lastTime ? (timestamp - lastTime) / 1000 : 0.016; lastTime = timestamp;
            input.justPressed = input.isDown && !input.wasDown; input.justReleased = !input.isDown && input.wasDown; input.wasDown = input.isDown;
            uiElements.forEach(el => el.update());
            if (dt < 0.1) updatePhysics(dt);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save(); ctx.beginPath(); ctx.rect(bounds.sim.x, bounds.sim.y, bounds.sim.w, bounds.sim.h); ctx.clip();
            drawRiverEnv(); drawEntities(); drawTelemetry(); ctx.restore();
            drawSidebar();
            
            requestAnimationFrame(engineLoop);
        }

        // --- EVENTS ---
        window.addEventListener('resize', layout);
        const handlePtr = e => { 
            const r = canvas.getBoundingClientRect(), d = window.devicePixelRatio || 1; 
            input.x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left; 
            input.y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top; 
        };
        canvas.addEventListener('mousedown', e => { input.isDown = true; handlePtr(e); });
        canvas.addEventListener('mousemove', handlePtr);
        window.addEventListener('mouseup', () => input.isDown = false);
        canvas.addEventListener('touchstart', e => { e.preventDefault(); input.isDown = true; handlePtr(e); }, {passive: false});
        canvas.addEventListener('touchmove', e => { e.preventDefault(); handlePtr(e); }, {passive: false});
        window.addEventListener('touchend', () => input.isDown = false);

        buildUI(); layout(); resetSimulation(); requestAnimationFrame((t) => { lastTime = t; engineLoop(t); });
    </script>
</body>
</html>
