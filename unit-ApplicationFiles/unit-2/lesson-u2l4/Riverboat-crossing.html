<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>River Rescue: Relative Velocity Lab</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #020617; /* slate-950 */
            color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #new-swimmer {
            position: absolute;
            left: -200px;
            top: -200px;
            width: 110px;
            height: 110px;
            z-index: 2;
            pointer-events: none;
            overflow: visible;
            transform-origin: 50% 50%;
            filter: drop-shadow(0 4px 5px rgba(2, 6, 23, 0.35));
        }
        #new-swimmer .ripple {
            transform-box: view-box;
            transform-origin: 50px 50px;
            animation: swimmer-wave 2.3s infinite ease-out;
        }
        #new-swimmer.swimming .ripple { animation-duration: 1.2s; }
        @keyframes swimmer-wave {
            0% { r: 15px; opacity: 0.75; stroke-width: 3px; }
            100% { r: 40px; opacity: 0; stroke-width: 1px; }
        }
        .heading-input {
            position: absolute;
            left: -9999px;
            top: -9999px;
            z-index: 3;
            width: 86px;
            height: 34px;
            padding: 0 10px;
            border: 1px solid #334155;
            border-radius: 6px;
            background: #020617;
            color: #7dd3fc;
            font: 600 14px monospace;
            text-align: right;
            outline: none;
            user-select: text;
            -webkit-user-select: text;
        }
        .heading-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }
        .heading-input:disabled {
            color: #64748b;
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" id="new-swimmer" aria-hidden="true">
        <circle cx="50" cy="50" class="ripple" fill="none" stroke="#e0f2fe" />

        <g transform="translate(50, 50)">
            <!-- Each leg is anchored at a fixed hip inside the torso. Only the inner rotor moves. -->
            <g transform="translate(-9 -5.5)">
                <g class="left-leg" id="left-leg-rotor">
                    <line x1="0" y1="0" x2="-23" y2="0" stroke="#fca5a5" stroke-width="4.5" stroke-linecap="round"/>
                    <circle cx="0" cy="0" r="2.2" fill="#fca5a5"/>
                    <path d="M-22 0 L-34 -6 L-39 -1 L-34 4 L-22 3 Z" fill="#facc15" stroke="#a16207" stroke-width="1.2"/>
                </g>
            </g>

            <g transform="translate(-9 5.5)">
                <g class="right-leg" id="right-leg-rotor">
                    <line x1="0" y1="0" x2="-23" y2="0" stroke="#fca5a5" stroke-width="4.5" stroke-linecap="round"/>
                    <circle cx="0" cy="0" r="2.2" fill="#fca5a5"/>
                    <path d="M-22 0 L-34 -4 L-39 1 L-34 6 L-22 3 Z" fill="#facc15" stroke="#a16207" stroke-width="1.2"/>
                </g>
            </g>

            <rect x="-15" y="-9" width="25" height="18" rx="6" fill="#0284c7" stroke="#075985" stroke-width="1.5"/>
            <path d="M-7 -8 V8" stroke="#67e8f9" stroke-width="3" stroke-linecap="round"/>

            <!-- Each arm uses a local shoulder origin at (0,0). JavaScript only rotates the inner group. -->
            <g transform="translate(8 -6)">
                <g class="left-arm" id="left-arm-rotor">
                    <line x1="0" y1="0" x2="23" y2="-7" stroke="#fca5a5" stroke-width="4.5" stroke-linecap="round"/>
                    <circle cx="0" cy="0" r="2.1" fill="#fca5a5"/>
                    <circle cx="23" cy="-7" r="2.8" fill="#fca5a5"/>
                </g>
            </g>

            <g transform="translate(8 6)">
                <g class="right-arm" id="right-arm-rotor">
                    <line x1="0" y1="0" x2="23" y2="7" stroke="#fca5a5" stroke-width="4.5" stroke-linecap="round"/>
                    <circle cx="0" cy="0" r="2.1" fill="#fca5a5"/>
                    <circle cx="23" cy="7" r="2.8" fill="#fca5a5"/>
                </g>
            </g>

            <circle cx="13" cy="0" r="8" fill="#fca5a5" stroke="#7f1d1d" stroke-width="1.2"/>
            <path d="M13 -8 A8 8 0 0 1 13 8 Z" fill="#fde047" stroke="#a16207" stroke-width="1"/>
            <rect x="16" y="-5" width="4" height="10" rx="2" fill="#38bdf8" stroke="#082f49" stroke-width="1"/>
            <path d="M18 -5 Q23 -9 25 -4" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round"/>
            <circle cx="25" cy="-4" r="1.6" fill="#ec4899"/>
            <path d="M19 2 Q22 4 24 1" fill="none" stroke="#7f1d1d" stroke-width="1" stroke-linecap="round"/>
        </g>
    </svg>
    <input id="headingInput" class="heading-input" type="number" min="-85" max="85" step="1" value="0" aria-label="Swim heading angle in degrees, negative aims upstream">

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const headingInput = document.getElementById('headingInput');
        const swimmerEl = document.getElementById('new-swimmer');
        const leftArmRotor = document.getElementById('left-arm-rotor');
        const rightArmRotor = document.getElementById('right-arm-rotor');
        const leftLegRotor = document.getElementById('left-leg-rotor');
        const rightLegRotor = document.getElementById('right-leg-rotor');

        // Input state
        const input = { x: 0, y: 0, isDown: false, justPressed: false, justReleased: false, wasDown: false };
        const headingArrow = { isDragging: false };

        // Layout bounds
        const bounds = {
            sim: { x: 0, y: 0, w: 0, h: 0 },
            header: { x: 0, y: 0, w: 0, h: 0 },
            controls: { x: 0, y: 0, w: 0, h: 0 },
            actions: { x: 0, y: 0, w: 0, h: 0 },
            hintRect: { x: 0, y: 0, w: 0, h: 0 },
            teleRect: { x: 0, y: 0, w: 0, h: 0 },
            isMobile: false
        };

        // Game state
        let uiElements = [];
        let isPlaying = false;
        let lastTime = 0;
        let ambientTime = 0;
        let showTelemetry = false;
        let hintMode = 0; // 0 = off, 1 = vectors, 2 = vectors + strategy
        let hasAimedOnce = false;
        const urlParams = new URLSearchParams(window.location.search);
        const requestedLevel = Number(urlParams.get('level'));
        const initialLevel = [1, 2, 3, 4].includes(requestedLevel) ? requestedLevel : 1;
        const lockedLevel = urlParams.get('lockLevel') === '1' ? initialLevel : 0;
        // Buzz assessment embeds carry the level title and directions in their own page header, so
        // the canvas drops its whole HUD panel (title, goal line, speed/time chips) and the control
        // hint line. The DATA panel and the labelled scene vectors still supply every reading.
        const showHud = urlParams.get('hideHud') !== '1';

        let scale = 10, originX = 0, originY = 0, waterParticles = [], bankDecor = null;
        let ripples = [], rippleTimer = 0, babyRippleTimer = 0;

        const params = {
            vBoat: 5, angleDeg: 0, vRiver: 3, width: 50,
            vResultantX: 0, vResultantY: 0, vResultantMag: 0, effectiveBoatSpeed: 5, angleRad: 0
        };

        const physics = { time: 0, x: 0, y: 0, trail: [] };

        const mission = {
            level: initialLevel, phase: 'setup', message: '', stars: 0,
            goalType: 'ring', timeLimit: 0,
            staminaMax: 0, staminaLeft: 0,
            startZone: { x: 0, y: 0, radius: 5.5 },
            baby: { x: 0, y: 0, radius: 4.5, rescued: false }
        };

        class Button {
            constructor(id, text, onClick) {
                this.id = id; this.text = text; this.onClick = onClick;
                this.x = 0; this.y = 0; this.w = 0; this.h = 0;
                this.isHovered = false; this.isActive = false; this.disabled = false;
                this.bgColor = '#1e293b'; this.hoverColor = '#334155'; this.textColor = '#f8fafc';
                this.activeBgColor = '#0ea5e9'; this.activeTextColor = '#ffffff';
                this.fontSize = 14;
            }
            setBounds(x, y, w, h) { this.x = x; this.y = y; this.w = w; this.h = h; }
            update() {
                if (this.disabled) { this.isHovered = false; return; }
                this.isHovered = input.x >= this.x && input.x <= this.x + this.w && input.y >= this.y && input.y <= this.y + this.h;
                if (this.isHovered && input.justReleased) this.onClick();
            }
            draw(ctx) {
                ctx.fillStyle = this.disabled ? '#334155' : this.isActive ? this.activeBgColor : this.isHovered ? this.hoverColor : this.bgColor;
                if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(this.x, this.y, this.w, this.h, 6); ctx.fill(); }
                else { ctx.fillRect(this.x, this.y, this.w, this.h); }
                ctx.fillStyle = this.disabled ? '#64748b' : this.isActive ? this.activeTextColor : this.textColor;
                ctx.font = `600 ${this.fontSize}px Inter`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(this.text, this.x + this.w / 2, this.y + this.h / 2);
            }
        }

        class HeadingInputControl {
            constructor(id) {
                this.id = id; this.x = 0; this.y = 0; this.w = 0; this.h = 42; this.disabled = false;
                this.large = false;
                this.inputRect = { x: 0, y: 0, w: 86, h: 34 };
            }
            setBounds(x, y, w, h = 42) {
                this.x = x; this.y = y; this.w = w; this.h = h;
                const inputH = this.large ? 46 : 34;
                const inputW = this.large
                    ? Math.min(132, Math.max(108, w * 0.34))
                    : Math.min(92, Math.max(76, w * 0.32));
                const unitsGap = this.large ? 48 : 28;
                this.inputRect = { x: x + w - inputW - unitsGap, y: y + (h - inputH) / 2, w: inputW, h: inputH };
                positionHeadingInput(this.inputRect, this.large);
            }
            setDisabled(disabled) {
                this.disabled = disabled;
                headingInput.disabled = disabled;
            }
            update() {}
            draw(ctx) {
                const labelSize = this.large ? 18 : 13;
                ctx.fillStyle = this.disabled ? '#64748b' : '#cbd5e1';
                ctx.font = `600 ${labelSize}px Inter`;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(mission.level === 4 ? 'Swim Speed' : 'Swim Heading', this.x, this.y + this.h / 2);

                ctx.fillStyle = this.disabled ? '#64748b' : '#7dd3fc';
                ctx.font = `600 ${labelSize}px monospace`;
                ctx.textAlign = 'left';
                ctx.fillText(mission.level === 4 ? 'm/s' : 'deg', this.inputRect.x + this.inputRect.w + 8, this.y + this.h / 2);
            }
        }

        const BABY_DRAW_SCALE = 0.5;
        // Pixels per m/s for every velocity vector. Embeds run longer so the swim arrow reads from
        // the frame; raising it here keeps the aim, current and resultant arrows in the same scale,
        // which is what makes the HINT vector-addition diagram line up.
        const VELOCITY_VECTOR_SCALE = urlParams.get('hideHud') === '1' ? 34 : 26;

        // Embedded transparent SVG used for the Level 1 rapids.
        const RAPID_SVG = `
<svg width="220" height="120" viewBox="0 0 220 120" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="110" cy="60" rx="52" ry="20" fill="white" fill-opacity="0.35"/>

  <path d="M85 42 Q96 60 85 78" fill="none" stroke="white" stroke-opacity="0.9" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M110 38 Q116 60 110 82" fill="none" stroke="white" stroke-opacity="0.9" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M135 42 Q124 60 135 78" fill="none" stroke="white" stroke-opacity="0.9" stroke-width="1.2" stroke-linecap="round"/>

  <path d="M91 41 Q100 60 91 79" fill="none" stroke="white" stroke-opacity="0.85" stroke-width="0.85" stroke-linecap="round" stroke-dasharray="5 1.5"/>
  <path d="M99 40 Q107 60 99 80" fill="none" stroke="white" stroke-opacity="0.85" stroke-width="0.85" stroke-linecap="round" stroke-dasharray="5 1.5"/>
  <path d="M121 40 Q114 60 121 80" fill="none" stroke="white" stroke-opacity="0.85" stroke-width="0.85" stroke-linecap="round" stroke-dasharray="5 1.5"/>
  <path d="M129 41 Q120 60 129 79" fill="none" stroke="white" stroke-opacity="0.85" stroke-width="0.85" stroke-linecap="round" stroke-dasharray="5 1.5"/>

  <path d="M72 60 L76 49 L86 46 L93 52 L91 63 L84 71 L74 69 L69 63 Z" fill="#475569" stroke="#1e293b" stroke-width="2"/>
  <path d="M74 56 Q77 51 82 50" fill="none" stroke="white" stroke-opacity="0.18" stroke-width="2" stroke-linecap="round"/>

  <path d="M128 60 L133 48 L144 46 L151 53 L149 64 L141 72 L130 70 L125 63 Z" fill="#475569" stroke="#1e293b" stroke-width="2"/>
  <path d="M131 56 Q135 50 140 50" fill="none" stroke="white" stroke-opacity="0.18" stroke-width="2" stroke-linecap="round"/>
</svg>`;

        const rapidImage = new Image();
        rapidImage.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(RAPID_SVG);

        // `parts` lets a caller draw the shaft and the head in separate passes, which is how the
        // Level 4 aim vector flashes only its arrowhead.
        function drawVectorArrow(fx, fy, tx, ty, color, width = 3, headLen = 10, parts = 'both') {
            const dx = tx - fx, dy = ty - fy;
            if (Math.abs(dx) < 0.1 && Math.abs(dy) < 0.1) return;
            const angle = Math.atan2(dy, dx);
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            if (parts !== 'head') {
                ctx.moveTo(fx, fy);
                ctx.lineTo(tx, ty);
            }
            if (parts !== 'shaft') {
                ctx.moveTo(tx - headLen * Math.cos(angle - Math.PI/6), ty - headLen * Math.sin(angle - Math.PI/6));
                ctx.lineTo(tx, ty);
                ctx.lineTo(tx - headLen * Math.cos(angle + Math.PI/6), ty - headLen * Math.sin(angle + Math.PI/6));
            }
            ctx.stroke();
            ctx.restore();
        }

        function measureLabel(text, size) {
            ctx.save();
            ctx.font = `800 ${size}px Inter`;
            const width = ctx.measureText(text).width;
            ctx.restore();
            return width;
        }

        // Keeps a left-aligned scene label inside the canvas on narrow frames.
        function clampLabelX(text, x, size) {
            return Math.min(x, bounds.sim.x + bounds.sim.w - 14 - measureLabel(text, size));
        }

        function drawVectorLabel(text, x, y, color, align = 'left', size = 14) {
            ctx.save();
            ctx.font = `800 ${size}px Inter`;
            ctx.textAlign = align;
            ctx.textBaseline = 'middle';
            ctx.lineWidth = 5;
            ctx.strokeStyle = 'rgba(2, 6, 23, 0.85)';
            ctx.strokeText(text, x, y);
            ctx.fillStyle = color;
            ctx.fillText(text, x, y);
            ctx.restore();
        }

        // Twin rotation arcs at the aim vector's tip: the cue that the vector is draggable. The
        // sweeps are laid out relative to `angle` (the vector's own heading) so they always straddle
        // the arrow, and blink so they read as a prompt rather than scenery.
        function drawRotationArcs(ctx, tipX, tipY, angle, enableBlink = true) {
            if (enableBlink && Math.floor(Date.now() / 500) % 2 !== 0) return;

            const arcRadius = 45;          // Distance from the vector tip
            const sweepDeg = 33;           // 30 degrees + 10% extra length
            const gapDeg = 15;             // Clearance between the arrow shaft and each arc
            const headLen = 8;             // Arrowhead leg length
            const wingAngle = Math.PI / 4; // 45-degree arrowhead wing flare
            const deg = Math.PI / 180;

            const startAngle1 = angle + gapDeg * deg;
            const endAngle1 = angle + (gapDeg + sweepDeg) * deg;
            const startAngle2 = angle - (gapDeg + sweepDeg) * deg;
            const endAngle2 = angle - gapDeg * deg;

            ctx.save();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#f97316'; // Matches the aim vector it belongs to
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // --- 1. Clockwise arc and arrowhead ---
            ctx.beginPath();
            ctx.arc(tipX, tipY, arcRadius, startAngle1, endAngle1);
            ctx.stroke();

            const endX1 = tipX + arcRadius * Math.cos(endAngle1);
            const endY1 = tipY + arcRadius * Math.sin(endAngle1);
            const dir1 = endAngle1 + Math.PI / 2; // Tangent pointing forward

            ctx.beginPath();
            ctx.moveTo(endX1 - headLen * Math.cos(dir1 - wingAngle), endY1 - headLen * Math.sin(dir1 - wingAngle));
            ctx.lineTo(endX1, endY1);
            ctx.lineTo(endX1 - headLen * Math.cos(dir1 + wingAngle), endY1 - headLen * Math.sin(dir1 + wingAngle));
            ctx.stroke();

            // --- 2. Counter-clockwise arc and arrowhead ---
            ctx.beginPath();
            ctx.arc(tipX, tipY, arcRadius, startAngle2, endAngle2);
            ctx.stroke();

            const startX2 = tipX + arcRadius * Math.cos(startAngle2);
            const startY2 = tipY + arcRadius * Math.sin(startAngle2);
            const dir2 = startAngle2 - Math.PI / 2; // Tangent pointing backward

            ctx.beginPath();
            ctx.moveTo(startX2 - headLen * Math.cos(dir2 - wingAngle), startY2 - headLen * Math.sin(dir2 - wingAngle));
            ctx.lineTo(startX2, startY2);
            ctx.lineTo(startX2 - headLen * Math.cos(dir2 + wingAngle), startY2 - headLen * Math.sin(dir2 + wingAngle));
            ctx.stroke();

            ctx.restore();
        }

        function drawStar(cx, cy, outerR, filled) {
            const spikes = 5, innerR = outerR * 0.45;
            ctx.save();
            ctx.beginPath();
            for (let i = 0; i < spikes * 2; i++) {
                const r = i % 2 === 0 ? outerR : innerR;
                const a = (i * Math.PI) / spikes - Math.PI / 2;
                const px = cx + r * Math.cos(a), py = cy + r * Math.sin(a);
                if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fillStyle = filled ? '#facc15' : '#1e293b';
            ctx.strokeStyle = filled ? '#b45309' : '#475569';
            ctx.lineWidth = 2;
            ctx.fill(); ctx.stroke();
            ctx.restore();
        }

        function wrapTextLines(text, maxWidth) {
            const words = String(text || '').split(' ');
            const lines = [];
            let line = '';
            for (const word of words) {
                const test = line ? line + ' ' + word : word;
                if (ctx.measureText(test).width > maxWidth && line) {
                    lines.push(line);
                    line = word;
                } else {
                    line = test;
                }
            }
            if (line) lines.push(line);
            return lines;
        }

        function wrapCanvasText(text, x, y, maxWidth, lineHeight, maxLines = 3) {
            const lines = wrapTextLines(text, maxWidth);
            for (let i = 0; i < Math.min(lines.length, maxLines); i++) {
                ctx.fillText(lines[i], x, y + i * lineHeight);
            }
        }

        // All four levels use a 3 m/s river current and a 50 m river: swim 5 m/s, current 3 m/s, river 50 m wide.
        const LEVEL_CONFIGS = {
            1: {
                title: 'Level 1: Straight Shot',
                goalType: 'ring',
                swimSpeed: 5,
                currentSpeed: 3,
                start: p => ({ x: 0, y: p.width * 0.4, radius: 5.5 }),
                target: p => ({ x: p.width, y: p.width * 0.4, radius: 4.0 }),
                startMsg: 'GOAL: land in the ring straight across from the dock. The current drags you downstream, so aim upstream to cancel the drift.',
                hintLines: [
                    'Your drift speed = 5·sin(θ) + 3 m/s.',
                    'To land straight across, drift must be 0:',
                    '5·sin(θ) = −3, so sin(θ) = −0.6.',
                    'Speed left for crossing = 5·cos(θ).'
                ]
            },
            2: {
                title: 'Level 2: Fastest Crossing',
                goalType: 'bank',
                timeLimit: 11.0,
                swimSpeed: 5,
                currentSpeed: 3,
                start: p => ({ x: 0, y: p.width * 0.2, radius: 5.5 }),
                target: p => ({ x: p.width, y: p.width * 0.2, radius: 0 }),
                startMsg: 'GOAL: reach the far bank ANYWHERE within 11.0 s. Drifting downstream is fine here — speed is everything.',
                hintLines: [
                    'Crossing time = 50 ÷ (5·cosθ) seconds.',
                    'cosθ is biggest at θ = 0° (straight across).',
                    'Drifting downstream costs NO time here —',
                    'only your across-river speed matters.'
                ]
            },
            3: {
                title: 'Level 3: Aim at the Baby',
                goalType: 'intercept',
                swimSpeed: 5,
                currentSpeed: 3,
                start: p => ({ x: 0, y: p.width * 0.52, radius: 5.5 }),
                target: p => ({ x: p.width * 0.7, y: p.width * 0.04, radius: 4.5 }),
                startMsg: 'TRICK: the baby starts far above you. Choose the angle that points directly at the baby’s current position.',
                hintLines: [
                    'The current pushes you and the baby equally.',
                    'From the water frame, the baby is standing still.',
                    'The river current cancels from your relative motion.',
                    'Aim your swim vector directly at the baby now.',
                    'Both of you will drift downstream together.'
                ]
            },
            4: {
                title: 'Level 4: Choose the Rescue Speed',
                goalType: 'intercept',
                swimSpeed: 5,
                currentSpeed: 3,
                // Start high in the river: the extra drift room is what sets the lower edge of the
                // working speed band. Band is 3.0-5.0 m/s — see getLevelFourBoulders().
                start: p => ({ x: 0, y: p.width * 0.12, radius: 5.5 }),
                target: p => ({ x: p.width * 0.7, y: p.width * 0.12, radius: 2.3 }),
                startMsg: 'SPEED CHALLENGE: heading is fixed at 0°. Too slow and the baby hits the lower rock. Too fast and you hit the upper boulder. Only a band of speeds works.',
                hintLines: [
                    'Your heading is fixed straight across at 0°.',
                    'You must cover 32.7 m across to reach the baby,',
                    'so your time to the baby = 32.7 ÷ your speed.',
                    'The baby drifts 3 m/s toward the lower rock —',
                    'beat it there, but stay slow enough that the',
                    'current carries you under the upper boulder.'
                ]
            }
        };

        let btnPlay, btnReset, btnHint, btnData, headingControl;
        const levelButtons = [];

        function buildUI() {
            uiElements = [
                headingControl = new HeadingInputControl('heading'),
                btnPlay = new Button('play', 'START SWIM', togglePlayPause),
                btnReset = new Button('reset', 'RESET', resetSimulation),
                btnHint = new Button('hint', 'HINT', cycleHint),
                btnData = new Button('data', 'DATA', () => { showTelemetry = !showTelemetry; btnData.isActive = showTelemetry; })
            ];
            btnPlay.bgColor = '#0284c7'; btnPlay.hoverColor = '#0369a1';
            btnReset.bgColor = '#334155'; btnReset.hoverColor = '#475569';
            btnHint.bgColor = '#0f172a'; btnHint.hoverColor = '#1e293b'; btnHint.activeBgColor = '#d97706';
            btnData.bgColor = '#0f172a'; btnData.hoverColor = '#1e293b'; btnData.activeBgColor = '#0ea5e9';

            if (!lockedLevel) {
                for (const n of [1, 2, 3, 4]) {
                    const b = new Button('lvl' + n, String(n), () => setLevel(n));
                    b.fontSize = 13;
                    levelButtons.push(b);
                    uiElements.push(b);
                }
            }
        }

        function cycleHint() {
            hintMode = (hintMode + 1) % 3;
            btnHint.isActive = hintMode > 0;
            btnHint.text = hintMode === 0 ? 'HINT' : hintMode === 1 ? 'HINT 1' : 'HINT 2';
        }

        function layout() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
            const w = window.innerWidth;
            const h = window.innerHeight;

            bounds.isMobile = w < 768;
            bounds.sim = { x: 0, y: 0, w, h };

            const pad = 18;
            const headerW = Math.min(w - pad * 2, bounds.isMobile ? 430 : 620);
            const controlH = showHud ? 42 : 56;
            const controlsH = showHud ? 76 : controlH + 12;
            const headingW = Math.min(w - pad * 2, showHud ? 312 : 430);

            if (showHud) {
                bounds.header = { x: pad, y: pad, w: headerW, h: 116 };
                bounds.controls = { x: pad, y: pad + bounds.header.h + 10, w: headingW, h: controlsH };
            } else {
                // Assessment embeds draw no HUD panel, so the heading input leads at the top.
                bounds.header = { x: 0, y: 0, w: 0, h: 0 };
                bounds.controls = { x: pad, y: pad, w: headingW, h: controlsH };
            }

            if (levelButtons.length) {
                const bw = 36, bh = 28, gap = 6;
                const rowW = bw * levelButtons.length + gap * (levelButtons.length - 1);
                const x0 = showHud ? bounds.header.x + bounds.header.w - rowW - 12 : Math.max(pad, w - pad - rowW);
                const y0 = showHud ? bounds.header.y + 10 : pad;
                levelButtons.forEach((b, i) => b.setBounds(x0 + i * (bw + gap), y0, bw, bh));
            }

            headingControl.large = !showHud;
            headingControl.setBounds(bounds.controls.x + 14, bounds.controls.y + 6, bounds.controls.w - 28, controlH);

            const actionY = Math.max(12, h - 62);
            const availableActionW = Math.max(280, w - pad * 2);
            const resetW = bounds.isMobile ? 66 : 88;
            const hintW = bounds.isMobile ? 64 : 80;
            const dataW = bounds.isMobile ? 58 : 72;
            const playW = Math.max(100, Math.min(bounds.isMobile ? 120 : 150, availableActionW - resetW - hintW - dataW - 30));
            bounds.actions = { x: pad, y: actionY, w: playW + resetW + hintW + dataW + 30, h: 44 };
            btnPlay.setBounds(bounds.actions.x, actionY, playW, 44);
            btnReset.setBounds(bounds.actions.x + playW + 10, actionY, resetW, 44);
            btnHint.setBounds(bounds.actions.x + playW + resetW + 20, actionY, hintW, 44);
            btnData.setBounds(bounds.actions.x + playW + resetW + hintW + 30, actionY, dataW, 44);

            scale = (bounds.sim.w * 0.5) / params.width;
            originX = bounds.sim.x + bounds.sim.w * 0.15;
            originY = bounds.sim.y + bounds.sim.h * 0.2;

            waterParticles = [];
            for (let i = 0; i < 100; i++) {
                waterParticles.push({ x: Math.random(), y: bounds.sim.y - 100 + Math.random() * (bounds.sim.h + 200), length: 5 + Math.random() * 20, speed: 0.7 + Math.random() * 0.6 });
            }
            ensureBankDecor();
        }

        function ensureBankDecor() {
            if (bankDecor) return;
            bankDecor = { left: [], right: [] };
            for (const side of ['left', 'right']) {
                for (let i = 0; i < 15; i++) {
                    const roll = Math.random();
                    bankDecor[side].push({
                        t: (i + Math.random() * 0.8) / 15,
                        u: 0.12 + Math.random() * 0.72,
                        s: 0.7 + Math.random() * 0.7,
                        kind: roll < 0.5 ? 'tree' : roll < 0.8 ? 'bush' : 'rock'
                    });
                }
            }
        }

        function setLevel(lvl) {
            if (!LEVEL_CONFIGS[lvl]) return;
            if (lockedLevel && lvl !== lockedLevel) return;
            mission.level = lvl; resetSimulation();
        }

        function recalculatePhysics() {
            params.angleRad = params.angleDeg * (Math.PI / 180);
            params.effectiveBoatSpeed = params.vBoat;
            params.vResultantX = params.effectiveBoatSpeed * Math.cos(params.angleRad);
            params.vResultantY = params.effectiveBoatSpeed * Math.sin(params.angleRad) + params.vRiver;
            params.vResultantMag = Math.hypot(params.vResultantX, params.vResultantY);
        }

        function clampHeading(angleDeg) {
            return Math.max(-85, Math.min(85, angleDeg));
        }

        function formatHeading(angleDeg) {
            return Number.isInteger(angleDeg) ? angleDeg.toFixed(0) : angleDeg.toFixed(1);
        }

        function positionHeadingInput(rect, large) {
            headingInput.style.left = rect.x + 'px';
            headingInput.style.top = rect.y + 'px';
            headingInput.style.width = rect.w + 'px';
            headingInput.style.height = rect.h + 'px';
            headingInput.style.fontSize = large ? '22px' : '14px';
        }

        function syncHeadingInput() {
            if (mission.level === 4) {
                headingInput.min = '1';
                headingInput.max = '8';
                headingInput.step = '0.1';
                headingInput.value = params.vBoat.toFixed(1);
                headingInput.setAttribute('aria-label', 'Swim speed in meters per second');
            } else {
                headingInput.min = '-85';
                headingInput.max = '85';
                headingInput.step = '1';
                headingInput.value = formatHeading(params.angleDeg);
                headingInput.setAttribute('aria-label', 'Swim heading angle in degrees, negative aims upstream');
            }
        }

        function setSwimSpeed(speed, shouldSyncInput = true) {
            if (!Number.isFinite(speed)) return;
            params.vBoat = Math.round(Math.max(1, Math.min(8, speed)) * 10) / 10;
            recalculatePhysics();
            if (shouldSyncInput) syncHeadingInput();
        }

        function setHeadingAngle(angleDeg, shouldSyncInput = true) {
            if (!Number.isFinite(angleDeg)) return;
            params.angleDeg = Math.round(clampHeading(angleDeg) * 10) / 10;
            recalculatePhysics();
            if (shouldSyncInput) syncHeadingInput();
        }

        function resetSimulation() {
            const config = LEVEL_CONFIGS[mission.level];
            params.vBoat = config.swimSpeed;
            params.vRiver = config.currentSpeed;
            if (mission.level === 4) params.angleDeg = 0;
            const start = config.start(params);

            isPlaying = false;
            physics.time = 0; physics.x = start.x; physics.y = start.y; physics.trail = [];
            ripples = []; rippleTimer = 0; babyRippleTimer = 0;
            mission.phase = 'setup'; mission.message = config.startMsg; mission.stars = 0;
            mission.goalType = config.goalType;
            mission.timeLimit = config.timeLimit || 0;
            mission.startZone = { x: start.x, y: start.y, radius: start.radius || 5.5 };

            const target = config.target(params);
            mission.baby = { x: target.x, y: target.y, radius: target.radius, rescued: false };
            mission.staminaMax = Math.round(params.width * 2.5 + 40);
            mission.staminaLeft = mission.staminaMax;

            recalculatePhysics(); syncHeadingInput(); updateUIState();
        }

        function togglePlayPause() {
            if (mission.phase === 'success' || mission.phase === 'fail') { resetSimulation(); return; }
            if (mission.phase === 'setup') {
                mission.phase = 'outbound'; isPlaying = true;
            } else { isPlaying = !isPlaying; }
            if (isPlaying) lastTime = performance.now();
            updateUIState();
        }

        function updateUIState() {
            const activeSwim = isPlaying || mission.phase === 'success' || mission.phase === 'fail';
            headingControl.setDisabled(activeSwim);

            if (mission.phase === 'success' || mission.phase === 'fail') {
                btnPlay.text = 'PLAY AGAIN'; btnPlay.bgColor = mission.phase === 'success' ? '#059669' : '#b91c1c';
            } else if (isPlaying) { btnPlay.text = 'PAUSE'; btnPlay.bgColor = '#d97706'; }
            else if (physics.time > 0) { btnPlay.text = 'RESUME'; btnPlay.bgColor = '#0284c7'; }
            else { btnPlay.text = 'START SWIM'; btnPlay.bgColor = '#0284c7'; }
            btnData.isActive = showTelemetry;
            btnHint.isActive = hintMode > 0;
            levelButtons.forEach((b, i) => { b.isActive = mission.level === i + 1; });
        }

        function computeStars() {
            if (mission.level === 1) {
                const miss = Math.abs(physics.y - mission.baby.y);
                return miss <= 1.8 ? 3 : miss <= 3.6 ? 2 : 1;
            }
            if (mission.level === 2) {
                return physics.time <= 10.35 ? 3 : physics.time <= 10.75 ? 2 : 1;
            }
            const frac = mission.staminaLeft / mission.staminaMax;
            return frac >= 0.55 ? 3 : frac >= 0.35 ? 2 : 1;
        }

        function failMission(msg) { isPlaying = false; mission.phase = 'fail'; mission.message = msg; updateUIState(); return true; }
        function succeedMission(msg) { isPlaying = false; mission.phase = 'success'; mission.message = msg; mission.stars = computeStars(); updateUIState(); }

        function updatePhysics(dt) {
            if (!isPlaying) return;
            physics.time += dt;
            const dx = params.vResultantX * dt; const dy = params.vResultantY * dt;
            physics.x += dx; physics.y += dy;
            mission.staminaLeft -= Math.hypot(dx, dy);

            if (mission.staminaLeft <= 0) return failMission('Out of stamina! You drifted too long — pick a heading that finishes the mission sooner.');
            if (swimmerHitLevelThreeRapid()) return failMission('You hit the rocks in the rapids! Aim directly at the baby so you intercept before reaching the lower river.');
            if (swimmerHitLevelFourBoulder()) return failMission('Too fast! Your straight-across path hit the upper boulder. Lower your swim speed so the current carries you beneath it.');
            if (physics.trail.length === 0 || Math.hypot(physics.x - physics.trail[physics.trail.length-1].x, physics.y - physics.trail[physics.trail.length-1].y) > 1) {
                physics.trail.push({x: physics.x, y: physics.y});
            }

            rippleTimer += dt;
            if (rippleTimer > 0.28) { rippleTimer = 0; ripples.push({ x: physics.x, y: physics.y, age: 0 }); }
            ripples.forEach(r => r.age += dt);
            ripples = ripples.filter(r => r.age < 1.1);

            if (mission.goalType === 'intercept' && !mission.baby.rescued) {
                mission.baby.y += params.vRiver * dt;
                babyRippleTimer += dt;
                if (babyRippleTimer > 0.5) { babyRippleTimer = 0; ripples.push({ x: mission.baby.x, y: mission.baby.y, age: 0 }); }
                if (babyHitLevelFourRock()) return failMission('Too slow! The baby reached the lower rock before you caught up. Raise your swim speed and try again.');
                if (mission.baby.y > (bounds.sim.h - originY) / scale + 5) return failMission('The baby went over the falls! Aim straight at the baby and start again.');
            }

            if (mission.goalType === 'bank') {
                if (physics.x >= params.width) {
                    const drift = physics.y - mission.startZone.y;
                    if (physics.time <= mission.timeLimit) {
                        return succeedMission(`Crossed in ${physics.time.toFixed(2)} s — inside the ${mission.timeLimit.toFixed(1)} s window! You drifted ${drift.toFixed(0)} m downstream and it cost you nothing.`);
                    }
                    return failMission(`You made it across, but in ${physics.time.toFixed(2)} s — over the ${mission.timeLimit.toFixed(1)} s window. Headings closer to 0° cross faster.`);
                }
                if (physics.time > mission.timeLimit) {
                    const left = params.width - physics.x;
                    return failMission(`Time's up! You were still ${left.toFixed(0)} m from the far bank. Angling away from 0° shrinks your across-river speed.`);
                }
            } else if (mission.goalType === 'ring') {
                // The run resolves at the bank so the crossing time matches width / (5·cosθ).
                if (physics.x >= params.width) {
                    const miss = physics.y - mission.baby.y;
                    if (Math.abs(miss) <= mission.baby.radius) {
                        mission.baby.rescued = true;
                        return succeedMission(`Straight shot! Crossed in ${physics.time.toFixed(1)} s and landed ${Math.abs(miss).toFixed(1)} m from ring center. Your upstream aim cancelled the current.`);
                    }
                    if (miss > 0) return failMission(`You landed ${miss.toFixed(1)} m DOWNSTREAM of the ring. The current won — aim further upstream (more negative angle).`);
                    return failMission(`You landed ${(-miss).toFixed(1)} m UPSTREAM of the ring. You over-corrected — bring your angle back toward 0°.`);
                }
            } else if (mission.goalType === 'intercept' && !mission.baby.rescued) {
                if (Math.hypot(physics.x - mission.baby.x, physics.y - mission.baby.y) <= mission.baby.radius) {
                    mission.baby.rescued = true;
                    if (mission.level === 4) {
                        return succeedMission(`Baby rescued at ${params.vBoat.toFixed(1)} m/s! Your speed was fast enough to beat the lower rock but slow enough to miss the upper boulder.`);
                    }
                    return succeedMission(`Baby rescued in ${physics.time.toFixed(1)} s! You aimed directly at the baby, so the equal river drift cancelled from the relative motion.`);
                }
                if (physics.x > params.width + 5) {
                    return failMission(mission.level === 4
                        ? 'You crossed the river without reaching the baby. Increase your speed, but avoid the upper boulder.'
                        : 'You crossed the whole river but missed the baby. Aim straight AT the baby — the current moves you both the same amount.');
                }
            }
        }

        function drawLevelHeader() {
            if (!showHud) return;
            const header = bounds.header;
            ctx.save();
            ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
            ctx.strokeStyle = 'rgba(125, 211, 252, 0.4)';
            ctx.lineWidth = 1;
            if (ctx.roundRect) {
                ctx.beginPath();
                ctx.roundRect(header.x, header.y, header.w, header.h, 8);
                ctx.fill();
                ctx.stroke();
            } else {
                ctx.fillRect(header.x, header.y, header.w, header.h);
                ctx.strokeRect(header.x, header.y, header.w, header.h);
            }

            const padX = header.x + 16;
            ctx.fillStyle = '#67e8f9';
            ctx.font = `800 ${bounds.isMobile ? 17 : 19}px Inter`;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(LEVEL_CONFIGS[mission.level].title, padX, header.y + 26);

            if (levelButtons.length) {
                ctx.fillStyle = '#64748b';
                ctx.font = '700 9px Inter';
                ctx.textAlign = 'right';
                ctx.fillText('LEVEL', levelButtons[0].x - 8, header.y + 24);
            }

            const chipY = header.y + 58;
            const cw = Math.min(116, Math.floor((header.w - 48) / 3));
            drawSpeedChip('Swim', params.vBoat.toFixed(1) + ' m/s', padX, chipY, '#fed7aa', cw);
            drawSpeedChip('Current', params.vRiver.toFixed(1) + ' m/s', padX + cw + 8, chipY, '#bae6fd', cw);
            const timeVal = mission.goalType === 'bank'
                ? physics.time.toFixed(1) + '/' + mission.timeLimit.toFixed(1) + ' s'
                : physics.time.toFixed(1) + ' s';
            const timeColor = mission.goalType === 'bank' && physics.time > mission.timeLimit - 1.5 ? '#fca5a5' : '#d9f99d';
            drawSpeedChip('Time', timeVal, padX + (cw + 8) * 2, chipY, timeColor, cw + 8);

            ctx.fillStyle = '#cbd5e1';
            ctx.font = '500 12px Inter';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            wrapCanvasText(mission.message, padX, header.y + 86, header.w - 32, 15, 2);
            ctx.restore();
        }

        function drawCanvasControls() {
            const panel = bounds.controls;
            ctx.save();
            ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
            ctx.strokeStyle = 'rgba(125, 211, 252, 0.4)';
            ctx.lineWidth = 1;
            if (ctx.roundRect) {
                ctx.beginPath();
                ctx.roundRect(panel.x, panel.y, panel.w, panel.h, 8);
                ctx.fill();
                ctx.stroke();
            } else {
                ctx.fillRect(panel.x, panel.y, panel.w, panel.h);
                ctx.strokeRect(panel.x, panel.y, panel.w, panel.h);
            }
            if (showHud) {
                ctx.fillStyle = '#94a3b8';
                ctx.font = '500 11px Inter';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(
                    mission.level === 4
                        ? 'Heading fixed at 0° · choose a safe speed from 1–8 m/s'
                        : mission.level === 3
                            ? 'Aim the orange arrow directly at the baby’s current position'
                            : 'Negative = aim upstream · or drag the orange arrow',
                    panel.x + 14,
                    panel.y + panel.h - 15
                );
            }
            ctx.restore();
            uiElements.forEach(el => el.draw(ctx));
        }

        function drawHintPanel() {
            if (hintMode === 0) { bounds.hintRect = { x: 0, y: 0, w: 0, h: 0 }; return; }
            // Desktop: top-right corner, clear of the swimmer's start area. Mobile: below the controls.
            const w = bounds.controls.w;
            const x = bounds.isMobile ? bounds.controls.x : bounds.sim.x + bounds.sim.w - w - 18;
            const y = bounds.isMobile ? bounds.controls.y + bounds.controls.h + 10 : 18;
            const legend = [
                ['#f97316', mission.level === 4 ? 'Orange: fixed 0° path — choose swim speed' : 'Orange: you aim — swim ' + params.vBoat.toFixed(1) + ' m/s at θ'],
                ['#38bdf8', 'Blue: river current — 3 m/s downstream'],
                ['#22c55e', 'Green: actual path = orange + blue']
            ];
            const strategy = hintMode === 2 ? LEVEL_CONFIGS[mission.level].hintLines : [];
            const h = 34 + legend.length * 19 + (strategy.length ? strategy.length * 16 + 12 : 0);
            bounds.hintRect = { x, y, w, h };

            ctx.save();
            ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
            ctx.strokeStyle = 'rgba(217, 119, 6, 0.55)';
            ctx.lineWidth = 1;
            if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, 8); ctx.fill(); ctx.stroke(); }
            else { ctx.fillRect(x, y, w, h); ctx.strokeRect(x, y, w, h); }

            ctx.fillStyle = '#fbbf24';
            ctx.font = '800 11px Inter';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(hintMode === 1 ? 'HINT 1 · READ THE VECTORS' : 'HINT 2 · STRATEGY', x + 14, y + 16);

            let rowY = y + 38;
            ctx.font = '500 11.5px Inter';
            for (const [color, text] of legend) {
                drawVectorArrow(x + 14, rowY, x + 36, rowY, color, 3, 7);
                ctx.fillStyle = '#cbd5e1';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, x + 44, rowY);
                rowY += 19;
            }

            if (strategy.length) {
                rowY += 4;
                ctx.fillStyle = '#fde68a';
                ctx.font = '600 11.5px Inter';
                for (const line of strategy) {
                    ctx.fillText(line, x + 14, rowY);
                    rowY += 16;
                }
            }
            ctx.restore();
        }

        function drawSpeedChip(label, value, x, y, color, w = 112) {
            ctx.fillStyle = 'rgba(2, 6, 23, 0.58)';
            if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y - 12, w, 25, 6); ctx.fill(); }
            else { ctx.fillRect(x, y - 12, w, 25); }
            ctx.fillStyle = '#94a3b8';
            ctx.font = '700 10px Inter';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, x + 8, y);
            ctx.fillStyle = color;
            ctx.font = '800 11px monospace';
            ctx.textAlign = 'right';
            ctx.fillText(value, x + w - 8, y);
        }

        function drawTree(x, y, s) {
            ctx.fillStyle = '#3f2a14';
            ctx.fillRect(x - 2 * s, y - 2 * s, 4 * s, 8 * s);
            const layers = [[16, 0], [13, -9], [10, -17]];
            for (const [half, off] of layers) {
                ctx.fillStyle = '#064e3b';
                ctx.beginPath();
                ctx.moveTo(x, y + off * s - 16 * s);
                ctx.lineTo(x - half * s * 0.75, y + off * s);
                ctx.lineTo(x + half * s * 0.75, y + off * s);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = 'rgba(74, 222, 128, 0.22)';
                ctx.beginPath();
                ctx.moveTo(x, y + off * s - 16 * s);
                ctx.lineTo(x + half * s * 0.75, y + off * s);
                ctx.lineTo(x + half * s * 0.3, y + off * s);
                ctx.closePath();
                ctx.fill();
            }
        }

        function drawBush(x, y, s) {
            ctx.fillStyle = '#166534';
            ctx.beginPath();
            ctx.arc(x - 5 * s, y, 6 * s, 0, Math.PI * 2);
            ctx.arc(x + 4 * s, y - 2 * s, 7 * s, 0, Math.PI * 2);
            ctx.arc(x + 2 * s, y + 3 * s, 5 * s, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(134, 239, 172, 0.25)';
            ctx.beginPath();
            ctx.arc(x + 5 * s, y - 4 * s, 3.5 * s, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawRock(x, y, s) {
            ctx.fillStyle = '#57534e';
            ctx.beginPath();
            ctx.ellipse(x, y, 7 * s, 4.5 * s, 0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.18)';
            ctx.beginPath();
            ctx.ellipse(x - 2 * s, y - 1.5 * s, 3 * s, 1.6 * s, 0.2, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawBankDecorSide(side, x0, x1) {
            const usable = x1 - x0;
            if (usable < 34) return;
            for (const d of bankDecor[side]) {
                const px = x0 + 14 + d.u * (usable - 28);
                const py = bounds.sim.y + d.t * bounds.sim.h;
                if (d.kind === 'tree') drawTree(px, py, d.s);
                else if (d.kind === 'bush') drawBush(px, py, d.s);
                else drawRock(px, py, d.s);
            }
        }

        function drawRiverEnv() {
            const rLeft = originX, rRight = originX + params.width * scale;
            const riverW = params.width * scale;

            const waterGradient = ctx.createLinearGradient(rLeft, 0, rRight, 0);
            waterGradient.addColorStop(0, '#1d4ed8');
            waterGradient.addColorStop(0.5, '#1e40af');
            waterGradient.addColorStop(1, '#1d4ed8');
            ctx.fillStyle = waterGradient;
            ctx.fillRect(bounds.sim.x, bounds.sim.y, bounds.sim.w, bounds.sim.h);

            ctx.save();
            ctx.beginPath();
            ctx.rect(rLeft, bounds.sim.y, riverW, bounds.sim.h);
            ctx.clip();

            ctx.strokeStyle = 'rgba(219, 234, 254, 0.14)';
            ctx.lineWidth = 12;
            ctx.lineCap = 'round';
            for (let i = -1; i < 8; i++) {
                const baseY = bounds.sim.y + (i / 6) * bounds.sim.h + Math.sin(ambientTime * 0.8 + i) * 9;
                ctx.beginPath();
                ctx.moveTo(rLeft + 12, baseY);
                ctx.bezierCurveTo(
                    rLeft + riverW * 0.28, baseY + 22,
                    rLeft + riverW * 0.66, baseY - 28,
                    rRight - 12, baseY + 12
                );
                ctx.stroke();
            }

            ctx.strokeStyle = 'rgba(191, 219, 254, 0.32)'; ctx.lineWidth = 3; ctx.beginPath();
            const visSpeed = isPlaying ? params.vRiver * 3 : 0;
            waterParticles.forEach(p => {
                if (isPlaying) { p.y += visSpeed * p.speed; if (p.y > bounds.sim.y + bounds.sim.h + 50) { p.y = bounds.sim.y - 50; p.x = Math.random(); } }
                const px = rLeft + p.x * riverW;
                if (px >= rLeft && px <= rRight) { ctx.moveTo(px, p.y); ctx.lineTo(px, p.y + p.length); }
            });
            ctx.stroke();

            if (mission.level === 3) {
                drawLevelThreeRapids(rLeft, rRight);
                drawFalls(rLeft, rRight);
            } else if (mission.level === 4) {
                drawLevelFourBoulders();
            }
            ctx.restore();

            const bankGradient = ctx.createLinearGradient(bounds.sim.x, 0, rLeft, 0);
            bankGradient.addColorStop(0, '#14532d');
            bankGradient.addColorStop(0.65, '#166534');
            bankGradient.addColorStop(1, '#15803d');
            ctx.fillStyle = bankGradient;
            ctx.fillRect(bounds.sim.x, bounds.sim.y, rLeft - bounds.sim.x, bounds.sim.h);

            const farBankGradient = ctx.createLinearGradient(rRight, 0, bounds.sim.x + bounds.sim.w, 0);
            farBankGradient.addColorStop(0, '#15803d');
            farBankGradient.addColorStop(0.35, '#166534');
            farBankGradient.addColorStop(1, '#14532d');
            ctx.fillStyle = farBankGradient;
            ctx.fillRect(rRight, bounds.sim.y, (bounds.sim.x + bounds.sim.w) - rRight, bounds.sim.h);

            drawBankDecorSide('left', bounds.sim.x, rLeft - 14);
            drawBankDecorSide('right', rRight + 14, bounds.sim.x + bounds.sim.w);

            const sandL = ctx.createLinearGradient(rLeft - 10, 0, rLeft, 0);
            sandL.addColorStop(0, '#d97706');
            sandL.addColorStop(1, '#fbbf24');
            ctx.fillStyle = sandL;
            ctx.fillRect(rLeft - 10, bounds.sim.y, 10, bounds.sim.h);
            const sandR = ctx.createLinearGradient(rRight, 0, rRight + 10, 0);
            sandR.addColorStop(0, '#fbbf24');
            sandR.addColorStop(1, '#d97706');
            ctx.fillStyle = sandR;
            ctx.fillRect(rRight, bounds.sim.y, 10, bounds.sim.h);
            ctx.strokeStyle = '#fef3c7'; ctx.lineWidth = 2; ctx.beginPath();
            ctx.moveTo(rLeft, bounds.sim.y); ctx.lineTo(rLeft, bounds.sim.y + bounds.sim.h);
            ctx.moveTo(rRight, bounds.sim.y); ctx.lineTo(rRight, bounds.sim.y + bounds.sim.h);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(187, 247, 208, 0.35)';
            ctx.lineWidth = 2;
            for (let y = bounds.sim.y + 18; y < bounds.sim.y + bounds.sim.h; y += 34) {
                ctx.beginPath();
                ctx.moveTo(rLeft - 14, y);
                ctx.lineTo(rLeft - 26, y + 8);
                ctx.moveTo(rRight + 14, y + 12);
                ctx.lineTo(rRight + 27, y + 4);
                ctx.stroke();
            }

            ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.font = '11px monospace'; ctx.textAlign = 'right';
            for (let i = 0; i <= 300; i += 20) {
                let y = originY + i * scale; if (y > bounds.sim.y + bounds.sim.h) break;
                ctx.fillText(i + 'm', rLeft - 14, y + 3); ctx.fillRect(rLeft - 10, y, 6, 1);
            }

            const arrowLen = params.vRiver * VELOCITY_VECTOR_SCALE;
            const arrowX = rLeft + riverW * 0.5;
            // With no HUD chips to read, the current readout rides in the top quarter of the canvas
            // (clear of the heading panel) and is drawn large enough to read from the frame.
            const arrowMidY = showHud
                ? bounds.sim.y + bounds.sim.h * 0.5
                : Math.max(bounds.sim.y + bounds.sim.h * 0.18, bounds.controls.y + bounds.controls.h + arrowLen * 0.5 + 12);
            const arrowTop = arrowMidY - arrowLen * 0.5;
            drawVectorArrow(arrowX, arrowTop, arrowX, arrowTop + arrowLen, 'rgba(56, 189, 248, 0.9)', 8, 20);
            const currentText = 'River current = ' + params.vRiver.toFixed(1) + ' m/s';
            const currentSize = showHud ? 14 : 20;
            const currentWidth = measureLabel(currentText, currentSize);

            // The Level 3 baby waits high in the river and the desktop hint panel sits top-right,
            // both right where the raised readout lands, so the label swaps to the upstream side.
            const babyNearReadout = !showHud
                && mission.goalType === 'intercept'
                && !mission.baby.rescued
                && originX + mission.baby.x * scale > arrowX
                && Math.abs(originY + mission.baby.y * scale - arrowMidY) < 60;
            const hintPanelInTheWay = !showHud && hintMode > 0 && !bounds.isMobile;

            if ((babyNearReadout || hintPanelInTheWay) && arrowX - 18 - currentWidth > bounds.sim.x + 12) {
                drawVectorLabel(currentText, arrowX - 18, arrowMidY, '#bae6fd', 'right', currentSize);
            } else {
                drawVectorLabel(currentText, clampLabelX(currentText, arrowX + 18, currentSize), arrowMidY, '#bae6fd', 'left', currentSize);
            }
        }

        function getLevelThreeRapidPlacements(rLeft, rRight) {
            const riverW = rRight - rLeft;
            const rapidW = Math.max(112, Math.min(168, riverW * 0.28));
            const rapidH = rapidW * (120 / 220);
            const yUpper = bounds.sim.y + bounds.sim.h * 0.76;
            const yLower = bounds.sim.y + bounds.sim.h * 0.88;

            return [
                { cx: rLeft + riverW * 0.18, cy: yUpper, angleDeg: -7, w: rapidW, h: rapidH },
                { cx: rLeft + riverW * 0.47, cy: yUpper, angleDeg:  8, w: rapidW, h: rapidH },
                { cx: rLeft + riverW * 0.76, cy: yUpper, angleDeg: -6, w: rapidW, h: rapidH },
                { cx: rLeft + riverW * 0.32, cy: yLower, angleDeg:  7, w: rapidW, h: rapidH },
                { cx: rLeft + riverW * 0.63, cy: yLower, angleDeg: -8, w: rapidW, h: rapidH },
                { cx: rLeft + riverW * 0.90, cy: yLower, angleDeg:  6, w: rapidW, h: rapidH }
            ];
        }

        function drawLevelThreeRapids(rLeft, rRight) {
            if (mission.level !== 3 || !rapidImage.complete) return;

            ctx.save();
            ctx.globalAlpha = 0.98;
            for (const rapid of getLevelThreeRapidPlacements(rLeft, rRight)) {
                ctx.save();
                ctx.translate(rapid.cx, rapid.cy);
                ctx.rotate(rapid.angleDeg * Math.PI / 180);
                ctx.drawImage(rapidImage, -rapid.w / 2, -rapid.h / 2, rapid.w, rapid.h);
                ctx.restore();
            }
            ctx.restore();
        }

        function getRapidRockCenters(rapid) {
            const angle = rapid.angleDeg * Math.PI / 180;
            const cosA = Math.cos(angle);
            const sinA = Math.sin(angle);
            const localRocks = [
                { x: (78 / 220 - 0.5) * rapid.w, y: (60 / 120 - 0.5) * rapid.h },
                { x: (139 / 220 - 0.5) * rapid.w, y: (60 / 120 - 0.5) * rapid.h }
            ];

            return localRocks.map(rock => ({
                x: rapid.cx + rock.x * cosA - rock.y * sinA,
                y: rapid.cy + rock.x * sinA + rock.y * cosA,
                radius: Math.max(9, rapid.w * 0.055)
            }));
        }

        function swimmerHitLevelThreeRapid() {
            if (mission.level !== 3 || mission.phase !== 'outbound') return false;

            const rLeft = originX;
            const rRight = originX + params.width * scale;
            const swimmerX = originX + physics.x * scale;
            const swimmerY = originY + physics.y * scale;
            const swimmerRadius = Math.max(9, Math.min(14, scale * 1.1));

            for (const rapid of getLevelThreeRapidPlacements(rLeft, rRight)) {
                for (const rock of getRapidRockCenters(rapid)) {
                    if (Math.hypot(swimmerX - rock.x, swimmerY - rock.y) <= swimmerRadius + rock.radius) {
                        return true;
                    }
                }
            }
            return false;
        }


        // Level 4's hazards are tuned so exactly one band of swim speeds clears both: 3.5-4.1 m/s
        // at the 0.1 m/s the input steps in.
        //
        // Upper Boulder — the swimmer's straight-across path is y = startY + 3x/v, so its distance
        // from the boulder is |3x_b - v·dy_b| / sqrt(9 + v²). With x_b = 17.5, dy_b = 8 and a hit
        // radius of 2.75 + the swimmer's 1 m body, that crosses zero at v = 4.16. Note the ratio
        // 3·x_b / dy_b = 6.56 matters as much as the size: it puts the head-on hit at 6.56 m/s, which
        // is what keeps the flattest 8 m/s path inside the boulder instead of sailing over it.
        //
        // Baby Danger — the baby drifts 3 m/s from the start line into a rock whose upper edge
        // (37.7 - 3.0 - 0.25) it reaches at t = 9.48 s, and the swimmer needs 32.7/v s to reach the
        // baby, so that edge lands at v = 3.45.
        //
        // Changing any of these numbers moves the band — re-check the full 1.0-8.0 sweep first.
        function getLevelFourBoulders() {
            const startY = mission.startZone.y;
            return {
                swimmerRock: { x: 17.5, y: startY + 8.0, radius: 2.75, label: 'Upper Boulder' },
                babyRock: { x: mission.baby.x, y: 37.7, radius: 3.0, label: 'Baby Danger' }
            };
        }

        function drawBoulderWorld(rock, labelBelow = false) {
            const x = originX + rock.x * scale;
            const y = originY + rock.y * scale;
            const radius = Math.max(13, rock.radius * scale);

            ctx.save();
            ctx.fillStyle = 'rgba(255,255,255,0.42)';
            ctx.beginPath();
            ctx.ellipse(x, y, radius * 1.55, radius * 0.92, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#475569';
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x - radius, y + radius * 0.45);
            ctx.lineTo(x - radius * 0.62, y - radius * 0.66);
            ctx.lineTo(x + radius * 0.18, y - radius);
            ctx.lineTo(x + radius, y - radius * 0.18);
            ctx.lineTo(x + radius * 0.72, y + radius * 0.72);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = 'rgba(226,232,240,0.45)';
            ctx.beginPath();
            ctx.ellipse(x - radius * 0.28, y - radius * 0.42, radius * 0.28, radius * 0.17, -0.4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#fecaca';
            ctx.font = '800 11px Inter';
            ctx.textAlign = 'center';
            ctx.fillText(rock.label, x, y + (labelBelow ? radius + 18 : -radius - 10));
            ctx.restore();
        }

        function drawLevelFourBoulders() {
            if (mission.level !== 4) return;
            const rocks = getLevelFourBoulders();
            // Upper Boulder labels underneath: it now sits close under the swimmer's row, where a
            // label above would land on the distance-to-baby callout.
            drawBoulderWorld(rocks.swimmerRock, true);
            drawBoulderWorld(rocks.babyRock, false);
        }

        function swimmerHitLevelFourBoulder() {
            if (mission.level !== 4 || mission.phase !== 'outbound') return false;
            const rock = getLevelFourBoulders().swimmerRock;
            return Math.hypot(physics.x - rock.x, physics.y - rock.y) <= rock.radius + 1.0;
        }

        function babyHitLevelFourRock() {
            if (mission.level !== 4 || mission.baby.rescued) return false;
            const rock = getLevelFourBoulders().babyRock;
            return Math.hypot(mission.baby.x - rock.x, mission.baby.y - rock.y) <= rock.radius + 0.25;
        }

        function drawFalls(rLeft, rRight) {
            const h = bounds.sim.h;
            const bandTop = h - 30;
            const foam = ctx.createLinearGradient(0, bandTop, 0, h);
            foam.addColorStop(0, 'rgba(255,255,255,0)');
            foam.addColorStop(0.55, 'rgba(255,255,255,0.35)');
            foam.addColorStop(1, 'rgba(255,255,255,0.6)');
            ctx.fillStyle = foam;
            ctx.fillRect(rLeft, bandTop, rRight - rLeft, 30);
            ctx.fillStyle = 'rgba(255,255,255,0.55)';
            for (let x = rLeft + 6; x < rRight - 6; x += 18) {
                const bob = Math.sin(ambientTime * 5 + x * 0.3) * 2;
                ctx.beginPath();
                ctx.arc(x, h - 9 + bob, 5, 0, Math.PI * 2);
                ctx.fill();
            }
            drawVectorLabel('WATERFALL!', rLeft + (rRight - rLeft) * 0.7, bandTop - 12, '#fecaca', 'center', 12);
        }

        function drawDock(sx, sy) {
            const x0 = sx - 36, y0 = sy - 15, dw = 50, dh = 30;
            ctx.save();
            ctx.fillStyle = '#92400e';
            ctx.fillRect(x0, y0, dw, dh);
            ctx.strokeStyle = '#713f12';
            ctx.lineWidth = 2;
            for (let i = 1; i < 5; i++) {
                ctx.beginPath();
                ctx.moveTo(x0 + i * dw / 5, y0);
                ctx.lineTo(x0 + i * dw / 5, y0 + dh);
                ctx.stroke();
            }
            ctx.strokeRect(x0, y0, dw, dh);
            ctx.fillStyle = '#78350f';
            for (const [px, py] of [[x0 + 4, y0 + 4], [x0 + dw - 4, y0 + 4], [x0 + 4, y0 + dh - 4], [x0 + dw - 4, y0 + dh - 4]]) {
                ctx.beginPath(); ctx.arc(px, py, 3.4, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
        }

        function drawSwimmerGraphic(ctx, r) {
            ctx.save();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // Use ambient time so the swimmer still fidgets before START is pressed.
            const phase = ambientTime * (isPlaying ? 7.4 : 1.6);
            const bob = Math.sin(phase * 2) * r * (isPlaying ? 0.055 : 0.025);
            ctx.translate(0, bob);
            ctx.rotate(Math.sin(phase) * (isPlaying ? 0.045 : 0.018));

            const skin = '#f9a8a8';
            const skinOutline = '#7f1d1d';
            const suit = '#f97316';
            const suitDark = '#9a3412';
            const cap = '#fde047';
            const goggles = '#38bdf8';
            const flipper = '#facc15';
            const outline = '#082f49';

            const pointFrom = (p, angle, length) => ({
                x: p.x + Math.cos(angle) * length,
                y: p.y + Math.sin(angle) * length
            });

            const drawJoint = (p, radius, fill = skin) => {
                ctx.fillStyle = fill;
                ctx.strokeStyle = skinOutline;
                ctx.lineWidth = Math.max(1.2, r * 0.035);
                ctx.beginPath();
                ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            };

            const drawBentLimb = (a, b, c, width) => {
                // Dark outline keeps the limbs readable against the water.
                ctx.strokeStyle = skinOutline;
                ctx.lineWidth = width + r * 0.08;
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.lineTo(c.x, c.y);
                ctx.stroke();

                ctx.strokeStyle = skin;
                ctx.lineWidth = width;
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.lineTo(c.x, c.y);
                ctx.stroke();
            };

            // Cartoon wake behind the swimmer.
            if (isPlaying) {
                const wakePulse = 0.7 + Math.sin(phase * 1.7) * 0.18;
                ctx.strokeStyle = `rgba(255,255,255,${wakePulse})`;
                ctx.lineWidth = Math.max(1.6, r * 0.065);
                for (let i = 0; i < 3; i++) {
                    const yy = (i - 1) * r * 0.42;
                    ctx.beginPath();
                    ctx.moveTo(-r * 0.78, yy);
                    ctx.bezierCurveTo(-r * 1.15, yy - r * 0.16, -r * 1.45, yy + r * 0.16, -r * 1.9, yy);
                    ctx.stroke();
                }
            }

            // Legs: keep them stretched straight back with playful swim fins.
            const drawLeg = (side, offset) => {
                const p = phase * 1.35 + offset;
                const kick = Math.sin(p);
                const hip = { x: -r * 0.48, y: side * r * 0.18 };
                const legAngle = Math.PI + side * (0.04 + kick * 0.18);
                const knee = pointFrom(hip, legAngle, r * 0.52);
                const ankle = pointFrom(knee, legAngle, r * 0.56);

                drawBentLimb(hip, knee, ankle, r * 0.17);

                // Big flippers at the end of each straight leg.
                ctx.save();
                ctx.translate(ankle.x, ankle.y);
                ctx.rotate(legAngle);
                ctx.fillStyle = flipper;
                ctx.strokeStyle = '#a16207';
                ctx.lineWidth = r * 0.05;
                ctx.beginPath();
                ctx.moveTo(r * 0.02, -r * 0.10);
                ctx.lineTo(-r * 0.14, -r * 0.15);
                ctx.lineTo(-r * 0.54, -r * 0.25);
                ctx.quadraticCurveTo(-r * 0.74, 0, -r * 0.54, r * 0.25);
                ctx.lineTo(-r * 0.14, r * 0.15);
                ctx.lineTo(r * 0.02, r * 0.10);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // A couple grooves on the flipper.
                ctx.strokeStyle = 'rgba(146, 64, 14, 0.65)';
                ctx.lineWidth = r * 0.028;
                for (let i = 0; i < 2; i++) {
                    const yy = (i === 0 ? -1 : 1) * r * 0.07;
                    ctx.beginPath();
                    ctx.moveTo(-r * 0.08, yy);
                    ctx.lineTo(-r * 0.46, yy * 1.15);
                    ctx.stroke();
                }
                ctx.restore();

                if (isPlaying && Math.abs(kick) > 0.6) {
                    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
                    ctx.lineWidth = Math.max(1.3, r * 0.045);
                    for (let i = 0; i < 3; i++) {
                        ctx.beginPath();
                        ctx.arc(ankle.x - r * (0.28 + i * 0.13), ankle.y + side * (kick * r * 0.05 + i * r * 0.03), r * (0.10 + i * 0.05), -0.9, 0.9);
                        ctx.stroke();
                    }
                }
            };

            drawLeg(-1, 0);
            drawLeg(1, Math.PI);

            // Arms: wide freestyle stroke with a clearly bending elbow.
            const drawArm = (side, offset) => {
                const p = phase + offset;
                const cycle = 0.5 + 0.5 * Math.sin(p);
                const elbowFold = 0.5 + 0.5 * Math.cos(p);
                const shoulder = { x: r * 0.02, y: side * r * 0.31 };
                const upperAngle = side * (0.22 + cycle * 2.15);
                const elbow = pointFrom(shoulder, upperAngle, r * 0.72);
                const foreAngle = upperAngle - side * (0.20 + elbowFold * 1.22);
                const hand = pointFrom(elbow, foreAngle, r * 0.66);

                drawBentLimb(shoulder, elbow, hand, r * 0.17);
                drawJoint(elbow, r * 0.11);

                ctx.save();
                ctx.translate(hand.x, hand.y);
                ctx.rotate(foreAngle);
                ctx.fillStyle = skin;
                ctx.strokeStyle = skinOutline;
                ctx.lineWidth = r * 0.04;
                ctx.beginPath();
                ctx.ellipse(0, 0, r * 0.15, r * 0.09, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.restore();

                // Splash when the hand swings through the water.
                if (isPlaying && cycle > 0.82) {
                    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
                    ctx.lineWidth = Math.max(1.5, r * 0.055);
                    for (let i = 0; i < 4; i++) {
                        const a = side * (0.45 + i * 0.22);
                        ctx.beginPath();
                        ctx.moveTo(hand.x, hand.y);
                        ctx.lineTo(hand.x + Math.cos(a) * r * (0.22 + i * 0.06), hand.y + Math.sin(a) * r * (0.22 + i * 0.06));
                        ctx.stroke();
                    }
                }
            };

            drawArm(-1, 0);
            drawArm(1, Math.PI);

            // Body shadow.
            ctx.fillStyle = 'rgba(2, 6, 23, 0.25)';
            ctx.beginPath();
            ctx.ellipse(-r * 0.10, r * 0.09, r * 0.67, r * 0.43, 0, 0, Math.PI * 2);
            ctx.fill();

            // Bright rescue suit/body.
            ctx.fillStyle = suit;
            ctx.strokeStyle = suitDark;
            ctx.lineWidth = r * 0.09;
            ctx.beginPath();
            ctx.ellipse(-r * 0.12, 0, r * 0.65, r * 0.40, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Teal racing stripe and tiny rescue badge.
            ctx.fillStyle = '#06b6d4';
            ctx.beginPath();
            ctx.ellipse(-r * 0.18, 0, r * 0.20, r * 0.37, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-r * 0.16, 0, r * 0.11, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(-r * 0.20, -r * 0.075, r * 0.08, r * 0.15);
            ctx.fillRect(-r * 0.235, -r * 0.04, r * 0.15, r * 0.08);

            // Neck.
            ctx.fillStyle = skin;
            ctx.strokeStyle = skinOutline;
            ctx.lineWidth = r * 0.05;
            ctx.beginPath();
            ctx.ellipse(r * 0.40, 0, r * 0.22, r * 0.19, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Big cartoon head.
            const headX = r * 0.62;
            const headTurn = Math.sin(phase * 0.5) * r * 0.035;
            ctx.fillStyle = skin;
            ctx.strokeStyle = skinOutline;
            ctx.lineWidth = r * 0.065;
            ctx.beginPath();
            ctx.arc(headX, headTurn, r * 0.34, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Yellow swim cap.
            ctx.fillStyle = cap;
            ctx.strokeStyle = '#a16207';
            ctx.lineWidth = r * 0.045;
            ctx.beginPath();
            ctx.arc(headX - r * 0.05, headTurn, r * 0.31, Math.PI * 0.60, Math.PI * 1.40);
            ctx.quadraticCurveTo(headX - r * 0.10, headTurn - r * 0.31, headX + r * 0.13, headTurn - r * 0.28);
            ctx.fill();
            ctx.stroke();

            // Comically large goggles.
            const eyeY = r * 0.115;
            for (const side of [-1, 1]) {
                ctx.fillStyle = goggles;
                ctx.strokeStyle = outline;
                ctx.lineWidth = r * 0.055;
                ctx.beginPath();
                ctx.ellipse(headX + r * 0.16, headTurn + side * eyeY, r * 0.16, r * 0.125, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(headX + r * 0.20, headTurn + side * eyeY, r * 0.055, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.arc(headX + r * 0.22, headTurn + side * eyeY, r * 0.027, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.strokeStyle = outline;
            ctx.lineWidth = r * 0.045;
            ctx.beginPath();
            ctx.moveTo(headX + r * 0.12, headTurn - r * 0.02);
            ctx.lineTo(headX + r * 0.12, headTurn + r * 0.02);
            ctx.stroke();

            // Grinning mouth.
            ctx.strokeStyle = '#7f1d1d';
            ctx.lineWidth = r * 0.055;
            ctx.beginPath();
            ctx.arc(headX + r * 0.17, headTurn, r * 0.15, -0.62, 0.62);
            ctx.stroke();

            // Silly snorkel that bobs with the head.
            ctx.strokeStyle = '#fb7185';
            ctx.lineWidth = r * 0.085;
            ctx.beginPath();
            ctx.moveTo(headX + r * 0.06, headTurn - r * 0.24);
            ctx.lineTo(headX + r * 0.20, headTurn - r * 0.48);
            ctx.lineTo(headX + r * 0.35, headTurn - r * 0.48);
            ctx.stroke();
            ctx.strokeStyle = '#881337';
            ctx.lineWidth = r * 0.025;
            ctx.stroke();

            // A few bubbles from the snorkel while swimming.
            if (isPlaying) {
                for (let i = 0; i < 3; i++) {
                    const bubblePhase = (ambientTime * 1.8 + i * 0.34) % 1;
                    const bx = headX + r * (0.40 + bubblePhase * 0.45);
                    const by = headTurn - r * (0.46 + i * 0.10 + bubblePhase * 0.28);
                    ctx.strokeStyle = `rgba(255,255,255,${(1 - bubblePhase) * 0.8})`;
                    ctx.lineWidth = Math.max(1, r * 0.03);
                    ctx.beginPath();
                    ctx.arc(bx, by, r * (0.045 + bubblePhase * 0.05), 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            ctx.restore();
        }

        function drawBabyGraphic(ctx, r) {
            // Inflatable swim ring under the baby
            ctx.save();
            ctx.beginPath();
            ctx.arc(0, r * 0.12, r * 1.05, 0, Math.PI * 2);
            ctx.arc(0, r * 0.12, r * 0.52, 0, Math.PI * 2, true);
            ctx.fillStyle = '#f472b6';
            ctx.fill();
            ctx.strokeStyle = '#be185d';
            ctx.lineWidth = r * 0.06;
            ctx.beginPath(); ctx.arc(0, r * 0.12, r * 1.05, 0, Math.PI * 2); ctx.stroke();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = r * 0.5;
            for (let i = 0; i < 4; i++) {
                const a0 = i * Math.PI / 2 + 0.28;
                ctx.beginPath();
                ctx.arc(0, r * 0.12, r * 0.78, a0, a0 + 0.5);
                ctx.stroke();
            }
            ctx.restore();

            // Arms and legs
            ctx.strokeStyle = '#fca5a5';
            ctx.lineWidth = r * 0.3;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(-r * 0.35, -r * 0.1); ctx.lineTo(-r * 0.8, -r * 0.5);
            ctx.moveTo(r * 0.35, -r * 0.1); ctx.lineTo(r * 0.8, -r * 0.5);
            ctx.moveTo(-r * 0.2, r * 0.3); ctx.lineTo(-r * 0.6, r * 0.8);
            ctx.moveTo(r * 0.2, r * 0.3); ctx.lineTo(r * 0.6, r * 0.8);
            ctx.stroke();

            // Head
            ctx.fillStyle = '#fca5a5';
            ctx.beginPath(); ctx.arc(0, -r * 0.5, r * 0.45, 0, Math.PI * 2); ctx.fill();

            // Eyes
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(-r * 0.16, -r * 0.58, r * 0.12, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(r * 0.16, -r * 0.58, r * 0.12, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#1e293b';
            ctx.beginPath(); ctx.arc(-r * 0.16, -r * 0.58, r * 0.07, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(r * 0.16, -r * 0.58, r * 0.07, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(-r * 0.18, -r * 0.60, r * 0.025, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(r * 0.14, -r * 0.60, r * 0.025, 0, Math.PI * 2); ctx.fill();

            // Rosy cheeks
            ctx.fillStyle = 'rgba(239, 68, 68, 0.25)';
            ctx.beginPath(); ctx.arc(-r * 0.26, -r * 0.45, r * 0.08, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(r * 0.26, -r * 0.45, r * 0.08, 0, Math.PI * 2); ctx.fill();

            // Smile
            ctx.strokeStyle = '#7f1d1d';
            ctx.lineWidth = r * 0.06;
            ctx.lineCap = 'round';
            ctx.beginPath(); ctx.arc(0, -r * 0.46, r * 0.18, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();

            // Diaper
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = r * 0.1;
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(-r * 0.5, 0);
            ctx.lineTo(r * 0.5, 0);
            ctx.lineTo(r * 0.25, r * 0.5);
            ctx.lineTo(-r * 0.25, r * 0.5);
            ctx.closePath();
            ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#93c5fd';
            ctx.fillRect(-r * 0.4, 0, r * 0.15, r * 0.15);
            ctx.fillRect(r * 0.25, 0, r * 0.15, r * 0.15);
        }

        function drawLevelOneRapids() {
            if (mission.level !== 1 || !rapidImage.complete) return;

            const targetX = originX + mission.baby.x * scale;
            const targetY = originY + mission.baby.y * scale;

            // Larger rapid graphics and four total: two above and two below the finish ring.
            const rapidW = Math.max(132, Math.min(188, scale * 15));
            const rapidH = rapidW * (120 / 220);
            const baseX = targetX - rapidW - Math.max(16, scale * 1.35);
            const xGap = Math.max(24, rapidW * 0.56);
            const verticalGap = Math.max(60, rapidH * 0.82);
