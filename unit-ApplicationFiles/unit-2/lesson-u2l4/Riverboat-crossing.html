<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Relative Motion: Canvas Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #020617; /* slate-950 */
            color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        .heading-input {
            position: absolute;
            left: -9999px;
            top: -9999px;
            z-index: 3;
            width: 86px;
            height: 34px;
            padding: 0 10px;
            border: 1px solid #334155;
            border-radius: 6px;
            background: #020617;
            color: #7dd3fc;
            font: 600 14px monospace;
            text-align: right;
            outline: none;
            user-select: text;
            -webkit-user-select: text;
        }
        .heading-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }
        .heading-input:disabled {
            color: #64748b;
            opacity: 0.6;
            cursor: not-allowed;
        }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <input id="headingInput" class="heading-input" type="number" min="-85" max="85" step="1" value="0" aria-label="Swim Heading angle in degrees">

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const headingInput = document.getElementById('headingInput');

        // Input state
        const input = { x: 0, y: 0, isDown: false, justPressed: false, justReleased: false, wasDown: false };
        const headingArrow = { isDragging: false };

        // Layout bounds
        const bounds = {
            sim: { x: 0, y: 0, w: 0, h: 0 },
            header: { x: 0, y: 0, w: 0, h: 0 },
            controls: { x: 0, y: 0, w: 0, h: 0 },
            actions: { x: 0, y: 0, w: 0, h: 0 },
            isMobile: false
        };

        // Game State
        let uiElements = [];
        let isPlaying = false;
        let lastTime = 0;
        let showTelemetry = false;
        let vectorMode = 0;
        const vectorModeNames = ['No Hint', 'Full Vector Addition', 'Resultant Components', 'Drift Decomposition'];
        const urlParams = new URLSearchParams(window.location.search);
        const requestedLevel = Number(urlParams.get('level'));
        const initialLevel = [1, 2, 3].includes(requestedLevel) ? requestedLevel : 1;
        const lockedLevel = urlParams.get('lockLevel') === '1' ? initialLevel : 0;
        
        let scale = 10, originX = 0, originY = 0, waterParticles = [];

        const params = {
            vBoat: 5, angleDeg: 0, vRiver: 3, width: 50,
            vResultantX: 0, vResultantY: 0, vResultantMag: 0, effectiveBoatSpeed: 5, angleRad: 0
        };

        const physics = { time: 0, x: 0, y: 0, trail: [] };

        const mission = {
            level: initialLevel, phase: 'setup', message: '', hits: 0, stars: 0,
            staminaMax: 0, staminaLeft: 0,
            startZone: { x: 0, y: 0, radius: 5.5 },
            baby: { x: 0, y: 0, radius: 4.5, rescued: false },
            obstacles: []
        };

        class Button {
            constructor(id, text, onClick) {
                this.id = id; this.text = text; this.onClick = onClick;
                this.x = 0; this.y = 0; this.w = 0; this.h = 0;
                this.isHovered = false; this.isActive = false; this.disabled = false;
                this.bgColor = '#1e293b'; this.hoverColor = '#334155'; this.textColor = '#f8fafc';
                this.activeBgColor = '#0ea5e9'; this.activeTextColor = '#ffffff';
                this.fontSize = 14;
            }
            setBounds(x, y, w, h) { this.x = x; this.y = y; this.w = w; this.h = h; }
            update() {
                if (this.disabled) { this.isHovered = false; return; }
                this.isHovered = input.x >= this.x && input.x <= this.x + this.w && input.y >= this.y && input.y <= this.y + this.h;
                if (this.isHovered && input.justReleased) this.onClick();
            }
            draw(ctx) {
                ctx.fillStyle = this.disabled ? '#334155' : this.isActive ? this.activeBgColor : this.isHovered ? this.hoverColor : this.bgColor;
                if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(this.x, this.y, this.w, this.h, 6); ctx.fill(); } 
                else { ctx.fillRect(this.x, this.y, this.w, this.h); }
                ctx.fillStyle = this.disabled ? '#64748b' : this.isActive ? this.activeTextColor : this.textColor;
                ctx.font = `600 ${this.fontSize}px Inter`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(this.text, this.x + this.w / 2, this.y + this.h / 2);
            }
        }

        class HeadingInputControl {
            constructor(id) {
                this.id = id; this.x = 0; this.y = 0; this.w = 0; this.h = 42; this.disabled = false;
                this.inputRect = { x: 0, y: 0, w: 86, h: 34 };
            }
            setBounds(x, y, w, h = 42) {
                this.x = x; this.y = y; this.w = w; this.h = h;
                const inputW = Math.min(92, Math.max(76, w * 0.32));
                this.inputRect = { x: x + w - inputW - 28, y: y + 4, w: inputW, h: 34 };
                positionHeadingInput(this.inputRect);
            }
            setDisabled(disabled) {
                this.disabled = disabled;
                headingInput.disabled = disabled;
            }
            update() {}
            draw(ctx) {
                ctx.fillStyle = this.disabled ? '#64748b' : '#cbd5e1';
                ctx.font = '600 13px Inter';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText('Swim Heading', this.x, this.y + this.h / 2);

                ctx.fillStyle = this.disabled ? '#64748b' : '#7dd3fc';
                ctx.font = '600 13px monospace';
                ctx.textAlign = 'left';
                ctx.fillText('deg', this.inputRect.x + this.inputRect.w + 8, this.y + this.h / 2);
            }
        }

        class SpeedReadout {
            constructor(id) {
                this.id = id; this.x = 0; this.y = 0; this.w = 0; this.h = 0;
            }
            setBounds(x, y, w, h = 48) { this.x = x; this.y = y; this.w = w; this.h = h; }
            update() {}
            draw(ctx) {
                ctx.fillStyle = '#cbd5e1'; ctx.font = '500 12px Inter'; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
                ctx.fillText('Fixed Speeds', this.x, this.y + 12);

                const rowY = this.y + 32;
                ctx.fillStyle = '#94a3b8'; ctx.font = '500 12px Inter'; ctx.textBaseline = 'middle';
                ctx.fillText('Swimmer', this.x, rowY);
                ctx.fillText('Current', this.x + this.w * 0.5, rowY);

                ctx.fillStyle = '#7dd3fc'; ctx.font = '600 13px monospace'; ctx.textAlign = 'right';
                ctx.fillText(params.vBoat.toFixed(1) + ' m/s', this.x + this.w * 0.42, rowY);
                ctx.fillText(params.vRiver.toFixed(1) + ' m/s', this.x + this.w, rowY);

                ctx.strokeStyle = '#334155'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(this.x, this.y + this.h - 6); ctx.lineTo(this.x + this.w, this.y + this.h - 6); ctx.stroke();
            }
        }

        const genRockShape = (baseRadius) => {
            const pts = []; const sides = 6 + Math.floor(Math.random() * 4);
            for (let i = 0; i < sides; i++) pts.push({ a: (i / sides) * Math.PI * 2, r: baseRadius * (0.6 + Math.random() * 0.5) });
            return pts;
        };

        const makeRapid = (x, y, radius, rotation, rockDist = 5.0) => ({
            type: 'rapid', x, y, radius, rotation, hit: false, isMoving: false, rockDist,
            rock1Shape: genRockShape(4.0), rock2Shape: genRockShape(4.0)
        });

        const lowerLaneY = p => p.width * 0.55;
        const BABY_DRAW_SCALE = 0.5;
        const VELOCITY_VECTOR_SCALE = 26;

        function drawVectorArrow(fx, fy, tx, ty, color, width = 3, headLen = 10) {
            const dx = tx - fx, dy = ty - fy;
            if (Math.abs(dx) < 0.1 && Math.abs(dy) < 0.1) return;
            const angle = Math.atan2(dy, dx);
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(fx, fy);
            ctx.lineTo(tx, ty);
            ctx.lineTo(tx - headLen * Math.cos(angle - Math.PI/6), ty - headLen * Math.sin(angle - Math.PI/6));
            ctx.moveTo(tx, ty);
            ctx.lineTo(tx - headLen * Math.cos(angle + Math.PI/6), ty - headLen * Math.sin(angle + Math.PI/6));
            ctx.stroke();
            ctx.restore();
        }

        function drawVectorLabel(text, x, y, color, align = 'left') {
            ctx.save();
            ctx.font = '800 14px Inter';
            ctx.textAlign = align;
            ctx.textBaseline = 'middle';
            ctx.lineWidth = 5;
            ctx.strokeStyle = 'rgba(2, 6, 23, 0.85)';
            ctx.strokeText(text, x, y);
            ctx.fillStyle = color;
            ctx.fillText(text, x, y);
            ctx.restore();
        }

        const LEVEL_CONFIGS = {
            1: {
                title: 'Level 1: Dangerous Rapids',
                swimSpeed: 5,
                currentSpeed: 3,
                start: p => ({ x: 0, y: lowerLaneY(p), radius: 5.5 }),
                target: p => ({ x: p.width, y: lowerLaneY(p), radius: 5.5 }),
                startMsg: 'Reach the finish ring. Aim upstream to offset the current and avoid the rapids around the finish.',
                successMsg: s => `Level 1 clear. Rapids avoided with ${s.toFixed(0)}m stamina left.`,
                obstacles: p => {
                    const finishY = lowerLaneY(p);
                    return [
                        makeRapid(p.width * 0.74, finishY - 12, 7.0, -0.35),
                        makeRapid(p.width * 0.91, finishY - 21, 7.0, 0.25),
                        makeRapid(p.width * 0.74, finishY + 12, 7.0, 0.35),
                        makeRapid(p.width * 0.91, finishY + 21, 7.0, -0.25)
                    ];
                }
            },
            2: {
                title: 'Level 2: Floating Logs',
                swimSpeed: 5,
                currentSpeed: 3,
                start: p => ({ x: 0, y: lowerLaneY(p), radius: 5.5 }),
                target: p => ({ x: p.width, y: lowerLaneY(p), radius: 5.5 }),
                startMsg: 'Get across the river to the finish ring without hitting the floating logs.',
                successMsg: s => `Level 2 clear. Crossed without hitting the logs. ${s.toFixed(0)}m stamina left.`,
                obstacles: p => [
                    { type: 'log', x: p.width * 0.42, y: lowerLaneY(p) - 15.5, radius: 7.4, rotation: 0.45, hit: false, isMoving: true },
                    { type: 'log', x: p.width * 0.72, y: lowerLaneY(p) - 26.5, radius: 7.0, rotation: -0.25, hit: false, isMoving: true }
                ]
            },
            3: {
                title: 'Level 3: Catch the Baby',
                swimSpeed: 5,
                currentSpeed: 3,
                start: p => ({ x: 0, y: lowerLaneY(p), radius: 5.5 }),
                target: p => ({ x: p.width * 0.65, y: lowerLaneY(p) - 28, radius: 4.5 }),
                startMsg: 'The baby is floating down the river! Intercept the baby before they wash away.',
                successMsg: s => `Amazing intercept! Baby caught with ${s.toFixed(0)}m stamina left.`,
                obstacles: p => [
                    { type: 'log', x: p.width * 0.5, y: lowerLaneY(p) - 52, radius: 5.5, rotation: 1.2, hit: false, isMoving: true }
                ]
            }
        };

        let btnPlay, btnReset, btnData, headingControl;

        function buildUI() {
            uiElements = [
                headingControl = new HeadingInputControl('heading'),
                btnPlay = new Button('play', 'START SWIM', togglePlayPause),
                btnReset = new Button('reset', 'RESET', resetSimulation),
                btnData = new Button('data', 'DATA', () => { showTelemetry = !showTelemetry; btnData.isActive = showTelemetry; })
            ];
            btnPlay.bgColor = '#0284c7'; btnPlay.hoverColor = '#0369a1';
            btnReset.bgColor = '#334155'; btnReset.hoverColor = '#475569';
            btnData.bgColor = '#0f172a'; btnData.hoverColor = '#1e293b'; btnData.activeBgColor = '#0ea5e9';
        }

        function layout() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
            const w = window.innerWidth;
            const h = window.innerHeight;

            bounds.isMobile = w < 768;
            bounds.sim = { x: 0, y: 0, w, h };

            const pad = 18;
            const headerW = Math.min(w - pad * 2, bounds.isMobile ? 420 : 600);
            bounds.header = { x: pad, y: pad, w: headerW, h: 96 };

            const headingW = Math.min(w - pad * 2, 312);
            const headingY = bounds.header.y + bounds.header.h + 12;
            bounds.controls = { x: pad, y: headingY, w: headingW, h: 58 };
            headingControl.setBounds(bounds.controls.x + 14, bounds.controls.y + 8, bounds.controls.w - 28, 42);

            const actionY = Math.max(12, h - 62);
            const availableActionW = Math.max(260, w - pad * 2);
            const resetW = bounds.isMobile ? 76 : 94;
            const dataW = bounds.isMobile ? 68 : 84;
            const playW = Math.max(106, Math.min(bounds.isMobile ? 138 : 158, availableActionW - resetW - dataW - 20));
            bounds.actions = { x: pad, y: actionY, w: playW + resetW + dataW + 20, h: 44 };
            btnPlay.setBounds(bounds.actions.x, actionY, playW, 44);
            btnReset.setBounds(bounds.actions.x + playW + 10, actionY, resetW, 44);
            btnData.setBounds(bounds.actions.x + playW + resetW + 20, actionY, dataW, 44);

            scale = (bounds.sim.w * 0.5) / params.width;
            originX = bounds.sim.x + bounds.sim.w * 0.15;
            originY = bounds.sim.y + bounds.sim.h * 0.2;

            waterParticles = [];
            for (let i = 0; i < 100; i++) {
                waterParticles.push({ x: Math.random(), y: bounds.sim.y - 100 + Math.random() * (bounds.sim.h + 200), length: 5 + Math.random() * 20, speed: 0.7 + Math.random() * 0.6 });
            }
        }

        function setLevel(lvl) {
            if (!LEVEL_CONFIGS[lvl]) return;
            if (lockedLevel && lvl !== lockedLevel) return;
            mission.level = lvl; resetSimulation();
        }
        
        function recalculatePhysics() {
            params.angleRad = params.angleDeg * (Math.PI / 180);
            params.effectiveBoatSpeed = params.vBoat;
            params.vResultantX = params.effectiveBoatSpeed * Math.cos(params.angleRad);
            params.vResultantY = params.effectiveBoatSpeed * Math.sin(params.angleRad) + params.vRiver;
            params.vResultantMag = Math.hypot(params.vResultantX, params.vResultantY);
        }

        function clampHeading(angleDeg) {
            return Math.max(-85, Math.min(85, angleDeg));
        }

        function formatHeading(angleDeg) {
            return Number.isInteger(angleDeg) ? angleDeg.toFixed(0) : angleDeg.toFixed(1);
        }

        function positionHeadingInput(rect) {
            headingInput.style.left = rect.x + 'px';
            headingInput.style.top = rect.y + 'px';
            headingInput.style.width = rect.w + 'px';
            headingInput.style.height = rect.h + 'px';
        }

        function syncHeadingInput() {
            headingInput.value = formatHeading(params.angleDeg);
        }

        function setHeadingAngle(angleDeg, shouldSyncInput = true) {
            if (!Number.isFinite(angleDeg)) return;
            params.angleDeg = Math.round(clampHeading(angleDeg) * 10) / 10;
            recalculatePhysics();
            if (shouldSyncInput) syncHeadingInput();
        }

        function resetSimulation() {
            const config = LEVEL_CONFIGS[mission.level];
            params.vBoat = config.swimSpeed;
            params.vRiver = config.currentSpeed;
            const start = config.start ? config.start(params) : { x: 0, y: 0, radius: 5.5 };

            isPlaying = false;
            physics.time = 0; physics.x = start.x; physics.y = start.y; physics.trail = [];
            mission.phase = 'setup'; mission.message = config.startMsg; mission.hits = 0; mission.stars = 0;
            mission.startZone = { x: start.x, y: start.y, radius: start.radius || 5.5 };

            const target = config.target ? config.target(params) : { x: params.width, y: lowerLaneY(params), radius: 5.5 };
            let tX = target.x, tY = target.y, tR = target.radius;
            
            mission.baby = { x: tX, y: tY, radius: tR, rescued: false };
            mission.obstacles = config.obstacles(params);
            mission.staminaMax = Math.round(params.width * (mission.level === 3 ? 3.0 : 2.5) + 40);
            mission.staminaLeft = mission.staminaMax;

            recalculatePhysics(); syncHeadingInput(); updateUIState();
        }

        function togglePlayPause() {
            if (mission.phase === 'success' || mission.phase === 'fail') { resetSimulation(); return; }
            if (mission.phase === 'setup') {
                mission.phase = 'outbound'; isPlaying = true;
            } else { isPlaying = !isPlaying; }
            if (isPlaying) lastTime = performance.now();
            updateUIState();
        }

        function updateUIState() {
            const activeSwim = isPlaying || mission.phase === 'success' || mission.phase === 'fail';
            headingControl.setDisabled(activeSwim);

            if (mission.phase === 'success' || mission.phase === 'fail') {
                btnPlay.text = 'PLAY AGAIN'; btnPlay.bgColor = mission.phase === 'success' ? '#059669' : '#b91c1c';
            } else if (isPlaying) { btnPlay.text = 'PAUSE'; btnPlay.bgColor = '#d97706'; } 
            else if (physics.time > 0) { btnPlay.text = 'RESUME'; btnPlay.bgColor = '#0284c7'; } 
            else { btnPlay.text = 'START SWIM'; btnPlay.bgColor = '#0284c7'; }
            btnData.isActive = showTelemetry;
        }

        function checkCollisions() {
            for (let obs of mission.obstacles) {
                if (!obs.hit && Math.hypot(physics.x - obs.x, physics.y - obs.y) <= obs.radius + 1.5) {
                    obs.hit = true; mission.hits++;
                    return failMission(obs.type === 'log' ? 'Hit a floating log! Try a safer heading.' : 'Hit the rapids! Try a safer heading.');
                }
            }
            return false;
        }

        function failMission(msg) { isPlaying = false; mission.phase = 'fail'; mission.message = msg; updateUIState(); return true; }
        function succeedMission(msg) { isPlaying = false; mission.phase = 'success'; mission.message = msg; mission.stars = 1 + (mission.hits===0?1:0) + (mission.staminaLeft>mission.staminaMax*0.3?1:0); updateUIState(); }

        function updatePhysics(dt) {
            if (!isPlaying) return;
            physics.time += dt;
            const dx = params.vResultantX * dt; const dy = params.vResultantY * dt;
            physics.x += dx; physics.y += dy;
            mission.staminaLeft -= Math.hypot(dx, dy);

            if (mission.staminaLeft <= 0) return failMission('Out of stamina! You drifted away.');
            if (physics.trail.length === 0 || Math.hypot(physics.x - physics.trail[physics.trail.length-1].x, physics.y - physics.trail[physics.trail.length-1].y) > 1) {
                physics.trail.push({x: physics.x, y: physics.y});
            }

            mission.obstacles.forEach(obs => {
                if (obs.isMoving) {
                    obs.y += params.vRiver * dt; obs.rotation += 0.8 * dt;
                    if (obs.y > (bounds.sim.h - originY) / scale + 15) { obs.y = (0 - originY) / scale - 15; obs.hit = false; }
                }
            });

            if (mission.level === 3 && !mission.baby.rescued) {
                mission.baby.y += params.vRiver * dt;
                if (mission.baby.y > (bounds.sim.h - originY) / scale + 5) return failMission('The baby drifted too far downstream!');
            }

            if (checkCollisions()) return;

            if (!mission.baby.rescued) {
                if (Math.hypot(physics.x - mission.baby.x, physics.y - mission.baby.y) <= mission.baby.radius) {
                    mission.baby.rescued = true;
                    succeedMission(LEVEL_CONFIGS[mission.level].successMsg(mission.staminaLeft));
                } else if (physics.x > params.width + 10) {
                    failMission(mission.level === 3 ? 'Missed the baby! Swam past the intercept point.' : 'Missed the target! Swam past the far bank.');
                }
            }
        }

        function drawLevelHeader() {
            const header = bounds.header;
            ctx.save();
            ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
            ctx.strokeStyle = 'rgba(125, 211, 252, 0.4)';
            ctx.lineWidth = 1;
            if (ctx.roundRect) {
                ctx.beginPath();
                ctx.roundRect(header.x, header.y, header.w, header.h, 8);
                ctx.fill();
                ctx.stroke();
            } else {
                ctx.fillRect(header.x, header.y, header.w, header.h);
                ctx.strokeRect(header.x, header.y, header.w, header.h);
            }

            const padX = header.x + 16;
            const cy = header.y + 24;
            ctx.fillStyle = '#67e8f9';
            ctx.font = '800 19px Inter';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(LEVEL_CONFIGS[mission.level].title, padX, cy);

            drawSpeedChip('Swim', params.vBoat.toFixed(1) + ' m/s', padX, cy + 26, '#fed7aa');
            drawSpeedChip('Current', params.vRiver.toFixed(1) + ' m/s', padX + 130, cy + 26, '#bae6fd');

            ctx.fillStyle = '#94a3b8';
            ctx.font = '500 12px Inter';
            wrapCanvasText(mission.message, padX, cy + 51, header.w - 32, 15, 2);
            ctx.restore();
        }

        function drawCanvasControls() {
            const panel = bounds.controls;
            ctx.save();
            ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
            ctx.strokeStyle = 'rgba(125, 211, 252, 0.4)';
            ctx.lineWidth = 1;
            if (ctx.roundRect) {
                ctx.beginPath();
                ctx.roundRect(panel.x, panel.y, panel.w, panel.h, 8);
                ctx.fill();
                ctx.stroke();
            } else {
                ctx.fillRect(panel.x, panel.y, panel.w, panel.h);
                ctx.strokeRect(panel.x, panel.y, panel.w, panel.h);
            }
            ctx.restore();
            uiElements.forEach(el => el.draw(ctx));
        }

        function drawSpeedChip(label, value, x, y, color) {
            ctx.fillStyle = 'rgba(2, 6, 23, 0.58)';
            if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y - 12, 112, 25, 6); ctx.fill(); }
            else { ctx.fillRect(x, y - 12, 112, 25); }
            ctx.fillStyle = '#94a3b8';
            ctx.font = '700 10px Inter';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, x + 8, y);
            ctx.fillStyle = color;
            ctx.font = '800 11px monospace';
            ctx.textAlign = 'right';
            ctx.fillText(value, x + 104, y);
        }

        function wrapCanvasText(text, x, y, maxWidth, lineHeight, maxLines = 3) {
            const words = String(text || '').split(' ');
            let line = '';
            let lineY = y;
            let lines = 0;
            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                if (ctx.measureText(testLine).width > maxWidth && n > 0) {
                    ctx.fillText(line.trim(), x, lineY);
                    lines++;
                    if (lines >= maxLines) return;
                    line = words[n] + ' ';
                    lineY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            if (line && lines < maxLines) ctx.fillText(line.trim(), x, lineY);
        }

        function drawRiverEnv() {
            const rLeft = originX, rRight = originX + params.width * scale;
            const riverW = params.width * scale;

            const waterGradient = ctx.createLinearGradient(0, bounds.sim.y, 0, bounds.sim.y + bounds.sim.h);
            waterGradient.addColorStop(0, '#2563eb');
            waterGradient.addColorStop(0.45, '#1d4ed8');
            waterGradient.addColorStop(1, '#1e40af');
            ctx.fillStyle = waterGradient;
            ctx.fillRect(bounds.sim.x, bounds.sim.y, bounds.sim.w, bounds.sim.h);

            ctx.save();
            ctx.beginPath();
            ctx.rect(rLeft, bounds.sim.y, riverW, bounds.sim.h);
            ctx.clip();

            ctx.strokeStyle = 'rgba(219, 234, 254, 0.16)';
            ctx.lineWidth = 12;
            ctx.lineCap = 'round';
            for (let i = -1; i < 8; i++) {
                const baseY = bounds.sim.y + (i / 6) * bounds.sim.h + Math.sin(physics.time * 0.8 + i) * 9;
                ctx.beginPath();
                ctx.moveTo(rLeft + 12, baseY);
                ctx.bezierCurveTo(
                    rLeft + riverW * 0.28, baseY + 22,
                    rLeft + riverW * 0.66, baseY - 28,
                    rRight - 12, baseY + 12
                );
                ctx.stroke();
            }

            ctx.strokeStyle = 'rgba(191, 219, 254, 0.32)'; ctx.lineWidth = 3; ctx.beginPath();
            const visSpeed = isPlaying ? params.vRiver * 3 : 0;
            waterParticles.forEach(p => {
                if (isPlaying) { p.y += visSpeed * p.speed; if (p.y > bounds.sim.y + bounds.sim.h + 50) { p.y = bounds.sim.y - 50; p.x = Math.random(); } }
                const px = rLeft + p.x * (params.width * scale);
                if (px >= rLeft && px <= rRight) { ctx.moveTo(px, p.y); ctx.lineTo(px, p.y + p.length); }
            });
            ctx.stroke();
            ctx.restore();

            const bankGradient = ctx.createLinearGradient(bounds.sim.x, 0, rLeft, 0);
            bankGradient.addColorStop(0, '#14532d');
            bankGradient.addColorStop(0.65, '#166534');
            bankGradient.addColorStop(1, '#15803d');
            ctx.fillStyle = bankGradient;
            ctx.fillRect(bounds.sim.x, bounds.sim.y, rLeft - bounds.sim.x, bounds.sim.h);

            const farBankGradient = ctx.createLinearGradient(rRight, 0, bounds.sim.x + bounds.sim.w, 0);
            farBankGradient.addColorStop(0, '#15803d');
            farBankGradient.addColorStop(0.35, '#166534');
            farBankGradient.addColorStop(1, '#14532d');
            ctx.fillStyle = farBankGradient;
            ctx.fillRect(rRight, bounds.sim.y, (bounds.sim.x + bounds.sim.w) - rRight, bounds.sim.h);

            ctx.strokeStyle = '#fde68a'; ctx.lineWidth = 6; ctx.beginPath();
            ctx.moveTo(rLeft, bounds.sim.y); ctx.lineTo(rLeft, bounds.sim.y + bounds.sim.h);
            ctx.moveTo(rRight, bounds.sim.y); ctx.lineTo(rRight, bounds.sim.y + bounds.sim.h);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(187, 247, 208, 0.35)';
            ctx.lineWidth = 2;
            for (let y = bounds.sim.y + 18; y < bounds.sim.y + bounds.sim.h; y += 34) {
                ctx.beginPath();
                ctx.moveTo(rLeft - 10, y);
                ctx.lineTo(rLeft - 24, y + 8);
                ctx.moveTo(rRight + 10, y + 12);
                ctx.lineTo(rRight + 25, y + 4);
                ctx.stroke();
            }

            ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.font = '11px monospace'; ctx.textAlign = 'right';
            for (let i = 0; i <= 300; i += 20) {
                let y = originY + i * scale; if (y > bounds.sim.y + bounds.sim.h) break;
                ctx.fillText(i + 'm', rLeft - 8, y + 3); ctx.fillRect(rLeft - 5, y, 5, 1);
            }

            const arrowLen = params.vRiver * VELOCITY_VECTOR_SCALE;
            const arrowX = rLeft + riverW * 0.5;
            const arrowTop = bounds.sim.y + bounds.sim.h * 0.5 - arrowLen * 0.5;
            drawVectorArrow(arrowX, arrowTop, arrowX, arrowTop + arrowLen, '#38bdf8', 8, 20);
            drawVectorLabel('Water velocity = ' + params.vRiver.toFixed(1) + ' m/s', arrowX + 18, arrowTop + arrowLen * 0.5, '#bae6fd');
        }

        function drawSwimmerGraphic(ctx, r) {
            ctx.save();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            const strokePhase = isPlaying ? physics.time * 8.5 : 0;
            const armSwing = Math.sin(strokePhase);
            const legSwing = Math.sin(strokePhase + Math.PI * 0.85);
            const armReach = Math.cos(strokePhase);
            const legKick = Math.cos(strokePhase + Math.PI * 0.85);

            ctx.strokeStyle = 'rgba(255,255,255,0.55)';
            ctx.lineWidth = Math.max(2, r * 0.12);
            ctx.beginPath();
            ctx.moveTo(-r * 0.65, -r * 0.58);
            ctx.quadraticCurveTo(-r * (1.14 + armSwing * 0.08), -r * (0.82 + armReach * 0.1), -r * (1.78 + armReach * 0.12), -r * (0.48 + armSwing * 0.08));
            ctx.moveTo(-r * 0.65, r * 0.58);
            ctx.quadraticCurveTo(-r * (1.14 - armSwing * 0.08), r * (0.82 - armReach * 0.1), -r * (1.78 - armReach * 0.12), r * (0.48 - armSwing * 0.08));
            ctx.stroke();

            ctx.strokeStyle = '#fca5a5';
            ctx.lineWidth = r * 0.18;
            ctx.beginPath();
            ctx.moveTo(-r * 0.2, -r * 0.24);
            ctx.quadraticCurveTo(r * (0.22 + armReach * 0.2), -r * (0.48 + armSwing * 0.14), r * (0.82 + armReach * 0.16), -r * (0.5 - armSwing * 0.16));
            ctx.moveTo(-r * 0.15, r * 0.24);
            ctx.quadraticCurveTo(r * (0.16 - armReach * 0.18), r * (0.5 - armSwing * 0.13), r * (0.68 - armReach * 0.16), r * (0.56 + armSwing * 0.16));
            ctx.moveTo(-r * 0.48, -r * 0.2);
            ctx.quadraticCurveTo(-r * (0.78 + legKick * 0.08), -r * (0.42 + legSwing * 0.16), -r * (1.18 + legKick * 0.18), -r * (0.5 - legSwing * 0.14));
            ctx.moveTo(-r * 0.48, r * 0.2);
            ctx.quadraticCurveTo(-r * (0.78 - legKick * 0.08), r * (0.42 - legSwing * 0.16), -r * (1.18 - legKick * 0.18), r * (0.5 + legSwing * 0.14));
            ctx.stroke();

            ctx.fillStyle = '#22c55e';
            ctx.strokeStyle = '#14532d';
            ctx.lineWidth = r * 0.1;
            ctx.beginPath();
            ctx.ellipse(-r * 0.16, 0, r * 0.58, r * 0.36, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#16a34a';
            ctx.beginPath();
            ctx.ellipse(-r * 0.32, 0, r * 0.16, r * 0.34, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#fca5a5';
            ctx.strokeStyle = '#7f1d1d';
            ctx.lineWidth = r * 0.06;
            ctx.beginPath();
            ctx.arc(r * 0.48, 0, r * 0.28, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(r * 0.58, -r * 0.08, r * 0.035, 0, Math.PI * 2);
            ctx.arc(r * 0.58, r * 0.08, r * 0.035, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawBabyGraphic(ctx, r) {
            // Arms and Legs
            ctx.strokeStyle = '#fca5a5'; // Skin tone
            ctx.lineWidth = r * 0.3;
            ctx.lineCap = 'round';
            ctx.beginPath();
            // Arms flailing up
            ctx.moveTo(-r * 0.35, -r * 0.1); ctx.lineTo(-r * 0.8, -r * 0.5);
            ctx.moveTo(r * 0.35, -r * 0.1); ctx.lineTo(r * 0.8, -r * 0.5);
            // Legs kicking down
            ctx.moveTo(-r * 0.2, r * 0.3); ctx.lineTo(-r * 0.6, r * 0.8);
            ctx.moveTo(r * 0.2, r * 0.3); ctx.lineTo(r * 0.6, r * 0.8);
            ctx.stroke();

            // Head
            ctx.fillStyle = '#fca5a5';
            ctx.beginPath(); ctx.arc(0, -r * 0.5, r * 0.45, 0, Math.PI * 2); ctx.fill();

            // Face (Detailed Eyes)
            // Sclera (whites of the eyes)
            ctx.fillStyle = '#ffffff'; 
            ctx.beginPath(); ctx.arc(-r * 0.16, -r * 0.58, r * 0.12, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(r * 0.16, -r * 0.58, r * 0.12, 0, Math.PI * 2); ctx.fill();
            
            // Pupils
            ctx.fillStyle = '#1e293b'; // dark slate
            ctx.beginPath(); ctx.arc(-r * 0.16, -r * 0.58, r * 0.07, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(r * 0.16, -r * 0.58, r * 0.07, 0, Math.PI * 2); ctx.fill();
            
            // Catchlights (eye sparkles)
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(-r * 0.18, -r * 0.60, r * 0.025, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(r * 0.14, -r * 0.60, r * 0.025, 0, Math.PI * 2); ctx.fill();

            // Rosy cheeks
            ctx.fillStyle = 'rgba(239, 68, 68, 0.25)'; // soft transparent red
            ctx.beginPath(); ctx.arc(-r * 0.26, -r * 0.45, r * 0.08, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(r * 0.26, -r * 0.45, r * 0.08, 0, Math.PI * 2); ctx.fill();

            // Smile (Lowered)
            ctx.strokeStyle = '#7f1d1d'; // Dark red/brown
            ctx.lineWidth = r * 0.06;
            ctx.lineCap = 'round';
            ctx.beginPath(); ctx.arc(0, -r * 0.46, r * 0.18, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();

            // Diaper
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = r * 0.1;
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(-r * 0.5, 0);       // Top left
            ctx.lineTo(r * 0.5, 0);        // Top right
            ctx.lineTo(r * 0.25, r * 0.5); // Bottom right
            ctx.lineTo(-r * 0.25, r * 0.5);// Bottom left
            ctx.closePath();
            ctx.fill(); ctx.stroke();
            
            // Diaper tape details
            ctx.fillStyle = '#93c5fd'; // blue tape
            ctx.fillRect(-r * 0.4, 0, r * 0.15, r * 0.15);
            ctx.fillRect(r * 0.25, 0, r * 0.15, r * 0.15);
        }

        function drawEntities() {
            if (physics.trail.length > 0) {
                ctx.beginPath(); ctx.moveTo(originX + physics.trail[0].x * scale, originY + physics.trail[0].y * scale);
                for (let i = 1; i < physics.trail.length; i++) ctx.lineTo(originX + physics.trail[i].x * scale, originY + physics.trail[i].y * scale);
                ctx.lineTo(originX + physics.x * scale, originY + physics.y * scale);
                ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
            }

            const sx = originX + mission.startZone.x * scale, sy = originY + mission.startZone.y * scale, sr = mission.startZone.radius * scale;
            ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI*2); ctx.fillStyle = 'rgba(34, 197, 94, 0.15)'; ctx.fill();
            ctx.strokeStyle = '#86efac'; ctx.lineWidth = 2; ctx.setLineDash([4,4]); ctx.stroke(); ctx.setLineDash([]);
            ctx.fillStyle = '#bbf7d0'; ctx.font='11px Inter'; ctx.textAlign='left'; ctx.fillText('Start', sx + sr + 5, sy);

            if (!mission.baby.rescued) {
                const tx = originX + mission.baby.x * scale, ty = originY + mission.baby.y * scale, tr = mission.baby.radius * scale;
                if (mission.level === 3) {
                    const babyR = tr * BABY_DRAW_SCALE;
                    ctx.beginPath(); ctx.arc(tx, ty, tr, 0, Math.PI*2);
                    ctx.strokeStyle = 'rgba(251, 207, 232, 0.55)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    ctx.save();
                    ctx.translate(tx, ty);
                    ctx.rotate(Math.sin(physics.time * 2) * 0.3); 
                    
                    drawBabyGraphic(ctx, babyR);
                    
                    ctx.restore();
                    ctx.fillStyle = '#fff1f2'; ctx.font = '700 12px Inter'; ctx.textAlign='center'; ctx.fillText('Baby', tx, ty - babyR - 16);
                } else {
                    ctx.beginPath(); ctx.arc(tx, ty, tr, 0, Math.PI*2); ctx.fillStyle = 'rgba(34, 197, 94, 0.18)'; ctx.fill();
                    ctx.strokeStyle = '#bbf7d0'; ctx.lineWidth = 5; ctx.stroke();
                    ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 2; ctx.setLineDash([6,4]); ctx.stroke(); ctx.setLineDash([]);
                    ctx.beginPath(); ctx.arc(tx, ty, tr * 0.42, 0, Math.PI*2); ctx.fillStyle = 'rgba(34, 197, 94, 0.28)'; ctx.fill();
                    ctx.fillStyle = '#dcfce7'; ctx.font = '700 12px Inter'; ctx.textAlign='center'; ctx.fillText('Finish', tx, ty - tr - 10);
                }
            }

            mission.obstacles.forEach(obs => {
                const ox = originX + obs.x * scale, oy = originY + obs.y * scale;
                ctx.save(); ctx.translate(ox, oy); ctx.rotate(obs.rotation);
                if (obs.type === 'rapid') {
                    const pulse = 1 + Math.sin(physics.time * 5) * 0.05;
                    ctx.fillStyle = 'rgba(219, 234, 254, 0.38)'; ctx.beginPath(); 
                    ctx.ellipse(0, 0, obs.rockDist * scale * 1.45 * pulse, obs.radius * scale * 0.82, 0, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.62)'; ctx.beginPath();
                    ctx.ellipse(0, 0, obs.rockDist * scale * 0.76, obs.radius * scale * 0.32, 0, 0, Math.PI*2); ctx.fill();
                    
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
                    ctx.lineWidth = scale * 0.3; // thick water lines
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    
                    // Left channel flow
                    ctx.moveTo(-obs.rockDist * scale * 0.45, -obs.radius * scale * 0.5);
                    ctx.quadraticCurveTo(-obs.rockDist * scale * 0.1, 0, -obs.rockDist * scale * 0.45, obs.radius * scale * 0.5);
                    
                    // Center channel flow (animated surging)
                    const surge = Math.sin(physics.time * 4) * scale * 0.25;
                    ctx.moveTo(0, -obs.radius * scale * 0.7);
                    ctx.quadraticCurveTo(surge, 0, 0, obs.radius * scale * 0.7);
                    
                    // Right channel flow
                    ctx.moveTo(obs.rockDist * scale * 0.45, -obs.radius * scale * 0.5);
                    ctx.quadraticCurveTo(obs.rockDist * scale * 0.1, 0, obs.rockDist * scale * 0.45, obs.radius * scale * 0.5);
                    
                    ctx.stroke();

                    const rockFill = obs.hit ? '#7f1d1d' : '#475569';
                    const rockStroke = obs.hit ? '#fecaca' : '#1e293b';
                    const drawRock = (shape, cx, cy) => {
                        ctx.fillStyle = rockFill;
                        ctx.strokeStyle = rockStroke;
                        ctx.lineWidth = 2;
                        ctx.beginPath(); shape.forEach((pt, idx) => { const px = cx + pt.r * scale * Math.cos(pt.a), py = cy + pt.r * scale * Math.sin(pt.a); if (idx === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); });
                        ctx.closePath(); ctx.fill(); ctx.stroke();
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)'; ctx.beginPath(); ctx.arc(cx - scale * 0.5, cy - scale * 0.5, scale * 1.5, Math.PI, 1.5 * Math.PI); ctx.stroke();
                    };
                    drawRock(obs.rock1Shape, -obs.rockDist * scale, 0); drawRock(obs.rock2Shape, obs.rockDist * scale, 0);
                } else if (obs.type === 'rock') {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)'; ctx.beginPath(); ctx.ellipse(0, 0, obs.radius * scale * 1.5, obs.radius * scale * 1.2, 0, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = obs.hit ? '#7f1d1d' : '#475569'; ctx.strokeStyle = obs.hit ? '#fecaca' : '#1e293b'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.ellipse(0, 0, obs.radius * scale, obs.radius * scale * 0.8, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                } else {
                    const logLen = obs.radius * scale * 2.25;
                    const logH = obs.radius * scale * 0.58;
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                    ctx.beginPath(); ctx.ellipse(0, logH * 0.25, logLen * 0.55, logH * 0.75, 0, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = obs.hit ? '#7f1d1d' : '#a16207'; ctx.strokeStyle = obs.hit ? '#fecaca' : '#451a03'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.ellipse(0, 0, logLen * 0.5, logH * 0.5, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                    ctx.strokeStyle = 'rgba(254, 243, 199, 0.45)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(-logLen * 0.28, -logH * 0.08); ctx.lineTo(logLen * 0.28, -logH * 0.16);
                    ctx.moveTo(-logLen * 0.34, logH * 0.12); ctx.lineTo(logLen * 0.18, logH * 0.08);
                    ctx.stroke();
                }
                ctx.restore();
            });

            const bx = originX + physics.x * scale, by = originY + physics.y * scale;
            ctx.save(); ctx.translate(bx, by); ctx.rotate(params.angleRad);
            drawSwimmerGraphic(ctx, Math.max(26, Math.min(44, scale * 3.12)));
            ctx.restore();

            const vectorSetupVisible = !isPlaying && mission.phase !== 'success' && mission.phase !== 'fail';
            if (vectorSetupVisible) {
                const arrow = getHeadingArrowGeometry();
                drawVectorArrow(arrow.startX, arrow.startY, arrow.endX, arrow.endY, headingArrow.isDragging ? '#fb923c' : '#f97316', headingArrow.isDragging ? 8 : 6, 20);

                ctx.beginPath();
                ctx.arc(arrow.endX, arrow.endY, 13, 0, Math.PI * 2);
                ctx.fillStyle = headingArrow.isDragging ? '#fff7ed' : '#fed7aa';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#f97316';
                ctx.stroke();

                drawVectorLabel('Swimmer velocity = ' + params.effectiveBoatSpeed.toFixed(1) + ' m/s', arrow.endX + 14, arrow.endY - 14, '#fed7aa');
                drawVectorLabel(formatHeading(params.angleDeg) + ' deg', arrow.endX + 14, arrow.endY + 12, '#fed7aa');
            }

            if (vectorMode > 0 && vectorSetupVisible) {
                const vs = VELOCITY_VECTOR_SCALE, resX = params.vResultantX * vs, resY = params.vResultantY * vs;
                if (vectorMode === 1) {
                    const vbx = params.effectiveBoatSpeed * Math.cos(params.angleRad) * vs, vby = params.effectiveBoatSpeed * Math.sin(params.angleRad) * vs;
                    drawVectorArrow(bx + vbx, by + vby, bx + vbx, by + vby + params.vRiver * vs, '#38bdf8', 5, 16);
                    drawVectorArrow(bx, by, bx + resX, by + resY, '#22c55e', 6, 18);
                } else if (vectorMode === 2) {
                    drawVectorArrow(bx, by, bx + resX, by, '#f97316', 5, 16);
                    drawVectorArrow(bx + resX, by, bx + resX, by + resY, '#a855f7', 5, 16);
                    drawVectorArrow(bx, by, bx + resX, by + resY, '#22c55e', 6, 18);
                } else if (vectorMode === 3) {
                    const vby = params.effectiveBoatSpeed * Math.sin(params.angleRad) * vs, vry = params.vRiver * vs, off1 = 34, off2 = -34;
                    drawVectorArrow(bx + off1, by, bx + off1, by + vby, '#d946ef', 5, 16);
                    drawVectorArrow(bx + off1, by + vby, bx + off1, by + vby + vry, '#38bdf8', 5, 16);
                    drawVectorArrow(bx + off2, by, bx + off2, by + resY, '#a855f7', 5, 16);
                    ctx.beginPath(); ctx.moveTo(bx+off2, by); ctx.lineTo(bx+off1, by); ctx.moveTo(bx+off2, by+resY); ctx.lineTo(bx+off1, by+resY); ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);
                }
            }
        }

        function drawTelemetry() {
            if (!showTelemetry) return;
            const w = 240, h = 142;
            const x = Math.max(18, bounds.sim.x + bounds.sim.w - w - 18);
            const y = Math.max(18, bounds.sim.y + bounds.sim.h - h - 18);

            ctx.fillStyle = 'rgba(15, 23, 42, 0.85)'; ctx.strokeStyle = '#334155'; ctx.lineWidth = 1;
            if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, 6); ctx.fill(); ctx.stroke(); } 
            else { ctx.fillRect(x, y, w, h); ctx.strokeRect(x, y, w, h); }

            ctx.fillStyle = '#7dd3fc'; ctx.font = '700 11px Inter'; ctx.textAlign = 'left'; ctx.fillText('TELEMETRY POPUP', x + 15, y + 20);

            const stat = (label, val, yOff, color = '#f8fafc') => {
                ctx.fillStyle = '#94a3b8'; ctx.font = '400 12px Inter'; ctx.textAlign = 'left'; ctx.fillText(label, x + 15, y + yOff);
                ctx.fillStyle = color; ctx.font = '500 13px monospace'; ctx.textAlign = 'right'; ctx.fillText(val, x + w - 15, y + yOff);
            };

            const phaseL = {setup:'Setup', outbound:'Outbound', success:'Success', fail:'Failed'};
            stat('Phase', phaseL[mission.phase], 45);
            stat('Time', physics.time.toFixed(2) + ' s', 65);
            stat('Ground Speed', params.vResultantMag.toFixed(2) + ' m/s', 85, '#4ade80');
            stat('Stamina Left', mission.staminaLeft.toFixed(1) + ' m', 105, mission.staminaLeft < 30 ? '#ef4444' : '#facc15');
            stat('Drift Distance', physics.y.toFixed(1) + ' m', 125);
        }

        function engineLoop(timestamp) {
            const dt = lastTime ? (timestamp - lastTime) / 1000 : 0.016; lastTime = timestamp;
            input.justPressed = input.isDown && !input.wasDown; input.justReleased = !input.isDown && input.wasDown; input.wasDown = input.isDown;
            uiElements.forEach(el => el.update());
            updateHeadingArrowInteraction();
            if (dt < 0.1) updatePhysics(dt);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save(); ctx.beginPath(); ctx.rect(bounds.sim.x, bounds.sim.y, bounds.sim.w, bounds.sim.h); ctx.clip();
            drawRiverEnv(); drawEntities(); ctx.restore();
            drawLevelHeader();
            drawCanvasControls();
            drawTelemetry();
            
            requestAnimationFrame(engineLoop);
        }

        // --- EVENTS ---
        window.addEventListener('resize', layout);
        headingInput.addEventListener('input', () => {
            if (headingInput.value.trim() === '') return;
            setHeadingAngle(Number(headingInput.value));
        });
        headingInput.addEventListener('blur', syncHeadingInput);
        headingInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') headingInput.blur();
        });
        const handlePtr = e => { 
            const r = canvas.getBoundingClientRect(), d = window.devicePixelRatio || 1; 
            input.x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left; 
            input.y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top; 
        };
        canvas.addEventListener('mousedown', e => { input.isDown = true; handlePtr(e); });
        canvas.addEventListener('mousemove', handlePtr);
        window.addEventListener('mouseup', () => input.isDown = false);
        canvas.addEventListener('touchstart', e => { e.preventDefault(); input.isDown = true; handlePtr(e); }, {passive: false});
        canvas.addEventListener('touchmove', e => { e.preventDefault(); handlePtr(e); }, {passive: false});
        window.addEventListener('touchend', () => input.isDown = false);

        function isHeadingEditable() {
            return !isPlaying && mission.phase !== 'success' && mission.phase !== 'fail';
        }

        function pointerInSim() {
            return input.x >= bounds.sim.x && input.x <= bounds.sim.x + bounds.sim.w && input.y >= bounds.sim.y && input.y <= bounds.sim.y + bounds.sim.h;
        }

        function pointerInControls() {
            return pointInRect(input, bounds.header) || pointInRect(input, bounds.controls) || pointInRect(input, bounds.actions);
        }

        function pointInRect(point, rect) {
            return point.x >= rect.x && point.x <= rect.x + rect.w && point.y >= rect.y && point.y <= rect.y + rect.h;
        }

        function getSwimmerCanvasPosition() {
            return { x: originX + physics.x * scale, y: originY + physics.y * scale };
        }

        function getHeadingArrowGeometry() {
            const swimmer = getSwimmerCanvasPosition();
            const length = params.effectiveBoatSpeed * VELOCITY_VECTOR_SCALE;
            return {
                startX: swimmer.x,
                startY: swimmer.y,
                endX: swimmer.x + Math.cos(params.angleRad) * length,
                endY: swimmer.y + Math.sin(params.angleRad) * length,
                length
            };
        }

        function updateHeadingFromPointer() {
            const swimmer = getSwimmerCanvasPosition();
            const dx = input.x - swimmer.x;
            const dy = input.y - swimmer.y;
            if (Math.hypot(dx, dy) < 12) return;
            setHeadingAngle(Math.round(Math.atan2(dy, dx) * 180 / Math.PI));
        }

        function updateHeadingArrowInteraction() {
            if (!input.isDown) {
                headingArrow.isDragging = false;
                return;
            }
            if (!isHeadingEditable()) return;
            if (input.justPressed && pointerInSim() && !pointerInControls()) headingArrow.isDragging = true;
            if (headingArrow.isDragging) updateHeadingFromPointer();
        }

        buildUI(); layout(); resetSimulation(); requestAnimationFrame((t) => { lastTime = t; engineLoop(t); });
    </script>
</body>
</html>
