            const pairSpacing = Math.max(26, rapidH * 0.9);

            const rapids = [
                { x: baseX,           y: targetY - verticalGap - pairSpacing / 2, angleDeg: -8 },
                { x: baseX - xGap,    y: targetY - verticalGap + pairSpacing / 2, angleDeg:  7 },
                { x: baseX,           y: targetY + verticalGap - pairSpacing / 2, angleDeg:  8 },
                { x: baseX - xGap,    y: targetY + verticalGap + pairSpacing / 2, angleDeg: -7 }
            ];

            ctx.save();
            ctx.globalAlpha = 0.98;
            for (const rapid of rapids) {
                ctx.save();
                ctx.translate(rapid.x + rapidW / 2, rapid.y);
                ctx.rotate(rapid.angleDeg * Math.PI / 180);
                ctx.drawImage(rapidImage, -rapidW / 2, -rapidH / 2, rapidW, rapidH);
                ctx.restore();
            }
            ctx.restore();
        }

        function drawFinishRing() {
            const tx = originX + mission.baby.x * scale, ty = originY + mission.baby.y * scale, tr = mission.baby.radius * scale;
            const dockLen = Math.max(28, tr * 1.75);
            const dockH = Math.max(18, tr * 1.12);
            const x0 = tx - dockLen + 2;
            const y0 = ty - dockH / 2;
            // Soft target glow around the dock landing spot.
            ctx.fillStyle = 'rgba(34, 197, 94, 0.16)';
            ctx.beginPath();
            ctx.ellipse(tx - dockLen * 0.22, ty, tr * 1.02, dockH * 0.72, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(187, 247, 208, 0.9)';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 4]);
            ctx.stroke();
            ctx.setLineDash([]);

            // Dock shadow.
            ctx.fillStyle = 'rgba(15, 23, 42, 0.24)';
            ctx.fillRect(x0 + 3, y0 + dockH - 1, dockLen - 2, 6);

            // Dock planks.
            ctx.fillStyle = '#a16207';
            ctx.fillRect(x0, y0, dockLen, dockH);
            ctx.strokeStyle = '#713f12';
            ctx.lineWidth = 2;
            ctx.strokeRect(x0, y0, dockLen, dockH);
            for (let i = 1; i < 5; i++) {
                const px = x0 + i * dockLen / 5;
                ctx.beginPath();
                ctx.moveTo(px, y0 + 1);
                ctx.lineTo(px, y0 + dockH - 1);
                ctx.stroke();
            }

            // Posts on the water side and bank side.
            ctx.fillStyle = '#78350f';
            for (const px of [x0 + 4, x0 + dockLen - 6]) {
                ctx.fillRect(px, y0 + dockH - 2, 5, 15);
            }

            // Small dock cleat.
            ctx.fillStyle = '#e5e7eb';
            ctx.fillRect(x0 + dockLen * 0.58, y0 + 4, 8, 4);
            ctx.fillRect(x0 + dockLen * 0.61, y0 + 2, 2, 8);

            // Label.
            ctx.fillStyle = '#dcfce7';
            ctx.font = '700 12px Inter';
            ctx.textAlign = 'center';
            ctx.fillText('Dock', tx - dockLen * 0.14, ty - tr - 12);
        }

        function drawFinishBank() {
            const rRight = originX + params.width * scale;
            const pulse = 0.55 + Math.sin(ambientTime * 3) * 0.25;

            // Checkered finish stripe along the whole far bank
            const cell = 10;
            for (let y = bounds.sim.y; y < bounds.sim.y + bounds.sim.h; y += cell) {
                for (let c = 0; c < 2; c++) {
                    const on = (Math.floor(y / cell) + c) % 2 === 0;
                    ctx.fillStyle = on ? 'rgba(248, 250, 252, 0.85)' : 'rgba(22, 101, 52, 0.85)';
                    ctx.fillRect(rRight + 1 + c * cell, y, cell, cell);
                }
            }
            ctx.strokeStyle = `rgba(74, 222, 128, ${pulse})`;
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(rRight, bounds.sim.y); ctx.lineTo(rRight, bounds.sim.y + bounds.sim.h);
            ctx.stroke();

            // FINISH sign on the far bank
            const sy = originY + (mission.startZone.y + 12) * scale;
            const sx = rRight + 46;
            ctx.strokeStyle = '#78350f'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(sx, sy - 12); ctx.lineTo(sx, sy + 26); ctx.stroke();
            ctx.fillStyle = '#065f46';
            ctx.strokeStyle = '#f8fafc';
            ctx.lineWidth = 2;
            if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(sx - 42, sy - 40, 84, 30, 4); ctx.fill(); ctx.stroke(); }
            else { ctx.fillRect(sx - 42, sy - 40, 84, 30); ctx.strokeRect(sx - 42, sy - 40, 84, 30); }
            ctx.fillStyle = '#f8fafc';
            ctx.font = '800 13px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('FINISH', sx, sy - 30);
            ctx.font = '600 8.5px Inter';
            ctx.fillText('LAND ANYWHERE', sx, sy - 18);
        }

        function drawProtractor(bx, by) {
            // Assessment embeds read the heading off the canvas rather than a HUD chip, so the
            // protractor and its angle readout are drawn at a size that carries across the frame.
            const big = !showHud;
            // Runs past the aim arrow's tip on embeds so the 0° tick clears the drag handle.
            const baseLen = big ? params.vBoat * VELOCITY_VECTOR_SCALE + 32 : 78;
            const arcR = big ? 58 : 40;

            ctx.save();
            ctx.strokeStyle = 'rgba(248, 250, 252, 0.5)';
            ctx.lineWidth = big ? 2 : 1.5;
            ctx.setLineDash([5, 4]);
            ctx.beginPath();
            ctx.moveTo(bx, by);
            ctx.lineTo(bx + baseLen, by);
            ctx.stroke();
            ctx.setLineDash([]);
            // Lifted off the baseline on embeds, where the heavier aim arrow and its handle sit on
            // that line whenever the heading is straight across.
            drawVectorLabel('0°', bx + baseLen + 10, big ? by - 15 : by, 'rgba(248, 250, 252, 0.75)', 'left', big ? 13 : 11);

            const angled = Math.abs(params.angleRad) > 0.02;
            if (angled) {
                ctx.strokeStyle = '#fbbf24';
                ctx.lineWidth = big ? 3 : 2;
                ctx.beginPath();
                ctx.arc(bx, by, arcR, 0, params.angleRad, params.angleRad < 0);
                ctx.stroke();
            }

            // Straight-across aims have no arc to hang the readout on, so it drops below the
            // baseline there instead of sitting on top of the aim arrow.
            if (angled || big) {
                const mid = params.angleRad / 2;
                const labelR = arcR + (big ? 26 : 20);
                const dropped = big && !angled;
                drawVectorLabel(
                    'θ = ' + formatHeading(params.angleDeg) + '°',
                    bx + Math.cos(mid) * labelR,
                    by + Math.sin(mid) * labelR + (dropped ? 26 : 0),
                    '#fbbf24',
                    'center',
                    big ? 20 : 12
                );
            }
            ctx.restore();
        }

        function drawPredictedPath(bx, by) {
            const vX = params.vResultantX, vY = params.vResultantY;
            if (vX <= 0.05) return;
            let tEnd = (params.width - physics.x) / vX;
            let offscreen = false;
            const yBottomWorld = (bounds.sim.h - originY) / scale;
            if (vY > 0.01) {
                const tb = (yBottomWorld - physics.y) / vY;
                if (tb < tEnd) { tEnd = tb; offscreen = true; }
            }
            if (tEnd <= 0) return;
            const ex = originX + (physics.x + vX * tEnd) * scale;
            const ey = originY + (physics.y + vY * tEnd) * scale;

            ctx.save();
            ctx.strokeStyle = 'rgba(74, 222, 128, 0.65)';
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 7]);
            ctx.beginPath();
            ctx.moveTo(bx, by);
            ctx.lineTo(ex, ey);
            ctx.stroke();
            ctx.setLineDash([]);

            if (offscreen) {
                drawVectorLabel('drifts off downstream!', ex, ey - 14, '#fca5a5', 'center', 12);
            } else {
                ctx.strokeStyle = '#4ade80';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(ex - 7, ey - 7); ctx.lineTo(ex + 7, ey + 7);
                ctx.moveTo(ex + 7, ey - 7); ctx.lineTo(ex - 7, ey + 7);
                ctx.stroke();
                const landLabel = mission.goalType === 'intercept' ? 'far bank at t = ' + tEnd.toFixed(1) + ' s' : 'you land here · t = ' + tEnd.toFixed(1) + ' s';
                drawVectorLabel(landLabel, ex - 12, ey - 16, '#bbf7d0', 'right', 12);
            }
            ctx.restore();
        }

        function drawInterceptDots() {
            // Ghost dots at matching future times: if the same-numbered dots meet, you intercept.
            const vX = params.vResultantX, vY = params.vResultantY;
            const yBottomWorld = (bounds.sim.h - originY) / scale;
            for (let t = 2; t <= 12; t += 2) {
                const sxw = physics.x + vX * t, syw = physics.y + vY * t;
                const bxw = mission.baby.x, byw = mission.baby.y + params.vRiver * t;
                const swimOk = sxw <= params.width + 2 && syw <= yBottomWorld && syw >= -5;
                const babyOk = byw <= yBottomWorld;
                const close = Math.hypot(sxw - bxw, syw - byw) <= 3;

                if (swimOk) {
                    const px = originX + sxw * scale, py = originY + syw * scale;
                    if (close) { ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.arc(px, py, 13, 0, Math.PI * 2); ctx.fill(); }
                    ctx.fillStyle = '#4ade80';
                    ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2); ctx.fill();
                    drawVectorLabel(t + 's', px, py - 11, '#bbf7d0', 'center', 10);
                }
                if (babyOk) {
                    const px = originX + bxw * scale, py = originY + byw * scale;
                    if (close) { ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.arc(px, py, 13, 0, Math.PI * 2); ctx.fill(); }
                    ctx.fillStyle = '#f9a8d4';
                    ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2); ctx.fill();
                    drawVectorLabel(t + 's', px + 11, py, '#fbcfe8', 'left', 10);
                }
            }
            drawVectorLabel('match the numbered dots to intercept!', originX + mission.baby.x * scale, originY + mission.baby.y * scale + mission.baby.radius * scale + 18, '#f9a8d4', 'center', 11);
        }

        function drawDistanceToBaby() {
            if (![3, 4].includes(mission.level) || mission.baby.rescued) return;
            const sx = originX + physics.x * scale;
            const sy = originY + physics.y * scale;
            const bx = originX + mission.baby.x * scale;
            const by = originY + mission.baby.y * scale;
            const distance = Math.hypot(mission.baby.x - physics.x, mission.baby.y - physics.y);
            const mx = (sx + bx) / 2;
            // Level 4 lays the swimmer, the baby and the long aim vector along one row, so the
            // callout drops below that line rather than being punched through by the arrow.
            const flatRun = Math.abs(by - sy) < 40;
            const my = (sy + by) / 2 + (!showHud && flatRun ? 34 : 0);

            ctx.save();
            ctx.strokeStyle = 'rgba(251, 207, 232, 0.9)';
            ctx.lineWidth = 2;
            ctx.setLineDash([7, 6]);
            ctx.beginPath();
            ctx.moveTo(sx, sy);
            ctx.lineTo(bx, by);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.font = '800 12px Inter';
            const label = 'Distance: ' + distance.toFixed(1) + ' m';
            const pad = 7;
            const width = ctx.measureText(label).width + pad * 2;
            ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
            if (ctx.roundRect) {
                ctx.beginPath();
                ctx.roundRect(mx - width / 2, my - 15, width, 24, 6);
                ctx.fill();
            } else {
                ctx.fillRect(mx - width / 2, my - 15, width, 24);
            }
            ctx.fillStyle = '#fbcfe8';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, mx, my - 3);
            ctx.restore();
        }

        function drawEntities() {
            // Wake ripples
            for (const r of ripples) {
                const alpha = Math.max(0, (1 - r.age / 1.1) * 0.35);
                ctx.strokeStyle = `rgba(255, 255, 255, ${alpha.toFixed(3)})`;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(originX + r.x * scale, originY + r.y * scale, 4 + r.age * 22, 0, Math.PI * 2);
                ctx.stroke();
            }

            if (physics.trail.length > 0) {
                ctx.beginPath(); ctx.moveTo(originX + physics.trail[0].x * scale, originY + physics.trail[0].y * scale);
                for (let i = 1; i < physics.trail.length; i++) ctx.lineTo(originX + physics.trail[i].x * scale, originY + physics.trail[i].y * scale);
                ctx.lineTo(originX + physics.x * scale, originY + physics.y * scale);
                ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
            }

            const sx = originX + mission.startZone.x * scale, sy = originY + mission.startZone.y * scale, sr = mission.startZone.radius * scale;
            drawDock(sx, sy);
            ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI*2); ctx.fillStyle = 'rgba(34, 197, 94, 0.15)'; ctx.fill();
            ctx.strokeStyle = '#86efac'; ctx.lineWidth = 2; ctx.setLineDash([4,4]); ctx.stroke(); ctx.setLineDash([]);
            ctx.fillStyle = '#bbf7d0'; ctx.font='11px Inter'; ctx.textAlign='left'; ctx.fillText('Start', sx + sr + 5, sy);

            if (mission.goalType === 'bank') {
                drawFinishBank();
            } else if (mission.goalType === 'ring' && !mission.baby.rescued) {
                drawLevelOneRapids();
                drawFinishRing();
            } else if (mission.goalType === 'intercept' && !mission.baby.rescued) {
                const tx = originX + mission.baby.x * scale, ty = originY + mission.baby.y * scale, tr = mission.baby.radius * scale;
                const babyR = tr * BABY_DRAW_SCALE;
                ctx.beginPath(); ctx.arc(tx, ty, tr, 0, Math.PI*2);
                ctx.strokeStyle = 'rgba(251, 207, 232, 0.55)';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.save();
                ctx.translate(tx, ty);
                ctx.rotate(Math.sin(ambientTime * 2) * 0.3);
                drawBabyGraphic(ctx, babyR);
                ctx.restore();
                ctx.fillStyle = '#fff1f2'; ctx.font = '700 12px Inter'; ctx.textAlign='center'; ctx.fillText('Baby', tx, ty - babyR - 16);
            }

            drawDistanceToBaby();

            const bx = originX + physics.x * scale, by = originY + physics.y * scale;

            const vectorSetupVisible = !isPlaying && mission.phase !== 'success' && mission.phase !== 'fail';
            const showVectors = hintMode >= 1 && mission.phase !== 'success' && mission.phase !== 'fail';

            if (vectorSetupVisible && mission.level !== 4) drawProtractor(bx, by);

            if (vectorSetupVisible) {
                const arrow = getHeadingArrowGeometry();
                const fixedSpeedMode = mission.level === 4;
                // Embeds draw the aim vector long and fine-lined: the length comes from the raised
                // VELOCITY_VECTOR_SCALE, so a slimmer shaft keeps it from reading as a fat bar.
                const shaft = showHud ? 6 : 5;
                const dragShaft = showHud ? 8 : 7;
                const width = fixedSpeedMode ? 5 : (headingArrow.isDragging ? dragShaft : shaft);
                const headLen = showHud ? 20 : 22;

                if (fixedSpeedMode) {
                    // Level 4's drag slides the tip left and right, so the vector's own arrowhead is
                    // the cue: the shaft holds steady and the head flashes on the same 500 ms beat.
                    drawVectorArrow(arrow.startX, arrow.startY, arrow.endX, arrow.endY, '#f97316', width, headLen, 'shaft');
                    if (Math.floor(Date.now() / 500) % 2 === 0) {
                        drawVectorArrow(arrow.startX, arrow.startY, arrow.endX, arrow.endY, '#f97316', width, headLen, 'head');
                    }
                    if (!hasAimedOnce && !headingArrow.isDragging) {
                        drawVectorLabel('DRAG TO SET SPEED', arrow.endX, arrow.endY - 34, '#fed7aa', 'center', 12);
                    }
                } else {
                    drawVectorArrow(arrow.startX, arrow.startY, arrow.endX, arrow.endY, '#f97316', width, headLen);
                    // The rotation arcs are the tip marker on the free-heading levels: they stay up
                    // the whole time the vector is aimable, including mid-drag.
                    drawRotationArcs(ctx, arrow.endX, arrow.endY, params.angleRad);
                    if (!hasAimedOnce && !headingArrow.isDragging) {
                        drawVectorLabel('DRAG TO AIM', arrow.endX, arrow.endY - 62, '#fed7aa', 'center', 12);
                    }
                }

                if (showHud) {
                    const aimText = fixedSpeedMode
                        ? 'Fixed heading: 0° · Speed: ' + params.vBoat.toFixed(1) + ' m/s'
                        : 'You aim: ' + params.vBoat.toFixed(1) + ' m/s at ' + formatHeading(params.angleDeg) + '°';
                    drawVectorLabel(aimText, arrow.endX + 16, arrow.endY - 12, '#fed7aa', 'left', 13);
                }
            } else if (showVectors && isPlaying) {
                const vs = VELOCITY_VECTOR_SCALE;
                const vbx = params.effectiveBoatSpeed * Math.cos(params.angleRad) * vs;
                const vby = params.effectiveBoatSpeed * Math.sin(params.angleRad) * vs;
                drawVectorArrow(bx, by, bx + vbx, by + vby, '#f97316', 4, 12);
            }

            if (showVectors) {
                const vs = VELOCITY_VECTOR_SCALE;
                const vbx = params.effectiveBoatSpeed * Math.cos(params.angleRad) * vs;
                const vby = params.effectiveBoatSpeed * Math.sin(params.angleRad) * vs;
                const resX = params.vResultantX * vs, resY = params.vResultantY * vs;
                drawVectorArrow(bx + vbx, by + vby, bx + vbx, by + vby + params.vRiver * vs, '#38bdf8', 5, 14);
                drawVectorLabel('+ current', bx + vbx + 12, by + vby + params.vRiver * vs * 0.5, '#bae6fd', 'left', 12);
                drawVectorArrow(bx, by, bx + resX, by + resY, '#22c55e', 6, 16);
                drawVectorLabel('= actual path', bx + resX + 12, by + resY + 4, '#bbf7d0', 'left', 12);

                if (vectorSetupVisible) {
                    drawPredictedPath(bx, by);
                    if (mission.goalType === 'intercept' && !mission.baby.rescued) drawInterceptDots();
                }
            }

            drawSwimSpeedReadout(bx, by);
        }

        // Stands in for the HUD swim chip on assessment embeds: it rides to the left of the swimmer
        // at the swimmer's own height, clamped so the near bank never clips it.
        function drawSwimSpeedReadout(bx, by) {
            if (showHud || mission.phase === 'success' || mission.phase === 'fail') return;

            // Stacked, because the swimmer starts a bank's width from the left edge and a single
            // line that size would run under the swimmer at t = 0.
            const value = params.vBoat.toFixed(1) + ' m/s';
            const valueSize = 22, capSize = 13;
            const width = Math.max(measureLabel(value, valueSize), measureLabel('SWIM', capSize));
            const x = Math.max(bx - 60, bounds.sim.x + 10 + width);

            // Level 4 drifts the baby along the swimmer's own row, so the readout lifts above the
            // distance callout instead of landing on top of it.
            const sharedRow = mission.goalType === 'intercept' && !mission.baby.rescued
                && Math.abs(originY + mission.baby.y * scale - by) < 40;
            const y = sharedRow ? by - 34 : by;

            drawVectorLabel('SWIM', x, y - 15, '#fdba74', 'right', capSize);
            drawVectorLabel(value, x, y + 9, '#fed7aa', 'right', valueSize);
        }

        function drawTelemetry() {
            if (!showTelemetry) { bounds.teleRect = { x: 0, y: 0, w: 0, h: 0 }; return; }
            const isRescue = mission.level === 3 || mission.level === 4;
            const w = 250, h = isRescue ? 202 : 142;
            const x = Math.max(18, bounds.sim.x + bounds.sim.w - w - 18);
            const y = Math.max(18, bounds.sim.y + bounds.sim.h - h - 18);
            bounds.teleRect = { x, y, w, h };

            ctx.fillStyle = 'rgba(15, 23, 42, 0.88)'; ctx.strokeStyle = '#334155'; ctx.lineWidth = 1;
            if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, 6); ctx.fill(); ctx.stroke(); }
            else { ctx.fillRect(x, y, w, h); ctx.strokeRect(x, y, w, h); }

            ctx.fillStyle = '#7dd3fc'; ctx.font = '700 11px Inter'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
            ctx.fillText('DATA · TELEMETRY', x + 15, y + 20);

            const stat = (label, val, yOff, color = '#f8fafc') => {
                ctx.fillStyle = '#94a3b8'; ctx.font = '400 12px Inter'; ctx.textAlign = 'left'; ctx.fillText(label, x + 15, y + yOff);
                ctx.fillStyle = color; ctx.font = '500 13px monospace'; ctx.textAlign = 'right'; ctx.fillText(val, x + w - 15, y + yOff);
            };

            const phaseL = {setup:'Setup', outbound:'Swimming', success:'Success', fail:'Failed'};
            stat('Phase', phaseL[mission.phase], 45);
            stat('Time', physics.time.toFixed(2) + ' s', 65);
            stat('Ground Speed', params.vResultantMag.toFixed(2) + ' m/s', 85, '#4ade80');
            stat('Stamina Left', mission.staminaLeft.toFixed(1) + ' m', 105, mission.staminaLeft < 30 ? '#ef4444' : '#facc15');
            stat('Downstream Drift', (physics.y - mission.startZone.y).toFixed(1) + ' m', 125);
            if (isRescue) {
                const distanceToBaby = Math.hypot(mission.baby.x - physics.x, mission.baby.y - physics.y);
                stat('Distance to Baby', distanceToBaby.toFixed(1) + ' m', 145, '#f9a8d4');
                stat('Baby: m across', (mission.baby.x - physics.x).toFixed(1) + ' m', 165, '#f9a8d4');
                stat('Vertical Difference', Math.abs(physics.y - mission.baby.y).toFixed(1) + ' m', 185, '#f9a8d4');
            }
        }

        function drawResultBanner() {
            if (mission.phase !== 'success' && mission.phase !== 'fail') return;
            const success = mission.phase === 'success';
            const w = bounds.sim.w, h = bounds.sim.h;
            ctx.fillStyle = 'rgba(2, 6, 23, 0.45)';
            ctx.fillRect(0, 0, w, h);

            const bw = Math.min(520, w - 36);
            const bh = success ? 200 : 170;
            const bx = (w - bw) / 2, by = h * 0.42 - bh / 2;

            ctx.save();
            ctx.fillStyle = 'rgba(15, 23, 42, 0.97)';
            ctx.strokeStyle = success ? '#34d399' : '#f87171';
            ctx.lineWidth = 2;
            if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 12); ctx.fill(); ctx.stroke(); }
            else { ctx.fillRect(bx, by, bw, bh); ctx.strokeRect(bx, by, bw, bh); }

            ctx.fillStyle = success ? '#34d399' : '#f87171';
            ctx.font = '800 26px Inter';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(success ? 'LEVEL COMPLETE!' : 'TRY AGAIN', w / 2, by + 34);

            let msgY = by + 66;
            if (success) {
                for (let i = 0; i < 3; i++) drawStar(w / 2 + (i - 1) * 48, by + 72, 16, i < mission.stars);
                msgY = by + 106;
            }

            ctx.fillStyle = '#e2e8f0';
            ctx.font = '500 13px Inter';
            const lines = wrapTextLines(mission.message, bw - 48);
            for (let i = 0; i < Math.min(lines.length, 3); i++) {
                ctx.fillText(lines[i], w / 2, msgY + i * 18);
            }

            ctx.fillStyle = '#94a3b8';
            ctx.font = '600 12px Inter';
            ctx.fillText(success ? 'Press PLAY AGAIN for another run' : 'Press PLAY AGAIN, re-aim, and go rescue', w / 2, by + bh - 20);
            ctx.restore();
        }

        function updateSwimmerOverlay() {
            const x = originX + physics.x * scale;
            const y = originY + physics.y * scale;
            const size = Math.max(86, Math.min(124, scale * 8.5));
            const hidden = mission.phase === 'success' || mission.phase === 'fail'
                || x < -size || x > bounds.sim.w + size
                || y < -size || y > bounds.sim.h + size;

            swimmerEl.style.display = hidden ? 'none' : 'block';
            if (hidden) return;

            swimmerEl.style.left = x + 'px';
            swimmerEl.style.top = y + 'px';
            swimmerEl.style.width = size + 'px';
            swimmerEl.style.height = size + 'px';
            swimmerEl.style.transform = `translate(-50%, -50%) rotate(${params.angleDeg}deg)`;
            swimmerEl.classList.toggle('swimming', isPlaying);

            // Rotate each arm around its exact local shoulder at (0,0).
            // Because the shoulder translation is on the outer group, the arm cannot orbit or slide.
            const armPeriod = isPlaying ? 1.5 : 3.2;
            const armPhase = ambientTime * (Math.PI * 2 / armPeriod);
            const leftStroke = (1 - Math.cos(armPhase)) * 0.5;
            const rightStroke = (1 - Math.cos(armPhase + Math.PI)) * 0.5;
            const leftAngle = 8 - 80 * leftStroke;
            const rightAngle = -8 + 80 * rightStroke;
            leftArmRotor.setAttribute('transform', `rotate(${leftAngle.toFixed(2)} 0 0)`);
            rightArmRotor.setAttribute('transform', `rotate(${rightAngle.toFixed(2)} 0 0)`);

            // Keep both hips fixed inside the suit and rotate only the straight leg shapes.
            const kickPeriod = isPlaying ? 0.42 : 1.2;
            const kickPhase = ambientTime * (Math.PI * 2 / kickPeriod);
            const kickAmount = isPlaying ? 9 : 3;
            const leftKick = Math.sin(kickPhase) * kickAmount;
            const rightKick = Math.sin(kickPhase + Math.PI) * kickAmount;
            leftLegRotor.setAttribute('transform', `rotate(${leftKick.toFixed(2)} 0 0)`);
            rightLegRotor.setAttribute('transform', `rotate(${rightKick.toFixed(2)} 0 0)`);
        }

        function engineLoop(timestamp) {
            const dt = lastTime ? (timestamp - lastTime) / 1000 : 0.016; lastTime = timestamp;
            ambientTime += Math.min(dt, 0.1);
            input.justPressed = input.isDown && !input.wasDown; input.justReleased = !input.isDown && input.wasDown; input.wasDown = input.isDown;
            uiElements.forEach(el => el.update());
            updateHeadingArrowInteraction();
            if (dt < 0.1) updatePhysics(dt);
            updateSwimmerOverlay();

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save(); ctx.beginPath(); ctx.rect(bounds.sim.x, bounds.sim.y, bounds.sim.w, bounds.sim.h); ctx.clip();
            drawRiverEnv(); drawEntities(); ctx.restore();
            drawLevelHeader();
            drawCanvasControls();
            drawHintPanel();
            drawTelemetry();
            drawResultBanner();

            requestAnimationFrame(engineLoop);
        }

        // --- EVENTS ---
        window.addEventListener('resize', layout);
        headingInput.addEventListener('input', () => {
            if (headingInput.value.trim() === '') return;
            if (mission.level === 4) {
                setSwimSpeed(Number(headingInput.value));
            } else {
                hasAimedOnce = true;
                setHeadingAngle(Number(headingInput.value));
            }
        });
        headingInput.addEventListener('blur', syncHeadingInput);
        headingInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') headingInput.blur();
        });
        const handlePtr = e => {
            const r = canvas.getBoundingClientRect();
            input.x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
            input.y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
        };
        canvas.addEventListener('mousedown', e => { input.isDown = true; handlePtr(e); });
        canvas.addEventListener('mousemove', handlePtr);
        window.addEventListener('mouseup', () => input.isDown = false);
        canvas.addEventListener('touchstart', e => { e.preventDefault(); input.isDown = true; handlePtr(e); }, {passive: false});
        canvas.addEventListener('touchmove', e => { e.preventDefault(); handlePtr(e); }, {passive: false});
        window.addEventListener('touchend', () => input.isDown = false);

        // Level 4 locks the heading but not the speed, so the drag stays live there — it just sets a
        // different property of the same vector.
        function isAimEditable() {
            return !isPlaying && mission.phase !== 'success' && mission.phase !== 'fail';
        }

        function pointerInSim() {
            return input.x >= bounds.sim.x && input.x <= bounds.sim.x + bounds.sim.w && input.y >= bounds.sim.y && input.y <= bounds.sim.y + bounds.sim.h;
        }

        function pointerInControls() {
            return pointInRect(input, bounds.header) || pointInRect(input, bounds.controls) || pointInRect(input, bounds.actions)
                || pointInRect(input, bounds.hintRect) || pointInRect(input, bounds.teleRect);
        }

        function pointInRect(point, rect) {
            return point.x >= rect.x && point.x <= rect.x + rect.w && point.y >= rect.y && point.y <= rect.y + rect.h;
        }

        function getSwimmerCanvasPosition() {
            return { x: originX + physics.x * scale, y: originY + physics.y * scale };
        }

        function getHeadingArrowGeometry() {
            const swimmer = getSwimmerCanvasPosition();
            const length = params.effectiveBoatSpeed * VELOCITY_VECTOR_SCALE;
            return {
                startX: swimmer.x,
                startY: swimmer.y,
                endX: swimmer.x + Math.cos(params.angleRad) * length,
                endY: swimmer.y + Math.sin(params.angleRad) * length,
                length
            };
        }

        function updateHeadingFromPointer() {
            const swimmer = getSwimmerCanvasPosition();
            const dx = input.x - swimmer.x;
            const dy = input.y - swimmer.y;
            if (Math.hypot(dx, dy) < 12) return;
            hasAimedOnce = true;
            setHeadingAngle(Math.round(Math.atan2(dy, dx) * 180 / Math.PI));
        }

        // Level 4's vector points straight across, so how far the pointer is across the river is the
        // length of that vector — which is the swim speed. setSwimSpeed clamps to the 1-8 m/s range.
        function updateSpeedFromPointer() {
            const swimmer = getSwimmerCanvasPosition();
            const dx = input.x - swimmer.x;
            if (dx < 12) return;
            hasAimedOnce = true;
            setSwimSpeed(dx / VELOCITY_VECTOR_SCALE);
        }

        function updateHeadingArrowInteraction() {
            if (!input.isDown) {
                headingArrow.isDragging = false;
                return;
            }
            if (!isAimEditable()) return;
            if (input.justPressed && pointerInSim() && !pointerInControls()) headingArrow.isDragging = true;
            if (!headingArrow.isDragging) return;
            if (mission.level === 4) updateSpeedFromPointer();
            else updateHeadingFromPointer();
        }

        buildUI(); layout(); resetSimulation(); requestAnimationFrame((t) => { lastTime = t; engineLoop(t); });
    </script>
</body>
</html>
