<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radio Tuner</title><style>
html,body{background:transparent}*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,sans-serif;color:#203d49}main{max-width:1100px;margin:auto;padding:18px}h1{font-size:30px;margin:0 0 12px;letter-spacing:-.7px}.stage{border:5px solid #285f9f;border-radius:18px;background:#ffffff;padding:14px}svg{width:100%;display:block}.band{display:flex;gap:8px;align-items:center;margin-bottom:8px}.band p{flex:1;margin:0;font-weight:600}button{font:inherit;min-height:44px;padding:8px 14px;border:1px solid #a5b6ba;border-radius:8px;color:#203d49;background:white;cursor:pointer}button[aria-pressed=true]{background:#203d49;color:white}button:focus-visible,input:focus-visible{outline:3px solid #ad7918;outline-offset:3px}.traces{background:#ffffff;border-radius:12px}#rxSpectrum{max-height:140px}.tuning{display:flex;align-items:center;gap:12px;margin:6px 0}.tuning label{flex:1;font-weight:600}.tuning output{float:right}.tuning input{display:block;width:100%;height:30px;accent-color:#237b9a}.result{font-weight:600;margin:10px 0 0;min-height:48px}.fine{font-size:13px;color:#526d75;margin:8px 0 0}.controls{display:flex;gap:8px;margin-top:6px}.mobile-traces{display:none}
@media(max-width:600px){main{padding:10px 6px}h1{font-size:25px}.stage{padding:10px}.band{flex-wrap:wrap}.band p{flex-basis:100%;font-size:15px}.desktop-traces{display:none}.mobile-traces{display:block}.tuning{gap:6px}.tuning button{padding:8px 12px}.result{font-size:15px;min-height:66px}.fine{font-size:12px}#rxSpectrum{margin-top:8px}}

.tuning{gap:12px;align-items:center;margin-top:10px}.tuning label{min-width:0;background:linear-gradient(145deg,#4a4540,#272a2c);border:3px solid #a7997e;border-radius:12px;padding:10px 12px 6px;box-shadow:inset 0 1px 2px #fff5,0 2px 3px #203d4920;color:#e7d3aa;font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}.tuning output{text-transform:none;font-variant-numeric:tabular-nums;color:#ffe5b3;letter-spacing:.03em}.dial-window{position:relative;height:83px;margin-top:5px;background:linear-gradient(#141e24,#263b42 70%,#17282f);border:1px solid #0c1419;border-radius:5px;box-shadow:inset 0 2px 8px #0009;overflow:hidden}.dial-scale{position:absolute;left:16px;right:16px;top:0;bottom:0;background:repeating-linear-gradient(90deg,#dfc795 0 1px,transparent 1px 2.5%);background-size:100% 15px;background-repeat:no-repeat;background-position:0 31px}.dial-number{position:absolute;top:7px;transform:translateX(-50%);font-size:12px;letter-spacing:0;color:#e7d3aa}.dial-number:first-child{transform:none}.dial-number:nth-child(5){transform:translateX(-100%)}.dial-station{position:absolute;top:54px;transform:translateX(-50%);font-size:12px;color:#a6c6c7}.tuning input{position:absolute;left:7px;top:0;width:calc(100% - 14px);height:81px;margin:0;padding:0;appearance:none;-webkit-appearance:none;background:transparent;cursor:ew-resize;accent-color:#f09065}.tuning input::-webkit-slider-runnable-track{height:63px;background:transparent}.tuning input::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:63px;border:0;border-radius:0;background:linear-gradient(90deg,transparent 7px,#ffb08a 7px,#e57251 10px,transparent 10px);filter:drop-shadow(0 0 3px #f0906570)}.tuning input::-moz-range-track{height:63px;background:transparent}.tuning input::-moz-range-thumb{width:18px;height:63px;border:0;border-radius:0;background:linear-gradient(90deg,transparent 7px,#ffb08a 7px,#e57251 10px,transparent 10px)}.tuning input:focus-visible{outline:2px solid #ffe5b3;outline-offset:-3px;border-radius:4px}.tuning button{width:46px;height:46px;padding:0;border-radius:50%;border:3px solid #9b9b92;background:radial-gradient(circle at 35% 30%,#fff,#d5d5c9 52%,#8e968f);box-shadow:0 2px 3px #203d4930;font-size:23px;color:#273d43}.result{min-height:22px;margin-top:8px;font-size:14px;font-weight:500}.fine{margin-top:2px;font-size:12px}@media(max-width:600px){.tuning{display:grid;grid-template-columns:1fr 44px 44px;gap:8px}.tuning label{grid-column:1/-1;padding:8px 9px 5px}.tuning button{width:44px;height:44px}.tuning #rxMinus{grid-column:2}.result{min-height:22px;margin-top:4px;font-size:14px}.dial-number{font-size:11px}.dial-window{height:80px}}
</style></head><body><main><h1>Radio Tuner</h1><div class="stage"><div class="band"><p id="guidance" role="status" aria-live="polite"></p><button id="rxAM" aria-pressed="true">AM</button><button id="rxFM" aria-pressed="false">FM</button></div><div class="traces"><svg class="desktop-traces" id="rxFilterAnimation" viewBox="0 0 940 430" role="img" aria-label="Incoming signals, filter, and outgoing signals. The same time and amplitude scales are used for input and output."></svg><svg class="mobile-traces" viewBox="0 0 390 425" role="img" aria-label="Three stations: incoming signals at left, filtered output at right. Both columns use the same scales."><text x="20" y="22" font-size="16" fill="#203d49">Incoming</text><text x="222" y="22" font-size="16" fill="#203d49">After filter</text><g id="mobileSignals" transform="translate(0 24)"></g></svg></div><svg id="rxSpectrum" role="img"></svg><div class="tuning"><label>Tuning <output id="rxFrequency"></output><div class="dial-window"><div class="dial-scale" id="dialScale" aria-hidden="true"></div><input id="rxTune" type="range" min="0" max="1000" value="500" step="1" aria-label="Tuning frequency"></div></label><button id="rxMinus" aria-label="Tune down">−</button><button id="rxPlus" aria-label="Tune up">+</button></div><p id="result" class="result" role="status" aria-live="polite"></p><p class="fine">Same scales. Schematic signals.</p></div><div class="controls"><button id="pause">Pause</button><button id="reset">Reset</button></div><script>
(()=>{'use strict';
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let tune=.5,mode='am',time=0,frame=0,previous=0,paused=false,step=0,completed=false;
const stations=[{name:'Music',tag:'A',color:'#9b6043',u:.2,tone:2},{name:'Weather',tag:'B',color:'#237b9a',u:.5,tone:3},{name:'Talk',tag:'C',color:'#7864a6',u:.8,tone:4}];
const $=id=>document.getElementById(id),TAU=Math.PI*2;
const response=(u,center=tune)=>Math.exp(-.5*((u-center)/.055)**2);
const frequency=u=>mode==='am'?`${Math.round(600+800*u)} kHz`:`${(88+20*u).toFixed(1)} MHz`;
const text=(x,y,s,size=15,color='#203d49',anchor='start')=>`<text x="${x}" y="${y}" fill="${color}" font-family="system-ui,sans-serif" font-size="${size}" text-anchor="${anchor}">${s}</text>`;
const line=(d,color,width=2.5,extra='')=>`<path d="${d}" fill="none" stroke="${color}" stroke-width="${width}" ${extra}/>`;
function wave(x,y,w,amp,cycles,color){let d='';for(let k=0;k<=360;k++){let u=k/360;d+=(k?'L':'M')+(x+w*u).toFixed(2)+' '+(y-amp*Math.sin(TAU*cycles*(u-time))).toFixed(2);}return line(d,color);}
function readings(){return stations.map(s=>({...s,g:response(s.u)}));}
function carrier(st){return 8+20*st.u;}
function sample(st,u){const t=u-time,m=Math.sin(TAU*st.tone*t);return mode==='am'?(.6+.34*m)*Math.sin(TAU*carrier(st)*t):.9*Math.sin(TAU*carrier(st)*t-1.2*Math.cos(TAU*st.tone*t));}

let dialBand='';
function updateDial(){
 if(dialBand===mode)return;dialBand=mode;
 const labels=mode==='am'?['600','800','1000','1200','1400']:['88','93','98','103','108'];
 $('dialScale').innerHTML=labels.map((v,i)=>`<span class="dial-number" style="left:${i*25}%">${v}</span>`).join('')+stations.map(st=>`<span class="dial-station" style="left:${st.u*100}%">${st.tag}</span>`).join('');
}
function render(){
 const narrow=innerWidth<600,W=narrow?430:850,left=narrow?28:40,right=W-25,span=right-left,base=95,top=25;
 const r=readings(),best=r.reduce((a,b)=>a.g>b.g?a:b),clear=best.g>.85,usable=best.g>.18;
 $('rxSpectrum').setAttribute('viewBox',`0 0 ${W} 138`);
 let d='',area='';for(let k=0;k<=400;k++){let u=k/400,x=left+span*u,y=base-(base-top)*response(u);d+=(k?'L':'M')+x.toFixed(2)+' '+y.toFixed(2);}
 area=d+`L${right} ${base}L${left} ${base}Z`;
 const lo=left+span*Math.max(0,tune-.065),hi=left+span*Math.min(1,tune+.065);
 let s=`<rect x="${lo}" y="15" width="${hi-lo}" height="${base-15}" fill="#237b9a" fill-opacity=".12"/><path d="${area}" fill="#237b9a" fill-opacity=".16"/>`+line(d,'#237b9a',2.5)+line(`M${left} ${base}H${right}`,'#80969b',1.5);
 s+=text(left,16,'Filter',14);
 r.forEach(st=>{const x=left+span*st.u;s+=line(`M${x} ${base}V${top+7}`,st.color,4)+text(x,base+23,st.tag,narrow?13:17,st.color,'middle');});
 const cx=left+span*tune;s+=`<circle cx="${cx}" cy="${top}" r="5" fill="#237b9a"/>`;
 $('rxSpectrum').innerHTML=s;

 const selected=best.g>.5;
 let flow=text(190,32,'IN',23,'#203d49','middle')+text(745,32,'OUT',23,'#203d49','middle')+`<rect x="345" y="49" width="215" height="365" rx="15" fill="#e0edf0"/>`+text(452,32,'FILTER',16,'#237b9a','middle');
 stations.forEach(st=>{const i=stations.indexOf(st),y=112+i*120,g=response(st.u),chosen=selected&&st.tag===best.tag;let input='',output='',match='';
  if(chosen)flow+=`<rect x="345" y="${y-52}" width="575" height="104" rx="16" fill="${st.color}" fill-opacity=".12" stroke="${st.color}" stroke-width="2"/>`;
  for(let k=0;k<=480;k++){const u=k/480,v=sample(st,u),prefix=k?'L':'M';input+=prefix+(60+260*u).toFixed(2)+' '+(y-42*v).toFixed(2);output+=prefix+(590+260*u).toFixed(2)+' '+(y-42*g*v).toFixed(2);match+=prefix+(365+175*u).toFixed(2)+' '+(y-23*Math.sin(TAU*carrier(st)*(u-time))).toFixed(2);}
  flow+=text(18,y+8,st.tag,25,st.color)+line(`M60 ${y}H320M590 ${y}H850`,'#d1dcda',1)+line(input,st.color,3)+line(output,st.color,3);
  if(chosen){flow+=line(match,st.color,2.5)+text(452,y-33,st.tag+' · '+frequency(st.u),15,st.color,'middle')+line(`M549 ${y}h32m-10-9l10 9-10 9`,st.color,3)+`<circle cx="867" cy="${y}" r="5" fill="${st.color}"/>`;}
  else flow+=line(`M441 ${y-9}l20 18m-20 0l20-18`,'#91a6aa',2);
 });
 $('rxFilterAnimation').innerHTML=flow;

 $('rxAM').setAttribute('aria-pressed',String(mode==='am'));$('rxFM').setAttribute('aria-pressed',String(mode==='fm'));
 updateDial();$('rxFrequency').textContent=frequency(tune);$('rxTune').setAttribute('aria-valuetext',frequency(tune));
 $('rxSpectrum').setAttribute('aria-label',`Tuned to ${frequency(tune)}. `+r.map(st=>`${st.tag}: ${Math.round(st.g*100)} percent passes`).join('. '));
 let mobile='';
 stations.forEach((st,i)=>{const y=61+i*123,g=response(st.u);let a='',b='';for(let k=0;k<=300;k++){const u=k/300,v=sample(st,u),p=k?'L':'M';a+=p+(20+148*u).toFixed(2)+' '+(y-23*v).toFixed(2);b+=p+(222+148*u).toFixed(2)+' '+(y-23*g*v).toFixed(2);}
 mobile+=text(20,y-33,st.tag+' · '+frequency(st.u),16,st.color)+line(`M20 ${y}H168M222 ${y}H370`,'#c8d4cd',1)+line(a,st.color,2)+line(b,st.color,2)+line(`M181 ${y}h27m-7-5l7 5-7 5`,'#237b9a',2)+text(222,y+46,Math.round(g*100)+'% passes',15,st.color);});
 $('mobileSignals').innerHTML=mobile;
 const instructions=['B is selected. Tune to A and compare the outgoing traces.','A passes strongly. Now tune between A and B so both fade.','Between stations, little passes. Now tune to C.','✓ Tuning complete. Explore either band or select Reset.'];
 $('guidance').textContent=instructions[step];
 const message=best.g>.85?`${best.tag} / ${best.name}`:best.g>.18?`Near ${best.tag} / ${best.name}`:'Between stations';
 if($('result').textContent!==message)$('result').textContent=message;
}
function check(){if(step===0&&response(.2)>.85)step=1;else if(step===1&&tune>.28&&tune<.42&&Math.max(...readings().map(s=>s.g))<.18)step=2;else if(step===2&&response(.8)>.85){step=3;if(!completed){completed=true;window.parent.postMessage({ type: 'complete' }, '*');}}}
function tuneTo(v){tune=Math.max(0,Math.min(1,Number(v)/1000));$('rxTune').value=Math.round(tune*1000);check();render();}
function animate(stamp){frame=0;if(document.hidden||paused||reduced.matches){previous=0;return;}if(previous)time+=Math.min(stamp-previous,60)/1000*.16;previous=stamp;render();frame=requestAnimationFrame(animate);}
function start(){if(!frame&&!paused&&!reduced.matches&&!document.hidden)frame=requestAnimationFrame(animate);}
$('rxTune').addEventListener('input',e=>tuneTo(e.target.value));$('rxMinus').onclick=()=>tuneTo(tune*1000-5);$('rxPlus').onclick=()=>tuneTo(tune*1000+5);
['am','fm'].forEach(b=>{$('rx'+b.toUpperCase()).onclick=()=>{mode=b;render();};});
$('reset').onclick=()=>{step=0;tune=.5;time=0;$('rxTune').value=500;render();};
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Play':'Pause';cancelAnimationFrame(frame);frame=0;previous=0;start();};
document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(frame);frame=0;previous=0;start();});reduced.addEventListener('change',()=>{cancelAnimationFrame(frame);frame=0;previous=0;start();});window.addEventListener('resize',render);render();start();
})();
</script></main></body></html>
