<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inside the Radio</title><style>
:root{--ink:#203d49;--blue:#237b9a;--rust:#b45739;--paper:#f7f5ee;--line:#d4dfdf;--gold:#ad7918}*{box-sizing:border-box}body{margin:0;background:#eaece7;color:var(--ink);font:16px/1.45 system-ui,sans-serif}main{max-width:1060px;margin:auto;padding:22px}h1{font-size:clamp(22px,4vw,34px);font-weight:650;letter-spacing:-1px;margin:0 0 14px;white-space:nowrap}.stage{background:var(--paper);border:1px solid #ccd7d6;border-radius:18px;overflow:hidden;box-shadow:0 12px 38px #203d490b}.stage-top{padding:18px 24px 0;display:flex;align-items:center;justify-content:space-between;gap:14px}.mode{font-size:21px;font-weight:650}.hint{font-size:13px;color:#5b7077}.graph{display:block;width:100%;height:auto}.graph text{font-family:system-ui,sans-serif;fill:var(--ink)}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px;align-items:center}button{font:inherit;color:var(--ink);background:white;border:1px solid #bbc9cb;border-radius:9px;min-height:44px;padding:9px 15px;cursor:pointer;transition:background .15s}button:hover{background:#edf4f3}button:focus-visible{outline:3px solid #ad7918;outline-offset:3px}button[aria-pressed=true],button[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:white}.sep{flex:1}.swatch{display:inline-block;width:17px;height:4px;background:var(--blue);vertical-align:middle;margin-right:7px}.swatch.dash{height:0;border-top:3px dashed var(--rust);background:none}.question{padding:0 24px 18px}.question p{margin:0}.answers{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}.feedback{min-height:48px;margin-top:10px!important;font-size:15px;max-width:850px}.answer.good{border:2px solid #26765b;background:#eef7f0}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}.receiver{padding:20px 24px 22px}.receiver svg{width:100%;height:auto;display:block}.chain{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}.chain button{padding:12px 4px;font-size:14px}.steptext{background:#e9efeb;border-radius:10px;padding:15px;margin-top:14px;min-height:91px}.steptext strong{display:block;margin-bottom:5px}.steptext p{margin:0}.trace{fill:none;stroke-width:2.1;stroke-linejoin:round;stroke-linecap:round}.fine{color:#61757b;font-size:12px}.receiver-label{font:17px system-ui,sans-serif;fill:var(--ink)}@media(max-width:600px){main{padding:12px 8px}.stage-top{padding:14px 14px 0;align-items:flex-start;flex-direction:column;gap:2px}.question{padding:0 14px 14px}.receiver{padding:12px}.chain{grid-template-columns:repeat(3,1fr)}.controls button{font-size:14px;padding:8px 11px}.sep{display:none}.feedback{min-height:80px}.hint{font-size:12px}.mode{font-size:18px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}


.radio-shell{position:relative;border:2px solid #9aaea7;background:#efeee2;border-radius:24px;padding:20px 18px 10px;margin-top:22px;box-shadow:inset 0 2px white,0 5px 0 #cbd2ca}.rx-antenna{position:absolute;top:-24px;left:35px;width:7px;height:25px;background:#6c858b;border-radius:5px;transform:rotate(-25deg);transform-origin:bottom}.rx-parts{display:flex;align-items:center;justify-content:space-between;gap:5px;flex-wrap:wrap}.rx-parts button{padding:8px 10px;font-size:14px;background:#fafaf5}.rx-parts button[aria-pressed=true]{background:#203d49;color:white}.rx-parts span{color:#728c8d}.rx-spectrum{background:#fafbf6;border:1px solid #c8d4cd;border-radius:12px;margin-top:16px;overflow:hidden}.rx-tuning{display:flex;align-items:center;gap:12px;margin-top:6px}.rx-slider{flex:1;font-weight:600}.rx-slider output{float:right;font-variant-numeric:tabular-nums;color:#237b9a}.rx-slider input{display:block;width:100%;margin:10px 0;accent-color:#237b9a;cursor:pointer}.dial-face{width:64px;height:64px;border-radius:50%;flex-shrink:0;background:radial-gradient(circle at 38% 30%,#fff,#d5ddd5 60%,#a9bab3 100%);border:3px solid #5e797b;position:relative;box-shadow:0 3px 3px #294b4922}#rxNeedle{position:absolute;left:27px;top:5px;width:4px;height:23px;background:#237b9a;transform-origin:2px 24px;border-radius:3px}.rx-flow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.rx-cell{background:#fafbf6;border:1px solid #cad6ce;border-radius:12px;padding:10px 8px 0}.rx-cell strong{font-size:14px;display:block;text-align:center}.rx-volume{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px;margin:12px 0 8px}.rx-volume input{flex:1;min-width:90px;max-width:190px;accent-color:#b45739}.rx-volume output{font-variant-numeric:tabular-nums;width:38px}.rx-volume span{color:#5b7176}.rx-result{padding:10px 12px;border-left:4px solid #b6c6bd;background:#f9faf5;font-size:15px;min-height:63px}.rx-result.rx-locked{border-left-color:#23816d;background:#e5f2e9}.radio-shell .steptext{background:transparent;border-top:1px solid #c1cec5;border-radius:0;padding:10px 0 0;margin-top:10px;min-height:85px;font-size:14px}.rx-cone{animation:cone-vibrate .14s linear infinite alternate}.rx-rings{animation:sound-pulse 1s ease-in-out infinite alternate}@keyframes cone-vibrate{to{transform:translateX(var(--cone,0px))}}@keyframes sound-pulse{to{stroke-width:4;transform:translateX(3px)}}@media(max-width:600px){.radio-shell{padding:12px 10px 8px}.rx-flow{grid-template-columns:1fr}.rx-cell{display:grid;grid-template-columns:100px 1fr;align-items:center}.rx-cell strong{font-size:13px}.rx-parts{justify-content:flex-start}.rx-parts span{display:none}.rx-parts button{font-size:12px;padding:6px 8px}.dial-face{width:48px;height:48px}#rxNeedle{left:19px;top:3px;height:17px;transform-origin:2px 18px}.rx-tuning{gap:7px}.rx-tuning button{padding:6px 10px}.rx-result{min-height:85px}}@media(prefers-reduced-motion:reduce){.rx-cone,.rx-rings{animation:none}}
.motion-paused .rx-cone,.motion-paused .rx-rings{animation-play-state:paused}
.rx-focus{margin-top:16px;background:#fafbf6;border:1px solid #c8d4cd;border-radius:12px;overflow:hidden;min-height:270px}.rx-focus svg{max-width:850px;margin:auto;min-height:270px}.rx-spectrum{min-height:270px}

.rx-journey{overflow-x:auto;margin-top:10px}.rx-journey svg{display:block;min-width:680px;width:100%}.rx-motion-note{font-size:14px;color:#526d75;margin:12px 0 0}.rx-cone,.rx-rings{animation:none}#rxFilterAnimation{display:block;max-width:720px;margin:0 auto}

.rx-band{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:14px 16px 0}.rx-band strong{margin-right:auto}.rx-band button{font-size:14px;padding:7px 12px}.rx-band button[aria-pressed=true]{background:#203d49;color:white}.rx-explain{font-size:14px;line-height:1.5;margin:10px 16px}.rx-traces{overflow-x:auto}#rxFilterAnimation{min-width:680px;max-width:none;width:100%}#rxChallenge{margin:4px 16px;font-size:14px;padding:8px 12px}

.stage:has(.tuner-view:not([hidden])) .stage-top{display:none}
.receiver.tuner-view{padding:12px}

</style></head><body><main><h1>Inside the Radio</h1><div class="stage"><section class="receiver" id="receiver" aria-label="Explore the radio receiver"></section></div><div class="band-controls"><button id="bandAM" aria-pressed="true">AM</button><button id="bandFM" aria-pressed="false">FM</button></div><script>
/* Guided, idealized receiver model. No real RF simulation or sound playback. */
(()=>{'use strict';
const host=document.getElementById('receiver');
host.innerHTML=`<div class="radio-shell">
 <div class="rx-antenna" aria-hidden="true"></div>
 <div class="rx-parts" aria-label="Follow the signal"><button data-step="0">Antenna</button><span>→</span><button data-step="1">Tuner</button><span>→</span><button data-step="2">Demodulator</button><span>→</span><button data-step="3">Amplifier</button><span>→</span><button data-step="4">Speaker</button></div>
 <p class="rx-motion-note">Watch the moving traces. Select a part to look inside it. Pause freezes the signal.</p><div class="rx-journey"><svg id="rxJourney" viewBox="0 0 850 180" role="img" aria-label="Animated receiver path: combined radio signals, selected station, electrical audio, amplified audio, moving speaker."></svg></div>
 <div id="rxFocus" class="rx-focus"><svg id="rxFocusScene" viewBox="0 0 600 310" role="img"></svg></div>
 <div id="rxSpectrumWrap" class="rx-spectrum"><div class="rx-band"><strong>Explore station selection</strong><button id="rxAM" aria-pressed="true">AM</button><button id="rxFM" aria-pressed="false">FM</button></div><p id="rxModulation" class="rx-explain"></p><svg id="rxSpectrum" role="img" aria-label="Three stations reach the antenna. A movable filter selects a frequency band."></svg><div class="rx-traces"><svg id="rxFilterAnimation" viewBox="0 0 940 430" role="img" aria-label="Incoming and outgoing signals share the same time scale. Each station has a different carrier frequency. Tuning changes how much of each signal passes."></svg></div><p class="rx-explain">Selected radio signal: still carrying audio. The demodulator recovers the audio next.</p><button id="rxChallenge">Try it: find Weather Radio</button><p id="rxChallengeResult" class="rx-explain" role="status" aria-live="polite"></p></div>
 <div id="rxTuningControls" class="rx-tuning"><div class="dial-face" aria-hidden="true"><div id="rxNeedle"></div></div><label class="rx-slider">Tuning <output id="rxFrequency"></output><input id="rxTune" type="range" min="0" max="1000" value="500" step="1" aria-label="Tuning frequency"></label><button id="rxMinus" aria-label="Tune down">−</button><button id="rxPlus" aria-label="Tune up">+</button></div>
 <div id="rxFlow" class="rx-flow">
  <div class="rx-cell"><strong>After the tuner</strong><svg id="rxPassed" viewBox="0 0 300 165" role="img" aria-label="Remaining strength of each station"></svg></div>
  <div class="rx-cell"><strong>Recovered electrical audio</strong><svg id="rxAudio" viewBox="0 0 300 165" role="img" aria-label="Recovered audio before amplification"></svg></div>
  <div class="rx-cell"><strong>Amplifier → speaker</strong><svg id="rxSpeaker" viewBox="0 0 300 165" role="img" aria-label="Amplified audio and speaker response"></svg></div>
 </div>
 <label id="rxVolumeControls" class="rx-volume">Volume <input id="rxVolume" type="range" min="0" max="100" value="55" aria-label="Speaker volume"><output id="rxVolumeValue">55%</output><span>Battery supplies the amplifier’s energy.</span></label>
 <div class="rx-result" id="rxResult" role="status" aria-live="polite"></div>
 <div class="steptext"><strong id="stepTitle"></strong><p id="stepBody"></p></div>
 <p class="fine">Idealized station-selection model. Shapes and bandwidth are simplified; traces are not actual broadcast frequencies. Animation is slowed for visibility. Curves show signal changes, not the speed of radio waves. Speaker motion is schematic; no sound is played.</p>
</div>`;
let tune=.50,volume=.55,mode='am',step=1,time=0,frame=0,previous=null,active=false,running=false;
let challenge=false;
const stations=[{name:'Music',tag:'A',color:'#9b6043',u:.2,tone:2},{name:'Weather',tag:'B',color:'#237b9a',u:.5,tone:3},{name:'Talk',tag:'C',color:'#7864a6',u:.8,tone:4}];
const $=id=>document.getElementById(id),TAU=Math.PI*2;
const response=(u,center=tune)=>Math.exp(-.5*((u-center)/.055)**2);
const frequency=u=>mode==='am'?`${Math.round(600+800*u)} kHz`:`${(88+20*u).toFixed(1)} MHz`;
const text=(x,y,s,size=15,color='#203d49',anchor='start')=>`<text x="${x}" y="${y}" fill="${color}" font-family="system-ui,sans-serif" font-size="${size}" text-anchor="${anchor}">${s}</text>`;
const line=(d,color,width=2.5,extra='')=>`<path d="${d}" fill="none" stroke="${color}" stroke-width="${width}" ${extra}/>`;
function wave(x,y,w,amp,cycles,color){let d='';for(let k=0;k<=360;k++){let u=k/360;d+=(k?'L':'M')+(x+w*u).toFixed(2)+' '+(y-amp*Math.sin(TAU*cycles*(u-time))).toFixed(2);}return line(d,color);}
function readings(){return stations.map(s=>({...s,g:response(s.u)}));}
function carrier(st){return 20*st.u;}
function sample(st,u){const t=u-time,m=Math.sin(TAU*st.tone*t);return mode==='am'?(.6+.34*m)*Math.sin(TAU*carrier(st)*t):.9*Math.sin(TAU*carrier(st)*t-1.2*Math.cos(TAU*st.tone*t));}
function detail(best,recovered){
 const arrow=(x,y,end)=>line(`M${x} ${y}H${end}m-10-6l10 6-10 6`,'#237b9a',3);
 let s='';
 if(step===0){
  stations.forEach((st,i)=>{s+=text(22,32+i*75,st.tag+' · '+st.name,17,st.color)+wave(22,57+i*75,165,17,8+i*3,st.color);});
  s+=arrow(202,132,250)+line('M285 242V82m-35-35l35 35 35-35','#203d49',6)+arrow(322,132,360);
  let d='';for(let k=0;k<=500;k++){let u=k/500,v=stations.reduce((a,st,i)=>a+Math.sin(TAU*(8+i*3)*(u-time)),0)/3;d+=(k?'L':'M')+(380+195*u).toFixed(2)+' '+(132-35*v).toFixed(2);}s+=line(d,'#237b9a',2.5)+text(380,207,'Combined electrical',17)+text(380,230,'signal in the antenna',17)+text(25,290,'The antenna receives several broadcasts together.',19);
 }else if(step===2){
  const a=best.g;let d='',env='';for(let k=0;k<=500;k++){const u=k/500,m=Math.sin(TAU*best.tone*(u-time)),v=sample(best,u);d+=(k?'L':'M')+(25+220*u).toFixed(2)+' '+(108-40*a*v).toFixed(2);env+=(k?'L':'M')+(25+220*u).toFixed(2)+' '+(108-40*a*(.6+.34*m)).toFixed(2);}
  s+=text(25,35,mode.toUpperCase()+' signal from tuner',19)+line(d,best.color,2.2)+(mode==='am'?line(env,'#b45739',2,'stroke-dasharray="6 4"'):'')+arrow(257,108,335)+text(270,83,'Recover',14)+text(270,144,'audio',14)+wave(350,108,220,32*recovered,best.tone,'#b45739')+text(350,35,'Electrical audio',19)+text(30,220,mode==='am'?'AM: follow the changing envelope.':'FM: follow changes in cycle spacing.',20)+text(30,253,'The fast carrier is not the sound wave.',18);
 }else if(step===3){
  s+=text(25,35,'Before amplifier',19)+text(355,35,'After amplifier',19)+wave(25,145,200,18*recovered,best.tone,'#b45739')+wave(355,145,220,18*recovered*volume*2.6,best.tone,'#b45739')+`<path d="M255 107v76l68-38Z" fill="#dbe7df" stroke="#203d49" stroke-width="3"/>`+line('M290 70v45','#b45739',3)+text(242,55,'Battery energy',16)+text(25,245,'Same audio pattern. Different amplitude.',20)+text(25,277,'Move Volume: the output changes, not the station.',18);
 }else if(step===4){
  const strength=recovered*volume;
  s+=wave(20,135,160,38*strength,best.tone,'#b45739')+arrow(190,135,230)+`<path d="M248 112h33l57-45v136l-57-45h-33Z" fill="#d4e2d9" stroke="#203d49" stroke-width="3"/><g transform="translate(${(strength*10*Math.sin(-TAU*best.tone*time)).toFixed(2)} 0)"><path d="M343 65v140" stroke="${best.color}" stroke-width="7"/></g>`;
  if(strength>.01)s+=`<g transform="translate(${(time*60%24).toFixed(2)} 0)" opacity="${strength.toFixed(3)}">`+line('M385 104Q423 135 385 169M430 80Q490 135 430 190M475 56Q559 135 475 214','#b45739',4)+'</g>';
  s+=text(20,225,'Electrical audio',17)+text(250,242,'Cone motion',17)+text(420,242,'Sound in air',17)+text(25,288,strength>.01?'More volume → larger cone motion in this model.':'No output: tune a station and raise the volume.',18);
 }
 $('rxFocusScene').innerHTML=s;$('rxFocusScene').setAttribute('aria-label',['Antenna: three incoming station waves combine into an electrical signal.','Tuner: select a frequency band.','Demodulator: selected modulated radio input becomes electrical audio.','Amplifier: output amplitude changes with volume, using battery energy.','Speaker: electrical audio moves the cone and produces sound in air.'][step]);
 host.classList.toggle('tuner-view',step===1);
 $('rxFocus').hidden=step===1;$('rxSpectrumWrap').hidden=step!==1;$('rxTuningControls').hidden=step!==1;$('rxFlow').hidden=step!==1;$('rxVolumeControls').hidden=step<3;$('rxResult').hidden=step===0;
}
function render(){
 const narrow=innerWidth<600,W=narrow?430:850,left=narrow?28:40,right=W-25,span=right-left,base=95,top=25;
 const r=readings(),best=r.reduce((a,b)=>a.g>b.g?a:b),clear=best.g>.85,usable=best.g>.18;
 $('rxSpectrum').setAttribute('viewBox',`0 0 ${W} 138`);
 let d='',area='';for(let k=0;k<=400;k++){let u=k/400,x=left+span*u,y=base-(base-top)*response(u);d+=(k?'L':'M')+x.toFixed(2)+' '+y.toFixed(2);}
 area=d+`L${right} ${base}L${left} ${base}Z`;
 const lo=left+span*Math.max(0,tune-.065),hi=left+span*Math.min(1,tune+.065);
 let s=`<rect x="${lo}" y="15" width="${hi-lo}" height="${base-15}" fill="#237b9a" fill-opacity=".12"/><path d="${area}" fill="#237b9a" fill-opacity=".16"/>`+line(d,'#237b9a',2.5)+line(`M${left} ${base}H${right}`,'#80969b',1.5);
 s+=text(left,16,'Filter',14);
 r.forEach(st=>{const x=left+span*st.u;s+=line(`M${x} ${base}V${top+7}`,st.color,4)+text(x,base+23,st.tag,narrow?13:17,st.color,'middle');});
 const cx=left+span*tune;s+=`<circle cx="${cx}" cy="${top}" r="5" fill="#237b9a"/>`;
 $('rxSpectrum').innerHTML=s;
 $('rxAM').setAttribute('aria-pressed',String(mode==='am'));$('rxFM').setAttribute('aria-pressed',String(mode==='fm'));
 $('rxModulation').textContent=mode==='am'?'AM: different carrier frequencies identify the stations. Changing amplitude carries the audio.':'FM: different carrier frequencies identify the stations. Each signal keeps its height while cycle spacing changes to carry the audio.';
 const challengeText=challenge?(Math.abs(tune-.5)<.02?'Weather found! B passes strongly; A and C are suppressed.':'Find station B using Tuning. Watch its outgoing wave grow as the blue window approaches it.'):'All traces use the same time scale. More cycles means a higher carrier frequency.';
 if($('rxChallengeResult').textContent!==challengeText)$('rxChallengeResult').textContent=challengeText;
 $('rxFrequency').textContent=frequency(tune);$('rxTune').setAttribute('aria-valuetext',frequency(tune));$('rxNeedle').style.transform=`rotate(${-135+tune*270}deg)`;
 let bars=line('M25 122H275','#adbdbe',1);
 r.forEach((st,i)=>{let x=55+i*95,h=80*st.g;bars+=`<rect x="${x-13}" y="${122-h}" width="26" height="${Math.max(.7,h)}" rx="3" fill="${st.color}"/>`+text(x,144,st.tag+' '+st.name,12,st.color,'middle')+text(x,Math.max(27,115-h),`${Math.round(st.g*100)}%`,13,'#203d49','middle');});
 bars+=text(15,18,'Relative signal amplitude',12);$('rxPassed').innerHTML=bars;
 const recovered=usable?best.g:0; // Threshold represents a simplified usable-signal decision, not demodulator circuitry.
 $('rxAudio').innerHTML=line('M15 87H285','#bac9c9',1)+wave(15,87,270,18*recovered,best.tone,best.color)+text(150,145,usable?`${best.tag} · ${best.name} audio`:'No usable station',15,'#203d49','middle')+text(150,24,'Before amplification',12,'#526d75','middle');
 const gain=volume*2.6,amp=18*recovered*gain;
 let out=wave(15,60,160,amp,best.tone,best.color)+text(95,125,'After amplification',12,'#526d75','middle');
 out+=`<path d="M193 53h15l27-23v61l-27-23h-15Z" fill="#d5dfd9" stroke="#203d49" stroke-width="2"/><g transform="translate(${(recovered*volume*4*Math.sin(-TAU*best.tone*time)).toFixed(2)} 0)"><path d="M238 29V93" stroke="${best.color}" stroke-width="4"/></g>`;
 if(amp>.3)out+=`<g transform="translate(${(time*60%24).toFixed(2)} 0)" opacity="${Math.max(.12,volume*recovered).toFixed(3)}">`+line('M250 45Q268 60 250 77M265 32Q292 60 265 90',best.color,3)+'</g>';
 out+=text(150,151,volume===0?'Muted':usable?'Speaker moves the air':'Turn the tuner to a station',13,'#203d49','middle');$('rxSpeaker').innerHTML=out;
 $('rxVolumeValue').textContent=Math.round(volume*100)+'%';
 const result=clear?`${best.name} selected. Its signal passes strongly; the amplifier controls the speaker output.`:usable?`Near ${best.name}. Its signal is weakened by the filter. Tune toward ${frequency(best.u)}.`:'Between stations. Little signal passes. More volume cannot select the right station.';
 if($('rxResult').textContent!==result)$('rxResult').textContent=result;
 $('rxResult').classList.toggle('rx-locked',clear);
 $('rxSpectrum').setAttribute('aria-label',`Tuned to ${frequency(tune)}. `+r.map(st=>`${st.name}: ${Math.round(st.g*100)} percent signal amplitude passes`).join('. '));
 detail(best,recovered);journey(best,recovered);
 document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===step)));
}

function journey(best,recovered){
 const xs=[12,182,352,522,692],labels=['Antenna','Tuner','Demodulator','Amplifier','Speaker'];
 let s='';
 xs.forEach((x,i)=>{s+=`<rect x="${x}" y="6" width="146" height="160" rx="12" fill="${i===step?'#e0efe9':'#fafbf6'}" stroke="${i===step?'#237b9a':'#c8d4cd'}"/>`+text(x+73,29,labels[i],15,'#203d49','middle');if(i<4)s+=line(`M${x+149} 88h17m-6-5l6 5-6 5`,'#237b9a',2);});
 let mix='',filtered='';
 for(let k=0;k<=200;k++){
  const u=k/200;let a=0,b=0;
  stations.forEach((st,i)=>{const m=Math.sin(TAU*st.tone*(u-time)),v=sample(st,u);a+=v/3;b+=v*response(st.u);});
  mix+=(k?'L':'M')+(24+122*u).toFixed(2)+' '+(88-29*a).toFixed(2);
  filtered+=(k?'L':'M')+(194+122*u).toFixed(2)+' '+(88-29*b).toFixed(2);
 }
 s+=line(mix,'#526d75',1.6)+line(filtered,best.color,1.6)+wave(364,88,122,13*recovered,best.tone,'#b45739')+wave(534,88,122,13*recovered*volume*2.6,best.tone,'#b45739');
 const motion=recovered*volume*9*Math.sin(-TAU*best.tone*time);
 s+=`<path d="M715 76h18l25-20v64l-25-20h-18Z" fill="#d4e2d9" stroke="#203d49" stroke-width="2"/><path d="M${764+motion} 54v68" stroke="#b45739" stroke-width="4"/>`;
 if(recovered*volume>.01)for(let i=0;i<3;i++){const q=(time*best.tone+i/3)%1, x=777+q*43;s+=line(`M${x} ${78-q*20}Q${x+12} 88 ${x} ${98+q*20}`,'#b45739',2,`opacity="${((1-q)*recovered*volume).toFixed(3)}"`);}
 ['Signals combine','One station passes','Audio recovered','Amplitude changes','Air moves'].forEach((v,i)=>s+=text(xs[i]+73,149,v,12,'#526d75','middle'));
 $('rxJourney').innerHTML=s;
 const selected=best.g>.5;
 let flow=text(190,32,'IN',23,'#203d49','middle')+text(745,32,'OUT',23,'#203d49','middle')+`<rect x="345" y="49" width="215" height="365" rx="15" fill="#e0edf0"/>`+text(452,32,'FILTER',16,'#237b9a','middle');
 stations.forEach(st=>{const i=stations.indexOf(st),y=112+i*120,g=response(st.u),chosen=selected&&st.tag===best.tag;let input='',output='',match='';
  if(chosen)flow+=`<rect x="345" y="${y-52}" width="575" height="104" rx="16" fill="${st.color}" fill-opacity=".12" stroke="${st.color}" stroke-width="2"/>`;
  for(let k=0;k<=480;k++){const u=k/480,v=sample(st,u),prefix=k?'L':'M';input+=prefix+(60+260*u).toFixed(2)+' '+(y-42*v).toFixed(2);output+=prefix+(590+310*u).toFixed(2)+' '+(y-42*g*v).toFixed(2);match+=prefix+(365+175*u).toFixed(2)+' '+(y-23*Math.sin(TAU*carrier(st)*(u-time))).toFixed(2);}
  flow+=text(18,y+8,st.tag,25,st.color)+line(`M60 ${y}H320M590 ${y}H900`,'#d1dcda',1)+line(input,st.color,3)+line(output,st.color,3);
  if(chosen){flow+=line(match,st.color,2.5)+text(452,y-33,st.tag+' · '+frequency(st.u),15,st.color,'middle')+line(`M549 ${y}h32m-10-9l10 9-10 9`,st.color,3)+`<circle cx="912" cy="${y}" r="5" fill="${st.color}"/>`;}
  else flow+=line(`M441 ${y-9}l20 18m-20 0l20-18`,'#91a6aa',2);
 });
 $('rxFilterAnimation').setAttribute('viewBox',innerWidth<600?'0 0 390 425':'0 0 940 430');
 if(innerWidth<600){ let mobile='';
 stations.forEach((st,i)=>{const y=61+i*123,g=response(st.u);let a='',b='';for(let k=0;k<=300;k++){const u=k/300,v=sample(st,u),p=k?'L':'M';a+=p+(20+148*u).toFixed(2)+' '+(y-23*v).toFixed(2);b+=p+(222+148*u).toFixed(2)+' '+(y-23*g*v).toFixed(2);}
 mobile+=text(20,y-33,st.tag+' · '+frequency(st.u),16,st.color)+line(`M20 ${y}H168M222 ${y}H370`,'#c8d4cd',1)+line(a,st.color,2)+line(b,st.color,2)+line(`M181 ${y}h27m-7-5l7 5-7 5`,'#237b9a',2)+text(222,y+46,Math.round(g*100)+'% passes',15,st.color);});
 $('rxFilterAnimation').innerHTML=text(20,20,'Incoming',17)+text(222,20,'After filter',17)+'<g transform="translate(0 24)">'+mobile+'</g>';
}else $('rxFilterAnimation').innerHTML=flow;
}
function animate(stamp){frame=0;if(!active||!running||document.hidden){previous=null;return;}if(previous!==null)time+=Math.min(stamp-previous,60)/1000*.16;previous=stamp;render();frame=requestAnimationFrame(animate);}
function playback(a,p){active=a;running=p;if(frame)cancelAnimationFrame(frame);frame=0;previous=null;if(active&&running&&!document.hidden)frame=requestAnimationFrame(animate);}
document.addEventListener('visibilitychange',()=>playback(active,running));

function tuneTo(value){tune=Math.max(0,Math.min(1,Number(value)/1000));$('rxTune').value=Math.round(tune*1000);render();}
$('rxTune').addEventListener('input',e=>tuneTo(e.target.value));$('rxVolume').addEventListener('input',e=>{volume=Number(e.target.value)/100;render();});
$('rxMinus').onclick=()=>tuneTo(tune*1000-5);$('rxPlus').onclick=()=>tuneTo(tune*1000+5);
$('rxChallenge').onclick=()=>{challenge=true;tuneTo(350);};
window.addEventListener('resize',render);
window.radioReceiver={playback,render(n,m){step=n;mode=m;render();},reset(m){challenge=false;time=0;tune=.50;volume=.55;step=1;mode=m;$('rxTune').value=500;$('rxVolume').value=55;render();},model:{response,stations,carrier,sample},getState:()=>({time,tune,volume,mode,passed:readings().map(s=>s.g)})};
render();
})();

</script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),reduced=matchMedia('(prefers-reduced-motion: reduce)');let current=0,mode='am',complete=false;const visited=new Set();
const steps=[['Antenna: receive the field','An arriving radio wave produces a tiny changing electrical signal in the antenna. It is not yet sound in air.'],['Tuner: select a station','Many broadcasts can reach the antenna. The tuner selects a frequency band around the desired station; the volume control does not select a station.'],['Demodulator: recover the audio','For AM, recover the changing amplitude envelope. For FM, recover the frequency variations. This produces an electrical audio signal.'],['Amplifier: strengthen the audio','The amplifier uses energy from the radio’s power supply to drive the speaker. The broadcast signal carries information; it does not supply all the speaker’s power.'],['Speaker: move the air','The electrical audio signal moves the speaker cone. The cone vibrates the nearby air, producing sound. Radio waves and sound waves are different.']];
function show(n){current=n;visited.add(n);$('stepTitle').textContent=steps[n][0];$('stepBody').textContent=steps[n][1];window.radioReceiver.render(n,mode);document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===n)));if(visited.size===5&&!complete){complete=true;window.parent.postMessage({ type: 'complete' }, '*');}}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>show(+b.dataset.step));
function band(m){mode=m;$('bandAM').setAttribute('aria-pressed',String(m==='am'));$('bandFM').setAttribute('aria-pressed',String(m==='fm'));show(current);}
$('bandAM').onclick=()=>band('am');$('bandFM').onclick=()=>band('fm');$('rxAM').onclick=()=>band('am');$('rxFM').onclick=()=>band('fm');
function playback(){window.radioReceiver.playback(true,!reduced.matches);}
reduced.addEventListener('change',playback);show(0);playback();
})();
</script></main></body></html>
