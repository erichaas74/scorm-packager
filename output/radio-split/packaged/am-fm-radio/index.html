<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AM &amp; FM: Watch and Match</title><style>
:root{--ink:#203d49;--blue:#237b9a;--rust:#b45739;--paper:transparent;--line:#d4dfdf;--gold:#ad7918}*{box-sizing:border-box}body{margin:0;background:#eaece7;color:var(--ink);font:16px/1.45 system-ui,sans-serif}main{max-width:1060px;margin:auto;padding:22px}h1{font-size:clamp(22px,4vw,34px);font-weight:650;letter-spacing:-1px;margin:0 0 14px;white-space:nowrap}.stage{background:var(--paper);border:1px solid #ccd7d6;border-radius:18px;overflow:hidden;box-shadow:none}.stage-top{padding:18px 24px 0;display:flex;align-items:center;justify-content:space-between;gap:14px}.mode{font-size:21px;font-weight:650}.hint{font-size:13px;color:#5b7077}.graph{display:block;width:100%;height:auto}.graph text{font-family:system-ui,sans-serif;fill:var(--ink)}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px;align-items:center}button{font:inherit;color:var(--ink);background:white;border:1px solid #bbc9cb;border-radius:9px;min-height:44px;padding:9px 15px;cursor:pointer;transition:background .15s}button:hover{background:#edf4f3}button:focus-visible{outline:3px solid #ad7918;outline-offset:3px}button[aria-pressed=true],button[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:white}.sep{flex:1}.swatch{display:inline-block;width:17px;height:4px;background:var(--blue);vertical-align:middle;margin-right:7px}.swatch.dash{height:0;border-top:3px dashed var(--rust);background:none}.question{padding:0 24px 18px}.question p{margin:0}.answers{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}.feedback{min-height:48px;margin-top:10px!important;font-size:15px;max-width:850px}.answer.good{border:2px solid #26765b;background:#eef7f0}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}.receiver{padding:20px 24px 22px}.receiver svg{width:100%;height:auto;display:block}.chain{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}.chain button{padding:12px 4px;font-size:14px}.steptext{background:#e9efeb;border-radius:10px;padding:15px;margin-top:14px;min-height:91px}.steptext strong{display:block;margin-bottom:5px}.steptext p{margin:0}.trace{fill:none;stroke-width:2.1;stroke-linejoin:round;stroke-linecap:round}.fine{color:#61757b;font-size:12px}.receiver-label{font:17px system-ui,sans-serif;fill:var(--ink)}@media(max-width:600px){main{padding:12px 8px}.stage-top{padding:14px 14px 0;align-items:flex-start;flex-direction:column;gap:2px}.question{padding:0 14px 14px}.receiver{padding:12px}.chain{grid-template-columns:repeat(3,1fr)}.controls button{font-size:14px;padding:8px 11px}.sep{display:none}.feedback{min-height:80px}.hint{font-size:12px}.mode{font-size:18px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

html,body{background:transparent}
.stage{border:5px solid #285f9f}.feedback{min-height:74px;font-size:17px}.feedback strong{display:block;font-size:22px}.feedback.correct{color:#1d644c}.feedback.incorrect{color:#923d28}
.question{padding-bottom:10px}.answers{margin:6px 0 0}.answers button{flex:1}.controls{margin-top:6px}button:disabled{cursor:default;opacity:.75}
.demo-note{font-size:18px;font-weight:600;min-height:30px;margin-bottom:8px!important}.hint{max-width:400px}.swatch{background:#237b9a}.answer.good{color:#1d644c}
@media(max-width:600px){h1{font-size:23px;letter-spacing:-.7px}.feedback{min-height:110px;font-size:15px}.feedback strong{font-size:20px}.demo-note{font-size:16px;min-height:48px}.answers button{padding:9px 8px}.stage-top{gap:5px}.hint{font-size:12px}}
.comparison{display:block;width:100%;height:auto}.comparison text{font-family:system-ui,sans-serif}.stage-top .mode{font-size:20px}
.frequency-key{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:#526176;margin:0 0 12px}.frequency-ramp{height:7px;width:100px;border-radius:5px;background:linear-gradient(90deg,hsl(5 35% 43%),hsl(71 35% 43%),hsl(137 35% 43%),hsl(204 35% 43%),hsl(270 35% 43%))}.frequency-key small{font-size:12px}@media(max-width:600px){.frequency-key{gap:6px;font-size:12px}.frequency-ramp{width:65px}.frequency-key small{flex-basis:100%}}
</style></head><body><main>
<h1>AM &amp; FM: Watch and Match</h1><div class="stage"><div class="stage-top"><span class="mode" id="modeLabel"></span><span class="hint">Same audio · same time window · schematic frequencies</span></div>
<svg id="comparison" class="comparison" role="img" aria-label="The same audio modulates two radio signals: AM changes amplitude with equal carrier-cycle spacing; FM changes frequency with constant amplitude."></svg>
<svg class="graph" viewBox="0 0 960 375" role="img" aria-labelledby="graphTitle graphDesc"><title id="graphTitle">AM signal comparison</title><desc id="graphDesc">Three traces over the same time interval: an audio signal, an unmodulated carrier, and the transmitted radio signal.</desc>
<defs><linearGradient id="matchingFrequencyTint" x1="0%" x2="100%" y1="0%" y2="0%"></linearGradient><pattern id="grid" width="72" height="28" patternUnits="userSpaceOnUse"><path d="M72 0H0V28" fill="none" stroke="#dce4df" stroke-width=".7"/></pattern></defs>
<rect x="210" y="26" width="720" height="302" fill="url(#grid)"/>
<g stroke="#aebfbe" stroke-width="1"><path d="M210 77H930M210 177H930M210 277H930"/></g>
<g font-size="17" font-weight="600"><text x="24" y="73">Audio signal</text><text x="24" y="173">Carrier alone</text><text x="24" y="273">Radio signal</text></g>
<g font-size="12"><text x="24" y="95">Information to send</text><text x="24" y="195">Reference oscillation</text><text x="24" y="295">Sent by the antenna</text><text x="210" y="351">Earlier</text><text x="850" y="351">Later →</text><text x="450" y="351">Time (same scale)</text></g>
<path id="audio" class="trace" stroke="#b45739"/><path id="carrier" class="trace" stroke="#667e82"/><path id="radio" class="trace" stroke="#237b9a"/>
<path id="envelope" fill="none" stroke="#b45739" stroke-width="1.8" stroke-dasharray="6 5" hidden/>
<g id="fmGuides" hidden stroke="#ad7918" stroke-width="2"><path id="fmGuidePath"/><text x="650" y="228" stroke="none" fill="#805a13" font-size="13">Closer cycles ↔ higher frequency</text></g>
</svg><div class="question"><div id="frequencyKey" class="frequency-key"><span>Lower frequency</span><span class="frequency-ramp" aria-hidden="true"></span><span>Higher frequency</span><small>Color is a guide to frequency.</small></div><p class="demo-note" id="demoNote"></p><div class="answers" id="answers" hidden><button class="answer" data-answer="am"><span class="swatch"></span>AM · amplitude</button><button class="answer" data-answer="fm"><span class="swatch"></span>FM · frequency</button></div><p class="feedback" id="feedback" role="status" aria-live="polite"></p></div></div><div class="controls"><button id="replay">Replay</button></div><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),reduced=matchMedia('(prefers-reduced-motion: reduce)'),TAU=Math.PI*2;
let mode='am',phase=0,answered=true,plot,stage=0,elapsed=0,last=0,raf=0,completed=false;
const cases=['fm','am'];
const evidence={am:'Amplitude follows the audio; carrier-cycle spacing stays constant.',fm:'Frequency follows the audio; radio-signal amplitude stays constant.'};
function sample(u,p=phase){const a=Math.sin(TAU*2*(u+p));return {a,carrier:Math.sin(TAU*18*(u+p)),am:(.60+.34*a)*Math.sin(TAU*18*(u+p)),fm:Math.sin(TAU*18*(u+p)-2*Math.cos(TAU*2*(u+p)))};}
function layout(){const narrow=innerWidth<=600,svg=document.querySelector('.graph');plot=narrow?{left:20,width:390,centers:[100,220,340],scale:31}:{left:210,width:720,centers:[77,177,277],scale:43};svg.setAttribute('viewBox',narrow?'0 0 430 450':'0 0 960 375');const rect=svg.querySelector('rect');rect.setAttribute('x',plot.left);rect.setAttribute('width',plot.width);rect.setAttribute('height',narrow?370:302);svg.querySelector('g[stroke="#aebfbe"] path').setAttribute('d',plot.centers.map(y=>`M${plot.left} ${y}h${plot.width}`).join(''));const labels=svg.querySelectorAll('g[font-weight="600"] text'),notes=svg.querySelectorAll('g[font-size="12"] text');labels.forEach((el,i)=>{el.setAttribute('font-size',narrow?20:17);el.setAttribute('x',narrow?20:24);el.setAttribute('y',narrow?37+i*120:73+i*100);});notes.forEach((el,i)=>{el.setAttribute('font-size',narrow?16:12);if(i<3){el.setAttribute('x',narrow?20:24);el.setAttribute('y',narrow?55+i*120:95+i*100);}else{el.setAttribute('x',narrow?[20,350,150][i-3]:[210,850,450][i-3]);el.setAttribute('y',narrow?430:351);}});const fmText=$('fmGuides').querySelector('text');fmText.setAttribute('x',narrow?20:650);fmText.setAttribute('y',narrow?390:228);fmText.setAttribute('font-size',narrow?16:13);fmText.textContent=narrow?'Closer cycles = higher f':'Closer cycles ↔ higher frequency';draw();}
function path(fn,center,scale){let s='';for(let k=0;k<=1500;k++){const u=k/1500;s+=(k?'L':'M')+(plot.left+plot.width*u).toFixed(2)+' '+(center-scale*fn(u)).toFixed(2);}return s;}
function frequencyStops(){
 // FM instantaneous frequency is 18 + 4*a; color encodes that frequency,
 // not visible-light wavelength. The muted hue ramp is identical in both views.
 let stops='';for(let k=0;k<=120;k++){const u=k/120,hue=5+265*(sample(u).a+1)/2;stops+=`<stop offset="${100*u}%" stop-color="hsl(${hue.toFixed(1)} 35% 43%)"/>`;}return stops;
}
function drawComparison(){
 const narrow=innerWidth<=600,W=narrow?430:960,left=narrow?20:230,width=narrow?390:700,centers=narrow?[88,222,356,490]:[65,170,275,380],scale=narrow?29:33;
 const curve=(fn,y,amp)=>{let d='';for(let k=0;k<=900;k++){const u=k/900;d+=(k?'L':'M')+(left+width*u).toFixed(2)+' '+(y-amp*fn(u)).toFixed(2);}return d;};
 const trace=(d,color,extra='')=>`<path d="${d}" fill="none" stroke="${color}" stroke-width="2.1" ${extra}/>`;
 const label=(x,y,t,size,color='#203d49')=>`<text x="${x}" y="${y}" font-size="${size}" fill="${color}">${t}</text>`;
 const names=['Audio signal','Carrier alone','AM radio','FM radio'],notes=['Information to send','Reference oscillation','Amplitude changes','Frequency changes'],keys=['a','carrier','am','fm'],colors=['#b45739','#667e82','#237b9a','#237b9a'];
 let html='<defs><linearGradient id="comparisonFrequencyTint" x1="0%" x2="100%" y1="0%" y2="0%">'+frequencyStops()+'</linearGradient></defs>';centers.forEach((y,i)=>{html+=trace(`M${left} ${y}h${width}`,'#c4d0d3','stroke-dasharray="3 5"');html+=label(narrow?20:24,narrow?y-57:y-4,names[i],narrow?22:20);html+=label(narrow?20:24,narrow?y-36:y+20,notes[i],narrow?17:16,i>1?'#237b9a':'#526d75');html+=trace(curve(u=>sample(u)[keys[i]],y,scale),i===3?'url(#comparisonFrequencyTint)':colors[i]);});
 html+=trace(curve(u=>.60+.34*sample(u).a,centers[2],scale)+curve(u=>-(.60+.34*sample(u).a),centers[2],scale),'#b45739','stroke-dasharray="6 5"');
 let markers='';for(let j=1;j<899;j++){const u=j/900;if(sample(u).fm>sample(u-1/900).fm&&sample(u).fm>sample(u+1/900).fm){const x=left+width*u;markers+=`M${x} ${centers[3]+scale+4}v7`;}}
 html+=trace(markers,'#ad7918');
 html+=label(left,narrow?580:440,'Earlier',narrow?17:13)+label(narrow?150:470,narrow?580:440,'Same time scale',narrow?17:13)+label(narrow?345:855,narrow?580:440,'Later →',narrow?17:13);
 $('comparison').setAttribute('viewBox',narrow?'0 0 430 605':'0 0 960 460');$('comparison').innerHTML=html;
}
function draw(){if(stage<2){drawComparison();return;}const [a,c,r]=plot.centers,s=plot.scale; $('audio').setAttribute('d',path(u=>sample(u).a,a,s*.79));$('carrier').setAttribute('d',path(u=>sample(u).carrier,c,s*.86));$('radio').setAttribute('d',path(u=>sample(u)[mode],r,s));$('matchingFrequencyTint').innerHTML=frequencyStops();$('radio').setAttribute('stroke',mode==='fm'?'url(#matchingFrequencyTint)':'#237b9a');
if(answered&&mode==='am')$('envelope').setAttribute('d',path(u=>.60+.34*sample(u).a,r,s)+path(u=>-(.60+.34*sample(u).a),r,s));
if(answered&&mode==='fm'){let highs=[];for(let j=1;j<1499;j++){const u=j/1500;if(sample(u).fm>sample(u-1/1500).fm&&sample(u).fm>sample(u+1/1500).fm)highs.push(plot.left+plot.width*u);} $('fmGuidePath').setAttribute('d',highs.map(x=>`M${x.toFixed(1)} ${r-s-4}v7`).join(''));}
}

function complete(){if(!completed){completed=true;window.parent.postMessage({ type: 'complete' }, '*');}}
function sync(){
 const demo=stage<2,done=stage===4;
 mode=demo?(stage===0?'am':'fm'):cases[Math.min(stage-2,1)];
 document.querySelector('.graph').toggleAttribute('hidden',demo);$('comparison').toggleAttribute('hidden',!demo);
 $('modeLabel').textContent=demo?'AM and FM together':done?'AM and FM matched':'Match signal '+(stage===2?'A':'B');
 $('demoNote').textContent=demo?(stage===0?'AM: the envelope follows the audio.':'FM: cycle spacing follows the audio.'):done?'AM changes amplitude. FM changes frequency.':'Match the radio signal to its modulation.';
 $('answers').hidden=demo||done;$('frequencyKey').hidden=!(demo||(answered&&mode==='fm'));
 document.querySelectorAll('.answer').forEach(b=>{b.disabled=answered;b.classList.toggle('good',!demo&&answered&&b.dataset.answer===mode);});
 $('envelope').toggleAttribute('hidden',!(answered&&mode==='am'));$('fmGuides').toggleAttribute('hidden',!(answered&&mode==='fm'));
 $('graphTitle').textContent=demo?mode.toUpperCase()+' demonstration':done?'Matched radio signal':'Unlabeled radio signal';
 $('graphDesc').textContent=answered?evidence[mode]:'Audio, carrier and radio traces share the same time window. Match the varying property to AM or FM.';
 $('feedback').className='feedback';
 if(demo)$('feedback').textContent=stage===0?'AM keeps carrier-cycle spacing constant. Compare it with FM below.':'FM keeps amplitude constant. Closer cycles mean higher frequency. Matching follows automatically.';
 else if(done){$('feedback').innerHTML='<strong>✓ Matching complete</strong>Replay to watch the demonstrations and match again.';complete();}
 else if(!answered)$('feedback').textContent='Select AM or FM. The evidence appears after your choice.';
 draw();
}
function advance(){stage++;elapsed=0;phase=0;answered=stage<2||stage===4;sync();}
function tick(t){raf=0;if(document.hidden){last=0;return;}const dt=last?Math.min(t-last,100):0;last=t;
 if(stage<2||(!answered&&stage<4)){if(!reduced.matches)phase+=dt/1000*.025;draw();}
 if(stage<2||(answered&&stage<4)){elapsed+=dt;if(elapsed>=(stage<2?8000:3000))advance();}
 if(stage<4)raf=requestAnimationFrame(tick);
}
function start(){if(!raf&&stage<4&&!document.hidden)raf=requestAnimationFrame(tick);}
document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{if(answered||stage<2||stage>3)return;answered=true;elapsed=0;last=0;const correct=b.dataset.answer===mode;sync();$('feedback').className='feedback '+(correct?'correct':'incorrect');$('feedback').innerHTML='<strong>'+(correct?'✓ CORRECT':'✕ NOT QUITE')+' — '+mode.toUpperCase()+'</strong>'+evidence[mode];});
$('replay').onclick=()=>{cancelAnimationFrame(raf);raf=0;stage=0;elapsed=0;phase=0;last=0;answered=true;sync();start();};
document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);raf=0;last=0;start();});
window.addEventListener('resize',layout);reduced.addEventListener('change',draw);layout();sync();start();
})();
</script></main></body></html>
