<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Can Another Filter Restore Light?</title>
<style>
html, body { background: transparent; }
* { box-sizing: border-box; }
body { margin: 0; padding: 12px; color: #172f46; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
.lesson { width: min(100%, 1040px); margin: auto; border: 2px solid #527797; border-radius: 12px; overflow: hidden; background: #fff; }
h1 { margin: 0; padding: 16px 8px; background: #eef5fa; font-size: clamp(.78rem, 2.7vw, 1.5rem); line-height: 1.3; text-align: center; white-space: nowrap; font-weight: 750; }
.content { padding: 12px; }
.stage { overflow: hidden; border: 1px solid #bdcdd8; border-radius: 8px; background: #fff; }
.stage svg { display: block; width: 100%; height: auto; background: #fff; }
.stage svg text { font-family: system-ui, sans-serif; font-size: 20px; font-weight: 550; fill: #102c40; }
.stage svg .small { font-size: 18px; }
.stage svg .strong { font-weight: 700; }
.stage svg .isotope { font-size: 28px; font-weight: 600; }
.stage svg .equation-small { font-size: 17px; }
.message { min-height: 100px; padding: 15px 18px; border-top: 1px solid #d2dfe7; background: #f5f9fc; }
.message p { margin: 0; line-height: 1.5; }
#prompt { font-size: 1rem; font-weight: 700; }
#explanation { margin-top: 6px; color: #284358; }
.buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
button { flex: 1 1 160px; padding: 11px 14px; min-height: 46px; border: 1.5px solid #376a92; border-radius: 7px; background: #f8fbfd; color: #173e5c; font: inherit; font-weight: 650; cursor: pointer; }
button:hover:not(:disabled) { background: #e4eff7; }
button:focus-visible { outline: 3px solid #aa4f1c; outline-offset: 2px; }
button:disabled { cursor: default; }
.utility { flex: 0 1 auto; border-color: #9db5c6; }
[hidden] { display: none !important; }
@media(max-width: 760px) { body { padding: 4px; } .content { padding: 5px; } .message { padding: 12px; } button { font-size: .92rem; flex-basis: 140px; } .utility { flex-basis: auto; } .stage svg .small { font-size: 20px; } }

</style>
<style>
#mind-blown { float: right; margin: 0 4px 8px 14px; font-size: 3rem; line-height: 1.2; transform-origin: center; }
#mind-blown:not([hidden]) { animation: mind-blown-pop 1.4s ease-out; }
@keyframes mind-blown-pop {
  0% { opacity: 0; transform: scale(.25) rotate(-18deg); }
  35% { opacity: 1; transform: scale(1.3) rotate(12deg); }
  55% { transform: scale(.9) rotate(-8deg); }
  75% { transform: scale(1.1) rotate(4deg); }
  100% { transform: scale(1) rotate(0); }
}
@media (prefers-reduced-motion: reduce) { #mind-blown:not([hidden]) { animation: none; } }
</style>
</head>
<body>
<main class="lesson">
<h1>Can Another Filter Restore Light?</h1>
<div class="content">
<div class="stage">
<svg id="scene" viewBox="0 0 840 450" role="img" aria-label="One polarizing filter between a lamp and screen"></svg>
<div class="message" role="status" aria-live="polite"><span id="mind-blown" hidden aria-hidden="true">🤯</span><p id="prompt">One filter: 50% transmitted.</p><p id="explanation">Polarized light oscillates in one fixed direction.</p></div>
</div>
<div class="buttons" role="group" aria-label="Prediction and playback">
<button id="start" hidden>Turn on light</button>
<button id="advance" hidden>Rotate the second filter</button>
<button data-choice="0" hidden>Still no light</button>
<button data-choice="1" hidden>Some light returns</button>
<button class="utility" id="pause" hidden>Pause</button>
<button class="utility" id="replay">Replay</button>
</div>
</div>
</main>
<script>window.walkthroughLesson = {"title":"Can Another Filter Restore Light?","type":"polarization","choices":["Still no light","Some light returns"],"correct":1};</script>
<script >
(() => {
  'use strict';
  const ink = '#172f46', blue = '#23649a', teal = '#087c80', rust = '#a94b24', gold = '#f6ce43', muted = '#708595';
  const escape = value => String(value).replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
  const label = (x, y, value, anchor = 'start', kind = '') => `<text x="${x}" y="${y}" text-anchor="${anchor}" class="${kind}">${escape(value)}</text>`;
  const line = (x1, y1, x2, y2, color = muted, width = 1.5, dash = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${width}" ${dash ? `stroke-dasharray="${dash}"` : ''}/>`;
  const path = (points, color = teal, width = 3, dash = '') => `<path d="${points.map((point, index) => `${index ? 'L' : 'M'}${point[0].toFixed(2)},${point[1].toFixed(2)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="${width}" stroke-linejoin="round" ${dash ? `stroke-dasharray="${dash}"` : ''}/>`;
  const box = (x, y, width, height, fill = '#f0f7fa', stroke = '#bccdd8', radius = 0) => `<rect x="${x}" y="${y}" width="${width}" height="${height}" rx="${radius}" fill="${fill}" stroke="${stroke}"/>`;
  const dot = (x, y, radius = 4, fill = teal, stroke = '#fff') => `<circle cx="${x}" cy="${y}" r="${radius}" fill="${fill}" stroke="${stroke}" stroke-width="1.2"/>`;
  function arrow(x1, y1, x2, y2, color = blue, width = 2.4, both = false) {
    if (Math.hypot(x2 - x1, y2 - y1) < 1) return '';
    const head = (startX, startY, endX, endY) => {
      const angle = Math.atan2(endY - startY, endX - startX);
      return path([[endX - 8 * Math.cos(angle - .45), endY - 8 * Math.sin(angle - .45)], [endX, endY], [endX - 8 * Math.cos(angle + .45), endY - 8 * Math.sin(angle + .45)]], color, width);
    };
    return line(x1, y1, x2, y2, color, width) + head(x1, y1, x2, y2) + (both ? head(x2, y2, x1, y1) : '');
  }
  function ray(x1, y1, x2, y2) {
    return line(x1, y1, x2, y2, '#826522', 5) + arrow(x1, y1, x2, y2, gold, 3);
  }
  function sample(start, end, fn, steps = 200) {
    return Array.from({ length: steps + 1 }, (_, index) => { const position = start + (end - start) * index / steps; return [position, fn(position)]; });
  }
  function dimension(x1, x2, y, value) {
    return line(x1, y - 6, x1, y + 6, ink) + line(x2, y - 6, x2, y + 6, ink) + arrow(x1, y, x2, y, ink, 1.5, true) + label((x1 + x2) / 2, y - 12, value, 'middle');
  }
  function arc(centerX, centerY, radius, start, end, color = blue) {
    const points = Array.from({ length: 41 }, (_, index) => { const angle = start + (end - start) * index / 40; return [centerX + radius * Math.cos(angle), centerY + radius * Math.sin(angle)]; });
    return path(points, color, 1.8);
  }
  function graph({ width = 400, baseline = 210, top = 95, bottom = 285, xmax = 4, ticks = [0, 1, 2, 3, 4], xlabel = 'Position (m)', ylabel = 'Displacement (cm)' } = {}) {
    const left = 55, right = width - 25;
    let markup = label(left, top - 25, ylabel) + arrow(left, bottom, left, top, ink, 1.4) + arrow(left, baseline, right + 6, baseline, ink, 1.4);
    for (const tick of ticks) {
      const position = left + tick / xmax * (right - left);
      markup += line(position, baseline - 4, position, baseline + 4, ink) + label(position, bottom + 23, tick, 'middle', 'small');
    }
    markup += label((left + right) / 2, bottom + 52, xlabel, 'middle');
    return { markup, left, right, scale: (right - left) / xmax };
  }
  function panels(items, compact) {
    let offset = 0;
    const height = compact ? items.reduce((sum, item) => sum + item.height + 14, 0) : Math.max(...items.map(item => item.height)) + 20;
    const markup = items.map((item, index) => {
      const x = compact ? 10 : 10 + index * 420;
      const y = compact ? offset + 10 : 10;
      offset += item.height + 14;
      return `<g transform="translate(${x} ${y})">${box(0, 0, 400, item.height, '#fff', '#d0dce3', 8)}${item.markup}</g>`;
    }).join('');
    return { markup, width: compact ? 420 : items.length * 420, height };
  }
  const single = (markup, width, height) => ({ markup, width, height });
  const degrees = radians => radians * 180 / Math.PI;
  const radians = angle => angle * Math.PI / 180;
  const refracted = (n1, n2, angle) => Math.asin(n1 * Math.sin(angle) / n2);
  const critical = (n1, n2 = 1) => Math.asin(n2 / n1);
  const lensImage = (focal, distance) => 1 / (1 / focal - 1 / distance);
  const physics = { refracted, critical, lensImage, intensityRatio: distanceRatio => 1 / distanceRatio ** 2, remaining: (initial, halfLives) => initial * 2 ** -halfLives, photonEnergy: wavelength => 1239.841984 / wavelength };
  const helpers = { ink, blue, teal, rust, gold, muted, label, line, path, box, dot, arrow, ray, sample, dimension, arc, graph, panels, single, degrees, radians, physics };
  window.Unit5Diagrams = {
    helpers,
    physics,
    scenes: {},
    render(lesson, state) {
      const result = this.scenes[lesson.type](lesson, state, helpers);
      result.markup = `<defs><linearGradient id="visibleSpectrum"><stop stop-color="#7352a5"/><stop offset=".23" stop-color="#638fc8"/><stop offset=".46" stop-color="#8ac59d"/><stop offset=".65" stop-color="#f0dd77"/><stop offset="1" stop-color="#ce7475"/></linearGradient></defs>${result.markup}`;
      return result;
    }
  };
})();

</script>
<script >
(() => {
  'use strict';
  const { label, line, arrow, box, single, path } = window.Unit5Diagrams.helpers;
  const scene = document.getElementById('scene');
  const prompt = document.getElementById('prompt');
  const explanation = document.getElementById('explanation');
  const start = document.getElementById('start');
  const advance = document.getElementById('advance');
  const pause = document.getElementById('pause');
  const choices = [...document.querySelectorAll('[data-choice]')];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const transmission = (intensity, angle) => intensity * Math.cos(angle * Math.PI / 180) ** 2;
  window.polarizationPhysics = { transmission };
  let phase = 'off', elapsed = 0, lastTime = null, paused = false, selected = null, completed = false, waveTime = 0;
  function filter(center, vertical, angle, name, compact, offset = 0) {
    const projection = compact ? 'matrix(.35 .55 -1 0 0 0)' : 'matrix(.55 .35 0 1 0 0)';
    let stripes = '';
    for (let position = -56; position <= 56; position += 14) stripes += line(position, -70, position, 70, '#88b5ca', 2);
    const stand = compact ? '' : `<ellipse cx="${center + 19}" cy="397" rx="57" ry="11" fill="#dce5eb"/>` + box(center + 22, vertical + 60, 12, 78, 'url(#metalRim)', '#668195', 3) + `<path d="M${center - 14} 388 L${center + 46} 388 L${center + 65} 402 L${center + 5} 402Z" fill="#b9cbd7" stroke="#668195"/>`;
    return `<g transform="translate(${compact ? offset : 0} ${compact ? 0 : -offset})">` + stand +
      `<g transform="translate(${center} ${vertical}) ${projection}"><ellipse cx="14" cy="5" rx="74" ry="84" fill="url(#metalRim)" stroke="#456b87" stroke-width="2"/><ellipse rx="70" ry="80" fill="url(#filterGlass)" stroke="#315d7b" stroke-width="4"/><ellipse cx="-4" cy="-3" rx="64" ry="74" fill="none" stroke="#f7fdff" stroke-width="2"/><g clip-path="url(#filterFace)"><g transform="rotate(${angle})">${stripes}</g></g><g transform="rotate(${angle})">${arrow(0, 56, 0, -56, '#163d58', 4, true)}</g></g></g>` +
      label(compact ? 72 : center, compact ? vertical + 8 : vertical + 114, `${angle.toFixed(0)}°`, 'middle', 'strong');
  }
  function render() {
    const compact = innerWidth <= 760, width = compact ? 420 : 900;
    const center = width / 2, progress = Math.min(1, elapsed / (phase === 'insert' ? 3250 : 6500));
    const second = !['off', 'single'].includes(phase);
    const third = ['predict', 'insert', 'complete'].includes(phase);
    const angle = phase === 'rotate' ? progress * 90 : ['crossed', 'predict', 'insert', 'complete'].includes(phase) ? 90 : 0;
    const inserted = phase === 'complete';
    const insertionOffset = phase === 'insert' ? 160 * (1 - progress) : 0;
    const coverage = inserted ? 1 : phase === 'insert' ? Math.max(0, Math.min(1, (106 - insertionOffset) / 52)) : 0;
    document.getElementById('mind-blown').hidden = coverage === 0;
    const lit = phase !== 'off';
    const output = !lit ? 0 : coverage > 0 ? coverage * transmission(transmission(50, 45), 45) : transmission(50, angle);
    const positions = compact ? [center, center, center] : [second ? 210 : 400, 400, 590];
    const levels = compact ? [205, 370, third ? 535 : 370] : [250, 250, 250];
    const screenY = compact ? (second ? levels[2] : levels[0]) + 145 : 250;
    let drawing = '<defs><clipPath id="filterFace"><ellipse rx="66" ry="76"/></clipPath><radialGradient id="bulbGlow"><stop stop-color="#fff7a9"/><stop offset="1" stop-color="#f5c74b"/></radialGradient></defs>';
    drawing += '<defs><linearGradient id="metalRim"><stop stop-color="#56758b"/><stop offset=".45" stop-color="#e2edf4"/><stop offset="1" stop-color="#7796aa"/></linearGradient><linearGradient id="filterGlass" x2="1" y2="1"><stop stop-color="#f3fbff"/><stop offset=".5" stop-color="#c9e5f0"/><stop offset="1" stop-color="#e8f5fa"/></linearGradient><radialGradient id="screenSpot"><stop stop-color="#fffad1"/><stop offset=".45" stop-color="#ffdf68"/><stop offset="1" stop-color="#f6c345" stop-opacity="0"/></radialGradient></defs>';
    if (!compact) drawing += '<path d="M80 375 L810 375 L875 425 L140 425Z" fill="#f1f5f8" stroke="#dce5ec"/>';
    const sourceX = compact ? center : 55, sourceY = compact ? 115 : 250;
    const beam = (fromX, fromY, toX, toY, intensity) => intensity < .001 ? '' :
      `<path d="M${fromX} ${fromY} L${toX} ${toY}" stroke="#f2c945" stroke-width="52" opacity="${.8 * Math.sqrt(intensity / 100)}" fill="none"/>`;
    const through = !lit ? 0 : 50 - 25 * coverage;
    drawing += beam(sourceX, sourceY, positions[0], levels[0], lit ? 100 : 0);
    if (second) {
      if (third) {
        drawing += beam(positions[0], levels[0], positions[1], levels[1], lit ? 50 : 0);
        drawing += beam(positions[1], levels[1], positions[2], levels[2], through);
      } else drawing += beam(positions[0], levels[0], positions[2], levels[2], lit ? 50 : 0);
    }
    drawing += beam(positions[second ? 2 : 0], levels[second ? 2 : 0], compact ? center : 810, screenY, output);
    drawing += `<circle cx="${sourceX}" cy="${sourceY}" r="28" fill="${lit ? 'url(#bulbGlow)' : '#eef2f5'}" stroke="#96752b" stroke-width="2"/>` +
      box(sourceX - 17, sourceY + 26, 34, 18, '#b9c8d1', '#526c80', 4) +
      line(sourceX - 14, sourceY + 33, sourceX + 14, sourceY + 33, '#526c80', 2);
    const field = (fromX, fromY, toX, toY, orientation, intensity, opacity = 1) => {
      if (intensity < .001) return '';
      const amplitude = 44 * Math.sqrt(intensity / 50), span = compact ? toY - fromY : toX - fromX;
      const radians = orientation * Math.PI / 180;
      const transverse = Math.cos(radians), depth = Math.sin(radians);
      const project = (distance, displacement) => compact
        ? [fromX + displacement * (transverse + .35 * depth), fromY + distance + displacement * .55 * depth]
        : [fromX + distance + displacement * .55 * depth, fromY + displacement * (.35 * depth - transverse)];
      const axisStart = project(0, 0), axisEnd = project(span, 0);
      const plane = [project(0, amplitude), project(span, amplitude), project(span, -amplitude), project(0, -amplitude)];
      const samples = Math.ceil(span / 2);
      const points = Array.from({ length: samples + 1 }, (_, sample) => {
        const distance = sample / samples * span;
        const position = (compact ? fromY : fromX) + distance;
        return project(distance, amplitude * Math.sin(position * Math.PI * 2 / 110 - waveTime * 3));
      });
      let drawing = `<g data-wave-angle="${orientation}" data-wave-intensity="${intensity}" data-wave-span="${span}" opacity="${opacity}"><polygon points="${plane.map(point => point.join(',')).join(' ')}" fill="#b9e1ed" fill-opacity=".12"/>`;
      drawing += line(...axisStart, ...axisEnd, '#91a9b8', 1, '3 4');
      const ribbon = [axisStart, ...points, axisEnd];
      drawing += `<polygon points="${ribbon.map(point => point.join(',')).join(' ')}" fill="#3186a5" fill-opacity=".16"/>`;
      for (let sample = 8; sample < samples; sample += 12) {
        const origin = project(sample / samples * span, 0);
        drawing += arrow(...origin, ...points[sample], '#28738e', 1.2);
      }
      return drawing + path(points, '#125d82', 3) + '</g>';
    };
    const waveBetween = (from, to, orientation, intensity, opacity = 1) => field(positions[from], levels[from], positions[to], levels[to], orientation, intensity, opacity);
    if (second) drawing += waveBetween(0, third ? 1 : 2, 0, lit ? 50 : 0);
    if (third) {
      if (coverage < 1) drawing += waveBetween(1, 2, 0, 50, 1 - coverage);
      if (coverage > 0) drawing += waveBetween(1, 2, 45, 25, coverage);
    }
    drawing += field(positions[second ? 2 : 0], levels[second ? 2 : 0], compact ? center : 810, screenY, angle, output);
    drawing += filter(positions[0], levels[0], 0, 'First filter', compact);
    if (second) drawing += filter(positions[2], levels[2], angle, 'Second filter', compact);
    if (phase === 'insert' || phase === 'complete') {
      drawing += filter(positions[1], levels[1], 45, 'Middle filter', compact, insertionOffset);
    } else if (phase === 'predict') {
      drawing += `<ellipse data-middle-slot="true" transform="translate(${positions[1]} ${levels[1]}) ${compact ? 'matrix(.35 .55 -1 0 0 0)' : 'matrix(.55 .35 0 1 0 0)'}" rx="70" ry="80" fill="none" stroke="#9db3c1" stroke-width="1.5" stroke-dasharray="6 6"/>`;
    }
    const screenShape = compact ? `M125 ${screenY - 40} L285 ${screenY - 40} L315 ${screenY + 40} L95 ${screenY + 40}Z` : 'M760 155 L865 190 L865 355 L760 320Z';
    drawing += `<path d="${screenShape}" transform="translate(7 6)" fill="#8298a8"/><path d="${screenShape}" fill="#263d50" stroke="#68869b" stroke-width="3"/>`;
    drawing += `<ellipse data-screen-glow="${output / 50}" cx="${compact ? center : 812}" cy="${screenY}" rx="${compact ? 82 : 46}" ry="${compact ? 30 : 72}" fill="url(#screenSpot)" opacity="${output < .001 ? 0 : Math.min(1, output / 50)}"/>`;
    if (['single', 'aligned', 'crossed', 'predict', 'complete'].includes(phase)) {
      drawing += label(compact ? center : 810, compact ? screenY + 120 : 390, ['single', 'aligned'].includes(phase) ? '50%' : ['crossed', 'predict'].includes(phase) ? '0%' : '12.5%', 'middle', 'strong');
    }
    const result = single(drawing, width, compact ? screenY + 145 : 435);
    scene.innerHTML = result.markup;
    const top = compact ? 65 : 105;
    scene.setAttribute('viewBox', `0 ${top} ${result.width} ${result.height - top}`);
    scene.dataset.phase = phase;
    scene.dataset.output = output < .001 ? '0' : output.toFixed(4);
    scene.dataset.filterCount = String(second ? (phase === 'insert' || phase === 'complete' ? 3 : 2) : 1);
    scene.setAttribute('aria-label', `First filter 0 degrees. ${second ? `Second filter ${angle.toFixed(0)} degrees.` : 'One filter only.'} ${inserted ? 'Middle filter 45 degrees.' : ''} Transmitted light ${Number(scene.dataset.output)} percent of the original.`);
  }
  function setPhase(next) {
    phase = next; elapsed = 0;
    paused = false; pause.textContent = 'Pause';
    document.getElementById('mind-blown').style.animationPlayState = 'running';
    start.hidden = phase !== 'off';
    advance.hidden = !['single', 'aligned', 'rotate', 'crossed'].includes(phase) || phase === 'rotate' && !reduced.matches;
    advance.textContent = phase === 'single' ? 'Part 2: Add second filter' : phase === 'crossed' ? 'Part 3: Try a third filter' : phase === 'aligned' ? 'Rotate the second filter' : 'Rotate another 15°';
    choices.forEach(button => { button.hidden = phase !== 'predict'; });
    pause.hidden = phase === 'off' || reduced.matches;
    const messages = {
      off: ['Turn on the light.', ''],
      single: ['One filter: 50% transmitted.', 'The electric field oscillates in one plane.'],
      aligned: ['Two aligned filters: still 50%.', 'Rotate the second filter and watch the light dim.'],
      rotate: ['Watch the spot on the screen dim.', ''],
      crossed: ['Crossed filters: no light.', 'Ready for something that might mess with your mind?'],
      predict: ['Make your prediction first.', 'Add a 45° filter between these two. Still dark—or does light return?'],
      insert: ['Let’s test your prediction…', 'Watch as the extra filter slides in.'],
      complete: [selected === 1 ? 'You called it—light returns!' : 'Mind blown—light returns!', 'The middle filter selects a new polarization: 12.5% of the original light gets through.']
    };
    [prompt.textContent, explanation.textContent] = messages[phase];
    if (phase === 'complete' && !completed) { completed = true; window.parent.postMessage({ type: 'complete' }, '*'); }
    render();
  }
  start.addEventListener('click', () => setPhase('single'));
  advance.addEventListener('click', () => {
    if (phase === 'single') setPhase('aligned');
    else if (phase === 'aligned') setPhase('rotate');
    else if (phase === 'crossed') setPhase('predict');
    else if (phase === 'rotate' && reduced.matches) { elapsed += 6500 / 6; if (elapsed >= 6499) setPhase('crossed'); else render(); }
  });
  choices.forEach(button => button.addEventListener('click', () => {
    if (phase !== 'predict') return;
    selected = Number(button.dataset.choice); setPhase(reduced.matches ? 'complete' : 'insert');
    document.getElementById('replay').focus({ preventScroll: true });
  }));
  pause.addEventListener('click', () => { paused = !paused; pause.textContent = paused ? 'Play' : 'Pause'; document.getElementById('mind-blown').style.animationPlayState = paused ? 'paused' : 'running'; });
  document.getElementById('replay').addEventListener('click', () => { paused = false; selected = null; lastTime = null; waveTime = 0; pause.textContent = 'Pause'; setPhase('single'); });
  addEventListener('resize', render);
  reduced.addEventListener('change', () => { paused = false; pause.textContent = 'Pause'; if (phase === 'insert' && reduced.matches) setPhase('complete'); else if (phase === 'rotate') setPhase('rotate'); else render(); });
  function frame(timestamp) {
    const delta = lastTime === null ? 0 : Math.min(100, timestamp - lastTime); lastTime = timestamp;
    if (!paused && !reduced.matches && phase !== 'off') {
      waveTime += delta / 1000;
      if (['rotate', 'insert'].includes(phase)) {
        elapsed += delta;
        if (elapsed >= (phase === 'rotate' ? 6500 : 3250)) setPhase(phase === 'rotate' ? 'crossed' : 'complete'); else render();
      } else render();
    }
    requestAnimationFrame(frame);
  }
  setPhase('single'); requestAnimationFrame(frame);
})();

</script>
</body>
