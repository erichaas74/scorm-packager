<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Table | Material Properties Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="lab.css" />
</head>
<body>
<div class="page">

  <div class="topbar">
    <a class="back-btn" href="../index.html">← Grade 5</a>
    <div class="eyebrow">Grade 5 · Science Lab</div>
  </div>

  <div id="progShell" class="shell prog-shell"></div>
  <div class="s-nav" id="sNav"></div>

  <div class="shell">
    <div class="eyebrow">Lab Results</div>
    <h1>Data Table</h1>
    <p>Results collected for <strong id="matName" style="color:var(--text)"></strong>. Complete all 6 stations to unlock the Design Challenge.</p>

    <div class="tbl-wrap">
      <table id="dataTable"></table>
    </div>

    <div class="btn-row mt12">
      <a class="btn btn-secondary" id="backToLab" href="station-1.html">← Back to Lab</a>
      <a class="btn btn-green" id="challengeLink" href="challenge.html">Design Challenge →</a>
    </div>
  </div>

</div>
<script src="lab-data.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  if (!getMatId()) { window.location.href = 'index.html'; return; }

  const mat = getMat();
  const completed = getCompleted();
  renderProgress(0); // 0 = no station active; pills still show done state

  document.getElementById('matName').textContent = mat.name;

  // Send "Back to Lab" to the last completed station, or station 1
  const lastDone = Math.max(...completed, 0);
  document.getElementById('backToLab').href = lastDone > 0 ? `station-${lastDone}.html` : 'station-1.html';

  // Lock challenge link until all 6 done
  if (completed.length < 6) {
    const link = document.getElementById('challengeLink');
    link.style.opacity = '.4';
    link.style.pointerEvents = 'none';
    link.title = 'Complete all 6 stations first';
  }

  // Build table
  const den = mat.mass / mat.vol;
  const rows = [
    { prop: '💧 Waterproof Rating',  key: 'wp',   st: 1, val: `${mat.wp}/5 — ${['','Very absorbent','Mostly absorbs','Partly resistant','Mostly waterproof','Fully waterproof'][mat.wp]}` },
    { prop: '💧 Water Behavior',     key: 'wr',   st: 1, val: { beads:'Water beads up on surface', partly:'Partly absorbs, partly repels', soaks:'Fully absorbs water' }[mat.wr] },
    { prop: '🧲 Magnetic?',          key: 'mag',  st: 2, val: mat.mag ? 'Yes — attracted to magnet' : 'No — no magnetic attraction' },
    { prop: '🧲 Magnet Strength',    key: 'ms',   st: 2, val: { none:'None', weak:'Weak pull', strong:'Strong attraction' }[mat.ms] },
    { prop: '💪 Flexibility Rating', key: 'fl',   st: 3, val: `${mat.fl}/5` },
    { prop: '💪 Flex Behavior',      key: 'fr',   st: 3, val: { 'bends-r':'Bends and returns to shape','bends-s':'Bends and stays bent','cracks':'Cracks under bending' }[mat.fr] },
    { prop: '💪 Strength Rating',    key: 'str',  st: 3, val: `${mat.str}/5 (held ${mat.mw} weights)` },
    { prop: '💡 Transparency',       key: 'tr',   st: 4, val: { transparent:'Transparent — clear', translucent:'Translucent — blurry', opaque:'Opaque — blocks light' }[mat.tr] },
    { prop: '🌊 Floats?',            key: 'flt',  st: 5, val: mat.flt ? 'Yes' : 'No' },
    { prop: '🌊 Buoyancy Result',    key: 'fb',   st: 5, val: { floats:'Floats steadily', sinks:'Sinks to bottom', 'floats-then-sinks':'Floats then sinks' }[mat.fb] },
    { prop: '⚖️ Mass',              key: 'mass', st: 6, val: `${mat.mass} g` },
    { prop: '⚖️ Volume',            key: 'vol',  st: 6, val: `${mat.vol} cm³` },
    { prop: '⚖️ Density',           key: 'den',  st: 6, val: `${den.toFixed(2)} g/cm³ ${den < 1 ? '(floats)' : '(sinks)'}` },
  ];

  let html = `<thead><tr><th>Property</th><th>Result</th><th>Station</th><th>Status</th></tr></thead><tbody>`;
  rows.forEach(r => {
    const done = completed.includes(r.st);
    const status = done
      ? `<span class="badge bg-green">✓ Recorded</span>`
      : `<span class="badge bg-orange">Station ${r.st}</span>`;
    html += `<tr>
      <td>${r.prop}</td>
      <td class="${done ? 'tv' : 'te'}">${done ? r.val : '—'}</td>
      <td style="color:var(--muted);font-size:.78rem;"><a href="station-${r.st}.html" style="color:inherit;">Station ${r.st}</a></td>
      <td>${status}</td>
    </tr>`;
  });
  html += '</tbody>';
  document.getElementById('dataTable').innerHTML = html;
});
</script>
</body>
</html>
