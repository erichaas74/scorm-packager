<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Material Properties Lab – Grade 5 Science</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="lab.css" />
</head>
<body>
<div class="page">

  <div class="topbar">
    <a class="back-btn" href="../index.html">← Grade 5</a>
    <div class="eyebrow">Grade 5 · Science Lab</div>
  </div>

  <div class="shell">
    <div class="eyebrow">Step 1 of 3</div>
    <h1>Material Properties Lab</h1>
    <p>Scientists test materials to discover their properties. Choose a material below, then run it through all 6 test stations. Use your evidence to solve the final Design Challenge!</p>

    <div class="mat-grid" id="matGrid"></div>

    <div class="btn-row mt12">
      <button id="startBtn" class="btn btn-primary" disabled onclick="startLab()">Start Lab →</button>
    </div>
  </div>

</div>
<script src="lab-data.js"></script>
<script>
let selectedId = null;

function buildGrid() {
  document.getElementById('matGrid').innerHTML = Object.entries(MAT).map(([id, m]) =>
    `<div class="mat-card" data-id="${id}" onclick="selectMat('${id}', this)">
       <div class="mat-icon">${m.icon}</div>
       <div class="mat-name">${m.name}</div>
     </div>`
  ).join('');

  // Re-highlight previously saved choice
  const saved = getMatId();
  if (saved) {
    selectedId = saved;
    const el = document.querySelector(`[data-id="${saved}"]`);
    if (el) el.classList.add('sel');
    document.getElementById('startBtn').disabled = false;
  }
}

function selectMat(id, el) {
  selectedId = id;
  document.querySelectorAll('.mat-card').forEach(c => c.classList.remove('sel'));
  el.classList.add('sel');
  document.getElementById('startBtn').disabled = false;
}

function startLab() {
  if (!selectedId) return;
  const prev = getMatId();
  // Reset progress only when switching materials
  if (prev !== selectedId) {
    setState({ matId: selectedId, completed: [], notes: {} });
  } else {
    setState({ matId: selectedId });
  }
  window.location.href = 'station-1.html';
}

buildGrid();
</script>
</body>
</html>
