<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Save Our Town Challenge</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <h1>Save Our Town Challenge</h1>
        <p class="subtitle">Teacher-run town strategy game for two teams</p>
      </div>
      <div class="name-settings">
        <label>
          Town 1
          <input id="town1Name" type="text" value="Town 1" maxlength="20" />
        </label>
        <label>
          Town 2
          <input id="town2Name" type="text" value="Town 2" maxlength="20" />
        </label>
        <button id="applyNamesBtn" class="secondary-btn">Apply Names</button>
      </div>
    </header>

    <main>
      <section class="canvas-wrap card">
        <canvas id="gameCanvas" width="1360" height="620" aria-label="Two towns side by side"></canvas>
      </section>



      <section class="card actions-card">
        <div class="section-title" id="actionPrompt">Action Choices</div>
        <div id="actionsGrid" class="actions-grid"></div>
      </section>

      <section class="card history-card">
        <div class="section-title">Round Log</div>
        <div id="historyLog" class="history-log"></div>
      </section>

      <section class="controls-grid">
        <div class="card teacher-card">
          <div class="section-title">Teacher Controls</div>
          <div class="button-row">
            <button id="startBtn" class="primary-btn">Start Game</button>
            <button id="nextRoundBtn" class="primary-btn" disabled>Next Round</button>
            <button id="resetBtn" class="secondary-btn">Reset Game</button>
          </div>
          <div id="turnPrompt" class="turn-prompt">Teams will choose actions here.</div>
        </div>
      </section>

      <section id="reportCard" class="card report-card hidden">
        <div class="section-title">📋 Town Report Card</div>
        <div id="reportBody" class="report-body"></div>
        <button id="closeReportBtn" class="secondary-btn" style="margin-top:12px;">Close Report</button>
      </section>
    </main>
  </div>

  <!-- Event popup overlay -->
  <div id="eventOverlay" class="event-overlay hidden">
    <div class="event-overlay-card">
      <div class="event-overlay-icon" id="eventOverlayIcon">⚡</div>
      <h2 class="event-overlay-title" id="eventOverlayTitle">Event Title</h2>
      <p class="event-overlay-desc" id="eventOverlayDesc">Description</p>
      <div class="event-overlay-effects" id="eventOverlayEffects">Effects</div>
      <button id="eventOverlayBtn" class="primary-btn event-overlay-btn">Let's Go!</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
