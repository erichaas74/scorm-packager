<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invisible Ink — Operation Liberty Quill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
#ink-canvas {
  display: block;
  width: 100%;
  max-width: 560px;
  margin: 0 auto 18px;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow);
  cursor: default;
}

.tool-cards {
  display: flex;
  gap: 14px;
  justify-content: center;
  margin: 0 0 16px;
  flex-wrap: wrap;
}
.tool-card {
  border: 2.5px solid var(--parchment-md);
  border-radius: var(--radius-md);
  padding: 18px 14px 14px;
  cursor: pointer;
  text-align: center;
  background: white;
  transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
  min-width: 130px;
  flex: 1;
  max-width: 180px;
  user-select: none;
}
.tool-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-sm); }
.tool-card.selected { border-color: var(--colonial-red); box-shadow: 0 0 0 3px rgba(139,26,26,0.15); }
.tool-card.correct-reveal { border-color: var(--green); background: var(--green-lt); }
.tool-emoji { font-size: 34px; display: block; margin-bottom: 8px; line-height: 1; }
.tool-label { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; color: var(--ink); }
.tool-desc  { font-size: 11px; color: var(--ink-muted); margin-top: 4px; line-height: 1.4; }

/* Science quiz */
.quiz-wrap {
  background: white;
  border: 1.5px solid var(--parchment-md);
  border-radius: var(--radius-md);
  padding: 20px;
  margin: 18px 0;
}
.quiz-question {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 14px;
  line-height: 1.5;
}
.quiz-option {
  border: 2px solid var(--parchment-md);
  border-radius: var(--radius-sm);
  padding: 11px 14px;
  margin-bottom: 8px;
  cursor: pointer;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  background: var(--parchment);
  transition: border-color 0.2s, background 0.2s;
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--ink);
}
.quiz-option:hover:not(.locked)   { background: var(--parchment-dk); }
.quiz-option.selected             { border-color: var(--blue); background: #eff6ff; }
.quiz-option.correct              { border-color: var(--green); background: var(--green-lt); }
.quiz-option.wrong                { border-color: var(--colonial-red); background: var(--red-lt); }
.quiz-option.locked               { cursor: default; }
.option-letter {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 13px;
  color: var(--ink-muted);
  flex-shrink: 0;
  width: 18px;
  margin-top: 1px;
}
.quiz-result {
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px;
  font-weight: 700;
  margin-top: 10px;
  display: none;
}
.quiz-result.ok  { background: var(--green-lt); color: #065f46; }
.quiz-result.bad { background: var(--red-lt);   color: var(--colonial-red); }

.reveal-status {
  text-align: center;
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 14px;
}
.reveal-status.idle    { background: var(--parchment-dk); color: var(--ink-muted); }
.reveal-status.success { background: var(--green-lt); color: #065f46; }
.reveal-status.fail    { background: var(--red-lt); color: var(--colonial-red); }
</style>
</head>
<body>
<div class="spy-app">
  <header class="spy-header">
    <h1>&#x1F511; Operation Liberty Quill</h1>
    <div class="spy-name-badge" id="name-badge">Revolutionary War Spy Mission</div>
  </header>
  <div class="progress-bar">
    <div class="pip-row" id="pip-row"></div>
  </div>
  <div class="pip-labels" id="pip-labels"></div>
  <div class="stage-host" id="stage-host"></div>
</div>
<script src="shared.js"></script>
<script>
const STAGE = 6;
const st = loadState();

let toolSelected  = st.inkTool     || null;
let inkRevealed   = st.inkRevealed || false;
let quizAnswered  = st.inkAnswered  || false;
let quizCorrect   = st.inkCorrect   || false;
let quizSelected  = st.inkSelected  || null;

const TOOLS = [
  { id: 'candle', emoji: '&#x1F56F;', label: 'Candle Flame',   desc: 'Hold the parchment above a candle — heat reveals the ink.',  correct: true  },
  { id: 'water',  emoji: '&#x1F4A7;', label: 'Brush with Water', desc: 'Wet the surface to see if the hidden writing appears.',       correct: false },
  { id: 'cold',   emoji: '&#x2744;',  label: 'Press with Ice',   desc: 'Rapidly cool the paper to try to expose the message.',       correct: false },
];

const QUIZ_OPTIONS = [
  { id: 'a', text: 'Heat makes the paper fibers expand, squeezing the juice to the surface.' },
  { id: 'b', text: 'Lemon juice contains organic compounds (sugars and acids) that oxidize and turn brown when heated — a chemical change.', correct: true },
  { id: 'c', text: 'The candle flame glows through the paper, making the yellow juice visible from behind.' },
  { id: 'd', text: 'Heating removes the surrounding paper\'s natural color, leaving only the juice behind.' },
];

initPage(STAGE);

// ── CANVAS DRAWING ────────────────────────────────────────────────────────────
const MESSAGE_LINES = [
  { text: 'TOP SECRET — PATRIOT INTELLIGENCE', y: 38,  size: 13, bold: true  },
  { text: 'ATTACK AT DAWN',                        y: 80,  size: 24, bold: true  },
  { text: 'MEET AT LIBERTY BRIDGE',                y: 118, size: 16, bold: true  },
  { text: '',                                       y: 138                        },
  { text: 'Burn this message after reading.',       y: 158, size: 12, bold: false },
  { text: '— Your Ally in the Cause',          y: 182, size: 13, bold: false, italic: true },
];

function drawSecret(progress) {
  const canvas = document.getElementById('ink-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // Parchment background
  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#f8ecd0');
  bg.addColorStop(1, '#eeddb5');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Subtle dot texture
  for (let tx = 4; tx < W; tx += 10) {
    for (let ty = 4; ty < H; ty += 10) {
      if ((tx * 13 + ty * 7) % 19 < 2) {
        ctx.fillStyle = 'rgba(100,60,20,0.06)';
        ctx.fillRect(tx, ty, 2, 2);
      }
    }
  }

  // Edge vignette
  const vig = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.75);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(70,35,5,0.14)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  // Decorative border
  ctx.strokeStyle = 'rgba(100,60,20,0.25)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(14, 10, W - 28, H - 20);

  if (progress <= 0) {
    ctx.fillStyle = 'rgba(100,60,20,0.3)';
    ctx.font = '12px "Instrument Sans", Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Select a revealing method below, then click Apply', W/2, H - 16);
    return;
  }

  // Revealed text — clipped to progress band
  const revealX = W * progress;
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, revealX, H);
  ctx.clip();

  MESSAGE_LINES.forEach(line => {
    if (!line.text) return;
    const sz = line.size || 14;
    ctx.font = `${line.italic ? 'italic ' : ''}${line.bold ? 'bold ' : ''}${sz}px "Courier New", monospace`;
    ctx.fillStyle = '#3d1e06';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(line.text, W / 2, line.y);
  });

  ctx.restore();

  // Amber heat glow at the reveal boundary
  if (progress > 0 && progress < 1) {
    const gx = revealX;
    const glow = ctx.createRadialGradient(gx, H/2, 0, gx, H/2, 90);
    glow.addColorStop(0,   'rgba(255,180,30,0.42)');
    glow.addColorStop(0.45,'rgba(255,110,15,0.18)');
    glow.addColorStop(1,   'rgba(255,80,0,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(gx - 90, 0, 180, H);

    // Tiny spark flecks
    for (let k = 0; k < 6; k++) {
      const fx = gx + (Math.random() - 0.5) * 12;
      const fy = 20 + Math.random() * (H - 40);
      const fr = 2 + Math.random() * 3.5;
      ctx.beginPath();
      ctx.arc(fx, fy, fr, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,${130 + Math.random() * 100 | 0},0,${0.35 + Math.random() * 0.45})`;
      ctx.fill();
    }
  }
}

// ── PAGE RENDER ───────────────────────────────────────────────────────────────
function renderPage() {
  const toolsHTML = TOOLS.map(t => `
    <div class="tool-card ${toolSelected === t.id ? 'selected' : ''} ${inkRevealed && t.correct ? 'correct-reveal' : ''}"
         id="tool-${t.id}" onclick="selectTool('${t.id}')">
      <span class="tool-emoji">${t.emoji}</span>
      <div class="tool-label">${t.label}</div>
      <div class="tool-desc">${t.desc}</div>
    </div>`).join('');

  const quizHTML = quizAnswered ? '' : `
    <div class="quiz-wrap" id="quiz-wrap" style="${inkRevealed ? '' : 'display:none'}">
      <div class="quiz-question">
        <span class="standard-badge badge-sci">NGSS 5-PS1-4</span><br><br>
        Why does the invisible lemon-juice message appear when you heat the paper?
      </div>
      ${QUIZ_OPTIONS.map(o => `
        <div class="quiz-option ${quizSelected === o.id ? 'selected' : ''}"
             id="qo-${o.id}" onclick="selectQuizOption('${o.id}')">
          <span class="option-letter">${o.id.toUpperCase()}.</span>
          ${o.text}
        </div>`).join('')}
      <button class="ctrl-btn" id="quiz-check-btn"
              style="margin-top:12px" onclick="checkQuiz()"
              ${quizSelected ? '' : 'disabled'}>
        Check Answer
      </button>
      <div class="quiz-result" id="quiz-result"></div>
    </div>`;

  const quizDoneHTML = quizAnswered ? `
    <div style="background:var(--green-lt);color:#065f46;border:2px solid var(--green);border-radius:var(--radius-md);padding:14px 18px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;text-align:center;margin:16px 0;line-height:1.6;">
      &#x2713; Correct! Lemon juice is full of organic compounds. Heat causes them to oxidize — a <em>chemical change</em> — turning the writing a dark brown color. This is the same reaction that makes food caramelize when cooked!
    </div>` : '';

  const statusText = inkRevealed
    ? '&#x2713; Message revealed! Now answer the science question below.'
    : toolSelected
      ? `Selected: <strong>${TOOLS.find(t => t.id === toolSelected).label}</strong> — click Apply to test it.`
      : 'Choose a revealing method and click Apply.';
  const statusClass = inkRevealed ? 'success' : 'idle';

  document.getElementById('stage-host').innerHTML = `
    <div class="stage-title">
      <span class="standard-badge badge-sci">NGSS 5-PS1-4</span>
      The Hidden Message
    </div>
    <p class="stage-subtitle">A Patriot courier left you a message written in <strong>invisible ink</strong> — a real technique used by George Washington's spy ring. Choose the correct method to reveal it, then explain the science behind why it works.</p>

    <canvas id="ink-canvas" width="560" height="200"></canvas>

    <div class="reveal-status ${statusClass}">${statusText}</div>

    <div class="tool-cards">${toolsHTML}</div>

    <div style="text-align:center;margin-bottom:18px">
      <button class="ctrl-btn" id="apply-btn" onclick="applyTool()"
              ${toolSelected && !inkRevealed ? '' : 'disabled'}>
        &#x1F525; Apply to Parchment
      </button>
      <div id="tool-feedback" style="margin-top:8px;font-size:13px;min-height:18px"></div>
    </div>

    ${quizHTML}
    ${quizDoneHTML}

    <div style="text-align:center">
      <button class="continue-btn" id="s6-continue"
              ${quizAnswered && quizCorrect ? '' : 'disabled'}
              onclick="s6Continue()">
        Science Unlocked &#x2014; View Portfolio &rarr;
      </button>
    </div>
  `;

  // Restore canvas state
  drawSecret(inkRevealed ? 1 : 0);
}

// ── INTERACTIONS ──────────────────────────────────────────────────────────────
function selectTool(id) {
  if (inkRevealed) return;
  toolSelected = id;
  // Update card styles
  TOOLS.forEach(t => {
    const el = document.getElementById(`tool-${t.id}`);
    if (el) el.className = 'tool-card' + (t.id === id ? ' selected' : '');
  });
  const applyBtn = document.getElementById('apply-btn');
  if (applyBtn) applyBtn.disabled = false;
  const fb = document.getElementById('tool-feedback');
  if (fb) fb.innerHTML = '';
  // Update status
  const status = document.querySelector('.reveal-status');
  if (status) {
    const tool = TOOLS.find(t => t.id === id);
    status.className = 'reveal-status idle';
    status.innerHTML = `Selected: <strong>${tool.label}</strong> — click Apply to test it.`;
  }
}

function applyTool() {
  if (!toolSelected || inkRevealed) return;
  const tool = TOOLS.find(t => t.id === toolSelected);
  const fb   = document.getElementById('tool-feedback');
  const applyBtn = document.getElementById('apply-btn');

  if (!tool.correct) {
    drawSecret(0);
    if (fb) fb.innerHTML = '<span class="feedback-err">Nothing happened. That method doesn\'t work on this type of ink. Try a different approach!</span>';
    return;
  }

  // Correct tool — start animation
  if (applyBtn) applyBtn.disabled = true;
  TOOLS.forEach(t => {
    const el = document.getElementById(`tool-${t.id}`);
    if (el) el.className = `tool-card ${t.correct ? 'correct-reveal' : ''}`;
    if (el && !t.correct) el.style.pointerEvents = 'none';
  });

  let startTime = null;
  const duration = 3200;

  function frame(ts) {
    if (!startTime) startTime = ts;
    const prog = Math.min((ts - startTime) / duration, 1);
    drawSecret(prog);
    if (prog < 1) {
      _rafId = requestAnimationFrame(frame);
    } else {
      inkRevealed = true;
      // Show quiz
      const quizWrap = document.getElementById('quiz-wrap');
      if (quizWrap) quizWrap.style.display = '';
      const status = document.querySelector('.reveal-status');
      if (status) {
        status.className = 'reveal-status success';
        status.innerHTML = '&#x2713; Message revealed! Now answer the science question below.';
      }
    }
  }
  _rafId = requestAnimationFrame(frame);
}

function selectQuizOption(id) {
  if (quizAnswered) return;
  quizSelected = id;
  QUIZ_OPTIONS.forEach(o => {
    const el = document.getElementById(`qo-${o.id}`);
    if (el) el.className = 'quiz-option' + (o.id === id ? ' selected' : '');
  });
  const checkBtn = document.getElementById('quiz-check-btn');
  if (checkBtn) checkBtn.disabled = false;
}

function checkQuiz() {
  if (!quizSelected || quizAnswered) return;
  const chosen = QUIZ_OPTIONS.find(o => o.id === quizSelected);
  quizAnswered = true;
  quizCorrect  = !!chosen.correct;

  QUIZ_OPTIONS.forEach(o => {
    const el = document.getElementById(`qo-${o.id}`);
    if (!el) return;
    el.classList.add('locked');
    if (o.correct)          el.classList.add('correct');
    else if (o.id === quizSelected) el.classList.add('wrong');
  });

  const checkBtn = document.getElementById('quiz-check-btn');
  if (checkBtn) checkBtn.disabled = true;

  const result = document.getElementById('quiz-result');
  if (result) {
    result.style.display = '';
    if (quizCorrect) {
      result.className = 'quiz-result ok';
      result.innerHTML = '&#x2713; Exactly right! The heat triggers oxidation — a chemical change — in the organic compounds inside lemon juice, turning the writing brown.';
    } else {
      result.className = 'quiz-result bad';
      result.innerHTML = '&#x2717; Not quite. Look at the highlighted correct answer. Think about what <em>chemical change</em> means — a new substance forms, and it can\'t easily be reversed!';
    }
  }

  if (quizCorrect) {
    const continueBtn = document.getElementById('s6-continue');
    if (continueBtn) continueBtn.disabled = false;
  }
}

function s6Continue() {
  saveState({ inkTool: toolSelected, inkRevealed, inkAnswered: quizAnswered, inkCorrect: quizCorrect, inkSelected: quizSelected });
  goToNextPage(STAGE);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
renderPage();

// Restore quiz state if returning to this page
if (quizAnswered) {
  // Re-apply answered styles after renderPage re-generates the DOM
  setTimeout(() => {
    QUIZ_OPTIONS.forEach(o => {
      const el = document.getElementById(`qo-${o.id}`);
      if (!el) return;
      el.classList.add('locked');
      if (o.correct) el.classList.add('correct');
      else if (o.id === quizSelected) el.classList.add('wrong');
    });
    const checkBtn = document.getElementById('quiz-check-btn');
    if (checkBtn) checkBtn.style.display = 'none';
    const result = document.getElementById('quiz-result');
    if (result) {
      result.style.display = '';
      result.className = quizCorrect ? 'quiz-result ok' : 'quiz-result bad';
      result.innerHTML = quizCorrect
        ? '&#x2713; Exactly right! The heat triggers oxidation — a chemical change — turning the writing brown.'
        : '&#x2717; See the highlighted correct answer above.';
    }
  }, 0);
}
</script>
</body>
</html>
