<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fraction Lock — Operation Liberty Quill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
/* ── Inline fraction rendering ── */
.frac {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  vertical-align: middle;
  margin: 0 3px;
  line-height: 1.25;
}
.frac-n { border-bottom: 2px solid currentColor; padding: 0 4px; font-size: 0.88em; }
.frac-d { padding: 0 4px; font-size: 0.88em; }

/* ── Problem cards ── */
.problems-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 28px;
}
@media (max-width: 620px) { .problems-grid { grid-template-columns: 1fr; } }

.problem-card {
  background: white;
  border: 2px solid var(--parchment-md);
  border-radius: var(--radius-md);
  padding: 20px 14px 16px;
  position: relative;
  text-align: center;
}
.dial-badge {
  position: absolute;
  top: -13px;
  left: 50%;
  transform: translateX(-50%);
  background: #1f2937;
  color: #f0d080;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 10px;
  font-weight: 700;
  padding: 3px 14px;
  border-radius: 99px;
  letter-spacing: 0.07em;
  white-space: nowrap;
}
.problem-context {
  font-size: 12.5px;
  color: var(--ink-muted);
  line-height: 1.6;
  margin-bottom: 12px;
  text-align: left;
}
.problem-equation {
  background: var(--parchment-dk);
  border-radius: var(--radius-sm);
  padding: 10px 8px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 17px;
  font-weight: 700;
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  flex-wrap: wrap;
  min-height: 48px;
}
.eq-question { color: var(--colonial-red); font-size: 20px; }
.standard-tag {
  font-size: 10px;
  font-weight: 700;
  color: var(--ink-muted);
  margin-top: 8px;
  letter-spacing: 0.06em;
}

/* ── Padlock ── */
.padlock-scene {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 0 auto 24px;
  max-width: 340px;
}
.shackle-wrap {
  width: 120px;
  position: relative;
  height: 80px;
  z-index: 2;
}
.shackle {
  width: 100px;
  height: 68px;
  border: 18px solid #6b7280;
  border-bottom: none;
  border-radius: 50px 50px 0 0;
  position: absolute;
  top: 0;
  left: 10px;
  box-sizing: border-box;
  transition: transform 0.75s cubic-bezier(0.34, 1.56, 0.64, 1);
  transform-origin: 100% 100%;
  background: transparent;
}
.shackle::before {
  content: '';
  position: absolute;
  inset: -5px;
  border: 3px solid rgba(255,255,255,0.12);
  border-bottom: none;
  border-radius: 52px 52px 0 0;
}
.shackle.open { transform: rotate(-42deg) translateY(-22px); }

.lock-body {
  background: linear-gradient(160deg, #4b5563 0%, #1f2937 100%);
  border-radius: 20px;
  padding: 18px 22px 22px;
  width: 100%;
  box-shadow: 0 8px 28px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.12), inset 0 -2px 0 rgba(0,0,0,0.3);
  position: relative;
  z-index: 1;
}
.lock-keyhole {
  text-align: center;
  font-size: 24px;
  margin-bottom: 14px;
  opacity: 0.6;
  transition: opacity 0.4s;
}
.lock-keyhole.open-state { opacity: 1; }

.dial-row {
  display: flex;
  gap: 14px;
  justify-content: center;
  margin-bottom: 16px;
}
.dial-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}
.dial-label {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 10px;
  font-weight: 700;
  color: #94a3b8;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
/* Number input styled as lock dial */
.dial-input {
  width: 72px;
  height: 80px;
  background: #0f172a;
  border: 2px solid #374151;
  border-radius: 10px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 34px;
  font-weight: 700;
  color: #f0d080;
  text-align: center;
  box-shadow: inset 0 4px 12px rgba(0,0,0,0.65), inset 0 -1px 0 rgba(255,255,255,0.04);
  cursor: text;
  transition: border-color 0.2s, box-shadow 0.2s;
  -moz-appearance: textfield;
}
.dial-input:focus {
  outline: none;
  border-color: #c4932f;
  box-shadow: inset 0 4px 12px rgba(0,0,0,0.65), 0 0 0 3px rgba(196,147,47,0.3);
}
.dial-input:disabled {
  cursor: default;
  opacity: 0.85;
}
.dial-input::-webkit-inner-spin-button,
.dial-input::-webkit-outer-spin-button { -webkit-appearance: none; }

.dial-input.correct { border-color: #16a34a; color: #86efac; }
.dial-input.wrong   { border-color: #dc2626; color: #fca5a5; }

/* Try button */
.try-btn {
  display: block;
  margin: 0 auto;
  background: linear-gradient(135deg, #c4932f, #d4a340);
  color: #0f172a;
  border: none;
  border-radius: var(--radius-md);
  padding: 11px 30px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
  box-shadow: 0 3px 10px rgba(196,147,47,0.35);
}
.try-btn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
.try-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

.lock-status {
  text-align: center;
  font-size: 13px;
  min-height: 24px;
  margin-top: 6px;
}
.unlocked-msg {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 16px;
  font-weight: 700;
  color: #86efac;
  letter-spacing: 0.06em;
}

/* Shake animation */
@keyframes lock-shake {
  0%,100% { transform: translateX(0); }
  14%  { transform: translateX(-10px) rotate(-1.5deg); }
  28%  { transform: translateX(9px)  rotate(1deg); }
  42%  { transform: translateX(-7px) rotate(-0.8deg); }
  57%  { transform: translateX(6px)  rotate(0.6deg); }
  71%  { transform: translateX(-4px); }
  85%  { transform: translateX(3px); }
}
.lock-shake { animation: lock-shake 0.55s ease; }

/* Visual fraction bar models */
.frac-bar-wrap { margin-top: 10px; }
.frac-bar {
  height: 16px;
  border: 1.5px solid var(--ink-muted);
  border-radius: 3px;
  display: flex;
  overflow: hidden;
  margin-bottom: 4px;
}
.frac-bar-seg {
  flex: 1;
  border-right: 1px solid rgba(44,24,16,0.25);
}
.frac-bar-seg:last-child { border-right: none; }
.frac-bar-seg.filled { background: var(--colonial-red); }
.frac-bar-seg.filled-b { background: #2563eb; }
.frac-bar-label { font-size: 10px; color: var(--ink-muted); text-align: left; }
</style>
</head>
<body>
<div class="spy-app">
  <header class="spy-header">
    <h1>&#x1F511; Operation Liberty Quill</h1>
    <div class="spy-name-badge" id="name-badge">Revolutionary War Spy Mission</div>
  </header>
  <div class="progress-bar">
    <div class="pip-row" id="pip-row"></div>
  </div>
  <div class="pip-labels" id="pip-labels"></div>
  <div class="stage-host" id="stage-host"></div>
</div>
<script src="shared.js"></script>
<script>
const STAGE = 8;
const CORRECT = [2, 12, 6]; // the 3-dial combination
const st = loadState();

let dialValues = (st.lockDials || [0, 0, 0]).slice();
let lockSolved  = st.lockSolved || false;

initPage(STAGE);

// ── RENDER ────────────────────────────────────────────────────────────────────
document.getElementById('stage-host').innerHTML = `
  <div class="stage-title">
    <span class="standard-badge badge-math">5.NF.A &amp; 5.NF.B — Fractions</span>
    Crack the Quartermaster's Lock
  </div>
  <p class="stage-subtitle">
    The Patriot supply cache is sealed with a 3-dial combination lock. Each dial must be set to the correct whole number.
    Solve the three fraction problems below to find the combination — then spin the dials and pull the lock!
  </p>

  <!-- ── PROBLEM CARDS ── -->
  <div class="problems-grid">

    <div class="problem-card">
      <div class="dial-badge">&#x1F511; DIAL 1</div>
      <p class="problem-context">
        A spy route has three segments: the first is
        <span class="frac"><span class="frac-n">1</span><span class="frac-d">2</span></span> mile,
        the second is
        <span class="frac"><span class="frac-n">3</span><span class="frac-d">4</span></span> mile,
        and the third is also
        <span class="frac"><span class="frac-n">3</span><span class="frac-d">4</span></span> mile.
        What is the total route length in miles?
      </p>
      <div class="problem-equation">
        <span class="frac"><span class="frac-n">1</span><span class="frac-d">2</span></span>
        +
        <span class="frac"><span class="frac-n">3</span><span class="frac-d">4</span></span>
        +
        <span class="frac"><span class="frac-n">3</span><span class="frac-d">4</span></span>
        = <span class="eq-question">?</span>
      </div>
      <div class="frac-bar-wrap">
        <div class="frac-bar">
          <div class="frac-bar-seg filled"></div><div class="frac-bar-seg"></div>
        </div>
        <div class="frac-bar">
          <div class="frac-bar-seg filled"></div><div class="frac-bar-seg filled"></div><div class="frac-bar-seg filled"></div><div class="frac-bar-seg"></div>
        </div>
        <div class="frac-bar">
          <div class="frac-bar-seg filled"></div><div class="frac-bar-seg filled"></div><div class="frac-bar-seg filled"></div><div class="frac-bar-seg"></div>
        </div>
        <div class="frac-bar-label">Hint: convert to fourths first</div>
      </div>
      <div class="standard-tag">5.NF.A.1 — Add fractions, unlike denominators</div>
    </div>

    <div class="problem-card">
      <div class="dial-badge">&#x1F511; DIAL 2</div>
      <p class="problem-context">
        Washington must pay his spy network
        <span class="frac"><span class="frac-n">3</span><span class="frac-d">5</span></span>
        of the 20 gold coins stored in the war chest.
        How many coins do the spies receive?
      </p>
      <div class="problem-equation">
        <span class="frac"><span class="frac-n">3</span><span class="frac-d">5</span></span>
        &times; 20
        = <span class="eq-question">?</span>
      </div>
      <div class="frac-bar-wrap">
        <div class="frac-bar">
          <div class="frac-bar-seg filled-b"></div>
          <div class="frac-bar-seg filled-b"></div>
          <div class="frac-bar-seg filled-b"></div>
          <div class="frac-bar-seg"></div>
          <div class="frac-bar-seg"></div>
        </div>
        <div class="frac-bar-label">3 of 5 equal groups are shaded — each group = 4 coins</div>
      </div>
      <div class="standard-tag">5.NF.B.4 — Multiply fraction &times; whole number</div>
    </div>

    <div class="problem-card">
      <div class="dial-badge">&#x1F511; DIAL 3</div>
      <p class="problem-context">
        A full barrel of gunpowder is divided into charges of
        <span class="frac"><span class="frac-n">1</span><span class="frac-d">6</span></span>
        of a barrel each.
        How many charges can be made from one full barrel?
      </p>
      <div class="problem-equation">
        1 &divide;
        <span class="frac"><span class="frac-n">1</span><span class="frac-d">6</span></span>
        = <span class="eq-question">?</span>
      </div>
      <div class="frac-bar-wrap">
        <div class="frac-bar">
          <div class="frac-bar-seg filled"></div>
          <div class="frac-bar-seg filled"></div>
          <div class="frac-bar-seg filled"></div>
          <div class="frac-bar-seg filled"></div>
          <div class="frac-bar-seg filled"></div>
          <div class="frac-bar-seg filled"></div>
        </div>
        <div class="frac-bar-label">How many
          <span class="frac" style="font-size:11px"><span class="frac-n">1</span><span class="frac-d">6</span></span>-sized pieces fit in 1 whole?
        </div>
      </div>
      <div class="standard-tag">5.NF.B.7 — Divide whole number by unit fraction</div>
    </div>

  </div><!-- /problems-grid -->

  <!-- ── COMBINATION LOCK ── -->
  <div class="padlock-scene" id="padlock-scene">
    <div class="shackle-wrap">
      <div class="shackle ${lockSolved ? 'open' : ''}" id="shackle"></div>
    </div>
    <div class="lock-body">
      <div class="lock-keyhole ${lockSolved ? 'open-state' : ''}" id="lock-keyhole">
        ${lockSolved ? '&#x1F513;' : '&#x1F512;'}
      </div>
      <div class="dial-row">
        ${[0,1,2].map(i => `
          <div class="dial-wrap">
            <div class="dial-label">Dial ${i + 1}</div>
            <input type="number" class="dial-input ${lockSolved ? 'correct' : ''}" id="di-${i}"
                   min="0" max="99" value="${dialValues[i]}"
                   oninput="handleDial(${i}, this.value)"
                   ${lockSolved ? 'disabled' : ''}>
          </div>`).join('')}
      </div>
      <div class="lock-status" id="lock-status">
        ${lockSolved ? '<div class="unlocked-msg">&#x2713; UNLOCKED</div>' : ''}
      </div>
    </div><!-- /lock-body -->
  </div><!-- /padlock-scene -->

  <div style="text-align:center;margin-bottom:8px">
    <button class="try-btn" id="try-btn" onclick="tryLock()" ${lockSolved ? 'disabled' : ''}>
      &#x1F50F; Pull the Lock
    </button>
  </div>

  <div style="text-align:center;margin-top:18px">
    <button class="continue-btn" id="s8-continue"
            ${lockSolved ? '' : 'disabled'}
            onclick="s8Continue()">
      Lock Cracked &#x2014; Final Report &rarr;
    </button>
  </div>
`;

// ── INTERACTIONS ──────────────────────────────────────────────────────────────
function handleDial(i, raw) {
  const n = parseInt(raw);
  dialValues[i] = isNaN(n) ? 0 : Math.max(0, Math.min(99, n));
  // Clear any styling from previous attempt
  const el = document.getElementById(`di-${i}`);
  if (el) el.classList.remove('correct', 'wrong');
  const status = document.getElementById('lock-status');
  if (status) status.innerHTML = '';
}

function tryLock() {
  if (lockSolved) return;

  // Sync values from inputs in case of direct typing
  [0,1,2].forEach(i => {
    const el = document.getElementById(`di-${i}`);
    if (el) dialValues[i] = parseInt(el.value) || 0;
  });

  const allCorrect = CORRECT.every((v, i) => v === dialValues[i]);

  if (allCorrect) {
    lockSolved = true;

    // Style each dial
    [0,1,2].forEach(i => {
      const el = document.getElementById(`di-${i}`);
      if (el) { el.classList.add('correct'); el.disabled = true; }
    });

    // Animate shackle open
    const shackle = document.getElementById('shackle');
    if (shackle) shackle.classList.add('open');

    const keyhole = document.getElementById('lock-keyhole');
    if (keyhole) { keyhole.textContent = '🔓'; keyhole.classList.add('open-state'); }

    const status = document.getElementById('lock-status');
    if (status) status.innerHTML = '<div class="unlocked-msg">&#x2713; UNLOCKED</div>';

    const tryBtn = document.getElementById('try-btn');
    if (tryBtn) tryBtn.disabled = true;

    const continueBtn = document.getElementById('s8-continue');
    if (continueBtn) continueBtn.disabled = false;

  } else {
    // Wrong — shake and mark each dial
    [0,1,2].forEach(i => {
      const el = document.getElementById(`di-${i}`);
      if (!el) return;
      el.classList.remove('correct', 'wrong');
      el.classList.add(dialValues[i] === CORRECT[i] ? 'correct' : 'wrong');
    });

    const scene = document.getElementById('padlock-scene');
    if (scene) {
      scene.classList.remove('lock-shake');
      void scene.offsetWidth; // force reflow to restart animation
      scene.classList.add('lock-shake');
    }

    const numRight = CORRECT.filter((v, i) => v === dialValues[i]).length;
    const status = document.getElementById('lock-status');
    if (status) {
      status.innerHTML = numRight > 0
        ? `<span class="feedback-err">${numRight}/3 correct. Green dials are right — fix the red ones.</span>`
        : `<span class="feedback-err">Not quite. Re-check each fraction problem and try again.</span>`;
    }
  }
}

function s8Continue() {
  saveState({ lockDials: dialValues, lockSolved });
  goToNextPage(STAGE);
}
</script>
</body>
</html>
