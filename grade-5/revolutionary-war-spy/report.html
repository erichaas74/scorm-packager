<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report — Operation Liberty Quill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="spy-app">
  <header class="spy-header">
    <h1>&#x1F511; Operation Liberty Quill</h1>
    <div class="spy-name-badge" id="name-badge">Revolutionary War Spy Mission</div>
  </header>
  <div class="progress-bar">
    <div class="pip-row" id="pip-row"></div>
  </div>
  <div class="pip-labels" id="pip-labels"></div>
  <div class="stage-host" id="stage-host"></div>
</div>
<script src="shared.js"></script>
<script>
const STAGE = 4;
const st = loadState();
let response1 = st.response1 || '';
let response2 = st.response2 || '';
let response3 = st.response3 || '';

const PROMPTS = [
  { id: 'r1', badge: 'badge-ela', badgeLabel: 'W.5.1 Argument', key: 'response1',
    text: 'What information was most important for spies to deliver during the Revolution — and why was that information so valuable?' },
  { id: 'r2', badge: 'badge-ela', badgeLabel: 'W.5.3 Narrative', key: 'response2',
    text: 'Describe one moment on your spy route. What did you see? What dangers did you face? What did you do?' },
  { id: 'r3', badge: 'badge-hist', badgeLabel: 'History', key: 'response3',
    text: 'How did secret communication affect the outcome of the American Revolution? Use at least one cause and one effect in your answer.' },
];

const responses = { response1, response2, response3 };

initPage(STAGE);

const blocks = PROMPTS.map(p => {
  const val = responses[p.key] || '';
  const wc  = wordCount(val);
  return `
    <div class="prompt-block">
      <p><span class="standard-badge ${p.badge}">${p.badgeLabel}</span><br><br>${p.text}</p>
      <textarea id="${p.id}" rows="4" placeholder="Write your answer here...">${val}</textarea>
      <span class="word-counter ${wc >= 15 ? 'met' : ''}" id="${p.id}-counter">${wc} / 15 words minimum</span>
    </div>`;
}).join('');

document.getElementById('stage-host').innerHTML = `
  <div class="stage-title">
    <span class="standard-badge badge-hist">History + ELA</span>
    Intelligence Report
  </div>
  <p class="stage-subtitle">Answer all three questions. Write at least 15 words each. This is your official spy report!</p>
  ${blocks}
  <div style="text-align:center">
    <button class="continue-btn" id="s4-continue" disabled onclick="s4Continue()">Submit Report &rarr;</button>
  </div>
`;

PROMPTS.forEach(p => {
  const el = document.getElementById(p.id);
  if (!el) return;
  el.addEventListener('input', e => {
    responses[p.key] = e.target.value;
    const wc = wordCount(responses[p.key]);
    const counter = document.getElementById(`${p.id}-counter`);
    if (counter) {
      counter.textContent = `${wc} / 15 words minimum`;
      counter.className = 'word-counter' + (wc >= 15 ? ' met' : '');
    }
    checkS4();
  });
});

checkS4();

function checkS4() {
  const ok = PROMPTS.every(p => wordCount(responses[p.key] || '') >= 15);
  const btn = document.getElementById('s4-continue');
  if (btn) btn.disabled = !ok;
}

function s4Continue() {
  saveState({
    response1: responses.response1,
    response2: responses.response2,
    response3: responses.response3
  });
  goToNextPage(STAGE);
}
</script>
</body>
</html>
