<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Test — Operation Liberty Quill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="spy-app">
  <header class="spy-header">
    <h1>&#x1F511; Operation Liberty Quill</h1>
    <div class="spy-name-badge" id="name-badge">Revolutionary War Spy Mission</div>
  </header>
  <div class="progress-bar">
    <div class="pip-row" id="pip-row"></div>
  </div>
  <div class="pip-labels" id="pip-labels"></div>
  <div class="stage-host" id="stage-host"></div>
</div>
<script src="shared.js"></script>
<script src="graphics-lib.js"></script>
<script>
const STAGE = 3;
const st = loadState();
let materials      = (st.materials      || []).slice();
let testDone       = st.testDone        || false;
let testProtected  = st.testProtected   || false;
let materialReason = st.materialReason  || '';

const MATERIALS = [
  { id: 'wax',     label: 'Wax Paper',   waterproof: true,  color: '#fef3c7', border: '#d97706' },
  { id: 'leather', label: 'Leather',     waterproof: true,  color: '#92400e', border: '#78350f' },
  { id: 'cloth',   label: 'Cloth',       waterproof: false, color: '#bfdbfe', border: '#3b82f6' },
  { id: 'tin',     label: 'Tin Sheet',   waterproof: true,  color: '#cbd5e1', border: '#64748b' },
  { id: 'paper',   label: 'Plain Paper', waterproof: false, color: '#f9fafb', border: '#9ca3af' },
];

initPage(STAGE);

renderPage();

function renderPage() {
  const mCards = MATERIALS.map(m => {
    const sel = materials.includes(m.id) ? ' selected' : '';
    const resultHtml = testDone
      ? `<div class="mat-result ${m.waterproof ? 'ok' : 'bad'}">${m.waterproof ? '&#x2713; Waterproof' : '&#x2717; Not Waterproof'}</div>`
      : '';
    return `<div class="mat-card${sel}" id="mat-${m.id}" onclick="toggleMaterial('${m.id}')">
      <div class="mat-swatch" style="background:${m.color};border-color:${m.border}"></div>
      <h4>${m.label}</h4>
      ${resultHtml}
    </div>`;
  }).join('');

  const wc = wordCount(materialReason);

  document.getElementById('stage-host').innerHTML = `
    <div class="stage-title">
      <span class="standard-badge badge-sci">NGSS 5-PS1-3</span>
      Waterproof Your Message
    </div>
    <p class="stage-subtitle">Choose <strong>2 materials</strong> to protect your message. Then test them in the rain to see which works best!</p>
    <canvas id="rain-canvas" width="560" height="280"></canvas>
    <div class="material-cards">${mCards}</div>
    <div class="rain-result-banner" id="rain-banner"></div>
    <div style="text-align:center;margin-bottom:14px">
      <button class="ctrl-btn" id="rain-btn" onclick="startRainTest()" ${materials.length < 2 ? 'disabled' : ''}>
        &#x1F327; Test in Rain
      </button>
    </div>
    <div id="reason-wrap" style="${testDone ? '' : 'display:none'}">
      <label class="field-label" for="reason-input">Which material would you use to protect a real message — and why? <span style="font-weight:400;color:var(--ink-muted)">(5+ words)</span></label>
      <textarea id="reason-input" rows="3" placeholder="I would choose ___ because...">${materialReason}</textarea>
      <span class="word-counter ${wc >= 5 ? 'met' : ''}" id="reason-counter">${wc} / 5 words minimum</span>
    </div>
    <div style="text-align:center">
      <button class="continue-btn" id="s3-continue" disabled onclick="s3Continue()">Test Complete &rarr;</button>
    </div>
  `;

  redrawRain(false, false);

  if (testDone) {
    showRainBanner();
    checkS3();
  }

  const ri = document.getElementById('reason-input');
  if (ri) {
    ri.addEventListener('input', e => {
      materialReason = e.target.value;
      const wc = wordCount(materialReason);
      const counter = document.getElementById('reason-counter');
      if (counter) {
        counter.textContent = `${wc} / 5 words minimum`;
        counter.className = 'word-counter' + (wc >= 5 ? ' met' : '');
      }
      checkS3();
    });
  }
}

function toggleMaterial(id) {
  if (testDone) return;
  if (materials.includes(id)) {
    materials = materials.filter(m => m !== id);
  } else {
    if (materials.length >= 2) materials.shift();
    materials.push(id);
  }
  MATERIALS.forEach(m => {
    const el = document.getElementById(`mat-${m.id}`);
    if (el) el.className = 'mat-card' + (materials.includes(m.id) ? ' selected' : '');
  });
  const btn = document.getElementById('rain-btn');
  if (btn) btn.disabled = materials.length < 2;
  redrawRain(false, false);
}

function redrawRain(raining, damaged) {
  const { ctx, W, H } = SPY.mount('rain-canvas', 560, 280);
  const sel = materials.length > 0 ? MATERIALS.find(m => m.id === materials[materials.length - 1]) : null;
  SPY.draw.rainScene(ctx, W, H, { raining, damaged, selectedMaterial: sel });
  return { ctx, W, H };
}

let rainDrops = [];
function startRainTest() {
  if (materials.length < 2) return;
  stopAllAnimations();
  testDone = false;

  const btn = document.getElementById('rain-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Testing...'; }

  rainDrops = Array.from({length: 70}, () => ({
    x: Math.random() * 560,
    y: Math.random() * -200,
    speed: 3.5 + Math.random() * 3,
    len: 9 + Math.random() * 9
  }));

  let t = 0;
  function frame() {
    if (!document.getElementById('rain-canvas')) return;
    t++;
    const { ctx } = redrawRain(true, false);
    rainDrops.forEach(d => {
      d.y += d.speed; d.x += 0.6;
      if (d.y > 290) { d.y = -20; d.x = Math.random() * 560; }
    });
    SPY.draw.rainDrops(ctx, rainDrops);
    if (t < 200) {
      _rafId = requestAnimationFrame(frame);
    } else {
      finishRainTest();
    }
  }
  _rafId = requestAnimationFrame(frame);
}

function finishRainTest() {
  testDone = true;
  testProtected = materials.some(id => MATERIALS.find(m => m.id === id && m.waterproof));
  redrawRain(false, !testProtected);

  MATERIALS.forEach(m => {
    const el = document.getElementById(`mat-${m.id}`);
    if (el) {
      const oldResult = el.querySelector('.mat-result');
      if (oldResult) oldResult.remove();
      const r = document.createElement('div');
      r.className = `mat-result ${m.waterproof ? 'ok' : 'bad'}`;
      r.innerHTML = m.waterproof ? '&#x2713; Waterproof' : '&#x2717; Not Waterproof';
      el.appendChild(r);
    }
  });

  showRainBanner();

  const rw = document.getElementById('reason-wrap');
  if (rw) rw.style.display = '';

  const ri = document.getElementById('reason-input');
  if (ri) {
    ri.addEventListener('input', e => {
      materialReason = e.target.value;
      const wc = wordCount(materialReason);
      const counter = document.getElementById('reason-counter');
      if (counter) {
        counter.textContent = `${wc} / 5 words minimum`;
        counter.className = 'word-counter' + (wc >= 5 ? ' met' : '');
      }
      checkS3();
    });
  }
  checkS3();
}

function showRainBanner() {
  const banner = document.getElementById('rain-banner');
  if (!banner) return;
  banner.style.display = '';
  if (testProtected) {
    banner.className = 'rain-result-banner ok';
    banner.innerHTML = '&#x2713; Message Protected! Your material kept the message dry.';
  } else {
    banner.className = 'rain-result-banner bad';
    banner.innerHTML = '&#x2717; Message Damaged! Neither material was waterproof enough.';
  }
}

function checkS3() {
  const btn = document.getElementById('s3-continue');
  if (btn) btn.disabled = !(testDone && wordCount(materialReason) >= 5);
}

function s3Continue() {
  saveState({ materials, testDone, testProtected, materialReason });
  goToNextPage(STAGE);
}
</script>
</body>
</html>
