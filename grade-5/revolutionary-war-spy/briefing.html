<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Briefing — Operation Liberty Quill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="spy-app">
  <header class="spy-header">
    <h1>&#x1F511; Operation Liberty Quill</h1>
    <div class="spy-name-badge" id="name-badge">Revolutionary War Spy Mission</div>
  </header>
  <div class="progress-bar">
    <div class="pip-row" id="pip-row"></div>
  </div>
  <div class="pip-labels" id="pip-labels"></div>
  <div class="stage-host" id="stage-host"></div>
</div>
<script src="shared.js"></script>
<script>
const STAGE = 0;
const st = loadState();
let localName = st.studentName || '';
let localTeam = st.team || '';

initPage(STAGE);

document.getElementById('stage-host').innerHTML = `
  <div class="mission-card">
    <span class="mission-seal">&#x1F50E;</span>
    <h2>&#x2014; Top Secret &#x2014;</h2>
    <div class="typewriter-text" id="tw-text"><span class="cursor-blink"></span></div>
  </div>
  <label class="field-label" for="name-input">Your Agent Name</label>
  <input type="text" id="name-input" placeholder="Enter your name..." maxlength="30" autocomplete="off">
  <div class="team-cards">
    <div class="team-card" id="card-patriot" onclick="selectTeam('patriot')">
      <span class="team-icon">&#x1F1FA;&#x1F1F8;</span>
      <h3>Join the Patriots</h3>
      <p>Fight for independence from Britain. Liberty and freedom are worth the risk.</p>
    </div>
    <div class="team-card" id="card-loyalist" onclick="selectTeam('loyalist')">
      <span class="team-icon">&#x1F451;</span>
      <h3>Join the Loyalists</h3>
      <p>Stay loyal to King George III. Keep order and protect the British Empire.</p>
    </div>
  </div>
  <div style="text-align:center">
    <button class="continue-btn" id="s0-continue" disabled onclick="s0Continue()">Accept the Mission &rarr;</button>
  </div>
`;

// Restore previous values
document.getElementById('name-input').value = localName;
if (localTeam === 'patriot')  document.getElementById('card-patriot').className  = 'team-card selected-patriot';
if (localTeam === 'loyalist') document.getElementById('card-loyalist').className = 'team-card selected-loyalist';
checkS0();

// Typewriter
const missionText = "The year is 1776. The colonies are at war with Britain. Both sides depend on secret messages to win. As an intelligence agent, you must craft a coded message, plan a safe route across enemy territory, test the best way to protect your message from rain, and write a full intelligence report. The fate of the Revolution may depend on you.";
let i = 0;
const twEl = document.getElementById('tw-text');
(function type() {
  if (i <= missionText.length) {
    twEl.innerHTML = missionText.slice(0, i) + '<span class="cursor-blink"></span>';
    i++;
    setTimeout(type, 22);
  }
})();

document.getElementById('name-input').addEventListener('input', e => {
  localName = e.target.value;
  checkS0();
});

function selectTeam(team) {
  localTeam = team;
  document.getElementById('card-patriot').className  = 'team-card' + (team === 'patriot'  ? ' selected-patriot'  : '');
  document.getElementById('card-loyalist').className = 'team-card' + (team === 'loyalist' ? ' selected-loyalist' : '');
  checkS0();
}

function checkS0() {
  document.getElementById('s0-continue').disabled = !(localName.trim().length > 0 && localTeam !== '');
}

function s0Continue() {
  saveState({ studentName: localName.trim(), team: localTeam });
  goToNextPage(STAGE);
}
</script>
</body>
</html>
