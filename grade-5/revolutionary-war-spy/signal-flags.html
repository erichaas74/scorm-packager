<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal Flags — Operation Liberty Quill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.signal-section-label {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.signal-section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--parchment-md);
}
canvas.flag-canvas {
  display: block;
  width: 100%;
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm);
  background: var(--parchment-dk);
}

.decode-grid {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  margin: 16px 0;
}
.decode-slot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}
.decode-num {
  font-size: 11px;
  font-weight: 700;
  font-family: 'Space Grotesk', sans-serif;
  color: var(--ink-muted);
}
.flag-input {
  width: 48px;
  height: 48px;
  font-size: 22px;
  font-weight: 700;
  font-family: 'Space Grotesk', sans-serif;
  text-align: center;
  text-transform: uppercase;
  border: 2.5px solid var(--parchment-md);
  border-radius: var(--radius-sm);
  background: white;
  color: var(--ink);
  transition: border-color 0.2s, background 0.2s;
}
.flag-input:focus   { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
.flag-input.correct { border-color: var(--green); background: var(--green-lt); color: var(--green); }
.flag-input.wrong   { border-color: var(--colonial-red); background: var(--red-lt); color: var(--colonial-red); }
.flag-input:disabled { cursor: default; }

.decode-result {
  padding: 14px 20px;
  border-radius: var(--radius-md);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 15px;
  font-weight: 700;
  text-align: center;
  margin: 12px 0;
  line-height: 1.6;
  display: none;
}
.decode-result.ok  { background: var(--green-lt); color: #065f46; border: 2px solid var(--green); }
.decode-result.bad { background: var(--red-lt);   color: var(--colonial-red); }

.mission-word {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 36px;
  font-weight: 700;
  letter-spacing: 0.18em;
  color: var(--colonial-red);
  text-align: center;
  margin: 6px 0 2px;
}
</style>
</head>
<body>
<div class="spy-app">
  <header class="spy-header">
    <h1>&#x1F511; Operation Liberty Quill</h1>
    <div class="spy-name-badge" id="name-badge">Revolutionary War Spy Mission</div>
  </header>
  <div class="progress-bar">
    <div class="pip-row" id="pip-row"></div>
  </div>
  <div class="pip-labels" id="pip-labels"></div>
  <div class="stage-host" id="stage-host"></div>
</div>
<script src="shared.js"></script>
<script>
const STAGE = 7;
const st = loadState();

let guesses = (st.flagGuesses || ['','','','','','','']).slice();
let flagDecoded = st.flagDecoded || false;

// ── FLAG DATA ─────────────────────────────────────────────────────────────────
// [bg1, bg2, shape]
const FLAG_DATA = {
  A: ['#ffffff', '#1e40af', 'xdiag'],
  B: ['#dc2626', '#ffffff', 'hstripe'],
  C: ['#f59e0b', '#111827', 'circle'],
  E: ['#2563eb', '#dc2626', 'hstripe'],
  I: ['#dc2626', '#f59e0b', 'vhalf'],
  K: ['#ffffff', '#2563eb', 'diagonal'],
  L: ['#111827', '#f59e0b', 'ltriangle'],
  M: ['#f1f5f9', '#dc2626', 'chevron'],
  P: ['#1e3a8a', '#ffffff', 'innersq'],
  R: ['#f1f5f9', '#dc2626', 'rtriangle'],
  T: ['#374151', '#ffffff', 'hstripe'],
  Y: ['#dc2626', '#fde047', 'vstripes'],
};

// 12-flag codebook (alphabetical), includes all 7 LIBERTY letters + 5 decoys
const CODEBOOK = ['A','B','C','E','I','K','L','M','P','R','T','Y'];
const PUZZLE   = ['L','I','B','E','R','T','Y']; // the secret word
const ANSWER   = 'LIBERTY';

// ── FLAG DRAWING ──────────────────────────────────────────────────────────────
function drawFlag(ctx, letter, x, y, w, h) {
  const d = FLAG_DATA[letter];
  if (!d) {
    ctx.fillStyle = '#94a3b8';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1.5; ctx.strokeRect(x, y, w, h);
    return;
  }
  const [bg1, bg2, shape] = d;

  // Background
  ctx.fillStyle = bg1;
  ctx.fillRect(x, y, w, h);

  // Shape in bg2
  ctx.fillStyle = bg2;
  switch (shape) {
    case 'xdiag': {
      const t = w * 0.22;
      ctx.save();
      ctx.translate(x + w/2, y + h/2);
      ctx.rotate(Math.PI / 4);
      ctx.fillRect(-w * 0.8, -t/2, w * 1.6, t);
      ctx.fillRect(-t/2, -h * 0.8, t, h * 1.6);
      ctx.restore();
      break;
    }
    case 'hstripe':
      ctx.fillRect(x, y + h * 0.37, w, h * 0.26);
      break;
    case 'circle':
      ctx.beginPath();
      ctx.arc(x + w/2, y + h/2, Math.min(w, h) * 0.3, 0, Math.PI * 2);
      ctx.fill();
      break;
    case 'vhalf':
      ctx.fillRect(x + w/2, y, w/2, h);
      break;
    case 'diagonal':
      ctx.beginPath();
      ctx.moveTo(x, y); ctx.lineTo(x + w, y + h);
      ctx.lineTo(x + w, y + h - w * 0.24);
      ctx.lineTo(x + w * 0.24, y);
      ctx.closePath(); ctx.fill();
      break;
    case 'ltriangle':
      ctx.beginPath();
      ctx.moveTo(x, y); ctx.lineTo(x + w, y + h/2); ctx.lineTo(x, y + h);
      ctx.closePath(); ctx.fill();
      break;
    case 'chevron':
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + w * 0.52, y + h/2);
      ctx.lineTo(x, y + h);
      ctx.lineTo(x + w * 0.22, y + h);
      ctx.lineTo(x + w * 0.74, y + h/2);
      ctx.lineTo(x + w * 0.22, y);
      ctx.closePath(); ctx.fill();
      break;
    case 'innersq': {
      const m = Math.min(w, h) * 0.22;
      ctx.fillRect(x + m, y + m, w - m*2, h - m*2);
      break;
    }
    case 'rtriangle':
      ctx.beginPath();
      ctx.moveTo(x + w, y); ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h/2);
      ctx.closePath(); ctx.fill();
      break;
    case 'vstripes':
      for (let k = 1; k < 5; k += 2)
        ctx.fillRect(x + k * w/5, y, w/5, h);
      break;
  }

  // Border
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(x + 0.75, y + 0.75, w - 1.5, h - 1.5);
}

// ── CANVAS RENDERS ────────────────────────────────────────────────────────────
function drawCodebook() {
  const canvas = document.getElementById('codebook-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // Background
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, W, H);

  const COLS = 6, ROWS = 2;
  const padX = 14, padY = 12;
  const gapX = 8, gapY = 10;
  const labelH = 20;
  const cellW = (W - 2*padX - (COLS-1)*gapX) / COLS;
  const cellH = (H - 2*padY - (ROWS-1)*gapY) / ROWS;
  const flagH  = cellH - labelH;

  CODEBOOK.forEach((letter, idx) => {
    const col = idx % COLS;
    const row = Math.floor(idx / COLS);
    const cx = padX + col * (cellW + gapX);
    const cy = padY + row * (cellH + gapY);

    drawFlag(ctx, letter, cx, cy, cellW, flagH);

    // Letter label below flag
    ctx.fillStyle = '#f0d080';
    ctx.font = 'bold 13px "Space Grotesk", Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(letter, cx + cellW/2, cy + flagH + labelH/2);
  });
}

function drawPuzzle() {
  const canvas = document.getElementById('puzzle-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, W, H);

  const N = PUZZLE.length;
  const padX = 12, padY = 10;
  const gapX = 10;
  const numH = 18;
  const cellW = (W - 2*padX - (N-1)*gapX) / N;
  const flagH = H - 2*padY - numH - 4;

  PUZZLE.forEach((letter, i) => {
    const cx = padX + i * (cellW + gapX);
    const cy = padY + numH + 4;

    // Number above
    ctx.fillStyle = '#94a3b8';
    ctx.font = 'bold 11px "Space Grotesk", Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(i + 1, cx + cellW/2, padY + numH/2);

    drawFlag(ctx, letter, cx, cy, cellW, flagH);
  });
}

// ── PAGE RENDER ───────────────────────────────────────────────────────────────
function renderPage() {
  const inputsHTML = PUZZLE.map((_, i) => `
    <div class="decode-slot">
      <div class="decode-num">${i + 1}</div>
      <input type="text" class="flag-input" id="fi-${i}"
             maxlength="1" placeholder="?"
             value="${guesses[i]}"
             oninput="handleInput(${i}, this.value)"
             ${flagDecoded ? 'disabled' : ''}>
    </div>`).join('');

  document.getElementById('stage-host').innerHTML = `
    <div class="stage-title">
      <span class="standard-badge badge-hist">History — Signal Intelligence</span>
      Decode the Signal Flags
    </div>
    <p class="stage-subtitle">Washington's spy network used signal flags to send messages that couldn't be intercepted by the British. Headquarters just sent you a coded word — use the codebook below to decode each flag and reveal the mission's rallying cry!</p>

    <div class="signal-section-label">Flag Codebook — 12 Signal Flags</div>
    <canvas id="codebook-canvas" class="flag-canvas" width="432" height="196"></canvas>

    <div style="margin-top:20px">
      <div class="signal-section-label">Encoded Message from Headquarters — 7 Flags</div>
      <canvas id="puzzle-canvas" class="flag-canvas" width="504" height="112"></canvas>
    </div>

    <div style="margin-top:18px;text-align:center">
      <p style="font-size:13px;color:var(--ink-muted);margin-bottom:10px">Match each numbered flag to its letter from the codebook above. Type one letter per box.</p>
      <div class="decode-grid">${inputsHTML}</div>
    </div>

    <div class="decode-result" id="decode-result"></div>
    ${flagDecoded ? `<div class="mission-word">&#x1F4DC; ${ANSWER}</div>` : ''}

    <div style="text-align:center;margin-bottom:6px">
      <button class="ctrl-btn" id="decode-btn" onclick="checkAnswer()" ${flagDecoded ? 'disabled' : ''}>
        &#x1F50D; Decode Message
      </button>
    </div>

    <div style="text-align:center">
      <button class="continue-btn" id="s7-continue"
              ${flagDecoded ? '' : 'disabled'}
              onclick="s7Continue()">
        Mission Complete &#x2014; View Portfolio &rarr;
      </button>
    </div>
  `;

  drawCodebook();
  drawPuzzle();

  // Restore correct styling if returning to a completed page
  if (flagDecoded) {
    PUZZLE.forEach((_, i) => {
      const el = document.getElementById(`fi-${i}`);
      if (el) el.classList.add('correct');
    });
    const result = document.getElementById('decode-result');
    if (result) {
      result.style.display = '';
      result.className = 'decode-result ok';
      result.innerHTML = `&#x1F3C6; Correct! The secret rallying cry is <span style="letter-spacing:0.12em">LIBERTY</span> — the word that united the colonies and started a revolution.`;
    }
  }
}

// ── INTERACTIONS ──────────────────────────────────────────────────────────────
function handleInput(i, val) {
  guesses[i] = val.toUpperCase().replace(/[^A-Z]/g, '');
  const el = document.getElementById(`fi-${i}`);
  if (el) {
    el.value = guesses[i];
    el.classList.remove('correct', 'wrong');
  }
  const result = document.getElementById('decode-result');
  if (result) result.style.display = 'none';
}

function checkAnswer() {
  const result = document.getElementById('decode-result');
  let allCorrect = true;

  PUZZLE.forEach((letter, i) => {
    const el = document.getElementById(`fi-${i}`);
    if (!el) return;
    el.classList.remove('correct', 'wrong');
    if (guesses[i] === letter) {
      el.classList.add('correct');
    } else {
      el.classList.add('wrong');
      allCorrect = false;
    }
  });

  if (allCorrect) {
    flagDecoded = true;

    if (result) {
      result.style.display = '';
      result.className = 'decode-result ok';
      result.innerHTML = `&#x1F3C6; Correct! The secret rallying cry is <span style="letter-spacing:0.12em">LIBERTY</span> — the word that united the colonies and started a revolution.`;
    }

    // Insert the big reveal word
    const existing = document.querySelector('.mission-word');
    if (!existing && result) {
      const mw = document.createElement('div');
      mw.className = 'mission-word';
      mw.innerHTML = '&#x1F4DC; LIBERTY';
      result.insertAdjacentElement('afterend', mw);
    }

    PUZZLE.forEach((_, i) => {
      const el = document.getElementById(`fi-${i}`);
      if (el) el.disabled = true;
    });

    const decodeBtn = document.getElementById('decode-btn');
    if (decodeBtn) decodeBtn.disabled = true;

    const continueBtn = document.getElementById('s7-continue');
    if (continueBtn) continueBtn.disabled = false;

  } else {
    const correct = PUZZLE.filter((l, i) => guesses[i] === l).length;
    if (result) {
      result.style.display = '';
      result.className = 'decode-result bad';
      result.innerHTML = `&#x26A0; ${correct} of 7 flags decoded correctly. The wrong ones are highlighted in red — look those flags up again in the codebook!`;
    }
  }
}

function s7Continue() {
  saveState({ flagGuesses: guesses, flagDecoded });
  goToNextPage(STAGE);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
initPage(STAGE);
renderPage();
</script>
</body>
</html>
