<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal Flags — Operation Liberty Quill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.signal-section-label {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.signal-section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--parchment-md);
}
canvas.flag-canvas {
  display: block;
  width: 100%;
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm);
  background: var(--parchment-dk);
}

.decode-grid {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  margin: 16px 0;
}
.decode-slot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}
.decode-num {
  font-size: 11px;
  font-weight: 700;
  font-family: 'Space Grotesk', sans-serif;
  color: var(--ink-muted);
}
.flag-input {
  width: 48px;
  height: 48px;
  font-size: 22px;
  font-weight: 700;
  font-family: 'Space Grotesk', sans-serif;
  text-align: center;
  text-transform: uppercase;
  border: 2.5px solid var(--parchment-md);
  border-radius: var(--radius-sm);
  background: white;
  color: var(--ink);
  transition: border-color 0.2s, background 0.2s;
}
.flag-input:focus   { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
.flag-input.correct { border-color: var(--green); background: var(--green-lt); color: var(--green); }
.flag-input.wrong   { border-color: var(--colonial-red); background: var(--red-lt); color: var(--colonial-red); }
.flag-input:disabled { cursor: default; }

.decode-result {
  padding: 14px 20px;
  border-radius: var(--radius-md);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 15px;
  font-weight: 700;
  text-align: center;
  margin: 12px 0;
  line-height: 1.6;
  display: none;
}
.decode-result.ok  { background: var(--green-lt); color: #065f46; border: 2px solid var(--green); }
.decode-result.bad { background: var(--red-lt);   color: var(--colonial-red); }

.mission-word {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 36px;
  font-weight: 700;
  letter-spacing: 0.18em;
  color: var(--colonial-red);
  text-align: center;
  margin: 6px 0 2px;
}
</style>
</head>
<body>
<div class="spy-app">
  <header class="spy-header">
    <h1>&#x1F511; Operation Liberty Quill</h1>
    <div class="spy-name-badge" id="name-badge">Revolutionary War Spy Mission</div>
  </header>
  <div class="progress-bar">
    <div class="pip-row" id="pip-row"></div>
  </div>
  <div class="pip-labels" id="pip-labels"></div>
  <div class="stage-host" id="stage-host"></div>
</div>
<script src="shared.js"></script>
<script src="graphics-lib.js"></script>
<script>
const STAGE = 7;
const st = loadState();

let guesses = (st.flagGuesses || ['','','','','','','']).slice();
let flagDecoded = st.flagDecoded || false;


// 12-flag codebook (alphabetical), includes all 7 LIBERTY letters + 5 decoys
const CODEBOOK = ['A','B','C','E','I','K','L','M','P','R','T','Y'];
const PUZZLE   = ['L','I','B','E','R','T','Y']; // the secret word
const ANSWER   = 'LIBERTY';


// ── PAGE RENDER ───────────────────────────────────────────────────────────────
function renderPage() {
  const inputsHTML = PUZZLE.map((_, i) => `
    <div class="decode-slot">
      <div class="decode-num">${i + 1}</div>
      <input type="text" class="flag-input" id="fi-${i}"
             maxlength="1" placeholder="?"
             value="${guesses[i]}"
             oninput="handleInput(${i}, this.value)"
             ${flagDecoded ? 'disabled' : ''}>
    </div>`).join('');

  document.getElementById('stage-host').innerHTML = `
    <div class="stage-title">
      <span class="standard-badge badge-hist">History — Signal Intelligence</span>
      Decode the Signal Flags
    </div>
    <p class="stage-subtitle">Washington's spy network used signal flags to send messages that couldn't be intercepted by the British. Headquarters just sent you a coded word — use the codebook below to decode each flag and reveal the mission's rallying cry!</p>

    <div class="signal-section-label">Flag Codebook — 12 Signal Flags</div>
    <canvas id="codebook-canvas" class="flag-canvas" width="432" height="196"></canvas>

    <div style="margin-top:20px">
      <div class="signal-section-label">Encoded Message from Headquarters — 7 Flags</div>
      <canvas id="puzzle-canvas" class="flag-canvas" width="504" height="112"></canvas>
    </div>

    <div style="margin-top:18px;text-align:center">
      <p style="font-size:13px;color:var(--ink-muted);margin-bottom:10px">Match each numbered flag to its letter from the codebook above. Type one letter per box.</p>
      <div class="decode-grid">${inputsHTML}</div>
    </div>

    <div class="decode-result" id="decode-result"></div>
    ${flagDecoded ? `<div class="mission-word">&#x1F4DC; ${ANSWER}</div>` : ''}

    <div style="text-align:center;margin-bottom:6px">
      <button class="ctrl-btn" id="decode-btn" onclick="checkAnswer()" ${flagDecoded ? 'disabled' : ''}>
        &#x1F50D; Decode Message
      </button>
    </div>

    <div style="text-align:center">
      <button class="continue-btn" id="s7-continue"
              ${flagDecoded ? '' : 'disabled'}
              onclick="s7Continue()">
        Mission Complete &#x2014; View Portfolio &rarr;
      </button>
    </div>
  `;

  const cb = SPY.mount('codebook-canvas', 432, 196);
  SPY.draw.flagCodebook(cb.ctx, cb.W, cb.H, { codebook: CODEBOOK });
  const pz = SPY.mount('puzzle-canvas', 504, 112);
  SPY.draw.flagPuzzle(pz.ctx, pz.W, pz.H, { puzzle: PUZZLE });

  // Restore correct styling if returning to a completed page
  if (flagDecoded) {
    PUZZLE.forEach((_, i) => {
      const el = document.getElementById(`fi-${i}`);
      if (el) el.classList.add('correct');
    });
    const result = document.getElementById('decode-result');
    if (result) {
      result.style.display = '';
      result.className = 'decode-result ok';
      result.innerHTML = `&#x1F3C6; Correct! The secret rallying cry is <span style="letter-spacing:0.12em">LIBERTY</span> — the word that united the colonies and started a revolution.`;
    }
  }
}

// ── INTERACTIONS ──────────────────────────────────────────────────────────────
function handleInput(i, val) {
  guesses[i] = val.toUpperCase().replace(/[^A-Z]/g, '');
  const el = document.getElementById(`fi-${i}`);
  if (el) {
    el.value = guesses[i];
    el.classList.remove('correct', 'wrong');
  }
  const result = document.getElementById('decode-result');
  if (result) result.style.display = 'none';
}

function checkAnswer() {
  const result = document.getElementById('decode-result');
  let allCorrect = true;

  PUZZLE.forEach((letter, i) => {
    const el = document.getElementById(`fi-${i}`);
    if (!el) return;
    el.classList.remove('correct', 'wrong');
    if (guesses[i] === letter) {
      el.classList.add('correct');
    } else {
      el.classList.add('wrong');
      allCorrect = false;
    }
  });

  if (allCorrect) {
    flagDecoded = true;

    if (result) {
      result.style.display = '';
      result.className = 'decode-result ok';
      result.innerHTML = `&#x1F3C6; Correct! The secret rallying cry is <span style="letter-spacing:0.12em">LIBERTY</span> — the word that united the colonies and started a revolution.`;
    }

    // Insert the big reveal word
    const existing = document.querySelector('.mission-word');
    if (!existing && result) {
      const mw = document.createElement('div');
      mw.className = 'mission-word';
      mw.innerHTML = '&#x1F4DC; LIBERTY';
      result.insertAdjacentElement('afterend', mw);
    }

    PUZZLE.forEach((_, i) => {
      const el = document.getElementById(`fi-${i}`);
      if (el) el.disabled = true;
    });

    const decodeBtn = document.getElementById('decode-btn');
    if (decodeBtn) decodeBtn.disabled = true;

    const continueBtn = document.getElementById('s7-continue');
    if (continueBtn) continueBtn.disabled = false;

  } else {
    const correct = PUZZLE.filter((l, i) => guesses[i] === l).length;
    if (result) {
      result.style.display = '';
      result.className = 'decode-result bad';
      result.innerHTML = `&#x26A0; ${correct} of 7 flags decoded correctly. The wrong ones are highlighted in red — look those flags up again in the codebook!`;
    }
  }
}

function s7Continue() {
  saveState({ flagGuesses: guesses, flagDecoded });
  goToNextPage(STAGE);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
initPage(STAGE);
renderPage();
</script>
</body>
</html>
