<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operation Liberty Quill — Revolutionary War Spy Mission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --parchment:    #f5e6c8;
  --parchment-dk: #e8d5a8;
  --parchment-md: #eeddb5;
  --ink:          #2c1810;
  --ink-muted:    #5c3d2e;
  --colonial-red: #8b1a1a;
  --colonial-red-lt: #c0392b;
  --gold:         #c4932f;
  --gold-lt:      #f0d080;
  --blue:         #2563eb;
  --blue-dk:      #1d4ed8;
  --green:        #16a34a;
  --green-lt:     #dcfce7;
  --red-lt:       #fee2e2;
  --shadow:       0 8px 24px rgba(44,24,16,0.18);
  --shadow-sm:    0 2px 8px rgba(44,24,16,0.12);
  --radius-lg:    18px;
  --radius-md:    12px;
  --radius-sm:    8px;
  font-family: 'Instrument Sans', Arial, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #2c1810;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  padding: 20px 12px 40px;
}

.spy-app {
  width: min(880px, 100%);
  background: var(--parchment);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  overflow: hidden;
}

/* ── HEADER ── */
.spy-header {
  background: #0f172a;
  color: var(--gold-lt);
  padding: 14px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.spy-header h1 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--gold-lt);
}
.spy-name-badge {
  font-size: 13px;
  font-weight: 600;
  color: #94a3b8;
  white-space: nowrap;
}
.spy-name-badge span {
  color: var(--gold-lt);
}

/* ── PROGRESS BAR ── */
.progress-bar {
  background: var(--parchment-dk);
  border-bottom: 2px solid var(--gold);
  padding: 12px 22px;
  display: flex;
  align-items: center;
  gap: 0;
}
.pip-row {
  display: flex;
  align-items: center;
  gap: 0;
  flex: 1;
}
.pip {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 2px solid var(--ink-muted);
  background: var(--parchment);
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Space Grotesk', sans-serif;
  flex-shrink: 0;
  transition: background 0.3s, border-color 0.3s, color 0.3s;
}
.pip.active {
  background: var(--colonial-red);
  border-color: var(--colonial-red);
  color: white;
  box-shadow: 0 0 0 3px rgba(139,26,26,0.2);
}
.pip.done {
  background: var(--green);
  border-color: var(--green);
  color: white;
}
.pip-connector {
  height: 2px;
  flex: 1;
  background: var(--parchment-md);
  transition: background 0.3s;
}
.pip-connector.done {
  background: var(--green);
}
.pip-labels {
  display: flex;
  margin-top: 6px;
  padding: 0 22px;
  background: var(--parchment-dk);
  padding-bottom: 8px;
}
.pip-label {
  flex: 1;
  font-size: 10px;
  color: var(--ink-muted);
  text-align: center;
  font-weight: 600;
  letter-spacing: 0.02em;
}

/* ── STAGE HOST ── */
.stage-host {
  padding: 26px 22px 32px;
  transition: opacity 0.3s ease;
  min-height: 400px;
}

/* ── COMMON COMPONENTS ── */
.stage-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 6px;
}
.stage-subtitle {
  font-size: 14px;
  color: var(--ink-muted);
  margin-bottom: 20px;
  line-height: 1.5;
}
.standard-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 99px;
  letter-spacing: 0.04em;
  margin-right: 4px;
}
.badge-math  { background: #dbeafe; color: #1d4ed8; }
.badge-sci   { background: #d1fae5; color: #065f46; }
.badge-ela   { background: #ede9fe; color: #5b21b6; }
.badge-hist  { background: #fef3c7; color: #92400e; }

.continue-btn {
  background: var(--colonial-red);
  color: white;
  border: none;
  border-radius: var(--radius-md);
  padding: 13px 32px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 22px;
  transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
  box-shadow: var(--shadow-sm);
}
.continue-btn:hover:not(:disabled) {
  background: var(--colonial-red-lt);
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(139,26,26,0.3);
}
.continue-btn:disabled {
  background: #9ca3af;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.feedback-ok  { color: var(--green); font-weight: 700; font-size: 13px; }
.feedback-err { color: var(--colonial-red); font-weight: 700; font-size: 13px; }

canvas {
  display: block;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
}

.ctrl-btn {
  background: var(--parchment-dk);
  border: 1.5px solid var(--ink-muted);
  border-radius: var(--radius-sm);
  padding: 8px 18px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
}
.ctrl-btn:hover { background: var(--parchment-md); transform: translateY(-1px); }
.ctrl-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

textarea, input[type="text"] {
  font-family: 'Instrument Sans', Arial, sans-serif;
  font-size: 14px;
  border: 1.5px solid var(--parchment-md);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  background: white;
  color: var(--ink);
  width: 100%;
  transition: border-color 0.2s;
  resize: vertical;
}
textarea:focus, input[type="text"]:focus {
  outline: none;
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
}

/* ── STAGE 0 ── */
.mission-card {
  background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
  border-radius: var(--radius-lg);
  padding: 28px 28px 24px;
  color: white;
  margin-bottom: 22px;
  position: relative;
  overflow: hidden;
}
.mission-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: url("data:image/svg+xml,%3Csvg width='40' height='40' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='1' cy='1' r='1' fill='rgba(255,255,255,0.04)'/%3E%3C/svg%3E") repeat;
}
.mission-seal {
  font-size: 48px;
  text-align: center;
  display: block;
  margin-bottom: 10px;
  position: relative;
}
.mission-card h2 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 19px;
  font-weight: 700;
  color: var(--gold-lt);
  text-align: center;
  margin-bottom: 14px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  position: relative;
}
.typewriter-text {
  font-size: 13.5px;
  line-height: 1.7;
  color: #cbd5e1;
  font-style: italic;
  min-height: 80px;
  position: relative;
}
.cursor-blink {
  display: inline-block;
  width: 2px;
  height: 14px;
  background: var(--gold-lt);
  margin-left: 2px;
  animation: blink 0.8s infinite;
  vertical-align: middle;
}
@keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

.team-cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 18px;
}
.team-card {
  border: 2.5px solid var(--parchment-md);
  border-radius: var(--radius-md);
  padding: 18px 14px;
  cursor: pointer;
  text-align: center;
  transition: border-color 0.2s, box-shadow 0.2s, transform 0.1s;
  background: white;
}
.team-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.team-card.selected-patriot { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,0.2); }
.team-card.selected-loyalist { border-color: var(--colonial-red); box-shadow: 0 0 0 3px rgba(139,26,26,0.2); }
.team-icon { font-size: 36px; display: block; margin-bottom: 8px; }
.team-card h3 { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 700; color: var(--ink); }
.team-card p { font-size: 12px; color: var(--ink-muted); margin-top: 4px; line-height: 1.4; }

.field-label {
  display: block;
  font-weight: 600;
  font-size: 13px;
  color: var(--ink);
  margin-bottom: 6px;
  margin-top: 16px;
}

/* ── STAGE 1 ── */
.cipher-layout {
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: 24px;
  align-items: start;
}
@media (max-width: 680px) {
  .cipher-layout { grid-template-columns: 1fr; }
  #cipher-canvas { width: 100% !important; height: auto !important; max-width: 340px; margin: 0 auto; }
}
.cipher-controls { display: flex; flex-direction: column; gap: 14px; }
.cipher-controls label { font-size: 13px; font-weight: 600; color: var(--ink); display: block; margin-bottom: 4px; }
input[type="range"] { width: 100%; accent-color: var(--colonial-red); }
.shift-display { font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; color: var(--colonial-red); }
.coded-output {
  background: #0f172a;
  color: var(--gold-lt);
  font-family: 'Courier New', monospace;
  font-size: 16px;
  font-weight: 700;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  min-height: 48px;
  letter-spacing: 0.12em;
  word-break: break-all;
  line-height: 1.6;
}
.coded-char { transition: text-shadow 0.3s; }
.coded-char.glow { text-shadow: 0 0 10px #c4932f; }

.intercept-box {
  margin-top: 22px;
  border: 2px dashed var(--gold);
  border-radius: var(--radius-md);
  padding: 18px;
  background: #fefce8;
  position: relative;
}
.intercept-box h4 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.intercept-coded {
  font-family: 'Courier New', monospace;
  font-size: 18px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: 0.1em;
  margin-bottom: 12px;
  word-break: break-all;
}
.decode-row { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
.decode-row input { flex: 1; }
.unlock-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 99px;
  font-size: 12px;
  font-weight: 700;
  margin-top: 8px;
}
.unlock-badge.unlocked { background: var(--green-lt); color: var(--green); }
.unlock-badge.locked   { background: var(--red-lt); color: var(--colonial-red); }

/* ── STAGE 2 ── */
.map-wrap {
  position: relative;
  width: 100%;
  max-width: 620px;
  margin: 0 auto;
}
#map-canvas { width: 100%; cursor: crosshair; }
.coord-list-wrap { margin-top: 14px; }
.coord-list-wrap h4 { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; color: var(--ink-muted); margin-bottom: 8px; letter-spacing: 0.04em; }
#coord-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  list-style: none;
  min-height: 36px;
}
#coord-list li {
  background: var(--blue);
  color: white;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 99px;
}
#route-warning { margin-top: 8px; font-size: 13px; }
.map-toolbar { display: flex; gap: 10px; margin-top: 12px; align-items: center; }

/* ── STAGE 3 ── */
#rain-canvas { width: 100%; max-width: 560px; margin: 0 auto 16px; cursor: default; }
.material-cards {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin-bottom: 16px;
}
.mat-card {
  border: 2.5px solid var(--parchment-md);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  cursor: pointer;
  text-align: center;
  width: 120px;
  transition: border-color 0.2s, box-shadow 0.2s, transform 0.1s;
  background: white;
  user-select: none;
}
.mat-card:hover { transform: translateY(-2px); }
.mat-card.selected { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,0.2); }
.mat-swatch { width: 40px; height: 40px; border-radius: 6px; margin: 0 auto 8px; border: 1px solid rgba(0,0,0,0.1); }
.mat-card h4 { font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 700; color: var(--ink); }
.mat-result { font-size: 11px; font-weight: 600; margin-top: 4px; }
.mat-result.ok  { color: var(--green); }
.mat-result.bad { color: var(--colonial-red); }

.rain-result-banner {
  text-align: center;
  padding: 12px 20px;
  border-radius: var(--radius-md);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 14px;
  display: none;
}
.rain-result-banner.ok  { background: var(--green-lt); color: var(--green); }
.rain-result-banner.bad { background: var(--red-lt); color: var(--colonial-red); }

/* ── STAGE 4 ── */
.prompt-block {
  background: white;
  border: 1.5px solid var(--parchment-md);
  border-radius: var(--radius-md);
  padding: 18px;
  margin-bottom: 16px;
}
.prompt-block p { font-size: 14px; color: var(--ink); margin-bottom: 10px; line-height: 1.5; font-weight: 500; }
.word-counter { font-size: 12px; color: var(--ink-muted); margin-top: 6px; display: block; }
.word-counter.met { color: var(--green); font-weight: 700; }

/* ── STAGE 5 ── */
#confetti-canvas { width: 100%; border-radius: var(--radius-md) var(--radius-md) 0 0; display: block; }
.portfolio-card {
  background: white;
  border: 2px solid var(--parchment-md);
  border-radius: var(--radius-md);
  padding: 24px;
  margin-top: 16px;
}
.portfolio-section { margin-bottom: 20px; border-bottom: 1px solid var(--parchment-md); padding-bottom: 16px; }
.portfolio-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.portfolio-section h3 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 10px;
}
.portfolio-section p, .portfolio-section .port-val {
  font-size: 14px;
  color: var(--ink);
  line-height: 1.6;
  margin-bottom: 6px;
}
.port-val strong { color: var(--ink-muted); font-size: 12px; display: block; font-weight: 600; }
.team-badge-port {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 99px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13px;
  font-weight: 700;
  margin-left: 8px;
}
.team-patriot  { background: #dbeafe; color: #1d4ed8; }
.team-loyalist { background: var(--red-lt); color: var(--colonial-red); }

.complete-banner {
  text-align: center;
  margin-bottom: 16px;
}
.complete-banner h2 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 28px;
  font-weight: 700;
  color: var(--ink);
}
.complete-banner p { font-size: 15px; color: var(--ink-muted); margin-top: 6px; }

/* ── PRINT ── */
@media print {
  body { background: white; padding: 0; }
  .spy-header, .progress-bar, .pip-labels,
  .no-print, button, .continue-btn { display: none !important; }
  .spy-app { box-shadow: none; border-radius: 0; }
  .stage-host { padding: 12px; }
  .portfolio-card { border: 1px solid #ccc; }
  #confetti-canvas { display: none; }
}
</style>
</head>
<body>
<div class="spy-app">
  <header class="spy-header">
    <h1>&#x1F511; Operation Liberty Quill</h1>
    <div class="spy-name-badge" id="name-badge">Revolutionary War Spy Mission</div>
  </header>
  <div class="progress-bar">
    <div class="pip-row" id="pip-row"></div>
  </div>
  <div class="pip-labels" id="pip-labels"></div>
  <div class="stage-host" id="stage-host"></div>
</div>

<script>
// ── STATE ───────────────────────────────────────────────────────────────────
const state = {
  studentName:    '',
  team:           '',
  message:        '',
  shift:          7,
  codedMessage:   '',
  decodedCorrect: false,
  route:          [],
  routeValid:     false,
  materials:      [],
  testDone:       false,
  testProtected:  false,
  materialReason: '',
  response1:      '',
  response2:      '',
  response3:      '',
  currentStage:   0,
  _rafId:         null
};

const STAGE_LABELS = ['Briefing','Cipher','Route Map','Lab Test','Report','Portfolio'];

// ── UTILITIES ────────────────────────────────────────────────────────────────
function wordCount(s) {
  return s.trim().split(/\s+/).filter(w => w.length > 0).length;
}

function caesarEncode(msg, shift) {
  return msg.toUpperCase().split('').map(ch => {
    if (ch >= 'A' && ch <= 'Z') return String.fromCharCode(((ch.charCodeAt(0) - 65 + shift) % 26) + 65);
    return ch;
  }).join('');
}

function caesarDecode(coded, shift) {
  return caesarEncode(coded, 26 - (shift % 26));
}

function getCanvasXY(canvas, e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const src = e.touches ? e.touches[0] : e;
  return { x: (src.clientX - rect.left) * scaleX, y: (src.clientY - rect.top) * scaleY };
}

function stopAllAnimations() {
  if (state._rafId) { cancelAnimationFrame(state._rafId); state._rafId = null; }
}

// ── PROGRESS BAR ─────────────────────────────────────────────────────────────
function buildProgressBar() {
  const row = document.getElementById('pip-row');
  const labels = document.getElementById('pip-labels');
  row.innerHTML = '';
  labels.innerHTML = '';
  STAGE_LABELS.forEach((lbl, i) => {
    const pip = document.createElement('div');
    pip.className = 'pip';
    pip.id = `pip-${i}`;
    pip.textContent = i + 1;
    row.appendChild(pip);
    if (i < STAGE_LABELS.length - 1) {
      const conn = document.createElement('div');
      conn.className = 'pip-connector';
      conn.id = `conn-${i}`;
      row.appendChild(conn);
    }
    const lbl_el = document.createElement('div');
    lbl_el.className = 'pip-label';
    lbl_el.textContent = lbl;
    labels.appendChild(lbl_el);
  });
  updateProgressBar();
}

function updateProgressBar() {
  STAGE_LABELS.forEach((_, i) => {
    const pip = document.getElementById(`pip-${i}`);
    if (!pip) return;
    pip.className = 'pip' + (i < state.currentStage ? ' done' : i === state.currentStage ? ' active' : '');
    if (i < STAGE_LABELS.length - 1) {
      const conn = document.getElementById(`conn-${i}`);
      if (conn) conn.className = 'pip-connector' + (i < state.currentStage ? ' done' : '');
    }
  });
}

// ── STAGE ROUTER ─────────────────────────────────────────────────────────────
function renderStage(n) {
  const host = document.getElementById('stage-host');
  host.innerHTML = '';
  [renderStage0, renderStage1, renderStage2, renderStage3, renderStage4, renderStage5][n]();
}

function advanceStage() {
  const host = document.getElementById('stage-host');
  host.style.opacity = '0';
  setTimeout(() => {
    stopAllAnimations();
    state.currentStage++;
    renderStage(state.currentStage);
    updateProgressBar();
    host.style.opacity = '1';
    // update name badge
    if (state.studentName) {
      const badge = document.getElementById('name-badge');
      if (badge) badge.innerHTML = `Agent: <span>${state.studentName}</span>`;
    }
  }, 300);
}

// ── STAGE 0: MISSION BRIEFING ─────────────────────────────────────────────────
function renderStage0() {
  const host = document.getElementById('stage-host');
  host.innerHTML = `
    <div class="mission-card">
      <span class="mission-seal">&#x1F50E;</span>
      <h2>&#x2014; Top Secret &#x2014;</h2>
      <div class="typewriter-text" id="tw-text"><span class="cursor-blink"></span></div>
    </div>
    <label class="field-label" for="name-input">Your Agent Name</label>
    <input type="text" id="name-input" placeholder="Enter your name..." maxlength="30" value="${state.studentName}" autocomplete="off">
    <div class="team-cards">
      <div class="team-card ${state.team==='patriot'?'selected-patriot':''}" id="card-patriot" onclick="selectTeam('patriot')">
        <span class="team-icon">&#x1F1FA;&#x1F1F8;</span>
        <h3>Join the Patriots</h3>

function drawCipherWheel(canvas, shift) {
  const ctx = canvas.getContext('2d');
  const cx = 170, cy = 170;
  const R_outer = 145, R_inner = 98, R_center = 42;
  const N = 26;
  const arc = (Math.PI * 2) / N;

  ctx.clearRect(0, 0, 340, 340);

  // outer ring segments
  for (let i = 0; i < N; i++) {
    const startA = i * arc - Math.PI / 2 - arc / 2;
    const endA = startA + arc;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R_outer, startA, endA);
    ctx.closePath();
    ctx.fillStyle = i % 2 === 0 ? '#8b1a1a' : '#6b1414';
    ctx.fill();
    ctx.strokeStyle = '#2c1810';
    ctx.lineWidth = 0.5;
    ctx.stroke();

    // outer letter
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(i * arc);
    ctx.fillStyle = '#f0d080';
    ctx.font = 'bold 12px "Space Grotesk", Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String.fromCharCode(65 + i), 0, -(R_outer + R_inner) / 2);
    ctx.restore();
  }

  // inner ring segments
  for (let i = 0; i < N; i++) {
    const shiftedIdx = (i + shift) % N;
    const startA = i * arc - Math.PI / 2 - arc / 2;
    const endA = startA + arc;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R_inner, startA, endA);
    ctx.closePath();
    ctx.fillStyle = i % 2 === 0 ? '#2563eb' : '#1d4ed8';
    ctx.fill();
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 0.5;
    ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(i * arc);
    ctx.fillStyle = '#e0f2fe';
    ctx.font = 'bold 11px "Space Grotesk", Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String.fromCharCode(65 + shiftedIdx), 0, -(R_inner + R_center) / 2);
    ctx.restore();
  }

  // center circle
  ctx.beginPath();
  ctx.arc(cx, cy, R_center, 0, Math.PI * 2);
  ctx.fillStyle = '#f5e6c8';
  ctx.fill();
  ctx.strokeStyle = '#c4932f';
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.font = 'bold 22px "Space Grotesk", Arial';
  ctx.fillStyle = '#8b1a1a';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(`+${shift}`, cx, cy);

  // pointer triangle at top
  ctx.beginPath();
  ctx.moveTo(cx, cy - R_outer - 6);
  ctx.lineTo(cx - 7, cy - R_outer + 8);
  ctx.lineTo(cx + 7, cy - R_outer + 8);
  ctx.closePath();
  ctx.fillStyle = '#c4932f';
  ctx.fill();
}

// ── STAGE 2: MAP / ROUTE ──────────────────────────────────────────────────────
const LANDMARKS = [
  { col: 4, row: 4, name: 'Philadelphia', short: 'E5' },
  { col: 7, row: 7, name: 'Lexington',    short: 'H8' },
  { col: 2, row: 1, name: 'Yorktown',     short: 'C2' },
  { col: 6, row: 5, name: 'New York',     short: 'G6' },
  { col: 7, row: 8, name: 'Boston',       short: 'H9' },
];

const PATROL_ZONES = [
  { c1: 5, r1: 3, c2: 7, r2: 6 },
];

function renderStage2() {
  const host = document.getElementById('stage-host');
  host.innerHTML = `
    <div class="stage-title">
      <span class="standard-badge badge-math">Math 5.G.A.2</span>
      Plan Your Spy Route
    </div>
    <p class="stage-subtitle">Click the map to place <strong>5 waypoints</strong>. Your route must start at <strong>Philadelphia (E5)</strong> and end at <strong>Yorktown (C2)</strong>. Avoid the red British patrol zones!</p>
    <div class="map-wrap">
      <canvas id="map-canvas" width="600" height="420"></canvas>
    </div>
    <div class="coord-list-wrap">
      <h4>Your Route Coordinates:</h4>
      <ol id="coord-list"></ol>
    </div>
    <div id="route-warning" class="route-warning"></div>
    <div class="map-toolbar no-print">
      <button class="ctrl-btn" onclick="clearRoute()">Clear Route</button>
      <span style="font-size:12px;color:var(--ink-muted)">Click or tap grid cells to place waypoints</span>
    </div>

    </div>
  `;

  const canvas = document.getElementById('map-canvas');
  drawMapGrid(canvas);

  canvas.addEventListener('mousedown', handleMapClick);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); handleMapClick(e); }, { passive: false });
}

function mapCellSize(canvas) {
  const padL = 52, padT = 38;
  const cw = (canvas.width - padL - 8) / 10;
  const ch = (canvas.height - padT - 8) / 10;
  return { cw, ch, padL, padT };
}

function colToX(canvas, col) {
  const { cw, padL } = mapCellSize(canvas);
  return padL + col * cw + cw / 2;
}
function rowToY(canvas, row) {
  const { ch, padT } = mapCellSize(canvas);
  return padT + row * ch + ch / 2;
}

function handleMapClick(e) {
  const canvas = document.getElementById('map-canvas');
  if (!canvas) return;
  const { x, y } = getCanvasXY(canvas, e);
  const { cw, ch, padL, padT } = mapCellSize(canvas);

  const col = Math.floor((x - padL) / cw);
  const row = Math.floor((y - padT) / ch);
  if (col < 0 || col > 9 || row < 0 || row > 9) return;

  // check patrol zone
  for (const z of PATROL_ZONES) {
    if (col >= z.c1 && col <= z.c2 && row >= z.r1 && row <= z.r2) {
      const w = document.getElementById('route-warning');
      if (w) { w.innerHTML = '<span class="feedback-err">&#x26A0; British patrol here! Choose a different path.</span>'; }
      return;
    }
  }

  // check duplicate
  const already = state.route.find(p => p.col === col && p.row === row);
  if (already) {
    // remove it
    state.route = state.route.filter(p => !(p.col === col && p.row === row));
    updateMapUI(canvas);
    return;
  }

  if (state.route.length >= 5) {
    const w = document.getElementById('route-warning');
    if (w) w.innerHTML = '<span class="feedback-err">Remove a point first (click on it).</span>';
    return;
  }

  const label = String.fromCharCode(65 + col) + (row + 1);
  state.route.push({ col, row, label });
  updateMapUI(canvas);
}

function updateMapUI(canvas) {
  drawMapGrid(canvas);

  // coord list
  const list = document.getElementById('coord-list');
  if (list) {
    list.innerHTML = state.route.map(p => `<li>${p.label}</li>`).join('');
  }

  // validation
  const hasPhilly = state.route.some(p => p.col === 4 && p.row === 4);
  const hasYork   = state.route.some(p => p.col === 2 && p.row === 1);
  const w = document.getElementById('route-warning');
  state.routeValid = state.route.length === 5 && hasPhilly && hasYork;

  if (state.route.length === 5 && !state.routeValid) {
    if (w) w.innerHTML = '<span class="feedback-err">&#x26A0; Your route must include Philadelphia (E5) and Yorktown (C2).</span>';
  } else if (state.routeValid) {
    if (w) w.innerHTML = '<span class="feedback-ok">&#x2713; Great route! Philadelphia to Yorktown — mission ready.</span>';
  } else {
    if (w) w.innerHTML = '';
  }

  const btn = document.getElementById('s2-continue');
  if (btn) btn.disabled = !state.routeValid;
}

function clearRoute() {
  state.route = [];
  state.routeValid = false;
  const canvas = document.getElementById('map-canvas');
  if (canvas) updateMapUI(canvas);
  const btn = document.getElementById('s2-continue');
  if (btn) btn.disabled = true;
}

function drawMapGrid(canvas) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const { cw, ch, padL, padT } = mapCellSize(canvas);

  // background
  ctx.fillStyle = '#d4c5a0';
  ctx.fillRect(0, 0, W, H);

  // parchment texture dots
  ctx.fillStyle = 'rgba(100,70,30,0.04)';
  for (let tx = 0; tx < W; tx += 6) for (let ty = 0; ty < H; ty += 6) {
    if (Math.sin(tx * 0.7) * Math.cos(ty * 0.9) > 0.6) ctx.fillRect(tx, ty, 2, 2);
  }

  // patrol zones
  for (const z of PATROL_ZONES) {
    const x1 = padL + z.c1 * cw, y1 = padT + z.r1 * ch;
    const x2 = padL + (z.c2 + 1) * cw, y2 = padT + (z.r2 + 1) * ch;
    ctx.fillStyle = 'rgba(220,38,38,0.18)';
    ctx.fillRect(x1, y1, x2 - x1, y2 - y1);
    ctx.strokeStyle = 'rgba(220,38,38,0.6)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(220,38,38,0.7)';
    ctx.font = 'bold 10px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('BRITISH PATROL', (x1 + x2) / 2, y1 + 14);
  }

  // grid lines
  ctx.strokeStyle = 'rgba(80,50,20,0.25)';
  ctx.lineWidth = 1;
  for (let c = 0; c <= 10; c++) {
    const x = padL + c * cw;
    ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + 10 * ch); ctx.stroke();
  }
  for (let r = 0; r <= 10; r++) {
    const y = padT + r * ch;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + 10 * cw, y); ctx.stroke();
  }

  // column headers (A-J)
  ctx.font = 'bold 12px "Space Grotesk", Arial';
  ctx.fillStyle = '#4a3020';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let c = 0; c < 10; c++) {
    ctx.fillText(String.fromCharCode(65 + c), padL + c * cw + cw / 2, padT - 16);
  }
  // row headers (1-10)
  ctx.textAlign = 'right';
  for (let r = 0; r < 10; r++) {
    ctx.fillText(r + 1, padL - 6, padT + r * ch + ch / 2);
  }

  // landmarks
  for (const lm of LANDMARKS) {
    const lx = colToX(canvas, lm.col), ly = rowToY(canvas, lm.row);
    ctx.beginPath();
    ctx.arc(lx, ly, 9, 0, Math.PI * 2);
    ctx.fillStyle = '#c4932f';
    ctx.fill();
    ctx.strokeStyle = '#2c1810';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.font = 'bold 9px Arial';
    ctx.fillStyle = '#2c1810';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(lm.name, lx, ly + 11);
  }

  // route lines
  if (state.route.length > 1) {
    ctx.beginPath();
    ctx.strokeStyle = '#2563eb';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([]);
    ctx.moveTo(colToX(canvas, state.route[0].col), rowToY(canvas, state.route[0].row));
    for (let i = 1; i < state.route.length; i++) {
      ctx.lineTo(colToX(canvas, state.route[i].col), rowToY(canvas, state.route[i].row));
    }
    ctx.stroke();
  }

  // route waypoints
  state.route.forEach((pt, idx) => {
    const px = colToX(canvas, pt.col), py = rowToY(canvas, pt.row);
    ctx.beginPath();
    ctx.arc(px, py, 10, 0, Math.PI * 2);
    ctx.fillStyle = '#2563eb';
    ctx.fill();
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.font = 'bold 11px "Space Grotesk", Arial';
    ctx.fillStyle = 'white';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(idx + 1, px, py);
  });
}

function toggleMaterial(id) {
  if (state.testDone) return;
  if (state.materials.includes(id)) {
    state.materials = state.materials.filter(m => m !== id);
  } else {
    if (state.materials.length >= 2) {
      state.materials.shift();

    state.materials.push(id);
  }
  MATERIALS.forEach(m => {
    const el = document.getElementById(`mat-${m.id}`);
    if (el) el.className = 'mat-card' + (state.materials.includes(m.id) ? ' selected' : '');
  });
  const btn = document.getElementById('rain-btn');
  if (btn) btn.disabled = state.materials.length < 2;
  drawRainScene(false, false);
}

function drawRainScene(raining, damaged) {
  const canvas = document.getElementById('rain-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = 560, H = 280;

  // sky
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, raining ? '#374151' : '#93c5fd');
  skyGrad.addColorStop(1, raining ? '#6b7280' : '#bfdbfe');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  // clouds
  function cloud(cx, cy, scale) {
    ctx.fillStyle = raining ? '#9ca3af' : 'rgba(255,255,255,0.9)';
    [[0,0,28],[20,-8,22],[40,2,24],[-18,4,20]].forEach(([dx,dy,r]) => {
      ctx.beginPath(); ctx.arc(cx+dx*scale, cy+dy*scale, r*scale, 0, Math.PI*2); ctx.fill();
    });
  }
  cloud(100, 55, 1); cloud(280, 40, 1.2); cloud(450, 65, 0.9);

  // ground
  ctx.fillStyle = '#6b7c5a';
  ctx.fillRect(0, H * 0.72, W, H);

  // scroll body
  const sx = W * 0.18, sy = H * 0.28, sw = W * 0.45, sh = H * 0.44;
  ctx.fillStyle = damaged ? '#d4a57a' : '#f5e6c8';
  rrect(ctx, sx, sy, sw, sh, 6);
  ctx.fill();
  ctx.strokeStyle = '#c4932f';
  ctx.lineWidth = 2;
  ctx.stroke();

  // scroll roll ends
  for (const ry of [sy, sy + sh]) {
    ctx.beginPath();
    ctx.ellipse(sx + sw/2, ry, sw/2, 10, 0, 0, Math.PI*2);
    ctx.fillStyle = damaged ? '#c4952a' : '#e8d5a8';
    ctx.fill();
    ctx.strokeStyle = '#c4932f';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // text lines on scroll
  ctx.fillStyle = damaged ? 'rgba(100,60,20,0.3)' : 'rgba(44,24,16,0.6)';
  for (let line = 0; line < 4; line++) {
    ctx.fillRect(sx + 18, sy + 20 + line * 18, sw - 36, 4);
  }

  // damage water stain
  if (damaged) {
    ctx.fillStyle = 'rgba(60,100,180,0.18)';
    ctx.beginPath();
    ctx.ellipse(sx + sw/2, sy + sh/2, sw*0.4, sh*0.38, 0.2, 0, Math.PI*2);
    ctx.fill();
  }

  // chosen material wrap
  if (state.materials.length > 0) {
    const mat = MATERIALS.find(m => m.id === state.materials[state.materials.length - 1]);
    if (mat) {
      const mx = sx + sw + 20, my = sy, mw = W * 0.22, mh = sh;
      ctx.fillStyle = mat.color;
      ctx.strokeStyle = mat.border;
      ctx.lineWidth = 2.5;
      rrect(ctx, mx, my, mw, mh, 8);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.font = 'bold 11px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(mat.label, mx + mw/2, my + mh/2);
    }
  }

  if (!raining && !damaged) {
    ctx.fillStyle = 'rgba(44,24,16,0.5)';
    ctx.font = '12px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText('Select 2 materials above, then click "Test in Rain"', W/2, H - 6);
  }
}

let rainDrops = [];
function startRainTest() {
  if (state.materials.length < 2) return;
  stopAllAnimations();
  state.testDone = false;

  const btn = document.getElementById('rain-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Testing...'; }

  rainDrops = Array.from({length: 70}, () => ({
    x: Math.random() * 560,
    y: Math.random() * -200,
    speed: 3.5 + Math.random() * 3,
    len: 9 + Math.random() * 9
  }));

  let t = 0;
  function frame() {
    const canvas = document.getElementById('rain-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    t++;

    drawRainScene(true, false);

    rainDrops.forEach(d => {
      d.y += d.speed; d.x += 0.6;
      if (d.y > 290) { d.y = -20; d.x = Math.random() * 560; }
    });

    ctx.strokeStyle = 'rgba(100,160,255,0.65)';
    ctx.lineWidth = 1.5;
    rainDrops.forEach(d => {
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x + 3, d.y + d.len);
      ctx.stroke();
    });

    if (t < 200) {
      state._rafId = requestAnimationFrame(frame);
    } else {
      finishRainTest();
    }
  }
  state._rafId = requestAnimationFrame(frame);
}

function finishRainTest() {
  state.testDone = true;
  const hasProtection = state.materials.some(id => MATERIALS.find(m => m.id === id && m.waterproof));
  state.testProtected = hasProtection;

  drawRainScene(false, !hasProtection);

  // update material cards with results
  MATERIALS.forEach(m => {
    const el = document.getElementById(`mat-${m.id}`);
    if (el) {
      const oldResult = el.querySelector('.mat-result');
      if (oldResult) oldResult.remove();
      const r = document.createElement('div');
      r.className = `mat-result ${m.waterproof?'ok':'bad'}`;
      r.innerHTML = m.waterproof ? '&#x2713; Waterproof' : '&#x2717; Not Waterproof';
      el.appendChild(r);
    }
  });

  showRainBanner();

  const rw = document.getElementById('reason-wrap');
  if (rw) rw.style.display = '';

  const ri = document.getElementById('reason-input');
  if (ri) {
    ri.addEventListener('input', e => {
      state.materialReason = e.target.value;
      const wc = wordCount(state.materialReason);
      const counter = document.getElementById('reason-counter');
      if (counter) {
        counter.textContent = `${wc} / 5 words minimum`;
        counter.className = 'word-counter' + (wc >= 5 ? ' met' : '');
      }
      checkS3();
    });
  }
  checkS3();
}

function showRainBanner() {
  const banner = document.getElementById('rain-banner');
  if (!banner) return;
  banner.style.display = '';
  if (state.testProtected) {
    banner.className = 'rain-result-banner ok';
    banner.innerHTML = '&#x2713; Message Protected! Your material kept the message dry.';
  } else {
    banner.className = 'rain-result-banner bad';
    banner.innerHTML = '&#x2717; Message Damaged! Neither material was waterproof enough.';
  }
}

function checkS3() {
  const ok = state.testDone && wordCount(state.materialReason) >= 5;
  const btn = document.getElementById('s3-continue');
  if (btn) btn.disabled = !ok;
}

// ── STAGE 4: WRITING ──────────────────────────────────────────────────────────
const PROMPTS = [
  { id: 'r1', badge: 'badge-ela', badgeLabel: 'W.5.1 Argument', key: 'response1',
    text: 'What information was most important for spies to deliver during the Revolution — and why was that information so valuable?' },
  { id: 'r2', badge: 'badge-ela', badgeLabel: 'W.5.3 Narrative', key: 'response2',
    text: 'Describe one moment on your spy route. What did you see? What dangers did you face? What did you do?' },
  { id: 'r3', badge: 'badge-hist', badgeLabel: 'History', key: 'response3',
    text: 'How did secret communication affect the outcome of the American Revolution? Use at least one cause and one effect in your answer.' },
];

function renderStage4() {
  const host = document.getElementById('stage-host');
  const blocks = PROMPTS.map(p => {
    const val = state[p.key] || '';
    const wc = wordCount(val);
    return `
    <div class="prompt-block">
      <p><span class="standard-badge ${p.badge}">${p.badgeLabel}</span><br><br>${p.text}</p>
      <textarea id="${p.id}" rows="4" placeholder="Write your answer here...">${val}</textarea>
      <span class="word-counter ${wc>=15?'met':''}" id="${p.id}-counter">${wc} / 15 words minimum</span>
    </div>`;
  }).join('');

  host.innerHTML = `
    <div class="stage-title">
      <span class="standard-badge badge-hist">History + ELA</span>
      Intelligence Report
    </div>
    <p class="stage-subtitle">Answer all three questions. Write at least 15 words each. This is your official spy report!</p>
    ${blocks}
    <div style="text-align:center">
      <button class="continue-btn" id="s4-continue" disabled onclick="advanceStage()">Submit Report &rarr;</button>
    </div>
  `;

  PROMPTS.forEach(p => {
    const el = document.getElementById(p.id);
    if (!el) return;
    el.addEventListener('input', e => {
      state[p.key] = e.target.value;
      const wc = wordCount(state[p.key]);
      const counter = document.getElementById(`${p.id}-counter`);
      if (counter) {
        counter.textContent = `${wc} / 15 words minimum`;
        counter.className = 'word-counter' + (wc >= 15 ? ' met' : '');
      }
      checkS4();
    });
  });

  checkS4();
}

function checkS4() {
  const ok = PROMPTS.every(p => wordCount(state[p.key] || '') >= 15);
  const btn = document.getElementById('s4-continue');
  if (btn) btn.disabled = !ok;
}

// ── STAGE 5: PORTFOLIO ─────────────────────────────────────────────────────────
function renderStage5() {
  const host = document.getElementById('stage-host');
  const teamClass = state.team === 'patriot' ? 'team-patriot' : 'team-loyalist';
  const teamLabel = state.team === 'patriot' ? 'Patriot' : 'Loyalist';

  const chosenMats = state.materials.map(id => MATERIALS.find(m => m.id === id)?.label).join(' + ');
  const matResult  = state.testProtected ? 'Message Protected ✓' : 'Message Damaged — choose waterproof material next time';

  const routeHtml = state.route.map((p, i) => `<li>${i+1}. ${p.label}</li>`).join('');

  host.innerHTML = `
    <canvas id="confetti-canvas" width="840" height="180"></canvas>
    <div class="complete-banner" style="margin-top:18px">
      <h2>&#x1F3C6; Mission Complete, ${state.studentName}!</h2>
      <p>Your Spy Portfolio is ready. Review it below, then click Print to save it.</p>
    </div>
    <div class="portfolio-card">
      <div class="portfolio-section">
        <h3>Agent Profile</h3>
        <p><strong>Name:</strong> ${state.studentName} <span class="team-badge-port ${teamClass}">${teamLabel}</span></p>
      </div>
      <div class="portfolio-section">
        <h3>&#x1F512; Cipher — Math 5.OA.B.3</h3>
        <div class="port-val"><strong>Original Message</strong>${state.message || '—'}</div>
        <div class="port-val"><strong>Shift Used</strong>${state.shift}</div>
        <div class="port-val"><strong>Your Coded Message</strong>${caesarEncode(state.message, state.shift) || '—'}</div>
        <div class="port-val"><strong>Decoded Intercept (shift 8)</strong>CROSS DELAWARE AT MIDNIGHT</div>
      </div>
      <div class="portfolio-section">
        <h3>&#x1F5FA; Route Map — Math 5.G.A.2</h3>
        <ol style="padding-left:20px;font-size:14px;color:var(--ink);line-height:2">${routeHtml || '<li>No route recorded</li>'}</ol>
      </div>
      <div class="portfolio-section">
        <h3>&#x1F9EA; Waterproof Lab — NGSS 5-PS1-3</h3>
        <div class="port-val"><strong>Materials Tested</strong>${chosenMats || '—'}</div>
        <div class="port-val"><strong>Result</strong>${matResult}</div>
        <div class="port-val"><strong>Your Explanation</strong>${state.materialReason || '—'}</div>
      </div>
      <div class="portfolio-section">
        <h3>&#x270D; Intelligence Report — History + ELA</h3>
        <div class="port-val"><strong>Most Important Information (W.5.1)</strong>${state.response1 || '—'}</div>
        <div class="port-val"><strong>My Spy Moment (W.5.3)</strong>${state.response2 || '—'}</div>
        <div class="port-val"><strong>Communication &amp; the Revolution (History)</strong>${state.response3 || '—'}</div>
      </div>
    </div>
    <div style="text-align:center;margin-top:20px" class="no-print">
      <button class="ctrl-btn" onclick="window.print()" style="padding:12px 28px;font-size:14px">&#x1F5A8; Print Portfolio</button>
    </div>
  `;

  startConfetti();
}

function startConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const COLORS = ['#8b1a1a','#c4932f','#2563eb','#16a34a','#f59e0b','#7c3aed'];
  const particles = Array.from({length: 80}, () => ({
    x: Math.random() * 840,
    y: Math.random() * 180 - 180,
    vx: (Math.random() - 0.5) * 2,
    vy: 2 + Math.random() * 3,
    size: 6 + Math.random() * 7,
    color: COLORS[Math.floor(Math.random() * COLORS.length)],
    rotation: Math.random() * Math.PI * 2,
    rotV: (Math.random() - 0.5) * 0.15,
  }));

  let t = 0;
  function frame() {
    t++;
    ctx.clearRect(0, 0, 840, 180);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.rotation += p.rotV;
      if (p.y > 190) { p.y = -12; p.x = Math.random() * 840; p.vy = 2 + Math.random() * 2; }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = 0.85;
      ctx.fillRect(-p.size/2, -p.size/4, p.size, p.size * 0.5);
      ctx.restore();
    });
    if (t < 280) state._rafId = requestAnimationFrame(frame);
    else ctx.clearRect(0, 0, 840, 180);
  }
  state._rafId = requestAnimationFrame(frame);
}

// ── CANVAS COMPAT ─────────────────────────────────────────────────────────────
function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
buildProgressBar();
renderStage(0);
