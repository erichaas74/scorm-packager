<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — Operation Liberty Quill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="spy-app">
  <header class="spy-header">
    <h1>&#x1F511; Operation Liberty Quill</h1>
    <div class="spy-name-badge" id="name-badge">Revolutionary War Spy Mission</div>
  </header>
  <div class="progress-bar">
    <div class="pip-row" id="pip-row"></div>
  </div>
  <div class="pip-labels" id="pip-labels"></div>
  <div class="stage-host" id="stage-host"></div>
</div>
<script src="shared.js"></script>
<script>
const STAGE = 9;
const st = loadState();

initPage(STAGE);

const MATERIALS_MAP = {
  wax:     'Wax Paper',
  leather: 'Leather',
  cloth:   'Cloth',
  tin:     'Tin Sheet',
  paper:   'Plain Paper',
};

const teamClass  = st.team === 'patriot' ? 'team-patriot' : 'team-loyalist';
const teamLabel  = st.team === 'patriot' ? 'Patriot' : 'Loyalist';
const chosenMats = (st.materials || []).map(id => MATERIALS_MAP[id] || id).join(' + ');
const matResult  = st.testProtected
  ? 'Message Protected &#x2713;'
  : 'Message Damaged — choose waterproof material next time';
const routeHtml  = (st.route || []).map((p, i) => `<li>${i + 1}. ${p.label}</li>`).join('') || '<li>No route recorded</li>';
const codedMsg   = caesarEncode(st.message || '', st.shift || 7);

document.getElementById('stage-host').innerHTML = `
  <canvas id="confetti-canvas" width="840" height="180"></canvas>
  <div class="complete-banner" style="margin-top:18px">
    <h2>&#x1F3C6; Mission Complete, ${st.studentName || 'Agent'}!</h2>
    <p>Your Spy Portfolio is ready. Review it below, then click Print to save it.</p>
  </div>
  <div class="portfolio-card">
    <div class="portfolio-section">
      <h3>Agent Profile</h3>
      <p><strong>Name:</strong> ${st.studentName || '—'} <span class="team-badge-port ${teamClass}">${teamLabel}</span></p>
    </div>
    <div class="portfolio-section">
      <h3>&#x1F512; Cipher — Math 5.OA.B.3</h3>
      <div class="port-val"><strong>Original Message</strong>${st.message || '—'}</div>
      <div class="port-val"><strong>Shift Used</strong>${st.shift || '—'}</div>
      <div class="port-val"><strong>Your Coded Message</strong>${codedMsg || '—'}</div>
      <div class="port-val"><strong>Decoded Intercept (shift 8)</strong>CROSS DELAWARE AT MIDNIGHT</div>
    </div>
    <div class="portfolio-section">
      <h3>&#x1F5FA; Route Map — Math 5.G.A.2</h3>
      <ol style="padding-left:20px;font-size:14px;color:var(--ink);line-height:2">${routeHtml}</ol>
    </div>
    <div class="portfolio-section">
      <h3>&#x1F9EA; Waterproof Lab — NGSS 5-PS1-3</h3>
      <div class="port-val"><strong>Materials Tested</strong>${chosenMats || '—'}</div>
      <div class="port-val"><strong>Result</strong>${matResult}</div>
      <div class="port-val"><strong>Your Explanation</strong>${st.materialReason || '—'}</div>
    </div>
    <div class="portfolio-section">
      <h3>&#x270D; Intelligence Report — History + ELA</h3>
      <div class="port-val"><strong>Most Important Information (W.5.1)</strong>${st.response1 || '—'}</div>
      <div class="port-val"><strong>My Spy Moment (W.5.3)</strong>${st.response2 || '—'}</div>
      <div class="port-val"><strong>Communication &amp; the Revolution (History)</strong>${st.response3 || '—'}</div>
    </div>
  </div>
  <div style="text-align:center;margin-top:20px" class="no-print">
    <button class="ctrl-btn" onclick="window.print()" style="padding:12px 28px;font-size:14px">&#x1F5A8; Print Portfolio</button>
  </div>
`;

startConfetti();

function startConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const COLORS = ['#8b1a1a','#c4932f','#2563eb','#16a34a','#f59e0b','#7c3aed'];
  const particles = Array.from({length: 80}, () => ({
    x: Math.random() * 840,
    y: Math.random() * 180 - 180,
    vx: (Math.random() - 0.5) * 2,
    vy: 2 + Math.random() * 3,
    size: 6 + Math.random() * 7,
    color: COLORS[Math.floor(Math.random() * COLORS.length)],
    rotation: Math.random() * Math.PI * 2,
    rotV: (Math.random() - 0.5) * 0.15,
  }));

  let t = 0;
  function frame() {
    t++;
    ctx.clearRect(0, 0, 840, 180);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.rotation += p.rotV;
      if (p.y > 190) { p.y = -12; p.x = Math.random() * 840; p.vy = 2 + Math.random() * 2; }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = 0.85;
      ctx.fillRect(-p.size/2, -p.size/4, p.size, p.size * 0.5);
      ctx.restore();
    });
    if (t < 280) _rafId = requestAnimationFrame(frame);
    else ctx.clearRect(0, 0, 840, 180);
  }
  _rafId = requestAnimationFrame(frame);
}
</script>
</body>
</html>
