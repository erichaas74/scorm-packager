<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Command — Operation Liberty Quill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.cmd-wrap {
  background: #0c1a0e;
  border: 1px solid #2a4a2e;
  border-radius: 18px;
  padding: 24px;
  margin-top: 16px;
  color: #c8e6cb;
}
.phase-bar { display:flex; gap:6px; margin-bottom:10px; }
.ph-pip { flex:1; height:5px; border-radius:3px; background:rgba(255,255,255,0.1); transition:background 0.4s; }
.ph-pip.done   { background:#4ade80; }
.ph-pip.active { background:#facc15; }
.phase-label {
  color:#facc15; font-size:0.7rem; font-weight:700;
  letter-spacing:0.1em; text-transform:uppercase; margin-bottom:16px;
}
.scenario-header {
  display:flex; justify-content:space-between; align-items:flex-start;
  flex-wrap:wrap; gap:8px; padding-bottom:14px;
  border-bottom:1px solid #2a4a2e; margin-bottom:18px;
}
.scenario-title {
  color:#d4a017; font-family:'Space Grotesk',sans-serif;
  font-size:1.25rem; font-weight:700; margin:0 0 4px;
}
.scenario-meta { color:#7aaa7e; font-size:0.78rem; }
.battle-dots { display:flex; gap:5px; margin-top:6px; }
.battle-dot { width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,0.12); transition:background 0.3s; }
.battle-dot.done   { background:#4ade80; }
.battle-dot.active { background:#facc15; }

.intel-box {
  background:rgba(255,255,255,0.04); border-left:3px solid #facc15;
  border-radius:0 8px 8px 0; padding:14px 16px;
  color:#c8e6cb; font-size:0.87rem; line-height:1.65; margin:10px 0;
}
.signal-tape {
  background:#050f06; border:1px solid #2a4a2e; border-radius:10px;
  padding:20px; font-family:'Space Grotesk',monospace; color:#4ade80;
  font-size:0.9rem; letter-spacing:0.18em; text-align:center;
  margin:14px 0; word-break:break-all; min-height:56px;
  display:flex; align-items:center; justify-content:center;
}
.signal-tape.coded { color:#1f4a22; }

.troops-table { width:100%; border-collapse:collapse; margin:10px 0; font-size:0.84rem; }
.troops-table th {
  color:#facc15; padding:8px 10px; border-bottom:1px solid #2a4a2e;
  font-size:0.7rem; letter-spacing:0.08em; text-transform:uppercase; text-align:left;
}
.troops-table td { color:#c8e6cb; padding:9px 10px; border-bottom:1px solid rgba(255,255,255,0.04); vertical-align:top; }

.stat-row { display:flex; gap:10px; flex-wrap:wrap; margin:12px 0; }
.stat-chip {
  background:rgba(255,255,255,0.05); border:1px solid #2a4a2e;
  border-radius:10px; padding:10px 14px; text-align:center; flex:1; min-width:90px;
}
.stat-val { color:#facc15; font-family:'Space Grotesk',sans-serif; font-size:1.2rem; font-weight:700; display:block; }
.stat-lbl { color:#7aaa7e; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.06em; }

.calc-card {
  background:rgba(255,255,255,0.03); border:1px solid #2a4a2e;
  border-radius:12px; padding:16px; margin-bottom:10px;
}
.calc-q  { color:#c8e6cb; font-size:0.88rem; margin:0 0 10px; line-height:1.5; }
.calc-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.calc-eq  { color:#7aaa7e; font-size:0.85rem; font-family:monospace; }
.calc-input {
  width:90px; background:#050f06; border:1px solid #4a7a4e; border-radius:6px;
  color:#facc15; font-family:monospace; font-size:1.05rem;
  padding:6px 10px; text-align:center; outline:none;
}
.calc-input:focus  { border-color:#facc15; }
.calc-input.correct{ border-color:#4ade80; background:rgba(74,222,128,0.08); color:#4ade80; }
.calc-input.wrong  { border-color:#f87171; background:rgba(248,113,113,0.08); }
.calc-hint { color:#557a58; font-size:0.77rem; margin-top:8px; }
.pill { display:inline-block; padding:3px 10px; border-radius:999px; font-size:0.74rem; font-weight:700; }
.pill.ok  { background:rgba(74,222,128,0.18);  color:#4ade80; }
.pill.bad { background:rgba(248,113,113,0.18); color:#f87171; }

.decision-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0; }
@media(max-width:540px) { .decision-grid { grid-template-columns:1fr; } }
.d-btn {
  background:rgba(255,255,255,0.04); border:1px solid #2a6a2e; border-radius:10px;
  color:#c8e6cb; padding:14px 16px; font-size:0.86rem; text-align:left;
  cursor:pointer; transition:border-color 0.2s,background 0.2s; line-height:1.4; width:100%;
}
.d-btn:hover:not(:disabled) { border-color:#facc15; background:rgba(250,204,21,0.06); }
.d-btn.correct { border-color:#4ade80; background:rgba(74,222,128,0.1); color:#4ade80; }
.d-btn.wrong   { border-color:#f87171; background:rgba(248,113,113,0.1); color:#f87171; }
.d-btn:disabled { cursor:default; }

.cmd-btn {
  background:#1a4a20; color:#e0f0e0; border:1px solid #3a8a3e; border-radius:10px;
  padding:10px 22px; font-size:0.9rem; font-weight:600; cursor:pointer;
  transition:background 0.2s,transform 0.15s;
}
.cmd-btn:hover:not(:disabled) { background:#206028; transform:translateY(-1px); }
.cmd-btn:disabled { opacity:0.35; cursor:not-allowed; transform:none; }

.outcome-box {
  background:rgba(74,222,128,0.07); border:1px solid rgba(74,222,128,0.3);
  border-radius:12px; padding:18px; margin:14px 0; line-height:1.65;
}
.score-display { text-align:center; padding:20px 0; }
.score-num { font-family:'Space Grotesk',sans-serif; font-size:3.5rem; font-weight:700; color:#facc15; line-height:1; }

.campaign-tally {
  border:1px solid #2a4a2e; border-radius:12px; overflow:hidden; margin:14px 0;
}
.campaign-tally-row {
  display:flex; justify-content:space-between; align-items:center;
  padding:10px 16px; border-bottom:1px solid rgba(255,255,255,0.05);
  font-size:0.85rem; color:#c8e6cb;
}
.campaign-tally-row:last-child { border-bottom:none; }
.campaign-tally-row.total {
  background:rgba(250,204,21,0.06); color:#facc15; font-weight:700; font-size:0.95rem;
}
.replay-btn {
  background:rgba(255,255,255,0.06); border:1px solid #2a6a2e;
  border-radius:8px; color:#7aaa7e; padding:5px 12px;
  font-size:0.75rem; cursor:pointer; transition:background 0.2s;
}
.replay-btn:hover { background:rgba(255,255,255,0.12); color:#c8e6cb; }
</style>
</head>
<body>
<div class="spy-app">
  <header class="spy-header">
    <h1>&#x1F511; Operation Liberty Quill</h1>
    <div class="spy-name-badge" id="name-badge">Revolutionary War Spy Mission</div>
  </header>
  <div class="progress-bar">
    <div class="pip-row" id="pip-row"></div>
  </div>
  <div class="pip-labels" id="pip-labels"></div>
  <div class="stage-host" id="stage-host"></div>
</div>
<script src="shared.js"></script>
<script src="graphics-lib.js"></script>
<script>
const STAGE = 9;
initPage(STAGE);

/* ── Scenario Data ──────────────────────────────────────
   Three real battles in chronological order.
   Add more by appending objects to SCENARIOS.
   Each scenario: 3 math calcs × 10 pts + 40 pts command = 70 pts max.
   Full campaign max: 210 pts.
────────────────────────────────────────────────────── */
const SCENARIOS = [

  /* ── Battle 1: Trenton ────────────────────────────── */
  {
    id: 'trenton_1776',
    name: 'Battle of Trenton',
    date: 'December 25–26, 1776',
    location: 'Trenton, New Jersey',
    signal: 'HESSIANS UNGUARDED CELEBRATING CROSS DELAWARE ATTACK AT DAWN',
    context: 'Your spy network has confirmed: 1,500 Hessian soldiers under Colonel Rall are garrisoned at Trenton. They have been celebrating Christmas and their patrols are light. Your 2,400 Continental troops are camped at McKonkey\'s Ferry, 9 miles away across the Delaware River. Patriot enlistments expire in five days — if this army dissolves, the revolution may be over.',
    troops: [
      { label: 'Continental Army (Yours)', soldiers: '2,400', commander: 'Gen. George Washington', condition: 'Determined, cold, low on supplies, must march through sleet' },
      { label: 'Hessian Garrison (Enemy)', soldiers: '1,500', commander: 'Col. Johann Rall',       condition: 'Well-armed mercenaries, celebrating Christmas, guards are light' },
    ],
    stats: [
      { val: '9 mi',     lbl: 'Distance to Trenton'       },
      { val: '3 mph',    lbl: 'Winter March Speed'         },
      { val: '5,500 lb', lbl: 'Rations Available'          },
      { val: '5 days',   lbl: 'Until Enlistments Expire'   },
    ],
    calcs: [
      {
        id: 'march_time',
        question: 'Your troops must march 9 miles through sleet to reach Trenton. At 3 miles per hour, how many hours will the march take?',
        equation: '9 ÷ 3 = ___',
        answer: 3, tolerance: 0, unit: 'hours',
        hint: 'Divide total distance by marching speed.',
      },
      {
        id: 'rations',
        question: 'You have 2,400 soldiers. Each needs 2 pounds of rations for the 2-day campaign. How many total pounds of rations are needed?',
        equation: '2,400 × 2 = ___',
        answer: 4800, tolerance: 0, unit: 'lbs needed',
        hint: 'Multiply number of soldiers by rations per soldier.',
      },
      {
        id: 'advantage',
        question: 'You have 2,400 troops. The enemy has 1,500. How many more soldiers do you have than the enemy?',
        equation: '2,400 − 1,500 = ___',
        answer: 900, tolerance: 0, unit: 'more soldiers',
        hint: 'Subtract enemy troop count from your troop count.',
      },
    ],
    suppliesNote: 'You need 4,800 lbs of rations. You have 5,500 lbs available — 700 lbs in reserve. ✓ Enough for the campaign.',
    decisions: [
      { id: 'cross_now',   label: '&#x26A1; Cross the Delaware tonight — attack at dawn', correct: true  },
      { id: 'wait',        label: '&#x23F3; Wait 3 days for reinforcements to arrive',    correct: false },
      { id: 'negotiate',   label: '&#x2709; Send a peace messenger to Colonel Rall',      correct: false },
      { id: 'retreat',     label: '&#x21A9; Retreat south and regroup for spring',        correct: false },
    ],
    decisionFeedback: {
      cross_now:   '&#x2713; Correct! This is exactly what Washington chose. The Christmas-night surprise attack captured nearly 900 Hessians in under 45 minutes.',
      wait:        '&#x2717; Waiting surrenders the element of surprise. The Hessians would be back at full readiness in 24 hours — and Patriot enlistments expire in 5 days.',
      negotiate:   '&#x2717; Colonel Rall had no reason to negotiate. Sending a messenger would alert him to Patriot troop movements near the river.',
      retreat:     '&#x2717; Retreat would likely end the Continental Army. With enlistments expiring in 5 days, the revolution would collapse without a victory.',
    },
    historicalOutcome: 'Washington\'s force crossed the icy Delaware River on Christmas night 1776 in brutal sleet. His troops surprised the Hessian garrison at dawn on December 26. The battle lasted less than 45 minutes. Washington captured nearly 900 soldiers without a single Patriot combat death. This victory reversed Patriot morale at the war\'s lowest point and kept the revolution alive.',
  },

  /* ── Battle 2: Saratoga ───────────────────────────── */
  {
    id: 'saratoga_1777',
    name: 'Battle of Saratoga',
    date: 'October 7, 1777',
    location: 'Bemis Heights, New York',
    signal: 'BURGOYNE SUPPLY LINE CUT TROOPS WEAKENED HOLD BEMIS HEIGHTS ATTACK',
    context: 'British General Burgoyne is marching 5,700 soldiers south from Canada toward Albany, New York. His supply wagons were raided at Bennington — his men are running low on food and ammunition. Your 9,000 American forces under General Gates hold Bemis Heights, a ridge of high ground overlooking the Hudson River valley that Burgoyne must pass through. If he is stopped here, France may enter the war on the Patriot side.',
    troops: [
      { label: 'Continental Army (Yours)', soldiers: '9,000', commander: 'Gen. Horatio Gates',  condition: 'Well-positioned on high ground, well-supplied, artillery in place' },
      { label: 'British Army (Enemy)',     soldiers: '5,700', commander: 'Gen. John Burgoyne',  condition: 'Marching south, supply wagons raided at Bennington, running short on food' },
    ],
    stats: [
      { val: '48 mi',    lbl: 'To Albany (Enemy Goal)' },
      { val: '12 mi/day',lbl: 'British March Speed'    },
      { val: '25 days',  lbl: 'Enemy Rations Remaining'},
      { val: 'High',     lbl: 'Your Ground Advantage'  },
    ],
    calcs: [
      {
        id: 'days_to_albany',
        question: 'Burgoyne\'s army marches 12 miles per day. Albany is 48 miles away. If you do nothing, how many days until he reaches Albany?',
        equation: '48 ÷ 12 = ___',
        answer: 4, tolerance: 0, unit: 'days',
        hint: 'Divide total distance by miles marched per day.',
      },
      {
        id: 'troop_advantage',
        question: 'You have 9,000 troops. Burgoyne has 5,700. How many more soldiers do you have than the enemy?',
        equation: '9,000 − 5,700 = ___',
        answer: 3300, tolerance: 0, unit: 'more soldiers',
        hint: 'Subtract Burgoyne\'s troops from your total force.',
      },
      {
        id: 'artillery_rounds',
        question: 'Your artillery can fire 6 cannon rounds per minute. In a 30-minute battle, how many total cannon rounds can your cannons fire?',
        equation: '6 × 30 = ___',
        answer: 180, tolerance: 0, unit: 'rounds',
        hint: 'Multiply rounds per minute by total battle minutes.',
      },
    ],
    suppliesNote: 'Your 9,000 troops have full rations. Burgoyne has only 25 days of food left — his supply line is cut and he cannot resupply from the north.',
    decisions: [
      { id: 'attack_now',   label: '&#x2694; Attack Burgoyne\'s weakened force now — force surrender',    correct: true  },
      { id: 'wait_starve',  label: '&#x23F3; Hold position and wait for his supplies to run out',          correct: false },
      { id: 'fall_back',    label: '&#x21A9; Fall back to Albany to protect the city',                    correct: false },
      { id: 'split_forces', label: '&#x2934; Split your force — half attack, half guard Albany',          correct: false },
    ],
    decisionFeedback: {
      attack_now:   '&#x2713; Correct! General Arnold\'s charge on October 7 shattered the British lines. Burgoyne surrendered 5,895 soldiers on October 17 — the largest British surrender of the war. France joined the American cause months later.',
      wait_starve:  '&#x2717; Waiting gives Burgoyne time to attempt a desperate breakthrough or receive a British relief force. His 25 days of rations could be enough to change the situation.',
      fall_back:    '&#x2717; Falling back gives up your high-ground advantage at Bemis Heights and signals weakness. Burgoyne would push through to Albany and the British strategy would succeed.',
      split_forces: '&#x2717; Splitting your already-superior force weakens both groups. Your 3,300-soldier advantage is most powerful as a concentrated attack.',
    },
    historicalOutcome: 'On October 7, 1777, General Arnold charged the British lines against orders and shattered Burgoyne\'s formation at Freeman\'s Farm. Burgoyne\'s army was surrounded by October 13. On October 17, 1777, he surrendered 5,895 British and Hessian soldiers — the largest British surrender of the entire war. The victory convinced France to formally enter the war as an American ally, sending troops, money, and a naval fleet.',
  },

  /* ── Battle 3: Yorktown ───────────────────────────── */
  {
    id: 'yorktown_1781',
    name: 'Siege of Yorktown',
    date: 'October 14, 1781',
    location: 'Yorktown, Virginia',
    signal: 'CORNWALLIS TRAPPED FRENCH FLEET BLOCKS SEA ESCAPE STORM REDOUBTS NINE AND TEN',
    context: 'British General Cornwallis and his 8,000 troops are dug into fortified positions at Yorktown, Virginia. French Admiral de Grasse\'s fleet of 28 warships defeated the British Navy at the Chesapeake Bay, cutting off all sea escape. Your combined American-French force of 17,000 soldiers under Generals Washington and Rochambeau has surrounded Yorktown by land. Cornwallis is running out of food. This could be the final decisive battle of the entire war.',
    troops: [
      { label: 'Allied Force (Yours)',  soldiers: '17,000', commander: 'Gen. Washington + Gen. Rochambeau', condition: 'Well-supplied, 52 siege cannons in place, surrounding town by land' },
      { label: 'British Army (Enemy)', soldiers:  '8,000', commander: 'Gen. Charles Cornwallis',           condition: 'Fortified in redoubts, food running out, sea escape blocked by French fleet' },
    ],
    stats: [
      { val: '17,000',  lbl: 'Your Allied Troops'       },
      { val: '52',      lbl: 'Siege Cannons Ready'       },
      { val: '6 days',  lbl: 'Enemy Rations Remaining'   },
      { val: '28',      lbl: 'French Warships Blocking'  },
    ],
    calcs: [
      {
        id: 'cannon_rounds',
        question: 'Your 52 siege cannons each fire 4 rounds per hour. How many total cannon rounds can your force fire in one hour?',
        equation: '52 × 4 = ___',
        answer: 208, tolerance: 0, unit: 'rounds/hour',
        hint: 'Multiply number of cannons by rounds each fires per hour.',
      },
      {
        id: 'troop_advantage',
        question: 'Your allied force has 17,000 troops. Cornwallis has 8,000. How many more soldiers do you have?',
        equation: '17,000 − 8,000 = ___',
        answer: 9000, tolerance: 0, unit: 'more soldiers',
        hint: 'Subtract British troops from your total allied force.',
      },
      {
        id: 'food_remaining',
        question: 'Cornwallis started the siege with 20 days of food. The siege has already lasted 14 days. How many days of food does he have left?',
        equation: '20 − 14 = ___',
        answer: 6, tolerance: 0, unit: 'days of food left',
        hint: 'Subtract days already elapsed from total days of food he started with.',
      },
    ],
    suppliesNote: 'Your 17,000 troops are fully supplied by land. Cornwallis has only 6 days of food with no resupply possible — the French fleet controls the sea completely.',
    decisions: [
      { id: 'storm_redoubts', label: '&#x2694; Storm Redoubts 9 and 10 tonight — break his outer defenses', correct: true  },
      { id: 'wait_surrender', label: '&#x23F3; Continue siege and wait — he will surrender on his own',     correct: false },
      { id: 'offer_peace',    label: '&#x2709; Send a peace offer to end the siege without more casualties', correct: false },
      { id: 'let_retreat',    label: '&#x21A9; Open a gap and let Cornwallis retreat north',                 correct: false },
    ],
    decisionFeedback: {
      storm_redoubts: '&#x2713; Correct! On October 14, Hamilton\'s Americans stormed Redoubt 10 and French forces stormed Redoubt 9 — both captured in under 30 minutes. Cornwallis surrendered on October 19, effectively ending the war.',
      wait_surrender: '&#x2717; Waiting risks a British relief fleet arriving. With 6 days of food left, Cornwallis might attempt a desperate river crossing at night — which he actually tried on October 16.',
      offer_peace:    '&#x2717; A peace offer gives Cornwallis terms he could refuse or delay. Your overwhelming advantage means you can force unconditional surrender by breaking his outer defenses.',
      let_retreat:    '&#x2717; Letting Cornwallis retreat allows him to regroup and continue fighting. You have the position, numbers, and naval support to force a complete surrender right now.',
    },
    historicalOutcome: 'On the night of October 14, 1781, American troops under Lt. Col. Alexander Hamilton stormed Redoubt 10 and French troops stormed Redoubt 9 — both captured in under 30 minutes. Cornwallis attempted a desperate river escape on October 16 but was turned back by a storm. On October 19, 1781, Cornwallis surrendered his entire 8,000-soldier army. It was the last major battle of the Revolutionary War. Britain signed the Treaty of Paris in 1783, officially recognizing American independence.',
  },
];

/* ── State ─────────────────────────────────────────────── */
const savedSt    = loadState();
let scenarioIdx  = 0;
let phase        = 0;      // 0=signal  1=situation  2=calc  3=command  4=outcome
let calcResults  = {};     // { calcId: true|false } — resets each scenario
let commandId    = null;   // chosen decision id — resets each scenario
let scenarioScores = [];   // score per completed battle
let reportTexts   = [];   // field report text per battle

const PHASE_NAMES = ['Signal Intel','Assess Situation','Run the Numbers','Issue Command','Write Report','Historical Outcome'];
const MAX_PER_SCENARIO = 90; // 3 calcs × 10 + 40 command + 20 report
const TOTAL_MAX        = SCENARIOS.length * MAX_PER_SCENARIO; // 270

function getS() { return SCENARIOS[scenarioIdx]; }
function totalScore() { return scenarioScores.reduce((a, b) => a + b, 0); }

/* ── Battlefield Maps ──────────────────────────────────────
   drawMapAfterRender() dispatches to the correct battle.
   showArrows=true when a command has been chosen (phase 3).
────────────────────────────────────────────────────────── */
function drawMapAfterRender() {
  const canvas = document.getElementById('battle-map');
  if (!canvas) return;
  const { ctx, W, H } = SPY.mount('battle-map', canvas.width, canvas.height);
  SPY.draw.battleMap(ctx, W, H, { battleId: getS().id, showArrows: phase === 3 && commandId !== null });
}


/* ── Animation wrappers (implementation in graphics-lib.js) ── */
function startBattleAnim() { SPY.anim.start('battle-anim', getS().id); }
function stopAnim()         { SPY.anim.stop(); }
function replayAnim()       { SPY.anim.replay('battle-anim', getS().id); }


/* ── Render ────────────────────────────────────────────── */
function render() {
  const s = getS();
  document.getElementById('stage-host').innerHTML = `
    <div class="cmd-wrap">
      <div class="phase-bar">
        ${PHASE_NAMES.map((_,i) => `<div class="ph-pip ${i < phase ? 'done' : i === phase ? 'active' : ''}"></div>`).join('')}
      </div>
      <div class="phase-label">Phase ${phase + 1} / ${PHASE_NAMES.length} &mdash; ${PHASE_NAMES[phase]}</div>
      <div class="scenario-header">
        <div>
          <div class="scenario-title">&#x2694;&#xFE0F; ${s.name}</div>
          <div class="scenario-meta">${s.date} &bull; ${s.location}</div>
          <div class="battle-dots">
            ${SCENARIOS.map((_, i) => `<div class="battle-dot ${i < scenarioIdx ? 'done' : i === scenarioIdx ? 'active' : ''}"></div>`).join('')}
          </div>
        </div>
        <div style="text-align:right">
          <div style="color:#facc15;font-size:0.82rem;font-weight:700">Battle ${scenarioIdx + 1} of ${SCENARIOS.length}</div>
          <div style="color:#7aaa7e;font-size:0.77rem;margin-top:2px">Campaign: <strong style="color:#c8e6cb">${totalScore()}</strong> pts</div>
        </div>
      </div>
      <div id="phase-body">${buildPhaseBody()}</div>
    </div>
  `;
  requestAnimationFrame(drawMapAfterRender);
  if (phase === 5) requestAnimationFrame(startBattleAnim);
}

function buildPhaseBody() {
  switch (phase) {
    case 0: return phaseSignal();
    case 1: return phaseSituation();
    case 2: return phaseCalc();
    case 3: return phaseCommand();
    case 4: return phaseReport();
    case 5: return phaseOutcome();
    default: return '';
  }
}

/* Phase 0 — Signal Intel */
function phaseSignal() {
  const s = getS();
  const coded = caesarEncode(s.signal, 7);
  return `
    <p style="color:#7aaa7e;font-size:0.87rem;margin:0 0 10px">An encrypted field signal has arrived from your spy network. Decrypt it to read the intelligence.</p>
    <div class="signal-tape coded" id="sig-tape">${coded}</div>
    <div style="text-align:center;margin:10px 0">
      <button class="cmd-btn" id="decrypt-btn" onclick="revealSignal()">&#x1F4E1; Decrypt Signal</button>
    </div>
    <div id="sig-reveal" style="display:none">
      <div class="signal-tape">${s.signal}</div>
      <div class="intel-box">&#x1F575;&#xFE0F; <strong>Intelligence confirmed.</strong> This message was carried at great personal risk. The window of surprise is narrow — act quickly.</div>
      <div style="text-align:right;margin-top:14px">
        <button class="cmd-btn" onclick="nextPhase()">Assess the Situation &#x2192;</button>
      </div>
    </div>
  `;
}

/* Phase 1 — Situation Assessment */
function phaseSituation() {
  const s = getS();
  const rows = s.troops.map(t => `
    <tr>
      <td>${t.label}</td>
      <td style="color:#facc15;font-weight:700">${t.soldiers}</td>
      <td>${t.commander}</td>
      <td>${t.condition}</td>
    </tr>
  `).join('');
  const chips = s.stats.map(chip => `
    <div class="stat-chip">
      <span class="stat-val">${chip.val}</span>
      <span class="stat-lbl">${chip.lbl}</span>
    </div>
  `).join('');
  return `
    <div class="intel-box">${s.context}</div>
    <p style="color:#facc15;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;margin:14px 0 8px">Troop Disposition</p>
    <table class="troops-table">
      <thead><tr><th>Force</th><th>Soldiers</th><th>Commander</th><th>Field Condition</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="stat-row">${chips}</div>
    <div class="intel-box" style="border-left-color:#4ade80;margin-top:12px">
      <strong style="color:#4ade80">&#x1F4E6; Supply Analysis:</strong> ${s.suppliesNote}
    </div>
    <div style="margin:14px 0;border-radius:10px;overflow:hidden;border:1px solid #2a4a2e">
      <div style="padding:6px 12px;background:rgba(250,204,21,0.06);font-size:0.7rem;color:#facc15;letter-spacing:0.08em;text-transform:uppercase">&#x1F5FA; Battlefield Map</div>
      <canvas id="battle-map" width="600" height="210" style="width:100%;display:block"></canvas>
    </div>
    <div style="text-align:right;margin-top:14px">
      <button class="cmd-btn" onclick="nextPhase()">Run the Numbers &#x2192;</button>
    </div>
  `;
}

/* Phase 2 — Calculations */
function phaseCalc() {
  const s = getS();
  const cards = s.calcs.map((c, i) => {
    const res = calcResults[c.id];
    const inputCls = 'calc-input' + (res === true ? ' correct' : res === false ? ' wrong' : '');
    return `
      <div class="calc-card">
        <p class="calc-q"><strong>Calculation ${i + 1}:</strong> ${c.question}</p>
        <div class="calc-row">
          <span class="calc-eq">${c.equation}</span>
          <input class="${inputCls}" id="inp-${c.id}" type="number" placeholder="?">
          <span style="color:#7aaa7e;font-size:0.82rem">${c.unit}</span>
          ${res === true  ? '<span class="pill ok">&#x2713; Correct</span>' : ''}
          ${res === false ? '<span class="pill bad">&#x2717; Try again</span>' : ''}
        </div>
        <div class="calc-hint">&#x1F4A1; ${c.hint}</div>
      </div>
    `;
  }).join('');
  const allOk = s.calcs.every(c => calcResults[c.id] === true);
  return `
    <p style="color:#7aaa7e;font-size:0.87rem;margin:0 0 14px">Use the battle data to complete your calculations. Accurate numbers guide your command decision.</p>
    ${cards}
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-top:8px">
      <button class="cmd-btn" onclick="checkAllCalcs()">&#x1F4CA; Check My Work</button>
      <button class="cmd-btn" id="calc-next" onclick="nextPhase()" ${allOk ? '' : 'disabled'}>Issue Command &#x2192;</button>
    </div>
  `;
}

/* Phase 3 — Command Decision */
function phaseCommand() {
  const s = getS();
  const calcSummary = s.calcs.map(c => {
    const ok = calcResults[c.id];
    return `<div style="color:${ok ? '#4ade80' : '#f87171'};font-size:0.82rem;margin:2px 0">${ok ? '&#x2713;' : '&#x2717;'} ${c.equation.replace('___', `<strong>${c.answer} ${c.unit}</strong>`)}</div>`;
  }).join('');
  const btns = s.decisions.map(d => {
    const chosen = commandId === d.id;
    let cls = 'd-btn';
    if (chosen) cls += d.correct ? ' correct' : ' wrong';
    return `<button class="${cls}" id="dcmd-${d.id}" onclick="chooseCommand('${d.id}')" ${commandId ? 'disabled' : ''}>${d.label}</button>`;
  }).join('');
  return `
    <div style="margin-bottom:14px;border-radius:10px;overflow:hidden;border:1px solid #2a4a2e">
      <div style="padding:6px 12px;background:rgba(250,204,21,0.06);font-size:0.7rem;color:#facc15;letter-spacing:0.08em;text-transform:uppercase">&#x1F5FA; Battlefield — Choose Your Command</div>
      <canvas id="battle-map" width="600" height="190" style="width:100%;display:block"></canvas>
    </div>
    <div class="intel-box" style="margin-bottom:14px">
      <strong style="color:#facc15">Your Calculations:</strong>
      ${calcSummary}
    </div>
    <p style="color:#c8e6cb;font-size:0.9rem;margin:0 0 10px">
      <strong>General Washington awaits your recommendation.</strong><br>
      <span style="color:#7aaa7e;font-size:0.85rem">Based on the intelligence and your numbers — what is your command?</span>
    </p>
    <div class="decision-grid">${btns}</div>
    <div id="decision-feedback" style="margin-top:10px"></div>
  `;
}

/* Phase 4 — Write Report to General */
function phaseReport() {
  const s = getS();
  const chosenDecision = s.decisions.find(d => d.id === commandId);
  const calcLines = s.calcs.map(c => {
    const ok = calcResults[c.id];
    return `<li style="color:${ok ? '#4ade80' : '#c8e6cb'};margin:3px 0;font-size:0.83rem">
      ${c.equation.replace('___', `<strong>${c.answer} ${c.unit}</strong>`)}
    </li>`;
  }).join('');
  const saved = reportTexts[scenarioIdx] || '';
  const wc    = wordCount(saved);
  return `
    <div class="intel-box" style="margin-bottom:14px">
      <strong style="color:#facc15">&#x1F4CA; Your Intelligence — Use These in Your Report:</strong>
      <ul style="margin:8px 0 4px;padding-left:18px">${calcLines}</ul>
      <div style="margin-top:6px;font-size:0.83rem;color:#c8e6cb">
        &#x2694; Your Command: <em>${chosenDecision ? chosenDecision.label : '—'}</em>
      </div>
    </div>
    <p style="color:#c8e6cb;font-size:0.9rem;margin:0 0 6px">
      <strong>Write your field report to General Washington.</strong>
    </p>
    <div style="color:#7aaa7e;font-size:0.83rem;margin-bottom:12px;line-height:1.7">
      Include all three of the following:<br>
      &bull; The enemy's position, size, and current condition<br>
      &bull; Your recommended command and why<br>
      &bull; At least one calculation that supports your reasoning
    </div>
    <div style="color:#facc15;font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px">
      &#x1F4DC; Field Report — ${s.name}
    </div>
    <textarea id="report-text" oninput="updateReportWC()"
      style="background:#050f06;border:1px solid #4a7a4e;color:#c8e6cb;border-radius:10px;
             padding:14px;width:100%;min-height:140px;font-size:0.88rem;line-height:1.65;
             resize:vertical;font-family:inherit;outline:none;box-sizing:border-box"
      placeholder="General Washington,&#10;I report that the enemy...">${saved}</textarea>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap;gap:8px">
      <span id="report-wc" style="color:${wc >= 20 ? '#4ade80' : '#7aaa7e'};font-size:0.8rem">
        ${wc} / 20 words minimum ${wc >= 20 ? '&#x2713;' : ''}
      </span>
      <button class="cmd-btn" id="report-submit" onclick="submitReport()" ${wc >= 20 ? '' : 'disabled'}>
        &#x1F4E4; Submit Report &#x2192;
      </button>
    </div>
  `;
}

/* Phase 5 — Historical Outcome */
function phaseOutcome() {
  const s = getS();
  const correctDecision = s.decisions.find(d => d.correct);
  const playerCorrect   = commandId === correctDecision.id;
  const calcPts   = Object.values(calcResults).filter(Boolean).length * 10;
  const cmdPts    = playerCorrect ? 40 : 0;
  const reportOk  = (reportTexts[scenarioIdx] || '').trim().length > 0 && wordCount(reportTexts[scenarioIdx]) >= 20;
  const reportPts = reportOk ? 20 : 0;
  const thisPts   = calcPts + cmdPts + reportPts;
  scenarioScores[scenarioIdx] = thisPts;

  const isLast = scenarioIdx === SCENARIOS.length - 1;
  const breakdown = s.calcs.map((c, i) => {
    const ok = calcResults[c.id];
    return `<span style="color:${ok ? '#4ade80' : '#f87171'};font-size:0.82rem">${ok ? '&#x2713;' : '&#x2717;'} Calc ${i + 1}: ${ok ? 10 : 0} pts</span>`;
  }).join(' &bull; ');

  const finalTally = isLast ? `
    <div class="campaign-tally" style="margin-top:20px">
      <div class="campaign-tally-row" style="background:rgba(250,204,21,0.04)">
        <span style="color:#facc15;font-weight:700;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.08em">Campaign Summary</span>
        <span style="color:#7aaa7e;font-size:0.72rem">${SCENARIOS.length} battles &bull; ${TOTAL_MAX} pts possible</span>
      </div>
      ${SCENARIOS.map((sc, i) => `
        <div class="campaign-tally-row">
          <span>${sc.name} <span style="color:#7aaa7e;font-size:0.75rem">(${sc.date.split(',')[1] || sc.date})</span></span>
          <span style="color:${(scenarioScores[i] ?? 0) >= 65 ? '#4ade80' : '#f59e0b'};font-weight:700">${scenarioScores[i] ?? '—'} / ${MAX_PER_SCENARIO}</span>
        </div>
      `).join('')}
      <div class="campaign-tally-row total">
        <span>&#x1F3C6; Total Campaign Score</span>
        <span>${totalScore()} / ${TOTAL_MAX}</span>
      </div>
    </div>
  ` : '';

  const nextBtn = isLast
    ? `<button class="cmd-btn" onclick="s9Continue()">Complete Mission &#x1F3C6;</button>`
    : `<button class="cmd-btn" onclick="nextScenario()">Next Battle: ${SCENARIOS[scenarioIdx + 1].name} &#x2192;</button>`;

  return `
    <div style="margin:0 0 14px;border-radius:10px;overflow:hidden;border:1px solid #2a4a2e">
      <div style="padding:6px 12px;background:rgba(250,204,21,0.06);display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:0.7rem;color:#facc15;letter-spacing:0.08em;text-transform:uppercase">&#x1F3A6; Battle Animation</span>
        <button class="replay-btn" id="replay-btn" onclick="replayAnim()" style="display:none">&#x25B6; Replay</button>
      </div>
      <canvas id="battle-anim" width="600" height="280" style="width:100%;display:block"></canvas>
    </div>
    <div class="outcome-box">
      <p style="color:#facc15;font-weight:700;margin:0 0 8px">&#x1F4DC; What Actually Happened</p>
      <p style="margin:0;color:#c8e6cb">${s.historicalOutcome}</p>
    </div>
    <div class="score-display">
      <div class="score-num">${thisPts}</div>
      <div style="color:#7aaa7e;font-size:0.85rem;margin-top:4px">of ${MAX_PER_SCENARIO} pts &mdash; ${s.name}</div>
      <div style="margin-top:12px;color:${playerCorrect ? '#4ade80' : '#f87171'};font-size:0.9rem">
        ${playerCorrect
          ? '&#x2B50; Your command matched the historical decision!'
          : `&#x1F4A1; The winning command was: <em>${correctDecision.label}</em>`}
      </div>
    </div>
    <div class="intel-box">
      <strong style="color:#facc15">Score Breakdown &mdash; ${s.name}</strong>
      <div style="margin-top:6px">${breakdown}</div>
      <div style="margin-top:4px;font-size:0.82rem;color:${playerCorrect ? '#4ade80' : '#f87171'}">
        ${playerCorrect ? '&#x2713;' : '&#x2717;'} Command Decision: ${cmdPts} pts
      </div>
      <div style="margin-top:4px;font-size:0.82rem;color:${reportOk ? '#4ade80' : '#f87171'}">
        ${reportOk ? '&#x2713;' : '&#x2717;'} Field Report: ${reportPts} pts
      </div>
    </div>
    ${finalTally}
    <div style="text-align:right;margin-top:20px">${nextBtn}</div>
  `;
}

/* ── Actions ───────────────────────────────────────────── */
function revealSignal() {
  document.getElementById('sig-tape').className   = 'signal-tape';
  document.getElementById('sig-tape').textContent = getS().signal;
  document.getElementById('decrypt-btn').style.display = 'none';
  document.getElementById('sig-reveal').style.display  = 'block';
}

function nextPhase() { stopAnim(); phase++; render(); }

function checkAllCalcs() {
  const s = getS();
  s.calcs.forEach(c => {
    const inp = document.getElementById('inp-' + c.id);
    if (!inp || inp.value === '') return;
    const val = parseFloat(inp.value);
    const tol = c.tolerance ?? 0;
    calcResults[c.id] = !isNaN(val) && Math.abs(val - c.answer) <= tol;
  });
  // Targeted DOM updates — preserve input values without full re-render
  s.calcs.forEach(c => {
    const inp = document.getElementById('inp-' + c.id);
    if (!inp) return;
    const res = calcResults[c.id];
    if (res === undefined) return;
    inp.className = 'calc-input ' + (res ? 'correct' : 'wrong');
    let pill = inp.parentElement.querySelector('.pill');
    if (!pill) { pill = document.createElement('span'); inp.parentElement.appendChild(pill); }
    pill.className   = 'pill ' + (res ? 'ok' : 'bad');
    pill.textContent = res ? '✓ Correct' : '✗ Try again';
  });
  const allOk = s.calcs.every(c => calcResults[c.id] === true);
  const nextBtn = document.getElementById('calc-next');
  if (nextBtn) nextBtn.disabled = !allOk;
}

function chooseCommand(id) {
  if (commandId) return;
  commandId = id;
  const s = getS();
  const isCorrect = s.decisions.find(d => d.id === id).correct;
  s.decisions.forEach(d => {
    const btn = document.getElementById('dcmd-' + d.id);
    if (!btn) return;
    btn.disabled = true;
    if (d.id === id) btn.classList.add(isCorrect ? 'correct' : 'wrong');
  });
  const fb = document.getElementById('decision-feedback');
  if (fb) fb.innerHTML = `<div class="intel-box" style="border-left-color:${isCorrect ? '#4ade80' : '#f87171'}">${s.decisionFeedback[id]}</div>`;
  const body = document.getElementById('phase-body');
  if (body && !document.getElementById('outcome-btn-wrap')) {
    const wrap = document.createElement('div');
    wrap.id = 'outcome-btn-wrap';
    wrap.style = 'text-align:right;margin-top:14px';
    wrap.innerHTML = '<button class="cmd-btn" onclick="nextPhase()">Write Your Report &#x2192;</button>';
    body.appendChild(wrap);
  }
  requestAnimationFrame(drawMapAfterRender); // redraw with movement arrows
}

function updateReportWC() {
  const ta  = document.getElementById('report-text');
  if (!ta) return;
  reportTexts[scenarioIdx] = ta.value;
  const wc   = wordCount(ta.value);
  const wcEl = document.getElementById('report-wc');
  const btn  = document.getElementById('report-submit');
  if (wcEl) {
    wcEl.style.color  = wc >= 20 ? '#4ade80' : '#7aaa7e';
    wcEl.innerHTML    = `${wc} / 20 words minimum ${wc >= 20 ? '&#x2713;' : ''}`;
  }
  if (btn) btn.disabled = wc < 20;
}

function submitReport() {
  const ta = document.getElementById('report-text');
  if (ta) reportTexts[scenarioIdx] = ta.value;
  nextPhase();
}

function nextScenario() {
  stopAnim();
  scenarioIdx++;
  phase       = 0;
  calcResults = {};
  commandId   = null;
  render();
}

function s9Continue() {
  stopAnim();
  saveState({
    battleScore:         totalScore(),
    battleScores:        scenarioScores,
    battleScenario:      SCENARIOS.map(s => s.name).join(', '),
    battleDecisionLabel: (getS().decisions.find(d => d.id === commandId) || {}).label || '—',
    battleCalcs:         calcResults,
    battleReports:       reportTexts,
  });
  goToNextPage(STAGE);
}

render();
</script>
</body>
</html>
