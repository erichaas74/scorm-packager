<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Route Map — Operation Liberty Quill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="spy-app">
  <header class="spy-header">
    <h1>&#x1F511; Operation Liberty Quill</h1>
    <div class="spy-name-badge" id="name-badge">Revolutionary War Spy Mission</div>
  </header>
  <div class="progress-bar">
    <div class="pip-row" id="pip-row"></div>
  </div>
  <div class="pip-labels" id="pip-labels"></div>
  <div class="stage-host" id="stage-host"></div>
</div>
<script src="shared.js"></script>
<script>
const STAGE = 2;
const st = loadState();
let route      = (st.route || []).map(p => Object.assign({}, p));
let routeValid = st.routeValid || false;

const LANDMARKS = [
  { col: 4, row: 4, name: 'Philadelphia', short: 'E5' },
  { col: 7, row: 7, name: 'Lexington',    short: 'H8' },
  { col: 2, row: 1, name: 'Yorktown',     short: 'C2' },
  { col: 6, row: 5, name: 'New York',     short: 'G6' },
  { col: 7, row: 8, name: 'Boston',       short: 'H9' },
];

const PATROL_ZONES = [
  { c1: 5, r1: 3, c2: 7, r2: 6 },
];

initPage(STAGE);

document.getElementById('stage-host').innerHTML = `
  <div class="stage-title">
    <span class="standard-badge badge-math">Math 5.G.A.2</span>
    Plan Your Spy Route
  </div>
  <p class="stage-subtitle">Click the map to place <strong>5 waypoints</strong>. Your route must start at <strong>Philadelphia (E5)</strong> and end at <strong>Yorktown (C2)</strong>. Avoid the red British patrol zones!</p>
  <div class="map-wrap">
    <canvas id="map-canvas" width="600" height="420"></canvas>
  </div>
  <div class="coord-list-wrap">
    <h4>Your Route Coordinates:</h4>
    <ol id="coord-list"></ol>
  </div>
  <div id="route-warning"></div>
  <div class="map-toolbar no-print">
    <button class="ctrl-btn" onclick="clearRoute()">Clear Route</button>
    <span style="font-size:12px;color:var(--ink-muted)">Click or tap grid cells to place waypoints</span>
  </div>
  <div style="text-align:center">
    <button class="continue-btn" id="s2-continue" disabled onclick="s2Continue()">Route Confirmed &rarr;</button>
  </div>
`;

const canvas = document.getElementById('map-canvas');
updateMapUI(canvas);

canvas.addEventListener('mousedown', handleMapClick);
canvas.addEventListener('touchstart', e => { e.preventDefault(); handleMapClick(e); }, { passive: false });

function mapCellSize(canvas) {
  const padL = 52, padT = 38;
  const cw = (canvas.width  - padL - 8) / 10;
  const ch = (canvas.height - padT - 8) / 10;
  return { cw, ch, padL, padT };
}

function colToX(canvas, col) {
  const { cw, padL } = mapCellSize(canvas);
  return padL + col * cw + cw / 2;
}

function rowToY(canvas, row) {
  const { ch, padT } = mapCellSize(canvas);
  return padT + row * ch + ch / 2;
}

function handleMapClick(e) {
  const canvas = document.getElementById('map-canvas');
  if (!canvas) return;
  const { x, y } = getCanvasXY(canvas, e);
  const { cw, ch, padL, padT } = mapCellSize(canvas);

  const col = Math.floor((x - padL) / cw);
  const row = Math.floor((y - padT) / ch);
  if (col < 0 || col > 9 || row < 0 || row > 9) return;

  for (const z of PATROL_ZONES) {
    if (col >= z.c1 && col <= z.c2 && row >= z.r1 && row <= z.r2) {
      const w = document.getElementById('route-warning');
      if (w) w.innerHTML = '<span class="feedback-err">&#x26A0; British patrol here! Choose a different path.</span>';
      return;
    }
  }

  const already = route.find(p => p.col === col && p.row === row);
  if (already) {
    route = route.filter(p => !(p.col === col && p.row === row));
    updateMapUI(canvas);
    return;
  }

  if (route.length >= 5) {
    const w = document.getElementById('route-warning');
    if (w) w.innerHTML = '<span class="feedback-err">Remove a point first (click on it).</span>';
    return;
  }

  const label = String.fromCharCode(65 + col) + (row + 1);
  route.push({ col, row, label });
  updateMapUI(canvas);
}

function updateMapUI(canvas) {
  drawMapGrid(canvas);

  const list = document.getElementById('coord-list');
  if (list) list.innerHTML = route.map(p => `<li>${p.label}</li>`).join('');

  const hasPhilly = route.some(p => p.col === 4 && p.row === 4);
  const hasYork   = route.some(p => p.col === 2 && p.row === 1);
  const w = document.getElementById('route-warning');
  routeValid = route.length === 5 && hasPhilly && hasYork;

  if (route.length === 5 && !routeValid) {
    if (w) w.innerHTML = '<span class="feedback-err">&#x26A0; Your route must include Philadelphia (E5) and Yorktown (C2).</span>';
  } else if (routeValid) {
    if (w) w.innerHTML = '<span class="feedback-ok">&#x2713; Great route! Philadelphia to Yorktown — mission ready.</span>';
  } else {
    if (w) w.innerHTML = '';
  }

  const btn = document.getElementById('s2-continue');
  if (btn) btn.disabled = !routeValid;
}

function clearRoute() {
  route = [];
  routeValid = false;
  const canvas = document.getElementById('map-canvas');
  if (canvas) updateMapUI(canvas);
}

function drawMapGrid(canvas) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const { cw, ch, padL, padT } = mapCellSize(canvas);

  ctx.fillStyle = '#d4c5a0';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(100,70,30,0.04)';
  for (let tx = 0; tx < W; tx += 6) for (let ty = 0; ty < H; ty += 6) {
    if (Math.sin(tx * 0.7) * Math.cos(ty * 0.9) > 0.6) ctx.fillRect(tx, ty, 2, 2);
  }

  for (const z of PATROL_ZONES) {
    const x1 = padL + z.c1 * cw, y1 = padT + z.r1 * ch;
    const x2 = padL + (z.c2 + 1) * cw, y2 = padT + (z.r2 + 1) * ch;
    ctx.fillStyle = 'rgba(220,38,38,0.18)';
    ctx.fillRect(x1, y1, x2 - x1, y2 - y1);
    ctx.strokeStyle = 'rgba(220,38,38,0.6)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(220,38,38,0.7)';
    ctx.font = 'bold 10px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('BRITISH PATROL', (x1 + x2) / 2, y1 + 14);
  }

  ctx.strokeStyle = 'rgba(80,50,20,0.25)';
  ctx.lineWidth = 1;
  for (let c = 0; c <= 10; c++) {
    const x = padL + c * cw;
    ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + 10 * ch); ctx.stroke();
  }
  for (let r = 0; r <= 10; r++) {
    const y = padT + r * ch;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + 10 * cw, y); ctx.stroke();
  }

  ctx.font = 'bold 12px "Space Grotesk", Arial';
  ctx.fillStyle = '#4a3020';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let c = 0; c < 10; c++) {
    ctx.fillText(String.fromCharCode(65 + c), padL + c * cw + cw / 2, padT - 16);
  }
  ctx.textAlign = 'right';
  for (let r = 0; r < 10; r++) {
    ctx.fillText(r + 1, padL - 6, padT + r * ch + ch / 2);
  }

  for (const lm of LANDMARKS) {
    const lx = colToX(canvas, lm.col), ly = rowToY(canvas, lm.row);
    ctx.beginPath();
    ctx.arc(lx, ly, 9, 0, Math.PI * 2);
    ctx.fillStyle = '#c4932f';
    ctx.fill();
    ctx.strokeStyle = '#2c1810';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.font = 'bold 9px Arial';
    ctx.fillStyle = '#2c1810';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(lm.name, lx, ly + 11);
  }

  if (route.length > 1) {
    ctx.beginPath();
    ctx.strokeStyle = '#2563eb';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([]);
    ctx.moveTo(colToX(canvas, route[0].col), rowToY(canvas, route[0].row));
    for (let i = 1; i < route.length; i++) {
      ctx.lineTo(colToX(canvas, route[i].col), rowToY(canvas, route[i].row));
    }
    ctx.stroke();
  }

  route.forEach((pt, idx) => {
    const px = colToX(canvas, pt.col), py = rowToY(canvas, pt.row);
    ctx.beginPath();
    ctx.arc(px, py, 10, 0, Math.PI * 2);
    ctx.fillStyle = '#2563eb';
    ctx.fill();
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.font = 'bold 11px "Space Grotesk", Arial';
    ctx.fillStyle = 'white';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(idx + 1, px, py);
  });
}

function s2Continue() {
  saveState({ route, routeValid });
  goToNextPage(STAGE);
}
</script>
</body>
</html>
