<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galileo Acceleration Lab Assessment</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #5d687c;
      --line: #d8e0ec;
      --panel: #ffffff;
      --soft: #f3f7fc;
      --accent: #2563a9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0 auto;
      max-width: 1180px;
      padding: 16px;
      font-family: Arial, sans-serif;
      color: var(--ink);
      line-height: 1.45;
      background: #fff;
    }

    h1 {
      margin: 0 0 12px;
      color: #1f3b57;
      font-size: 2rem;
      line-height: 1.15;
    }

    p {
      margin: 0;
    }

    .lab-card,
    .question-slot {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
    }

    .lab-card {
      padding: 14px;
      margin-bottom: 18px;
      background: var(--soft);
    }

    .lab-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 14px;
      margin-bottom: 12px;
    }

    .launch-link {
      display: inline-block;
      padding: 9px 13px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      white-space: nowrap;
    }

    .small {
      color: var(--muted);
      font-size: 0.92rem;
    }

    iframe {
      display: block;
      width: 100%;
      height: 980px;
      border: 1px solid #c8d3e1;
      border-radius: 10px;
      background: #fff;
    }

    .question-slot {
      padding: 14px;
      margin: 18px 0;
      border-left: 5px solid var(--accent);
    }
  </style>
</head>
<body>
  <h1>Galileo Acceleration Lab Assessment</h1>

  <div class="lab-card">
    <div class="lab-header">
      <a class="launch-link" href="https://galileo-drop-lab.netlify.app/" target="_blank" rel="noopener">Open Galileo Lab</a>
      <p class="small">Complete the data table in the lab, then answer the Buzz questions below.</p>
    </div>
    <iframe src="https://galileo-drop-lab.netlify.app/" title="Unit 1 Lesson 3 Galileo Acceleration Lab"></iframe>
  </div>

  <div class="question-slot"><a:question /></div>
  <div class="question-slot"><a:question /></div>
  <div class="question-slot"><a:question /></div>
  <div class="question-slot"><a:question /></div>
  <div class="question-slot"><a:question /></div>
  <div class="question-slot"><a:question /></div>
  <div class="question-slot"><a:question /></div>
</body>
</html>
