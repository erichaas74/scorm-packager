<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galileo Acceleration Lab Assessment</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #5d687c;
      --line: #d8e0ec;
      --panel: #ffffff;
      --soft: #f3f7fc;
      --accent: #2563a9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0 auto;
      max-width: 1180px;
      padding: 16px;
      font-family: Arial, sans-serif;
      color: var(--ink);
      line-height: 1.45;
      background: #fff;
    }

    h1 {
      margin: 0 0 12px;
      color: #1f3b57;
      font-size: 2rem;
      line-height: 1.15;
    }

    p {
      margin: 0;
    }

    .lab-card,
    .question-card {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
    }

    .lab-card {
      padding: 14px;
      margin-bottom: 18px;
      background: var(--soft);
    }

    .lab-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 14px;
      margin-bottom: 12px;
    }

    .launch-link {
      display: inline-block;
      padding: 9px 13px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      white-space: nowrap;
    }

    .small {
      color: var(--muted);
      font-size: 0.92rem;
    }

    iframe {
      display: block;
      width: 100%;
      height: 980px;
      border: 1px solid #c8d3e1;
      border-radius: 10px;
      background: #fff;
    }

    .question-card {
      padding: 14px;
      margin: 18px 0;
      border-left: 5px solid var(--accent);
    }

    .test-tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin: 18px 0;
      padding: 12px;
      border: 1px solid #f0c36b;
      border-radius: 10px;
      background: #fff8e6;
    }

    .test-tools button {
      border: 0;
      border-radius: 999px;
      background: #d97706;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
      padding: 9px 13px;
    }
  </style>
</head>
<body>
  <h1>Galileo Acceleration Lab Assessment</h1>

  <div class="lab-card">
    <div class="lab-header">
      <a class="launch-link" href="https://galileo-drop-lab.netlify.app/" target="_blank" rel="noopener">Open Galileo Lab</a>
      <p class="small">Complete the data table in the lab, then answer the Buzz questions below.</p>
    </div>
    <iframe src="https://galileo-drop-lab.netlify.app/" title="Unit 1 Lesson 3 Galileo Acceleration Lab"></iframe>
  </div>

  <div class="test-tools">
    <button type="button" id="buzz-autofill-button">Autofill Test Answers</button>
    <span class="small" id="buzz-autofill-status">Fills the six Buzz essay responses for quick testing.</span>
  </div>

  <div class="question-card">
    <a:question></a:question>
  </div>

  <div class="question-card">
    <a:question></a:question>
  </div>

  <div class="question-card">
    <a:question></a:question>
  </div>

  <div class="question-card">
    <a:question></a:question>
  </div>

  <div class="question-card">
    <a:question></a:question>
  </div>

  <div class="question-card">
    <a:question></a:question>
  </div>

  <div class="question-card">
    <a:question></a:question>
  </div>

  <script>
    (function () {
      'use strict';

      var testAnswers = [
        'The interval distance increases each time, so the object covers more distance during each equal time interval and its speed is increasing.',
        'The data shows acceleration because the object travels farther in each equal time interval, which means its velocity is changing as it falls.',
        'The interval ratios are close to the odd-number pattern 1, 3, 5, 7, and so on, which is evidence of constant acceleration.',
        'The total distance ratios are close to square numbers like 1, 4, 9, and 16, showing that falling distance grows with time squared.',
        'One source of error is reading or rounding the tape-measure values. That could make interval distances and ratios slightly too high or too low.',
        'Galileo’s water clocks and bells had limited precision and depended on human timing, while a digital simulation can repeat the same timed measurements more consistently.'
      ];

      function editableFields() {
        return Array.prototype.slice.call(document.querySelectorAll('textarea, input[type="text"], input:not([type]), [contenteditable="true"]')).filter(function (field) {
          return !field.closest('.lab-card') && !field.closest('.test-tools') && !field.disabled && !field.readOnly;
        });
      }

      function setFieldValue(field, value) {
        if (field.isContentEditable) field.textContent = value;
        else field.value = value;
        field.dispatchEvent(new Event('input', { bubbles: true }));
        field.dispatchEvent(new Event('change', { bubbles: true }));
      }

      function autofillBuzzAnswers() {
        var fields = editableFields();
        testAnswers.forEach(function (answer, index) {
          if (fields[index]) setFieldValue(fields[index], answer);
        });
        var status = document.getElementById('buzz-autofill-status');
        if (status) status.textContent = 'Filled ' + Math.min(fields.length, testAnswers.length) + ' Buzz essay responses.';
      }

      function isEditableTarget(target) {
        return target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable);
      }

      function installClipboardGuards() {
        document.addEventListener('copy', function (event) { event.preventDefault(); }, true);
        document.addEventListener('cut', function (event) { event.preventDefault(); }, true);
        document.addEventListener('paste', function (event) {
          if (isEditableTarget(event.target)) event.preventDefault();
        }, true);
        document.addEventListener('drop', function (event) {
          if (isEditableTarget(event.target)) event.preventDefault();
        }, true);
        document.addEventListener('beforeinput', function (event) {
          if (event.inputType === 'insertFromPaste' || event.inputType === 'insertFromDrop') event.preventDefault();
        }, true);
      }

      document.addEventListener('DOMContentLoaded', function () {
        var button = document.getElementById('buzz-autofill-button');
        if (button) button.addEventListener('click', autofillBuzzAnswers);
        installClipboardGuards();
      });
    }());
  </script>
</body>
</html>
